<!DOCTYPE html>
<html lang="es">
<head>
<script src="/js/hub-tenant.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jefe de Anuncios & Campañas de Paga — JefesHub</title>
<link rel="icon" type="image/png" href="/img/fav/jefe-anuncios.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Piel clara = mismos tokens que Jefe 366 y Jefe de Contenido */
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F3F3F3;
    --line:#E2E2E2;
    --text:#1A1A1A;
    --text-dim:#5F5F5F;
    --accent:#C0F800;
    --accent-soft:#F1FFC2;
    --accent-text:#4E7A00;
    --navy:#10103A;
    --shadow-card:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06);
    --shadow-pop:0 12px 32px rgba(0,0,0,.14);
    --adq:#6366F1;--adq-soft:#EEF0FF;
    --con:#0EA5E9;--con-soft:#E6F4FD;
    --conv:#16A34A;--conv-soft:#E6F8EC;
    --st-idea-bg:#EDEDED;--st-idea-fg:#555;
    --st-proceso-bg:#FFF1D6;--st-proceso-fg:#9A6200;
    --st-publicado-bg:#E3F6E8;--st-publicado-fg:#1F7A3A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;padding:28px 16px 80px;}
  h1,.display{font-family:'Sora',sans-serif;}
  .wrap{max-width:1400px;margin:0 auto;}
  .page-header{text-align:center;padding-top:62px;}
  h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin:0 0 8px;line-height:1.15;}
  /* Barra fija: se queda visible arriba al hacer scroll (pill + nombre del Jefe, mismo h1 de siempre) */
  .topbar{position:fixed;top:0;left:0;right:0;height:70px;z-index:60;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);}
  .topbar h1{justify-self:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
  .back-link{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;color:var(--text-dim);text-decoration:none;padding:7px 16px;border:1px solid var(--line);border-radius:100px;background:var(--surface);transition:.15s;}
  .back-link:hover{border-color:var(--accent);color:var(--accent-text);}
  /* Scrollbar delgada y discreta */
  *{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.22) transparent;}
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:8px;}
  *::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.36);}

  /* HERO: logo + frase en pastilla */
  /* Al abrir (sin pestaña elegida) el bloque logo + chat + botones queda centrado en la pantalla */
  .wrap.modo-inicio .page-header{padding-top:max(40px,11vh);}

  /* TABS en pastilla -- sticky: se quedan fijas arriba al deslizar */
  .tabs{display:flex;justify-content:center;align-items:flex-start;max-width:780px;margin:0 auto 22px;position:sticky;top:70px;z-index:40;background:var(--bg);padding:14px 8px 10px;}
  /* tres pasos acostados: círculo numerado, línea que los une y el nombre debajo */
  .tab{display:flex;flex-direction:column;align-items:center;gap:8px;flex:0 0 auto;min-width:150px;padding:0;background:none;border-radius:0;cursor:pointer;font-size:13px;font-weight:700;color:#8A8A92;text-align:center;user-select:none;font-family:'Sora',sans-serif;text-transform:uppercase;letter-spacing:.02em;transition:color .15s;}
  .tab:hover{background:none;color:#333;}
  .st-n{width:52px;height:52px;border-radius:50%;background:#F1F1F3;color:#8A8A92;display:flex;align-items:center;justify-content:center;font:800 20px 'Sora',sans-serif;transition:background .2s,box-shadow .2s,color .2s;}
  .tab:hover .st-n{background:#E6E6E8;}
  .tab.active{color:#1A1A1A;background:none;}
  .tab.active .st-n{background:var(--accent);color:#1A1A1A;box-shadow:0 0 0 7px rgba(192,248,0,.30);}
  .tab.hecho{color:#555;}
  .tab.hecho .st-n{background:#111;color:var(--accent);font-size:0;}
  .tab.hecho .st-n::after{content:'✓';font-size:22px;}
  .st-linea{flex:1 1 40px;min-width:30px;height:4px;border-radius:4px;background:#E6E6E8;margin-top:24px;}
  .st-linea.hecha{background:#111;}
  .tab .count{display:inline-block;margin-left:8px;background:rgba(0,0,0,.1);color:#1A1A1A;border-radius:12px;padding:1px 9px;font-size:13px;font-family:'Inter',sans-serif;font-weight:700;}

  /* PASTILLAS DE PRODUCTO */
  .prod-pills{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:0 0 22px;}
  .prod-pill{padding:12px 26px;border-radius:100px;border:none;font-family:'Sora',sans-serif;font-weight:800;font-size:15.5px;cursor:pointer;background:var(--navy);color:#fff;transition:.15s;max-width:100%;}
  .prod-pill:hover{filter:brightness(1.25);}
  .prod-pill.active{background:var(--accent);color:#1A1A1A;}

  /* BUTTONS / FIELDS (compartido con Jefe Contenido) */
  .btn{font-family:'Inter',sans-serif;font-weight:700;font-size:15px;padding:12px 20px;border-radius:12px;cursor:pointer;border:none;transition:.15s;}
  .btn-solid{background:var(--accent);color:#1A1A1A;}
  .btn-solid:hover{filter:brightness(.95);}
  .btn:disabled{opacity:.5;cursor:wait;}
  .btn-outline{font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;padding:10px 16px;border-radius:12px;cursor:pointer;border:1px solid #CFCFCF;background:var(--surface);color:#333;transition:.15s;}
  .btn-outline:hover{border-color:var(--accent-text);color:var(--accent-text);}
  .btn-outline:disabled{opacity:.4;cursor:wait;}
  .btn-guion{border:none;background:transparent;color:var(--accent-text);font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;padding:2px 0;text-decoration:none;}
  .btn-guion:hover{text-decoration:underline;}
  .mode-field{display:flex;flex-direction:column;gap:6px;}
  .mode-field label{font-size:11.5px;color:var(--text-dim);font-weight:500;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;}
  .mode-field select,.mode-field input[type=text],.mode-field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-family:'Inter',sans-serif;font-size:16px;padding:11px 14px;outline:none;}
  .mode-field select:focus,.mode-field input[type=text]:focus,.mode-field textarea:focus{border-color:var(--accent-text);background:#fff;}
  .mode-field input[type=text]::placeholder,.mode-field textarea::placeholder{color:var(--text-dim);opacity:.7;}
  .mode-status{font-size:13.5px;font-family:'Inter',sans-serif;color:var(--text-dim);}
  .mode-status.error{color:#C62828;}

  /* GENERADOR: toolbar + selección */
  .anuncios-toolbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow-card);}
  /* Siguiente paso: barra lima que solo aparece cuando hay ideas marcadas. */
  .anuncios-selection-bar{display:none;align-items:center;gap:16px;flex-wrap:wrap;background:var(--accent);border-radius:24px;padding:16px 26px;margin-bottom:20px;box-shadow:var(--shadow-card);color:#1A1A1A;}
  .anuncios-selection-bar.visible{display:flex;animation:selBarIn .25s ease-out;}
  @keyframes selBarIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .anuncios-selection-bar .mode-status{color:#1A1A1A;font-weight:700;font-size:16px;}
  .anuncios-selection-bar .mode-field label{color:#1A1A1A;}
  .anuncios-selection-bar select{background:#fff;}
  .anuncios-selection-bar #anuncios-detalle-btn{background:#4B4B4B;color:var(--accent);border:none;border-radius:100px;font-family:'Sora',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.02em;padding:12px 24px;}
  .anuncios-selection-bar #anuncios-detalle-btn:hover{filter:brightness(1.2);}

  /* VER ÁNGULOS (caja colapsable de solo lectura, mismos datos que en Jefe 366) */
  .mini-details{width:100%;margin-top:6px;border-top:1px solid var(--line);padding-top:14px;}
  .mini-details summary{cursor:pointer;font-family:'Inter',sans-serif;font-weight:700;font-size:14.5px;color:var(--accent-text);list-style:none;}
  .mini-details summary::-webkit-details-marker{display:none;}
  .mini-details summary::before{content:'▶ ';font-size:11px;}
  .mini-details[open] summary::before{content:'▼ ';}
  .mini-details .anuncios-table-wrap{margin-top:12px;}

  /* CAJAS POR ETAPA + TABLA EDITABLE */
  .etapa-box{--eb-acento:#8B9098;--eb-borde:#DADDE1;--eb-chip:#F0F1F3;--eb-on:#fff;--eb-texto:#5F656D;background:var(--surface);border:1.5px solid var(--line);border-left:9px solid var(--eb-acento);border-radius:28px;padding:26px 28px 22px 26px;margin-bottom:22px;}
  /* adquisición = cliente frío (gris) · consideración = tibio (verde de la marca) · conversión = caliente (lima de la marca) */
  .etapa-box.adquisicion{--eb-acento:#8B9098;--eb-borde:#DADDE1;--eb-chip:#F0F1F3;--eb-on:#fff;--eb-texto:#5F656D;}
  .etapa-box.consideracion{--eb-acento:#4E7A00;--eb-borde:#D3E6A0;--eb-chip:#EEF6D2;--eb-on:#fff;--eb-texto:#4E7A00;}
  .etapa-box.conversion{--eb-acento:#C0F800;--eb-borde:#DDF98A;--eb-chip:#F4FFC9;--eb-on:#1A1A1A;--eb-texto:#4E7A00;}
  .etapa-title{font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(21px,3.6vw,24px);line-height:1.2;color:var(--text);margin:0 0 8px;}
  .etapa-desc{color:var(--text-dim);font-size:14.5px;line-height:1.5;margin:0 0 14px;max-width:720px;}
  .etapa-chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 18px;}
  .etapa-chip{background:var(--eb-chip);color:var(--text);border-radius:100px;padding:7px 15px;font:700 12.5px 'Inter',sans-serif;}
  .etapa-chip:first-child{background:var(--eb-acento);color:var(--eb-on);}
  .idea-lista{display:flex;flex-direction:column;gap:12px;margin-bottom:12px;}
  .idea-card{display:flex;align-items:flex-start;gap:16px;background:#fff;border:1.5px solid var(--eb-borde);border-radius:22px;padding:16px 18px;transition:box-shadow .15s,border-color .15s;}
  .idea-card:hover{border-color:var(--eb-acento);}
  .idea-card.on{border-color:var(--eb-acento);box-shadow:0 0 0 4px var(--eb-chip);}
  .idea-check{-webkit-appearance:none;appearance:none;flex:0 0 34px;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--eb-acento);background:#fff;cursor:pointer;position:relative;margin:2px 0 0;}
  .idea-check:checked{background:var(--eb-acento);}
  .idea-check:checked::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--eb-on);font:800 19px/1 'Inter',sans-serif;}
  .idea-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .idea-f{display:block;width:100%;box-sizing:border-box;border:1.5px solid transparent;background:transparent;resize:none;outline:none;overflow:hidden;padding:3px 8px;margin:0 -8px;border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;}
  .idea-f:hover{border-color:var(--eb-borde);}
  .idea-f:focus{border-color:var(--eb-acento);background:#fff;}
  .idea-f.t{font:600 12px/1.4 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--eb-texto);}
  .idea-f.h{font:700 18px/1.3 'Sora',sans-serif;}
  .idea-f.p{font:400 14.5px/1.5 'Inter',sans-serif;color:var(--text-dim);}
  .idea-card .anuncios-row-del{flex:0 0 auto;font-size:16px;margin-top:2px;}
  /* el "+" va al final de la fila de pastillas y agrega una idea */
  .etapa-chips .anuncios-row-add{flex:0 0 auto;width:36px;height:36px;padding:0;border:2px dashed var(--eb-texto);color:var(--eb-texto);background:#fff;border-radius:50%;font:700 22px/1 'Inter',sans-serif;display:inline-flex;align-items:center;justify-content:center;}
  .etapa-chips .anuncios-row-add:hover{background:var(--eb-chip);}
  @media (max-width:600px){
    .etapa-box{padding:20px 16px 18px 16px;border-radius:24px;border-left-width:7px;}
    .idea-card{padding:14px 12px;gap:12px;border-radius:20px;}
    .idea-check{flex-basis:30px;width:30px;height:30px;}
  }
  /* los 4 controles del Generador: mismo alto y casi el mismo ancho */
  .alc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start;width:100%;}
  .alc-grid .mode-field label{padding-left:8px;}
  /* lima = aún no has elegido (queda lo de por defecto) · blanco = ya elegiste */
  .alc-pill:not(.on){background:#fff;border:1.5px solid #D5D5D5;}
  .alc-pill:not(.on):hover{border-color:#1A1A1A;}
  .alc-grid .mode-field{min-width:0;}
  .alc-pill{width:100%;height:54px;box-sizing:border-box;justify-content:space-between;font-size:15px;padding:0 20px;}
  .alc-pill .foco-txt{flex:1;max-width:none;text-align:left;}
  .alc-gen{width:100%;height:54px;box-sizing:border-box;border:none;border-radius:100px;background:#1A1A1A;color:#C0F800;font:800 15px 'Sora',sans-serif;cursor:pointer;transition:filter .15s,transform .15s;}
  .alc-gen:hover{filter:brightness(1.25);transform:translateY(-1px);}
  .alc-gen:disabled{opacity:.6;cursor:wait;transform:none;}
  @media (max-width:900px){.alc-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media (max-width:520px){.alc-grid{grid-template-columns:1fr;}}
  .etapa-box{scroll-margin-top:140px;}
  /* ventanitas didácticas de ángulo y cuántas por etapa: tarjetas que se eligen */
  .alc-pop{position:fixed;z-index:2200;background:#fff;border:1px solid #E2E2E2;border-radius:22px;box-shadow:0 18px 44px rgba(0,0,0,.18);padding:14px;overflow:auto;}
  .alc-pop-h{padding:4px 6px 12px;}
  .alc-pop-h b{display:block;font:800 20px 'Sora',sans-serif;margin-bottom:4px;}
  .alc-pop-h span{display:block;font-size:14px;line-height:1.5;color:var(--text-dim);}
  .alc-pop-h2{padding:16px 6px 8px;font:800 20px 'Sora',sans-serif;}
  .alc-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:2px;}
  .alc-cards.chicas{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
  .alc-card{position:relative;display:flex;flex-direction:column;text-align:left;background:#fff;border:2px solid #E5E7EB;border-radius:22px;padding:16px 16px 14px;cursor:pointer;font-family:'Inter',sans-serif;color:var(--text);transition:border-color .15s,box-shadow .15s,background .15s;}
  .alc-card:hover{border-color:#B9B9B9;}
  .alc-card:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  .alc-card.on{background:#F4FAD9;border-color:#1A1A1A;box-shadow:0 6px 18px rgba(0,0,0,.12);}
  .alc-card.estatica{cursor:default;}
  .alc-card.estatica:hover{border-color:#E5E7EB;}
  .alc-chk{position:absolute;top:12px;left:12px;width:28px;height:28px;border-radius:50%;background:#1A1A1A;color:#C0F800;display:none;align-items:center;justify-content:center;font:800 15px/1 'Inter',sans-serif;}
  .alc-card.on .alc-chk{display:flex;}
  .alc-ilu{display:flex;align-items:center;justify-content:center;min-height:84px;margin:8px 0 10px;font-size:40px;}
  .alc-t{font:800 17px/1.25 'Sora',sans-serif;}
  .alc-t small{display:block;font:600 12px 'Inter',sans-serif;color:var(--text-dim);margin-top:2px;}
  .alc-d{font-size:13.5px;line-height:1.45;color:var(--text-dim);margin-top:5px;}
  .alc-como{position:absolute;top:10px;right:10px;background:#fff;border:1px solid #ECECEC;border-radius:100px;padding:5px 12px;font:700 12.5px 'Inter',sans-serif;color:var(--text);box-shadow:0 1px 5px rgba(0,0,0,.08);cursor:pointer;}
  .alc-como:hover{border-color:#B9B9B9;}
  .alc-x{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed #D5D8DC;font-size:13px;line-height:1.5;color:#333;}
  .alc-x i{font-style:normal;font-weight:700;color:var(--accent-text);}
  .alc-x em{display:block;margin-top:4px;color:var(--text-dim);}
  .alc-card.abierto .alc-x{display:block;}
  .alc-rec{display:inline-block;font:800 11px 'Inter',sans-serif;background:var(--accent);color:#1A1A1A;border-radius:100px;padding:2px 8px;margin-left:6px;vertical-align:middle;}
  /* mini ilustración de cuántas ideas: una columna por etapa (gris frío · verde tibio · lima caliente) */
  .alc-mini{display:flex;gap:12px;background:#F3F3F3;border:2px solid #E2E2E2;border-radius:14px;padding:12px 16px;}
  .alc-mini .col{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;}
  .alc-mini i{display:block;width:16px;height:16px;border-radius:50%;border:2px solid #1A1A1A;background:#8B9098;}
  .alc-mini .con i{background:#4E7A00;} .alc-mini .conv i{background:#C0F800;}
  .alc-vacio{padding:12px;font-size:13.5px;color:var(--text-dim);}
  /* el viaje del cliente: un cliente va pasando de una etapa a otra */
  .alc-viaje{padding:0 2px;}
  .alc-pista{position:relative;height:50px;margin:0 0 4px;}
  .alc-pista::before{content:'';position:absolute;left:16.67%;right:16.67%;top:34px;border-top:3px dashed #CFCFCF;}
  .alc-nodo{position:absolute;top:28px;width:15px;height:15px;border-radius:50%;border:2px solid #1A1A1A;transform:translateX(-50%);}
  .alc-nodo.n1{left:16.67%;background:#8B9098;} .alc-nodo.n2{left:50%;background:#4E7A00;} .alc-nodo.n3{left:83.33%;background:#C0F800;}
  .alc-cliente{position:absolute;left:16.67%;top:0;font-size:28px;line-height:1;transform:translateX(-50%);animation:alcViaje 9s ease-in-out infinite;}
  @keyframes alcViaje{0%{left:16.67%;opacity:0}4%{left:16.67%;opacity:1}24%{left:16.67%}34%{left:50%}58%{left:50%}68%{left:83.33%}92%{left:83.33%;opacity:1}97%{left:83.33%;opacity:0}100%{left:16.67%;opacity:0}}
  .alc-cards.etapas3{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  .alc-card.et{padding:14px 14px 12px;}
  .alc-et-top{display:flex;align-items:center;gap:10px;}
  .alc-et-em{font-size:30px;line-height:1;}
  .alc-card.et .alc-t{font-size:16px;}
  .alc-card.et .alc-d{margin-top:8px;}
  .alc-card.et{animation:alcActiva 9s ease-in-out infinite;}
  .alc-card.et.e2{animation-delay:3s;} .alc-card.et.e3{animation-delay:6s;}
  @keyframes alcActiva{0%{border-color:#1A1A1A;transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.16);background:#F4FAD9}28%{border-color:#1A1A1A;transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.16);background:#F4FAD9}34%,100%{border-color:#E5E7EB;transform:none;box-shadow:none;background:#fff}}
  .alc-ilu.chico{min-height:58px;margin:6px 0 8px;}
  @media (max-width:560px){.alc-cards.etapas3{grid-template-columns:1fr;}.alc-pista{display:none;}}
  @media (prefers-reduced-motion:reduce){.alc-cliente,.alc-card.et{animation:none;}}
  /* ángulos: una fila que se desliza a la derecha */
  .alc-carrusel{position:relative;}
  .alc-cards.fila{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:4px 2px 12px;scrollbar-width:thin;align-items:flex-start;}
  .alc-cards.fila .alc-card{flex:0 0 min(250px,78%);scroll-snap-align:start;}
  .alc-flecha{position:absolute;top:96px;z-index:3;width:42px;height:42px;border-radius:50%;border:1.5px solid #1A1A1A;background:#fff;color:#1A1A1A;font:800 20px/1 'Inter',sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;}
  .alc-flecha:hover{background:var(--accent);}
  .alc-flecha[hidden]{display:none;}

  .anuncios-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;}

  /* CARDS (calcado de item-card de Jefe Contenido) */

  .estado-seccion{margin-bottom:28px;}

  /* título de cada grupo: encabezado grande y limpio (como "Próximos posts" de Jefe de Contenido), sin barra gris */

  .pcard:hover,.pcard:focus-visible{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.12);}
  .pthumb{position:relative;height:104px;background:linear-gradient(135deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;}

  .phora{font-size:12.5px;color:var(--text-dim);font-weight:600;}

  .empty-row{padding:22px;text-align:center;color:var(--text-dim);font-size:15.5px;background:var(--surface);border:1px dashed #C9C9C9;border-radius:16px;}

  select.estado-select{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;padding:7px 14px;border-radius:100px;border:1px solid transparent;cursor:pointer;}

  select.estado-select.proceso{background:var(--st-proceso-bg);color:var(--st-proceso-fg);}
  select.estado-select.publicado{background:var(--st-publicado-bg);color:var(--st-publicado-fg);}
  .fecha-input{width:140px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:6px 10px;outline:none;color-scheme:light;}
  .fecha-input:focus{border-color:var(--accent-text);}
  textarea.gancho-input{width:100%;border:none;background:transparent;color:var(--text);font-family:'Sora',sans-serif;font-size:19px;font-weight:800;line-height:1.35;resize:none;padding:0;outline:none;min-height:28px;}
  .badges-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-family:'Inter',sans-serif;font-weight:700;padding:4px 11px;border-radius:100px;border:1px solid transparent;}
  .badge-adquisicion{background:var(--adq-soft);color:#4338CA;border-color:#D5D8FB;}
  .badge-consideracion{background:var(--con-soft);color:#0369A1;border-color:#C2E4F7;}
  .badge-conversion{background:var(--conv-soft);color:#15803D;border-color:#C3EBD0;}
  .badge-tipo{background:var(--surface-2);color:var(--text-dim);border-color:var(--line);}
  .item-details{border-top:1px solid var(--line);padding-top:10px;}

  .item-details summary::-webkit-details-marker{display:none;}
  .detail-grid{display:flex;flex-direction:column;gap:14px;margin-top:12px;}
  .detail-field{display:flex;flex-direction:column;gap:2px;}
  .detail-field-head{display:flex;align-items:center;justify-content:space-between;}
  .detail-field label{display:block;font-size:14px;color:var(--text-dim);font-weight:600;font-family:'Inter',sans-serif;margin-bottom:5px;}
  .detail-field textarea,.detail-field input[type=text],.detail-field select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-family:'Inter',sans-serif;font-size:15.5px;padding:10px 12px;resize:vertical;outline:none;line-height:1.5;}
  .detail-field textarea:focus,.detail-field input[type=text]:focus,.detail-field select:focus{border-color:var(--accent-text);background:#fff;}
  .detail-field input[type=text]::placeholder,.detail-field textarea::placeholder{color:var(--text-dim);opacity:.7;}
  .meta-fields-box{background:#FAFAFA;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .meta-fields-title{margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:var(--text);}
  .meta-fields-box .detail-field textarea,.meta-fields-box .detail-field input[type=text],.meta-fields-box .detail-field select{background:#fff;}
  .meta-fields-box[hidden]{display:none;}
  .meta-wrap{display:flex;flex-direction:column;gap:12px;align-items:flex-start;}
  .meta-wrap .meta-fields-box{width:100%;box-sizing:border-box;}
  .pm-meta-btn{display:inline-flex;align-items:center;gap:8px;}
  .pm-meta-btn svg{width:20px;height:20px;}
  .pm-meta-car{font-size:11px;opacity:.7;transition:transform .15s;}
  .pm-meta-btn.on .pm-meta-car{transform:rotate(180deg);}
  .pm-meta-falta{font-style:normal;color:#E8590C;font-size:12px;}
  /* copiar: ícono al final de cada cuadro */
  .campo-copiar{position:relative;}
  .campo-copiar input[type=text],.campo-copiar select{padding-right:50px !important;}
  .campo-copiar.sel select{padding-right:76px !important;}
  .copy-ic{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:none;background:transparent;border-radius:10px;cursor:pointer;color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:15px;padding:0;}
  .copy-ic svg{width:18px;height:18px;}
  .copy-ic:hover{background:var(--accent-soft);color:var(--accent-text);}

  .retro-field label{color:var(--accent-text);}
  .link-field .link-input{color:#1F5FA8;border-color:#BBD7F2;}

  .carpeta-box label{font-size:14px;color:#1F5FA8;font-weight:700;font-family:'Inter',sans-serif;}
  .carpeta-box input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:#1F5FA8;font-family:'Inter',sans-serif;font-size:15.5px;padding:11px 14px;outline:none;}
  .carpeta-box input[type=text]:focus{border-color:#1F5FA8;background:#fff;}
  .carpeta-box input[type=text]::placeholder{color:var(--text-dim);opacity:.7;}
  .carpeta-box-collapsed{cursor:pointer;padding:12px 20px;}
  .carpeta-box-collapsed .carpeta-collapsed-hint{font-size:13px;color:var(--text-dim);opacity:.8;}
  .carpeta-box-collapsed:hover{border-color:#1F5FA8;}

  /* CHAT EN GLOBITO: círculo abajo a la derecha; abre un panel pequeño */
  .chat-fab{position:fixed;right:20px;bottom:20px;z-index:2000;width:64px;height:64px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:#1A1A1A;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(0,0,0,.22);transition:transform .15s;}
  .chat-fab:hover{transform:scale(1.07);}
  .chat-fab svg{width:28px;height:28px;}
  .chat-fab img.ic-chat{width:44px;height:44px;object-fit:contain;display:block;}
  .chat-fab .ic-x{display:none;}
  .chat-flot.abierto .chat-fab .ic-chat{display:none;}
  .chat-flot.abierto .chat-fab .ic-x{display:block;}
  .chat-panel{position:fixed;right:20px;bottom:92px;z-index:2000;width:min(400px,calc(100vw - 24px));max-height:min(640px,calc(100vh - 120px));display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.22);padding:16px;}
  .chat-panel[hidden]{display:none;}
  .chat-panel-head{display:flex;align-items:center;gap:12px;}
  .chat-panel-ic{flex:0 0 44px;height:44px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;}
  .chat-panel-ic img{width:28px;height:28px;object-fit:contain;}
  .chat-panel-t{flex:1;min-width:0;}
  .chat-panel-t b{display:block;font:800 16px 'Sora',sans-serif;}
  .chat-panel-t span{display:block;font-size:12.5px;color:var(--text-dim);line-height:1.35;}
  .chat-panel-btn{flex:0 0 34px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;color:var(--text);font-size:15px;}
  .chat-panel-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
  .chat-panel .chat-thread{flex:1 1 auto;min-height:0;max-height:none;overflow-y:auto;margin:0;}
  .chat-panel .chat-adjunto-row{margin:0;justify-content:flex-start;}
  .chat-panel .chat-adjunto-hint{font-size:12.5px;}
  .chat-panel .mode-status:empty{display:none;}
  .chat-pill-wrap{position:relative;}
  .chat-pill{display:flex;align-items:flex-end;gap:6px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:26px;padding:6px 6px 6px 14px;}
  .chat-pill:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(192,248,0,.28);}
  .chat-pill textarea{flex:1;min-width:0;border:none;outline:none;background:transparent;resize:none;font:500 15px/1.4 'Inter',sans-serif;max-height:120px;padding:8px 2px;color:var(--text);}
  .chat-ib{flex:0 0 38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text-dim);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .chat-ib:hover{color:var(--accent-text);border-color:var(--accent);background:var(--accent-soft);}
  .chat-ib.grab{background:#FEE2E2;color:#B42318;border-color:#F04438;}
  .chat-send{flex:0 0 auto;border:none;background:var(--accent);color:#1A1A1A;font:800 14px 'Sora',sans-serif;padding:0 16px;height:38px;border-radius:100px;cursor:pointer;}
  .chat-send:disabled{opacity:.5;cursor:wait;}
  .chat-panel .ac-lista{top:auto;bottom:calc(100% + 6px);left:0;right:0;max-height:240px;overflow-y:auto;}
  .wrap{padding-bottom:96px;}
  @media (max-width:600px){.chat-fab{right:12px;bottom:12px;width:58px;height:58px;}.chat-fab img.ic-chat{width:40px;height:40px;}.chat-panel{right:12px;bottom:80px;padding:12px;}}

  /* TUTORIAL (3 fases) */
  .jefe-logo[data-tutorial]{cursor:pointer;border-radius:16px;transition:transform .15s;}
  .jefe-logo[data-tutorial]:hover{transform:scale(1.04);}
  .jefe-logo[data-tutorial]:focus-visible{outline:3px solid var(--accent);outline-offset:4px;}
  .tt-ov{position:fixed;inset:0;z-index:99990;}

  .tt-hl{position:fixed;z-index:99991;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.62),0 0 0 3px #C0F800;pointer-events:none;transition:top .25s,left .25s,width .25s,height .25s;}
  .tt-card{position:fixed;z-index:99992;width:min(400px,calc(100vw - 24px));max-height:calc(100vh - 20px);overflow-y:auto;background:#fff;color:#1A1A1A;border-radius:20px;padding:18px 20px;box-shadow:0 24px 60px rgba(0,0,0,.35);font:400 15px/1.5 'Inter',sans-serif;}

  .tt-prog{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}

  .tt-fase i{font-style:normal;width:20px;height:20px;border-radius:50%;background:#D8D8DE;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;}
  .tt-fase.on{background:#1A1A1A;color:#fff;} .tt-fase.on i{background:#C0F800;color:#1A1A1A;}
  .tt-fase.ok i{background:#4E7A00;}
  .tt-fase:not(.on) span{display:none;}
  .tt-row{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .tt-sp{flex:1;}
  .tt-btn{border:none;border-radius:100px;padding:10px 18px;font:800 14px 'Sora',sans-serif;cursor:pointer;background:#C0F800;color:#1A1A1A;}
  .tt-btn.sec{background:transparent;border:1px solid #ccc;color:#444;font-weight:600;}
  .tt-btn:disabled{opacity:.35;cursor:default;}
  .tt-skip{background:none;border:none;color:#666;font:600 13px 'Inter',sans-serif;text-decoration:underline;cursor:pointer;padding:8px 2px;}
  .tt-etapas{display:flex;align-items:stretch;gap:4px;margin:2px 0 12px;}
  .tt-et{flex:1;border-radius:14px;padding:10px 6px;text-align:center;}
  .tt-et span{display:block;font-size:26px;} .tt-et b{display:block;font:800 13.5px 'Sora',sans-serif;margin-top:2px;} .tt-et small{display:block;font-size:11.5px;color:#555;margin-top:2px;line-height:1.3;}
  .tt-et.adq{background:var(--adq-soft);} .tt-et.con{background:var(--con-soft);} .tt-et.conv{background:var(--conv-soft);}
  .tt-fl{align-self:center;font-size:18px;color:#8A8A92;}
  .tt-cant{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 12px;}
  .tt-cant>div{border:1.5px solid #E5E7EB;border-radius:14px;padding:10px;text-align:center;font-size:13px;}
  .tt-cant>div.rec{border-color:#C0F800;background:#F7FFD9;}
  .tt-cant .em{font-size:22px;letter-spacing:2px;display:block;margin:4px 0;} .tt-cant b{font:800 14px 'Sora',sans-serif;}
  .tt-arbol{display:flex;flex-direction:column;gap:6px;margin:2px 0 12px;}
  .tt-arbol>div{border-radius:12px;padding:9px 12px;background:#F4F6FA;font-size:13.5px;}
  .tt-arbol>div b{font:800 14px 'Sora',sans-serif;} .tt-arbol>div small{display:block;color:#555;}
  .tt-arbol>div:nth-child(2){margin-left:18px;} .tt-arbol>div:nth-child(3){margin-left:36px;}
  .tt-video{border:1.5px dashed #C9C9D2;border-radius:12px;padding:10px 12px;font-size:13px;color:#555;background:#FAFAFC;margin-bottom:10px;}
  .tt-video a{color:#2B6CB0;font-weight:700;}
  @media (max-width:600px){.tt-card{padding:14px 16px;}}

  /* CONSULTA CON EL JEFE (estilos antiguos de la pastilla grande; ya no se usan en el globito) */
  .chat-hero{display:flex;flex-direction:column;align-items:stretch;margin:0 auto 24px;max-width:900px;}

  .ac-lista{position:absolute;left:12px;right:12px;top:calc(100% + 4px);z-index:60;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 40px rgba(0,0,0,.16);padding:8px;max-height:min(60vh,420px);overflow-y:auto;}

  .ac-item:hover,.ac-item.on{background:var(--surface-2);}

  .hero-search textarea{flex:1 1 auto;min-width:0;background:transparent;border:none;outline:none;resize:none;color:var(--text);font-family:'Inter',sans-serif;font-size:17.5px;line-height:1.45;padding:11px 0;max-height:260px;}

  .hero-search-send{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#1A1A1A;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;}

  .link-btn{background:none;border:none;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:underline;padding:2px 4px;}

  .chat-adjunto-preview{display:none;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:100px;padding:5px 12px 5px 6px;font-size:14px;color:var(--text-dim);}
  .chat-adjunto-preview img{width:34px;height:34px;object-fit:cover;border-radius:50%;}
  .chat-adjunto-preview button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;}

  .chat-msg-imagen-tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text-dim);margin-bottom:4px;}

  /* CHAT -- hilo de conversación */
  .chat-thread{display:flex;flex-direction:column;gap:12px;max-height:520px;overflow-y:auto;margin-top:6px;}
  .chat-thread:empty{display:none;}
  .chat-msg{border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.65;white-space:pre-wrap;font-family:'Inter',sans-serif;max-width:92%;}

  .chat-msg-assistant{background:var(--surface-2);border:1px solid var(--line);color:var(--text);align-self:flex-start;}

  /* ESTRUCTURA DE ADS: Campaña > Conjunto de Anuncios > (nota + link a Anuncios) */
  .campana-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:20px;padding:22px 24px;margin-bottom:18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-card);}

  /* CAMPAÑA GUARDADA: panel lima con el resumen */

  .campana-resumen.nueva .res-btn-white{background:var(--accent);color:#1A1A1A;}
  /* pasos de la campaña: 1 presupuesto · 2 público · 3 anuncios */

  .paso-t{display:flex;align-items:center;gap:10px;font:800 18px 'Sora',sans-serif;}

  /* Estructura de Ads: lista fija de campañas a la izquierda, la abierta a la derecha */
  .est-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start;}
  .est-lista{position:sticky;top:150px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 170px);overflow-y:auto;padding:2px;}
  .est-nueva{width:100%;}
  .est-item{display:flex;flex-direction:column;gap:3px;text-align:left;background:#fff;border:1.5px solid var(--line);border-left:6px solid #D5D5D5;border-radius:16px;padding:12px 14px;cursor:pointer;font-family:'Inter',sans-serif;color:var(--text);transition:border-color .15s,background .15s,box-shadow .15s;}
  .est-item.guardada{border-left-color:var(--accent);}
  .est-item:hover{border-color:#1A1A1A;}

  .est-item-t{font:800 15px 'Sora',sans-serif;}
  .est-item-p{font-size:12px;font-weight:700;color:var(--accent-text);}
  .est-item-s{font-size:13px;color:var(--text-dim);line-height:1.35;}

    .est-item{flex:0 0 220px;}
    .est-nueva{width:auto;flex:0 0 auto;}
  }
  .res-colapsar{border:none;cursor:pointer;text-align:left;}

  .pm-ver-campana{display:flex;align-items:center;gap:8px;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 18px;cursor:pointer;font:800 15.5px Sora,sans-serif;text-align:left;color:var(--text);}

  .ay-op{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;font-size:15px;}

  .ay-op input{margin-top:4px;accent-color:#4E7A00;}

  .pb-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:2200;background:#10101A;color:#fff;border-radius:16px;padding:14px 20px;max-width:min(560px,92vw);box-shadow:0 14px 40px rgba(0,0,0,.35);font-size:15px;line-height:1.45;}

  @media (max-width:900px){.res-mapa{grid-template-columns:1fr;}}
  /* título fijo de cada campaña: encabezado grande y limpio (como "Próximos posts →"), no una pastilla */
  .res-pill-white{background:none;color:#1A1A1A;font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1.15;letter-spacing:-.01em;text-transform:none;padding:0;border-radius:0;}
  .res-btn{border:none;background:#4B4B4B;color:var(--accent);font-family:'Sora',sans-serif;font-weight:800;font-size:14.5px;text-transform:uppercase;letter-spacing:.02em;padding:10px 20px;border-radius:100px;cursor:pointer;transition:.15s;}
  .res-btn:hover{filter:brightness(1.2);}
  .res-btn-white{background:#fff;color:#1A1A1A;}
  .res-info{display:flex;flex-direction:column;gap:16px;}
  .res-fecha{font-family:'Sora',sans-serif;font-weight:800;font-size:17px;text-transform:uppercase;}
  .res-fecha span{font-family:'Inter',sans-serif;font-weight:600;text-transform:none;}
  .res-pills{display:flex;flex-wrap:wrap;gap:12px;}

  .res-fecha{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .res-fecha-input{background:#fff;border:none;border-radius:100px;color:#1A1A1A;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;padding:8px 16px;outline:none;color-scheme:light;}
  .res-pane{display:none;background:#fff;border-radius:20px;padding:18px 20px;color:var(--text);flex-direction:column;gap:14px;}
  .res-pane.abierto{display:flex;}
  /* mismo estilo que los botones del Generador: lima = aún sin definir · blanco = ya definido */
  .res-pill-dark{border:1.5px solid #D5D5D5;cursor:pointer;text-align:left;transition:background .15s,border-color .15s;background:#fff;color:#1A1A1A;font-family:'Inter',sans-serif;font-weight:700;font-size:15px;text-transform:none;letter-spacing:0;padding:11px 20px;border-radius:100px;}

  .res-dato{display:flex;flex-direction:column;margin-bottom:8px;}
  .res-dato span{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#3C5E00;}
  .res-conjunto{padding-bottom:6px;margin-bottom:10px;border-bottom:1px dashed rgba(0,0,0,.2);}

  .anuncios-nota-box{background:var(--accent-soft);border:1px dashed #A8CC3A;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}

  [data-tip]{position:relative;}
  [data-tip]::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 10px);transform:translate(-50%,-4px);background:#1A1A1A;color:#fff;font:600 13px/1.35 'Inter',sans-serif;padding:7px 11px;border-radius:9px;white-space:nowrap;max-width:260px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:40;}
  [data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0);}
  .cx-icons{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:62px;}

async function cargarEstiloRef(){

}
function reducirImagenDataUrl(file, maxLado, calidad){
  return new Promise((resolve, reject)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const c = dibujarEnCanvasRedimensionado(img.naturalWidth, img.naturalHeight, maxLado);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', calidad));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen.')); };
    img.src = url;
  });
}
function abrirEstiloRef(){
  document.querySelectorAll('.ay-overlay').forEach(x=>x.remove());
  let imgs = estiloRef.imgs.slice();
  let guia = estiloRef.guia;
  const ov = document.createElement('div');
  ov.className = 'ay-overlay';
  ov.innerHTML = `<div class="ay-box es-box" role="dialog" aria-modal="true">

    <h3>🎨 Mi estilo visual</h3>
    <p class="ay-nota">Sube de <b>3 a 10 imágenes</b> de diseños que te encantan (anuncios, posts, referencias). El Jefe las analiza una vez, guarda tu estilo y, cuando le pidas un prompt de imagen o de video, se basa en él para que no salga genérico. Puedes pegarlas con Ctrl+V.</p>
    <div class="es-grid" id="es-grid"></div>

    <div class="es-guia" id="es-guia-box" hidden>

      <textarea id="es-guia" rows="11"></textarea>
      <div class="ay-btns"><button type="button" class="btn btn-outline" data-es-borrar>Borrar mi estilo</button><button type="button" class="btn btn-solid" data-es-guardar>Guardar mi estilo</button></div>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const q = s=>ov.querySelector(s);
  const status = txt=>{ q('#es-status').textContent = txt||''; };
  const cerrar = ()=>{ ov.remove(); document.removeEventListener('keydown', tecla); document.removeEventListener('paste', pegar); };
  const tecla = e=>{ if(e.key==='Escape') cerrar(); };
  function pintar(){
    q('#es-grid').innerHTML = imgs.map((d,i)=>`<div class="es-th"><img src="${d}" alt=""><button type="button" data-es-del="${i}" aria-label="Quitar">✕</button></div>`).join('')
      + (imgs.length<10 ? `<label class="es-add">＋<span>Agregar</span><input type="file" accept="image/*" multiple hidden></label>` : '');
    q('#es-cont').textContent = imgs.length + ' de 10 imágenes' + (imgs.length<3 ? ' · faltan '+(3-imgs.length)+' como mínimo' : '');
    q('[data-es-analizar]').disabled = imgs.length < 3;
    const gb = q('#es-guia-box'); gb.hidden = !guia; q('#es-guia').value = guia || '';
    q('[data-es-del]') && q('#es-grid').querySelectorAll('[data-es-del]').forEach(b=>b.addEventListener('click',()=>{ imgs.splice(+b.dataset.esDel,1); pintar(); }));
    const inp = q('.es-add input'); if(inp) inp.addEventListener('change', async e=>{ await agregar([...e.target.files]); e.target.value=''; });
  }
  async function agregar(files){
    const validas = files.filter(f=>f.type.startsWith('image/')).slice(0, 10-imgs.length);
    if(!validas.length) return;
    status('⏳ Preparando imágenes…');
    for(const f of validas){ try{ imgs.push(await reducirImagenDataUrl(f, 768, 0.7)); }catch(e){} }
    status(''); pintar();
  }
  const pegar = e=>{ const fs = [...((e.clipboardData&&e.clipboardData.files)||[])].filter(f=>f.type.startsWith('image/')); if(fs.length){ e.preventDefault(); agregar(fs); } };
  document.addEventListener('keydown', tecla); document.addEventListener('paste', pegar);
  ov.addEventListener('mousedown', e=>{ if(e.target===ov) cerrar(); });
  q('.ay-x').addEventListener('click', cerrar);
  q('[data-es-analizar]').addEventListener('click', async ()=>{
    if(imgs.length<3) return;
    const btn = q('[data-es-analizar]'); btn.disabled = true; status('⏳ Analizando tu estilo… puede tardar unos segundos.');
    try{
      const res = await fetch('/api/generar-anuncios', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ modo:'estilo', cliente:CLIENTE_ID, imagenes: imgs.map(d=>({ mediaType:'image/jpeg', data:d.split(',')[1] })) }) });
      const data = await res.json().catch(()=>({}));
      if(!res.ok){ status(res.status===402 ? (data.error||'Llegaste al tope de uso de IA.') : '⚠️ '+(data.error||'No se pudo analizar el estilo.')); btn.disabled = false; return; }
      guia = data.guia || ''; status('✅ Listo. Revisa tu estilo abajo y guárdalo.'); pintar();
    }catch(e){ status('⚠️ Error de conexión. Intenta de nuevo.'); btn.disabled = false; }
  });
  q('[data-es-guardar]').addEventListener('click', async ()=>{
    guia = q('#es-guia').value.trim();
    if(!guia){ status('⚠️ La guía está vacía.'); return; }
    estiloRef = { guia, fecha:new Date().toISOString().slice(0,10), imgs: imgs.slice() };
    try{
      await window.storage.set(ESTILO_KEY, JSON.stringify({ guia, fecha: estiloRef.fecha, n: imgs.length }));
      await window.storage.set(ESTILO_IMGS_KEY, JSON.stringify(imgs));
    }catch(e){ status('⚠️ No se pudo guardar. Intenta de nuevo.'); return; }
    setUsarEstilo(true); cerrar();
    if(postModalEl && postModalId){ const it = cards.find(c=>c.id===postModalId); if(it) pintarPiezas(it); }
    mostrarToast('✅ Guardé tu estilo visual. Los prompts de imagen y video se harán con él.');
  });
  q('[data-es-borrar]').addEventListener('click', async ()=>{
    if(!confirm('¿Borrar tu estilo visual y sus imágenes?')) return;
    estiloRef = { guia:'', fecha:'', imgs:[] };
    try{ await window.storage.set(ESTILO_KEY, JSON.stringify({})); await window.storage.set(ESTILO_IMGS_KEY, JSON.stringify([])); }catch(e){}
    cerrar();
    if(postModalEl && postModalId){ const it = cards.find(c=>c.id===postModalId); if(it) pintarPiezas(it); }
  });
  pintar();
}

// Migra fecha "dd/mm" (sin año, formato viejo) a ISO "YYYY-MM-DD" asumiendo
// el año actual — el usuario corrige a mano con el picker si el año no aplica.
function migrarFechasLegacyCards(){
  let cambio=false;
  const anio=new Date().getFullYear();
  cards.forEach(item=>{
    const m=(item.fecha||'').trim().match(/^(\d{1,2})\/(\d{1,2})$/);
    if(!m) return;
    const day=parseInt(m[1],10), month=parseInt(m[2],10);
    if(month<1||month>12||day<1||day>31) return;
    item.fecha=anio+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    cambio=true;
  });
  return cambio;
}

// Espeja las campañas con fecha al calendario cruzado de Jefes
// ({cliente}:agenda-eventos), sin tocar los eventos de otros Jefes (ej.
// Contenido) ni las temporadas creadas manualmente en la Agenda.
let agendaSyncTimer=null, agendaSyncPending=false;
function scheduleAgendaSync(){ agendaSyncPending=true; clearTimeout(agendaSyncTimer); agendaSyncTimer=setTimeout(syncAgendaEventos,1500); }
async function syncAgendaEventos(opts){
  clearTimeout(agendaSyncTimer); agendaSyncTimer=null; if(!agendaSyncPending) return;
  try{
    const result=await window.storage.get(AGENDA_KEY);
    const data=(result&&result.value)?JSON.parse(result.value):{eventos:[],temporadas:[]};
    const otros=(data.eventos||[]).filter(e=>e.origen!=='anuncios');
    const propios=[];
    cards.forEach(item=>{
      if(!/^\d{4}-\d{2}-\d{2}$/.test(item.fecha||'')) return;
      propios.push({
        id:'anuncios-'+item.id,
        origen:'anuncios', origenId:item.id,
        fecha:item.fecha, titulo:item.titulo||item.hook||'(sin título)', estado:item.estado||'idea',
      });
    });
    data.eventos=[...otros, ...propios];
    await window.storage.set(AGENDA_KEY, JSON.stringify(data), opts);
    agendaSyncPending=false;
  }catch(e){}
}

// Los ángulos que se ofrecen: los de la Comunicación 366 del grupo elegido (si tiene una propia); si no,
// los de todas las Comunicaciones guardadas, sin repetir.
function recalcularAngulos366(){
  const delGrupo = grupoId ? comunicaciones366.filter(c=>c && c.grupo_id===grupoId) : [];
  const fuente = delGrupo.length ? delGrupo : comunicaciones366;
  const vistos = new Set(), out = [];
  fuente.forEach(c=>(Array.isArray(c.angulos_evergreen) ? c.angulos_evergreen : []).forEach(f=>{
    if(!f || !f.angulo || !String(f.angulo).trim()) return;
    const k = String(f.angulo).trim().toLowerCase();
    if(vistos.has(k)) return; vistos.add(k); out.push(f);
  }));
  const firma = out.map(f=>f.angulo).join('|');
  if(firma !== angulosFirma){ angulosFirma = firma; anguloIdx = ''; } // cambió la lista: el índice elegido ya no sirve
  angulos366 = out;
}

// se reutiliza su menú y solo se coloca debajo del campo. Al elegir, la pastilla avisa y la página se acomoda sola.
function abrirMenuFocoEn(ancla){
  const pill = document.querySelector('#foco-slot .foco-pill'), menu = document.querySelector('#foco-slot .foco-menu');
  if(!pill || !menu) return;
  const colocar = ()=>{
    if(menu.hidden || !ancla.isConnected) return;
    const r = ancla.getBoundingClientRect(), vw = window.innerWidth, w = Math.min(340, vw-20);
    Object.assign(menu.style, { position:'fixed', top:(r.bottom+8)+'px', left:Math.max(10, Math.min(r.left, vw-w-10))+'px', right:'auto', width:w+'px', maxHeight:Math.max(220, window.innerHeight-r.bottom-24)+'px', zIndex:'2200' });
  };
  if(!menu._alcObs){
    menu._alcObs = new MutationObserver(()=>{
      if(!menu.hidden) return;
      ['position','top','left','right','width','maxHeight','zIndex'].forEach(k=>{ menu.style[k] = ''; });
      if(menu._alcPos){ window.removeEventListener('scroll', menu._alcPos, true); window.removeEventListener('resize', menu._alcPos); menu._alcPos = null; }
    });
    menu._alcObs.observe(menu, { attributes:true, attributeFilter:['hidden'] });
  }
  const estabaAbierto = !menu.hidden;
  pill.click();
  if(estabaAbierto) return;
  menu._alcPos = colocar; colocar();
  window.addEventListener('scroll', colocar, true); window.addEventListener('resize', colocar);
}

let popAlc = null;
function cerrarPopAlc(){
  if(!popAlc) return;
  popAlc.el.remove();
  document.removeEventListener('mousedown', popAlc.fuera, true); document.removeEventListener('keydown', popAlc.tecla);
  window.removeEventListener('scroll', popAlc.colocar, true); window.removeEventListener('resize', popAlc.colocar);

function abrirPopAlc(ancla, html, alMontar){
  if(popAlc && popAlc.ancla===ancla){ cerrarPopAlc(); return; }
  cerrarPopAlc();
  const el = document.createElement('div'); el.className = 'alc-pop'; el.innerHTML = html; document.body.appendChild(el);

    if(!ancla.isConnected){ cerrarPopAlc(); return; }

    Object.assign(el.style, { left:Math.max(10, Math.min(r.left, vw-w-10))+'px', width:w+'px', maxHeight:(window.innerHeight-24)+'px', top:(r.bottom+8)+'px' });

// ─── CÓDIGO DE CADA ANUNCIO: "HUM 01_ Título" ───────────────────────────────────────────────────
// Al pasar una idea a Campañas guardadas, su nombre empieza con un código corto: las 3 primeras letras del producto o servicio,
// el número consecutivo del anuncio (01, 02, 03… en el orden de las etapas: primero adquisición, luego consideración y conversión)
// y un guion bajo. Así se sabe cuál es cuál. Si ese producto ya tiene anuncios con código (aunque se hayan puesto a mano), se sigue
// con el mismo prefijo y el número que sigue.
const RE_CODIGO_ANUNCIO = /^\s*([A-Z0-9]{3}) (\d{1,3})_\s*/;
const PALABRAS_SIN_CODIGO = new Set(['DE','DEL','LA','EL','LOS','LAS','UN','UNA','Y','E','O','PARA','POR','CON','EN','A','AL']);
function prefijoDeNombre(nombre){
  const palabras = (nombre||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
  const utiles = palabras.filter(p=>!PALABRAS_SIN_CODIGO.has(p));
  return ((utiles.length ? utiles : palabras).join('') + 'XXX').slice(0,3);
}
// { prefijo, max }: el prefijo que ya usan los anuncios de ese producto (o el que sale de su nombre) y el último número usado.
function baseCodigoAnuncio(prodId, grpId){
  const delAlcance = cards.filter(c=> prodId ? c.producto_id===prodId : (!c.producto_id && (c.grupo_id||'')===(grpId||'')));
  const usados = {};
  delAlcance.forEach(c=>{ const m = RE_CODIGO_ANUNCIO.exec(c.titulo||''); if(m){ const u = usados[m[1]] = usados[m[1]] || { n:0, max:0 }; u.n++; u.max = Math.max(u.max, parseInt(m[2],10)); } });
  const conocido = Object.keys(usados).sort((a,b)=>usados[b].n-usados[a].n)[0];
  if(conocido) return { prefijo:conocido, max:usados[conocido].max };
  const prod = productos.find(x=>x&&x.id===prodId), grp = grupos.find(x=>x&&x.id===grpId);
  return { prefijo: prefijoDeNombre((prod&&prod.nombre) || (grp&&grp.nombre) || 'Anuncio'), max:0 };
}
function tituloConCodigo(titulo, prefijo, n){
  const t = (titulo||'').trim();
  if(RE_CODIGO_ANUNCIO.test(t)) return t; // ya trae su código
  return (prefijo+' '+String(n).padStart(2,'0')+'_ '+t).trim();
}

async function generarDetalleSeleccionadas(){
  const statusEl = document.getElementById('anuncios-detalle-status');
  const btn = document.getElementById('anuncios-detalle-btn');
  const sel = seleccionadas();
  if(!sel.length){
    statusEl.className='mode-status error'; statusEl.textContent='Selecciona al menos una idea primero.';
    return;
  }
  const formato = document.getElementById('anuncios-formato-sel').value;
  btn.disabled = true;
  statusEl.className='mode-status'; statusEl.textContent='⏳ Desarrollando el copy y los datos de Meta de '+sel.length+' idea(s)...';
  try{
    const res = await fetch('/api/generar-anuncios', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        modo: 'detalle', cliente: CLIENTE_ID, grupo_id: grupoId, producto_id: productoId, producto_texto: productoTexto, formato,
        ideas: sel.map(it=>({ id: it.id, titulo: it.titulo, hook: it.hook, etapa: it.etapa })),
      }),
    });
    const data = await res.json();
    if(!res.ok){ statusEl.textContent = res.status===402 ? (data.error||'Llegaste al tope de uso de IA.') : 'Error: '+(data.error||'No se pudo generar.'); statusEl.classList.add('error'); return; }

    const detallesPorId = {};
    (data.detalles||[]).forEach(d=>{ detallesPorId[d.id]=d; });

    let creadas = 0;
    const idsAntes = new Set(cards.map(c=>c.id));
    // Números del código en el orden de las etapas (sel ya viene así); las tarjetas se crean al revés para que, al ir al frente de la lista, queden 01, 02, 03…
    const base = baseCodigoAnuncio(productoId || '', grupoId || '');
    const numeroDe = {}; let consecutivo = base.max;
    sel.forEach(it=>{ if(detallesPorId[it.id]) numeroDe[it.id] = ++consecutivo; });
    [...sel].reverse().forEach(it=>{
      const det = detallesPorId[it.id];
      if(!det) return;
      cards.unshift({
        id: mkCardId(),
        etapa: it.etapa,
        formato: data.formato || formato,
        grupo_id: grupoId || '',
        producto_id: productoId || '',
        titulo: tituloConCodigo(it.titulo, base.prefijo, numeroDe[it.id]),
        hook: it.hook,
        objetivo: det.objetivo || '',
        angulo: det.angulo || '',
        audiencia: det.audiencia || '',
        guion: det.guion,
        version_15s: det.version_15s || '',
        hooks_alternativos: Array.isArray(det.hooks_alternativos) ? det.hooks_alternativos : [],
        visual_sugerido: det.visual_sugerido || '',
        duracion_sugerida: det.duracion_sugerida || '',
        copy_publicacion: det.copy_publicacion,
        prompt_imagen: det.prompt_imagen,
        prompt_video: det.prompt_video,
        caption_whatsapp: det.caption_whatsapp,
        titulo_anuncio: det.titulo_anuncio || '',
        descripcion_anuncio: det.descripcion_anuncio || '',
        cta_boton: det.cta_boton || '',
        link_destino: det.link_destino || '',
        estado: 'idea',
        fecha: '',
        retroalimentacion: '',
        link_archivo_final: '',
      });
      creadas++;
      // Ya se convirtió en campaña -- se quita de la lista de ideas en vez de solo desmarcarla.
      const lista = datosActuales()[it.etapa];
      if(lista){
        const idx = lista.findIndex(f=>f.id===it.id);
        if(idx!==-1) lista.splice(idx,1);
      }
    });

    document.getElementById('count-cards').textContent = cards.length;
    scheduleCardsSave();
    scheduleBorradorSave();
    statusEl.textContent = `✅ ${creadas} anuncio(s) creado(s) en "Campañas guardadas".`;
    render();
    const idsNuevos = cards.filter(c=>!idsAntes.has(c.id)).map(c=>c.id);
    if(idsNuevos.length >= 2) proponerCampanaParaLote(idsNuevos);
  }catch(e){
    statusEl.textContent='Error de conexión.'; statusEl.classList.add('error');
  }finally{
    btn.disabled=false;
  }
}

// ─── SUBIR IMAGEN (compartido con el adjunto de Consulta en vivo) ─────────
// Reduce cualquier imagen (o el fotograma extraído de un video) a un JPEG comprimido en base64
// antes de mandarlo al servidor -- mantiene el payload ligero y dentro del límite de la función
// serverless, y el tamaño recomendado para la API de Claude (lado largo ~1568px).
function comprimirCanvasAJpegBase64(canvas, calidad){
  const dataUrl = canvas.toDataURL('image/jpeg', calidad);
  return dataUrl.split(',')[1];
}
function dibujarEnCanvasRedimensionado(origenAncho, origenAlto, maxLado){
  let w = origenAncho, h = origenAlto;
  if(w > maxLado || h > maxLado){
    const escala = maxLado / Math.max(w, h);
    w = Math.round(w * escala); h = Math.round(h * escala);
  }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  return canvas;
}
function imagenFileAJpegBase64(file, maxLado){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const canvas = dibujarEnCanvasRedimensionado(img.naturalWidth, img.naturalHeight, maxLado);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(comprimirCanvasAJpegBase64(canvas, 0.85));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen.')); };
    img.src = url;
  });
}
function videoFileAFotogramaJpegBase64(file, maxLado){
  return new Promise((resolve, reject)=>{
    const video = document.createElement('video');
    video.muted = true; video.playsInline = true;
    const url = URL.createObjectURL(file);
    video.onloadedmetadata = ()=>{ video.currentTime = Math.min(1, (video.duration||1) / 3); };
    video.onseeked = ()=>{
      const canvas = dibujarEnCanvasRedimensionado(video.videoWidth, video.videoHeight, maxLado);
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(comprimirCanvasAJpegBase64(canvas, 0.85));
    };
    video.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('No se pudo leer el video.')); };
    video.src = url;
  });
}

// Procesa un archivo (del <input type=file> del chat o pegado con Ctrl+V) y lo deja listo para
// adjuntarlo al siguiente mensaje de Consulta en vivo. Busca los elementos por id porque cuando se
// llama desde el paste global no se conoce el contenedor de origen.
async function procesarArchivoChatImagen(file){
  const preview = document.getElementById('chat-adjunto-preview');
  const hint = document.getElementById('chat-adjunto-hint');
  if(!preview || !hint) return; // la pestaña de chat no está en pantalla ahorita
  chatImagenBase64 = ''; chatImagenNombre = ''; preview.style.display = 'none';
  if(!file) return;
  hint.textContent = '⏳ Procesando archivo...';
  try{
    const esVideo = file.type.startsWith('video/');
    const base64 = esVideo ? await videoFileAFotogramaJpegBase64(file, 1280) : await imagenFileAJpegBase64(file, 1280);
    chatImagenBase64 = base64;
    chatImagenMediaType = 'image/jpeg';
    chatImagenNombre = file.name || 'imagen-pegada.jpg';
    preview.querySelector('img').src = 'data:image/jpeg;base64,' + base64;
    preview.querySelector('span').textContent = chatImagenNombre;
    preview.style.display = 'inline-flex';
    hint.textContent = esVideo ? '✅ Fotograma extraído del video -- cuéntale al Jefe qué se dice en el video si quieres que lo tome en cuenta.' : '✅ Imagen lista para enviar.';
  }catch(err){
    hint.textContent = 'No se pudo procesar el archivo.';
  }
}

// Pegar con Ctrl+V en cualquier parte de la página adjunta la imagen al chat, mientras la pestaña
// Consulta en vivo esté abierta -- se registra UNA sola vez a nivel documento (no en cada render).
function handleGlobalPasteChatImagen(e){
  const fileInput = document.getElementById('chat-file-input');
  if(!fileInput || !chatAbierto) return; // el chat está cerrado (o no está en pantalla), no interceptar el paste
  const items = (e.clipboardData && e.clipboardData.items) || [];
  let imgFile = null;
  for(const item of items){
    if(item.kind === 'file' && item.type && item.type.startsWith('image/')){ imgFile = item.getAsFile(); break; }
  }
  if(!imgFile) return; // no había imagen en el portapapeles -- deja el paste normal (ej. texto)
  e.preventDefault();
  procesarArchivoChatImagen(imgFile);
}
document.addEventListener('paste', handleGlobalPasteChatImagen);

}

// ─── LINKS DE TRABAJO FIJOS EN LA BARRA DE LA IZQUIERDA ──────────────────────────────────────────
// Una vez pegados, la carpeta de Drive y el Business Manager quedan siempre a la mano abajo en la barra lateral
// (arriba de las redes). Círculo sólido = ya está guardado (clic lo abre); punteado = falta (clic te lleva a pegarlo);
// el lápiz permite cambiarlos. El bloque lo agrega esta página, así que se vuelve a poner si la barra se redibuja.
function irAPegarLink(id){
  window.scrollTo({ top:0, behavior:'smooth' });
  setTimeout(()=>{ const i = document.querySelector('[data-link-input="'+id+'"]'); if(i) i.focus(); }, 250);
}
function pintarLinksBarra(){
  // La barra compartida (js/jefes-nav.js) ya muestra los links de trabajo en todos los Jefes: no se duplican.
  if(document.querySelector('nav.jn .jn-links')) return true;
  const redes = document.querySelector('nav.jn .jn-redes');
  if(!redes) return false;
  let box = document.getElementById('jnx-links');
  if(!box){
    box = document.createElement('div');
    box.id = 'jnx-links';
    redes.parentNode.insertBefore(box, redes);
  }
  const algunoGuardado = LINK_ICONOS.some(c=>(c.get()||'').trim());
  box.innerHTML = '<div class="jn-sec">Links de trabajo</div><div class="jnx-fila">' +
    LINK_ICONOS.map(c=>{
      const link = (c.get()||'').trim();
      return link
        ? `<a class="jn-red" href="${escHtml(linkHref(link))}" target="_blank" rel="noopener" title="${escHtml(c.titulo)} · clic para abrir" aria-label="${escHtml(c.titulo)}">${ICONOS_SVG[c.icono]}</a>`
        : `<button type="button" class="jn-red jnx-off" data-jnx-pegar="${c.id}" title="Pega aquí el link: ${escHtml(c.titulo)}" aria-label="Pegar el link: ${escHtml(c.titulo)}">${ICONOS_SVG[c.icono]}</button>`;
    }).join('') +
    (algunoGuardado ? '<button type="button" class="jn-red jnx-editar" title="Cambiar mis links de trabajo" aria-label="Cambiar mis links de trabajo">✎</button>' : '') +
    '</div>';
  box.querySelectorAll('[data-jnx-pegar]').forEach(b=>b.addEventListener('click',()=>irAPegarLink(b.dataset.jnxPegar)));
  const ed = box.querySelector('.jnx-editar');
  if(ed) ed.addEventListener('click',()=>{
    let primero = '';
    LINK_ICONOS.forEach(c=>{ if((c.get()||'').trim()){ c.setEditando(true); if(!primero) primero = c.id; } });
    pintarIconos(); irAPegarLink(primero);
  });
  return true;
}
// La barra de la izquierda la inyecta js/jefes-nav.js después de cargar: se espera a que exista y se vigila por si se redibuja.
function vigilarBarraLinks(){
  if(pintarLinksBarra() && window.__jnxObs) return;
  if(window.__jnxObs) return;
  let ocupado = false;
  window.__jnxObs = new MutationObserver(()=>{
    if(ocupado) return; ocupado = true;
    setTimeout(()=>{ ocupado = false; if(!document.getElementById('jnx-links')) pintarLinksBarra(); }, 60);
  });
  window.__jnxObs.observe(document.body, { childList:true, subtree:true });
}

function pintarIconos(){
  const host=document.getElementById('cx-icons');
  if(!host) return;
  host.innerHTML='';
  LINK_ICONOS.forEach(cfg=>{
    const link=(cfg.get()||'').trim();
    const editando=cfg.editando();
    // Un link ya pegado se queda fijo abajo en la barra de la izquierda; aquí solo se pide el que falta o el que se está editando.
    if(link && !editando) return;
    const mostrarInput=!link||editando;
    const box=document.createElement('div');
    box.className='cx-ic';
    const titulo=escHtml(cfg.titulo);
    let html='';
    if(link && !editando){
      html+=`<a class="cx-circle" href="${escHtml(linkHref(link))}" target="_blank" rel="noopener" data-tip="${titulo} · clic para abrir" aria-label="${titulo}">${ICONOS_SVG[cfg.icono]}</a>
             <button type="button" class="cx-edit" data-edit="${cfg.id}" title="Editar link" aria-label="Editar link de ${titulo}">✎</button>`;
    } else {
      html+=`<button type="button" class="cx-circle vacio" data-focus="${cfg.id}" data-tip="${titulo}" aria-label="${titulo}">${ICONOS_SVG[cfg.icono]}</button>`;
    }
    if(mostrarInput){
      html+=`<div class="cx-pill"><input type="text" data-link-input="${cfg.id}" placeholder="Pega tu link aquí" value="${escHtml(link)}" aria-label="Link: ${titulo}"><button type="button" data-ok="${cfg.id}">Listo</button>${link?`<button type="button" class="ghost" data-cancel="${cfg.id}" aria-label="Cancelar">✕</button>`:''}</div>`;
    }
    html+=`<button type="button" class="cx-help" data-help="${cfg.id}" title="¿Cómo saco este link?" aria-label="Ayuda: cómo sacar el link de ${titulo}">?</button>`;
    box.innerHTML=html;
    host.appendChild(box);
    box.querySelector('[data-help]').addEventListener('click',()=>abrirAyudaLink(cfg.id));

    const input=box.querySelector('[data-link-input]');
    if(input){
      input.addEventListener('input',e=>cfg.set(e.target.value));
      const cerrar=()=>{ if((cfg.get()||'').trim()){ cfg.setEditando(false); pintarIconos(); } };
      input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); cerrar(); } if(e.key==='Escape'){ cfg.setEditando(false); pintarIconos(); } });
      input.addEventListener('blur',cerrar);
      box.querySelectorAll('.cx-pill button').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
      const ok=box.querySelector('[data-ok]'); if(ok) ok.addEventListener('click',cerrar);
      const cancel=box.querySelector('[data-cancel]'); if(cancel) cancel.addEventListener('click',()=>{ cfg.setEditando(false); pintarIconos(); });
      if(editando) input.focus();
    }
    const edit=box.querySelector('[data-edit]');
    if(edit) edit.addEventListener('click',()=>{ cfg.setEditando(true); pintarIconos(); });
    const vacio=box.querySelector('[data-focus]');
    if(vacio) vacio.addEventListener('click',()=>{ const i=box.querySelector('input'); if(i) i.focus(); });
  });
  host.style.display = host.children.length ? '' : 'none';
  pintarLinksBarra();
}

function renderGuardadas(container){
  if(!cards.length){
    const empty = document.createElement('div');
    empty.className = 'empty-row';
    empty.textContent = 'Todavía no hay campañas guardadas. Aprueba ideas en el Generador y elige un formato para crearlas.';
    container.appendChild(empty);
    return;
  }
  // Filtro por producto (pastillas): "Todos" + cada producto que ya tenga campañas guardadas.
  const idsConCampanas = [...new Set(cards.map(c=>c.producto_id||''))];
  if(filtroProductoGuardadas && !idsConCampanas.includes(filtroProductoGuardadas==='__sin__'?'':filtroProductoGuardadas)) filtroProductoGuardadas = '';
  const nombreDe = (id)=>{ const p = productos.find(x=>x&&x.id===id); return id ? (p?p.nombre:'Producto') : 'Sin producto'; };
  const filtroEl = document.createElement('div');
  filtroEl.className = 'prod-pills';
  filtroEl.id = 'guardadas-producto-pills';
  filtroEl.innerHTML = `<button type="button" class="prod-pill${filtroProductoGuardadas===''?' active':''}" data-filtro="">Todos (${cards.length})</button>` +
    idsConCampanas.map(id=>`<button type="button" class="prod-pill${filtroProductoGuardadas===(id===''?'__sin__':id)?' active':''}" data-filtro="${escHtml(id||'__sin__')}">${escHtml(nombreDe(id))} (${cards.filter(c=>(c.producto_id||'')===id).length})</button>`).join('');
  container.appendChild(filtroEl);
  filtroEl.querySelectorAll('.prod-pill').forEach(b=>b.addEventListener('click',()=>{
    filtroProductoGuardadas = b.dataset.filtro; render();
  }));
  const visibles = filtroProductoGuardadas==='' ? cards : cards.filter(c=>(c.producto_id||'')===(filtroProductoGuardadas==='__sin__'?'':filtroProductoGuardadas));

  // Categorizadas por producto: una barra por producto (en el orden de tu lista de productos, y
  // "Sin producto" al final) con sus campañas debajo; dentro de cada una, primero lo que está en
  // proceso, luego ideas y al final lo publicado, y por fecha.
  const rank = {proceso:0, idea:1, publicado:2};
  const orden = (x,y)=>(rank[x.estado||'idea']-rank[y.estado||'idea']) || (x.fecha||'9999').localeCompare(y.fecha||'9999') || porHoraCard(x,y);
  const idsOrdenados = productos.filter(p=>p&&p.id&&visibles.some(c=>c.producto_id===p.id)).map(p=>p.id);
  visibles.forEach(c=>{ const id=c.producto_id||''; if(id && !idsOrdenados.includes(id)) idsOrdenados.push(id); });
  if(visibles.some(c=>!c.producto_id)) idsOrdenados.push('');
  idsOrdenados.forEach(id=>{
    const delProducto = visibles.filter(c=>(c.producto_id||'')===id).sort(orden);
    if(!delProducto.length) return;
    const seccion = document.createElement('div');
    seccion.className = 'estado-seccion';
    seccion.innerHTML = `<p class="estado-seccion-title">${escHtml(nombreDe(id))} <span class="estado-count">${delProducto.length}</span></p>
      <div class="cards-grid">${delProducto.map(c=>buildPostCard(c, true)).join('')}</div>`;
    container.appendChild(seccion);
  });
  container.querySelectorAll('.pcard').forEach(el=>{
    el.addEventListener('click',()=>abrirPostModal(el.dataset.id));
    el.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); abrirPostModal(el.dataset.id); } });
  });
  // Cada campaña a la que le falte Título/CTA/Link de Meta lo pide en su propia tarjeta (no abre la ventana de la tarjeta)
  container.querySelectorAll('[data-completar-meta]').forEach(b=>{
    b.addEventListener('click',(e)=>{ e.stopPropagation(); const c = cards.find(x=>x.id===b.dataset.completarMeta); if(c) completarMetaDe([c], b); });
    b.addEventListener('keydown',(e)=>e.stopPropagation());
  });
}

// ¿A esta campaña le faltan los campos de Meta Ads Manager (Título, botón o link)?
const metaIncompleta = (c)=>!c.titulo_anuncio || !c.cta_boton || !c.link_destino;
// Completa Título/Descripción/CTA/Link de Meta de las campañas que se le pasen (por lo general una sola: la de su tarjeta).
// Las campañas nuevas ya salen completas al pasar del Generador a Campañas guardadas (generarDetalleSeleccionadas); esto es para las
// que quedaron a medias. Un 402 (tope de uso) se muestra tal cual.
async function completarMetaDe(lista, btn){
  if(!lista.length) return;
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Completando…'; }
  // Se agrupa por grupo_id antes de lotear: el link_destino depende del grupo de negocio de cada tarjeta
  // (cada Comunicación 366 puede tener su propio número/mensaje de WhatsApp), así que una llamada no mezcla grupos.
  const porGrupo = {};
  lista.forEach(c=>{ const g = c.grupo_id || ''; (porGrupo[g] = porGrupo[g] || []).push(c); });
  let hechos = 0, error = '';
  for(const grupoIdLote of Object.keys(porGrupo)){
    const cardsDelGrupo = porGrupo[grupoIdLote];
    for(let i=0;i<cardsDelGrupo.length && !error;i+=MAX_CAMPOS_META_POR_LOTE){
      const lote = cardsDelGrupo.slice(i, i+MAX_CAMPOS_META_POR_LOTE);
      try{
        const res = await fetch('/api/generar-anuncios', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            modo:'completar_meta', cliente: CLIENTE_ID, grupo_id: grupoIdLote,
            cards: lote.map(c=>({ id:c.id, titulo:c.titulo, hook:c.hook, objetivo:c.objetivo, guion:c.guion, copy_publicacion:c.copy_publicacion })),
          }),
        });
        const data = await res.json();
        if(!res.ok || !data.campos){ error = res.status===402 ? (data.error||'Llegaste al tope de uso de IA.') : (data.error||'No se pudo completar.'); break; }
        const porId = {};
        data.campos.forEach(c=>{ porId[c.id]=c; });
        lote.forEach(c=>{
          const campos = porId[c.id];
          if(!campos) return;
          c.titulo_anuncio = campos.titulo_anuncio || c.titulo_anuncio;
          c.descripcion_anuncio = campos.descripcion_anuncio || c.descripcion_anuncio;
          c.cta_boton = campos.cta_boton || c.cta_boton;
          c.link_destino = c.link_destino || campos.link_destino || '';
          hechos++;
        });
        scheduleCardsSave();
      }catch(err){ error = 'Error de conexión.'; }
    }
    if(error) break;
  }
  mostrarToast(error ? '⚠️ '+escHtml(error) : `✅ Listo: completé el título, la descripción, el botón y el link de Meta (${hechos}).`);
  render();
}

// ─── ESTRUCTURA DE ADS ────────────────────────────────────────────────────
// Jerarquía Campaña > Conjunto de Anuncios > (nota + link a Campañas guardadas, sin datos
// propios en ese 3er nivel -- confirmado con el usuario). Mismo ciclo de guardado debounced que
// borradorStore/cards, guardado en {cliente}:anuncios-estructura.

// Estructura de Ads: a la izquierda, fijas, las campañas ya creadas (del producto que se filtró arriba) y a la derecha la que se abrió con toda su info.
// El producto se filtra solo arriba (la pastilla de foco): ya no se repite en el título ni en un campo de cada campaña.
let estSelId = '';
function campanasVisibles(){
  return estructuras.filter(c=> productoId ? c.producto_id===productoId : (grupoId ? c.grupo_id===grupoId : true));
}
// Número de la campaña dentro de su mismo producto o grupo (la primera creada es la 1).
function numeroCampana(c){
  const mismas = estructuras.filter(x=>(x.producto_id||'')===(c.producto_id||'') && (x.grupo_id||'')===(c.grupo_id||''));
  return mismas.length - mismas.indexOf(c);
}
function renderEstructura(container){
  const wrap = document.createElement('div');

  if(!estructuras.length){
    // Sin campañas todavía: el botón vive aquí.
    const empty = document.createElement('div');
    empty.className = 'empty-row';
    empty.innerHTML = 'Todavía no hay campañas de estructura.<br><br><button class="btn btn-solid" type="button" data-nueva-campana>+ Nueva campaña</button>';
    wrap.appendChild(empty);
  } else {
    const visibles = campanasVisibles();
    const verProducto = !productoId && !grupoId; // con "ecosistema completo" sí hace falta decir de qué producto es cada campaña
    if(!visibles.some(c=>c.id===estSelId)) estSelId = visibles.length ? visibles[0].id : '';
    const lay = document.createElement('div');
    lay.className = 'est-layout';
    const lista = document.createElement('aside');
    lista.className = 'est-lista';
    lista.setAttribute('aria-label', 'Campañas creadas');
    lista.innerHTML = '<button class="btn btn-solid btn-sm est-nueva" type="button" data-nueva-campana>+ Nueva campaña</button>'
      + (visibles.length ? visibles.map(c=>{
          const nConj = (c.conjuntos||[]).length, nAn = new Set((c.conjuntos||[]).flatMap(cj=>cj.anuncios_ids||[])).size;
          return `<button type="button" class="est-item${c.id===estSelId?' on':''}${c.guardada?' guardada':''}" data-est-sel="${c.id}">
            <span class="est-item-t">Campaña ${numeroCampana(c)}</span>
            ${verProducto ? `<span class="est-item-p">${escHtml(nombreAlcance(c))}</span>` : ''}
            <span class="est-item-s">${escHtml(objetivoTextoCampana(c) || 'Sin objetivo')} · ${nConj} conjunto(s) · ${nAn} anuncio(s)</span>
          </button>`;
        }).join('') : '<p class="est-vacia">Todavía no hay campañas de este producto. Crea la primera.</p>');
    const detalle = document.createElement('div');
    detalle.className = 'est-detalle';
    const sel = visibles.find(c=>c.id===estSelId);
    if(sel) detalle.appendChild(buildCampanaEstructuraCard(sel, numeroCampana(sel), verProducto));
    else detalle.innerHTML = '<div class="empty-row">Elige una campaña de la lista o crea una nueva.</div>';
    lay.append(lista, detalle);
    wrap.appendChild(lay);
    lista.querySelectorAll('[data-est-sel]').forEach(b=>b.addEventListener('click',()=>{ estSelId = b.dataset.estSel; render(); }));
  }

  const hackFinal = document.createElement('div');
  hackFinal.className = 'hack-final-box';
  hackFinal.innerHTML = `
    <p class="hack-final-title">🧠 HACK FINAL</p>
    <p>👉 Lo que no se mide, no se puede mejorar.</p>
    <p>👉 Tu trabajo no es hacer el anuncio perfecto, es probar hasta encontrar el que funciona.</p>
    <p>👉 Entre más claro tengas esto, menos dinero pierdes — y más abierta estás a la mejora continua.</p>
  `;
  wrap.appendChild(hackFinal);

  container.appendChild(wrap);

  wrap.querySelectorAll('[data-nueva-campana]').forEach(b=>b.addEventListener('click', ()=>{
    const nueva = mkCampana();
    estructuras.unshift(nueva);
    estSelId = nueva.id;
    scheduleEstructuraSave();
    render();
  }));
}

// La campaña es siempre el panel lima: pastilla con el nombre, fecha de inicio, las pastillas
// "Objetivo de campaña" y "Especificaciones del conjunto" (al pulsarlas se abren sus datos para
// ver y editar) y a la derecha los anuncios vinculados. Sin guardar se ven abiertas; ya guardada
// sale cerrada. Lo que el usuario abre/cierra a mano se conserva aunque se vuelva a pintar.
const resEstado = new Map();
const resColapsadas = new Set(); // campañas encogidas a una sola línea
function resAbierto(campana, clave){
  const k = campana.id+':'+clave;
  return resEstado.has(k) ? resEstado.get(k) : (clave==='anu' ? false : !campana.guardada);
}
// Una campaña recién creada y sin tocar va en blanco; en cuanto lleva algún dato (producto, objetivo,
// fecha, resultado, conjuntos o guardada) pasa al panel lima.
function campanaNueva(c){
  // el producto/grupo con el que nace (el foco de arriba) no cuenta como "datos"
  return !c.guardada && !c.objetivo && !c.tipo && (c.producto_id||'')===(productoId||'') && (c.grupo_id||'')===(grupoId||'') && !c.fecha_inicio
    && !c.resultado_esperado && !(c.conjuntos||[]).length;
}
function nombreAlcance(campana){
  const prod = productos.find(p=>p&&p.id===campana.producto_id);
  const grupo = grupos.find(g=>g&&g.id===campana.grupo_id);
  return prod ? prod.nombre : (grupo ? grupo.nombre : 'General');
}
const ETAPA_AYUDA = {

  conversion: { icono:'🛒', corto:'Te compran · cliente caliente', texto:'Ya quiere, pero no da el paso. Oferta clara, urgencia y botón fuerte.' },
};
const ETAPA_VISTA = {
  adquisicion: { desc:'Aquí te enseñaré los anuncios para personas que todavía no te conocen: los que frenan el scroll y te presentan sin vender directo.', chips:['Cliente frío','Detienen el scroll','No venden directo'] },
  consideracion: { desc:'Aquí te enseñaré los anuncios para personas que ya te conocen y están considerando comprar: resuelven sus dudas y les muestran cómo trabajas.', chips:['Cliente tibio','Resuelven dudas','Muestran tu método'] },
