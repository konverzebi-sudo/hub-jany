<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Learning Club — Control de la escuela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* siempre claro — fondo blanco con acentos de The Learning Club */
    --bg:#FFFFFF;
    --bg-2:#F4F7F9;
    --ink:#141B22;
    --ink-soft:#5C6B78;
    --line:#E1E7EB;
    --line-strong:#C6D0D6;
    --card:#FFFFFF;
    --card-2:#F7FAFB;
    --teal:#175A6B;
    --teal-bright:#1D7690;
    --lime:#AECB1F;
    --lime-deep:#8DA818;
    --pink:#E8699F;
    --pink-bg:#FCE6F0;
    --orange:#F0941F;
    --orange-bg:#FDECD6;
    --green:#3F9E6D;
    --green-bg:#E2F4EA;
    --red:#E1543F;
    --red-bg:#FCE5E1;
    --blue-bg:#DCEEF3;
    --grad: linear-gradient(120deg, var(--lime), var(--pink) 60%, var(--orange));
    --shadow: 0 1px 2px rgba(16,24,32,0.05), 0 8px 24px -18px rgba(16,24,32,0.18);
    --shadow-lg: 0 10px 30px -12px rgba(16,24,32,0.28);
    --radius: 12px;
    --radius-sm: 8px;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Space Grotesk", "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }
  /* Fondo blanco fijo: esta app no cambia a modo oscuro según el sistema. */

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 100% -10%, color-mix(in srgb, var(--pink) 10%, transparent), transparent),
      radial-gradient(900px 500px at -10% 10%, color-mix(in srgb, var(--lime) 10%, transparent), transparent),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.45;
    min-height:100vh;
  }
  h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;color:var(--ink);letter-spacing:-0.01em;}
  .num{font-family:var(--mono);}
  button{font-family:var(--sans);cursor:pointer;}
  input,select{font-family:var(--sans);}

  a{color:var(--teal-bright);}

  /* ---------- layout ---------- */
  #app{display:flex;min-height:100vh;}

  .sidebar{
    width:224px;
    flex:none;
    background:var(--card-2);
    border-right:1px solid var(--line);
    padding:22px 0 22px 0;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .sidebar::after{
    content:"";
    position:absolute;top:0;right:-1px;width:1px;height:100%;
    background:var(--grad);
    opacity:0.5;
  }
  .brand{
    padding:0 20px 18px 20px;
    border-bottom:1px solid var(--line);
    margin-bottom:10px;
    display:flex;align-items:center;gap:10px;
  }
  .brand-logo{
    width:36px;height:36px;border-radius:9px;flex:none;
    box-shadow:var(--shadow);
    object-fit:cover;
  }
  .brand-mark{
    font-family:var(--display);
    font-size:16.5px;
    font-weight:700;
    letter-spacing:0.1px;
    line-height:1.2;
  }
  .brand-sub{
    color:var(--ink-soft);
    font-size:11px;
    margin-top:1px;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  nav.tabs{display:flex;flex-direction:column;gap:3px;padding:10px 12px;}
  nav.tabs button{
    text-align:left;
    background:transparent;
    border:none;
    border-left:3px solid transparent;
    padding:10px 12px;
    font-size:14px;
    color:var(--ink-soft);
    border-radius:var(--radius-sm);
    transition:background .15s ease, color .15s ease;
  }
  nav.tabs button:hover{background:var(--bg-2);color:var(--ink);}
  nav.tabs button.active{
    background:var(--card);
    color:var(--ink);
    border-left-color:var(--pink);
    font-weight:600;
    box-shadow:var(--shadow);
  }
  .sidebar-foot{margin-top:auto;padding:14px 20px 0 20px;color:var(--ink-soft);font-size:11px;border-top:1px solid var(--line);}

  main{flex:1;min-width:0;padding:28px 34px 60px 34px;}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
  .page-head h1{font-size:25px;}
  .page-head .today{color:var(--ink-soft);font-size:12.5px;font-family:var(--mono);text-transform:capitalize;}

  .section{margin-bottom:34px;}
  .section-title{
    font-family:var(--display);
    font-size:16px;
    font-weight:600;
    margin:0 0 12px 0;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .card-pad{padding:18px;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width: 900px){ .grid-2,.grid-3{grid-template-columns:1fr;} }

  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;font-weight:500;}
  .field{margin-bottom:12px;}
  input[type=text],input[type=number],input[type=date],input[type=tel],select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line-strong);
    border-radius:var(--radius-sm);
    background:var(--bg-2);
    color:var(--ink);
    font-size:14px;
  }
  input:focus,select:focus,button:focus-visible{
    outline:2px solid var(--teal-bright);
    outline-offset:1px;
    border-color:var(--teal-bright);
  }
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--ink);
    color:var(--bg);
    border:1px solid var(--ink);
    padding:9px 15px;
    font-size:13.5px;
    font-weight:600;
    border-radius:var(--radius-sm);
    transition:transform .1s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:hover{opacity:0.9;}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:transparent;color:var(--ink);border-color:var(--line-strong);}
  .btn.gold{background:var(--grad);border-color:transparent;color:#12130A;box-shadow:0 6px 18px -8px color-mix(in srgb, var(--pink) 60%, transparent);}
  .btn.danger{background:transparent;color:var(--red);border-color:var(--red);}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;
    font-family:var(--sans);
    font-weight:600;
    color:var(--ink-soft);
    font-size:11px;
    letter-spacing:0.03em;
    padding:8px 10px;
    border-bottom:1px solid var(--line-strong);
    white-space:nowrap;
  }
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  .empty-row td{color:var(--ink-soft);font-style:italic;padding:16px 10px;}

  .pill{
    display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;
  }
  .pill.programada{background:var(--blue-bg);color:var(--teal-bright);}
  .pill.dada{background:var(--green-bg);color:var(--green);}
  .pill.cancelada{background:var(--bg-2);color:var(--ink-soft);}
  .pill.pendiente{background:var(--red-bg);color:var(--red);}
  .pill.pagado{background:var(--green-bg);color:var(--green);}

  .swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;}

  .stat{padding:15px 16px;position:relative;overflow:hidden;}
  .stat::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);
  }
  .stat .label{font-size:11.5px;color:var(--ink-soft);}
  .stat .value{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:4px;}
  .stat .value.pos{color:var(--green);}
  .stat .value.neg{color:var(--red);}

  .empty-state{padding:30px 10px;text-align:center;color:var(--ink-soft);}
  .empty-state .big{font-size:28px;margin-bottom:6px;}

  /* teacher chips */
  .teacher-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .teacher-chip{
    display:flex;align-items:center;gap:6px;
    padding:7px 14px;border:1px solid var(--line-strong);border-radius:20px;
    background:var(--card);font-size:13.5px;font-weight:500;
    transition:background .15s ease, color .15s ease;
  }
  .teacher-chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .teacher-chip.active .swatch{outline:2px solid var(--bg);}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head .month-label{font-family:var(--display);font-size:16px;font-weight:600;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;}
  .cal-dow{background:var(--bg-2);text-align:center;font-size:10.5px;color:var(--ink-soft);padding:7px 0;font-weight:600;letter-spacing:0.03em;}
  .cal-cell{background:var(--card);min-height:74px;padding:5px 6px;cursor:pointer;position:relative;transition:background .12s ease;}
  .cal-cell:hover{background:var(--bg-2);}
  .cal-cell.other-month{background:var(--card-2);color:var(--ink-soft);}
  .cal-cell.selected{outline:2px solid var(--pink);outline-offset:-2px;}
  .cal-cell.today .daynum{color:var(--teal-bright);font-weight:700;}
  .cal-cell .daynum{font-family:var(--mono);font-size:12px;}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;}
  .cal-dot{width:6px;height:6px;border-radius:50%;}
  .cal-dot.programada{background:var(--teal-bright);}
  .cal-dot.dada{background:var(--green);}
  .cal-dot.cancelada{background:var(--ink-soft);}

  .day-panel{margin-top:16px;}
  .class-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
  .class-row:last-child{border-bottom:none;}
  .class-main{font-size:13.5px;}
  .class-main .who{font-weight:600;}
  .class-actions{display:flex;gap:6px;}

  .pending-item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
  .pending-item:last-child{border-bottom:none;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--radius-sm);
    font-size:13.5px;box-shadow:var(--shadow-lg);z-index:999;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .toast.show{opacity:1;}

  .inline-form{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:10px;}

  .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .badge-count{
    background:var(--bg-2);color:var(--ink-soft);border-radius:10px;font-size:11px;padding:1px 8px;font-weight:600;
  }

  ::selection{background:var(--pink);color:#2A0C1B;}

  @media (max-width: 760px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:12px;align-items:center;}
    .brand{border:none;padding:0 14px 0 4px;margin:0;}
    nav.tabs{flex-direction:row;padding:0;}
    .sidebar-foot{display:none;}
    main{padding:18px 16px 50px 16px;}
    .grid-3{grid-template-columns:1fr 1fr;}
  }
</style>
</head>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // State
  // ---------------------------------------------------------------
  const state = {
    tab: "alumnos",
    teachers: [],
    students: [],
    products: [],
    enrollments: [],
    classes: [],
    expenses: [],
    fixedExpenses: [],
    fondoMovimientos: [],
    ahorros: [],
    settings: { ahorroPct: 10 },
    ready: { teachers:false, students:false, products:false, enrollments:false, classes:false, expenses:false, fixedExpenses:false, fondoMovimientos:false, ahorros:false },
    // ui-only
    calYear: new Date().getFullYear(),
    calMonth: new Date().getMonth(), // 0-11
    calTeacherId: null,
    calSelectedDate: null,
    corteFrom: null,
    corteTo: null,
    showAddTeacher: false,
    editingTeacherId: null,
    showAddStudent: false,
    showAddProduct: false,
    paymentFormFor: null,
  };

  const TEACHER_COLORS = ["#E8699F","#AECB1F","#F0941F","#175A6B","#7A5C99","#3F9E6D","#E1543F"];

  let db = null;

  const fmtMoney = (n) => {
    if (n === null || n === undefined || isNaN(n)) n = 0;
    return new Intl.NumberFormat("es-MX", {style:"currency", currency:"MXN", maximumFractionDigits:2}).format(n);
  };
  const fmtDateHuman = (iso) => {
    if(!iso) return "";
    const [y,m,d] = iso.split("-").map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString("es-MX", {weekday:"short", day:"numeric", month:"short"});
  };
  const fmtDateShort = (iso) => {
    if(!iso) return "";
    const [y,m,d] = iso.split("-").map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString("es-MX", {day:"numeric", month:"short", year:"numeric"});
  };
  const todayISO = () => {
    const d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  };
  const isoFromParts = (y,m,d) => y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2));
  const esc = (s) => String(s===undefined||s===null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove("show"), 2200);
  }

  // ---------------------------------------------------------------
  // Derived helpers
  // ---------------------------------------------------------------
  function teacherById(id){ return state.teachers.find(t=>t.id===id); }
  function studentById(id){ return state.students.find(s=>s.id===id); }
  function enrollmentById(id){ return state.enrollments.find(e=>e.id===id); }
  function productById(id){ return state.products.find(p=>p.id===id); }

  function montoPagado(enr){
    return (enr.pagos||[]).reduce((s,p)=>s+(p.monto||0), 0);
  }
  function primerPago(enr){
    const pagos = enr.pagos||[];
    return pagos.length ? pagos[0] : null;
  }
  function pricePerClass(enr){
    const total = enr.totalClases || 1;
    const base = (enr.montoTotal !== undefined) ? enr.montoTotal : montoPagado(enr);
    return base / total;
  }
  function classesRemaining(enr){
    return Math.max(0, (enr.totalClases||0) - (enr.clasesDadas||0));
  }
  function saldoEnCaja(enr){
    return montoPagado(enr) - pricePerClass(enr) * (enr.clasesDadas||0);
  }
  function saldoPorCobrar(enr){
    const total = (enr.montoTotal !== undefined) ? enr.montoTotal : montoPagado(enr);
    return Math.max(0, total - montoPagado(enr));
  }
  function activeEnrollments(){
    return state.enrollments.filter(e => e.activo !== false && classesRemaining(e) > 0);
  }
  function allEnrollmentsSorted(){
    return [...state.enrollments].sort((a,b)=> (b.creadoEn||"").localeCompare(a.creadoEn||""));
  }

  function tipoLabel(tipo){
    return tipo === "individual" ? "Pago único" : tipo === "mensual" ? "Pago mensual" : "Número de clases personalizado";
  }

  // ---------------------------------------------------------------
  // DB wiring (versión de prueba: guarda todo en este navegador)
  // ---------------------------------------------------------------
  const LOCAL_KEY = "tlc_data_v1";
  const COLLECTIONS = ["teachers","students","products","enrollments","classes","expenses","fixedExpenses","fondoMovimientos","ahorros"];

  function loadLocalStore(){
    try{
      const raw = localStorage.getItem(LOCAL_KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      COLLECTIONS.forEach(c => { if(!Array.isArray(parsed[c])) parsed[c] = []; });
      if(!parsed.settings || typeof parsed.settings !== "object") parsed.settings = { ahorroPct: 10 };
      if(typeof parsed.settings.ahorroPct !== "number") parsed.settings.ahorroPct = 10;
      return parsed;
    }catch(e){
      const empty = {}; COLLECTIONS.forEach(c => empty[c] = []); empty.settings = { ahorroPct: 10 }; return empty;
    }
  }
  function saveLocalStore(store){
    localStorage.setItem(LOCAL_KEY, JSON.stringify(store));
  }
  async function updateSettings(patch){
    const store = loadLocalStore();
    store.settings = Object.assign({}, store.settings, patch);
    saveLocalStore(store);
    refreshFromLocalStore();
  }

  db = {
    collection(name){
      return {
        add: async (data) => {
          const store = loadLocalStore();
          const id = uid();
          store[name].push(Object.assign({}, data, {id}));
          saveLocalStore(store);
          refreshFromLocalStore();
          return { id };
        }
      };
    },
    doc(path){
      const idx = path.indexOf("/");
      const name = path.slice(0, idx);
      const id = path.slice(idx+1);
      return {
        update: async (patch) => {
          const store = loadLocalStore();
          store[name] = store[name].map(item => item.id === id ? Object.assign({}, item, patch) : item);
          saveLocalStore(store);
          refreshFromLocalStore();
        },
        delete: async () => {
          const store = loadLocalStore();
          store[name] = store[name].filter(item => item.id !== id);
          saveLocalStore(store);
          refreshFromLocalStore();
        }
      };
    }
  };

  function refreshFromLocalStore(){
    const store = loadLocalStore();
    COLLECTIONS.forEach(key=>{
      state[key] = store[key];
      state.ready[key] = true;
    });
    state.settings = store.settings;
    render();
  }

  async function initDb(){
    refreshFromLocalStore();
  }

  function allLoaded(){
    return Object.values(state.ready).every(Boolean);
  }

  // ---------------------------------------------------------------
  // Mutations
  // ---------------------------------------------------------------
  async function addTeacher(nombre, tarifa){
    const color = TEACHER_COLORS[state.teachers.length % TEACHER_COLORS.length];
    await db.collection("teachers").add({
      nombre, tarifa: Number(tarifa)||0, color, activo:true, creadoEn: new Date().toISOString()
    });
    toast("Maestra agregada");
  }

  async function updateTeacher(id, nombre, tarifa){
    await db.doc("teachers/"+id).update({ nombre, tarifa: Math.min(100, Math.max(0, Number(tarifa)||0)) });
    toast("Maestra actualizada");
  }

  async function addProduct(payload){
    const tipo = payload.tipo;
    const totalClases = tipo === "individual" ? 1 : Number(payload.totalClases);
    await db.collection("products").add({
      nombre: payload.nombre,
      tipo,
      totalClases,
      precio: Number(payload.precio),
      activo: true,
      creadoEn: new Date().toISOString()
    });
    toast("Producto agregado");
  }
  async function deleteProduct(id){
    await db.doc("products/"+id).delete();
    toast("Producto eliminado");
  }

  async function addStudentWithPackage(payload){
    let student = state.students.find(s => s.nombre.trim().toLowerCase() === payload.nombreAlumno.trim().toLowerCase());
    let studentId;
    const datosFamilia = {
      telefono: payload.telefono||"",
      nombrePapa: payload.nombrePapa||"",
      nombreMama: payload.nombreMama||"",
      cumpleanos: payload.cumpleanos||""
    };
    if(student){
      studentId = student.id;
      await db.doc("students/"+studentId).update(datosFamilia);
    } else {
      const ref = await db.collection("students").add(Object.assign({
        nombre: payload.nombreAlumno, creadoEn: new Date().toISOString()
      }, datosFamilia));
      studentId = ref.id;
    }
    const teacher = teacherById(payload.teacherId);
    const producto = productById(payload.productoId);
    const precioLista = producto ? producto.precio : 0;
    const descuento = Number(payload.descuento)||0;
    const montoTotal = Math.max(0, precioLista - descuento);
    const anticipo = Number(payload.anticipoMonto)||0;
    const pagos = anticipo > 0 ? [{ monto: anticipo, fecha: payload.anticipoFecha || todayISO(), nota: "Anticipo" }] : [];
    await db.collection("enrollments").add({
      studentId,
      studentNombre: payload.nombreAlumno,
      teacherId: payload.teacherId,
      teacherNombre: teacher ? teacher.nombre : "",
      productoId: producto ? producto.id : null,
      productoNombre: producto ? producto.nombre : "",
      tipo: producto ? producto.tipo : "paquete",
      totalClases: producto ? producto.totalClases : 1,
      precioLista,
      descuento,
      montoTotal,
      pagos,
      clasesDadas: 0,
      activo: true,
      creadoEn: new Date().toISOString()
    });
    toast("Alumno y paquete registrados");
  }

  async function addPayment(enrollmentId, monto, fecha){
    const enr = enrollmentById(enrollmentId);
    if(!enr) return;
    const nuevoPago = { monto: Number(monto)||0, fecha: fecha || todayISO(), nota: "Abono" };
    const pagos = (enr.pagos||[]).concat([nuevoPago]);
    await db.doc("enrollments/"+enr.id).update({ pagos });
    toast("Pago registrado");
  }

  async function scheduleClass(enrollmentId, fecha, hora){
    const enr = enrollmentById(enrollmentId);
    if(!enr) return;
    await db.collection("classes").add({
      enrollmentId,
      studentId: enr.studentId,
      studentNombre: enr.studentNombre,
      teacherId: enr.teacherId,
      teacherNombre: enr.teacherNombre,
      fecha, hora: hora || "",
      estado: "programada",
      pagada: false,
      creadoEn: new Date().toISOString()
    });
    toast("Clase agendada");
  }

  function fondoContribucionDeClase(cls){
    const enr = enrollmentById(cls.enrollmentId);
    const teacher = enr ? teacherById(enr.teacherId) : null;
    const precio = enr ? pricePerClass(enr) : 0;
    const tarifaPct = teacher ? (teacher.tarifa||0) : 0;
    const pagoMaestra = precio * (tarifaPct/100);
    return { precio, tarifaPct, pagoMaestra, monto: Math.max(0, precio - pagoMaestra) };
  }

  async function registrarMovimientoFondo(cls){
    const enr = enrollmentById(cls.enrollmentId);
    const { precio, tarifaPct, pagoMaestra, monto } = fondoContribucionDeClase(cls);
    const pct = (state.settings && state.settings.ahorroPct) || 0;
    await db.collection("fondoMovimientos").add({
      classId: cls.id,
      teacherId: enr ? enr.teacherId : cls.teacherId,
      fecha: cls.fecha,
      precio,
      tarifaPct,
      pagoMaestra,
      monto,
      ahorroIdealPct: pct,
      ahorroIdealMonto: monto * (pct/100),
      creadoEn: new Date().toISOString()
    });
  }

  async function eliminarMovimientoFondo(classId){
    const mov = state.fondoMovimientos.find(m => m.classId === classId);
    if(mov) await db.doc("fondoMovimientos/"+mov.id).delete();
  }

  async function setClassEstado(cls, estado){
    const prevEstado = cls.estado;
    await db.doc("classes/"+cls.id).update({ estado });
    if(estado === "dada" && prevEstado !== "dada"){
      const enr = enrollmentById(cls.enrollmentId);
      if(enr){
        await db.doc("enrollments/"+enr.id).update({ clasesDadas: (enr.clasesDadas||0) + 1 });
      }
      await registrarMovimientoFondo(cls);
    } else if(prevEstado === "dada" && estado !== "dada"){
      const enr = enrollmentById(cls.enrollmentId);
      if(enr){
        await db.doc("enrollments/"+enr.id).update({ clasesDadas: Math.max(0,(enr.clasesDadas||0) - 1) });
      }
      await eliminarMovimientoFondo(cls.id);
    }
    toast(estado === "dada" ? "Clase marcada como dada" : estado === "cancelada" ? "Clase cancelada" : "Clase actualizada");
  }

  async function deleteClass(cls){
    if(cls.estado === "dada"){
      const enr = enrollmentById(cls.enrollmentId);
      if(enr){
        await db.doc("enrollments/"+enr.id).update({ clasesDadas: Math.max(0,(enr.clasesDadas||0) - 1) });
      }
      await eliminarMovimientoFondo(cls.id);
    }
    await db.doc("classes/"+cls.id).delete();
    toast("Clase eliminada");
  }

  async function markTeacherPaid(teacherId, from, to){
    const targets = state.classes.filter(c =>
      c.teacherId === teacherId && c.estado === "dada" && !c.pagada &&
      c.fecha >= from && c.fecha <= to
    );
    for(const c of targets){
      await db.doc("classes/"+c.id).update({ pagada: true });
    }
    toast("Pago registrado para " + targets.length + " clase(s)");
  }

      fecha: payload.fecha,
      categoria: payload.categoria || "General",

  async function addFixedExpense(payload){

      diaPago: Number(payload.diaPago),

  function buildMonthCells(year, month){
    const first = new Date(year, month, 1);
    const startWeekday = (first.getDay() + 6) % 7; // Monday = 0
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();
    const cells = [];
    for(let i=0;i<startWeekday;i++){
      const d = daysInPrevMonth - startWeekday + 1 + i;
      const m = month === 0 ? 11 : month-1;
      const y = month === 0 ? year-1 : year;
      cells.push({date: isoFromParts(y, m+1, d), inMonth:false});
    }
    for(let d=1; d<=daysInMonth; d++){
      cells.push({date: isoFromParts(year, month+1, d), inMonth:true});
    }
    while(cells.length % 7 !== 0 || cells.length < 42){
      const last = cells[cells.length-1];
      const [y,m,d] = last.date.split("-").map(Number);
      const nd = new Date(y, m-1, d+1);
      cells.push({date: isoFromParts(nd.getFullYear(), nd.getMonth()+1, nd.getDate()), inMonth:false});
      if(cells.length >= 42) break;
    }
    return cells;
  }

  function renderCalendario(){
    if(state.teachers.length === 0){

    }
    const teacherId = state.calTeacherId;

    // pending per student for this teacher
    const pendingEnrolls = state.enrollments.filter(e => e.teacherId === teacherId && classesRemaining(e) > 0);
    const pendingHtml = pendingEnrolls.length ? pendingEnrolls.map(e => `
      <div class="pending-item">
        <div>
          <div class="class-main"><span class="who">${esc(e.studentNombre)}</span> — ${tipoLabel(e.tipo)}</div>

    // calendar grid
    const cells = buildMonthCells(state.calYear, state.calMonth);
    const classesByDate = {};
    state.classes.filter(c=>c.teacherId===teacherId).forEach(c=>{
      (classesByDate[c.fecha] = classesByDate[c.fecha] || []).push(c);
    });

    const cellsHtml = cells.map(c=>{
      const dayNum = Number(c.date.split("-")[2]);

            ${cl.estado !== "cancelada" ? `<button class="btn small secondary" data-action="class-estado" data-id="${cl.id}" data-estado="cancelada">Cancelar</button>` : ""}
            ${cl.estado === "cancelada" ? `<button class="btn small secondary" data-action="class-estado" data-id="${cl.id}" data-estado="programada">Reactivar</button>` : ""}
            <button class="btn small danger" data-action="delete-class" data-id="${cl.id}">Eliminar</button>
          </div>
        </div>
      `).join("") : `<div class="hint">Sin clases este día para esta maestra.</div>`;

      dayPanel = `
        <div class="day-panel card card-pad">
          <div class="section-title" style="border:none;padding:0;margin-bottom:8px;">${fmtDateShort(state.calSelectedDate)}</div>

          ${pendingEnrolls.length ? `

                    </select>

                  <div class="field"><label>Hora (opcional)</label><input type="text" name="hora" placeholder="4:00 pm"></div>
                </div>
                <button class="btn gold" type="submit">Agendar en este día</button>
              </form>
            </div>
          ` : ""}
        </div>
      `;
    }

    return `
      <div class="teacher-chips">${chips}</div>

      <div class="grid-2" style="align-items:start;">

            <button class="btn small secondary" data-action="cal-next">Siguiente ›</button>
          </div>

    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    state.corteFrom = isoFromParts(first.getFullYear(), first.getMonth()+1, 1);

      byTeacher[m.teacherId].clases++;
      byTeacher[m.teacherId].pagar += m.pagoMaestra;

  function fixedExpenseDatesInRange(fx, from, to){
    // returns list of ISO dates this fixed expense falls due within [from,to]
    const dates = [];
    const start = new Date(from+"T00:00:00");
    const end = new Date(to+"T00:00:00");
    let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
    while(cursor <= end){
      const y = cursor.getFullYear(), m = cursor.getMonth();
      const lastDay = new Date(y, m+1, 0).getDate();
      const day = Math.min(fx.diaPago||1, lastDay);
      const iso = isoFromParts(y, m+1, day);
      if(iso >= from && iso <= to) dates.push(iso);
      cursor = new Date(y, m+1, 1);
    }
    return dates;
  }
  function sumFixedExpensesInRange(from, to){
    let total = 0;
    state.fixedExpenses.filter(f=>f.activo!==false).forEach(fx=>{
      total += fixedExpenseDatesInRange(fx, from, to).length * (fx.monto||0);
    });
    return total;
  }

  function nextFixedDate(fx, todayIso){
    const [y,m,d] = todayIso.split("-").map(Number);
    const lastDayThis = new Date(y, m, 0).getDate();
    const dayThis = Math.min(fx.diaPago||1, lastDayThis);
    if(dayThis >= d) return isoFromParts(y, m, dayThis);
    const nm = m === 12 ? 1 : m+1;
    const ny = m === 12 ? y+1 : y;
    const lastDayNext = new Date(ny, nm, 0).getDate();
    return isoFromParts(ny, nm, Math.min(fx.diaPago||1, lastDayNext));
  }

  // ---------------------------------------------------------------
  // Event handling
  // ---------------------------------------------------------------
  function attachHandlers(){
    document.querySelectorAll("#nav-tabs button").forEach(b=>{
      b.onclick = () => { state.tab = b.dataset.tab; render(); };
    });

    const content = document.getElementById("content");

    content.onclick = async (e) => {
      const btn = e.target.closest("[data-action]");
      if(!btn) return;
      const action = btn.dataset.action;

      if(action === "toggle-add-teacher"){
        state.showAddTeacher = !state.showAddTeacher; render();
      } else if(action === "toggle-edit-teacher"){
        state.editingTeacherId = state.editingTeacherId === btn.dataset.id ? null : btn.dataset.id; render();
      } else if(action === "toggle-add-product"){
        state.showAddProduct = !state.showAddProduct; render();
      } else if(action === "delete-product"){
        if(confirm("¿Eliminar este producto? Los alumnos ya inscritos con él no se ven afectados.")) await deleteProduct(btn.dataset.id);
      } else if(action === "toggle-payment"){
        state.paymentFormFor = state.paymentFormFor === btn.dataset.id ? null : btn.dataset.id; render();
      } else if(action === "select-teacher"){
        state.calTeacherId = btn.dataset.id; state.calSelectedDate = null; render();
      } else if(action === "cal-prev"){
        state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;} render();
      } else if(action === "cal-next"){
        state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;} render();
      } else if(action === "select-day"){
        state.calSelectedDate = btn.dataset.date; render();
      } else if(action === "open-schedule"){
        const enrId = btn.dataset.enr;
        const enr = enrollmentById(enrId);
        if(enr){
          state.calSelectedDate = state.calSelectedDate || todayISO();
          render();
        }
      } else if(action === "class-estado"){
        const cls = state.classes.find(c=>c.id===btn.dataset.id);
        if(cls) await setClassEstado(cls, btn.dataset.estado);
      } else if(action === "delete-class"){
        const cls = state.classes.find(c=>c.id===btn.dataset.id);
        if(cls && confirm("¿Eliminar esta clase del calendario?")) await deleteClass(cls);
      } else if(action === "mark-paid"){
        if(confirm("¿Marcar como pagadas todas las clases pendientes de esta maestra en el rango seleccionado?")){
          await markTeacherPaid(btn.dataset.teacher, state.corteFrom, state.corteTo);
        }
      } else if(action === "range-hoy"){
        state.corteFrom = todayISO(); state.corteTo = todayISO(); render();
      } else if(action === "range-semana"){
        const d = new Date();
        const day = (d.getDay()+6)%7;
        const monday = new Date(d); monday.setDate(d.getDate()-day);
        state.corteFrom = isoFromParts(monday.getFullYear(),monday.getMonth()+1,monday.getDate());
        state.corteTo = todayISO(); render();
      } else if(action === "range-mes"){
        const d = new Date();
        state.corteFrom = isoFromParts(d.getFullYear(), d.getMonth()+1, 1);
        state.corteTo = todayISO(); render();
      } else if(action === "delete-expense"){
        if(confirm("¿Eliminar este gasto?")) await deleteExpense(btn.dataset.id);
      } else if(action === "delete-fixed"){
        if(confirm("¿Eliminar este gasto fijo?")) await deleteFixedExpense(btn.dataset.id);
      } else if(action === "delete-ahorro"){
        if(confirm("¿Eliminar este registro de ahorro?")) await deleteAhorro(btn.dataset.id);
      }
    };

    content.onchange = (e) => {
      if(e.target.id === "corte-from"){ state.corteFrom = e.target.value; render(); }
      if(e.target.id === "corte-to"){ state.corteTo = e.target.value; render(); }
    };

    const formTeacher = document.getElementById("form-teacher");
    if(formTeacher) formTeacher.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formTeacher);
      await addTeacher(fd.get("nombre"), fd.get("tarifa"));
      state.showAddTeacher = false;
      render();
    };

    const formTeacherEdit = document.getElementById("form-teacher-edit");
    if(formTeacherEdit) formTeacherEdit.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formTeacherEdit);
      await updateTeacher(formTeacherEdit.dataset.id, fd.get("nombre"), fd.get("tarifa"));
      state.editingTeacherId = null;
      render();
    };

    const formProduct = document.getElementById("form-product");
    if(formProduct) formProduct.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formProduct);
      await addProduct({nombre: fd.get("nombre"), tipo: fd.get("tipo"), totalClases: fd.get("totalClases"), precio: fd.get("precio")});
      state.showAddProduct = false;
      render();
    };
    const selProductTipo = document.getElementById("sel-product-tipo");
    const inputProductClases = document.getElementById("input-product-clases");
    if(selProductTipo && inputProductClases){
      const syncClases = () => {
        if(selProductTipo.value === "individual"){
          inputProductClases.value = 1;
          inputProductClases.disabled = true;
        } else {
          inputProductClases.disabled = false;
        }
      };
      selProductTipo.onchange = syncClases;
      syncClases();
    }

    const formStudent = document.getElementById("form-student");
    const selProducto = document.getElementById("sel-producto");
    const inputDescuento = document.getElementById("input-descuento");
    const displayTotal = document.getElementById("display-total");
    const productoInfo = document.getElementById("producto-info");
    function recalcTotal(){
      if(!selProducto) return;
      const opt = selProducto.options[selProducto.selectedIndex];
      const precio = opt ? Number(opt.dataset.precio||0) : 0;
      const clases = opt ? Number(opt.dataset.clases||0) : 0;
      const descuento = Number(inputDescuento ? inputDescuento.value : 0) || 0;
      const total = Math.max(0, precio - descuento);
      if(displayTotal) displayTotal.value = fmtMoney(total);
      if(productoInfo) productoInfo.textContent = (selProducto.value && clases) ? `Incluye ${clases} clase(s) · precio de lista ${fmtMoney(precio)}` : "";
    }
    if(selProducto) selProducto.onchange = recalcTotal;
    if(inputDescuento) inputDescuento.oninput = recalcTotal;
    recalcTotal();

    if(formStudent) formStudent.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formStudent);
      await addStudentWithPackage({
        nombreAlumno: fd.get("nombreAlumno"),
        telefono: fd.get("telefono"),
        nombrePapa: fd.get("nombrePapa"),
        nombreMama: fd.get("nombreMama"),
        cumpleanos: fd.get("cumpleanos"),
        productoId: fd.get("productoId"),
        descuento: fd.get("descuento"),
        anticipoMonto: fd.get("anticipoMonto"),
        anticipoFecha: fd.get("anticipoFecha"),
        teacherId: fd.get("teacherId")
      });
      formStudent.reset();

    const formPayment = document.getElementById("form-payment");

      e.preventDefault();
      const fd = new FormData(formPayment);
      await addPayment(formPayment.dataset.enr, fd.get("monto"), fd.get("fecha"));
      state.paymentFormFor = null;
      render();

    const formScheduleDay = document.getElementById("form-schedule-day");
    if(formScheduleDay) formScheduleDay.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formScheduleDay);
      await scheduleClass(fd.get("enrollmentId"), state.calSelectedDate, fd.get("hora"));
    };

    const formExpense = document.getElementById("form-expense");
    if(formExpense) formExpense.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formExpense);
      await addExpense({descripcion: fd.get("descripcion"), monto: fd.get("monto"), fecha: fd.get("fecha"), categoria: fd.get("categoria")});
      formExpense.reset();
    };

    const formFixed = document.getElementById("form-fixed");
    if(formFixed) formFixed.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formFixed);
      await addFixedExpense({descripcion: fd.get("descripcion"), monto: fd.get("monto"), diaPago: fd.get("diaPago")});
      formFixed.reset();
    };

    const formAhorroPct = document.getElementById("form-ahorro-pct");
    if(formAhorroPct) formAhorroPct.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formAhorroPct);
      const pct = Math.min(100, Math.max(0, Number(fd.get("ahorroPct"))||0));
      await updateSettings({ ahorroPct: pct });
      toast("Porcentaje de ahorro actualizado");
    };

    const formAhorro = document.getElementById("form-ahorro");
    if(formAhorro) formAhorro.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(formAhorro);
      await registrarAhorro(fd.get("monto"), todayISO());
      formAhorro.reset();
    };
  }

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  render();
  initDb();

})();
</script>
</body>
</html>
