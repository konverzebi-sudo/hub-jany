<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pide desde tu mesa</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111111;--ink:#FFFFFF;--muted:#A3A3A3;--brand:#F25C05}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 "Geist",system-ui,sans-serif;padding:24px 16px;text-align:center}
  main{max-width:420px;display:grid;gap:14px;justify-items:center}
  .mark{width:64px;height:64px;border-radius:18px;background:var(--brand);display:grid;place-items:center;font-size:30px}
  h1{margin:0;font-size:28px;letter-spacing:-.03em;line-height:1.15}
  p{margin:0;color:var(--muted)}
  a{color:var(--muted);font-size:13px;margin-top:24px}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">🍽️</div>
  <h1>Escanea el código QR de tu mesa para pedir</h1>
  <p>Lo encuentras pegado en la mesa. Se abre el menú y pides desde tu celular.</p>
  <a href="panel">Acceso para el personal</a>
</main>
</body>
</html>
