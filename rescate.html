<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Rescate de datos — Mi día</title>
<style>
  body{margin:0;background:#F5F2FF;background-image:linear-gradient(180deg,#ECE6FF 0%,#F5F2FF 260px);font-family:'Inter',system-ui,sans-serif;color:#1F1B3D;padding:20px 14px 60px;}
  .wrap{max-width:560px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 6px;}
  p{font-size:13px;color:#5B5784;line-height:1.45;margin:0 0 12px;}
  .card{background:#fff;border:1px solid #ECE8F8;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(95,70,190,.07);}
  .k{font-weight:700;font-size:13px;margin-bottom:6px;word-break:break-all;}
  .row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:#2F2A55;margin-bottom:10px;}
  .row b{color:#7C5CF2;}
  button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:#7C5CF2;color:#fff;margin-right:8px;}
  button.sec{background:#EFEAFF;color:#5B5784;font-weight:600;}
  .origen{font-size:11.5px;color:#8A86A8;margin-bottom:14px;word-break:break-all;}
  .msg{font-size:12.5px;color:#1F9D55;margin-top:8px;min-height:16px;}
  a{color:#7C5CF2;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Rescate de datos</h1>
  <p>Esta página solo <b>mira</b> lo que este navegador tiene guardado de tu dashboard. No abre el dashboard ni cambia nada hasta que toques “Usar este”.</p>
  <div class="origen" id="origen"></div>
  <div id="lista"></div>
  <p><a href="/XX/">‹ Volver a Mi día</a></p>
</div>
<script>
(function(){
  var lista = document.getElementById('lista');
  document.getElementById('origen').textContent = 'Navegador y dirección que estás viendo: ' + location.origin;
  function resumen(raw){
    try{
      var d = JSON.parse(raw), hc = d.habitChecks || {}, dias = Object.keys(hc), conHora = 0;
      dias.forEach(function(day){ Object.keys(hc[day] || {}).forEach(function(h){ var e = hc[day][h]; if(e && e.time) conHora++; }); });
      return {dias: dias.length, conHora: conHora, inicio: d.startDate || '—', proyectos: (d.products || []).length, agenda: (d.agenda || []).length,
        movs: (d.finMovements || []).length + (d.movements || []).length, hist: (d.history || []).length, subs: (d.subscriptions || []).length, bytes: raw.length};
    }catch(e){ return null; }
  }
  function keys(){
    var out = [];
    try{ for(var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if(k === 'jany-dashboard-v2' || k.indexOf('jany-respaldo-') === 0) out.push(k); } }catch(e){}
    return out.sort();
  }
  function pintar(msg){
    lista.innerHTML = '';
    var ks = keys();
    if(!ks.length){
      lista.innerHTML = '<div class="card"><div class="k">Aquí no hay datos del dashboard</div><p style="margin:0">Prueba abrir esta misma página en otro navegador de tu celular (Chrome, Samsung Internet…) y en las otras direcciones: <b>jefeshub.com/XX/rescate.html</b>, <b>agentes.jefeshub.com/XX/rescate.html</b> y <b>hub-jany.vercel.app/XX/rescate.html</b>.</p></div>';
      return;
    }
    ks.forEach(function(k){
      var raw = localStorage.getItem(k), r = resumen(raw);
      var card = document.createElement('div'); card.className = 'card';
      var titulo = k === 'jany-dashboard-v2' ? 'Lo que tiene el dashboard ahora en este navegador' : 'Copia de seguridad ' + k.replace('jany-respaldo-','');
      card.innerHTML = '<div class="k">' + titulo + '</div>' + (r ? '<div class="row"><span>Días de hábitos: <b>' + r.dias + '</b></span><span>Con hora: <b>' + r.conHora + '</b></span><span>Inicio: <b>' + r.inicio + '</b></span><span>Proyectos: <b>' + r.proyectos + '</b></span><span>Movimientos: <b>' + r.movs + '</b></span><span>Suscripciones: <b>' + r.subs + '</b></span><span>Historial: <b>' + r.hist + '</b></span></div>' : '<div class="row">No se pudo leer.</div>');
      var bd = document.createElement('button'); bd.className = 'sec'; bd.textContent = 'Descargar';
      bd.onclick = function(){ var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([raw], {type:'application/json'})); a.download = k + '.json'; a.click(); };
      card.appendChild(bd);
      if(k !== 'jany-dashboard-v2'){
        var bu = document.createElement('button'); bu.textContent = 'Usar este';
        bu.onclick = function(){
          try{
            localStorage.setItem('jany-respaldo-previo-' + Date.now(), localStorage.getItem('jany-dashboard-v2') || '{}');
            localStorage.setItem('jany-dashboard-v2', raw);
            pintar('Listo. Ahora abre Mi día: se une con lo que hay en línea y conserva tus días y horas.');
          }catch(e){ pintar('No se pudo: ' + e.message); }
        };
        card.appendChild(bu);
      }
      lista.appendChild(card);
    });
    if(msg){ var m = document.createElement('div'); m.className = 'msg'; m.textContent = msg; lista.appendChild(m); }
  }
  pintar();
})();
</script>
</body>
</html>
