  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --negro: #050505; --fondo: #050505; --verde: #c0f800; --verde-hover: #a7d800; --blanco: #ffffff; --pill: #17161F; --pill-borde: #272631; --punto: #5d5c68; }
    html { scroll-behavior: smooth; }
    body { background: var(--fondo); color: var(--blanco); font-family: 'Inter', sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

    /* ── Portada ── */
    .hero { background: var(--negro); max-width: 880px; margin: 28px auto 0; padding: 64px 24px 56px; text-align: center; border-radius: 6px; }
    .eyebrow-wrap { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 20px; opacity: 0; animation: fadeUp 0.6s ease forwards 0.1s; }
    .bracket { display: flex; flex-direction: column; gap: 5px; }
    .bracket-tl { width: 12px; height: 12px; border-top: 2px solid var(--verde); border-left: 2px solid var(--verde); opacity: 0.7; }
    .bracket-bl { width: 12px; height: 12px; border-bottom: 2px solid var(--verde); border-left: 2px solid var(--verde); opacity: 0.7; }
    .bracket-tr { width: 12px; height: 12px; border-top: 2px solid var(--verde); border-right: 2px solid var(--verde); opacity: 0.7; }
    .bracket-br { width: 12px; height: 12px; border-bottom: 2px solid var(--verde); border-right: 2px solid var(--verde); opacity: 0.7; }
    .eyebrow-text { font-size: 10px; font-weight: 600; letter-spacing: 0.25em; text-transform: uppercase; color: var(--verde); }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: clamp(72px, 14vw, 160px); line-height: 0.9; letter-spacing: 0.02em; margin-bottom: 28px; opacity: 0; animation: fadeUp 0.7s ease forwards 0.25s; }
    .logo .blanco { color: var(--blanco); }
    .logo .verde  { color: var(--verde); }
    .subtitulo { font-size: clamp(15px, 2vw, 19px); color: #999999; max-width: 520px; margin: 0 auto; line-height: 1.65; opacity: 0; animation: fadeUp 0.7s ease forwards 0.4s; }
    .subtitulo .verde { color: var(--verde); font-weight: 600; }

    /* ── Barra fija con el logo (aparece al bajar) ── */
    .minilogo { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; justify-content: center; padding: 10px 0; background: linear-gradient(to bottom, rgba(5,5,5,.95), rgba(5,5,5,0)); pointer-events: none; opacity: 0; transform: translateY(-12px); transition: opacity .25s ease, transform .25s ease; }
    .minilogo.on { opacity: 1; transform: none; }
    .minilogo span { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: .04em; line-height: 1; }
    .minilogo .v { color: var(--verde); }

    /* ── Línea de pasos ── */
    .tl { position: relative; display: grid; grid-template-columns: var(--split) 0 minmax(0, 1fr); align-items: center; max-width: 800px; margin: 0 auto; padding: 24px 20px 90px; --split: 38%; --p: 0; }
    .tl-linea { position: absolute; left: var(--split); top: 0; bottom: 118px; width: 3px; transform: translateX(-50%); background: repeating-linear-gradient(to bottom, var(--punto) 0 3px, transparent 3px 9px); pointer-events: none; }
    .tl-llena { position: absolute; left: var(--split); top: 0; width: 3px; height: calc(var(--p) * (100% - 118px)); max-height: calc(100% - 118px); transform: translateX(-50%); background: linear-gradient(to bottom, var(--verde), #8fd400); box-shadow: 0 0 12px rgba(192,248,0,.55); border-radius: 3px; pointer-events: none; }
    .tl-row { display: contents; color: inherit; text-decoration: none; }
    .tl-row > div { min-height: 56px; padding: 18px 0; }
    .tl-c { position: relative; z-index: 2; }
    .tl-c > span { position: absolute; left: 0; top: 50%; transform: translate(-50%, -50%); }
    .tl-n { width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 30% 25%, #e9ff7a, var(--verde) 55%, #9dcf00); color: #0a0a0a; font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: .02em; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 7px var(--fondo), 0 8px 20px rgba(160,210,0,.28); }
    .tl-row > .tl-r { padding-left: 46px; }
    .tl-label { display: inline-flex; align-items: center; gap: 12px; background: var(--pill); border: 1px solid var(--pill-borde); border-radius: 12px; padding: 14px 22px; font-size: 18px; font-weight: 500; letter-spacing: .01em; line-height: 1.25; text-transform: uppercase; color: var(--blanco); }
    .tl-label svg { width: 15px; height: 15px; flex: none; color: var(--verde); opacity: .65; }
    .tl-row:focus-visible .tl-label { outline: 2px solid var(--verde); outline-offset: 3px; }
    .tl-row.destacado .tl-n { box-shadow: 0 0 0 7px var(--fondo), 0 0 0 9px var(--verde), 0 8px 20px rgba(160,210,0,.28); }
    @media (max-width: 560px) { .tl { --split: 30%; } .tl-label { font-size: 15px; padding: 12px 16px; } .tl-n { width: 48px; height: 48px; font-size: 24px; } .tl-row > .tl-r { padding-left: 38px; } .hero { margin-top: 0; border-radius: 0; } }

    /* ── Movimiento ── */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: no-preference) {
      .tl-linea { animation: fluye 1.1s linear infinite; }
      @keyframes fluye { to { background-position: 0 9px; } }
      .js .tl-row .tl-n { opacity: 0; scale: .3; transition: opacity .5s ease, scale .55s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease; }
      .js .tl-row .tl-label { opacity: 0; translate: -18px 0; transition: opacity .5s ease .08s, translate .5s ease .08s, background .15s ease, border-color .15s ease, box-shadow .25s ease; }
      .js .tl-row.in .tl-n { opacity: 1; scale: 1; }
      .js .tl-row.in .tl-label { opacity: 1; translate: 0 0; }
      .tl-row:hover .tl-n { scale: 1.2; box-shadow: 0 0 0 7px var(--fondo), 0 0 0 10px rgba(192,248,0,.45), 0 12px 28px rgba(160,210,0,.5); }
      .tl-row:hover .tl-label { translate: 8px 0; background: #1f1e2a; border-color: var(--verde); box-shadow: 0 8px 22px rgba(0,0,0,.45); }
      .tl-row:hover .tl-label svg { opacity: 1; transform: translate(2px, -2px); }
      .tl-label svg { transition: transform .2s ease, opacity .2s ease; }
      .tl-row.destacado .tl-n { animation: pulso 2.2s ease-out 1.2s infinite; }
      @keyframes pulso { 0% { outline: 0 solid rgba(192,248,0,.4); outline-offset: 9px; } 100% { outline: 16px solid rgba(192,248,0,0); outline-offset: 9px; } }
      .logo .verde { animation: brillo 3.5s ease-in-out 1.2s infinite; }
      @keyframes brillo { 50% { text-shadow: 0 0 28px rgba(192,248,0,.55); } }
    }
    @media (prefers-reduced-motion: reduce) { .tl-llena { transition: none; } }
  </style>

<body>
  <div class="minilogo" id="minilogo" aria-hidden="true"><span>JEFES<span class="v">HUB</span></span></div>

  <script>
    (function () {
      document.documentElement.classList.add('js');
      var rows = document.querySelectorAll('.tl-row');
      // Los pasos entran uno a uno al aparecer en pantalla.
      if ('IntersectionObserver' in window) {
        // (las filas usan display:contents y no tienen caja: se observa su etiqueta)
        var io = new IntersectionObserver(function (es) {
          es.forEach(function (e) { if (e.isIntersecting) { e.target.closest('.tl-row').classList.add('in'); io.unobserve(e.target); } });
        }, { threshold: 0.2 });
        rows.forEach(function (r) { io.observe(r.querySelector('.tl-label')); });
        // Logo fijo arriba cuando la portada sale de la pantalla.
        var mini = document.getElementById('minilogo');
        new IntersectionObserver(function (es) { mini.classList.toggle('on', !es[0].isIntersecting && es[0].boundingClientRect.top < 0); }, { threshold: 0 }).observe(document.getElementById('hero'));
      } else { rows.forEach(function (r) { r.classList.add('in'); }); }
      // La línea se va llenando de verde conforme se baja.
      var tl = document.getElementById('tl');
      function progreso() {
        var r = tl.getBoundingClientRect(), vh = window.innerHeight;
        var p = (vh * 0.7 - r.top) / Math.max(1, r.height - 118);
        tl.style.setProperty('--p', Math.max(0, Math.min(1, p)).toFixed(3));
      }
      window.addEventListener('scroll', progreso, { passive: true });
      window.addEventListener('resize', progreso);
      progreso();
    })();
  </script>
