<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Crea tu contraseña · Taller</title>
<style>
  :root { --bg:#0F0B16; --card:#181120; --lime:#BBF802; --ink:#0F0B16; --text:#fff; --muted:#D6CFE0; --line:#332A3D; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family: Inter, system-ui, sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px; }
  .brand { font-family: 'JetBrains Mono', monospace; font-weight:700; font-size:14px; letter-spacing:.04em; }
  .brand span { color: var(--lime); }
  h1 { font-size:24px; margin:16px 0 8px; }
  p { color: var(--muted); line-height:1.5; font-size:15px; }
  label { display:block; font-size:13px; color: var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:#0F0B16; color:#fff; font-size:16px; }
  input[readonly] { opacity:.7; }
  button { width:100%; margin-top:20px; padding:13px; border:0; border-radius:12px; background:var(--lime); color:var(--ink); font-weight:700; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:14px; font-size:14px; color: var(--muted); min-height:20px; }
  .msg.err { color:#FF8A8A; }
  a { color: var(--lime); }
</style>
</head>
<body>
<div class="card">
  <div class="brand">JEFES<span>HUB</span></div>
  <h1>Crea tu contraseña</h1>
  <p>Ya tienes tu lugar en el taller. Crea tu contraseña una sola vez: después entras con tu correo y tu contraseña, desde cualquier equipo.</p>

  <form id="f">
    <label for="correo">Tu correo (el mismo con el que pagaste)</label>
    <input type="email" id="correo" required autocomplete="email">

    <label for="clave">Contraseña (mínimo 8 caracteres)</label>
    <input type="password" id="clave" required minlength="8" autocomplete="new-password">

    <label for="clave2">Repite tu contraseña</label>
    <input type="password" id="clave2" required minlength="8" autocomplete="new-password">

    <button id="b" type="submit">Crear mi contraseña y entrar</button>
  </form>
  <div class="msg" id="msg"></div>
</div>

<script src="taller-app/config.js"></script>
<script>
(function () {
  var CFG = window.TALLER_CONFIG || {};
  var URL_SB = (CFG.supabaseUrl || '').replace(/\/+$/, '');
  var KEY = CFG.supabaseAnonKey || '';
  var qs = new URLSearchParams(location.search);
  var taller = qs.get('taller') || CFG.taller || 'primer-agente';
  var correo = document.getElementById('correo');
  var msg = document.getElementById('msg');
  var b = document.getElementById('b');
  if (qs.get('email')) correo.value = qs.get('email');

  function mostrar(t, esError) { msg.className = 'msg' + (esError ? ' err' : ''); msg.innerHTML = t; }

  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var email = correo.value.trim().toLowerCase();
    var c1 = document.getElementById('clave').value;
    var c2 = document.getElementById('clave2').value;
    if (c1 !== c2) { mostrar('Las dos contraseñas no coinciden.', true); return; }
    if (c1.length < 8) { mostrar('La contraseña debe tener al menos 8 caracteres.', true); return; }
    b.disabled = true; mostrar('Creando tu contraseña…');
    try {
      var r = await fetch(URL_SB + '/auth/v1/signup', {
        method: 'POST',
        headers: { apikey: KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: c1 })
      });
      var d = await r.json();
      if (!r.ok) {
        var t = (d.msg || d.error_description || d.error || '').toLowerCase();
        if (t.indexOf('already') !== -1 || t.indexOf('registered') !== -1) {
          mostrar('Ese correo ya tiene contraseña. <a href="taller-app/?taller=' + encodeURIComponent(taller) + '">Entra aquí con tu contraseña</a>.', true);
        } else {
          mostrar('No pudimos crear tu contraseña. Revisa el correo y vuelve a intentar.', true);
        }
        b.disabled = false; return;
      }
      if (d.access_token) {
        var ref = URL_SB.replace(/^https?:\/\//, '').split('.')[0];
        localStorage.setItem('sb-' + ref + '-auth-token', JSON.stringify({
          access_token: d.access_token, refresh_token: d.refresh_token, token_type: d.token_type || 'bearer',
          expires_in: d.expires_in, expires_at: Math.floor(Date.now() / 1000) + (d.expires_in || 3600), user: d.user
        }));
        localStorage.setItem('taller-activo', taller);
        location.href = 'taller-app/?taller=' + encodeURIComponent(taller);
      } else {
        mostrar('Listo. Ya puedes <a href="taller-app/?taller=' + encodeURIComponent(taller) + '">entrar con tu correo y tu contraseña</a>.');
      }
    } catch (err) {
      mostrar('Sin conexión. Intenta de nuevo en un momento.', true);
      b.disabled = false;
    }
  });
})();
</script>
</body>
</html>
