<!DOCTYPE html>
<html lang="es">
<head>
<script src="/js/hub-tenant.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jefe de Contenido — JefesHub</title>
<link rel="icon" type="image/png" href="/img/fav/jefe-contenido.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Piel clara = mismos tokens que Jefe 366 */
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F0F0F0;
    --line:#E2E2E2;
    --text:#1A1A1A;
    --text-dim:#6B6B6B;
    --accent:#C0F800;
    --accent-soft:#F1FFC2;
    --accent-text:#4E7A00;
    --shadow-card:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06);
    --shadow-pop:0 12px 32px rgba(0,0,0,.14);
    --t1:#1E3A8A;--t2:#3B82C4;--t3:#38BDF8;--t4:#FACC15;--t5:#F5B21C;
    --t6:#FB923C;--t7:#F97316;--t8:#EF4444;--t9:#DC2626;--t10:#B91C1C;
    --adq:#6366F1;--adq-soft:#EEF0FF;
    --con:#0EA5E9;--con-soft:#E6F4FD;
    --conv:#16A34A;--conv-soft:#E6F8EC;
    /* estados (pastel suave) */
    --st-idea-bg:#EDEDED;--st-idea-fg:#555;
    --st-proceso-bg:#FFF1D6;--st-proceso-fg:#9A6200;
    --st-programado-bg:#E3F1FF;--st-programado-fg:#1F5FA8;
    --st-publicado-bg:#E3F6E8;--st-publicado-fg:#1F7A3A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding:28px 16px 80px;}
  h1,.display{font-family:'Sora',sans-serif;}
  .wrap{max-width:1400px;margin:0 auto;}
  .page-header{text-align:center;padding-top:62px;}
  h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin:0 0 8px;line-height:1.15;}
  .sub{color:var(--text-dim);font-size:16px;margin:0 auto 22px;line-height:1.5;max-width:640px;}
  .topbar{position:fixed;top:0;left:0;right:0;height:70px;z-index:60;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);}
  .topbar h1{justify-self:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  /* La barra lateral ocupa el borde izquierdo: el título se centra sobre el contenido, no sobre toda la pantalla. */
  body.jn-on .topbar h1{position:relative;left:calc(var(--jn-w) / 2);}
  @media (max-width:720px){ body.jn-on .topbar h1{left:0;} }
  .back-link{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;color:var(--text-dim);text-decoration:none;padding:7px 16px;border:1px solid var(--line);border-radius:100px;background:var(--surface);transition:.15s;}
  .back-link:hover{border-color:var(--accent);color:var(--accent-text);}
  .topbar-izq{justify-self:start;display:flex;align-items:center;gap:10px;min-width:0;max-width:100%;}
  .topbar-izq .back-link{flex:0 5 auto;min-width:0;}
  /* "<<" solo, en un círculo (igual que Jefe 366): el nombre del hub ya no se escribe ahí */
  .topbar .back-link{width:38px;height:38px;padding:0;border-radius:50%;justify-content:center;flex:0 0 auto;}
  .topbar .back-link .back-txt{display:none;}
  .topbar-izq #foco-slot{flex:0 0 auto;}
  @media (max-width:900px){
    /* En pantallas angostas la pastilla de foco baja a una segunda fila de la barra fija */
    body .topbar{height:auto;padding:8px 10px;grid-template-columns:44px minmax(0,1fr) 44px;grid-template-areas:"back titulo ." "foco foco foco";row-gap:8px;}
    .topbar h1{text-align:center;font-size:clamp(18px,5.5vw,22px);overflow:visible;text-overflow:clip;}
    .topbar-izq{display:contents;}
    .topbar-izq .back-link{grid-area:back;}
    .topbar-izq #foco-slot{grid-area:foco;}
    .topbar h1{grid-area:titulo;}
    body{padding-top:96px;}
  }
  *{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.22) transparent;}
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:8px;}
  *::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.36);}

  /* STATS BAR */
  .stats-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;}
  .stat-pill{display:flex;align-items:center;gap:6px;font-size:13.5px;font-family:'Inter',sans-serif;}
  .stat-pill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .stat-pill .dot-adq{background:var(--adq);}
  .stat-pill .dot-con{background:var(--con);}
  .stat-pill .dot-conv{background:var(--conv);}
  .stat-pill .dot-dim{background:var(--text-dim);}
  .stat-value{font-weight:600;color:var(--text);}
  .stat-label{color:var(--text-dim);}
  .stats-bar-track{flex:1;min-width:160px;display:flex;border-radius:6px;overflow:hidden;height:8px;align-self:center;}
  .track-seg{height:100%;transition:width .4s;}

  /* TOOLBAR */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  input[type=text].search,select.filter{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:var(--surface);color:var(--text);font-family:'Inter',sans-serif;outline:none;}
  input[type=text].search{width:200px;}
  input[type=text].search::placeholder{color:var(--text-dim);}
  input[type=text].search:focus,select.filter:focus{border-color:var(--accent);}
  .status{font-size:13px;color:var(--text-dim);margin:0;min-height:16px;font-family:'Inter',sans-serif;}

  /* SECTIONS & CARDS */
  .section{margin-bottom:30px;}
  .section-head{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;margin-bottom:14px;font-weight:700;font-size:15px;font-family:'Sora',sans-serif;}
  .section-head.proceso{background:var(--st-proceso-bg);color:var(--st-proceso-fg);}
  .section-head.programado{background:var(--st-programado-bg);color:var(--st-programado-fg);}
  .section-head.idea{background:var(--st-idea-bg);color:var(--st-idea-fg);}
  .section-head.publicado{background:var(--st-publicado-bg);color:var(--st-publicado-fg);}
  .section-head .scount{font-weight:400;opacity:.7;font-size:12px;font-family:'JetBrains Mono',monospace;}
  .empty-row{padding:18px;text-align:center;color:var(--text-dim);font-size:13px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px;align-items:start;}
  .cards-grid .wcard.mini{border-left:4px solid var(--accent);}
  .item-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--horizon,var(--t1));border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;touch-action:pan-y;box-shadow:var(--shadow-card);transition:transform .2s ease,box-shadow .2s ease;}
  .item-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop);}
  .item-top{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;}
  .item-top-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto;}
  .item-del{border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:14px;padding:5px 7px;border-radius:6px;opacity:.5;transition:.15s;}
  .item-del:hover{color:#EF4444;opacity:1;background:rgba(239,68,68,.1);}
  select.estado-select{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:5px 10px;border-radius:100px;border:1px solid transparent;cursor:pointer;}
  select.estado-select.idea{background:var(--st-idea-bg);color:var(--st-idea-fg);}
  select.estado-select.proceso{background:var(--st-proceso-bg);color:var(--st-proceso-fg);}
  select.estado-select.programado{background:var(--st-programado-bg);color:var(--st-programado-fg);}
  select.estado-select.publicado{background:var(--st-publicado-bg);color:var(--st-publicado-fg);}
  .fecha-input{width:138px;background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:13px;padding:5px 8px;outline:none;color-scheme:light;}
  .fecha-input:focus{border-color:var(--accent);color:var(--text);}
  textarea.gancho-input{width:100%;border:none;background:transparent;color:var(--text);font-family:'Sora',sans-serif;font-size:17px;font-weight:700;line-height:1.4;resize:none;padding:0;outline:none;min-height:24px;}
  .item-fase{font-size:13px;color:var(--text-dim);font-family:'Inter',sans-serif;}

  /* BADGES */
  .badges-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .badge{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-family:'Inter',sans-serif;font-weight:600;padding:3px 10px;border-radius:100px;letter-spacing:.02em;border:1px solid transparent;}
  .badge-adquisicion{background:var(--adq-soft);color:var(--adq);border-color:#D6DAFF;}
  .badge-consideracion{background:var(--con-soft);color:#0B76A8;border-color:#BFE4F7;}
  .badge-conversion{background:var(--conv-soft);color:#157A38;border-color:#BDEBCB;}
  .badge-fria{background:#EAF0F8;color:#4B6584;border-color:#D3DEEC;}
  .badge-tibia{background:#FBF1E1;color:#8A5A12;border-color:#F0DDBA;}
  .badge-caliente{background:#FFE9DD;color:#C2410C;border-color:#FBCFB4;}
  .badge-organico{background:#EEF0FF;color:#4F46E5;border-color:#D6DAFF;}
  .badge-evergreen{background:var(--accent-soft);color:var(--accent-text);border-color:#DDF59A;}
  .badge-ambos{background:#F1ECF9;color:#6B4BB0;border-color:#DDD2F0;}
  .badge-tipo{background:var(--surface-2);color:var(--text-dim);border-color:var(--line);}

  /* CARD DETAILS */
  .item-details{border-top:1px solid var(--line);padding-top:8px;}
  .item-details summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--accent-text);font-family:'Inter',sans-serif;list-style:none;display:flex;align-items:center;justify-content:space-between;}
  .item-details summary::-webkit-details-marker{display:none;}
  .detail-grid{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .detail-field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);font-family:'Inter',sans-serif;margin-bottom:4px;}
  .detail-field-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .detail-field-head label{margin-bottom:0;}
  .copy-field-btn{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:6px;line-height:1;}
  .copy-field-btn:hover{color:var(--accent-text);background:var(--accent-soft);}
  .detail-field textarea,.detail-field input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:9px 11px;resize:none;outline:none;line-height:1.5;}
  .detail-field textarea:focus,.detail-field input:focus{border-color:var(--accent);}
  .detail-field input.link-input{color:#1F5FA8;}
  .detail-meta-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn-guion{border:none;background:transparent;color:var(--accent-text);font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;padding:2px 0;opacity:.9;}
  .btn-guion:hover{opacity:1;}
  .guion-result{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;font-size:13px;line-height:1.7;white-space:pre-wrap;max-height:320px;overflow-y:auto;}

  /* CARPETA DE DOCUMENTOS (barra superior) */
  .carpeta-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px;}
  .carpeta-box label{font-size:10.5px;color:#1F5FA8;text-transform:uppercase;letter-spacing:.04em;font-family:'JetBrains Mono',monospace;}
  .carpeta-box input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:#1F5FA8;font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;outline:none;}
  .carpeta-box input[type=text]:focus{border-color:#1F5FA8;}
  .carpeta-box input[type=text]::placeholder{color:var(--text-dim);opacity:.7;}

  /* BANCO */
  .banco-add{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:26px;display:flex;flex-direction:column;gap:12px;}
  .banco-add-row{display:flex;gap:10px;flex-wrap:wrap;}
  .banco-add textarea{flex:1 1 300px;min-height:64px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;resize:vertical;outline:none;}
  .banco-add textarea:focus{border-color:var(--accent);}
  .banco-add input[type=text]{flex:1 1 200px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-size:14px;outline:none;}
  .banco-add input[type=text]:focus{border-color:var(--accent);}
  .banco-add-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .btn{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;padding:11px 18px;border-radius:10px;cursor:pointer;border:none;transition:.15s;}
  .btn-ghost{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-text);}
  .btn-ghost:hover{background:var(--accent);color:#1A1A1A;}
  .btn-solid{background:var(--accent);color:#1A1A1A;}
  .btn-solid:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5;cursor:wait;}
  .suggest-result{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:10px;padding:12px 14px;}
  .suggest-result label{display:block;font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;font-family:'JetBrains Mono',monospace;margin-bottom:4px;}
  .suggest-result textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13.5px;padding:8px 10px;resize:vertical;outline:none;}
  .suggest-result textarea:focus{border-color:var(--accent);}
  .suggest-status{font-size:12px;color:var(--text-dim);min-height:16px;}
  .suggest-status.error{color:#DC2626;}
  .banco-section-head{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;margin-bottom:10px;color:var(--text);}
  .banco-section-head .count{font-weight:400;opacity:.7;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text-dim);}
  .banco-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
  .banco-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .banco-item.aprobada{border-left:4px solid var(--accent);}
  .banco-item-text{flex:1;font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .banco-item-gancho{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;margin-bottom:4px;}
  .banco-item-caption{font-size:13px;color:var(--text-dim);white-space:pre-wrap;}
  .banco-item-link{font-size:12px;color:#1F5FA8;margin-top:6px;display:inline-block;word-break:break-all;}
  .banco-item-date{font-size:11px;color:var(--text-dim);margin-top:6px;font-family:'JetBrains Mono',monospace;}
  .banco-item-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);font-size:14px;}
  .icon-btn:hover{border-color:#EF4444;color:#EF4444;}
  .banco-empty{color:var(--text-dim);font-size:13px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px;}

  /* AGENTE TAB */
  .agente-wrap{display:flex;flex-direction:column;gap:16px;}
  .evergreen-panel{display:flex;flex-direction:column;gap:16px;}
  .agente-header{font-family:'Sora',sans-serif;font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:4px;}
  .mode-selector{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
  .mode-btn{padding:9px 16px;border-radius:100px;border:1px solid var(--line);background:var(--surface);color:var(--text-dim);font-size:14px;font-family:'Sora',sans-serif;font-weight:700;cursor:pointer;transition:.15s;}
  .mode-btn:hover{border-color:var(--accent);color:var(--accent-text);}
  .mode-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);}
  .mode-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;}
  .mode-panel-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;margin:0 0 4px;}
  .mode-panel-desc{font-size:14px;color:var(--text-dim);line-height:1.5;margin:0 0 6px;}
  .mode-field{display:flex;flex-direction:column;gap:4px;}
  .mode-field label{font-size:12.5px;font-weight:600;color:var(--text-dim);font-family:'Inter',sans-serif;}
  .mode-field input,.mode-field select,.mode-field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:10px 12px;outline:none;resize:vertical;}
  .mode-field input:focus,.mode-field select:focus,.mode-field textarea:focus{border-color:var(--accent);}
  .mode-fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mode-actions{display:flex;gap:10px;align-items:center;}
  .mode-output{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13.5px;line-height:1.8;white-space:pre-wrap;min-height:80px;color:var(--text);max-height:600px;overflow-y:auto;font-family:'Inter',sans-serif;}
  .mode-output-placeholder{color:var(--text-dim);font-style:italic;}
  .mode-status{font-size:13.5px;font-family:'Inter',sans-serif;color:var(--text-dim);}
  .mode-status.error{color:#DC2626;}

  /* IDEAS 366 */
  .evergreen-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 20px;}
  .evergreen-toolbar select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;outline:none;}
  .evergreen-selection-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;}
  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .cal-nav{display:flex;align-items:center;gap:10px;}
  .cal-nav button{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 14px;cursor:pointer;font-family:'Sora',sans-serif;font-weight:700;font-size:14px;}
  .cal-nav button:hover{border-color:var(--accent);color:var(--accent-text);}
  .cal-month-label{font-family:'Sora',sans-serif;font-weight:800;font-size:18px;min-width:150px;text-align:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-family:'Inter',sans-serif;font-weight:700;font-size:13px;color:var(--text-dim);text-align:center;padding-bottom:4px;}
  .cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;overflow:hidden;}
  .cal-cell.cal-empty{background:transparent;border:none;}
  .cal-cell.cal-today{border-color:var(--accent);}
  .cal-cell.cal-dragover{border-color:var(--accent);background:var(--accent-soft);}
  .cal-daynum{font-family:'Sora',sans-serif;font-weight:700;font-size:13.5px;color:var(--text-dim);}
  .cal-chip{font-size:12.5px;line-height:1.35;padding:4px 7px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--t1);cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-chip:active{cursor:grabbing;}
  .cal-chip.cal-chip-dragging{opacity:.4;}
  .cal-chip:hover{background:var(--accent-soft);}
  .cal-sinfecha{margin-top:18px;}
  .cal-sinfecha-title{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;margin-bottom:8px;}
  .cal-sinfecha-list{display:flex;flex-wrap:wrap;gap:6px;}
  .evergreen-cat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:14px;}
  .evergreen-cat-title{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;margin:0 0 4px;}
  .evergreen-cat-desc{color:var(--text-dim);font-size:12px;margin:0 0 12px;}
  .evergreen-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
  table.evergreen-table{width:100%;border-collapse:collapse;min-width:640px;}
  table.evergreen-table th{text-align:left;font-size:12.5px;font-weight:700;color:var(--text-dim);font-family:'Inter',sans-serif;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);}
  table.evergreen-table td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.evergreen-table tr:last-child td{border-bottom:none;}
  table.evergreen-table textarea{width:100%;min-height:44px;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--text);padding:7px 8px;font-family:Inter,sans-serif;font-size:14px;outline:none;resize:vertical;}
  table.evergreen-table textarea:hover{border-color:var(--line);}
  table.evergreen-table textarea:focus{border-color:var(--accent);background:var(--surface-2);}
  .evergreen-row-del{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;padding:4px 8px;}
  .evergreen-row-del:hover{color:#EF4444;}
  .evergreen-row-add{background:transparent;border:1px dashed var(--line);color:var(--text-dim);font-family:Inter,sans-serif;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer;}
  .evergreen-row-add:hover{border-color:var(--accent);color:var(--accent-text);}
  .mode-add-banco{border:none;background:transparent;color:var(--accent-text);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;padding:0;font-weight:700;}
  .mode-add-banco:hover{text-decoration:underline;}

  /* CHAT — Consulta en vivo con el Agente (Post IA) */
  .chat-thread{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow-y:auto;}
  .chat-msg{border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.7;white-space:pre-wrap;font-family:'Inter',sans-serif;max-width:92%;}
  .chat-msg-user{background:var(--accent-soft);border:1px solid var(--accent);color:var(--text);align-self:flex-end;}
  .chat-msg-assistant{background:var(--surface-2);border:1px solid var(--line);color:var(--text);align-self:flex-start;}
  .chat-msg-actions{display:flex;gap:14px;margin-top:8px;}
  .chat-msg-actions button{border:none;background:transparent;color:var(--accent-text);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;padding:0;font-weight:700;}
  .chat-msg-actions button:hover{text-decoration:underline;}
  .chat-msg-actions button.done{color:#157A38;pointer-events:none;}
  .chat-empty{color:var(--text-dim);font-style:italic;font-size:13px;}

  /* BANCO IDEAS TABLE v2 */
  .banco-v2{display:flex;flex-direction:column;gap:16px;}
  .banco-registrador{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;}
  .banco-reg-label{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;margin-bottom:10px;color:var(--text);}
  .banco-reg-row{display:flex;gap:10px;align-items:flex-start;}
  .banco-reg-row textarea{flex:1;min-height:64px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;resize:vertical;outline:none;}
  .banco-reg-row textarea:focus{border-color:var(--accent);}
  .banco-ideas-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
  .banco-ideas-title{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;color:var(--text);}
  .banco-selection-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .btn-outline{font-family:'Inter',sans-serif;font-weight:600;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text-dim);transition:.15s;}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent-text);}
  .btn-outline.to-historias:hover{border-color:var(--adq);color:var(--adq);}
  .btn-outline.to-contenido:hover{border-color:var(--conv);color:var(--conv);}
  .ideas-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;}
  .ideas-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .ideas-table th{background:var(--surface-2);color:var(--text-dim);font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);}
  .ideas-table th:first-child{width:36px;text-align:center;}
  .ideas-table td{padding:9px 12px;vertical-align:top;border-bottom:1px solid var(--line);color:var(--text);line-height:1.45;}
  .ideas-table tr:last-child td{border-bottom:none;}
  .ideas-table tr.ai-gen td:not(:first-child):not(:last-child){color:#157A38;}
  .ideas-table tr.ai-gen{background:rgba(34,197,94,.04);}
  .ideas-table tr:hover{background:var(--surface-2);}
  .ideas-table tr.ai-gen:hover{background:rgba(34,197,94,.08);}
  .ideas-table td.idea-cell{font-weight:600;font-family:'Sora',sans-serif;min-width:180px;max-width:220px;}
  .ideas-table td.angle-cell{min-width:160px;max-width:200px;font-size:11px;}
  .ideas-table td.uso-cell,.ideas-table td.pri-cell{white-space:nowrap;min-width:80px;}
  .pri-alta{color:#157A38;font-weight:700;}
  .pri-media{color:#9A6200;font-weight:700;}
  .pri-baja{color:var(--text-dim);font-weight:700;}
  .ideas-empty-row td{padding:40px;text-align:center;color:var(--text-dim);font-size:13px;}
  .row-del{border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:13px;padding:2px 4px;opacity:.4;transition:.15s;}
  .row-del:hover{color:#EF4444;opacity:1;}
  .hist-limit-notice{font-size:12px;color:var(--text-dim);padding:14px 0;text-align:center;font-family:'JetBrains Mono',monospace;border-top:1px solid var(--line);margin-top:6px;}

  /* sidebar compartido sobre fondo blanco */
  .jn-item:hover{background:rgba(0,0,0,.05)!important;}

  /* ═══ DISEÑO WIDGET (estilo Henry, colores Jefe 366) ═══════════════════════════════ */
  .cx{max-width:1180px;margin:0 auto;padding-top:56px;display:flex;flex-direction:column;gap:28px;}
  .link-btn{border:none;background:transparent;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;padding:6px 10px;border-radius:8px;transition:.15s;}
  .link-btn:hover{color:var(--accent-text);background:var(--accent-soft);}
  .link-btn[hidden]{display:none;}

  /* tooltips */
  [data-tip]{position:relative;}
  [data-tip]::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 10px);transform:translate(-50%,-4px);background:#1A1A1A;color:#fff;font:600 13px/1.35 'Inter',sans-serif;padding:7px 11px;border-radius:9px;white-space:nowrap;max-width:260px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:40;}
  [data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0);}

  /* círculos de enlaces */
  .cx-icons{display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
  .cx-ic{display:flex;align-items:center;gap:8px;position:relative;}
  .cx-circle{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;box-shadow:var(--shadow-card);transition:transform .18s ease,border-color .18s,background .18s,box-shadow .18s;padding:0;}
  .cx-circle svg{width:22px;height:22px;}
  .cx-circle:hover{transform:translateY(-2px);border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow-pop);}
  .cx-circle:active{transform:scale(.95);}
  .cx-circle.vacio{border-style:dashed;color:var(--text-dim);}
  .cx-edit{position:absolute;left:30px;top:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text-dim);font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s;padding:0;}
  .cx-ic:hover .cx-edit,.cx-edit:focus-visible{opacity:1;}
  .cx-edit:hover{color:var(--accent-text);border-color:var(--accent);}
  .cx-pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:4px 6px 4px 14px;box-shadow:var(--shadow-card);animation:cxSlide .22s ease both;}
  .cx-pill:focus-within{border-color:var(--accent);}
  .cx-pill input{border:none;outline:none;background:transparent;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);width:200px;max-width:42vw;padding:6px 0;}
  .cx-pill input::placeholder{color:var(--text-dim);}
  .cx-pill button{border:none;background:var(--accent);color:#1A1A1A;font:700 13px 'Sora',sans-serif;padding:7px 12px;border-radius:100px;cursor:pointer;}
  .cx-pill button.ghost{background:transparent;color:var(--text-dim);padding:7px 8px;}
  .cx-pop{position:absolute;left:0;top:calc(100% + 10px);z-index:50;min-width:290px;max-width:min(92vw,360px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-pop);padding:14px;display:flex;flex-direction:column;gap:10px;animation:cxSlide .2s ease both;}
  .cx-pop h4{margin:0;font:700 15px 'Sora',sans-serif;}
  .cx-pop p{margin:0;font-size:13.5px;color:var(--text-dim);line-height:1.45;}
  .cx-ins-row{display:flex;align-items:center;gap:8px;}
  .cx-ins-row a{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font:600 14px 'Inter',sans-serif;padding:8px 10px;border-radius:10px;border:1px solid var(--line);transition:.15s;}
  .cx-ins-row a:hover{border-color:var(--accent);background:var(--accent-soft);}
  .cx-ins-row a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cx-net{flex:0 0 auto;font:700 11px 'JetBrains Mono',monospace;color:#fff;border-radius:6px;padding:3px 6px;}
  .cx-net.ig{background:#D6336C;}.cx-net.tt{background:#1A1A1A;}.cx-net.fb{background:#1F5FA8;}.cx-net.web{background:#6B6B6B;}
  .cx-ins-del{border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:14px;padding:6px;border-radius:8px;}
  .cx-ins-del:hover{color:#DC2626;background:#FDECEC;}
  @keyframes cxSlide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

  /* hero */
  .cx-hero{display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;}
  .hero-robot{width:clamp(96px,16vw,128px);height:auto;display:block;margin:0 auto 18px;animation:cxFloat 5s ease-in-out infinite;}
  .hero-logo{width:clamp(108px,16vw,136px);height:clamp(108px,16vw,136px);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;animation:cxFloat 5s ease-in-out infinite;}
  .hero-logo img{width:100%;height:100%;object-fit:contain;display:block;}
  @keyframes cxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .hero-search{display:flex;align-items:center;gap:12px;width:100%;max-width:820px;margin:0 auto 10px;padding:8px 10px 8px 18px;min-height:62px;background:var(--surface);border:1px solid var(--line);border-radius:32px;box-shadow:0 8px 30px rgba(0,0,0,.10);transition:border-color .18s,box-shadow .18s;text-align:left;}
  .hero-search:focus-within{border-color:var(--accent);box-shadow:0 8px 30px rgba(0,0,0,.10),0 0 0 4px rgba(192,248,0,.28);}
  .hero-attach{flex:0 0 auto;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;border-radius:50%;transition:.15s;}
  .hero-attach:hover{color:var(--accent-text);background:var(--accent-soft);}
  .hero-attach svg{width:22px;height:22px;}
  .hero-search-sep{flex:0 0 1px;align-self:stretch;margin:12px 0;background:var(--line);}
  .hero-search textarea{flex:1 1 auto;min-width:0;background:transparent;border:none;outline:none;resize:none;color:var(--text);font-family:'Inter',sans-serif;font-size:17px;line-height:1.45;padding:10px 0;max-height:150px;overflow-y:hidden;}
  .hero-search textarea::placeholder{color:var(--text-dim);opacity:.85;}
  .hero-search-send{flex:0 0 auto;background:transparent;border:none;padding:0;cursor:pointer;display:flex;align-items:center;}
  .hero-search-send:disabled{opacity:.5;cursor:wait;}
  .hero-search-bot{width:42px;height:42px;transition:transform .15s;}
  .hero-search-send:hover .hero-search-bot{transform:scale(1.1) rotate(-4deg);}
  #hero-bar{position:relative;}
  .go-sug{position:absolute;top:calc(100% + 6px);left:12px;right:12px;z-index:40;display:flex;flex-direction:column;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 36px rgba(0,0,0,.16);text-align:left;}
  .go-sug[hidden]{display:none;}
  .go-sug-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:none;border-radius:14px;background:transparent;color:var(--text);font:500 16px 'Inter',sans-serif;text-align:left;cursor:pointer;}
  .go-sug-item svg{flex:0 0 auto;width:18px;height:18px;color:var(--accent-text);}
  .go-sug-item.on svg,.go-sug-item:hover svg{color:#1A1A1A;}
  .go-sug-item:hover,.go-sug-item.on{background:var(--surface-2);}
  .chat-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .chat-chip{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--text);font:700 14px 'Sora',sans-serif;padding:9px 16px;border-radius:100px;cursor:pointer;transition:.15s;}
  .chat-chip:hover{background:var(--accent);color:#1A1A1A;transform:translateY(-1px);}
  .hero-previews{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .hero-previews:not(:empty){margin:4px 0 8px;}
  .hero-meta{display:flex;align-items:center;gap:12px;justify-content:center;min-height:22px;margin-bottom:6px;}
  .hero-meta .mode-status{font-family:'Inter',sans-serif;font-size:14px;}
  #go-chat-thread{width:100%;max-width:880px;margin:6px auto 14px;text-align:left;}
  #go-chat-thread[hidden]{display:none;}
  /* Chat abierto = estilo WhatsApp: las respuestas arriba y la barra para escribir abajo, debajo de la última. */
  .cx-hero.has-chat #go-chat-thread{order:1;margin:14px auto 10px;padding:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:26px;max-height:min(58vh,560px);}
  .cx-hero.has-chat .hero-search{order:2;}
  .cx-hero.has-chat .hero-previews{order:3;}
  .cx-hero.has-chat .hero-meta{order:4;}
  .cx-hero.has-chat .group-tabs{order:5;}
  .cx-hero.has-chat #go-chat-thread .chat-msg{font-size:16px;line-height:1.6;}
  .cx-hero.has-chat #go-chat-thread .chat-msg-user{background:var(--accent);border-color:var(--accent);color:#1A1A1A;border-radius:20px 20px 6px 20px;}
  .cx-hero.has-chat #go-chat-thread .chat-msg-assistant{background:var(--surface);border-radius:20px 20px 20px 6px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .chat-typing{display:inline-flex;gap:5px;align-items:center;padding:14px 18px;width:fit-content;}
  .chat-typing span{width:8px;height:8px;border-radius:50%;background:var(--text-dim);opacity:.45;animation:chatDot 1.1s infinite ease-in-out;}
  .chat-typing span:nth-child(2){animation-delay:.18s;}
  .chat-typing span:nth-child(3){animation-delay:.36s;}
  @keyframes chatDot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
  @media (prefers-reduced-motion:reduce){.chat-typing span{animation:none;}}
  .group-tabs{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
    .group-tab{font-family:'Sora',sans-serif;font-size:clamp(14px,1.8vw,17px);font-weight:700;padding:11px 30px;border-radius:12px;border:1.5px solid #0F0B16;background:#0F0B16;color:#fff;cursor:pointer;transition:background .18s,color .18s,border-color .18s,transform .15s,box-shadow .18s;}
  .group-tab:hover{background:#241C36;border-color:#241C36;color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,11,22,.28);}
  .group-tab:active{transform:scale(.96);}
  .group-tab.active{background:#0F0B16;border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px rgba(192,248,0,.35);}

  /* despliegue suave */
  .unfold{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .32s ease,opacity .25s ease;}
  .unfold.open{grid-template-rows:1fr;opacity:1;}
  .unfold-inner{min-height:0;overflow:hidden;}
  .unfold.open.settled .unfold-inner{overflow:visible;}

  /* widget */
  .cx-widget{display:flex;flex-direction:column;gap:30px;}
  .wsec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .wsec-title{display:flex;align-items:center;gap:10px;font:800 clamp(20px,2.6vw,26px) 'Sora',sans-serif;border:none;background:transparent;color:var(--text);cursor:pointer;padding:0;}
  .wsec-title .arrow{font-size:18px;color:var(--text-dim);transition:transform .18s,color .18s;}
  .wsec-title:hover .arrow{transform:translateX(4px);color:var(--accent-text);}
  .wnav{display:flex;align-items:center;gap:6px;}
  .wnav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:17px;cursor:pointer;transition:.15s;}
  .wnav button:hover{border-color:var(--accent);background:var(--accent-soft);}
  .wnav button:active{transform:scale(.92);}
  .wnav .hoy-btn{width:auto;padding:0 16px;border-radius:100px;font:700 14px 'Sora',sans-serif;}
  .wstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;}
  .wcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow-card);transition:transform .2s ease,box-shadow .2s ease,border-color .2s;text-align:left;font-family:inherit;color:inherit;padding:0;width:100%;}
  .wcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-pop);border-color:#D2D2D2;}
  .wcard:active{transform:scale(.985);}
  .wcard.dragging{opacity:.45;}
  .wthumb{position:relative;height:118px;background:linear-gradient(135deg,var(--thumb-a,#EDEDED),var(--thumb-b,#D8D8D8));display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .wthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s ease;}
  .wcard:hover .wthumb img{transform:scale(1.05);}
  .wthumb-ico{font-size:34px;opacity:.55;}
  .wnuevo{position:absolute;right:8px;top:8px;background:#1A1A1A;color:var(--accent);font:800 12px 'Sora',sans-serif;padding:4px 10px;border-radius:100px;}
  .wchip{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.94);color:#1A1A1A;font:700 12px 'Inter',sans-serif;padding:4px 10px;border-radius:100px;box-shadow:0 1px 3px rgba(0,0,0,.15);}
  .wplay{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:rgba(26,26,26,.78);display:flex;align-items:center;justify-content:center;}
  .wplay::after{content:"";border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px;}
  .wbody{padding:12px 12px 12px;display:flex;flex-direction:column;gap:9px;}
  .wtitle{font:700 15px/1.35 'Sora',sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}
  .wnets{display:flex;gap:5px;flex-wrap:wrap;}
  .wnet{font:700 11.5px 'Inter',sans-serif;padding:2px 8px;border-radius:100px;border:1px solid var(--line);color:var(--text-dim);background:var(--surface-2);}
  .wfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .wpill{font:700 12.5px 'Inter',sans-serif;padding:4px 11px;border-radius:100px;}
  .wpill.idea{background:var(--st-idea-bg);color:var(--st-idea-fg);}
  .wpill.proceso{background:var(--st-proceso-bg);color:var(--st-proceso-fg);}

function pasaFoco(r){
  const f = window.__foco ? window.__foco.get() : null;
  if(!f || f.esTodo) return true;
  if(f.productoId) return r.productoId===f.productoId;
  if(f.esGrupo && f.grupoId){
    const p = productosCatalogo().find(x=>x.id===r.productoId);
    return !!p && p.grupo_id===f.grupoId;
  }
  return true;
}

// ─── DATE / HORIZON ─────────────────────────────────────────────────────────
// Fechas se guardan en ISO "YYYY-MM-DD" (input type=date); se soporta el "dd/mm" viejo
// por si algún item no pasó por la migración todavía.
function parseFecha(str){
  if(!str) return null;
  const iso=str.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(iso){
    const d=new Date(+iso[1],+iso[2]-1,+iso[3]);
    return isNaN(d) ? null : d;
  }
  const dm=str.trim().match(/^(\d{1,2})\/(\d{1,2})$/);
  if(dm){
    const day=parseInt(dm[1],10),month=parseInt(dm[2],10)-1;
    if(month<0||month>11||day<1||day>31) return null;
    const now=new Date();
    let d=new Date(now.getFullYear(),month,day);
    if((now-d)/86400000>30) d=new Date(now.getFullYear()+1,month,day);
    return d;
  }
  return null;
}
// Ordena por fecha real: ascendente = más próxima primero (proceso/programado/idea);
// descendente = publicada más reciente primero. Sin fecha, siempre al final.
function ordenarPorFecha(rows, ascendente){
  return rows.slice().sort((a,b)=>{
    const da=parseFecha(a.fecha), db=parseFecha(b.fecha);
    if(da && db) return ascendente ? da-db : db-da;
    if(da && !db) return -1;
    if(!da && db) return 1;
    return 0;
  });
}
function fechaHorizonIndex(fechaStr){
  const d=parseFecha(fechaStr);
  if(!d) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const days=Math.round((d-today)/86400000);
  if(days<=14) return 9;
  const span=120,t=Math.min(1,Math.max(0,(days-14)/(span-14)));
  return Math.max(0,Math.min(8,Math.round(8-t*8)));
}
const WEEK_HORIZON_INDEX={1:9,2:7,3:4,4:1};
function weekFromFase(fase){
  if(!fase) return null;
  const m=fase.match(/Semana\s*(\d+)/i);
  if(!m) return null;
  const w=parseInt(m[1],10);
  return (w>=1&&w<=4)?w:null;
}
function horizonIndex(item){
  const byFecha=fechaHorizonIndex(item.fecha);
  if(byFecha!==null) return byFecha;
  const week=weekFromFase(item.fase);
  if(week!==null) return WEEK_HORIZON_INDEX[week];
  return 0;
}
function horizonColorVar(item){ return 'var(--t'+(horizonIndex(item)+1)+')'; }

async function generateGuion(id, destino, datos){
  const hit=id?findItem(id):null;
  const row=datos||(hit&&hit.row);
  if(!row) return;
  const d=getDefaults(row);
  const etapa=row.etapa||d.etapa;
  const tipo=row.tipo||d.tipo;
  const audiencia=row.audiencia||d.audiencia;
  const uso=row.uso||d.uso;
  const el=destino||document.getElementById('guion-'+id);
  if(!el) return;
  const esCampo=el.tagName==='TEXTAREA';
  const poner=(t)=>{ if(esCampo){ el.value=t; el.dispatchEvent(new Event('input',{bubbles:true})); } else { el.textContent=t; } };
  if(esCampo){ el.placeholder='⏳ Generando guión...'; } else { el.hidden=false; el.textContent='⏳ Generando guión...'; }

  const prompt=`${NEGOCIO_CONTEXT}

Actúa como Guionista de Contenido. Genera un guión para esta pieza:
GANCHO: ${row.gancho}
DESCRIPCIÓN: ${row.descripcion}
ETAPA: ${etapa} · AUDIENCIA: ${audiencia} · TIPO: ${tipo} · USO: ${uso}
DOLOR: ${row.dolor||'(ver descripción)'}

Entrega en formato:
HOOK (primeros 3-5 seg): …
GANCHO ESCRITO: …
PROBLEMA/SITUACIÓN: …
SOLUCIÓN/INSIGHT: …
CTA: …
DURACIÓN SUGERIDA: …
NOTAS DE GRABACIÓN: …`;

  try{
    const res=await fetch('/api/sugerir-contenido',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea:prompt})});
    const data=await res.json();
    if(!res.ok){ if(esCampo) alert('Error: '+(data.error||'No se pudo generar.')); else el.textContent='Error: '+(data.error||'No se pudo generar.'); return; }
    const texto=data.respuesta||data.guion||(data.gancho?(data.gancho+(data.caption?'\n\n'+data.caption:'')):'');
    poner(texto||JSON.stringify(data,null,2));
  }catch(e){
    if(esCampo) alert('Error de conexión. Intenta de nuevo.'); else el.textContent='Error de conexión. Intenta de nuevo.';
  }
}

function parseIdeaJSON(text){
  if(!text) return null;
  let t=text.trim().replace(/```json\s*/g,'').replace(/```\s*/g,'');
  const arrM=t.match(/\[[\s\S]*\]/);
  if(arrM){ try{ return JSON.parse(arrM[0]); }catch(e){} }
  const objM=t.match(/\{[\s\S]*\}/);
  if(objM){ try{ return [JSON.parse(objM[0])]; }catch(e){} }
  return null;
}

function anguloToNotas(item){
  const partes=[];
  if(item.problema) partes.push(`Problema: ${item.problema}`);
  if(item.error) partes.push(`Error: ${item.error}`);
  if(item.deseo) partes.push(`Deseo: ${item.deseo}`);
  if(item.historia) partes.push(`Historia: ${item.historia}`);
  if(item.descubrimiento) partes.push(`Descubrimiento: ${item.descubrimiento}`);
  if(item.objecion) partes.push(`Objeción: ${item.objecion}`);
  if(item.comparacion) partes.push(`Comparación: ${item.comparacion}`);
  if(item.uso||item.uso_sugerido) partes.push(`Uso sugerido: ${item.uso||item.uso_sugerido}`);
  return partes.join('\n');
}

function diaMesDeFecha(str){
  const m=(str||'').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  const year=parseInt(m[1],10), month=parseInt(m[2],10), day=parseInt(m[3],10);
  if(month<1||month>12||day<1||day>31) return null;
  return {year, month, day};
}

function fechaISO(anio, mes, dia){

      <button type="button" data-cal="historias" class="${calFiltro==='historias'?'on':''}">Historias</button>
    </div>
  `;
  wrap.appendChild(toolbar);

  const allItems=[
    ...(calFiltro==='contenido'?[]:state.historias.filter(pasaFoco).map(r=>({...r,_tab:'historias',_icon:'⭕'}))),
    ...(calFiltro==='historias'?[]:state.contenido.filter(pasaFoco).map(r=>({...r,_tab:'contenido',_icon:'🎬'}))),
  ];

  const porDia={};
  const sinFecha=[];
  allItems.forEach(item=>{
    const dm=diaMesDeFecha(item.fecha);
    if(!dm){ sinFecha.push(item); return; }
    const key=dm.year+'-'+dm.month+'-'+dm.day;
    if(!porDia[key]) porDia[key]=[];
    porDia[key].push(item);
  });

  const primerDiaSemana=(new Date(calYear,calMonth,1).getDay()+6)%7; // lunes=0
  const diasEnMes=new Date(calYear,calMonth+1,0).getDate();
  const hoy=new Date();
  const esHoy=(d)=> hoy.getFullYear()===calYear && hoy.getMonth()===calMonth && hoy.getDate()===d;

  function chipFor(item){
    const chip=document.createElement('div');
    chip.className='cal-chip';
    chip.style.borderLeftColor=horizonColorVar(item);
    chip.textContent=`${item._icon} ${item.gancho||'(sin título)'}`;
    chip.title=item.gancho||'';
    chip.draggable=true;
    chip.addEventListener('click',()=>irACalendarioItem(item._tab,item.id,item.gancho));
    chip.addEventListener('dragstart',(e)=>{
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain', JSON.stringify({tab:item._tab, id:item.id}));
      chip.classList.add('cal-chip-dragging');
    });
    chip.addEventListener('dragend',()=>chip.classList.remove('cal-chip-dragging'));
    return chip;
  }

  const grid=document.createElement('div');
  grid.className='cal-grid';
  ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d=>{
    const el=document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el);
  });
  for(let i=0;i<primerDiaSemana;i++){ const el=document.createElement('div'); el.className='cal-cell cal-empty'; grid.appendChild(el); }
  for(let d=1; d<=diasEnMes; d++){
    const cell=document.createElement('div');
    cell.className='cal-cell'+(esHoy(d)?' cal-today':'');
    cell.addEventListener('dragover',(e)=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; cell.classList.add('cal-dragover'); });
    cell.addEventListener('dragleave',()=>cell.classList.remove('cal-dragover'));
    cell.addEventListener('drop',(e)=>{
      e.preventDefault();
      cell.classList.remove('cal-dragover');
      let data;
      try{ data=JSON.parse(e.dataTransfer.getData('text/plain')); }catch(err){ return; }
      if(!data||!data.tab||!data.id) return;
      moverItemACalendarioFecha(data.tab, data.id, d, calMonth+1, calYear);
    });
    const items=porDia[calYear+'-'+(calMonth+1)+'-'+d]||[];
    const dayNum=document.createElement('div');
    dayNum.className='cal-daynum';
    dayNum.textContent=d;
    cell.appendChild(dayNum);
    items.forEach(item=>cell.appendChild(chipFor(item)));
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);

  if(sinFecha.length){
    const sf=document.createElement('div');
    sf.className='cal-sinfecha';
    sf.innerHTML=`<div class="cal-sinfecha-title">📌 Sin fecha (${sinFecha.length})</div>`;
    const list=document.createElement('div');
    list.className='cal-sinfecha-list';
    sinFecha.forEach(item=>list.appendChild(chipFor(item)));
    sf.appendChild(list);
    wrap.appendChild(sf);
  }

  contentEl.appendChild(wrap);

  document.querySelectorAll('#cal-filter [data-cal]').forEach(b=>b.addEventListener('click',()=>{ calFiltro=b.dataset.cal||null; renderCalendario(); }));
  document.getElementById('cal-prev').addEventListener('click',()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendario(); });
  document.getElementById('cal-next').addEventListener('click',()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendario(); });
  document.getElementById('cal-hoy').addEventListener('click',()=>{ const n=new Date(); calMonth=n.getMonth(); calYear=n.getFullYear(); renderCalendario(); });
}

    }catch(e){
      statusEl2().textContent='Error de conexión.'; statusEl2().classList.add('error');
    }finally{
      btn.disabled=false; btn.textContent='✨ Generar';
    }
  });

async function leerImagenComoDataURL(file){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

// Fotos de celular pueden pesar varios MB -- sin achicarlas, el request se pasa del límite de
// tamaño de Vercel y el servidor lo rechaza antes de llegar al agente (respuesta no-JSON tipo
// "Request Entity Too Large"). Se re-codifica a JPEG y se limita el lado más largo a 1600px.
async function comprimirImagenParaChat(file){
  const MAX_DIM=1600, CALIDAD=0.82;
  const dataUrlOriginal = await leerImagenComoDataURL(file);
  try{
    const img = await new Promise((resolve,reject)=>{
      const im=new Image();
      im.onload=()=>resolve(im);
      im.onerror=reject;
      im.src=dataUrlOriginal;
    });
    let {width,height}=img;
    if(width>MAX_DIM||height>MAX_DIM){
      const escala=MAX_DIM/Math.max(width,height);
      width=Math.round(width*escala); height=Math.round(height*escala);
    }
    const canvas=document.createElement('canvas');
    canvas.width=width; canvas.height=height;
    canvas.getContext('2d').drawImage(img,0,0,width,height);
    return { dataUrl: canvas.toDataURL('image/jpeg',CALIDAD), mediaType:'image/jpeg' };
  }catch(e){
    return { dataUrl: dataUrlOriginal, mediaType: file.type };
  }
}

// Miniaturas de las tarjetas (viven dentro del JSON de datos, por eso chicas y ligeras).
function reducirDataURL(dataUrl, maxDim, calidad){
  maxDim=maxDim||420; calidad=calidad||0.68;
  return new Promise(resolve=>{
    const im=new Image();
    im.onload=()=>{
      try{
        let {width,height}=im;
        const esc=Math.min(1,maxDim/Math.max(width,height));
        width=Math.round(width*esc); height=Math.round(height*esc);
        const c=document.createElement('canvas'); c.width=width; c.height=height;
        c.getContext('2d').drawImage(im,0,0,width,height);
        resolve(c.toDataURL('image/jpeg',calidad));
      }catch(e){ resolve(null); }
    };
    im.onerror=()=>resolve(null);
    im.src=dataUrl;
  });
}
async function comprimirMiniatura(file){ return reducirDataURL(await leerImagenComoDataURL(file)); }

async function agregarImagenesAdjuntasPostIA(e){
  const files = Array.from(e.target.files||[]);
  if(!files.length) return;
  for(const file of files){
    const {dataUrl,mediaType} = await comprimirImagenParaChat(file);
    guionOrgImagenesAdjuntas.push({ mediaType, data:dataUrl.split(',')[1], previewUrl:dataUrl });
  }
  e.target.value='';
  pintarGuionOrgImgPreview();
}

async function agregarImagenesPegadasPostIA(e){
  const items = Array.from(e.clipboardData?.items||[]).filter(i=>i.type.startsWith('image/'));
  if(!items.length) return;
  e.preventDefault();
  for(const item of items){
    const file = item.getAsFile();
    if(!file) continue;
    const {dataUrl,mediaType} = await comprimirImagenParaChat(file);
    guionOrgImagenesAdjuntas.push({ mediaType, data:dataUrl.split(',')[1], previewUrl:dataUrl });
  }
  pintarGuionOrgImgPreview();
}

function enArmar(){

  guionOrgChat.forEach((m,i)=>{ if(m.role==='user' && m.armar) ult=i; });
  if(ult<0) return false;
  return !guionOrgChat.slice(ult).some(m=>m.role==='assistant' && /CAPTION:/i.test(m.content));

async function preguntarAgentePostIA(opts){
  opts = (opts && opts.armar) ? opts : {};
  const pregunta = (guionOrgPreguntaDraft||'').trim();

  if(!pregunta && !guionOrgImagenesAdjuntas.length){ if(statusEl) statusEl.textContent='⚠️ Escribe tu mensaje o adjunta una imagen.'; return; }
  const btn = document.getElementById('go-pregunta-btn');
  if(btn) btn.disabled = true;

  const imagenesParaEnviar = guionOrgImagenesAdjuntas.map(img=>({mediaType:img.mediaType, data:img.data}));
  const previewsParaMostrar = guionOrgImagenesAdjuntas.map(img=>img.previewUrl);
  ocultarSugerencias();
  const faseArranque = enArranque();
  const faseArmar = !faseArranque && (!!opts.armar || enArmar());
  if(faseArranque && !guionOrgChat.length) guionOrgChat.push({role:'assistant', content:BIENVENIDA_ARRANQUE, local:true});
  guionOrgChat.push({role:'user', content: pregunta || '(revisa la imagen adjunta)', imagenes: previewsParaMostrar, ...(opts.armar ? {armar:true} : {})});
  guionOrgPreguntaDraft = '';
  guionOrgImagenesAdjuntas = [];
  scheduleGuionOrgChatSave();
  guionOrgPensando = true;
  pintarGuionOrgChat();
  pintarGuionOrgImgPreview();
  const barraHero=document.getElementById('hero-bar');
  if(barraHero && barraHero.scrollIntoView) barraHero.scrollIntoView({block:'nearest'});
  const taHero=document.getElementById('go-pregunta');
  if(taHero){ taHero.value=''; autoAlturaHero(taHero); }
  const rsHero=document.getElementById('go-chat-reset-btn');
  if(rsHero) rsHero.hidden=false;
  try{
    const resp = await fetch('/api/generar-guion-organico', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        cliente: CLIENTE_ID, modo:'pregunta',
        fase: faseArranque ? 'arranque' : (faseArmar ? 'armar' : 'libre'),
        producto_id: (window.__foco ? window.__foco.get().productoId : '') || '',
        grupo_id: (window.__foco ? window.__foco.get().grupoId : '') || '',
        messages: guionOrgChat.filter(m=>!m.local).map(m=>({role:m.role, content:m.content})),
        imagenes: imagenesParaEnviar,
      }),
    });
    const rawText = await resp.text();
    let data = null;
    try{ data = JSON.parse(rawText); }catch(e){ /* respuesta no-JSON, ver abajo */ }
    if(!resp.ok || !data){
      if(resp.status===413) throw new Error('La imagen es muy pesada para enviarla. Intenta con una más ligera o con una captura de pantalla en vez de la foto original.');
      throw new Error((data && data.error) || `Error al consultar al Agente (código ${resp.status}).`);
    }
    guionOrgChat.push({role:'assistant', content:data.text||''});
    // El primer post entregado cierra el arranque guiado: de aquí en adelante la consulta es libre.
    if(faseArranque && /CAPTION:/i.test(data.text||'')) guardarArranque(true);
    guionOrgPreguntaStatus = '✅ Listo';
    scheduleGuionOrgChatSave();
    // Armar un post con el chat: al llegar el post (CAPTION) se guarda solo en Próximos posts.
    if(faseArmar && /CAPTION:/i.test(data.text||'')) usarRespuestaChatEnContenido(guionOrgChat.length-1);
  }catch(err){
    guionOrgChat.pop();
    scheduleGuionOrgChatSave();
    guionOrgPreguntaDraft = pregunta;
    guionOrgImagenesAdjuntas = imagenesParaEnviar.map((img,i)=>({...img, previewUrl:previewsParaMostrar[i]}));
    guionOrgPreguntaStatus = '❌ ' + (err.message || 'Error al consultar al Agente.');
  }
  guionOrgPensando = false;
  actualizarHeroBar();
  const barraFin=document.getElementById('hero-bar');
  if(barraFin && barraFin.scrollIntoView) barraFin.scrollIntoView({block:'nearest'});
}

// El chat etiqueta "CAPTION:" (texto del post) aparte de "GUION:" (lo que se dice en el video) --
// ver prompts/system-prompt-post-ia-preguntas.md. Si no encuentra la etiqueta (respuestas simples
// tipo "dame 5 frases"), usa toda la respuesta como caption, igual que antes.
const SECCIONES_RESPUESTA_CHAT = ['CAPTION','GUI[OÓ]N','GANCHO','DESARROLLO','CIERRE(?:\\s*\\+\\s*CTA)?','NOTAS?(?:\\s+DE\\s+GRABACI[OÓ]N)?','DURACI[OÓ]N'];
// Decoradores que a veces mete el modelo alrededor de la etiqueta pese a pedirle texto plano
// (negritas markdown, guiones, ">" de cita, etc.) -- se ignoran al buscar/limpiar la etiqueta.
const DECORADORES_ETIQUETA = '[\\s*_#>\\-]*';
function extraerSeccionRespuestaChat(texto, etiqueta){
  const otras=SECCIONES_RESPUESTA_CHAT.filter(s=>s!==etiqueta).join('|');
  const re=new RegExp('(?:^|\\n)'+DECORADORES_ETIQUETA+etiqueta+DECORADORES_ETIQUETA+':?'+DECORADORES_ETIQUETA+'\\n?([\\s\\S]*?)(?:\\n'+DECORADORES_ETIQUETA+'(?:-{2,}\\s*$|(?:'+otras+')'+DECORADORES_ETIQUETA+':)|$)','i');
  const m=texto.match(re);
  return m ? m[1].trim() : null;
}
function limpiarPreambuloChat(linea){
  const preambulo=/^(listo|claro|perfecto|ok(?:ay)?|aqu[ií]\s+(?:tienes|va[ns]?|te dejo|est[aá][ns]?)|te comparto|por supuesto|de acuerdo|entendido|hecho)\b[^.:\n]*[:.]\s*/i;
  return (linea||'').replace(preambulo,'').trim();
}
// Respaldo: si por lo que sea la extracción de arriba no encontró la etiqueta, al menos quita
// cualquier línea de saludo/preámbulo o de etiqueta suelta ("CAPTION:", "Aquí va:"...) que haya
// quedado pegada al inicio del texto final.
function quitarLineasIntroChat(texto){
  if(!texto) return texto;
  const etiquetaSuelta=new RegExp('^'+DECORADORES_ETIQUETA+'(?:'+SECCIONES_RESPUESTA_CHAT.join('|')+')'+DECORADORES_ETIQUETA+':?'+DECORADORES_ETIQUETA+'$','i');
  const preambuloSuelto=/^(listo|claro|perfecto|ok(?:ay)?|aqu[ií]\s+(?:tienes|va[ns]?|te dejo|est[aá][ns]?)|te comparto|por supuesto|de acuerdo|entendido|hecho)\b.*[:.]\s*$/i;
  const lineas=texto.split('\n');
  while(lineas.length && (lineas[0].trim()===''||etiquetaSuelta.test(lineas[0].trim())||preambuloSuelto.test(lineas[0].trim()))){
    lineas.shift();
  }
  return lineas.join('\n').trim() || texto.trim();
}
function usarRespuestaChatEnContenido(idx){
  const msg = guionOrgChat[idx];
  if(!msg || msg.role!=='assistant' || msg.usada) return;
  const preguntaPrevia = (guionOrgChat[idx-1] && guionOrgChat[idx-1].role==='user') ? guionOrgChat[idx-1].content : '';
  const newId = 'c_chat'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const captionExtraida = extraerSeccionRespuestaChat(msg.content,'CAPTION');
  const lineasTitulo = (captionExtraida||msg.content).split('\n').map(l=>l.trim()).filter(Boolean);
  const primeraLinea = lineasTitulo.map(limpiarPreambuloChat).find(Boolean) || '';
  const gancho = (primeraLinea || 'Idea desde Consulta en vivo').replace(/^["“]|["”]$/g,'').slice(0,140);
  // El guion va en su propio campo y las notas son solo los apuntes rápidos (NOTAS:), sin repetir el caption.
  const guionExtraido = extraerSeccionRespuestaChat(msg.content,'GUI[OÓ]N');
  const notasExtraidas = extraerSeccionRespuestaChat(msg.content,SECCIONES_RESPUESTA_CHAT[5]);
  state.contenido.push({
    id:newId,
    orden:state.contenido.length+1,
    fase:'Semana 1',
    gancho,
    descripcion: preguntaPrevia,
    ganchoIdea:'',
    caption: quitarLineasIntroChat(captionExtraida || msg.content),
    guion: guionExtraido || '',
    notas: notasExtraidas || '',
    linkRef:'', linkArchivo:'',
    fecha:'', estado:'proceso',
    agregadoEn: Date.now()
  });
  const itemNuevo = state.contenido[state.contenido.length-1];
  const focoChat = window.__foco ? window.__foco.get() : null;
  const productoDetectado = (focoChat && focoChat.productoId) || detectarProductoAuto(itemNuevo);
  if(productoDetectado){ itemNuevo.productoId = productoDetectado; itemNuevo.productoNombre = nombreProducto(productoDetectado); }
  msg.usada = true;
  msg.contenidoId = newId;
  msg.contenidoGancho = gancho;
  scheduleGuionOrgChatSave();
  actualizarContadores();
  scheduleSave();
  // La imagen adjunta en el chat se vuelve la miniatura del post en "Próximos posts".
  const imgPrevia = (guionOrgChat[idx-1] && guionOrgChat[idx-1].imagenes && guionOrgChat[idx-1].imagenes[0]) || null;
  if(imgPrevia){
    reducirDataURL(imgPrevia).then(mini=>{
      const it=state.contenido.find(r=>r.id===newId);
      if(it && mini){ it.miniatura=mini; scheduleSave(); }
    });
  }
  guionOrgPreguntaStatus = '✅ Se agregó a Contenido (en proceso) y ya es el primero de Próximos posts: ábrelo para editarlo y ponerle fecha.';
  renderWidget();
  actualizarHeroBar();
}

const EVERGREEN_CAPTION_ESTILO = {
  viral:{ emoji:'🔥✨', tags:['viral','tendencia'] },
  educativo:{ emoji:'📚💡', tags:['tips','aprendeconmigo'] },
  venta:{ emoji:'💰🚀', tags:['oferta','promocion'] },
  entretenimiento:{ emoji:'🎭😄', tags:['humor','contenido'] },
  testimonio:{ emoji:'⭐🙌', tags:['testimonios','resultadosreales'] },
};
const EVERGREEN_TAGS_RELLENO = ['contenido','redessociales','marketingdigital','negocio','emprendedores'];

function hashtagDesdeTexto(texto){
  const stop = new Set(['de','la','el','en','y','a','que','para','con','tu','tus','un','una','los','las','se','como','por']);
  const palabras = (texto||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,'').split(/\s+/);
  return palabras.find(w=>w.length>3 && !stop.has(w)) || '';
}

function construirCaptionEvergreen(fila, cat){
  const estilo = EVERGREEN_CAPTION_ESTILO[cat] || { emoji:'✨', tags:['contenido','redessociales'] };
  const cuerpo = fila.video || fila.stories || '';
  const pool = [...estilo.tags, hashtagDesdeTexto(fila.idea), ...EVERGREEN_TAGS_RELLENO]
    .filter(Boolean)
    .filter((t,i,arr)=>arr.indexOf(t)===i);
  const tags = pool.slice(0,5).map(t=>'#'+t);
  const partes = [`${fila.idea||''} ${estilo.emoji}`.trim()];
  if(cuerpo) partes.push(cuerpo);
  partes.push(tags.join(' '));
  return partes.join('\n\n');
}

function redDeLink(url){
  const h=(url||'').toLowerCase();
  if(h.includes('instagram.com')||h.includes('instagr.am')) return 'ig';
  if(h.includes('tiktok.com')) return 'tt';
  if(h.includes('facebook.com')||h.includes('fb.com')||h.includes('fb.watch')) return 'fb';
  return 'web';
}
function etiquetaLink(url){
  try{
    const u=new URL(carpetaLinkHref(url));
    const partes=u.pathname.split('/').filter(Boolean).slice(0,2);
    return u.hostname.replace(/^www\./,'')+(partes.length?' / '+partes.join(' / '):'');
  }catch(e){ return url; }
}

  ins.querySelectorAll('[data-ins-del]').forEach(b=>b.addEventListener('click',()=>{

  if(iconoFoco){
    const sel = iconoFoco==='ins-add' ? '[data-ins-add]' : `[data-link-input="${iconoFoco}"]`;

    if(el){ el.focus(); if(iconoFoco!=='ins-add') el.select(); }

  }

const SUGERENCIAS_BASE = [

  {t:'Guíame paso a paso desde cero', g:'cero', accion:'arranque'},
];
let sugLista = [];
let sugActiva = -1;
function normSug(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
// Orden de relevancia según el momento: sin conversación (arranque del día), con ideas ya dadas o con un post escrito.
function sugerenciasChat(texto){
  if(bienvenidaVisible()){
    // Mientras se contesta la bienvenida, la lista trae solo las dos respuestas del arranque.
    const opciones = OPCIONES_ARRANQUE.map(t=>({t, g:'arranque'}));
    const qa = normSug(texto).trim();
    if(!qa) return opciones;
    const pals = qa.split(/\s+/).filter(Boolean);
    return opciones.filter(o=>{ const n=normSug(o.t); return pals.every(w=>n.includes(w)); });
  }
  const conv =guionOrgChat.some(m=>!m.local);
  const hayPost = guionOrgChat.some(m=>m.role==='assistant' && /CAPTION:/i.test(m.content));
  const nIdeas = state.contenido.filter(r=>r.estado==='idea').length;
  const nSinFecha = state.contenido.filter(r=>(r.estado==='proceso'||r.estado==='programado') && !/^\d{4}-\d{2}-\d{2}$/.test(r.fecha||'')).length;
  const pocasHistorias = state.historias.filter(r=>r.estado!=='publicado').length < 3;
  const aplica = s=>{
    if(s.g==='post') return hayPost;
    if(s.g==='ideas') return conv;
    if(s.g==='siguiente') return arranqueHecho;
    if(s.g==='cero') return !conv;
    if(s.g==='tablero-ideas') return nIdeas>0;
    if(s.g==='tablero-proceso') return nSinFecha>0;
    if(s.g==='tablero-historias') return pocasHistorias;
    return true;
  };
  // Las dos más comunes van siempre primero; el resto cambia según el momento.
  // Las cinco del método (auditar, variaciones, calendario, rutina e ideas creativas) van siempre primero; los ajustes de un
  // post ("hazlo más corto"...) salen después y se encuentran al escribir.
  const orden = hayPost ? ['metodo','post','comun','ideas','siguiente','tablero-proceso','tablero-ideas','tablero-historias','inicio','plantilla','cero']
    : conv ? ['metodo','ideas','comun','siguiente','inicio','tablero-proceso','tablero-ideas','tablero-historias','plantilla','cero']
    : ['metodo','comun','siguiente','inicio','tablero-ideas','tablero-proceso','tablero-historias','plantilla','cero'];
  const focoSug = window.__foco ? window.__foco.get() : null;
  const deProducto = (focoSug && !focoSug.esTodo && focoSug.nombre) ? focoSug.nombre : '';
  const base = deProducto ? SUGERENCIAS_BASE.map(x=>x.completa ? {...x, t:x.t+deProducto} : x) : SUGERENCIAS_BASE;
  const candidatos = base.filter(aplica).sort((a,b)=>orden.indexOf(a.g)-orden.indexOf(b.g));
  const q = normSug(texto).trim();
  if(!q) return candidatos.slice(0,6);
  // Al escribir, "dame otras 5 ideas" y similares también salen aunque todavía no haya conversación.
  const paraBuscar = base.filter(s=>aplica(s) || s.g==='ideas').sort((a,b)=>orden.indexOf(a.g)-orden.indexOf(b.g));
  const palabras = q.split(/\s+/).filter(Boolean);
  return paraBuscar.filter(s=>{ const n=normSug(s.t); return palabras.every(p=>n.includes(p)); }).slice(0,5);
}
function pintarSugerencias(){
  const box=document.getElementById('go-sug');
  const ta=document.getElementById('go-pregunta');
  if(!box || !ta) return;
  sugLista = document.activeElement===ta ? sugerenciasChat(guionOrgPreguntaDraft) : [];
  sugActiva = -1;
  if(!sugLista.length){ ocultarSugerencias(); return; }
  box.innerHTML = sugLista.map((s,i)=>`<button type="button" class="go-sug-item" role="option" data-i="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>${escHtml(s.completa ? s.t.trim()+'…' : s.t)}</span></button>`).join('');
  box.hidden = false;
  if(box.scrollIntoView) box.scrollIntoView({block:'nearest'});
  box.querySelectorAll('.go-sug-item').forEach(b=>{
    b.addEventListener('mousedown',e=>e.preventDefault()); // no le quita el foco a la barra
    b.addEventListener('click',()=>elegirSugerencia(+b.dataset.i));
  });
}
function ocultarSugerencias(){
  const box=document.getElementById('go-sug');
  if(box){ box.hidden=true; box.innerHTML=''; }
  sugLista=[]; sugActiva=-1;
}
function moverSugerencia(paso){
  const items=document.querySelectorAll('#go-sug .go-sug-item');
  if(!items.length) return false;
  const n=items.length;
  sugActiva = sugActiva<0 ? (paso>0 ? 0 : n-1) : (sugActiva+paso+n)%n;
  items.forEach((b,i)=>b.classList.toggle('on', i===sugActiva));
  return true;
}
function elegirSugerencia(i){
  const s=sugLista[i];
  if(!s) return;
  ocultarSugerencias();
  if(s.accion==='arranque'){ reiniciarArranque(); return; }
  if(s.accion==='armar'){ guionOrgPreguntaDraft = s.msg || s.t; preguntarAgentePostIA({armar:true}); return; }
  guionOrgPreguntaDraft = s.msg || s.t;
  if(s.completa){
    // Plantilla: queda escrita en la barra para que la persona la termine.
    const ta=document.getElementById('go-pregunta');
    ta.value=s.t; autoAlturaHero(ta); ta.focus(); ta.setSelectionRange(s.t.length,s.t.length);
    return;
  }
  preguntarAgentePostIA();
}

function initHeroChat(){
  const ta=document.getElementById('go-pregunta');
  ta.addEventListener('input',e=>{ guionOrgPreguntaDraft=e.target.value; autoAlturaHero(ta); pintarSugerencias(); });
  ta.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      if(document.getElementById('go-sug').hidden) pintarSugerencias();
      if(moverSugerencia(e.key==='ArrowDown'?1:-1)) e.preventDefault();
      return;
    }
    if(e.key==='Escape'){ ocultarSugerencias(); return; }
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      if(sugActiva>=0) elegirSugerencia(sugActiva); else preguntarAgentePostIA();
    }
  });

// ─── PRODUCTO AUTOMÁTICO ───────────────────────────────────────────────────────────────────
// Si el título, el caption, el guion o las notas nombran un producto del catálogo, queda elegido solo
// (aparece como "sugerido"). Se puede cambiar; si se elige a mano ya no se vuelve a mover.
function detectarProductoAuto(o){
  const prods=productosCatalogo();
  if(!prods.length) return '';
  const texto=' '+normSug([o.gancho,o.caption,o.guion,o.descripcion,o.ganchoIdea,o.notas].join(' ')).split(/\s+/).join(' ')+' ';
  let mejor=null, largo=0, empate=false;
  prods.forEach(p=>{
    const n=normSug(p.nombre).split(/\s+/).join(' ').trim();
    if(n.length<3 || !texto.includes(n)) return;
    if(n.length>largo){ mejor=p; largo=n.length; empate=false; }
    else if(n.length===largo && mejor && mejor.id!==p.id) empate=true;
  });
  return (mejor && !empate) ? mejor.id : '';
}

}
function precioCorto(v){
  const n=parseFloat(String(v==null?'':v).replace(/[^0-9.-]/g,''));
  return isFinite(n) && n>0 ? '$'+Math.round(n).toLocaleString('es-MX') : '';
}

const MEDIO_META = {

  video:{ico:'🎬', boton:'Crear prompt de video con IA', campo:'promptVideo', titulo:'Prompt de video'},

    </div>
  </div>`;

// Un video no se manda entero: se toman unos cuadros para que la IA vea de qué trata.
function fotogramasDeVideo(file, cuantos){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const v=document.createElement('video');
    v.muted=true; v.playsInline=true; v.preload='auto'; v.src=url;
    let listo=false;
    const t=setTimeout(()=>fin(null,new Error('tiempo')),20000);
    const fin=(res,err)=>{ if(listo) return; listo=true; clearTimeout(t); URL.revokeObjectURL(url); err?reject(err):resolve(res); };
    v.addEventListener('error',()=>fin(null,new Error('video')));
    v.addEventListener('loadedmetadata',async()=>{
      try{
        const dur=v.duration||1, w0=v.videoWidth||640, h0=v.videoHeight||360;
        const esc=Math.min(1,768/Math.max(w0,h0));
        const c=document.createElement('canvas'); c.width=Math.round(w0*esc); c.height=Math.round(h0*esc);
        const cx=c.getContext('2d'); const out=[];
        for(let i=0;i<cuantos;i++){
          await new Promise(r=>{ v.onseeked=r; v.currentTime=dur*(i+1)/(cuantos+1); });
          cx.drawImage(v,0,0,c.width,c.height);
          out.push({mediaType:'image/jpeg', data:c.toDataURL('image/jpeg',0.7).split(',')[1]});
        }
        fin(out);
      }catch(e){ fin(null,e); }
    });
  });
}

    const usadas=()=>ctx.medioAdj[tipo].reduce((n,a)=>n+a.imgs.length,0);

      prev.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ ctx.medioAdj[tipo].splice(+b.dataset.rm,1); pintarPrev(); }));
    };
    const botonFila=ov.querySelector('[data-tool="'+tipo+'"]');
    botonFila.addEventListener('click',()=>{ ask.hidden=!ask.hidden; botonFila.classList.toggle('on',!ask.hidden); });
    box.querySelector('.ed-medio-file').addEventListener('change',async e=>{

            ctx.medioAdj[tipo].push({nombre:f.name, esVideo:false, imgs:[{mediaType, data:dataUrl.split(',')[1]}]});
          }
        }catch(err){ st.textContent='⚠️ No pude leer '+f.name; }
      }
      if(st.textContent.startsWith('⏳')) st.textContent='';
      pintarPrev();
    });
    box.querySelector('.ed-medio-gen').addEventListener('click',()=>generarPromptMedio(tipo,box));
    box.querySelector('.ed-medio-copiar').addEventListener('click',e=>{
      const txt=ctx.draft[m.campo]; if(!txt) return;
      const b=e.currentTarget, antes=b.textContent;
      navigator.clipboard.writeText(txt).then(()=>{ b.textContent='✅ Copiado'; setTimeout(()=>{ b.textContent=antes; },1500); });
    });
    box.querySelector('.ed-medio-ir').addEventListener('click',()=>irAProductor(tipo));
  });
}
async function generarPromptMedio(tipo, box){
  const ctx=editorCtx, d=ctx.draft, m=MEDIO_META[tipo];
  const st=box.querySelector('.ed-medio-status'), btn=box.querySelector('.ed-medio-gen');
  if(!d.gancho.trim() && !d.caption.trim()){ st.textContent='⚠️ Escribe primero el título o el caption del post.'; return; }
  const imagenes=ctx.medioAdj[tipo].flatMap(a=>a.imgs);
  btn.disabled=true; st.textContent='⏳ Creando tu prompt…';
  try{
    const resp=await fetch('/api/generar-guion-organico',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        cliente:CLIENTE_ID, modo:'prompt-medio', tipo,
        post:{gancho:d.gancho, formato:(FORMATOS_META[d.formato]||{}).label||d.formato, caption:d.caption, guion:d.guion, notas:d.notas},
        texto:box.querySelector('.ed-medio-texto').value, imagenes,
      }),
    });
    const crudo=await resp.text();
    let data=null; try{ data=JSON.parse(crudo); }catch(e){}
    if(!resp.ok||!data){
      throw new Error(resp.status===413 ? 'Los archivos pesan mucho. Prueba con menos o más ligeros.' : ((data&&data.error)||'No se pudo crear el prompt.'));
    }
    d[m.campo]=data.text||'';
    box.querySelector('[data-ed="'+m.campo+'"]').value=d[m.campo];
    box.querySelector('.ed-medio-box').hidden=false;
    box.querySelector('.ed-medio-ask').hidden=true;
    const botonFila=document.querySelector('[data-tool="'+tipo+'"]'); if(botonFila) botonFila.classList.remove('on');
    st.textContent='';
  }catch(err){ st.textContent='⚠️ '+err.message; }
  btn.disabled=false;
}

function actualizarPreviewEditor(){
  if(!editorCtx) return;

  const scr=document.getElementById('ed-screen');
  const fu=fuenteElegida(draft, editorCtx.fuente);
  const mi=fu?fu.mi:null;
  if(scr){
    if(!scr.firstElementChild){ scr.innerHTML='<div class="ed-base" id="ed-base"></div><div class="ed-media-box" id="ed-media-box"></div><div class="ed-ui" id="ed-ui"></div>'; }
    const gr=ESTADO_GRAD[draft.estado]||ESTADO_GRAD.idea;

    const box=document.getElementById('ed-media-box');
    const llave=mi?mi.abrir:'';
    if(box.dataset.mat!==llave){
      box.dataset.mat=llave;
      if(!mi || mi.tipo==='link') box.innerHTML='';
      else if(mi.tipo==='img') box.innerHTML=`<img class="ed-media" src="${mi.src}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`;
      else if(mi.tipo==='video') box.innerHTML=`<video class="ed-media" src="${mi.src}" controls playsinline preload="metadata"></video>`;
      else box.innerHTML=`<iframe class="ed-media" src="${mi.src}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>`;
    }
    const interactivo=!!mi && (mi.tipo==='video'||mi.tipo==='embed');
