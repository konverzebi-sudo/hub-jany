        <div class="chips"><span>🧩 ${c.etapas.length} etapas</span><span>⚡ ${nP} prompts</span></div>
        <div class="class-actions">
          <button class="done-toggle ${done[c.id] ? 'on' : ''}" data-done="${esc(c.id)}"><span class="box">${done[c.id] ? '<svg width="12" height="12"><use href="#i-check"/></svg>' : ''}</span>${done[c.id] ? 'Completada' : 'Marcar como completada'}</button>
          ${nP ? `<button class="chip-btn" data-copyall>⬇ Copiar todos los prompts</button>` : ''}
        </div>
      </div>
      ${enVivoClase(c) ? `<div class="cover cover-vivo"><iframe class="vivo-frame" src="taller-app/?embed=presentacion&mini=1${MODO_PONENTE ? '&rol=ponente' : ''}" title="Presentación en vivo" allow="fullscreen"></iframe><button type="button" class="vivo-react" data-reaccion title="¡Estoy aquí! Manda una reacción" aria-label="Mandar reacción">🤑</button><div class="vivo-btns"><button type="button" data-vivo-teatro title="Más grande, puedes seguir bajando a las actividades">${vivoGrande() ? '▭ Más chica' : '▭ Más grande'}</button><button type="button" data-vivo-grande title="Pantalla completa">⛶ Pantalla completa</button></div></div>` : `<div class="cover"><span class="emoji">${c.mod.emoji}</span><small>${etiq(c)}</small><b>${esc(c.titulo)}</b></div>`}
    </div>
    <div class="tip"><span>💡</span><div>${esc(c.tip)}</div></div>
    <div class="sec-title"><span class="ico">🗺️</span><div><h2>Mapa de la clase</h2></div></div>
    <div class="map">${c.mapa ? c.mapa.map((m, k) => m.e ? `<a href="#clase-${c.id}/etapa-${m.e}"><i>${k + 1}</i>${esc(m.t)}</a>` : `<a href="javascript:void 0" class="sin-link"><i>${k + 1}</i>${esc(m.t)}</a>`).join('') : c.etapas.map((e, k) => `<a href="#clase-${c.id}/etapa-${k + 1}"><i>${k + 1}</i>${esc(e.titulo)}</a>`).join('')}</div>
    ${(c.antes || []).length ? `<div class="sec-title"><span class="ico">📋</span><div><h2>Antes de empezar</h2></div></div>
    <div class="card"><ul class="checklist">${c.antes.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>` : ''}
    <div class="sec-title"><span class="ico">🪜</span><div><h2>Sigue este orden</h2></div></div>
    <ol class="timeline">${c.etapas.map((e, k) => `
      <li class="etapa" id="etapa-${k + 1}">
        <span class="node">${k + 1}</span>
        <small>ETAPA ${k + 1}</small>
        <h3>${esc(e.titulo)}</h3>
        <p>${esc(e.texto)}</p>
        ${e.links ? `<div class="etapa-links">${e.links.map(l => /^https?:\/\//.test(l.url) ? `<a class="${l.primario ? 'btn' : 'chip-btn'}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.texto)}${l.primario ? ' →' : ' ↗'}</a>` : `<span class="chip-btn">🔒 El link se compartirá antes del taller</span>`).join('')}</div>` : ''}
        ${e.brief ? `<div class="brief-caja"><button type="button" class="btn" data-brief="${esc(e.brief)}">📝 Llenar mi brief</button><div class="brief-hueco" hidden></div></div>` : ''}
        ${e.copiar ? `<div class="etapa-links"><button type="button" class="chip-btn" data-copiar-link="${esc(e.copiar)}">🔗 Copiar el link del manual</button></div>` : ''}
        ${e.app ? `<div class="app-card"><img src="${esc(e.app.logo)}" alt="" width="44" height="44"><div class="app-txt"><b>${esc(e.app.nombre)}</b><div class="app-acc"><a class="btn" href="${esc(e.app.abrir)}" target="_blank" rel="noopener">Abrir ${esc(e.app.nombre)} ↗</a>${e.app.descargas.map(d => `<a class="chip-btn" href="${esc(d.url)}" target="_blank" rel="noopener"><svg class="ico-dl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>${esc(d.texto)}</a>`).join('')}</div></div></div>` : ''}
        ${e.agenda ? `<div class="etapa-links"><a class="btn" href="${agendaGoogle()}" target="_blank" rel="noopener">📅 Agregar a Google Calendar ↗</a><button type="button" class="chip-btn" data-ics>🗓️ Apple / Outlook (.ics)</button></div>` : ''}
        ${e.cuenta ? `<div class="cuenta" data-cuenta></div>` : ''}
        ${e.boton === 'ayuda' ? `<button type="button" class="btn" data-abrir-ayuda>🛟 Probar el botón de soporte</button>` : ''}
        ${e.herramienta ? `<div class="gm-hueco" data-metricas="${esc(e.herramienta)}"></div>` : ''}
        ${e.embed ? `<iframe class="embed-taller" data-din="${esc(e.embed)}" src="taller-app/?embed=${encodeURIComponent(e.embed)}${MODO_PONENTE ? '&rol=ponente' : ''}" title="${esc(e.titulo)}" loading="lazy" allow="clipboard-write"></iframe>` : ''}
        ${e.tamanos ? `<div class="tam-box"><b>📐 ¿Ya tienes tu imagen? Cámbiala de tamaño</b><p>Cuando termines cualquier estilo, copia uno de estos mini prompts y pégalo en el mismo chat de ChatGPT.</p><div class="tam-grid">${e.tamanos.map(t => `<div class="prompt tam"><div class="prompt-head"><b>${esc(t.nombre)} <small>${esc(t.medida)}</small></b><button class="copy" data-copy><svg><use href="#i-copy"/></svg><span>Copiar prompt</span></button></div><pre data-raw="${esc(t.texto)}">${esc(t.texto)}</pre></div>`).join('')}</div></div>` : ''}
        ${e.estilos ? `<div class="estilos-grid">${e.estilos.map((x, j) => x.pendiente ? '' : `<div class="estilo-card"><button type="button" class="estilo-foto" data-estilo="${j}" aria-label="Ver el prompt de ${esc(x.nombre)}"><img src="${esc(x.img)}" alt="${esc(x.nombre)}" loading="lazy">${x.hover ? `${[].concat(x.hover).map((h, k, arr) => `<img class="estilo-hover${arr.length > 1 ? ' ciclo' : ''}" src="${esc(h)}" alt="" style="animation-delay:${(k * 2 - 1.8).toFixed(1)}s">`).join('')}<span class="estilo-tip">👆 Así se vería con otro producto</span>` : ''}<span class="estilo-num">ESTILO ${esc(x.n)}</span></button><div class="estilo-txt"><b>${esc(x.nombre)}</b><p>${esc(x.desc)}</p>${x.colores ? '<span class="estilo-fotos estilo-col">🎨 Se adapta a los colores de tu marca</span>' : ''}<span class="estilo-fotos">📷 ${x.fotosTxt ? esc(x.fotosTxt) : x.fotos === 3 ? 'Sube 3 fotos: tu producto + tu logo + la foto base' : x.fotos === 2 ? 'Sube 2 fotos: la foto base + tu producto' : 'Sube 1 foto: tu producto'}</span><div class="estilo-acc"><button type="button" class="btn" data-estilo="${j}">Ver y copiar prompt</button>${x.fotos >= 2 && !x.sinBase ? `<a class="chip-btn" href="${esc(x.img)}" download="estilo-${esc(x.n)}-foto-base${esc(x.img.slice(x.img.lastIndexOf('.')))}">⬇ Foto base</a>` : ''}</div></div></div>`).join('')}</div>` : ''}
        ${e.galeria ? `<div class="gal-box"><h4>📸 Imágenes que debes tener en tu galería</h4>${e.galeria.map(g => `<div class="gal-grupo"><b>${esc(g.emoji)} ${esc(g.titulo)}</b><p>${esc(g.texto)}</p><ul>${g.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}</div>` : ''}
        ${e.checks ? `<div class="card etapa-checks">${e.checks.map((t, j) => `<label class="chk"><input type="checkbox" data-chk="${esc(c.id)}-${k}-${j}" ${chks[c.id + '-' + k + '-' + j] ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}</div>` : ''}
        ${(e.prompts || []).map(p => `
          <div class="prompt">
            <div class="prompt-head"><b>${esc(p.nombre)}</b><button class="copy" data-copy><svg><use href="#i-copy"/></svg><span>Copiar prompt</span></button></div>
            ${p.nota ? `<div class="prompt-note">ⓘ ${esc(p.nota)}</div>` : ''}
            <pre data-raw="${esc(p.texto)}">${marcar(p.texto)}</pre>
            <button class="expand" data-expand>Ver prompt completo ⌄</button>
          </div>`).join('')}
      </li>`).join('')}</ol>
    <div class="sec-title"><span class="ico">✅</span><div><h2>Revisa antes de avanzar</h2></div></div>
    <div class="card revisa" data-revisa="${esc(c.id)}"><div class="rev-bar"><i style="width:${Math.round(c.revisa.filter((a, j) => chks[c.id + '-rev-' + j]).length / c.revisa.length * 100)}%"></i></div>
      ${c.revisa.map((a, j) => `<label class="chk chk-box"><input type="checkbox" data-chk="${esc(c.id)}-rev-${j}" ${chks[c.id + '-rev-' + j] ? 'checked' : ''}><span>${esc(a)}</span></label>`).join('')}</div>
    <div class="complete-bar"><b>${done[c.id] ? '¡Clase completada! 🎉' : '¿Terminaste esta clase?'}</b><button class="btn" data-done="${esc(c.id)}" data-go="${next ? next.id : ''}">${done[c.id] ? (next ? 'Ir a la siguiente →' : 'Volver al inicio') : 'Completar clase'}</button></div>
    <div class="pager">
      ${prev ? `<a href="#clase-${prev.id}"><small>← ANTERIOR</small><b>${esc(prev.titulo)}</b></a>` : `<a href="#inicio"><small>← INICIO</small><b>Guía del taller</b></a>`}
      ${next ? `<a class="next" href="#clase-${next.id}"><small>SIGUIENTE · CLASE ${esc(next.id)} →</small><b>${esc(next.titulo)}</b></a>` : `<a class="next" href="#recursos"><small>SIGUIENTE →</small><b>Recursos y links</b></a>`}
    </div>`;
}

function viewRecursos() {
  $('#crumbs').innerHTML = `Guía del taller › <b>Recursos</b>`;
  return `<span class="eyebrow">Recursos</span><h1 style="font-size:40px;margin:16px 0 8px">Archivos y links útiles</h1><p style="color:var(--muted)">Todo lo que usamos en el taller, en un solo lugar.</p>
    <div class="sec-title"><span class="ico">📎</span><div><h2>Herramientas</h2></div></div>
    <div class="res-grid">${CURSO.recursos.map(r => `<a class="res" href="${esc(r.url)}" target="_blank" rel="noopener"><b>${esc(r.titulo)} ↗</b><span>${esc(r.texto)}</span></a>`).join('')}</div>`;
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'inicio';
  const [page, sub] = h.split('/');
  let html, activo = page;
  if (page.startsWith('clase-')) {
    const c = CLASES.find(x => x.id === page.slice(6));
    if (c) { html = claseBloq(c, c.mod) ? viewBloqueada(c) : viewClase(c); activo = c.id; }
  } else if (page === 'recursos') html = viewRecursos();
  else if (page === 'en-vivo') html = viewEnVivo();
  if (!html) { html = viewInicio(); activo = 'inicio'; }
  $('#view').innerHTML = (MODO_PONENTE ? '<div class="aviso-ponente">🎤 <b>Vista de ponente.</b> Ves exactamente lo mismo que tus alumnos; los <span>cuadros verdes</span> son las decisiones que solo tú puedes tomar.</div>' : '') + html;
  if (window.GuiaMetricas) window.GuiaMetricas.montar();
  pintarCuenta(); pintarRecordatorios();
  renderNav(activo);
  document.body.classList.remove('menu-open');
  const target = sub && document.getElementById(sub);
  if (target) target.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
}

const MARCA_TOKEN = '[COLORES DE MI MARCA]';
const marcaColores = () => { try { return JSON.parse(localStorage.getItem(KEY + '-marca')) || []; } catch (e) { return []; } };
const LETRA_TOKEN = '[LETRA DE MI MARCA]';
const marcaLetra = () => { try { return JSON.parse(localStorage.getItem(KEY + '-letra')) || null; } catch (e) { return null; } };
const conMarca = t => { const c = marcaColores(), l = marcaLetra(); if (c.length) t = t.split(MARCA_TOKEN).join(c.map(x => x.toUpperCase()).join(', ')); if (l && l.desc) t = t.split(LETRA_TOKEN).join(l.desc); return t; };
window.addEventListener('message', ev => { const d = ev.data; if (d && d.taller === 'marca' && Array.isArray(d.colores)) { try { localStorage.setItem(KEY + '-marca', JSON.stringify(d.colores.filter(c => /^#[0-9a-f]{6}$/i.test(c)).slice(0, 6))); if (d.tipografia && d.tipografia.desc) localStorage.setItem(KEY + '-letra', JSON.stringify({ estilo: String(d.tipografia.estilo || '').slice(0, 40), desc: String(d.tipografia.desc).slice(0, 160) })); } catch (e) {} } });
function abrirEstilo(j) {
  const x = ESTILOS_IMAGEN[j]; if (!x) return;
  const cols = marcaColores(), letra = marcaLetra(), txt = x.colores ? conMarca(x.prompt) : x.prompt, usaLetra = x.prompt.includes(LETRA_TOKEN);
  const notaColores = !x.colores ? '' : cols.length
    ? `<div class="estilo-marca">🎨 Este prompt ya trae los colores de tu marca: ${cols.map(c => `<i style="background:${esc(c)}"></i>`).join('')}</div>`
    : `<div class="estilo-marca">🎨 Este prompt usa los colores de tu marca. Escríbelos donde dice <mark>${MARCA_TOKEN}</mark>, o sube tu logo arriba en «Tu logo y tus colores» y vuelve a abrir este estilo.</div>`;
  const notaLetra = !usaLetra ? '' : letra ? `<div class="estilo-marca">🔤 El texto va con la letra de tu marca: estilo ${esc(letra.estilo)}.</div>` : `<div class="estilo-marca">🔤 Este prompt usa la letra de tu marca. Elígela en tu brief del Pre, o describe cómo la quieres donde dice <mark>${LETRA_TOKEN}</mark>.</div>`;
  const m = document.createElement('div');
  m.className = 'estilo-modal';
  m.innerHTML = `<div class="estilo-ventana" role="dialog" aria-modal="true" aria-label="${esc(x.nombre)}">
    <button type="button" class="estilo-cerrar" data-cerrar-estilo aria-label="Cerrar">✕</button>
    <div class="estilo-v-top"><img src="${esc(x.img)}" alt=""><div><small>ESTILO ${esc(x.n)}</small><h3>${esc(x.nombre)}</h3><p>${esc(x.desc)}</p>
      <ol class="estilo-pasos">${x.pasos ? x.pasos : x.fotos === 3 ? '<li>Descarga la foto base y ten a la mano tu logo.</li><li>En ChatGPT sube en este orden: la foto de tu producto, tu logo y la foto base.</li>' : x.fotos === 2 ? '<li>Descarga la foto base.</li><li>En ChatGPT sube primero la foto base y después la de tu producto.</li>' : '<li>En ChatGPT sube la foto de tu producto.</li>'}${x.pasoFinal === false ? '' : '<li>Copia el prompt, pégalo y envía.</li>'}</ol>
      ${x.fotos >= 2 && !x.sinBase ? `<a class="chip-btn" href="${esc(x.img)}" download="estilo-${esc(x.n)}-foto-base${esc(x.img.slice(x.img.lastIndexOf('.')))}">⬇ Descargar foto base</a>` : ''}</div></div>
    ${notaColores}${notaLetra}
    <div class="prompt open"><div class="prompt-head"><b>${esc(x.nombre)}</b><button class="copy" data-copy><svg><use href="#i-copy"/></svg><span>Copiar prompt</span></button></div><pre data-raw="${esc(txt)}">${x.colores ? marcar(txt) : esc(txt)}</pre></div>
  </div>`;
  document.body.appendChild(m);
  document.body.classList.add('modal-abierto');
}
function cerrarEstilo() { document.querySelectorAll('.estilo-modal').forEach(m => m.remove()); document.body.classList.remove('modal-abierto'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarEstilo(); });

document.addEventListener('click', e => {
  const est = e.target.closest('[data-estilo]');
  if (est) { abrirEstilo(+est.dataset.estilo); return; }
  if (e.target.closest('[data-cerrar-estilo]') || e.target.classList.contains('estilo-modal')) { cerrarEstilo(); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    const raw = cp.closest('.prompt').querySelector('pre').dataset.raw;
    navigator.clipboard.writeText(raw).then(() => { cp.classList.add('ok'); cp.querySelector('span').textContent = '¡Copiado!'; toast('Prompt copiado'); setTimeout(() => { cp.classList.remove('ok'); cp.querySelector('span').textContent = 'Copiar prompt'; }, 1800); });
    return;
  }
  const ex = e.target.closest('[data-expand]');
  if (ex) { const p = ex.closest('.prompt'); p.classList.toggle('open'); ex.textContent = p.classList.contains('open') ? 'Ver menos ⌃' : 'Ver prompt completo ⌄'; return; }
  if (e.target.closest('[data-copyall]')) {
    const txt = [...document.querySelectorAll('.prompt')].map(p => '## ' + p.querySelector('.prompt-head b').textContent + '\n' + p.querySelector('pre').dataset.raw).join('\n\n');
    navigator.clipboard.writeText(txt).then(() => toast('Todos los prompts copiados'));
    return;
  }
  const d = e.target.closest('[data-done]');
  if (d) {
    const id = d.dataset.done, go = d.dataset.go;
    if (d.classList.contains('btn') && done[id]) { location.hash = go ? '#clase-' + go : '#inicio'; return; }
    done[id] = !done[id] || d.classList.contains('btn'); save();
    toast(done[id] ? '¡Clase completada! 🎉' : 'Marcada como pendiente');
    const y = window.scrollY; route(); window.scrollTo(0, y);
    return;
  }
  if (e.target.closest('#menuBtn')) { document.body.classList.toggle('menu-open'); return; }
  if (document.body.classList.contains('menu-open') && !e.target.closest('aside')) document.body.classList.remove('menu-open');
});

/* Buscador: clases, etapas y prompts */
const q = $('#q'), qres = $('#qres');
q.addEventListener('input', () => {
  const t = q.value.trim().toLowerCase();
  if (t.length < 2) { qres.classList.remove('on'); return; }
  const hits = [];
  CLASES.forEach(c => {
    if ((c.titulo + ' ' + c.resumen).toLowerCase().includes(t)) hits.push({ href: '#clase-' + c.id, txt: `Clase ${c.id} · ${c.titulo}` });
    c.etapas.forEach((e, k) => {
      const blob = (e.titulo + ' ' + e.texto + ' ' + (e.prompts || []).map(p => p.nombre + ' ' + p.texto).join(' ')).toLowerCase();
      if (blob.includes(t)) hits.push({ href: `#clase-${c.id}/etapa-${k + 1}`, txt: `Clase ${c.id} › ${e.titulo}` });
    });
  });
  const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  qres.innerHTML = hits.length ? hits.slice(0, 8).map(h => `<a href="${h.href}">${esc(h.txt).replace(re, '<b>$1</b>')}</a>`).join('') : '<div class="none">Sin resultados</div>';
  qres.classList.add('on');
});
qres.addEventListener('click', () => { q.value = ''; qres.classList.remove('on'); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); document.body.classList.add('menu-open'); q.focus(); } if (e.key === 'Escape') { q.blur(); qres.classList.remove('on'); } });

$('#waHelp').href = 'https://wa.me/' + CURSO.whatsapp + '?text=' + encodeURIComponent('Hola Jany, tengo una duda sobre la guía del ' + CURSO.nombre);
window.addEventListener('hashchange', route);
route();
</script>
