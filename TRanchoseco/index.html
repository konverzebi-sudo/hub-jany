<body>
<header>
  <img class="logo" src="escudo.png" alt="Rancho Seco Fútbol Rápido">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar equipo o jugador…" autocomplete="off">
    <div id="results" class="results"></div>
  </div>
  <nav class="tabs">
    <button class="tab on" data-act="tab" data-tab="canchas">Canchas</button>
    <button class="tab" data-act="tab" data-tab="equipos">Equipos</button>
    <button class="tab" data-act="tab" data-tab="pagos">Pagos</button>
  </nav>
</header>

<main>
  <section id="tab-canchas" class="view on"><div id="fields"></div><div class="ajfoot"><button class="ajbtn" data-act="tab" data-tab="ajustes" title="Ajustes" aria-label="Ajustes">⚙️</button></div></section>
  <section id="tab-equipos" class="view">
    <div class="toolbar"><button class="btn primary" data-act="newteam">+ Nuevo equipo</button></div>
    <div id="teams-list"></div>
  </section>
  <section id="tab-pagos" class="view"><div id="pagos"></div></section>
  <section id="tab-ajustes" class="view"><div id="ajustes"></div></section>
</main>

<div id="modal-bg" class="modal-bg"><div id="modal" class="modal"></div></div>

<script>
const KEY='canchas-futbol-v1';
const DEF={teams:[],matches:[],payments:[],config:{inscripcion:1500,arbitraje:500,totalJuegos:15,recibieron:['Junior','Charro','Victor','Rony','Marco'],roles:{Junior:'Director general',Charro:'Director administrativo',Victor:'Director administrativo',Rony:'Roles y logística',Marco:''},arbitros:[],pagoArbitro:0,cuentas:[]}};
const clone=o=>JSON.parse(JSON.stringify(o));
// Completa los datos que vengan de la nube o del celular sin estas listas
function completar(d){
  const cfg={...clone(DEF.config),...(d.config||{})};
  if(!cfg.v2){ // lista nueva de personas con rol (incluye a Marco)
    cfg.recibieron=[...DEF.config.recibieron];
    cfg.roles={...DEF.config.roles};
    cfg.v2=true;
  }
  if(!cfg.arbitros) cfg.arbitros=[];
  // Marco es inversionista: no recibe pagos (si no tiene rol, se pone este)
  cfg.roles={...(cfg.roles||{})};
  if(!cfg.roles.Marco) cfg.roles.Marco='Inversionista';
  return {...clone(DEF),...d,config:cfg};
}
// Personas que reciben pagos (quitando a los inversionistas)
function cobradores(){
  const r=db.config.roles||{};
  return db.config.recibieron.filter(n=>!/inversion/i.test(r[n]||''));
}

function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(!s) return clone(DEF);
    return completar(s);
  }catch(e){return clone(DEF);}
}
let db=load();

/* ---------- Nube (Supabase): cada persona entra con su correo y su PIN ---------- */
const SUPA_URL='https://wyiqigrzcipywvijtchg.supabase.co';
const SUPA_KEY='sb_publishable_fy739Px-yWNLc9aripC7Ag_evHkSvgz';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY,{db:{schema:'canchas'}});
const ESTADO_ID='rancho-seco';
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){alert('No se pudo guardar en este navegador.');}
  subirNube();
}
async function subirNube(){
  const {error}=await sb.from('estado').upsert({id:ESTADO_ID,data:db,updated_at:new Date().toISOString()});
  if(error) alert('No se pudo guardar en la nube: '+error.message);
}
async function cargarNube(){
  const {data,error}=await sb.from('estado').select('data').eq('id',ESTADO_ID).maybeSingle();
  if(error) return;
  if(data&&data.data){
    db=completar(data.data);
    localStorage.setItem(KEY,JSON.stringify(db));
    renderAll();
  }else if(db.teams.length||db.payments.length){
    subirNube(); // la nube está vacía: sube lo que ya hay en este celular
  }
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden) cargarNube();});

const teamById=id=>db.teams.find(t=>t.id===id);

function cuentasList(){return [...new Set([...db.config.cuentas,...db.payments.map(p=>p.cuenta)].filter(Boolean))];}

// Arbitraje: solo cuentan los juegos desde el juego que el equipo marcó en su primer registro
function balance(tid){
  const t=teamById(tid);
  // Arbitraje: solo cuentan los partidos creados desde que el equipo se registró
  const ms=t?.registroDesde?matchesOf(tid).filter(m=>String(m.creado||'')>=t.registroDesde).length:0;
  const pays=db.payments.filter(p=>p.teamId===tid);
  const insDue=Number(db.config.inscripcion)||0;
  const insP=Math.max(sum(pays.filter(p=>p.tipo==='inscripcion')),t?.inscripcionPrevia?insDue:0);
  const arbP=sum(pays.filter(p=>p.tipo==='arbitraje'));
  const arbDue=(Number(db.config.arbitraje)||0)*ms;
  return {ms,insDue,insP,insPend:Math.max(0,insDue-insP),arbDue,arbP,arbPend:Math.max(0,arbDue-arbP)};
}

/* ---------- Canchas ---------- */
function side(m,s){
  const tid=s==='A'?m.a:m.b;
  const sc=s==='A'?m.sa:m.sb;
  return `<div class="tcol">
    <div class="pw"><button class="plus" data-act="score" data-match="${m.id}" data-side="${s}" aria-label="Sumar gol">+</button><span class="badge">${sc||0}</span></div>
    <span class="tname">${teamById(tid)?.juegoActual?`<b>J${teamById(tid).juegoActual}</b> `:''}${esc(teamName(tid))}</span>
    <button class="minus" data-act="unscore" data-match="${m.id}" data-side="${s}" aria-label="Restar gol">−</button>
  </div>`;
}
// Verde si el equipo está al día; rojo si debe
function estadoPago(tid){
  const b=balance(tid);
  return (b.insPend+b.arbPend)>0?'debe':'ok';
}
function renderFields(){
  let h='';
  for(let f=4;f>=1;f--){
    const m=activeMatch(f);
    h+=`<section class="fwrap">
      <div class="fhead"><span>Cancha ${f}</span>${m?`<div class="fcenter"><button class="arbchip" data-act="assign" data-field="${f}" title="Cambiar árbitro o partido">${esc(m.arbitro||'Sin árbitro')}</button><button class="whistle" data-act="terminar" data-match="${m.id}" title="Terminar partido" aria-label="Terminar partido">${SILBATO}</button></div><span></span>`:`<span></span><span></span>`}</div>
      <div class="field"><span class="circle"></span>`;
    if(m){
      h+=`<div class="row">
        <button class="dollar ${estadoPago(m.a)}" data-act="pay" data-team="${m.a}" data-match="${m.id}" title="Pagos de ${esc(teamName(m.a))}">$</button>
        ${side(m,'A')}
        ${side(m,'B')}
        <button class="dollar ${estadoPago(m.b)}" data-act="pay" data-team="${m.b}" data-match="${m.id}" title="Pagos de ${esc(teamName(m.b))}">$</button>
      </div>`;
    }else{
      h+=`<div class="nomatch"><button class="asignar" data-act="assign" data-field="${f}" title="Asignar partido" aria-label="Asignar partido"><img src="silbato.png" alt="Asignar partido" class="silb-big"></button></div>`;
    }
    h+=`</div></section>`;
  }
  $('#fields').innerHTML=h;
}
function changeScore(mid,side,d){
  const m=matchById(mid); if(!m) return;
  const k=side==='A'?'sa':'sb';
  m[k]=Math.max(0,(m[k]||0)+d);
  save(); renderFields();
}

function buscadorEquipo(s,titulo,teamId){
  const t=teamById(teamId);
  return `<label><input id="as-${s}-txt" autocomplete="off" placeholder="Escribe el ${esc(titulo.toLowerCase())}" value="${esc(t?t.name:'')}"></label>

    <input type="hidden" name="${s}" id="as-${s}-val" value="${esc(teamId||'')}">`;
}
function activarBuscador(s){
  const txt=$(`#as-${s}-txt`), sug=$(`#as-${s}-sug`), val=$(`#as-${s}-val`);
  const pintar=()=>{
    // Cada palabra que escriben tiene que estar en el nombre del equipo
    const toks=norm(txt.value.trim()).split(/\s+/).filter(Boolean);
    const hits=db.teams.filter(t=>toks.every(k=>norm(t.name).includes(k)));
    sug.innerHTML=hits.map(t=>`<button type="button" class="sug" data-pick="${t.id}" data-side="${s}">${esc(t.name)}</button>`).join('')
      +(hits.length?'':'<div class="muted">Ningún equipo tiene ese nombre. Revisa otra vez antes de agregar uno nuevo.</div>')
      +(toks.length&&!hits.length?`<button type="button" class="sug nuevo" data-nuevo="${s}">+ Agregar nuevo equipo</button>`:'');
  };
  txt.addEventListener('input',()=>{val.value='';pintar();});
  txt.addEventListener('focus',pintar);
  sug.addEventListener('click',e=>{
    const nu=e.target.closest('[data-nuevo]');
    if(nu){abrirNuevoDesdeBusqueda(s,txt.value.trim());return;}
    const b=e.target.closest('[data-pick]'); if(!b) return;
    val.value=b.dataset.pick;
    txt.value=teamName(b.dataset.pick);
    sug.innerHTML='';
  });
}

// Al agregar desde el buscador: ¿el nombre es un jugador o un equipo?
const ICO_JUGADOR='<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>';
const ICO_EQUIPO='<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>';
let chooserModo=null; // 'jugador' | 'equipo'
// Lo que ya existe con ese nombre: equipos y jugadores (sin importar mayúsculas ni acentos)
function coincidencias(n){
  const toks=norm(n).split(/\s+/).filter(Boolean);
  if(!toks.length) return {equipos:[],jugadores:[]};
  const equipos=db.teams.filter(t=>toks.every(k=>norm(t.name).includes(k)));
  const jugadores=[];
  db.teams.forEach(t=>t.players.forEach(p=>{if(toks.every(k=>norm(p).includes(k))) jugadores.push({p,t});}));
  return {equipos,jugadores};
}
function renderCoinc(n){
  const {equipos,jugadores}=coincidencias(n);
  const lista=[
    ...equipos.map(t=>`<div class="coinc">${ICO_EQUIPO}<span><b>${esc(t.name)}</b> · equipo registrado</span></div>`),
    ...jugadores.map(x=>`<div class="coinc">${ICO_JUGADOR}<span><b>${esc(x.p)}</b> · jugador de ${esc(x.t.name)}</span></div>`)
  ];
  $('#ch-coinc').innerHTML=lista.length
    ?`<p class="pend" style="margin:6px 0">Ya existe. Elige una de estas opciones o cambia el nombre.</p>${lista.join('')}`
    :'<p class="ok" style="margin:6px 0">No existe en la lista.</p>';
  return lista.length>0;
}

  chooserModo=null;

    <h3 id="ch-titulo" class="nomclick" data-act="editnombre" title="Toca para editar">${esc(cap(nombre.trim()))}</h3>
    <input id="ch-nombre" autocomplete="off" style="display:none" value="${esc(cap(nombre.trim()))}">
    <div id="ch-coinc"></div>
    <p class="muted">¿Qué es este nombre?</p>
    <div class="cuadros" style="grid-template-columns:1fr 1fr">
      <button type="button" class="sq" data-act="esjugador">${ICO_JUGADOR}<br>Es un jugador</button>
      <button type="button" class="sq" data-act="esequipo">${ICO_EQUIPO}<br>Es un equipo</button>
    </div>
    <div id="ch-body"></div>
    <div class="actions"><button type="button" class="btn ghost" data-act="close">Cancelar</button></div>
  </div>`);
  const inp=$('#ch-nombre');
  renderCoinc(inp.value);
  inp.addEventListener('input',()=>{
    const v=inp.value;
    renderCoinc(v);
    if(chooserModo==='jugador') chooserJugador(v);
    else if(chooserModo==='equipo') chooserEquipo(v);

  inp.addEventListener('blur',()=>{
    inp.style.display='none';
    const h=$('#ch-titulo');
    h.textContent=nombreChooser()||'Nuevo registro';
    h.style.display='';

function ceGuardar(){
  const name=cap(($('#ce-nombre').value||'').trim());
  const jug=cap(($('#ce-jug').value||'').trim());
  const tel=($('#ce-tel').value||'').replace(/\D/g,'');
  const err=m=>{$('#ce-err').textContent=m;};
  if(!name) return err('Escribe el nombre del equipo.');
  if(!jug) return err('Escribe el nombre del jugador.');
  if(db.teams.some(t=>norm(t.name)===norm(name))) return err('Ese equipo ya existe. Búscalo arriba.');
  if(similares(name).length) return err('Se parece a un equipo que ya existe. Búscalo arriba.');
  if(!/^\d{10}$/.test(tel)) return err('Escribe el teléfono (10 dígitos).');
  db.teams.push({id:uid(),name,players:[jug],lider:jug,telefonos:{[jug]:tel}});
  save(); closeModal(); renderAll();
}

// Equipo encontrado: el jugador se suma a ese equipo (sin pedir teléfono)
function cjPick(tid){
  const t=teamById(tid); if(!t) return;
  const pl=nombreChooser();
  if(!t.players.some(p=>norm(p)===norm(pl))){
    t.players.push(pl);
    if(!t.lider) t.lider=pl;
  }
  save(); closeModal(); renderAll();
}

function cjGuardar(){

  const err=m=>{$('#cj-err').textContent=m;};
  if(!name) return err('Escribe el nombre del equipo.');
  if(db.teams.some(t=>norm(t.name)===norm(name))) return err('Ese equipo ya existe. Búscalo arriba.');

function openAssign(f,pre){
  asignandoField=f;
  if(db.teams.length<2){
    openTeam(null);
    const note=document.createElement('p');
    note.className='muted';
    note.textContent=`Para asignar la cancha necesitas al menos 2 equipos. Registra este y luego el siguiente.`;
    $('#modal form')?.prepend(note);
    return;
  }
  const cur=activeMatch(f);
  openModal(`<form id="as-form">
    <h3>Cancha ${f}</h3>
    ${buscadorEquipo('a','Equipo 1',pre?pre.a:(cur?cur.a:''))}
    <div class="vs">VS</div>
    ${buscadorEquipo('b','Equipo 2',pre?pre.b:(cur?cur.b:''))}
    ${buscadorArbitro(cur?.arbitro||'')}
    <p id="as-err" class="pend"></p>
    <div class="actions">
      ${cur?`<button type="button" class="btn danger" data-act="unassign" data-field="${f}">Quitar partido</button>`:''}
      <button type="button" class="btn ghost" data-act="close">Cancelar</button>
      <button class="btn primary">Iniciar juego</button>
    </div>
  </form>`);
  activarArbitro();
  ['a','b'].forEach(s=>activarBuscador(s));
  $('#as-form').onsubmit=e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const a=fd.get('a'), b=fd.get('b');
    if(!a||!b){$('#as-err').textContent='Elige los dos equipos de la lista.';return;}
    if(a===b){$('#as-err').textContent='Elige dos equipos distintos.';return;}
    db.matches.forEach(m=>{if(m.field===f&&m.activo)m.activo=false;});
    const arb=String(fd.get('arbitro')||'').trim();
    if(arb&&!(db.config.arbitros||[]).some(x=>norm(x)===norm(arb))) db.config.arbitros.push(arb);
    db.matches.push({id:uid(),field:f,a,b,arbitro:arb,sa:0,sb:0,activo:true,creado:new Date().toISOString()});
    save(); closeModal(); renderAll();
  };
}
function unassign(f){
  db.matches.forEach(m=>{if(m.field===f&&m.activo)m.activo=false;});
  save(); closeModal(); renderAll();
}

  const adeudo=b.insPend+b.arbPend;
  openModal(`<form id="pay-form">
    <h3>Pago · ${esc(t.name)}${m?` · <span class="cchip">Cancha ${m.field}</span>`:''}</h3>
    ${b.insPend>0
      ?`<div class="dosc">
        <label>Inscripción<input class="montoGrande" name="monto_ins" type="number" min="0" step="1" placeholder="$0"></label>
        <label>Arbitraje<input class="montoGrande" name="monto_arb" type="number" min="0" step="1" placeholder="$0"></label>

      <label class="chk"><input type="checkbox" id="p-insprev" name="insPrevia" ${t.inscripcionPrevia?'checked':''}> Ya pagó el 100% de la inscripción</label>
    </div>
    <div id="p-insq" style="display:${t.inscripcionPrevia?'block':'none'};margin-bottom:12px">
      <div class="lbl">¿A quién se le pagó la inscripción?</div>
      <div class="cuadros" id="p-insrecibe">
        ${cobradores().map(n=>`<button type="button" class="sq${t.inscripcionRecibio===n?' on':''}" data-ins="${esc(n)}">${esc(n)}</button>`).join('')}
      </div>
      <input type="hidden" name="recibioIns" id="p-recibioIns" value="${esc(t.inscripcionRecibio||'')}">

// Filtro de fechas en Pagos (hoy, semana, mes, rango o todo)
let filtroPagos={modo:'hoy',desde:'',hasta:'',abierto:false};
const PERIODOS=[['hoy','Hoy'],['ayer','Ayer'],['semana','Esta semana'],['semana_pas','Semana pasada'],['mes','Este mes'],['mes_pas','Mes pasado'],['d30','Últimos 30 días'],['anio','Este año'],['todo','Total']];
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
// Fechas (desde, hasta) de cada periodo; vacío = sin límite
function rangoDe(modo){
  const hoy=new Date(); hoy.setHours(hoy.getHours()-5);
  const h=ymd(hoy);
  const dias=n=>{const x=new Date(hoy);x.setDate(x.getDate()+n);return ymd(x);};
  const lunes=(semanas)=>{const x=new Date(hoy);x.setDate(x.getDate()-((x.getDay()+6)%7)-semanas*7);return x;};
  if(modo==='hoy') return [h,h];
  if(modo==='ayer') return [dias(-1),dias(-1)];
  if(modo==='semana') return [ymd(lunes(0)),h];
  if(modo==='semana_pas'){const a=lunes(1);const b=new Date(a);b.setDate(b.getDate()+6);return [ymd(a),ymd(b)];}
  if(modo==='mes') return [h.slice(0,8)+'01',h];
  if(modo==='mes_pas'){return [ymd(new Date(hoy.getFullYear(),hoy.getMonth()-1,1)),ymd(new Date(hoy.getFullYear(),hoy.getMonth(),0))];}
  if(modo==='d30') return [dias(-29),h];
  if(modo==='anio') return [h.slice(0,4)+'-01-01',h];
  if(modo==='rango') return [filtroPagos.desde,filtroPagos.hasta];
  return ['',''];
}
function enRango(f){
  const s=String(f||''), [a,b]=rangoDe(filtroPagos.modo);
  return (!a||s>=a)&&(!b||s<=b);
}
function etiquetaPeriodo(){
  const p=PERIODOS.find(x=>x[0]===filtroPagos.modo);
  if(p) return p[1];
  const [a,b]=rangoDe('rango');
  const fmt=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:'…';
  return `${fmt(a)} → ${fmt(b)}`;
}
function filtroHTML(){
  const chips=PERIODOS.map(([k,l])=>`<button type="button" class="fchip${filtroPagos.modo===k?' on':''}" data-act="filtro" data-modo="${k}">${l}</button>`).join('');
  return `<div class="fbox">
    <button type="button" class="pbtn" data-act="periodo">
      <span>📅 ${esc(etiquetaPeriodo())}</span><span class="flecha">${filtroPagos.abierto?'▴':'▾'}</span>
    </button>
    ${filtroPagos.abierto?`<div class="ppanel">
      <div class="fchips">${chips}</div>
      <div class="plbl">Rango personalizado</div>
      ${calHTML()}
    </div>`:''}
  </div>`;
}
// Calendario para elegir un rango: toca el primer día y luego el último
function calHTML(){
  const hoy=new Date();
  const y=filtroPagos.calY??hoy.getFullYear(), m=filtroPagos.calM??hoy.getMonth();
  const primero=new Date(y,m,1);
  const dias=new Date(y,m+1,0).getDate();
  const {desde,hasta}=filtroPagos;
  let celdas='';
  for(let i=0;i<primero.getDay();i++) celdas+='<span></span>';
  for(let d=1;d<=dias;d++){
    const s=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls=['cd',(s===desde||s===hasta)?'fin':'',(desde&&hasta&&s>desde&&s<hasta)?'medio':''].join(' ').trim();
    celdas+=`<button type="button" class="${cls}" data-act="caldia" data-d="${s}">${d}</button>`;
  }
  const nombre=primero.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  const pista=!desde?'Toca el primer día':(!hasta?'Ahora toca el último día':'');
  return `<div class="cal">
    <div class="calhead"><button type="button" class="calnav" data-act="calprev" aria-label="Mes anterior">‹</button><b>${esc(nombre)}</b><button type="button" class="calnav" data-act="calnext" aria-label="Mes siguiente">›</button></div>
    <div class="calgrid calsem">${['do','lu','ma','mi','ju','vi','sá'].map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="calgrid">${celdas}</div>
    <p class="calhint">${pista}</p>
  </div>`;
}

    </div>
    <ul class="plist" id="tm-list"></ul>
    <p id="tm-err" class="pend"></p>
    <div class="actions">
      <button type="button" class="btn ghost" data-act="close">Cancelar</button>
      <button type="button" class="btn primary" data-act="saveteam">Guardar equipo</button>
    </div>
  </form>`);
  $('#tm-name').addEventListener('input',()=>{
    const sim=similares($('#tm-name').value.trim());
    $('#tm-err').textContent=sim.length?`Ya existe o se parece a: ${sim.map(x=>x.name).join(', ')}. Búscalo antes de registrarlo.`:'';
  });
  renderDraft();
  $('#tm-pl').focus();
}
function renderDraft(){
  const list=$('#tm-list'); if(!list) return;
  list.innerHTML=draft.players.length?draft.players.map((p,i)=>`<li>
    <span>${esc(p)} <small class="muted">${esc(draft.tel[p]||'sin teléfono')}</small>${p===draft.lider?' <b>· LÍDER (paga)</b>':''}</span>
    <span class="rowbtns">
      ${p===draft.lider?'':`<button type="button" class="btn ghost sm" data-act="lider" data-i="${i}">Hacer líder</button>`}
      <button type="button" class="btn danger sm" data-act="quitarj" data-i="${i}">Quitar</button>
    </span></li>`).join(''):'<li class="muted">Aún no hay jugadores.</li>';
}
function addPlayerDraft(){
  const inp=$('#tm-pl');
  const name=cap(inp.value.trim());
  if(!name) return;
  if(draft.players.some(p=>norm(p)===norm(name))){$('#tm-err').textContent='Ese jugador ya está en la lista.';return;}
  const tel=($('#tm-tel').value||'').replace(/\D/g,'');
  if(tel&&!/^\d{10}$/.test(tel)){$('#tm-err').textContent='El teléfono debe tener 10 dígitos (o déjalo vacío).';return;}
  draft.tel[name]=tel;
  draft.players.push(name);
  if(!draft.lider) draft.lider=name;
  inp.value=''; $('#tm-err').textContent='';
  renderDraft(); inp.focus();
}
function saveDraft(){
  const name=cap($('#tm-name').value.trim());
  if(!name){$('#tm-err').textContent='Escribe el nombre del equipo.';return;}
  if(db.teams.some(t=>t.id!==draft.id&&norm(t.name)===norm(name))){
    $('#tm-err').textContent='Ya existe un equipo con ese nombre. Búscalo y úsalo; no lo registres otra vez.';
    return;
  }
  if(draft.desdeBusqueda&&!$('#tm-noexiste')?.checked){$('#tm-err').textContent='Marca la casilla: confirma que revisaste la lista y ningún equipo es este.';return;}
  if(!draft.players.length){$('#tm-err').textContent='Agrega al menos un jugador (el líder).';return;}
  if(!draft.players.some(p=>/^\d{10}$/.test(draft.tel[p]||''))){$('#tm-err').textContent='Agrega el teléfono de al menos una persona del equipo.';return;}
  const sim=similares(name);
  if(sim.length&&!$('#tm-otro')?.checked){
    $('#tm-err').textContent=`Se parece a: ${sim.map(x=>x.name).join(', ')}. Si es el mismo, cancela y úsalo. Si es otro equipo, marca "Confirmo que es otro equipo" y guarda.`;
    $('#tm-otro-l').style.display='block';
    return;
  }
  const telefonos={};
  draft.players.forEach(p=>{telefonos[p]=draft.tel[p];});
  const data={name,players:[...draft.players],lider:draft.lider||draft.players[0],telefonos};
  const t=draft.id?teamById(draft.id):null;
  let id;
  if(t){Object.assign(t,data);id=t.id;}
  else{id=uid();db.teams.push({id,...data});}
  const vuelta=alVolver; alVolver=null;
  draft=null; save(); closeModal(); renderAll();
  if(vuelta){vuelta[vuelta.side]=id; openAssign(vuelta.f,vuelta);}
}
// Equipos que se parecen: contienen el nombre, o difieren en muy poco (números distintos = equipos distintos)
function lev(a,b){
  let p=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const c=[i];
    for(let j=1;j<=b.length;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
    p=c;
  }
  return p[b.length];
}
function similares(name){
  const n=norm(name).replace(/\s+/g,' ').trim();
  if(!n) return [];
  return db.teams.filter(t=>{
    if(draft&&t.id===draft.id) return false;
    const m=norm(t.name).replace(/\s+/g,' ').trim();
    if(m===n) return true;
    if(/\d/.test(m+n)&&m.replace(/\d/g,'').trim()===n.replace(/\d/g,'').trim()) return false;
    return m.includes(n)||n.includes(m)||lev(m,n)<=2;
  });
}
function deleteTeam(id){
  const t=teamById(id); if(!t) return;
  if(matchesOf(id).length||db.payments.some(p=>p.teamId===id)){
    alert(`${t.name} tiene partidos o pagos registrados, no se puede borrar.`);return;
  }
  if(!confirm(`¿Borrar el equipo ${t.name}?`)) return;
  db.teams=db.teams.filter(x=>x.id!==id);
  save(); renderAll();
}
function renderTeams(){
  $('#teams-list').innerHTML=db.teams.length?db.teams.map(t=>`<div class="card team">
    <div><b>${esc(t.name)}</b><br><small class="muted">Líder (paga): ${esc(t.lider||'—')}</small><br><small class="muted">${t.players.length} jugador${t.players.length===1?'':'es'}${t.players.length?': '+esc(t.players.join(', ')):''}</small></div>
    <div class="actions" style="margin-top:0">
      <button class="btn ghost sm" data-act="editteam" data-id="${t.id}">Editar</button>
      <button class="btn danger sm" data-act="delteam" data-id="${t.id}">Borrar</button>
    </div></div>`).join(''):'<p class="muted">Aún no hay equipos. Agrega el primero.</p>';
}

/* ---------- Ajustes ---------- */
let ajEdit=null; // monto que se está editando en Ajustes
function tarjetaMonto(k,titulo,val,fmt){
  if(ajEdit===k) return `<div class="mcard"><small>${titulo}</small>
    <input id="ed-${k}" type="number" min="0" value="${val}">
    <div class="actions" style="justify-content:center;margin-top:6px"><button class="btn ghost sm" data-act="ajcancel">Cancelar</button><button class="btn primary sm" data-act="ajsave" data-k="${k}">Guardar</button></div></div>`;
  return `<div class="mcard"><b>${fmt(val)}</b><small>${titulo}</small><button class="btn ghost sm" data-act="ajedit" data-k="${k}">Editar</button></div>`;
}
function ajSave(k){
  const v=Math.max(k==='totalJuegos'?1:0,Number($('#ed-'+k).value)||0);
  db.config[k]=v; ajEdit=null;
  save(); renderAll(); renderAjustes();
}
function addPersona(){
  const n=$('#np-n').value.trim(), r=$('#np-r').value.trim();
  if(!n) return alert('Escribe el nombre');
  if(db.config.recibieron.some(x=>norm(x)===norm(n))) return alert('Esa persona ya está en la lista');
  db.config.recibieron.push(n);
  db.config.roles={...(db.config.roles||{}),[n]:r};
  save(); renderAll(); renderAjustes();
}
function quitarPersona(n){
  if(!confirm(`¿Quitar a ${n} de la lista?`)) return;
  db.config.recibieron=db.config.recibieron.filter(x=>x!==n);
  delete (db.config.roles||{})[n];
  save(); renderAll(); renderAjustes();
}
function addArbitro(){
  const n=$('#na-n').value.trim();
  if(!n) return alert('Escribe el nombre del árbitro');
  if((db.config.arbitros||[]).some(x=>norm(x)===norm(n))) return alert('Ese árbitro ya está en la lista');
  db.config.arbitros=[...(db.config.arbitros||[]),n];
  save(); renderAjustes();
}
function quitarArbitro(n){
  if(!confirm(`¿Quitar a ${n} de la lista?`)) return;
  db.config.arbitros=db.config.arbitros.filter(x=>x!==n);
  save(); renderAjustes();
}
function renderAjustes(){
  const roles=db.config.roles||{};
  $('#ajustes').innerHTML=`
    <div class="card">
      <h3>Montos</h3>
      <div class="mrow">
        ${tarjetaMonto('inscripcion','Inscripción',Number(db.config.inscripcion)||0,money)}
        ${tarjetaMonto('arbitraje','Arbitraje por equipo y juego',Number(db.config.arbitraje)||0,money)}
        ${tarjetaMonto('totalJuegos','Juegos del torneo',Number(db.config.totalJuegos)||15,v=>v)}
        ${tarjetaMonto('pagoArbitro','Pago por juego al árbitro',Number(db.config.pagoArbitro)||0,money)}
      </div>
    </div>
    <div class="card">
      <h3>Equipo</h3>
      <ul class="plist">${db.config.recibieron.map(n=>`<li><span><b>${esc(n)}</b><br><small class="muted">${esc(roles[n]||'Sin rol')}</small></span><button class="btn danger sm" data-act="quitarp" data-n="${esc(n)}">Quitar</button></li>`).join('')||'<li class="muted">Sin personas.</li>'}</ul>
      <div class="addrow"><input id="np-n" autocomplete="off" placeholder="Nombre"><input id="np-r" autocomplete="off" placeholder="Rol (ej. Director general)"></div>
      <div class="actions" style="justify-content:flex-start;margin-top:0"><button class="btn primary sm" data-act="addp">+ Agregar a la lista</button></div>
    </div>
    <div class="card">
      <h3>Árbitros</h3>
      <ul class="plist">${(db.config.arbitros||[]).map(a=>`<li><span><b>${esc(a)}</b></span><button class="btn danger sm" data-act="quitarb" data-n="${esc(a)}">Quitar</button></li>`).join('')||'<li class="muted">Aún no hay árbitros.</li>'}</ul>
      <div class="addrow"><input id="na-n" autocomplete="off" placeholder="Nombre del árbitro"></div>
      <div class="actions" style="justify-content:flex-start;margin-top:0"><button class="btn primary sm" data-act="addarb">+ Agregar árbitro</button></div>
    </div>
    <div class="card">
      <h3>Respaldo</h3>
      <p class="muted">Los datos se guardan en este navegador. Exporta un respaldo para no perderlos o llevarlos a otra computadora.</p>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn ghost" data-act="export">Exportar respaldo</button>
        <input type="file" id="imp" accept="application/json,.json">
      </div>
    </div>`;
  $('#imp').onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    if(!confirm('Esto reemplaza los datos actuales de este navegador. ¿Continuar?')){e.target.value='';return;}
    file.text().then(txt=>{
      const d=JSON.parse(txt);
      if(!Array.isArray(d.teams)||!Array.isArray(d.matches)||!Array.isArray(d.payments)) throw new Error('formato');
      db={...clone(DEF),...d,config:{...DEF.config,...(d.config||{})}};
      save(); renderAll(); renderAjustes(); alert('Respaldo importado');
    }).catch(()=>alert('El archivo no es un respaldo válido.'));
  };
}
function exportDb(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`canchas-respaldo-${today()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---------- Buscador ---------- */
const q=$('#q');
function renderResults(){
  const box=$('#results');
  const term=norm(q.value.trim());
  if(!term){box.classList.remove('show');box.innerHTML='';return;}
  const hits=[];
  db.teams.forEach(t=>{
    const teamHit=norm(t.name).includes(term);
    const ph=t.players.find(p=>norm(p).includes(term));
    if(teamHit||ph) hits.push({t,player:teamHit?null:ph});
  });
  box.innerHTML=(hits.length?hits.slice(0,30).map(({t,player})=>{
    const am=teamActiveMatch(t.id);
    return `<button data-act="pickresult" data-team="${t.id}"><b>${esc(t.name)}</b>${player?` · ${esc(player)}`:''}<br><small>${am?`Cancha ${am.field}`:'Sin partido asignado'}</small></button>`;
  }).join(''):`<div class="empty-res">No hay equipos ni jugadores con ese nombre.</div>`)
    +`<button class="addteam" data-act="addteam" data-name="${esc(q.value.trim())}">+ Agregar equipo</button>`;
  box.classList.add('show');
}
function pickResult(tid){
  q.value='';
  $('#results').classList.remove('show');
  openPay(tid,teamActiveMatch(tid)?.id||null);
}
q.addEventListener('input',renderResults);
q.addEventListener('focus',renderResults);

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='modal-bg'){closeModal();return;}
  if(!e.target.closest('.search')) $('#results').classList.remove('show');
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const d=el.dataset;
  switch(d.act){
    case 'tab': showTab(d.tab); break;
    case 'pay': openPay(d.team,d.match||null); break;
    case 'score': changeScore(d.match,d.side,1); break;
    case 'unscore': changeScore(d.match,d.side,-1); break;
    case 'assign': openAssign(Number(d.field)); break;
    case 'unassign': unassign(Number(d.field)); break;
    case 'newteam': openTeam(null); break;
    case 'editteam': openTeam(d.id); break;
    case 'delteam': deleteTeam(d.id); break;
    case 'delpay': deletePayment(d.id,d.team,d.match||null); break;
    case 'close': closeModal(); break;
    case 'tp-pick': $('#tp-val').value=d.n; $('#tp-q').value=d.n; $('#tp-list').innerHTML=''; break;
    case 'tp-nuevo': $('#tp-val').value=cap(d.n.trim()); $('#tp-q').value=cap(d.n.trim()); $('#tp-list').innerHTML=''; break;
    case 'ar-pick': $('#ar-val').value=d.n; $('#ar-q').value=d.n; $('#ar-list').innerHTML=''; break;
    case 'ar-nuevo': $('#ar-val').value=cap(d.n.trim()); $('#ar-q').value=cap(d.n.trim()); $('#ar-list').innerHTML=''; break;
    case 'terminar': openTerminar(d.match); break;
    case 'addplayer': addPlayerDraft(); break;
    case 'lider': draft.lider=draft.players[+d.i]; renderDraft(); break;
    case 'quitarj': {const r=draft.players.splice(+d.i,1)[0]; if(draft.lider===r) draft.lider=draft.players[0]||null; renderDraft(); break;}
    case 'saveteam': saveDraft(); break;
    case 'pickresult': pickResult(d.team); break;
    case 'addteam': q.value=''; $('#results').classList.remove('show'); abrirChooser(d.name); break;
    case 'editnombre': $('#ch-titulo').style.display='none'; $('#ch-nombre').style.display='block'; $('#ch-nombre').focus(); break;
    case 'esjugador': chooserJugador(nombreChooser()); break;
    case 'cj-pick': cjPick(d.team); break;
    case 'cj-nuevo': cjNuevo(); break;
    case 'cj-guardar': cjGuardar(); break;
    case 'esequipo': chooserEquipo(nombreChooser()); break;
    case 'pickteam': closeModal(); pickResult(d.team); break;
    case 'ce-jpick': cePick(d.n); break;
    case 'ce-guardar': ceGuardar(); break;
    case 'equiponuevo': openTeam(null,d.n,true); break;
    case 'registrarjugador': openTeam(null,'',true,d.n); break;
    case 'export': exportDb(); break;
    case 'ajedit': ajEdit=d.k; renderAjustes(); break;
    case 'ajcancel': ajEdit=null; renderAjustes(); break;
    case 'ajsave': ajSave(d.k); break;
    case 'addp': addPersona(); break;
    case 'quitarp': quitarPersona(d.n); break;
    case 'addarb': addArbitro(); break;
    case 'quitarb': quitarArbitro(d.n); break;
    case 'filtro': filtroPagos={...filtroPagos,modo:d.modo,abierto:false}; renderPagos(); break;
    case 'periodo': filtroPagos={...filtroPagos,abierto:!filtroPagos.abierto}; renderPagos(); break;
    case 'calprev':
    case 'calnext': {
      const base=new Date(filtroPagos.calY??new Date().getFullYear(),filtroPagos.calM??new Date().getMonth(),1);
      base.setMonth(base.getMonth()+(d.act==='calnext'?1:-1));
      filtroPagos={...filtroPagos,calY:base.getFullYear(),calM:base.getMonth()}; renderPagos(); break;
    }
    case 'caldia': {
      const {desde,hasta}=filtroPagos, s=d.d;
      let nd=s, nh='';
      if(desde&&!hasta&&s>=desde){nd=desde;nh=s;}
      filtroPagos={...filtroPagos,modo:'rango',desde:nd,hasta:nh,abierto:!nh};
      renderPagos(); break;
    }
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter'&&e.target.id==='tm-pl'){e.preventDefault();addPlayerDraft();}
});

renderAll();

try{pestanaInicial=sessionStorage.getItem('canchas-pestana')||'canchas';}catch(e){}
showTab(pestanaInicial);
cargarNube();
