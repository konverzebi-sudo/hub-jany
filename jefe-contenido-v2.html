<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jefe de Contenido — JefesHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F0B16;
    --surface:#181120;
    --surface-2:#211829;
    --line:#332A3D;
    --text:#F3EEF9;
    --text-dim:#B6A9C7;
    --accent:#B8F725;
    --accent-soft:#2E3610;
    --t1:#1E3A8A;--t2:#3B82C4;--t3:#38BDF8;--t4:#FACC15;--t5:#F5B21C;
    --t6:#FB923C;--t7:#F97316;--t8:#EF4444;--t9:#DC2626;--t10:#B91C1C;
    --adq:#6366F1;--adq-soft:#1E1B4B;
    --con:#0EA5E9;--con-soft:#082F49;
    --conv:#22C55E;--conv-soft:#052E16;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#241733 0%,var(--bg) 55%);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding:28px 16px 80px;}
  h1,.display{font-family:'Sora',sans-serif;}
  .wrap{max-width:1400px;margin:0 auto;}
  h1{font-size:clamp(24px,3.4vw,32px);font-weight:800;margin:0 0 6px;}
  .sub{color:var(--text-dim);font-size:14px;margin:0 0 22px;line-height:1.5;max-width:640px;}

  /* TABS */
  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .tab{padding:10px 16px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;user-select:none;font-family:'Sora',sans-serif;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab .count{display:inline-block;margin-left:6px;background:var(--surface-2);color:var(--text-dim);border-radius:10px;padding:1px 8px;font-size:11px;font-family:'JetBrains Mono',monospace;}
  .tab.tab-agente .count{background:var(--accent-soft);color:var(--accent);}

  /* STATS BAR */
  .stats-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;}
  .stat-pill{display:flex;align-items:center;gap:6px;font-size:12px;font-family:'JetBrains Mono',monospace;}
  .stat-pill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .stat-pill .dot-adq{background:var(--adq);}
  .stat-pill .dot-con{background:var(--con);}
  .stat-pill .dot-conv{background:var(--conv);}
  .stat-pill .dot-dim{background:var(--text-dim);}
  .stat-value{font-weight:600;color:var(--text);}
  .stat-label{color:var(--text-dim);}
  .stats-bar-track{flex:1;min-width:160px;display:flex;border-radius:6px;overflow:hidden;height:8px;align-self:center;}
  .track-seg{height:100%;transition:width .4s;}

  /* TOOLBAR */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  input[type=text].search,select.filter{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:var(--surface);color:var(--text);font-family:'Inter',sans-serif;outline:none;}
  input[type=text].search{width:200px;}
  input[type=text].search::placeholder{color:var(--text-dim);}
  input[type=text].search:focus,select.filter:focus{border-color:var(--accent);}
  .status{font-size:12px;color:var(--text-dim);margin:0;min-height:16px;font-family:'JetBrains Mono',monospace;}

  /* SECTIONS & CARDS */
  .section{margin-bottom:30px;}
  .section-head{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;margin-bottom:14px;font-weight:700;font-size:13.5px;font-family:'Sora',sans-serif;letter-spacing:.02em;}
  .section-head.proceso{background:#332708;color:#F5C84C;}
  .section-head.programado{background:#0C2E33;color:#4FD1E8;}
  .section-head.idea{background:#1B2142;color:#A8B4F0;}
  .section-head.publicado{background:#3A2013;color:#FF9466;}
  .section-head .scount{font-weight:400;opacity:.7;font-size:12px;font-family:'JetBrains Mono',monospace;}
  .empty-row{padding:18px;text-align:center;color:var(--text-dim);font-size:13px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  .item-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--horizon,var(--t1));border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y;}
  .item-top{display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .item-top-right{display:flex;align-items:center;gap:6px;}
  .item-del{border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:14px;padding:5px 7px;border-radius:6px;opacity:.5;transition:.15s;}
  .item-del:hover{color:#EF4444;opacity:1;background:rgba(239,68,68,.1);}
  select.estado-select{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:5px 10px;border-radius:100px;border:1px solid transparent;cursor:pointer;}
  select.estado-select.idea{background:#1B2142;color:#A8B4F0;border-color:#3A4380;}
  select.estado-select.proceso{background:#332708;color:#F5C84C;border-color:#6B4F14;}
  select.estado-select.programado{background:#0C2E33;color:#4FD1E8;border-color:#155B66;}
  select.estado-select.publicado{background:#3A2013;color:#FF9466;border-color:#7A3A1E;}
  .fecha-input{width:128px;background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:5px 8px;outline:none;color-scheme:dark;}
  .fecha-input:focus{border-color:var(--accent);color:var(--text);}
  textarea.gancho-input{width:100%;border:none;background:transparent;color:var(--text);font-family:'Sora',sans-serif;font-size:15.5px;font-weight:700;line-height:1.4;resize:none;padding:0;outline:none;min-height:24px;}
  .item-fase{font-size:11.5px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}

  /* BADGES */
  .badges-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:700;padding:3px 8px;border-radius:100px;letter-spacing:.02em;border:1px solid transparent;}
  .badge-adquisicion{background:var(--adq-soft);color:var(--adq);border-color:#312E81;}
  .badge-consideracion{background:var(--con-soft);color:var(--con);border-color:#0C4A6E;}
  .badge-conversion{background:var(--conv-soft);color:var(--conv);border-color:#14532D;}
  .badge-fria{background:#0F172A;color:#94A3B8;border-color:#1E293B;}
  .badge-tibia{background:#1C1917;color:#D4A96A;border-color:#292524;}
  .badge-caliente{background:#1C0A0A;color:#F97316;border-color:#3B1515;}
  .badge-organico{background:#1E1B4B;color:#A5B4FC;border-color:#312E81;}
  .badge-evergreen{background:#1A2E05;color:#84CC16;border-color:#1A3A05;}
  .badge-ambos{background:#1C1A2E;color:#C084FC;border-color:#2E1A4B;}
  .badge-tipo{background:var(--surface-2);color:var(--text-dim);border-color:var(--line);}

  /* CARD DETAILS */
  .item-details{border-top:1px solid var(--line);padding-top:8px;}
  .item-details summary{cursor:pointer;font-size:12px;color:var(--horizon,var(--accent));font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.03em;list-style:none;display:flex;align-items:center;justify-content:space-between;}
  .item-details summary::-webkit-details-marker{display:none;}
  .detail-grid{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .detail-field label{display:block;font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;font-family:'JetBrains Mono',monospace;margin-bottom:4px;}
  .detail-field-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .detail-field-head label{margin-bottom:0;}
  .copy-field-btn{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:6px;line-height:1;}
  .copy-field-btn:hover{color:var(--accent);background:var(--accent-soft);}
  .detail-field textarea,.detail-field input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:8px 10px;resize:none;outline:none;line-height:1.5;}
  .detail-field textarea:focus,.detail-field input:focus{border-color:var(--accent);}
  .detail-field input.link-input{color:#7CB9E8;}
  .detail-meta-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn-guion{border:none;background:transparent;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;cursor:pointer;padding:2px 0;letter-spacing:.03em;text-transform:uppercase;opacity:.8;}
  .btn-guion:hover{opacity:1;}
  .guion-result{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;font-size:13px;line-height:1.7;white-space:pre-wrap;max-height:320px;overflow-y:auto;}

  /* CARPETA DE DOCUMENTOS (barra superior) */
  .carpeta-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px;}
  .carpeta-box label{font-size:10.5px;color:#7CB9E8;text-transform:uppercase;letter-spacing:.04em;font-family:'JetBrains Mono',monospace;}
  .carpeta-box input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:#7CB9E8;font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;outline:none;}
  .carpeta-box input[type=text]:focus{border-color:#7CB9E8;}
  .carpeta-box input[type=text]::placeholder{color:var(--text-dim);opacity:.7;}

  /* BANCO */
  .banco-add{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:26px;display:flex;flex-direction:column;gap:12px;}
  .banco-add-row{display:flex;gap:10px;flex-wrap:wrap;}
  .banco-add textarea{flex:1 1 300px;min-height:64px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;resize:vertical;outline:none;}
  .banco-add textarea:focus{border-color:var(--accent);}
  .banco-add input[type=text]{flex:1 1 200px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-size:14px;outline:none;}
  .banco-add input[type=text]:focus{border-color:var(--accent);}
  .banco-add-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .btn{font-family:'Inter',sans-serif;font-weight:700;font-size:13px;padding:10px 16px;border-radius:9px;cursor:pointer;border:none;transition:.15s;}
  .btn-ghost{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);}
  .btn-ghost:hover{background:var(--accent);color:#0F0B16;}
  .btn-solid{background:var(--accent);color:#0F0B16;}
  .btn-solid:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5;cursor:wait;}
  .suggest-result{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:10px;padding:12px 14px;}
  .suggest-result label{display:block;font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;font-family:'JetBrains Mono',monospace;margin-bottom:4px;}
  .suggest-result textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13.5px;padding:8px 10px;resize:vertical;outline:none;}
  .suggest-result textarea:focus{border-color:var(--accent);}
  .suggest-status{font-size:12px;color:var(--text-dim);min-height:16px;}
  .suggest-status.error{color:#F87171;}
  .banco-section-head{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;margin-bottom:10px;color:var(--text);}
  .banco-section-head .count{font-weight:400;opacity:.7;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text-dim);}
  .banco-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
  .banco-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .banco-item.aprobada{border-left:4px solid var(--accent);}
  .banco-item-text{flex:1;font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .banco-item-gancho{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;margin-bottom:4px;}
  .banco-item-caption{font-size:13px;color:var(--text-dim);white-space:pre-wrap;}
  .banco-item-link{font-size:12px;color:#7CB9E8;margin-top:6px;display:inline-block;word-break:break-all;}
  .banco-item-date{font-size:11px;color:var(--text-dim);margin-top:6px;font-family:'JetBrains Mono',monospace;}
  .banco-item-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);font-size:14px;}
  .icon-btn:hover{border-color:#EF4444;color:#EF4444;}
  .banco-empty{color:var(--text-dim);font-size:13px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px;}

  /* AGENTE TAB */
  .agente-wrap{display:flex;flex-direction:column;gap:16px;}
  .evergreen-panel{display:flex;flex-direction:column;gap:16px;}
  .agente-header{font-family:'Sora',sans-serif;font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:4px;}
  .mode-selector{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
  .mode-btn{padding:8px 14px;border-radius:100px;border:1px solid var(--line);background:var(--surface);color:var(--text-dim);font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:700;cursor:pointer;letter-spacing:.02em;transition:.15s;}
  .mode-btn:hover{border-color:var(--accent);color:var(--accent);}
  .mode-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .mode-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;}
  .mode-panel-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;margin:0 0 4px;}
  .mode-panel-desc{font-size:13px;color:var(--text-dim);line-height:1.5;margin:0 0 6px;}
  .mode-field{display:flex;flex-direction:column;gap:4px;}
  .mode-field label{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;font-family:'JetBrains Mono',monospace;}
  .mode-field input,.mode-field select,.mode-field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:10px 12px;outline:none;resize:vertical;}
  .mode-field input:focus,.mode-field select:focus,.mode-field textarea:focus{border-color:var(--accent);}
  .mode-fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mode-actions{display:flex;gap:10px;align-items:center;}
  .mode-output{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13.5px;line-height:1.8;white-space:pre-wrap;min-height:80px;color:var(--text);max-height:600px;overflow-y:auto;font-family:'Inter',sans-serif;}
  .mode-output-placeholder{color:var(--text-dim);font-style:italic;}
  .mode-status{font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text-dim);}
  .mode-status.error{color:#F87171;}

  /* IDEAS 366 */
  .evergreen-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 20px;}
  .evergreen-toolbar select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;outline:none;}
  .evergreen-selection-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;}
  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .cal-nav{display:flex;align-items:center;gap:10px;}
  .cal-nav button{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;}
  .cal-nav button:hover{border-color:var(--accent);color:var(--accent);}
  .cal-month-label{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;min-width:150px;text-align:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--text-dim);text-align:center;padding-bottom:4px;}
  .cal-cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:92px;padding:6px;display:flex;flex-direction:column;gap:4px;overflow:hidden;}
  .cal-cell.cal-empty{background:transparent;border:none;}
  .cal-cell.cal-today{border-color:var(--accent);}
  .cal-cell.cal-dragover{border-color:var(--accent);background:var(--accent-soft);}
  .cal-daynum{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);}
  .cal-chip{font-size:10.5px;line-height:1.3;padding:3px 6px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--t1);cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-chip:active{cursor:grabbing;}
  .cal-chip.cal-chip-dragging{opacity:.4;}
  .cal-chip:hover{background:var(--accent-soft);}
  .cal-sinfecha{margin-top:18px;}
  .cal-sinfecha-title{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;margin-bottom:8px;}
  .cal-sinfecha-list{display:flex;flex-wrap:wrap;gap:6px;}
  .evergreen-cat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:14px;}
  .evergreen-cat-title{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;margin:0 0 4px;}
  .evergreen-cat-desc{color:var(--text-dim);font-size:12px;margin:0 0 12px;}
  .evergreen-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
  table.evergreen-table{width:100%;border-collapse:collapse;min-width:640px;}
  table.evergreen-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);font-family:'JetBrains Mono',monospace;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);}
  table.evergreen-table td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.evergreen-table tr:last-child td{border-bottom:none;}
  table.evergreen-table textarea{width:100%;min-height:44px;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--text);padding:7px 8px;font-family:Inter,sans-serif;font-size:12.5px;outline:none;resize:vertical;}
  table.evergreen-table textarea:hover{border-color:var(--line);}
  table.evergreen-table textarea:focus{border-color:var(--accent);background:var(--surface-2);}
  .evergreen-row-del{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;padding:4px 8px;}
  .evergreen-row-del:hover{color:#EF4444;}
  .evergreen-row-add{background:transparent;border:1px dashed var(--line);color:var(--text-dim);font-family:Inter,sans-serif;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer;}
  .evergreen-row-add:hover{border-color:var(--accent);color:var(--accent);}
  .mode-add-banco{border:none;background:transparent;color:var(--accent);font-size:12px;font-family:'JetBrains Mono',monospace;cursor:pointer;padding:0;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .mode-add-banco:hover{text-decoration:underline;}

  /* CHAT — Consulta en vivo con el Agente (Post IA) */
  .chat-thread{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow-y:auto;}
  .chat-msg{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;font-family:'Inter',sans-serif;max-width:92%;}
  .chat-msg-user{background:var(--accent-soft);border:1px solid var(--accent);color:var(--text);align-self:flex-end;}
  .chat-msg-assistant{background:var(--surface-2);border:1px solid var(--line);color:var(--text);align-self:flex-start;}
  .chat-msg-actions{display:flex;gap:14px;margin-top:8px;}

  const audis    = ['fria','tibia','tibia','caliente'];
  const usos     = ['organico','organico','ambos','ambos'];
  const objetivos= ['alcance','educacion','confianza','venta'];
  const g = item.gancho||'';
  let tipo = tipos[semana-1]||'educativo';
  if(g.includes('mito')||g.includes('vs.')||g.includes('Antes y después')||g.includes('genérico')) tipo='comparacion';
  return {
    etapa: item.etapa || etapas[semana-1]||'adquisicion',

}

// ─── DATE / HORIZON ─────────────────────────────────────────────────────────
function parseFechaDDMM(str){
  if(!str) return null;
  const m=str.trim().match(/^(\d{1,2})\/(\d{1,2})$/);
  if(!m) return null;
  const day=parseInt(m[1],10),month=parseInt(m[2],10)-1;
  if(month<0||month>11||day<1||day>31) return null;
  const now=new Date();
  let d=new Date(now.getFullYear(),month,day);
  if((now-d)/86400000>30) d=new Date(now.getFullYear()+1,month,day);
  return d;
}
function fechaHorizonIndex(fechaStr){
  const d=parseFechaDDMM(fechaStr);
  if(!d) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const days=Math.round((d-today)/86400000);
  if(days<=14) return 9;
  const span=120,t=Math.min(1,Math.max(0,(days-14)/(span-14)));
  return Math.max(0,Math.min(8,Math.round(8-t*8)));
}
const WEEK_HORIZON_INDEX={1:9,2:7,3:4,4:1};
function weekFromFase(fase){
  if(!fase) return null;
  const m=fase.match(/Semana\s*(\d+)/i);
  if(!m) return null;
  const w=parseInt(m[1],10);
  return (w>=1&&w<=4)?w:null;
}
function horizonIndex(item){
  const byFecha=fechaHorizonIndex(item.fecha);
  if(byFecha!==null) return byFecha;
  const week=weekFromFase(item.fase);
  if(week!==null) return WEEK_HORIZON_INDEX[week];
  return 0;
}
function horizonColorVar(item){ return 'var(--t'+(horizonIndex(item)+1)+')'; }

function render(){
  if(currentTab==='banco'){ renderBanco(); return; }
  if(currentTab==='agente'){ renderAgente(); return; }
  if(currentTab==='calendario'){ renderCalendario(); return; }

  const list=state[currentTab];
  let rows=list.filter(r=>{
    const d=getDefaults(r);
    const et=r.etapa||d.etapa;
    const tp=r.tipo||d.tipo;
    if(filterFase && r.fase!==filterFase) return false;
    if(filterEtapa && et!==filterEtapa) return false;
    if(filterTipo && tp!==filterTipo) return false;
    if(searchTerm){
      const hay=(r.gancho+' '+r.descripcion+' '+r.dolor+' '+r.instrucciones+' '+r.recomendacion).toLowerCase();
      if(!hay.includes(searchTerm)) return false;
    }
    return true;

  contentEl.innerHTML='';

  const HIST_MAX=20;
  const totalRows=rows.length;
  if(currentTab==='historias') rows=rows.slice(0,HIST_MAX);

  SECTIONS.forEach(sec=>{
    const secRows=rows.filter(r=>r.estado===sec.key).sort((a,b)=>horizonIndex(b)-horizonIndex(a));
    const section=document.createElement('div');

    } else {

    notice.className='hist-limit-notice';
    notice.textContent=`Mostrando ${Math.min(HIST_MAX,rows.length)} de ${totalRows} historias · Usa los filtros para encontrar las demás`;

      if(!target||!target.value) return;
      navigator.clipboard.writeText(target.value).then(()=>{

        btn.textContent='✅ Copiado';
        setTimeout(()=>{btn.textContent=prev;},1500);
      });
    });
  });
  contentEl.querySelectorAll('.open-link-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.preventDefault(); e.stopPropagation();

  contentEl.querySelectorAll('.item-del').forEach(btn=>{

function onFieldChange(e){
  const id=e.target.dataset.id;
  const field=e.target.dataset.field;
  const list=state[currentTab];
  const row=list.find(r=>r.id===id);
  if(!row) return;
  if(field==='semana'){
    const suffix = currentTab==='historias' ? FASE_SUFFIJOS[+e.target.value]||'' : '';
    row.fase = suffix ? `Semana ${e.target.value} · ${suffix}` : `Semana ${e.target.value}`;
  } else if(field==='fecha'){
    row.fecha = e.target.value;
  } else {
    row[field]=e.target.value;
  }
  if(field==='estado'||field==='fecha'){
    render();
    renderStats();
  } else if(field==='etapa'||field==='semana'){
    updateCardChrome(row);
    renderStats();
  }
  scheduleSave();
}

async function generateGuion(id){
  const list=state[currentTab];
  const row=list.find(r=>r.id===id);
  if(!row) return;
  const d=getDefaults(row);
  const etapa=row.etapa||d.etapa;
  const tipo=row.tipo||d.tipo;
  const audiencia=row.audiencia||d.audiencia;
  const uso=row.uso||d.uso;
  const el=document.getElementById('guion-'+id);
  if(!el) return;
  el.hidden=false;
  el.textContent='⏳ Generando guión...';

  const prompt=`${NEGOCIO_CONTEXT}

Actúa como Guionista de Contenido. Genera un guión para esta pieza:
GANCHO: ${row.gancho}
DESCRIPCIÓN: ${row.descripcion}
ETAPA: ${etapa} · AUDIENCIA: ${audiencia} · TIPO: ${tipo} · USO: ${uso}
DOLOR: ${row.dolor||'(ver descripción)'}

Entrega en formato:
HOOK (primeros 3-5 seg): …
GANCHO ESCRITO: …
PROBLEMA/SITUACIÓN: …
SOLUCIÓN/INSIGHT: …
CTA: …
DURACIÓN SUGERIDA: …
NOTAS DE GRABACIÓN: …`;

  try{
    const res=await fetch('/api/sugerir-contenido',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea:prompt})});
    const data=await res.json();
    if(!res.ok){ el.textContent='Error: '+(data.error||'No se pudo generar.'); return; }
    const texto=data.respuesta||data.guion||(data.gancho?(data.gancho+(data.caption?'\n\n'+data.caption:'')):'');
    el.textContent=texto||JSON.stringify(data,null,2);
  }catch(e){
    el.textContent='Error de conexión. Intenta de nuevo.';
  }
}

// ─── SWIPE (mobile) ──────────────────────────────────────────────────────────
function attachSwipe(card,detailsEl){
  if(!detailsEl) return;
  const THRESH=46;
  let sx=0,sy=0,ldx=0,dragging=false,horiz=false;
  card.addEventListener('touchstart',e=>{
    if(e.target.closest('input,textarea,select,button,a,summary')){ dragging=false; return; }
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; ldx=0; dragging=true; horiz=false;
  },{passive:true});
  card.addEventListener('touchmove',e=>{
    if(!dragging) return;
    const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(!horiz){ if(Math.abs(dx)<8&&Math.abs(dy)<8) return; horiz=Math.abs(dx)>Math.abs(dy)*1.3; if(!horiz){dragging=false;return;} }
    if(dx>0){ e.preventDefault(); ldx=dx; card.style.transform=`translateX(${Math.min(dx*.35,40)}px)`; }
  },{passive:false});
  function end(){ if(!dragging) return; dragging=false; card.style.transition='transform .2s ease'; card.style.transform=''; setTimeout(()=>{card.style.transition='';},220); if(horiz&&ldx>THRESH) detailsEl.open=true; horiz=false; ldx=0; }
  card.addEventListener('touchend',end);
  card.addEventListener('touchcancel',end);
}

function parseIdeaJSON(text){
  if(!text) return null;
  let t=text.trim().replace(/```json\s*/g,'').replace(/```\s*/g,'');
  const arrM=t.match(/\[[\s\S]*\]/);
  if(arrM){ try{ return JSON.parse(arrM[0]); }catch(e){} }
  const objM=t.match(/\{[\s\S]*\}/);
  if(objM){ try{ return [JSON.parse(objM[0])]; }catch(e){} }
  return null;
}

function anguloToNotas(item){
  const partes=[];
  if(item.problema) partes.push(`Problema: ${item.problema}`);
  if(item.error) partes.push(`Error: ${item.error}`);
  if(item.deseo) partes.push(`Deseo: ${item.deseo}`);
  if(item.historia) partes.push(`Historia: ${item.historia}`);
  if(item.descubrimiento) partes.push(`Descubrimiento: ${item.descubrimiento}`);
  if(item.objecion) partes.push(`Objeción: ${item.objecion}`);
  if(item.comparacion) partes.push(`Comparación: ${item.comparacion}`);
  if(item.uso||item.uso_sugerido) partes.push(`Uso sugerido: ${item.uso||item.uso_sugerido}`);
  return partes.join('\n');
}

// ─── CALENDARIO ─────────────────────────────────────────────────────────────
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
const MESES_LABEL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function diaMesDeFecha(str){
  const m=(str||'').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  const year=parseInt(m[1],10), month=parseInt(m[2],10), day=parseInt(m[3],10);
  if(month<1||month>12||day<1||day>31) return null;
  return {year, month, day};
}

function fechaISO(anio, mes, dia){
  return anio+'-'+String(mes).padStart(2,'0')+'-'+String(dia).padStart(2,'0');
}

function moverItemACalendarioFecha(tab, id, dia, mes, anio){
  const item=(state[tab]||[]).find(r=>r.id===id);
  if(!item) return;
  item.fecha=fechaISO(anio, mes, dia);
  if(item.estado!=='publicado') item.estado='proceso';
  scheduleSave();
  renderCalendario();
}

function renderCalendario(){
  controlsEl.style.display='none';
  statsBarEl.style.display='none';
  contentEl.innerHTML='';

  const wrap=document.createElement('div');
  wrap.className='agente-wrap';

  const toolbar=document.createElement('div');
  toolbar.className='cal-toolbar';
  toolbar.innerHTML=`
    <div class="cal-nav">
      <button type="button" id="cal-prev" title="Mes anterior">←</button>
      <span class="cal-month-label">${MESES_LABEL[calMonth]} ${calYear}</span>
      <button type="button" id="cal-next" title="Mes siguiente">→</button>
      <button type="button" id="cal-hoy">Hoy</button>
    </div>
    <span class="mode-status">🎬 Historias · 📄 Contenido — click para abrirla, arrastra una idea a un día para programarla</span>
  `;
  wrap.appendChild(toolbar);

  const allItems=[
    ...state.historias.map(r=>({...r,_tab:'historias',_icon:'🎬'})),
    ...state.contenido.map(r=>({...r,_tab:'contenido',_icon:'📄'})),
  ];

  const porDia={};
  const sinFecha=[];
  allItems.forEach(item=>{
    const dm=diaMesDeFecha(item.fecha);
    if(!dm){ sinFecha.push(item); return; }
    const key=dm.year+'-'+dm.month+'-'+dm.day;
    if(!porDia[key]) porDia[key]=[];
    porDia[key].push(item);
  });

  const primerDiaSemana=(new Date(calYear,calMonth,1).getDay()+6)%7; // lunes=0
  const diasEnMes=new Date(calYear,calMonth+1,0).getDate();
  const hoy=new Date();
  const esHoy=(d)=> hoy.getFullYear()===calYear && hoy.getMonth()===calMonth && hoy.getDate()===d;

  function chipFor(item){
    const chip=document.createElement('div');
    chip.className='cal-chip';
    chip.style.borderLeftColor=horizonColorVar(item);
    chip.textContent=`${item._icon} ${item.gancho||'(sin título)'}`;
    chip.title=item.gancho||'';
    chip.draggable=true;
    chip.addEventListener('click',()=>irACalendarioItem(item._tab,item.id,item.gancho));
    chip.addEventListener('dragstart',(e)=>{
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain', JSON.stringify({tab:item._tab, id:item.id}));
      chip.classList.add('cal-chip-dragging');
    });
    chip.addEventListener('dragend',()=>chip.classList.remove('cal-chip-dragging'));
    return chip;
  }

  const grid=document.createElement('div');
  grid.className='cal-grid';
  ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d=>{
    const el=document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el);
  });
  for(let i=0;i<primerDiaSemana;i++){ const el=document.createElement('div'); el.className='cal-cell cal-empty'; grid.appendChild(el); }
  for(let d=1; d<=diasEnMes; d++){
    const cell=document.createElement('div');
    cell.className='cal-cell'+(esHoy(d)?' cal-today':'');
    cell.addEventListener('dragover',(e)=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; cell.classList.add('cal-dragover'); });
    cell.addEventListener('dragleave',()=>cell.classList.remove('cal-dragover'));
    cell.addEventListener('drop',(e)=>{
      e.preventDefault();
      cell.classList.remove('cal-dragover');
      let data;
      try{ data=JSON.parse(e.dataTransfer.getData('text/plain')); }catch(err){ return; }
      if(!data||!data.tab||!data.id) return;
      moverItemACalendarioFecha(data.tab, data.id, d, calMonth+1, calYear);
    });
    const items=porDia[calYear+'-'+(calMonth+1)+'-'+d]||[];
    const dayNum=document.createElement('div');
    dayNum.className='cal-daynum';
    dayNum.textContent=d;
    cell.appendChild(dayNum);
    items.forEach(item=>cell.appendChild(chipFor(item)));
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);

  if(sinFecha.length){
    const sf=document.createElement('div');
    sf.className='cal-sinfecha';
    sf.innerHTML=`<div class="cal-sinfecha-title">📌 Sin fecha (${sinFecha.length})</div>`;
    const list=document.createElement('div');
    list.className='cal-sinfecha-list';
    sinFecha.forEach(item=>list.appendChild(chipFor(item)));
    sf.appendChild(list);
    wrap.appendChild(sf);
  }

  contentEl.appendChild(wrap);

  document.getElementById('cal-prev').addEventListener('click',()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendario(); });
  document.getElementById('cal-next').addEventListener('click',()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendario(); });
  document.getElementById('cal-hoy').addEventListener('click',()=>{ const n=new Date(); calMonth=n.getMonth(); calYear=n.getFullYear(); renderCalendario(); });
}

function irACalendarioItem(tab,id,gancho){
  const tabEl=document.querySelector(`.tab[data-tab="${tab}"]`);
  if(tabEl) tabEl.click();
  if(gancho){
    searchTerm=gancho.toLowerCase();
    if(searchEl) searchEl.value=gancho;
    render();
  }
  const sel=[...document.querySelectorAll('select.estado-select')].find(s=>s.dataset.id===id);
  if(!sel) return;
  const card=sel.closest('.item-card');
  const det=card.querySelector('.item-details');
  if(det) det.open=true;
  card.scrollIntoView({behavior:'smooth',block:'center'});
}

let agenteMode='guion-org';

let agenteStatus='';
let agenteAngulos=null;

function renderAgente(){
  controlsEl.style.display='none';
  statsBarEl.style.display='none';
  contentEl.innerHTML='';
  const wrap=document.createElement('div');
  wrap.className='agente-wrap';

  // Mode selector

  if(mode.custom==='guion-organico'){

    contentEl.appendChild(wrap);

    wrap.appendChild(host);

    fieldsHtml+=`<div class="mode-fields-grid">`;

    });

  areaFields.forEach(f=>{
    fieldsHtml+=`<div class="mode-field"><label>${f.label}</label><textarea id="${f.id}" rows="4" placeholder="${f.placeholder||''}"></textarea></div>`;
  });

  panel.innerHTML=`
    <div>
      <div class="mode-panel-title">${mode.label}</div>

    </div>

    <div class="mode-actions">

    </div>
    <div>
      <div id="agente-output" class="mode-output">${agenteOutput?'':'<span class="mode-output-placeholder">El resultado aparecerá aquí...</span>'}</div>
    </div>`;
  wrap.appendChild(panel);
  contentEl.appendChild(wrap);
  if(agenteOutput) mostrarResultadoAgente(document.getElementById('agente-output'));

  // Generate button
  function mostrarResultadoAgente(outputEl){
    statusEl2().textContent='✅ Listo';

    const previa=document.getElementById('agente-actrow');

    const actDiv=document.createElement('div');

  document.getElementById('agente-gen-btn').addEventListener('click',async()=>{

function pintarGuionOrgChat(){

  box.innerHTML = guionOrgChat.map((m,i)=>{

      const thumbs = (m.imagenes&&m.imagenes.length) ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">${m.imagenes.map(src=>`<img src="${src}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">`).join('')}</div>` : '';

    }
    return `<div class="chat-msg chat-msg-assistant">${escHtml(m.content)}
      <div class="chat-msg-actions">

async function leerImagenComoDataURL(file){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

async function agregarImagenesAdjuntasPostIA(e){
  const files = Array.from(e.target.files||[]);
  if(!files.length) return;
  for(const file of files){
    const dataUrl = await leerImagenComoDataURL(file);
    guionOrgImagenesAdjuntas.push({ mediaType:file.type, data:dataUrl.split(',')[1], previewUrl:dataUrl });
  }
  e.target.value='';
  pintarGuionOrgImgPreview();
}

async function agregarImagenesPegadasPostIA(e){
  const items = Array.from(e.clipboardData?.items||[]).filter(i=>i.type.startsWith('image/'));
  if(!items.length) return;
  e.preventDefault();
  for(const item of items){
    const file = item.getAsFile();
    if(!file) continue;
    const dataUrl = await leerImagenComoDataURL(file);
    guionOrgImagenesAdjuntas.push({ mediaType:file.type, data:dataUrl.split(',')[1], previewUrl:dataUrl });
  }
  pintarGuionOrgImgPreview();
}

async function preguntarAgentePostIA(){
  const pregunta = (guionOrgPreguntaDraft||'').trim();
  const statusEl = document.getElementById('go-pregunta-status');
  if(!pregunta && !guionOrgImagenesAdjuntas.length){ if(statusEl) statusEl.textContent='⚠️ Escribe tu mensaje o adjunta una imagen.'; return; }
  const btn = document.getElementById('go-pregunta-btn');
  if(btn) btn.disabled = true;
  if(statusEl) statusEl.textContent = '⏳ Consultando ADN + 366 + Radar para responderte...';
  const imagenesParaEnviar = guionOrgImagenesAdjuntas.map(img=>({mediaType:img.mediaType, data:img.data}));
  const previewsParaMostrar = guionOrgImagenesAdjuntas.map(img=>img.previewUrl);
  guionOrgChat.push({role:'user', content: pregunta || '(revisa la imagen adjunta)', imagenes: previewsParaMostrar});
  guionOrgPreguntaDraft = '';
  guionOrgImagenesAdjuntas = [];
  pintarGuionOrgChat();
  pintarGuionOrgImgPreview();
  try{
    const resp = await fetch('/api/generar-guion-organico', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        cliente: CLIENTE_ID, modo:'pregunta',
        messages: guionOrgChat.map(m=>({role:m.role, content:m.content})),
        imagenes: imagenesParaEnviar,
      }),
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'Error al consultar al Agente.');
    guionOrgChat.push({role:'assistant', content:data.text||''});
    guionOrgPreguntaStatus = '✅ Listo';
  }catch(err){
    guionOrgChat.pop();
    guionOrgPreguntaDraft = pregunta;
    guionOrgImagenesAdjuntas = imagenesParaEnviar.map((img,i)=>({...img, previewUrl:previewsParaMostrar[i]}));
    guionOrgPreguntaStatus = '❌ ' + (err.message || 'Error al consultar al Agente.');
  }
  pintarGuionOrganico(document.getElementById('agente-guionorg-host'));
}

  const preguntaPrevia = (guionOrgChat[idx-1] && guionOrgChat[idx-1].role==='user') ? guionOrgChat[idx-1].content : '';
  const newId = 'c_chat'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const primeraLinea = (msg.content.split('\n').find(l=>l.trim())||'').slice(0,140);

    id:newId,
    orden:state.contenido.length+1,
    fase:'Semana 1',
    gancho: primeraLinea || 'Idea desde Consulta en vivo',
    descripcion: preguntaPrevia,
    ganchoIdea:'',
    caption: msg.content,
    notas: preguntaPrevia ? `Pregunta original: ${preguntaPrevia}` : '',

}

async function crearContenidoDesdeGuionOrg(targetTab){
  const seleccionadas = guionOrgIdeas.filter(i=>i.selected);
  const stEl=document.getElementById('go-status');
  if(!seleccionadas.length){ stEl.className='mode-status error'; stEl.textContent='Selecciona al menos una idea primero.'; return; }
  const btnH=document.getElementById('go-crear-historias');
  const btnC=document.getElementById('go-crear-contenido');
  if(btnH) btnH.disabled=true;
  if(btnC) btnC.disabled=true;
  let creadas=0;
  for(let n=0;n<seleccionadas.length;n++){
    const idea=seleccionadas[n];
    stEl.className='mode-status';
    stEl.textContent=`⏳ Creando contenido ${n+1}/${seleccionadas.length}...`;
    try{
      const res = await fetch('/api/generar-guion-organico', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ cliente: CLIENTE_ID, modo:'contenido', objetivo: guionOrgObjetivo, formato: guionOrgFormato, idea })
      });
      const data = await res.json();
      if(!res.ok){ continue; }
      const newId=(targetTab==='historias'?'h':'c')+'_go'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      const notasPartes=[anguloToNotas(idea), '', 'GUION:', data.guion||''];
      if(data.notas_grabacion) notasPartes.push(`\nNotas de grabación: ${data.notas_grabacion}`);
      if(data.duracion_aproximada) notasPartes.push(`Duración aproximada: ${data.duracion_aproximada}`);
      state[targetTab].push({
        id:newId,
        orden:state[targetTab].length+1,
        fase:targetTab==='historias'?'Semana 1 · Atraer/Conexión':'Semana 1',
        gancho:idea.idea,
        descripcion:idea.descubrimiento||'',
        ganchoIdea:'',
        caption:data.caption||'',
        notas:notasPartes.join('\n'),
        linkRef:'',linkArchivo:'',
        fecha:'',estado:'idea'
      });
      creadas++;
    }catch(e){ /* sigue con la siguiente idea */ }
  }
  document.getElementById(`count-${targetTab}`).textContent=state[targetTab].length;
  scheduleSave();
  guionOrgIdeas.forEach(i=>{ i.selected=false; });
  guionOrgStatus = `✅ ${creadas} de ${seleccionadas.length} idea(s) creadas en ${targetTab==='historias'?'Historias':'Contenido'}.`;
  pintarGuionOrganico(document.getElementById('agente-guionorg-host'));
}

  }catch(e){ evergreenGrupos = []; }
  try{
    const rp = await window.storage.get(CLIENTE_ID + ':catalogo-productos');
    evergreenProductos = rp && rp.value ? JSON.parse(rp.value) : [];
  }catch(e){ evergreenProductos = []; }
  try{
    // Migración: esta llave vivía bajo el nombre "contenido-ideas-evergreen" -- si la nueva
    // viene vacía, se cae a la vieja y se copia hacia adelante.
    let ri = await window.storage.get(EVERGREEN_IDEAS_KEY);
    if(!ri || !ri.value){
      ri = await window.storage.get(EVERGREEN_IDEAS_KEY_VIEJA);
      if(ri && ri.value) window.storage.set(EVERGREEN_IDEAS_KEY, ri.value).catch(()=>{});
    }
    evergreenIdeasStore = ri && ri.value ? JSON.parse(ri.value) : {};
  }catch(e){ evergreenIdeasStore = {}; }
}

function evergreenDatosActuales(){
  const key = evergreenGrupoKey();
  if(!evergreenIdeasStore[key]) evergreenIdeasStore[key] = {};
  EVERGREEN_CATEGORIAS.forEach(c=>{ if(!Array.isArray(evergreenIdeasStore[key][c.key])) evergreenIdeasStore[key][c.key]=[]; });
  return evergreenIdeasStore[key];
}

function pintarEvergreenIdeas(container){
  const datos = evergreenDatosActuales();
  const wrap = document.createElement('div');
  wrap.className='evergreen-panel';

  const productosDisponibles = evergreenProductos.filter(p => p && p.nombre && (!evergreenGrupoId || p.grupo_id === evergreenGrupoId));

  const toolbar = document.createElement('div');

  toolbar.innerHTML = `
    <div class="mode-field" style="min-width:220px;">
      <label>Grupo de negocio</label>
      <select id="evergreen-grupo-sel">
        <option value="">General (sin grupo)</option>
        ${evergreenGrupos.map(g=>`<option value="${g.id}"${evergreenGrupoId===g.id?' selected':''}>${escHtml(g.nombre)}</option>`).join('')}
      </select>
    </div>
    <div class="mode-field" style="min-width:220px;">
      <label>Producto (opcional)</label>
      <select id="evergreen-producto-sel">
        <option value="">Todo el grupo</option>
        ${productosDisponibles.map(p=>`<option value="${p.id}"${evergreenProductoId===p.id?' selected':''}>${escHtml(p.nombre)}</option>`).join('')}
      </select>
    </div>
    <div class="mode-field" style="min-width:220px;">
      <label>Tipo de contenido</label>
      <select id="evergreen-tipo-sel">
        <option value="todos"${evergreenTipo==='todos'?' selected':''}>Las 5 categorías</option>
        ${EVERGREEN_CATEGORIAS.map(c=>`<option value="${c.key}"${evergreenTipo===c.key?' selected':''}>${escHtml(c.label)}</option>`).join('')}
      </select>
    </div>
    <button class="btn btn-solid" id="evergreen-gen-btn">✨ Generar ideas con IA</button>
    <span class="mode-status" id="evergreen-status">${escHtml(evergreenStatus)}</span>
  `;
  wrap.appendChild(toolbar);

  const selBar = document.createElement('div');
  selBar.className='evergreen-selection-bar';
  selBar.innerHTML = `
    <span id="evergreen-sel-count" class="mode-status">0 idea(s) seleccionada(s)</span>
    <button class="btn-outline to-historias" id="evergreen-to-historias" type="button">→ Agregar a Historias</button>
    <button class="btn-outline to-contenido" id="evergreen-to-contenido" type="button">→ Agregar a Contenido</button>
  `;
  wrap.appendChild(selBar);

  EVERGREEN_CATEGORIAS.forEach(cat=>{
    const filas = datos[cat.key];
    const box = document.createElement('div');
    box.className='evergreen-cat';
    box.innerHTML = `
      <p class="evergreen-cat-title">${cat.label}</p>
      <p class="evergreen-cat-desc">${cat.desc}</p>
      <div class="evergreen-table-wrap">
        <table class="evergreen-table">
          <thead><tr><th></th>${EVERGREEN_COLUMNAS.map(c=>`<th>${c.label}</th>`).join('')}<th></th></tr></thead>
          <tbody>
            ${filas.length ? filas.map((fila,i)=>`
              <tr><td style="text-align:center;"><input type="checkbox" class="evergreen-row-check" data-cat="${cat.key}" data-i="${i}"${fila.selected?' checked':''}></td>${EVERGREEN_COLUMNAS.map(c=>`<td><textarea data-cat="${cat.key}" data-i="${i}" data-key="${c.key}">${escHtml(fila[c.key])}</textarea></td>`).join('')}
              <td><button type="button" class="evergreen-row-del" data-cat="${cat.key}" data-i="${i}">✕</button></td></tr>
            `).join('') : `<tr><td colspan="${EVERGREEN_COLUMNAS.length+2}" class="mode-status">Todavía no hay ideas. Usa "Generar ideas con IA" o agrega una fila a mano.</td></tr>`}
          </tbody>
        </table>
      </div>
      <button type="button" class="evergreen-row-add" data-cat="${cat.key}">+ Agregar fila</button>
    `;
    wrap.appendChild(box);
  });

  container.innerHTML='';
  container.appendChild(wrap);
  updateEvergreenSelCount();

  document.getElementById('evergreen-grupo-sel').addEventListener('change', (e)=>{
    evergreenGrupoId = e.target.value;
    evergreenProductoId = '';
    pintarEvergreenIdeas(container);
  });
  document.getElementById('evergreen-producto-sel').addEventListener('change', (e)=>{
    evergreenProductoId = e.target.value;
  });
  document.getElementById('evergreen-tipo-sel').addEventListener('change', (e)=>{
    evergreenTipo = e.target.value;
  });
  document.getElementById('evergreen-gen-btn').addEventListener('click', generarIdeasEvergreen);

  wrap.querySelectorAll('textarea[data-cat]').forEach(ta=>{
    ta.addEventListener('input', (e)=>{
      const { cat, i, key } = e.target.dataset;
      evergreenDatosActuales()[cat][+i][key] = e.target.value;
      scheduleEvergreenSave();
    });
  });
  wrap.querySelectorAll('.evergreen-row-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{

    });

  wrap.querySelectorAll('.evergreen-row-add').forEach(btn=>{
    btn.addEventListener('click', ()=>{

      scheduleEvergreenSave();
    });

  wrap.querySelectorAll('.evergreen-row-check').forEach(cb=>{

function evergreenSelectedItems(){
  const datos = evergreenDatosActuales();
  const items = [];
  EVERGREEN_CATEGORIAS.forEach(cat=>{
    (datos[cat.key]||[]).forEach((fila,i)=>{
      if(fila.selected) items.push({ cat: cat.key, catLabel: cat.label, i, fila });
    });
  });
  return items;
}

function updateEvergreenSelCount(){
  const el = document.getElementById('evergreen-sel-count');
  if(!el) return;
  el.textContent = `${evergreenSelectedItems().length} idea(s) seleccionada(s)`;
}

const EVERGREEN_CAPTION_ESTILO = {
  viral:{ emoji:'🔥✨', tags:['viral','tendencia'] },
  educativo:{ emoji:'📚💡', tags:['tips','aprendeconmigo'] },
  venta:{ emoji:'💰🚀', tags:['oferta','promocion'] },
  entretenimiento:{ emoji:'🎭😄', tags:['humor','contenido'] },
  testimonio:{ emoji:'⭐🙌', tags:['testimonios','resultadosreales'] },
};
const EVERGREEN_TAGS_RELLENO = ['contenido','redessociales','marketingdigital','negocio','emprendedores'];

function hashtagDesdeTexto(texto){
  const stop = new Set(['de','la','el','en','y','a','que','para','con','tu','tus','un','una','los','las','se','como','por']);
  const palabras = (texto||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,'').split(/\s+/);
  return palabras.find(w=>w.length>3 && !stop.has(w)) || '';
}

function construirCaptionEvergreen(fila, cat){
  const estilo = EVERGREEN_CAPTION_ESTILO[cat] || { emoji:'✨', tags:['contenido','redessociales'] };
  const cuerpo = fila.video || fila.stories || '';
  const pool = [...estilo.tags, hashtagDesdeTexto(fila.idea), ...EVERGREEN_TAGS_RELLENO]
    .filter(Boolean)
    .filter((t,i,arr)=>arr.indexOf(t)===i);
  const tags = pool.slice(0,5).map(t=>'#'+t);
  const partes = [`${fila.idea||''} ${estilo.emoji}`.trim()];
  if(cuerpo) partes.push(cuerpo);
  partes.push(tags.join(' '));
  return partes.join('\n\n');
}

function addEvergreenSelectedToTab(targetTab,container){
  const statusEl = document.getElementById('evergreen-status');
  const selected = evergreenSelectedItems();
  if(!selected.length){
    statusEl.className='mode-status error';
    statusEl.textContent='Selecciona al menos una idea primero.';
    return;
  }
  selected.forEach(({cat, catLabel, fila})=>{
    const newId=(targetTab==='historias'?'h':'c')+'_ev'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    state[targetTab].push({
      id:newId,
      orden:state[targetTab].length+1,
      fase:targetTab==='historias'?'Semana 1 · Atraer/Conexión':'Semana 1',
      gancho:fila.idea,
      descripcion:fila.video,
      dolor:'',
      tipo:EVERGREEN_TIPO_MAP[cat]||'',
      instrucciones:fila.stories?`Stories: ${fila.stories}`:'',
      recomendacion:`Categoría 366: ${catLabel}`,
      caption:construirCaptionEvergreen(fila,cat),
      linkRef:'',linkArchivo:'',
      fecha:'',estado:'idea',
      angulos:{ problema:'',error:'',deseo:'',historia:'',descubrimiento:'',objecion:'',comparacion:'' }
    });
  });
  document.getElementById(`count-${targetTab}`).textContent=state[targetTab].length;
  scheduleSave();
  const datos = evergreenDatosActuales();
  EVERGREEN_CATEGORIAS.forEach(cat=>{ (datos[cat.key]||[]).forEach(f=>{ f.selected=false; }); });
  scheduleEvergreenSave();
  evergreenStatus = `✅ ${selected.length} idea(s) añadida(s) a ${targetTab==='historias'?'Historias':'Contenido'}.`;
  pintarEvergreenIdeas(container);
}

async function generarIdeasEvergreen(){
  const btn = document.getElementById('evergreen-gen-btn');
  const statusEl2 = document.getElementById('evergreen-status');
  btn.disabled = true; btn.textContent = 'Generando...';
  statusEl2.className = 'mode-status'; statusEl2.textContent = '⏳ Analizando ADN + Brandbook + IA + Estrategia para darte la mejor respuesta...';
  try{
    const res = await fetch('/api/generar-ideas-366', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cliente: CLIENTE_ID, grupo_id: evergreenGrupoId, tipo: evergreenTipo, producto_id: evergreenProductoId }),
    });
    const data = await res.json();
    if(!res.ok){ statusEl2.textContent = 'Error: ' + (data.error || 'No se pudo generar.'); statusEl2.classList.add('error'); return; }
    Object.assign(evergreenDatosActuales(), data.ideas);
    evergreenStatus = '✅ Ideas generadas — revísalas y ajústalas antes de usarlas.';
    pintarEvergreenIdeas(document.getElementById('agente-evergreen-host'));
    scheduleEvergreenSave();
  }catch(e){
    statusEl2.textContent = 'Error de conexión.'; statusEl2.classList.add('error');
  }finally{
    btn.disabled = false; btn.textContent = '✨ Generar ideas con IA';
  }
}

function scheduleEvergreenSave(){
  clearTimeout(evergreenSaveTimer);
  evergreenSaveTimer = setTimeout(guardarIdeasEvergreen, 600);
}
async function guardarIdeasEvergreen(opts){
  try{
    await window.storage.set(EVERGREEN_IDEAS_KEY, JSON.stringify(evergreenIdeasStore), opts);
  }catch(e){}
}

// ─── CARPETA DE DOCUMENTOS (link fijo en la barra superior) ────────────────────
function carpetaLinkHref(link){
  const v=(link||'').trim();
  if(!v) return '';
  return /^https?:\/\//i.test(v) ? v : 'https://'+v;
}
function pintarCarpetaBox(){
  const host=document.getElementById('carpeta-box-host');
  if(!host) return;
  host.innerHTML=`
    <div class="carpeta-box">
      <div class="detail-field-head"><label>📁 Carpeta de documentos (Drive u otro)</label>${linkCarpeta?`<a class="btn-guion" href="${escHtml(carpetaLinkHref(linkCarpeta))}" target="_blank" rel="noopener">Abrir ↗</a>`:''}</div>
      <input type="text" id="carpeta-link-input" placeholder="https://drive.google.com/..." value="${escHtml(linkCarpeta)}">
    </div>
  `;
  document.getElementById('carpeta-link-input').addEventListener('input',(e)=>{
    linkCarpeta=e.target.value;
    scheduleCarpetaSave();
    const link=host.querySelector('.btn-guion');
    const head=host.querySelector('.detail-field-head');
    const nuevoLink=linkCarpeta?`<a class="btn-guion" href="${escHtml(carpetaLinkHref(linkCarpeta))}" target="_blank" rel="noopener">Abrir ↗</a>`:'';
    if(link) link.outerHTML=nuevoLink;
    else if(nuevoLink) head.insertAdjacentHTML('beforeend',nuevoLink);
  });
}
pintarCarpetaBox();

let carpetaSaveTimer=null;
function scheduleCarpetaSave(){ clearTimeout(carpetaSaveTimer); carpetaSaveTimer=setTimeout(guardarCarpeta,600); }
async function guardarCarpeta(opts){ try{ await window.storage.set(CARPETA_KEY, JSON.stringify(linkCarpeta), opts); }catch(e){} }

// ─── STORAGE ──────────────────────────────────────────────────────────────────
async function loadStorage(){
  try{
    const result=await window.storage.get(STORAGE_KEY);
    if(result&&result.value){
      const saved=JSON.parse(result.value);
      if(saved.historias) state.historias=saved.historias;
      if(saved.contenido) state.contenido=saved.contenido;
      if(saved.banco){ saved.banco.forEach(b=>{if(b.aprobada===undefined)b.aprobada=!!b.gancho;}); state.banco=saved.banco; }
      if(saved.bancoIdeas){ saved.bancoIdeas.forEach(b=>{if(b.selected===undefined)b.selected=false;}); state.bancoIdeas=saved.bancoIdeas; }
      const when=result.updatedAt?new Date(result.updatedAt).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      statusEl.textContent=when?`Cargado — último guardado ${when}`:'Tu selección se cargó.';
    }
  }catch(e){
    statusEl.textContent='Nueva sesión (sin datos guardados aún).';
  }
  if(migrarFechasLegacy()){ scheduleSave(); }
  if(autoPublicarProgramados()){ scheduleSave(); }
  scheduleAgendaSync();
  try{
    const r=await window.storage.get(CARPETA_KEY);
    linkCarpeta = r&&r.value?JSON.parse(r.value):'';
  }catch(e){ linkCarpeta=''; }
  pintarCarpetaBox();
  document.getElementById('count-banco').textContent=state.banco.length;
  buildFaseFilter();
  renderStats();
  render();
}

// Migra fechas "dd/mm" (sin año, formato viejo) a ISO "YYYY-MM-DD" asumiendo
// el año actual — el usuario corrige a mano con el picker si el año no aplica.
function migrarFechasLegacy(){
  let cambio=false;
  const anio=new Date().getFullYear();
  [...state.historias, ...state.contenido].forEach(item=>{
    const m=(item.fecha||'').trim().match(/^(\d{1,2})\/(\d{1,2})$/);
    if(!m) return;
    const day=parseInt(m[1],10), month=parseInt(m[2],10);
    if(month<1||month>12||day<1||day>31) return;
    item.fecha=fechaISO(anio, month, day);
    cambio=true;
  });
  return cambio;
}

// Si un item "programado" ya llegó (o pasó) su fecha, lo pasa solo a "publicado" -- se revisa
// cada vez que se carga la página.
function autoPublicarProgramados(){
  let cambio=false;
  const hoy=fechaISO(new Date().getFullYear(), new Date().getMonth()+1, new Date().getDate());
  [...state.historias, ...state.contenido].forEach(item=>{
    if(item.estado==='programado' && item.fecha && item.fecha<=hoy){
      item.estado='publicado';
      cambio=true;
    }
  });
  return cambio;
}

let saveTimer=null,pendingSave=false;
function scheduleSave(){ pendingSave=true; statusEl.textContent='Guardando...'; clearTimeout(saveTimer); saveTimer=setTimeout(()=>doSave(),500); }
async function doSave(opts){
  clearTimeout(saveTimer); saveTimer=null; if(!pendingSave) return;
  try{
    await window.storage.set(STORAGE_KEY,JSON.stringify({historias:state.historias,contenido:state.contenido,banco:state.banco,bancoIdeas:state.bancoIdeas}),opts);
    pendingSave=false; statusEl.textContent='Guardado.';
    scheduleAgendaSync();
  }catch(e){
    statusEl.textContent=e.status===401?'Token incorrecto.':'No se pudo guardar.';
  }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ if(pendingSave) doSave({keepalive:true}); guardarCarpeta({keepalive:true}); } });
window.addEventListener('pagehide',()=>{ if(pendingSave) doSave({keepalive:true}); guardarCarpeta({keepalive:true}); });

// ─── SYNC CON EL JEFE DE AGENDA ─────────────────────────────────────────────
// Espeja las historias/contenido con fecha al calendario cruzado de Jefes
// ({cliente}:agenda-eventos), sin tocar los eventos que vienen de otros
// Jefes (ej. Anuncios) ni las temporadas creadas manualmente en la Agenda.
let agendaSyncTimer=null,agendaSyncPending=false;
function scheduleAgendaSync(){ agendaSyncPending=true; clearTimeout(agendaSyncTimer); agendaSyncTimer=setTimeout(syncAgendaEventos,1500); }
async function syncAgendaEventos(opts){
  clearTimeout(agendaSyncTimer); agendaSyncTimer=null; if(!agendaSyncPending) return;
  try{
    const result=await window.storage.get(AGENDA_KEY);
    const data=(result&&result.value)?JSON.parse(result.value):{eventos:[],temporadas:[]};
    const otros=(data.eventos||[]).filter(e=>e.origen!=='contenido');
    const propios=[];
    [...state.historias.map(r=>({...r,_tab:'historias'})), ...state.contenido.map(r=>({...r,_tab:'contenido'}))].forEach(item=>{
      if(!/^\d{4}-\d{2}-\d{2}$/.test(item.fecha||'')) return;
      propios.push({
        id:'contenido-'+item._tab+'-'+item.id,
        origen:'contenido', origenTab:item._tab, origenId:item.id,
        fecha:item.fecha, titulo:item.gancho||'(sin título)', estado:item.estado||'idea',
      });
    });
    data.eventos=[...otros, ...propios];
    await window.storage.set(AGENDA_KEY, JSON.stringify(data), opts);
    agendaSyncPending=false;
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&agendaSyncPending) syncAgendaEventos({keepalive:true}); });
window.addEventListener('pagehide',()=>{ if(agendaSyncPending) syncAgendaEventos({keepalive:true}); });

loadStorage().then(()=>{
  if(location.hash==='#366'){
    agenteMode='ideas';
    const tabEl=document.querySelector('.tab[data-tab="agente"]');
    if(tabEl) tabEl.click();
  }
});
