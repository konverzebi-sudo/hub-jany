};
const ETAPA_CORTA = { adquisicion:'Adquisición', consideracion:'Consideración', conversion:'Conversión' };
function htmlAnunciosVinculados(campana, resaltarId){
  const ids = [...new Set((campana.conjuntos||[]).flatMap(c=>c.anuncios_ids||[]))];
  const anuncios = ids.map(id=>cards.find(c=>c.id===id)).filter(Boolean);
  return anuncios.length ? anuncios.map(c=>`
    <div class="res-anuncio${c.id===resaltarId?' esta':''}">
      <span class="res-check">✔</span>
      <span class="res-etapa">${ETAPA_CORTA[c.etapa]||c.etapa}</span>
      <span class="anuncio-link-titulo" data-editar-card="${c.id}" title="Abrir y editar este anuncio">${escHtml(c.titulo)} ✎</span>
      ${c.id===resaltarId ? '<span class="res-este">← este anuncio</span>' : ''}
    </div>`).join('') : '<div class="res-anuncio res-vacio">Todavía no hay anuncios en esta campaña.</div>';
}
function objetivoTextoCampana(campana){ const o = OBJETIVOS.find(x=>x.key===campana.objetivo); return o ? o.label.replace(/^\S+\s/,'') : ''; }
// Mapa de la campaña en tres columnas (Objetivo | Conjunto de anuncios | Anuncios). Lo usan Estructura de Ads
// (con las pastillas oscuras como botones para abrir/editar) y "Ver la campaña" dentro de cada anuncio (solo lectura).
function htmlMapaColumnas(campana, opts){
  opts = opts || {};
  const ed = !!opts.editable;
  // lima mientras esa parte siga sin definirse; blanca en cuanto ya se eligió algo (pend = pendiente)
  const dark = (txt, tog, on, pend)=> ed && tog
    ? `<button type="button" class="res-pill-dark${on?' on':''}${pend?' pend':''}" data-res-toggle="${tog}">${txt} <span class="res-chev">▾</span></button>`
    : `<span class="res-pill-dark estatica${pend?' pend':''}">${txt}</span>`;
  const conjuntos = campana.conjuntos || [];
  const nAnuncios = new Set(conjuntos.flatMap(c=>c.anuncios_ids||[])).size;
  // De dónde salió el público de un conjunto (la IA sola, un perfil del 366 o una campaña de temporada).
  const origenPublico = (c)=>{
    if(c.publico_fuente==='366') return 'Perfil 366' + (c.perfil_366 ? ': '+c.perfil_366 : '');
    if(c.publico_fuente==='temporada'){ const t = campsTemporada.find(x=>x&&x.id===c.camp_temporada); return 'Temporada' + (t ? ': '+nombreCampTemporada(t) : ''); }
    return (c.publico_fuente==='ia' || c.edad || c.ubicacion || c.intereses) ? 'Con IA' : '';
  };
  const publico = (c,i)=>{
    const origen = origenPublico(c);
    const datos = [c.edad, c.genero && c.genero!=='Todos' ? c.genero : '', c.ubicacion].filter(Boolean).join(' · ');
    const presu = campana.presupuesto_nivel==='campana' ? '' : (c.presupuesto_diario ? 'Presupuesto: '+c.presupuesto_diario : '');
    return `<span class="res-pill-w">Público #${i+1}${origen ? ' · '+escHtml(origen) : ''}</span>`
      + (datos ? `<span class="res-pill-w res-sub">${escHtml(datos)}</span>` : '')
      + (presu ? `<span class="res-pill-w res-sub">${escHtml(presu)}</span>` : '');
  };
  const objIcono = ((OBJETIVOS.find(x=>x.key===campana.objetivo)||{}).label||'').split(' ')[0];
  const col1 = dark('Objetivo de campaña:', 'obj', opts.abObj, !objetivoTextoCampana(campana))
    + `<span class="res-pill-w">${objIcono ? objIcono+' ' : ''}${escHtml(objetivoTextoCampana(campana) || 'Sin definir')}</span>`
    + (campana.tipo ? `<span class="res-pill-w res-sub">${escHtml(campana.tipo)}</span>` : '')
    + (campana.resultado_esperado ? `<span class="res-pill-w res-sub">${escHtml(campana.resultado_esperado)}</span>` : '');
  const col2 = dark('Conjunto de anuncios' + (ed ? ' ('+conjuntos.length+')' : ''), 'esp', opts.abEsp, !conjuntos.length)
    + (campana.presupuesto_nivel==='campana' && campana.presupuesto_diario ? `<span class="res-pill-w res-sub">Presupuesto de la campaña: ${escHtml(campana.presupuesto_diario)}</span>` : '')
    + (conjuntos.length ? conjuntos.map((c,i)=>publico(c,i)).join('') : '<span class="res-pill-w res-sub">Sin conjuntos todavía</span>');
  const col3 = dark('Anuncios', 'anu', opts.abAnu, !nAnuncios) +`<div class="res-anuncios"${ed ? ` data-vinculados="${campana.id}"` : ''}>${htmlAnunciosVinculados(campana, opts.anuncioId)}</div>`;
  return `<div class="res-col">${col1}</div><div class="res-col">${col2}</div><div class="res-col res-col-anuncios">${col3}</div>`;
}

// ─── CAMPAÑA DE UN LOTE DE ANUNCIOS / VER LA CAMPAÑA ─────────────────────────────────────────
function objetivoDesdeTexto(t){
  const x = (t||'').toLowerCase();
  if(/venta|compra/.test(x)) return 'ventas';
  if(/mensaje|whatsapp|cita|agendar|registro|contacto|cotiz|cliente potencial|lead/.test(x)) return 'leads';
  if(/tr[aá]fico|visita/.test(x)) return 'trafico';
  return '';
}
// Pone los anuncios en el primer conjunto de la campaña elegida o de una campaña nueva (se crea con su conjunto).
// Una campaña respeta lo que se definió al crearla: si es de un producto o servicio, solo entran anuncios de ese
// producto; si es de un grupo, solo anuncios de ese grupo; si no tiene producto ni grupo es publicidad general
// del ecosistema y acepta cualquier anuncio.
function campanaAcepta(camp, ids){
  if(!camp.producto_id && !camp.grupo_id) return true;
  return ids.every(id=>{
    const c = cards.find(x=>x.id===id); if(!c) return false;
    return camp.producto_id ? c.producto_id===camp.producto_id : c.grupo_id===camp.grupo_id;
  });
}
function motivoNoAcepta(camp){
  return camp.producto_id ? 'es de otro producto o servicio' : 'es de otro grupo';
}
// Devuelve la campaña, o null si la campaña elegida no acepta esos anuncios (otro producto/grupo).
function agregarAnunciosACampana(ids, campanaId){
  let camp = campanaId ? estructuras.find(c=>c.id===campanaId) : null;
  if(camp && !campanaAcepta(camp, ids)) return null;
  if(!camp){
    camp = mkCampana();
    const c0 = cards.find(c=>c.id===ids[0]);
    if(c0){ camp.producto_id = c0.producto_id||''; camp.grupo_id = c0.grupo_id||''; const ob = objetivoDesdeTexto(c0.objetivo); if(ob) camp.objetivo = ob; }
    estructuras.unshift(camp);
  }
  if(!camp.conjuntos.length) camp.conjuntos.push(mkConjunto());
  const cj = camp.conjuntos[0];
  if(!Array.isArray(cj.anuncios_ids)) cj.anuncios_ids = [];
  ids.forEach(id=>{ if(!cj.anuncios_ids.includes(id)) cj.anuncios_ids.push(id); });
  scheduleEstructuraSave();
  return camp;
}
function campanasDeAnuncio(id){ return estructuras.filter(c=>(c.conjuntos||[]).some(cj=>(cj.anuncios_ids||[]).includes(id))); }
function etiquetaCampana(c, i){
  const ob = objetivoTextoCampana(c);
  const n = new Set((c.conjuntos||[]).flatMap(cj=>cj.anuncios_ids||[])).size;
  return `Campaña ${numeroCampana(c)} · ${nombreAlcance(c)}${ob ? ' · '+ob : ''} · ${n} anuncio(s)`;
}
function mostrarToast(html){
  document.querySelectorAll('.pb-toast').forEach(x=>x.remove());
  const t = document.createElement('div');
  t.className = 'pb-toast'; t.innerHTML = html;
  document.body.appendChild(t);
  t.querySelector('[data-ir-estructura]')?.addEventListener('click',()=>{ t.remove(); cerrarPostModal(); irATab('estructura'); });
  setTimeout(()=>t.remove(), 9000);
}
function irATab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===tab));
  render();
}
// Al crear un lote, el Jefe propone la campaña y el usuario acepta: campaña nueva con todos, o sumarlos a una existente.
function proponerCampanaParaLote(ids){
  if(!ids.length) return;
  document.querySelectorAll('.ay-overlay').forEach(x=>x.remove());
  const c0 = cards.find(c=>c.id===ids[0]) || {};
  const existentes = estructuras.map((c,i)=>({c,i,ok:campanaAcepta(c, ids)})).sort((a,b)=>(b.ok?1:0)-(a.ok?1:0));
  const nombreNueva = nombreAlcance({ producto_id:c0.producto_id||'', grupo_id:c0.grupo_id||'' });
  const ov = document.createElement('div');
  ov.className = 'ay-overlay';
  ov.innerHTML = `<div class="ay-box" role="dialog" aria-modal="true">
    <h3>¿En qué campaña van estos ${ids.length} anuncios?</h3>
    <p class="ay-nota" style="margin-top:-4px;">Para no confundirte, propongo esto. Tú decides:</p>
    <label class="ay-op"><input type="radio" name="ay-camp" value="" checked><span><b>🆕 Una campaña nueva</b> con todos estos anuncios<small>Campaña: ${escHtml(nombreNueva)} · se crea con su primer conjunto de anuncios (público #1). Después completas objetivo y público en “Estructura de Ads”.</small></span></label>
    ${existentes.map(({c,i,ok})=>`<label class="ay-op${ok?'':' ay-off'}"><input type="radio" name="ay-camp" value="${c.id}"${ok?'':' disabled'}><span><b>➕ Agregarlos a una campaña que ya tengo</b><small>${escHtml(etiquetaCampana(c,i))}${ok ? (c.producto_id||c.grupo_id ? ' · mismo producto/grupo' : ' · campaña general') : ' · no se puede: '+motivoNoAcepta(c)}</small></span></label>`).join('')}
    <div class="ay-btns"><button type="button" class="btn btn-outline" data-ay-luego>Decidir después</button><button type="button" class="btn btn-solid" data-ay-ok>Aceptar</button></div>
  </div>`;
  document.body.appendChild(ov);
  const cerrar = ()=>{ ov.remove(); document.removeEventListener('keydown', tecla); };
  const tecla = (e)=>{ if(e.key==='Escape') cerrar(); };
  document.addEventListener('keydown', tecla);
  ov.querySelector('[data-ay-luego]').addEventListener('click', cerrar);
  ov.querySelector('[data-ay-ok]').addEventListener('click',()=>{
    const v = (ov.querySelector('input[name="ay-camp"]:checked')||{}).value || '';
    const camp = agregarAnunciosACampana(ids, v);
    if(!camp){ mostrarToast('⚠️ Esa campaña es de otro producto o grupo: no se pueden agregar estos anuncios.'); return; }
    estSelId = camp.id; // al ir a Estructura de Ads se abre esa campaña
    cerrar(); render();
    mostrarToast(`✅ ${ids.length} anuncio(s) ${v ? 'agregados a la campaña' : 'en una campaña nueva'}: <b>${escHtml(nombreAlcance(camp))}</b>. <button type="button" class="link-btn" data-ir-estructura>Verla en Estructura de Ads →</button>`);
  });
}

// "Ver la campaña" dentro del anuncio: el mapa de su campaña y cuál es este anuncio; si todavía no está en ninguna, permite ponerlo.
let campanaVistaAbierta = new Set();
function pintarCampanaDelAnuncio(item, modal){
  const box = (modal||postModalEl).querySelector('#pm-campana'); if(!box) return;
  const abierta = campanaVistaAbierta.has(item.id);
  const camps = campanasDeAnuncio(item.id);
  let cuerpo = '';
  if(abierta){
    if(camps.length){
      cuerpo = camps.map(c=>`<div class="campana-resumen mapa-lectura">
        <div class="res-top"><span class="res-pill-white">Campaña: ${escHtml(nombreAlcance(c))}</span><button type="button" class="res-btn res-btn-white" data-ir-estructura data-camp="${c.id}">Abrir en Estructura de Ads →</button></div>
        <div class="res-mapa">${htmlMapaColumnas(c, { anuncioId:item.id })}</div></div>`).join('');
    } else {
      cuerpo = `<div class="pm-camp-vacio"><p>Este anuncio todavía no está en ninguna campaña.</p>
        <div class="pm-camp-add"><select data-camp-destino>
          <option value="">🆕 Crear una campaña nueva con este anuncio</option>
          ${estructuras.map((c,i)=>{ const ok = campanaAcepta(c, [item.id]); return `<option value="${c.id}"${ok?'':' disabled'}>➕ Agregar a: ${escHtml(etiquetaCampana(c,i))}${ok?'':' — no se puede: '+motivoNoAcepta(c)}</option>`; }).join('')}
        </select><button type="button" class="btn btn-solid btn-sm" data-camp-agregar>Aceptar</button></div></div>`;
    }
  }
  box.innerHTML = `<button type="button" class="pm-ver-campana${abierta?' abierto':''}" data-ver-campana>🗺️ Ver la campaña <span>${camps.length ? '· '+camps.length+(camps.length>1?' campañas':' campaña') : '· sin campaña todavía'}</span> <i>${abierta?'▴':'▾'}</i></button>${cuerpo}`;
  box.querySelector('[data-ver-campana]').addEventListener('click',()=>{ if(abierta) campanaVistaAbierta.delete(item.id); else campanaVistaAbierta.add(item.id); pintarCampanaDelAnuncio(item); });
  box.querySelectorAll('[data-ir-estructura]').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.camp) estSelId = b.dataset.camp; cerrarPostModal(); irATab('estructura'); }));
  const ag = box.querySelector('[data-camp-agregar]');
  if(ag) ag.addEventListener('click',()=>{
    const camp = agregarAnunciosACampana([item.id], box.querySelector('[data-camp-destino]').value);
    if(!camp){ mostrarToast('⚠️ Esa campaña es de otro producto o grupo: no se puede agregar este anuncio.'); return; }
    pintarCampanaDelAnuncio(item);
    mostrarToast(`✅ Anuncio agregado a la campaña <b>${escHtml(nombreAlcance(camp))}</b>.`);
  });
}

async function guardarCampana(campana){
  campana.guardada = true;
  resEstado.delete(campana.id+':obj'); resEstado.delete(campana.id+':esp'); resEstado.delete(campana.id+':anu');
  clearTimeout(estructuraSaveTimer);
  await guardarEstructura();
  render();
}

// Un solo selector: cada grupo con "Todo el grupo" y sus productos/servicios debajo.
// Valor del selector único -> producto_id / grupo_id (un producto fija también su grupo).
function alcanceDesdeValor(v){
  const [kind,id] = (v||'').split(':');
  if(kind==='p'){ const pr = productos.find(x=>x&&x.id===id); return { producto_id:id, grupo_id: pr ? (pr.grupo_id||'') : '' }; }
  return { producto_id:'', grupo_id: kind==='g' ? id : '' };
}
function opcionesAlcance(campana){ return opcionesAlcanceDe(campana.producto_id, campana.grupo_id); }
function opcionesAlcanceDe(prodId, grpId){
  const sel = prodId ? 'p:'+prodId : (grpId ? 'g:'+grpId : '');
  const opt = (v,t)=>`<option value="${v}"${sel===v?' selected':''}>${escHtml(t)}</option>`;
  const prods = productos.filter(p=>p&&p.nombre);
  let html = opt('','General (sin grupo)');
  grupos.filter(g=>g&&g.nombre).forEach(g=>{
    html += `<optgroup label="${escHtml(g.nombre)}">` + opt('g:'+g.id,'Todo el grupo · '+g.nombre) + prods.filter(p=>p.grupo_id===g.id).map(p=>opt('p:'+p.id,p.nombre)).join('') + '</optgroup>';
  });
  const sueltos = prods.filter(p=>!p.grupo_id || !grupos.some(g=>g&&g.id===p.grupo_id));
  if(sueltos.length) html += '<optgroup label="Sin grupo">' + sueltos.map(p=>opt('p:'+p.id,p.nombre)).join('') + '</optgroup>';
  return html;
}

// Paso 1 del conjunto: ¿el presupuesto es por campaña (Meta lo reparte) o por conjunto (tú decides cada uno)?
function htmlPasoPresupuesto(campana){
  const nivel = campana.presupuesto_nivel || '';
  const op = (k, emoji, t, desc, extra)=>`<div class="alc-card${nivel===k?' on':''}" role="option" tabindex="0" data-presu="${k}">
      <span class="alc-chk">✓</span><button type="button" class="alc-como" data-como>¿Cómo?</button>
      <div class="alc-ilu chico">${emoji}</div><div class="alc-t">${t}</div><div class="alc-d">${desc}</div><div class="alc-x">${extra}</div></div>`;
  return `<div class="paso-bloque paso-presu">
    <div class="paso-t"><span class="paso-n">1</span> Presupuesto</div>
    <p class="paso-hint">¿Cómo quieres manejar el dinero de esta campaña?</p>
    <div class="alc-cards chicas" role="listbox">
      ${op('campana','🎯','Por campaña','Pones un solo monto y Meta lo reparte entre tus conjuntos.','Meta mueve el dinero hacia el conjunto que mejor funcione. Buena opción si empiezas o quieres que se optimice solo.')}
      ${op('conjunto','🧩','Por conjunto','Tú decides cuánto gasta cada público.','Cada conjunto lleva su propio presupuesto diario. Úsalo si quieres controlar cuánto se invierte en cada audiencia o probarlas con montos iguales.')}
    </div>
    ${nivel==='campana' ? `<div class="mode-field paso-presu-campo"><label>Presupuesto diario de la campaña</label><input type="text" data-campana-presu placeholder="Ej: $300 MXN" value="${escHtml(campana.presupuesto_diario||'')}"></div>` : ''}
    ${nivel==='conjunto' ? '<p class="paso-hint">Cada conjunto lleva su presupuesto diario (lo defines en su bloque, abajo).</p>' : ''}
  </div>`;
}

function buildCampanaEstructuraCard(campana, numero, verProducto){
  const card = document.createElement('div');
  card.className = 'campana-resumen' + (campanaNueva(campana) ? ' nueva' : '') + (resColapsadas.has(campana.id) ? ' colapsada' : '');
  const tiposDisponibles = OBJETIVO_TIPO_MAP[campana.objetivo] || [];
  const abObj = resAbierto(campana,'obj'), abEsp = resAbierto(campana,'esp'), abAnu = resAbierto(campana,'anu');

  card.innerHTML = `
    <div class="res-top">
      <button type="button" class="res-pill-white res-colapsar" data-res-colapsar title="Clic para encoger o abrir">Campaña ${numero || numeroCampana(campana)}${verProducto ? ' · '+escHtml(nombreAlcance(campana)) : ''}<span class="res-flecha">→</span></button>
      <div class="campana-top-actions">
        <button type="button" class="res-btn res-btn-white" data-guardar-campana>Guardar campaña</button>
        <button type="button" class="item-del" data-del-campana title="Eliminar campaña">✕</button>
      </div>
    </div>
    <div class="res-body">
      <label class="res-fecha">Fecha de inicio:
        <input type="date" class="res-fecha-input" data-campana="${campana.id}" data-field="fecha_inicio" value="${escHtml(campana.fecha_inicio||'')}">
      </label>
      <div class="res-mapa">${htmlMapaColumnas(campana, { editable:true, abObj:false, abEsp, abAnu })}</div>
    </div>
    <div class="res-pane res-pane-obj${campana.objetivo?' abierto':''}">
      <div class="campana-fields-grid">
        ${verProducto ? `<div class="mode-field">
          <label>Producto, servicio o grupo</label>
          <select data-campana="${campana.id}" data-field="alcance">
            ${opcionesAlcance(campana)}
          </select>
        </div>` : ''}
        <div class="mode-field">
          <label>Tipo de campaña</label>
          <select data-campana="${campana.id}" data-field="tipo"${!campana.objetivo?' disabled':''}>
            <option value="">${campana.objetivo?'— Selecciona —':'Elige un objetivo primero'}</option>
            ${tiposDisponibles.map(t=>`<option value="${escHtml(t)}"${campana.tipo===t?' selected':''}>${escHtml(t)}</option>`).join('')}
          </select>
        </div>
        <div class="mode-field campo-ancho">
          <label>Resultado esperado</label>
          <input type="text" data-campana="${campana.id}" data-field="resultado_esperado" placeholder="Ej: Ventas por chat / Citas por chat / Ventas por sitio web" value="${escHtml(campana.resultado_esperado)}">
        </div>
      </div>
    </div>
    <div class="res-pane res-pane-esp${abEsp?' abierto':''}">
      ${htmlPasoPresupuesto(campana)}
      <div class="conjuntos-list" data-campana-conjuntos="${campana.id}"></div>
      <button type="button" class="anuncios-row-add" data-campana-add-conjunto="${campana.id}">+ Agregar ${campana.conjuntos.length ? 'otro ' : ''}conjunto de anuncios</button>
      <div class="paso-sig"><button type="button" class="btn btn-solid" data-siguiente-anuncios>Listo, seguir con los anuncios →</button></div>
    </div>
    <div class="res-pane res-pane-anu${abAnu?' abierto':''}">
      <div class="paso-t"><span class="paso-n">3</span> Anuncios</div>
      <p class="paso-hint">Marca con ✓ los anuncios que van en cada conjunto: así se arma tu campaña completa.</p>
      <div class="anu-conjuntos" data-anu-conjuntos="${campana.id}"></div>
      <div class="anuncios-footer">
        <button type="button" class="btn-pill-gray" data-ir-guardadas="1">Crear más anuncios</button>
        <button type="button" class="btn btn-solid btn-pill" data-guardar-estructura>Guardar campaña</button>
      </div>
    </div>
  `;

  const conjuntosList = card.querySelector('.conjuntos-list');
  campana.conjuntos.forEach((conjunto,i)=>conjuntosList.appendChild(buildConjuntoCard(campana, conjunto, i)));
  const anuBox = card.querySelector('[data-anu-conjuntos]');
  if(campana.conjuntos.length) campana.conjuntos.forEach((conjunto,i)=>anuBox.appendChild(buildAnunciosConjunto(campana, conjunto, i)));
  else anuBox.innerHTML = '<p class="mode-status">Primero define un conjunto de anuncios (paso 2) para poder vincularle anuncios.</p>';
  card.querySelectorAll('.paso-presu .alc-card').forEach(c=>{
    const elegir = ()=>{ campana.presupuesto_nivel = c.dataset.presu; scheduleEstructuraSave(); render(); };
    c.addEventListener('click',(e)=>{ if(e.target.closest('[data-como]')) return; elegir(); });
    c.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); elegir(); } });

    btn.addEventListener('click', ()=>{

      if(clave==='obj'){
        // el objetivo se elige ahí mismo, en tarjetas; al elegir se pasa al siguiente paso: el conjunto de anuncios
        abrirPopAlc(btn, htmlPopObjetivo(campana), (el)=>montarTarjetasAlc(el, (tarjeta)=>{
          campana.objetivo = tarjeta.dataset.obj; campana.tipo = '';
          resEstado.set(campana.id+':esp', true);
          scheduleEstructuraSave(); cerrarPopAlc(); render();
          setTimeout(()=>{ const sig = document.querySelector('[data-res-toggle="esp"]'); if(sig) sig.scrollIntoView({ block:'center', behavior:'smooth' }); }, 80);
        }));
        return;
      }
      const abierto = !resAbierto(campana, clave);
      resEstado.set(campana.id+':'+clave, abierto);
      btn.classList.toggle('on', abierto);
      card.querySelector('.res-pane-'+clave).classList.toggle('abierto', abierto);
    });
  });
  card.querySelector('[data-res-colapsar]').addEventListener('click', ()=>{
    const ahora = card.classList.toggle('colapsada');
    if(ahora) resColapsadas.add(campana.id); else resColapsadas.delete(campana.id);
  });
  card.querySelector('[data-guardar-campana]').addEventListener('click', ()=>guardarCampana(campana));
  card.querySelector('[data-vinculados]').addEventListener('click', (e)=>{
    const t = e.target.closest('[data-editar-card]');
    if(t) irAEditarCard(t.dataset.editarCard);
  });
  card.querySelector('[data-del-campana]').addEventListener('click', ()=>{
    if(!confirm('¿Eliminar esta campaña y todos sus conjuntos? No se puede deshacer.')) return;
    estructuras = estructuras.filter(c=>c.id!==campana.id);
    scheduleEstructuraSave();
    render();
  });

  card.querySelectorAll('select[data-campana]').forEach(sel=>{
    sel.addEventListener('change',(e)=>{
      const field = e.target.dataset.field;
      if(field==='alcance'){
        const [kind,id] = (e.target.value||'').split(':');
        if(kind==='p'){ const pr = productos.find(x=>x&&x.id===id); campana.producto_id = id; campana.grupo_id = pr ? (pr.grupo_id||'') : ''; }
        else { campana.producto_id = ''; campana.grupo_id = kind==='g' ? id : ''; }
      } else {
        campana[field] = e.target.value;
        if(field==='objetivo') campana.tipo='';
      }
      scheduleEstructuraSave();
      render();
    });
  });
  card.querySelector('input[data-field="fecha_inicio"]').addEventListener('input',(e)=>{
    campana.fecha_inicio = e.target.value;
    card.classList.toggle('nueva', campanaNueva(campana));
    scheduleEstructuraSave();
  });
  card.querySelector('input[data-field="resultado_esperado"]').addEventListener('input',(e)=>{
    campana.resultado_esperado = e.target.value;
    card.classList.toggle('nueva', campanaNueva(campana));
    scheduleEstructuraSave();
  });
  card.querySelector('[data-campana-add-conjunto]').addEventListener('click', ()=>{
    campana.conjuntos.push(mkConjunto());
    resEstado.set(campana.id+':esp', true);
    scheduleEstructuraSave();
    render();
  });

  return card;
}

function nombreCampTemporada(c){
  const n = String(c.nombre||'').trim();
  if(n && !/^(temporal|nueva campa[nñ]a|campa[nñ]a|sin nombre)$/i.test(n)) return n;
  return String((c.producto_origen==='nuevo' ? c.producto_nuevo : c.producto_nombre) || c.temporada || n || 'Campaña de temporada').trim();
}
// Paso 2: el público de un conjunto. Se parte de la IA sola, de un perfil de cliente que ya se trabajó en Jefe 366 o de una campaña de
// Jefe de Temporada, y el Jefe recomienda y llena ubicación, edad, género e intereses (que luego se pueden editar).
function buildConjuntoCard(campana, conjunto, idx){

  const fuente = conjunto.publico_fuente || 'ia';
  const perfiles = audiencias366, camps = campsTemporada.slice().sort((x,y)=>((y.producto_id===campana.producto_id)?1:0)-((x.producto_id===campana.producto_id)?1:0));

      <span class="alc-chk">✓</span><button type="button" class="alc-como" data-como>¿Cómo?</button>
      <div class="alc-ilu chico">${emoji}</div><div class="alc-t">${t}</div><div class="alc-d">${desc}</div><div class="alc-x">${extra}</div></div>`;

    <p class="paso-hint">¿De dónde partimos para llenar este público?</p>
    <div class="alc-cards chicas" role="listbox">
      ${op('ia','✨','Solo con IA','El Jefe lo arma con tu ADN, tu 366 y el Radar de Mercado.','No eliges nada: la IA propone ubicación, edad, género e intereses pensando en tu producto.', false)}
      ${op('366','🧭','Perfil de Jefe 366', perfiles.length ? 'Elige un perfil de cliente que ya trabajaste.' : 'Todavía no tienes perfiles de cliente en tu 366.','El Jefe parte de ese perfil (ocupación, edad, miedos y deseos) para recomendar el público.', !perfiles.length)}
      ${op('temporada','🗓️','Campaña de Temporada', camps.length ? 'Parte del público de una campaña que ya armaste.' : 'No hay campañas de temporada activas.','El Jefe usa la estrategia de esa campaña de Jefe de Temporada (su oferta y su cliente) para recomendar el público.', !camps.length)}
    </div>
    ${fuente==='366' && perfiles.length ? `<div class="mode-field paso-sel"><label>Perfil de cliente</label><select data-perfil-366>${perfiles.map(a=>`<option value="${escHtml(a.nombre)}"${(conjunto.perfil_366||perfiles[0].nombre)===a.nombre?' selected':''}>${escHtml(a.nombre)}</option>`).join('')}</select></div>` : ''}
    ${fuente==='temporada' && camps.length ? `<div class="mode-field paso-sel"><label>Campaña de temporada</label><select data-camp-temporada>${camps.map(c=>`<option value="${escHtml(c.id)}"${(conjunto.camp_temporada||camps[0].id)===c.id?' selected':''}>${escHtml(nombreCampTemporada(c))}</option>`).join('')}</select></div>` : ''}
    <div class="paso-rec"><button type="button" class="btn btn-solid" data-recomendar>✨ Recomendar y llenar los campos</button><span class="mode-status" data-rec-status></span></div>
    <div class="conjunto-fields-grid">

      ${campana.presupuesto_nivel==='campana' ? '' : `<div class="mode-field">
        <label>Presupuesto diario</label>
        <input type="text" data-conjunto="${conjunto.id}" data-field="presupuesto_diario" placeholder="Ej: $200 MXN" value="${escHtml(conjunto.presupuesto_diario)}">

      <div class="mode-field">

        <input type="text" data-conjunto="${conjunto.id}" data-field="duracion" placeholder="Ej: Indefinido / 7 días" value="${escHtml(conjunto.duracion)}">

      <div class="mode-field" style="grid-column:1/-1;">
        <label>Intereses</label>
        <textarea data-conjunto="${conjunto.id}" data-field="intereses" placeholder="Público abierto (sin intereses, deja que Advantage+ haga su trabajo)...">${escHtml(conjunto.intereses)}</textarea>

  `;

  card.querySelector('.item-del').addEventListener('click', ()=>{

    campana.conjuntos = campana.conjuntos.filter(c=>c.id!==conjunto.id);
    scheduleEstructuraSave();
    render();
  });
  card.querySelectorAll('input[data-conjunto],textarea[data-conjunto]').forEach(inp=>{
    inp.addEventListener('input',(e)=>{
      conjunto[e.target.dataset.field] = e.target.value;
      scheduleEstructuraSave();

  card.querySelectorAll('.alc-card[data-pub]').forEach(c=>{
    const elegir = ()=>{ if(c.classList.contains('alc-off')) return; conjunto.publico_fuente = c.dataset.pub; scheduleEstructuraSave(); render(); };
    c.addEventListener('click',(e)=>{ if(e.target.closest('[data-como]')) return; elegir(); });
    c.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); elegir(); } });

  card.querySelectorAll('[data-como]').forEach(b=>b.addEventListener('click',(e)=>{ e.stopPropagation(); b.closest('.alc-card').classList.toggle('abierto'); }));
  const selPerfil = card.querySelector('[data-perfil-366]'), selCamp = card.querySelector('[data-camp-temporada]');
  if(selPerfil) selPerfil.addEventListener('change',(e)=>{ conjunto.perfil_366 = e.target.value; scheduleEstructuraSave(); });
  if(selCamp) selCamp.addEventListener('change',(e)=>{ conjunto.camp_temporada = e.target.value; scheduleEstructuraSave(); });
  card.querySelector('[data-recomendar]').addEventListener('click', async (e)=>{
    const btn = e.currentTarget, status = card.querySelector('[data-rec-status]');
    btn.disabled = true; const previo = btn.textContent; btn.textContent = 'Pensando…'; status.textContent = ''; status.className = 'mode-status';
    try{
      const body = { modo:'targeting', cliente: CLIENTE_ID, grupo_id: campana.grupo_id, producto_id: campana.producto_id, fuente };
      if(fuente==='366') body.perfil_366 = (selPerfil && selPerfil.value) || conjunto.perfil_366 || (perfiles[0]&&perfiles[0].nombre) || '';
      if(fuente==='temporada') body.campanaId = (selCamp && selCamp.value) || conjunto.camp_temporada || (camps[0]&&camps[0].id) || '';
      conjunto.publico_fuente = fuente; // queda guardado de dónde se partió (lo muestra el resumen de la campaña)
      if(fuente==='366') conjunto.perfil_366 = body.perfil_366;
      if(fuente==='temporada') conjunto.camp_temporada = body.campanaId;
      const res = await fetch('/api/generar-anuncios', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const data = await res.json().catch(()=>({}));
      if(!res.ok || !data.perfil){ status.textContent = res.status===402 ? (data.error||'Llegaste al tope de uso de IA.') : '⚠️ '+(data.error||'No se pudo recomendar el público.'); status.classList.add('error'); return; }
      Object.assign(conjunto, data.perfil);
      if(!String(conjunto.duracion||'').trim()) conjunto.duracion = DURACION_DEFAULT;
      if(campana.presupuesto_nivel!=='campana' && !String(conjunto.presupuesto_diario||'').trim()) conjunto.presupuesto_diario = PRESUPUESTO_DIARIO_MINIMO;
      scheduleEstructuraSave(); render();
    }catch(err){
      status.textContent = '⚠️ Error de conexión.'; status.classList.add('error');
    }finally{
      btn.disabled = false; btn.textContent = previo;
    }
  });
  return card;
}

// Paso 3: los anuncios de un conjunto (se marcan con ✓ los que son de ese conjunto; así se forma la campaña completa).
function buildAnunciosConjunto(campana, conjunto, idx){
  const vinculados = conjunto.anuncios_ids || [];
  const cardsElegibles = cards.filter(c=>campanaAcepta(campana,[c.id]) || vinculados.includes(c.id));
  const ocultos = cards.length - cardsElegibles.length;
  const box = document.createElement('div');
  box.className = 'anu-conj';
  const resumen = [conjunto.edad, conjunto.ubicacion].filter(Boolean).join(' · ');
  box.innerHTML = `
    <div class="anu-conj-t">Conjunto ${idx+1}${resumen ? ' · '+escHtml(resumen) : ''}</div>
    <div class="anuncios-nota-box">
      <p><b>📌 No olvides utilizar formatos:</b> UGC · Testimonio · Demostración · Ángulos...</p>
      <div class="anuncios-link-list">
        ${cardsElegibles.length ? cardsElegibles.map(c=>`
          <label class="anuncio-link-row">
            <input type="checkbox" data-conjunto-anuncio="${conjunto.id}" data-card="${c.id}"${vinculados.includes(c.id)?' checked':''}>
            <span class="badge badge-${c.etapa}">${ETAPA_LABEL[c.etapa]||c.etapa}</span>
            <span class="anuncio-link-titulo" data-editar-card="${c.id}" title="Abrir y editar esta campaña">${escHtml(c.titulo)} ✎</span>
          </label>
        `).join('') : '<p class="mode-status" style="margin:0;">Todavía no hay anuncios guardados para vincular a esta campaña.</p>'}
        ${ocultos ? `<p class="mode-status" style="margin:6px 0 0;">Solo se muestran los anuncios de ${campana.producto_id ? 'este producto o servicio' : 'este grupo'}: la campaña respeta lo que se definió al crearla (${ocultos} anuncio(s) de otros productos no se listan).</p>` : ''}
      </div>
    </div>`;
  box.querySelectorAll('[data-editar-card]').forEach(el=>el.addEventListener('click', ()=>irAEditarCard(el.dataset.editarCard)));
  box.querySelectorAll('input[data-conjunto-anuncio]').forEach(cb=>{
    cb.addEventListener('change',(e)=>{
      const cardId = e.target.dataset.card;
      if(!Array.isArray(conjunto.anuncios_ids)) conjunto.anuncios_ids=[];
      if(e.target.checked){ if(!conjunto.anuncios_ids.includes(cardId)) conjunto.anuncios_ids.push(cardId); }
      else conjunto.anuncios_ids = conjunto.anuncios_ids.filter(id=>id!==cardId);
      scheduleEstructuraSave();
      const vincBox = document.querySelector('[data-vinculados="'+campana.id+'"]');
      if(vincBox) vincBox.innerHTML = htmlAnunciosVinculados(campana);
      const nTotal = new Set((campana.conjuntos||[]).flatMap(cj=>cj.anuncios_ids||[])).size;
      const pill = document.querySelector('.res-col-anuncios .res-pill-dark'); if(pill) pill.classList.toggle('pend', !nTotal);
    });
  });
  return box;
}

// ─── CONSULTA EN VIVO (chat multi-turno) ───────────────────────────────────
// Mismo patrón que "Consulta en vivo" de Jefe Contenido (jefe-contenido-v2.html): la Messages
// API no guarda estado, así que se manda TODO el historial en cada turno -- pero el contexto real
// (ADN, las 4 Notas 366, Radar, retroalimentación) lo vuelve a leer el servidor en cada
// llamada via construirContexto(), así que el chat "conoce" el 366 desde el primer mensaje,
// no solo lo que se escribe dentro del chat. Conversación efímera, no se guarda en storage.

let micRec = null;
function micDetener(){ try{ if(micRec) micRec.stop(); }catch(e){} micRec = null; const m = document.getElementById('chat-mic'); if(m) m.classList.remove('grab'); }
function chatAbrir(v){
  chatAbierto = !!v;
  const w = document.querySelector('.chat-flot'); if(!w) return;
  w.classList.toggle('abierto', chatAbierto);
  const pn = document.getElementById('chat-panel'); if(pn) pn.hidden = !chatAbierto;
  const fab = document.getElementById('chat-fab');
  if(fab){ fab.setAttribute('aria-expanded', chatAbierto ? 'true' : 'false'); fab.title = chatAbierto ? 'Cerrar el chat' : 'Pregúntale al Jefe'; }
  if(chatAbierto){
    const t = document.getElementById('chat-thread'); if(t) t.scrollTop = t.scrollHeight;
    const i = document.getElementById('chat-input'); if(i) i.focus();
  }else{ cerrarAC(); micDetener(); }
}
function renderChat(container){
  const wrap = document.createElement('div');
  wrap.className = 'chat-flot' + (chatAbierto ? ' abierto' : '');
  const hayVoz = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  wrap.innerHTML = `
    <div class="chat-panel" id="chat-panel" role="dialog" aria-label="Chat con el Jefe de Anuncios"${chatAbierto ? '' : ' hidden'}>
      <div class="chat-panel-head">
        <div class="chat-panel-ic"><img src="/img/jefe-anuncios-logo-negro.webp" alt="" aria-hidden="true"></div>
        <div class="chat-panel-t"><b>Pregúntale al Jefe</b><span>Dudas, cambiar un texto o una idea extra. Recuerda tus conversaciones.</span></div>
        ${chatMessages.length ? '<button type="button" class="chat-panel-btn" id="chat-reset-btn" title="Nueva conversación" aria-label="Nueva conversación">↺</button>' : ''}
        <button type="button" class="chat-panel-btn" id="chat-cerrar" title="Cerrar" aria-label="Cerrar el chat">✕</button>
      </div>
      <div id="chat-thread" class="chat-thread builder-chat"></div>
      <div class="chat-adjunto-row">
        <span class="chat-adjunto-hint" id="chat-adjunto-hint"></span>
        <span class="chat-adjunto-preview" id="chat-adjunto-preview"><img alt=""><span></span><button type="button" id="chat-adjunto-quitar" title="Quitar imagen">✕</button></span>
      </div>
      <div class="mode-status" id="chat-status">${escHtml(chatStatus)}</div>
      <div class="chat-pill-wrap">
        <div class="chat-pill">
          <textarea id="chat-input" rows="1" placeholder="Pregúntame o pídeme una idea…">${escHtml(chatDraft)}</textarea>
          <label class="chat-ib" for="chat-file-input" title="Adjuntar una imagen del anuncio" aria-label="Adjuntar imagen">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </label>
          <input type="file" id="chat-file-input" accept="image/*,video/*" hidden>
          ${hayVoz ? '<button type="button" class="chat-ib" id="chat-mic" title="Hablarle al Jefe" aria-label="Dictar con la voz"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></button>' : ''}
          <button class="chat-send" id="chat-send-btn" type="button">Enviar</button>
        </div>
        <div class="ac-lista" id="chat-ac" role="listbox" aria-label="Sugerencias" hidden></div>
      </div>
    </div>
    <button type="button" class="chat-fab" id="chat-fab" aria-expanded="${chatAbierto ? 'true' : 'false'}" aria-controls="chat-panel" title="${chatAbierto ? 'Cerrar el chat' : 'Pregúntale al Jefe'}">
      <img class="ic-chat" src="/img/jefe-anuncios-logo-lima.webp" alt="" aria-hidden="true">
      <svg class="ic-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  `;
  container.appendChild(wrap);
  pintarChatThread();

  document.getElementById('chat-fab').addEventListener('click', ()=>chatAbrir(!chatAbierto));
  document.getElementById('chat-cerrar').addEventListener('click', ()=>chatAbrir(false));
  const chatInputEl = document.getElementById('chat-input');
  const autoAltoChat = ()=>{ chatInputEl.style.height='auto'; chatInputEl.style.height=Math.min(chatInputEl.scrollHeight, 120)+'px'; };
  autoAltoChat();
  chatInputEl.addEventListener('input',(e)=>{ chatDraft = e.target.value; autoAltoChat(); pintarAC(); });
  chatInputEl.addEventListener('focus', pintarAC);
  chatInputEl.addEventListener('blur', ()=>setTimeout(cerrarAC, 120));
  chatInputEl.addEventListener('keydown',(e)=>{
    const abierta = !document.getElementById('chat-ac').hidden;
    if(abierta && e.key==='ArrowDown'){ e.preventDefault(); moverAC(1); return; }
    if(abierta && e.key==='ArrowUp'){ e.preventDefault(); moverAC(-1); return; }
    if(e.key==='Escape'){ if(abierta) cerrarAC(); else chatAbrir(false); return; }
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      if(abierta && acIdx>=0){ elegirAC(acIdx); return; }
      cerrarAC(); enviarMensajeChat();
    }
  });
  document.getElementById('chat-send-btn').addEventListener('click', enviarMensajeChat);
  document.getElementById('chat-file-input').addEventListener('change',(e)=>{
    procesarArchivoChatImagen(e.target.files && e.target.files[0]);
  });
  document.getElementById('chat-adjunto-quitar').addEventListener('click',()=>{
    chatImagenBase64=''; chatImagenNombre='';
    document.getElementById('chat-adjunto-preview').style.display='none';
    document.getElementById('chat-adjunto-hint').textContent='';
    document.getElementById('chat-file-input').value='';
  });
  const mic = document.getElementById('chat-mic');
  if(mic) mic.addEventListener('click', ()=>{
    if(micRec){ micDetener(); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR(); rec.lang = 'es-MX'; rec.interimResults = true; rec.continuous = false;
    const base = chatInputEl.value ? chatInputEl.value.replace(/\s+$/,'') + ' ' : '';
    rec.onresult = (e)=>{ let t=''; for(let i=0;i<e.results.length;i++) t += e.results[i][0].transcript; chatDraft = base + t; chatInputEl.value = chatDraft; autoAltoChat(); };
    rec.onend = ()=>{ micRec = null; const m = document.getElementById('chat-mic'); if(m) m.classList.remove('grab'); };
    rec.onerror = (e)=>{ const st = document.getElementById('chat-status'); if(st && e && e.error==='not-allowed') st.textContent = 'Para dictar, permite el micrófono en tu navegador.'; };
    micRec = rec; mic.classList.add('grab');
    try{ rec.start(); }catch(err){ micDetener(); }
  });
  const resetBtn = document.getElementById('chat-reset-btn');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    micDetener();
    chatMessages = []; chatDraft = ''; chatStatus = '';
    chatImagenBase64=''; chatImagenNombre='';
    guardarChatPersistido();
    chatEnfocar = true;
    render();
  });
  if(chatAbierto && chatEnfocar){ chatEnfocar = false; chatInputEl.focus(); }
}

// ─── MEMORIA DEL CHAT (una conversación guardada por cada producto / grupo del filtro de arriba) ───
const CHAT_KEY = CLIENTE_ID + ':anuncios-chat:';
let chatClave = null;
function claveChatActual(){ return productoId ? 'p-'+productoId : (grupoId ? 'g-'+grupoId : 'all'); }
async function cargarChatPersistido(conRender){
  const clave = claveChatActual(); chatClave = clave; chatMessages = [];
  try{
    const r = await window.storage.get(CHAT_KEY+clave);
    const d = r && r.value ? JSON.parse(r.value) : [];
    if(Array.isArray(d)) chatMessages = d.filter(m=>m && (m.role==='user'||m.role==='assistant') && typeof m.content==='string');
  }catch(e){}
  if(claveChatActual()!==clave) return; // el filtro cambió mientras cargaba: ya hay otra carga en curso
  if(conRender!==false) render();
}
function guardarChatPersistido(){
  if(chatClave===null) return;
  const arr = chatMessages.slice(-60).map(m=>({ role:m.role, content:m.content, etapa:m.etapa||'', usada:!!m.usada, imagenNombre:m.imagenNombre||'' }));
  window.storage.set(CHAT_KEY+chatClave, JSON.stringify(arr)).catch(()=>{});
}

// ─── AUTOCOMPLETAR DEL CHAT (estilo buscador): al enfocar o escribir, una lista sugiere lo que puedes decir ───
// Las frases cambian según lo que ya existe para el filtro elegido (anuncios, campañas, conversación). Genéricas:
// nada de marca va aquí; solo se inserta el nombre del producto del filtro si lo hay.
const normAC = t=>(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
function bancoSugerenciasChat(){
  const f = window.__foco ? window.__foco.get() : null;
  const nombre = (f && !f.esTodo && f.nombre) ? f.nombre : '';
  const de = nombre ? ' de '+nombre : '';
  const delFoco = x=> x && (productoId ? x.producto_id===productoId : grupoId ? x.grupo_id===grupoId : true);
  const misCards = cards.filter(delFoco), misEstr = estructuras.filter(delFoco);
  const crear = [
    `Armemos las primeras ideas de anuncios${de}`,
    'Quiero un anuncio para gente que no conoce mi marca',
    'Quiero un anuncio para gente que ya conoce la marca pero no se decide',
    'Quiero un anuncio para gente lista para comprar',
    `Dame 3 ideas de anuncios de conversión${de}`,
    `Dame ideas de anuncios${de} para el siguiente mes`,
    'Escríbeme un hook que detenga el scroll',
    'Dame 3 hooks distintos para mi próximo anuncio',
  ];
  const estrategia = [
    '¿Por dónde empiezo con mis anuncios?',
    '¿Qué objetivo de campaña me conviene?',
    '¿Cuánto presupuesto diario debería usar?',
    '¿Qué público debería usar en mi primer conjunto de anuncios?',
    '¿Qué formato me conviene: reel, imagen o carrusel?',
  ];
  const revisar = [
    'Revisa mis anuncios y dime cuál mejorar primero',
    '¿Qué anuncio me falta para cubrir adquisición, consideración y conversión?',
    'Mejora el copy de mi último anuncio',
    'Analiza la imagen de mi anuncio y dime qué opinas',
  ];
  const campana = [
    `¿Cómo armo mi primera campaña con los anuncios${de} que ya tengo?`,
    '¿Qué anuncio me falta para completar mi campaña?',
    'Propón el siguiente conjunto de anuncios con un público nuevo',
  ];
  const medir = [
    '¿Cómo voy a medir si esta campaña funciona?',
    '¿Qué hago si mi anuncio no genera mensajes?',
    '¿Cuándo debo apagar un anuncio y cuándo escalarlo?',
  ];
  // lo más útil según lo que ya hay va primero
  let orden;
  if(!misCards.length) orden = [crear.slice(0,3), estrategia, crear.slice(3), revisar.slice(0,0), medir];
  else if(!misEstr.length) orden = [campana.slice(0,1), revisar, crear, estrategia, campana.slice(1), medir];
  else orden = [campana.slice(1), medir, revisar, crear, estrategia];
  const lista = [];
  if(chatMessages.length) lista.push('Resume lo que hemos decidido y dime el siguiente paso');
  orden.forEach(g=>g.forEach(t=>{ if(!lista.includes(t)) lista.push(t); }));
  return lista;
}
let acItems = [], acIdx = -1;
function sugerenciasParaTexto(texto){
  const todas = bancoSugerenciasChat();
  const q = normAC(texto);
  if(!q) return todas.slice(0,6);
  const tokens = q.split(' ');
  return todas
    .map(t=>({ t, n:normAC(t) }))
    .filter(x=>tokens.every(k=>x.n.includes(k)))
    .map(x=>({ t:x.t, r: x.n.startsWith(q) ? 0 : (x.n.split(' ').some(w=>w.startsWith(tokens[0])) ? 1 : 2) }))
    .sort((a,b)=>a.r-b.r)
    .map(x=>x.t).slice(0,8);
}
function cerrarAC(){ const b = document.getElementById('chat-ac'); if(b){ b.hidden = true; b.innerHTML = ''; } acItems = []; acIdx = -1; }
function pintarAC(){
  const box = document.getElementById('chat-ac'); const inp = document.getElementById('chat-input');
  if(!box || !inp) return;
  acItems = sugerenciasParaTexto(inp.value);
  acIdx = -1;
  if(!acItems.length){ cerrarAC(); return; }
  const q = normAC(inp.value);
  box.innerHTML = acItems.map((t,i)=>{
    const empieza = q && normAC(t).startsWith(q);
    const ya = empieza ? t.slice(0, inp.value.trim().length) : '';
    const resto = empieza ? t.slice(inp.value.trim().length) : t;
    return `<button type="button" class="ac-item" role="option" data-ac="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>${ya ? escHtml(ya)+'<b>'+escHtml(resto)+'</b>' : escHtml(resto)}</span></button>`;
  }).join('');
  box.hidden = false;
  box.querySelectorAll('[data-ac]').forEach(b=>{
    b.addEventListener('mousedown',(e)=>e.preventDefault()); // que el clic no le quite el foco al chat antes de elegir
    b.addEventListener('click',()=>elegirAC(+b.dataset.ac));
  });
}
function moverAC(delta){
  if(!acItems.length) return;
  acIdx = (acIdx + delta + acItems.length) % acItems.length;
  document.querySelectorAll('#chat-ac .ac-item').forEach((el,i)=>el.classList.toggle('on', i===acIdx));
}
function elegirAC(i){
  const t = acItems[i]; if(!t) return;
  chatDraft = t;
  const inp = document.getElementById('chat-input'); if(inp) inp.value = t;
  cerrarAC();
  enviarMensajeChat();
}

function pintarChatThread(){
  const box = document.getElementById('chat-thread');
  if(!box) return;
  if(!chatMessages.length){
    box.innerHTML = '';
    return;
  }
  box.innerHTML = chatMessages.map((m,i)=>{
    if(m.role==='user'){
      const tagImagen = m.imagenNombre ? `<div class="chat-msg-imagen-tag">📎 ${escHtml(m.imagenNombre)}</div>` : '';
      return `<div class="bubble user">${tagImagen}${escHtml(m.content)}</div>`;
    }
    const badgeEtapa = m.etapa ? `<span class="badge badge-${m.etapa}" style="margin-bottom:6px;">${ETAPA_LABEL[m.etapa]||m.etapa}</span><br>` : '';
    return `<div class="bubble assistant">${badgeEtapa}${escHtml(m.content)}
      <div class="chat-msg-actions">
        <button type="button" data-copy-idx="${i}">📋 Copiar</button>
        <button type="button" data-usar-idx="${i}" class="${m.usada?'done':''}">${m.usada?'✅ Agregado a Campañas guardadas':'✅ Guardar como campaña'}</button>
      </div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
  box.querySelectorAll('[data-copy-idx]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      navigator.clipboard.writeText(chatMessages[+btn.dataset.copyIdx].content).then(()=>{
        const prev=btn.textContent; btn.textContent='✅ Copiado';
        setTimeout(()=>{ btn.textContent=prev; },1500);
      });
    });
  });
  box.querySelectorAll('[data-usar-idx]').forEach(btn=>{
    btn.addEventListener('click',()=>usarRespuestaChatComoCampana(+btn.dataset.usarIdx));
  });
}

async function enviarMensajeChat(){
  const mensaje = (chatDraft||'').trim();
  const statusEl = document.getElementById('chat-status');
  if(!mensaje && !chatImagenBase64){ if(statusEl) statusEl.textContent='⚠️ Escribe tu mensaje o adjunta una imagen primero.'; return; }
  micDetener();
  const btn = document.getElementById('chat-send-btn');
  if(btn) btn.disabled = true;
  if(statusEl){ statusEl.className='mode-status'; statusEl.textContent='⏳ Leyendo ADN + 366 + Radar para responderte...'; }

  // La imagen SOLO se manda en esta llamada -- en chatMessages queda como texto (con el nombre del
  // archivo como tag) para no ir resendando los bytes en cada turno siguiente de la conversación.
  const imagenParaEnviar = chatImagenBase64;
  const imagenMediaType = chatImagenMediaType;
  const nombreImagen = chatImagenNombre;
  const textoUsuario = mensaje || 'Analiza esta imagen del anuncio y dame tu opinión estratégica.';

  chatMessages.push({ role:'user', content: textoUsuario, imagenNombre: nombreImagen || '' });
  chatDraft = '';
  chatImagenBase64=''; chatImagenNombre='';
  pintarChatThread();
  try{
    const historialParaEnviar = chatMessages.map((m,i)=>{
      const esUltimo = i === chatMessages.length - 1;
      if(esUltimo && imagenParaEnviar){
        return { role: m.role, content: [
          { type:'image', source:{ type:'base64', media_type: imagenMediaType, data: imagenParaEnviar } },
          { type:'text', text: m.content },
        ]};
      }
      return { role: m.role, content: m.content };
    });
    const res = await fetch('/api/generar-anuncios', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ modo:'chat', cliente: CLIENTE_ID, grupo_id: grupoId, producto_id: productoId, messages: historialParaEnviar }),
    });
    const data = await res.json();
    if(!res.ok){ const e = new Error(data.error || 'Error al consultar al Jefe.'); e.tope = res.status===402 || !!data.tope; throw e; }
    // Cuando el Jefe entrega un guion completo, la 1a línea trae "ETAPA: adquisicion|consideracion|
    // conversion" (metadata para clasificar la tarjeta si se guarda como campaña) -- se separa del
    // texto que se muestra/copia, nunca se le enseña esa línea cruda al usuario.
    const textoCrudo = data.text || '';
    const matchEtapa = textoCrudo.match(/^\s*ETAPA:\s*(adquisicion|consideracion|conversion)\s*\n?/i);
    const etapaDetectada = matchEtapa ? matchEtapa[1].toLowerCase() : '';
    const textoLimpio = matchEtapa ? textoCrudo.slice(matchEtapa[0].length) : textoCrudo;
    chatMessages.push({role:'assistant', content:textoLimpio, etapa: etapaDetectada});
    chatStatus = '✅ Listo';
    guardarChatPersistido();
  }catch(err){
    chatMessages.pop();
    chatDraft = mensaje;
    // 402 = tope de tokens del hub: el aviso del servidor se muestra tal cual (no es un error de conexión)
    chatStatus = err.tope ? err.message : '❌ ' + (err.message || 'Error al consultar al Jefe.');
  }
  chatEnfocar = true;
  render();
}

function usarRespuestaChatComoCampana(idx){
  const msg = chatMessages[idx];
  if(!msg || msg.role!=='assistant' || msg.usada) return;
  const preguntaPrevia = (chatMessages[idx-1] && chatMessages[idx-1].role==='user') ? chatMessages[idx-1].content : '';
  const primeraLinea = (msg.content.split('\n').find(l=>l.trim())||'').slice(0,140);
  const baseCod = baseCodigoAnuncio(productoId || '', grupoId || '');
  cards.unshift({
    id: mkCardId(),
    etapa: (msg.etapa && ETAPAS.some(e=>e.key===msg.etapa)) ? msg.etapa : 'consideracion',
    formato: 'reel',
    grupo_id: grupoId || '',
    producto_id: productoId || '',
    titulo: tituloConCodigo(primeraLinea || 'Idea desde Consulta en vivo', baseCod.prefijo, baseCod.max + 1),
    hook: primeraLinea,
    objetivo: '', angulo: '', audiencia: '',
    guion: { hook:'', problema:'', solucion:'', prueba:'', costo_inaccion:'', cta:'' },
    version_15s: '', hooks_alternativos: [], visual_sugerido: '', duracion_sugerida: '',
    copy_publicacion: msg.content,
    prompt_imagen: '', prompt_video: '', caption_whatsapp: '',
    titulo_anuncio: '', descripcion_anuncio: '', cta_boton: '', link_destino: '',
    estado: 'idea', fecha: '',
    retroalimentacion: preguntaPrevia ? `Pregunta original en el chat: ${preguntaPrevia}` : '',
    link_archivo_final: '',
  });
  msg.usada = true;
  guardarChatPersistido();
  document.getElementById('count-cards').textContent = cards.length;
  scheduleCardsSave();
  chatStatus = '✅ Se guardó como campaña -- revísala y complétala en "Campañas guardadas".';
  render();
}

function linksConUrl(item){ return linksDe(item).filter(l=>l && l.url && l.url.trim()); }
function linkVista(item){
  const ls = linksConUrl(item);
  if(!ls.length) return null;
  return ls.find(l=>l.id===linkVistaId) || ls.find(l=>{ const m = infoMaterial(l.url); return m && m.tipo!=='link'; }) || ls[0];
}
function nombreLink(l, i){ return (l.nombre||'').trim() || ('Link '+(i+1)); }
// Miniatura de la tarjeta: la primera imagen que salga de alguno de los links.
function linkMiniatura(item){
  for(const l of linksConUrl(item)){ const m = infoMaterial(l.url); if(m && m.thumb) return m.thumb; }
  return '';
}

// Qué se puede mostrar a partir del "Link del anuncio final": imagen o video directo, YouTube, Google Drive,
// Instagram y TikTok se ven dentro del celular; cualquier otro link queda como botón "Abrir".
function infoMaterial(url){
  let u = (url||'').trim();
  if(!u) return null;
  if(!/^https?:\/\//i.test(u)) u = 'https://'+u;
  let L; try{ L = new URL(u); }catch(e){ return null; }
  const h = L.hostname.replace(/^www\./,'').toLowerCase();
  const ext = ((L.pathname.match(/\.([a-z0-9]+)$/i)||[])[1]||'').toLowerCase();
  if(h.endsWith('dropbox.com')){ L.searchParams.delete('dl'); L.searchParams.set('raw','1'); }
  const limpio = x=>x.replace(/"/g,'%22').replace(/'/g,'%27').replace(/</g,'%3C').replace(/>/g,'%3E');
  const abrir = limpio(L.toString());
  let m, id = null;
  if(['jpg','jpeg','png','gif','webp','avif','bmp'].includes(ext) || h.endsWith('googleusercontent.com')) return {tipo:'img', src:abrir, thumb:abrir, abrir, host:h};
  if(['mp4','webm','mov','m4v','ogv'].includes(ext)) return {tipo:'video', src:abrir, thumb:null, abrir, host:h};
  if(h==='youtu.be') id = L.pathname.slice(1).split('/')[0];
  else if(h.endsWith('youtube.com')){
    if(L.pathname.startsWith('/watch')) id = L.searchParams.get('v');
    else if((m = L.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{6,})/))) id = m[1];
  }
  if(id && /^[\w-]{6,}$/.test(id)) return {tipo:'embed', src:'https://www.youtube.com/embed/'+id, thumb:'https://img.youtube.com/vi/'+id+'/hqdefault.jpg', abrir, host:h};
  if(h==='drive.google.com'){
    m = L.pathname.match(/\/file\/d\/([\w-]+)/); id = m ? m[1] : L.searchParams.get('id');
    if(id && /^[\w-]+$/.test(id)) return {tipo:'embed', src:'https://drive.google.com/file/d/'+id+'/preview', thumb:'https://drive.google.com/thumbnail?id='+id+'&sz=w640', abrir, host:h};
  }
  if(h.endsWith('instagram.com') && (m = L.pathname.match(/^\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([\w-]+)/)))
    return {tipo:'embed', src:'https://www.instagram.com/'+(m[1]==='reels'?'reel':m[1])+'/'+m[2]+'/embed', thumb:null, abrir, host:h};
  if(h.endsWith('tiktok.com') && (m = L.pathname.match(/\/video\/(\d+)/)))
    return {tipo:'embed', src:'https://www.tiktok.com/embed/v2/'+m[1], thumb:null, abrir, host:h};
  return {tipo:'link', abrir, host:h};
}

// Vista previa del anuncio, lo más parecida a Facebook/Instagram: quién publica, el copy completo (legible),
// el material del link elegido y el pie con título, descripción y botón de llamada a la acción. El material
// solo se vuelve a cargar cuando cambia el link; el resto se actualiza al escribir.
function pintarPreviewPost(item){
  const box = document.getElementById('pm-preview');
  if(!box) return;
  const est = ESTADO_LABEL[item.estado] ? item.estado : 'idea';
  const gr = ESTADO_GRAD[est];
  if(!box.querySelector('.adp')){
    box.innerHTML = `
      <div class="adp-etq">Así se verá tu anuncio</div>
      <div class="pm-linkchips"></div>
      <div class="adp">
        <div class="adp-top"><span class="adp-av"></span><div class="adp-quien"><b class="adp-marca"></b><small>Publicidad · 🌐</small></div></div>
        <div class="adp-copy"></div>
        <div class="adp-media"></div>
        <div class="adp-foot"><div class="adp-foot-txt"><small class="adp-dom"></small><b class="adp-tit"></b><span class="adp-desc"></span></div><span class="adp-cta"></span></div>
      </div>
      <p class="pm-hint"></p>`;
    box.dataset.media = '';
  }
  const marca = marcaVisible() || 'Tu marca';
  box.querySelector('.adp-av').textContent = marca.trim().charAt(0).toUpperCase();
  box.querySelector('.adp-marca').textContent = marca;
  const copy = (item.copy_publicacion || '').trim();
  const cEl = box.querySelector('.adp-copy');
  cEl.textContent = copy || 'Aquí verás tu copy tal como se leerá en el anuncio.';
  cEl.classList.toggle('vacio', !copy);
  let dom = ''; try{ dom = item.link_destino ? new URL(linkHref(item.link_destino)).hostname.replace(/^www\./,'') : ''; }catch(e){}
  box.querySelector('.adp-dom').textContent = dom;
  box.querySelector('.adp-tit').textContent = item.titulo_anuncio || '';
  box.querySelector('.adp-desc').textContent = item.descripcion_anuncio || '';
  const cta = box.querySelector('.adp-cta'); cta.textContent = item.cta_boton || ''; cta.style.display = item.cta_boton ? '' : 'none';
  box.querySelector('.adp-foot').style.display = (item.titulo_anuncio || item.descripcion_anuncio || item.cta_boton || dom) ? '' : 'none';

  const lv = linkVista(item);
  const mi = infoMaterial(lv && lv.url);
  const claveMedia = (lv ? lv.url.trim() : '') + '|' + est + '|' + (item.formato || '');
  if(box.dataset.media !== claveMedia){
    box.dataset.media = claveMedia;
    let capa = '';
    if(mi){
      if(mi.tipo==='img') capa = `<img class="pm-media" src="${mi.src}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`;
      else if(mi.tipo==='video') capa = `<video class="pm-media" src="${mi.src}#t=0.5" controls playsinline preload="metadata"></video>`;
      else if(mi.tipo==='embed'){
        if(mi.thumb) capa += `<img class="pm-media" src="${mi.thumb}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`;
        capa += `<iframe class="pm-media pm-embed" src="${mi.src}" allow="autoplay; fullscreen" allowfullscreen loading="lazy" referrerpolicy="no-referrer"></iframe>`;
      }
    }
    const media = box.querySelector('.adp-media');
    media.style.setProperty('--a', gr[0]); media.style.setProperty('--b', gr[1]);
    media.innerHTML = `${mi && mi.tipo!=='link' ? '' : `<span class="pm-ico">${FORMATO_ICO[item.formato]||'🎬'}</span>`}${capa}<span class="pchip">${escHtml(item.formato||'reel')}</span>`;
    box.querySelector('.pm-hint').innerHTML = !mi
      ? 'Agrega el link del anuncio final (arriba) y aquí lo verás en el anuncio.'
      : (mi.tipo==='link'
          ? `Este link no se puede mostrar aquí. <a href="${mi.abrir}" target="_blank" rel="noopener">Abrir material ↗</a>`
          : `<a href="${mi.abrir}" target="_blank" rel="noopener">Abrir en una pestaña ↗</a>${mi.host==='drive.google.com' ? '<br>Si no se ve, en Drive comparte el archivo con “Cualquier persona con el enlace”.' : ''}`);
  }
  pintarChipsLinks(item, box);
}

// Con 2 o más links, chips con su nombre sobre el celular para elegir cuál se ve.
function pintarChipsLinks(item, box){
  const cont = box.querySelector('.pm-linkchips'); if(!cont) return;
  const ls = linksDe(item).map((l,i)=>({l,i})).filter(x=>x.l.url && x.l.url.trim());
  const sel = linkVista(item);
  cont.innerHTML = ls.length > 1 ? ls.map(x=>`<button type="button" class="pm-linkchip${sel && sel.id===x.l.id?' on':''}" data-vista-link="${x.l.id}">${escHtml(nombreLink(x.l,x.i))}</button>`).join('') : '';
  if(!box._chipsListo){
    box._chipsListo = true;
    box.addEventListener('click',(e)=>{
      const b = e.target.closest('[data-vista-link]'); if(!b) return;
      const it = cards.find(c=>c.id===postModalId); if(!it) return;
      linkVistaId = b.dataset.vistaLink; pintarPreviewPost(it); pintarLinks(it);
    });
  }
}

// Links del anuncio: se ven como pastillas compactas (icono + nombre; clic abre el link) con 📱 para verlo en el celular
// y ✎ para editarlo. "+ Agregar link" abre una fila para escribir nombre y dirección; al darle "Listo" vuelve a ser pastilla.
let linkEditandoId = '';
function iconoLink(url){
  const m = infoMaterial(url); if(!m) return '🔗';
  const h = m.host || '';
  if(h.includes('drive.google')) return '📁';
  if(h.includes('youtu')) return '▶️';
  if(h.includes('instagram')) return '📷';
  if(h.includes('tiktok')) return '🎵';
  if(h.includes('canva')) return '🎨';
  if(m.tipo==='img') return '🖼️';
  if(m.tipo==='video') return '🎬';
  return '🔗';
}
function pintarLinks(item, modal){
  const box = (modal||postModalEl).querySelector('#pm-links');
  if(!box) return;
  const links = linksDe(item);
  const sel = linkVista(item);
  const pastilla = (l,i)=>`
    <span class="pm-lk${sel && sel.id===l.id ? ' on' : ''}" data-lid="${l.id}">
      <a class="pm-lk-main" href="${escHtml(linkHref(l.url))}" target="_blank" rel="noopener" title="Abrir ${escHtml(nombreLink(l,i))}">
        <span class="pm-lk-ico">${iconoLink(l.url)}</span><span class="pm-lk-nom">${escHtml(nombreLink(l,i))}</span><span class="pm-lk-go">↗</span>
      </a>
      <button type="button" class="pm-lk-btn" data-lk-ver title="Verlo en el celular">📱</button>
      <button type="button" class="pm-lk-btn" data-lk-edit title="Editar nombre o link">✎</button>
    </span>`;
  const editor = (l)=>`
    <div class="pm-lk-editor" data-lid="${l.id}">
      <input type="text" class="pm-link-nombre" placeholder="Nombre (Video, Imagen, Anuncio final…)" value="${escHtml(l.nombre)}" aria-label="Nombre del link">
      <input type="text" class="pm-link-url" placeholder="https://… (Drive, Canva, YouTube…)" value="${escHtml(l.url)}" aria-label="Dirección del link">
      <div class="pm-lk-editor-btns">
        <button type="button" class="btn btn-solid btn-sm" data-lk-listo>Listo</button>
        <button type="button" class="pm-lk-quitar" data-lk-quitar>Quitar</button>
      </div>
    </div>`;
  const editando = links.find(l=>l.id===linkEditandoId);
  box.innerHTML = `
    <div class="pm-links-t">🔗 Links del anuncio <span class="pm-hint-inline">(Drive, Canva, el video, la imagen…)</span></div>
    <div class="pm-lk-lista">
      ${links.filter(l=>l.id!==linkEditandoId && l.url && l.url.trim()).map((l)=>pastilla(l, links.indexOf(l))).join('')}
      ${editando ? '' : '<button type="button" class="pm-lk-add" data-link-add>＋ Agregar link</button>'}
    </div>
    ${editando ? editor(editando) : ''}`;
  const guardar = ()=>{ sincronizarLinkPrincipal(item); scheduleCardsSave(); };
  box.querySelectorAll('.pm-lk').forEach(el=>{
    const l = links.find(x=>x.id===el.dataset.lid); if(!l) return;
    el.querySelector('[data-lk-ver]').addEventListener('click',()=>{ linkVistaId = l.id; pintarPreviewPost(item); pintarLinks(item); });
    el.querySelector('[data-lk-edit]').addEventListener('click',()=>{ linkEditandoId = l.id; pintarLinks(item); const i = box.querySelector('.pm-link-url'); if(i) i.focus(); });
  });
  const ed = box.querySelector('.pm-lk-editor');
  if(ed && editando){
    const nom = ed.querySelector('.pm-link-nombre'), url = ed.querySelector('.pm-link-url');
    nom.addEventListener('input',()=>{ editando.nombre = nom.value; guardar(); });
    url.addEventListener('input',()=>{ editando.url = url.value; guardar(); pintarPreviewPost(item); });
    const cerrar = ()=>{
      // un link sin dirección no se queda
      if(!(editando.url||'').trim()) item.links = links.filter(x=>x.id!==editando.id);
      linkEditandoId = ''; guardar(); pintarLinks(item); pintarPreviewPost(item);
    };
    ed.querySelector('[data-lk-listo]').addEventListener('click', cerrar);
    [nom,url].forEach(i=>i.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); cerrar(); } }));
    ed.querySelector('[data-lk-quitar]').addEventListener('click',()=>{
      item.links = links.filter(x=>x.id!==editando.id); linkEditandoId = ''; guardar(); pintarLinks(item); pintarPreviewPost(item);
    });
  }
  const add = box.querySelector('[data-link-add]');
  if(add) add.addEventListener('click',()=>{
    const nuevo = { id:mkLinkId(), nombre:'', url:'' };
    links.push(nuevo); linkEditandoId = nuevo.id; pintarLinks(item);
    const i = box.querySelector('.pm-link-nombre'); if(i) i.focus();
  });
}

// ─── PIEZAS BAJO DEMANDA (guion · caption de WhatsApp · prompt de imagen · prompt de video) ─────
// El detalle base ya no las trae para no gastar tokens de más: cada una se crea solo cuando el usuario
// pulsa su botón. Lo que ya tenga contenido (tarjetas anteriores o piezas ya creadas) se muestra y
// se puede regenerar.
const PIEZAS = {
  guion:{ ico:'📝', boton:'Guion para video', carga:'Escribiendo el guion…' },
  whatsapp:{ ico:'💬', boton:'Caption de WhatsApp', carga:'Escribiendo el caption…' },
  imagen:{ ico:'🖼️', boton:'Prompt para imagen con IA', carga:'Creando el prompt de imagen…' },
  video:{ ico:'🎬', boton:'Prompt para video con IA', carga:'Creando el prompt de video…' },
};
function piezaTieneContenido(item, tipo){
  if(tipo==='guion') return !!(item.version_15s || (item.hooks_alternativos||[]).length || Object.values(item.guion||{}).some(Boolean));
  if(tipo==='whatsapp') return !!item.caption_whatsapp;
  if(tipo==='imagen') return !!item.prompt_imagen;
  return !!item.prompt_video;
}
const piezasAbiertas = new Set(); // "idTarjeta:tipo" de los bloques que el usuario tiene desplegados
const piezaMaterial = { imagen:null, video:null };
function botonGemini(tipo){
  const img = tipo==='imagen';
  const herr = img ? 'ChatGPT' : 'Gemini';
  return `<div class="pm-gemini">
    <button type="button" class="pm-copiar-gemini" data-copiar-prompt="${tipo}">📋 Copiar prompt <span>listo para pegar en ${herr}</span></button>
    <a class="pm-abrir-gemini" href="${img ? 'https://chatgpt.com' : 'https://gemini.google.com/app'}" target="_blank" rel="noopener">Abrir ${herr} ↗</a>
    ${img ? '<div class="pm-logo-tip">💡 <b>Sube tu logotipo a ChatGPT junto con este prompt</b> (clip 📎): el prompt ya le indica en qué esquina colocarlo y lleva el llamado a la acción dentro de la imagen.</div>' : '<div class="pm-logo-tip">💡 <b>Sube tu logotipo a Gemini junto con este prompt</b> (clip 📎) para que aparezca al final. El video dura de 15 a 20 segundos, lleva voz y está pensado como un comercial dinámico.</div>'}
  </div>`;
}
// Texto del guion listo para pegar (todas las partes, la versión de 15 s y los hooks alternativos).
function guionComoTexto(item){
  const g = item.guion || {};
  const partes = [['Hook', g.hook], ['Problema', g.problema], ['Solución', g.solucion], ['Prueba', g.prueba], ['Costo de la inacción', g.costo_inaccion], ['CTA', g.cta]]
    .filter(x=>x[1] && String(x[1]).trim()).map(x=>x[0]+': '+x[1]);
  if(item.version_15s) partes.push('', 'Versión 15 segundos: '+item.version_15s);
  if((item.hooks_alternativos||[]).length) partes.push('', 'Hooks alternativos:', ...item.hooks_alternativos.map(h=>'- '+h));
  return partes.join('\n');
}
// Panel (escondido hasta que se pulsa su botón) con el contenido de una pieza y su botón de copiar.
function panelPieza(item, tipo){
  const k = item.id+':'+tipo, abierto = piezasAbiertas.has(k);
  const copiar = (t, txt)=>`<button type="button" class="pm-copiar-gemini pm-copiar-simple" data-copiar-texto="${t}">📋 Copiar ${txt}</button>`;
  let cuerpo = '';
  if(tipo==='guion'){
    cuerpo = guionFieldHtml(item,'hook','Hook (primeros 3 seg)') + guionFieldHtml(item,'problema','Problema o error') +
      guionFieldHtml(item,'solucion','Solución / método') + guionFieldHtml(item,'prueba','Prueba o testimonio') +
      guionFieldHtml(item,'costo_inaccion','Costo de la inacción') + guionFieldHtml(item,'cta','CTA') +
      textFieldHtml(item,'version_15s','Versión 15 segundos') + textFieldHtml(item,'hooks_alternativos','3 hooks alternativos (uno por línea)') +
      copiar('guion','todo el guion');
  } else if(tipo==='whatsapp'){
    cuerpo = promptFieldHtml(item,'caption_whatsapp','Caption');
  } else {
    const campo = tipo==='imagen' ? 'prompt_imagen' : 'prompt_video';
    cuerpo = promptFieldHtml(item, campo, 'Prompt') + botonGemini(tipo) + `
      <div class="pm-actualizar">
        <button type="button" class="pm-actualizar-btn" data-ask-toggle="${tipo}">✏️ Actualizar o rehacer este prompt</button>
        <div class="pm-pieza-ask" data-ask="${tipo}" hidden>
          <div class="pm-hint-txt">¿Qué quieres cambiar? Escríbelo y ajusto tu prompt (por ejemplo: “más luz”, “que salga mi producto”, “otro estilo”). Si lo dejas vacío, te doy otra versión.</div>
          <textarea class="pm-ask-texto" rows="2" placeholder="Ej. que el fondo sea más claro y agrega mi logo en una esquina…"></textarea>
          <div class="pm-ask-fila">
            <label class="btn-guion" style="cursor:pointer;">📎 Agregar imagen o video<input type="file" class="pm-ask-file" data-tipo="${tipo}" accept="image/*,video/*" style="display:none;"></label>
            <span class="pm-ask-prev" data-prev="${tipo}"></span>
            <button type="button" class="btn btn-solid btn-sm" data-pieza-crear="${tipo}" data-modo="actualizar">✏️ Actualizar prompt</button>
            <button type="button" class="btn btn-outline btn-sm" data-pieza-crear="${tipo}" data-modo="rehacer">🔄 Rehacer desde cero</button>
          </div>
        </div>
      </div>`;
  }
  return `<div class="pm-panel${abierto?' abierto':''}" data-panel="${tipo}"><div class="pm-panel-t">${PIEZAS[tipo].ico} ${PIEZAS[tipo].boton}</div>${cuerpo}</div>`;
}

// Módulo de piezas = parte del Jefe Productor de IA, en 3 pasos sencillos:
//  1) elegir qué crear (prompt de video, prompt de imagen, guion o caption), 2) si es visual, subir imágenes de referencia
//  (opcional; se guardan como el estilo de la marca) o saltar y seguir con la identidad que ya tiene, 3) generar.
const piezaSel = {}; // por campaña: la pieza elegida
const PIEZA_NOMBRE = { video:'Prompt video', imagen:'Prompt imagen', guion:'Guion video', whatsapp:'Caption WhatsApp' };
function pintarPiezas(item, modal){
  const box = (modal||postModalEl).querySelector('#pm-piezas');
  if(!box) return;
  const tiene = t=>piezaTieneContenido(item,t);
  const ORDEN = ['video','imagen','guion','whatsapp'];
  const sel = piezaSel[item.id] || '';
  const btn = t=>`<button type="button" class="pm-pbtn${tiene(t)?' activo':''}${sel===t?' sel':''}" data-pieza="${t}" aria-pressed="${sel===t?'true':'false'}">
      <span class="pm-pbtn-ico">${PIEZAS[t].ico}</span><span class="pm-pbtn-nom">${PIEZA_NOMBRE[t]}</span>
      <span class="pm-pbtn-est">${tiene(t) ? '✓ Listo' : '＋ Crear'}</span></button>`;
  let paso2 = '';
  if(sel){
    if(tiene(sel)){
      piezasAbiertas.add(item.id+':'+sel);
      paso2 = panelPieza(item, sel); // ya está lista: se ve, se copia y se puede actualizar
    }else{
      const visual = sel==='video' || sel==='imagen', conEstilo = !!estiloRef.guia;
      paso2 = `<div class="pm-paso">
        <div class="pm-paso-t">${PIEZAS[sel].ico} ${PIEZA_NOMBRE[sel]}</div>
        ${visual
          ? `<p class="pm-hint-inline">¿Tienes diseños que te gustan? Sube de 3 a 10 imágenes de referencia (opcional): se guardan como el estilo de tu marca y el Jefe Productor de IA las usa siempre. Si no, sigue con la identidad de tu marca que ya tiene.</p>
             ${conEstilo ? `<div class="pm-estilo"><span class="pm-estilo-thumbs">${estiloRef.imgs.slice(0,6).map(d=>`<img src="${d}" alt="">`).join('')}</span><label class="pm-estilo-chk"><input type="checkbox" data-usar-estilo${usarEstiloActivo()?' checked':''}> Usar mi estilo guardado</label></div>` : ''}`
          : '<p class="pm-hint-inline">Se crea con la identidad de tu marca (tu ADN y tu Sistema 366).</p>'}
        <div class="pm-paso-btns">
          ${visual ? `<button type="button" class="btn btn-outline" data-estilo-gestionar>📎 ${conEstilo ? 'Cambiar mis referencias' : 'Subir imágenes de referencia'}</button>` : ''}
          <button type="button" class="btn btn-solid" data-pieza-generar="${sel}">${visual ? (conEstilo && usarEstiloActivo() ? '✨ Generar con mi estilo guardado' : '⏭ Saltar y generar con mi identidad') : '✨ Generar con mi identidad'}</button>
        </div>
      </div>`;
    }
  }
  box.innerHTML = `
    <div class="pm-bloque-t">🤝 Estamos en contacto con el Jefe Productor de IA</div>
    <p class="pm-hint-inline pm-piezas-sub">Este bloque es parte del Jefe Productor de IA: crea las piezas de este anuncio con la identidad de tu marca y el estilo visual que tengas guardado. La IA solo se usa cuando pulsas “Generar”.</p>
    <div class="pm-q">¿Qué quieres crear?</div>
    <div class="pm-pieza-btns">${ORDEN.map(btn).join('')}</div>
    <div class="mode-status" id="pm-pieza-status"></div>
    ${paso2 ? `<div class="pm-paneles">${paso2}</div>` : ''}`;
  bindCardEvents(box);

  box.querySelectorAll('[data-pieza]').forEach(b=>b.addEventListener('click',()=>{
    const t = b.dataset.pieza;
    piezaSel[item.id] = piezaSel[item.id]===t ? '' : t; // elegir (o quitar) la pieza; no genera nada todavía
    pintarPiezas(item);
  }));
  box.querySelectorAll('[data-pieza-generar]').forEach(b=>b.addEventListener('click',()=>crearPieza(item, b.dataset.piezaGenerar, '', null, box)));
  box.querySelectorAll('[data-estilo-gestionar]').forEach(b=>b.addEventListener('click', abrirEstiloRef));
  box.querySelectorAll('[data-usar-estilo]').forEach(c=>c.addEventListener('change',()=>{ setUsarEstilo(c.checked); pintarPiezas(item); }));
  box.querySelectorAll('[data-ask-toggle]').forEach(b=>b.addEventListener('click',()=>{
    const a = box.querySelector('[data-ask="'+b.dataset.askToggle+'"]'); a.hidden = !a.hidden;
  }));
  box.querySelectorAll('.pm-ask-file').forEach(inp=>inp.addEventListener('change', async (e)=>{
    const f = e.target.files && e.target.files[0]; const t = e.target.dataset.tipo; e.target.value = '';
    const prev = box.querySelector('[data-prev="'+t+'"]');
    if(!f){ return; }
    prev.textContent = '⏳ Preparando…';
    try{
      const base64 = f.type.startsWith('video/') ? await videoFileAFotogramaJpegBase64(f, 1280) : await imagenFileAJpegBase64(f, 1280);
      piezaMaterial[t] = { nombre:f.name||'archivo', data:base64, esVideo:f.type.startsWith('video/') };
      prev.textContent = (piezaMaterial[t].esVideo?'🎞️ ':'🖼️ ') + piezaMaterial[t].nombre + (piezaMaterial[t].esVideo?' (un cuadro del video)':'');
    }catch(err){ piezaMaterial[t] = null; prev.textContent = '⚠️ No pude leer el archivo'; }
  }));
  box.querySelectorAll('[data-pieza-crear]').forEach(b=>b.addEventListener('click',()=>{
    const t = b.dataset.piezaCrear, modo = b.dataset.modo;
    const texto = box.querySelector('[data-ask="'+t+'"] .pm-ask-texto').value;
    if(modo==='rehacer' && !confirm('Se reemplazará tu prompt por uno nuevo hecho desde cero. ¿Continuar?')) return;
    // "Actualizar": la IA parte del prompt que ya tienes y aplica solo lo que pides cambiar.
    const actual = modo==='actualizar' ? (t==='video' ? item.prompt_video : item.prompt_imagen) : '';
    crearPieza(item, t, texto, piezaMaterial[t], box, actual);
  }));
  const copiarConAviso = (b, txt, avisoOk)=>{
    if(!txt) return;
    const antes = b.innerHTML;
    navigator.clipboard.writeText(txt).then(()=>{ b.innerHTML = avisoOk; setTimeout(()=>{ b.innerHTML = antes; },1800); });
  };
  box.querySelectorAll('[data-copiar-prompt]').forEach(b=>b.addEventListener('click',()=>{
    const t = b.dataset.copiarPrompt;
    copiarConAviso(b, (t==='video' ? item.prompt_video : item.prompt_imagen) || '', '✅ Copiado <span>pégalo en '+(t==='video'?'Gemini':'ChatGPT')+'</span>');
  }));
  box.querySelectorAll('[data-copiar-texto="guion"]').forEach(b=>b.addEventListener('click',()=>copiarConAviso(b, guionComoTexto(item), '✅ Guion copiado')));
}

async function crearPieza(item, tipo, texto, material, box, promptActual){
  const status = box.querySelector('#pm-pieza-status');
  const botones = box.querySelectorAll('.pm-pbtn,[data-pieza-crear],[data-pieza-generar],[data-estilo-gestionar]');
  botones.forEach(b=>b.disabled = true);
  status.textContent = '⏳ ' + PIEZAS[tipo].carga;
  try{
    const res = await fetch('/api/generar-anuncios', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        modo:'pieza', cliente: CLIENTE_ID, tipo,
        grupo_id: item.grupo_id || grupoId || '', producto_id: item.producto_id || productoId || '',
        card: {
          titulo:item.titulo, hook:item.hook, etapa:item.etapa, formato:item.formato, objetivo:item.objetivo, angulo:item.angulo,
          audiencia:item.audiencia, copy_publicacion:item.copy_publicacion, visual_sugerido:item.visual_sugerido,
          duracion_sugerida:item.duracion_sugerida, cta_boton:item.cta_boton, link_destino:item.link_destino,
          retroalimentacion:item.retroalimentacion, guion:item.guion,
        },
        texto: texto || '',
        usar_estilo: usarEstiloActivo(),
        prompt_actual: promptActual || '',
        imagenes: material ? [{ mediaType:'image/jpeg', data:material.data }] : [],
      }),
    });
    const raw = await res.text(); let data = null; try{ data = JSON.parse(raw); }catch(e){}
    if(!res.ok || !data){ const e = new Error((data && data.error) || (res.status===413 ? 'El archivo pesa mucho; prueba con uno más ligero.' : 'No se pudo crear la pieza.')); e.tope = res.status===402 || !!(data && data.tope); throw e; }
    Object.assign(item, data.pieza || {});
    piezasAbiertas.add(item.id+':'+tipo);
    piezaSel[item.id] = tipo;
    if(!item.guion) item.guion = {};
    scheduleCardsSave();
    piezaMaterial[tipo] = null;
    pintarPiezas(item);
    pintarPreviewPost(item);
  }catch(err){
    status.textContent = err.tope ? err.message : '⚠️ ' + (err.message || 'No se pudo crear la pieza.');
    botones.forEach(b=>b.disabled = false);
  }
}
