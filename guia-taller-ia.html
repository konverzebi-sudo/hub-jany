<!DOCTYPE html>
<html lang="es">
<head>

<title>Guía del taller · Tu primer asistente con IA · Jefes Hub</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-j-32.png">

<!--
  GUÍA DEL ALUMNO — Taller IA para tu negocio (BOCETO)
  Todo el contenido vive en el objeto CURSO al final del archivo:
  módulos → clases → etapas → prompts. Para otro taller solo se cambia CURSO.
  El progreso se guarda en el navegador de cada alumna/o.
-->
<style>
  :root {
    --bg: #0F0B16; --side: #0B0811; --card: #181120; --card-2: #211829;
    --lime: #BBF802; --lime-soft: #2F3D05; --ink: #0F0B16;
    --purple: #7B2FBE; --pink: #A65BE8;
    --text: #FFFFFF; --muted: #D6CFE0; --dim: #B6A9C7; --line: #332A3D;
    --sideW: 300px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body { background: var(--bg); color: var(--text); font: 16px/1.6 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: 'Sora', sans-serif; line-height: 1.15; letter-spacing: -.02em; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .lime { color: var(--lime); }

  /* ---------- LAYOUT ---------- */
  .app { display: grid; grid-template-columns: var(--sideW) 1fr; min-height: 100vh; }
  aside {
    position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side);
    border-right: 1px solid var(--line); padding: 22px 16px 30px; display: flex; flex-direction: column; gap: 18px;
  }
  .brand { font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: .06em; font-size: 15px; padding: 0 8px; }
  .brand span { color: var(--lime); }
  .brand small { display: block; margin-top: 4px; font-weight: 500; letter-spacing: .12em; font-size: 10px; color: var(--dim); text-transform: uppercase; }
  .search { position: relative; }
  .search input {
    width: 100%; padding: 11px 38px 11px 38px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-size: 14px; outline: none;
  }
  .search input:focus { border-color: var(--lime); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--dim); }
  .search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 500 11px 'JetBrains Mono', monospace; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .search-res { margin-top: 8px; display: none; flex-direction: column; gap: 2px; }
  .search-res.on { display: flex; }
  .search-res a { padding: 8px 10px; border-radius: 10px; font-size: 13px; color: var(--muted); }
  .search-res a:hover { background: var(--card); color: #fff; }
  .search-res a b { color: var(--lime); font-weight: 600; }
  .search-res .none { padding: 8px 10px; font-size: 13px; color: var(--dim); }

  .nav-home { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; font-weight: 600; font-size: 14px; border: 1px solid transparent; }
  .nav-home.on, .nav-item.on { background: var(--card); border-color: var(--lime); }
  .nav-home .ico { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; background: var(--lime); color: var(--ink); }
  .nav-mod { display: flex; align-items: center; gap: 8px; padding: 0 10px; margin-top: 6px; font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--pink); }
  .nav-item { display: grid; grid-template-columns: 34px 1fr 20px; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 12px; font-size: 14px; color: var(--muted); border: 1px solid transparent; }
  .nav-item:hover { background: var(--card); color: #fff; }
  .nav-item .n { font: 600 11px 'JetBrains Mono', monospace; color: var(--dim); background: rgba(255,255,255,.05); border-radius: 7px; padding: 3px 0; text-align: center; }
  .nav-item.on .n { background: var(--lime); color: var(--ink); }
  .nav-item .ok { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--lime); color: var(--ink); opacity: 0; }
  .nav-item.done .ok { opacity: 1; }
  .nav-item .ok svg { width: 11px; height: 11px; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 14px; border-top: 1px solid var(--line); }
  .side-foot a { padding: 8px 10px; border-radius: 10px; font-size: 13px; color: var(--dim); }
  .side-foot a:hover { color: #fff; background: var(--card); }

  /* ---------- TOPBAR ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 40px; background: rgba(15,11,22,.92); border-bottom: 1px solid var(--line); }
  .crumbs { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs b { color: #fff; font-weight: 600; }
  .top-actions { display: flex; gap: 8px; flex: none; }
  .chip-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); color: var(--muted); }
  .chip-btn:hover { border-color: var(--lime); color: #fff; }
  .chip-btn.solid { background: var(--lime); color: var(--ink); border-color: var(--lime); }
  .menu-btn { display: none; }
  main { min-width: 0; }
  .view { max-width: 1040px; margin: 0 auto; padding: 36px 40px 90px; }

  /* ---------- COMUNES ---------- */
  .eyebrow { display: inline-flex; gap: 8px; font: 500 12px 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--lime); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
  .eyebrow::before { content: "//"; color: var(--pink); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 26px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; border-radius: 999px; background: var(--lime); color: var(--ink); font: 700 15px 'Sora', sans-serif; }
  .btn.ghost { background: transparent; color: #fff; border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--lime); }
  .btn svg { width: 18px; height: 18px; }
  .sec-title { display: flex; align-items: center; gap: 12px; margin: 48px 0 18px; }
  .sec-title .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--lime-soft); color: var(--lime); flex: none; }
  .sec-title h2 { font-size: 24px; }
  .sec-title p { color: var(--dim); font-size: 14px; }

  /* ---------- INICIO ---------- */
  .hero { position: relative; overflow: hidden; border-radius: 28px; padding: 46px; background: radial-gradient(ellipse at 85% 10%, rgba(123,47,190,.55), transparent 55%), linear-gradient(160deg, #1e1530, var(--card)); border: 1px solid var(--line); }
  .hero h1 { font-size: clamp(34px, 5vw, 56px); margin: 18px 0 14px; max-width: 640px; }
  .hero p { color: var(--muted); max-width: 560px; font-size: 17px; }
  .hero .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .stats { display: flex; gap: 36px; margin-top: 30px; flex-wrap: wrap; }
  .stats b { display: block; font: 800 30px 'Sora', sans-serif; color: var(--lime); }
  .stats small { color: var(--dim); font-size: 13px; }
  .progress-card { display: flex; align-items: center; gap: 18px; margin-top: 18px; }
  .ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--lime) calc(var(--p) * 1%), var(--line) 0); }
  .ring span { width: 50px; height: 50px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font: 700 13px 'JetBrains Mono', monospace; }
  .progress-card .txt { flex: 1; }
  .progress-card .txt small { display: block; color: var(--dim); font-size: 13px; }
  .steps4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  /* Llamar la atención sobre el brief del Pre */
  @keyframes latido { 0%, 100% { box-shadow: 0 0 0 0 rgba(187,248,2,.55); transform: scale(1); } 50% { box-shadow: 0 0 0 12px rgba(187,248,2,0); transform: scale(1.025); } }
  .btn-latido { animation: latido 1.8s ease-in-out infinite; }
  main .step4.destacado, main .class-card.destacado { background: var(--lime) !important; border-color: var(--lime) !important; animation: latido 2s ease-in-out infinite; }
  main .step4.destacado h3, main .step4.destacado p, main .class-card.destacado h4, main .class-card.destacado p, main .class-card.destacado .meta, main .class-card.destacado .lab { color: var(--ink) !important; }
  main .step4.destacado .num { background: var(--ink); color: var(--lime); }
  @media (prefers-reduced-motion: reduce) { .btn-latido, main .step4.destacado, main .class-card.destacado { animation: none; } }
  .step4 { position: relative; padding: 22px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
  .step4 .num { font: 700 12px 'JetBrains Mono', monospace; color: var(--ink); background: var(--lime); padding: 3px 9px; border-radius: 999px; }
  .step4 .big { font-size: 34px; margin: 14px 0 6px; }
  .step4 h3 { font-size: 18px; margin-bottom: 6px; }
  .step4 p { color: var(--dim); font-size: 14px; }
  .path { display: flex; flex-direction: column; gap: 16px; }
  .mod { padding: 22px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); }
  .mod-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .mod-head .ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: var(--card-2); border: 1px solid var(--line); flex: none; }
  .mod-head small { font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .1em; color: var(--pink); text-transform: uppercase; }
  .mod-head h3 { font-size: 19px; }
  .mod-head .cnt { margin-left: auto; font: 600 12px 'JetBrains Mono', monospace; color: var(--lime); background: var(--lime-soft); padding: 4px 10px; border-radius: 999px; }
  .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .class-card { display: block; padding: 18px; border-radius: 16px; background: var(--card-2); border: 1px solid var(--line); transition: border-color .2s, transform .2s; }
  .class-card:hover { border-color: var(--lime); transform: translateY(-2px); }
  .class-card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .class-card .lab { font: 600 11px 'JetBrains Mono', monospace; color: var(--lime); letter-spacing: .08em; }
  .class-card .badge { font: 600 11px 'JetBrains Mono', monospace; padding: 2px 9px; border-radius: 999px; background: var(--lime); color: var(--ink); display: none; }
  .class-card.done .badge { display: inline-block; }
  .class-card h4 { font: 700 16px 'Sora', sans-serif; margin-bottom: 6px; }
  .class-card p { color: var(--dim); font-size: 13.5px; }
  .class-card .meta { margin-top: 10px; font-size: 12px; color: var(--dim); }

  /* ---------- CLASE ---------- */
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font: 600 12px 'JetBrains Mono', monospace; padding: 5px 12px; border-radius: 999px; background: var(--lime); color: var(--ink); }
  .tag.soft { background: rgba(255,255,255,.05); color: var(--pink); border: 1px solid var(--line); }
  .class-head.vivo { position: sticky; top: 70px; z-index: 15; background: #FAF8FD; padding: 12px 0 14px; margin-top: 4px; border-bottom: 1px solid #E6DDF2; grid-template-columns: 1fr minmax(300px, 46%); gap: 22px; }
  .class-head.vivo h1 { font-size: 40px; margin-bottom: 6px; } .class-head.vivo .sub { font-size: 15px; }
  .cover-vivo { aspect-ratio: 16 / 9; padding: 0; background: #0F0B16; }
  .cover-vivo { position: relative; }
  /* Reacciones tipo historias: un solo botón y lluvia de emojis de dinero */
  .vivo-react { position: absolute; left: 10px; bottom: 10px; z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #C9F507; background: rgba(15,11,22,.8); font-size: 22px; line-height: 1; cursor: pointer; box-shadow: 0 0 14px rgba(201,245,7,.45); transition: transform .12s; }
  .vivo-react:active { transform: scale(.88); }
  .reac-capa { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; border-radius: inherit; }
  .reac { position: absolute; bottom: -10%; line-height: 1; animation: reacSube var(--d, 2.6s) ease-out forwards; }
  @keyframes reacSube { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 12% { opacity: 1; transform: translate(calc(var(--x) * .2), -12%) scale(1); } 60% { opacity: 1; } 100% { transform: translate(var(--x), calc(var(--h) * -1)) scale(1.15) rotate(var(--r)); opacity: 0; } }
  .vivo-btns { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
  .vivo-btns button { padding: 6px 12px; border: 0; border-radius: 99px; background: #C9F507; color: #0F0B16; font: 800 12px 'Sora', sans-serif; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .vivo-btns button:hover { filter: brightness(.95); }
  /* Modo grande (tipo "cine"): la diapositiva ocupa el ancho y sigue fija mientras bajan a las actividades */
  .class-head.vivo.grande { grid-template-columns: 1fr; gap: 8px; }
  .class-head.vivo.grande .sub, .class-head.vivo.grande .chips, .class-head.vivo.grande .class-actions { display: none; }
  .class-head.vivo.grande h1 { font-size: 22px; margin: 0; }
  .class-head.vivo.grande .cover-vivo { width: 100%; max-width: calc(50vh * 16 / 9); margin: 0 auto; }
  .vivo-frame { display: block; width: 100%; height: 100%; border: 0; }
  .class-head { display: grid; grid-template-columns: 1fr 300px; gap: 30px; align-items: center; margin-top: 16px; }
  .class-head h1 { font-size: 40px; margin-bottom: 10px; }
  .class-head .sub { color: var(--muted); font-size: 17px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .camp-arbol { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; }
  .camp-nodo { flex: 1 1 200px; display: grid; gap: 8px; padding: 14px; border-radius: 14px; background: var(--card-2, #FAF8FD); border: 1px solid var(--line, #E6DDF2); }
  .camp-nodo small { font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .1em; color: #7B2FBE; }
  .camp-nodo select, .camp-nodo input, .camp-nodo textarea { width: 100%; }
  .camp-nodo textarea { min-height: 90px; }
  .camp-ads { flex: 1 1 260px; display: grid; gap: 10px; }
  .nota-respaldo { margin-top: 14px; border-left: 4px solid #BBF802; display: grid; gap: 8px; }
  .ideas-list { display: grid; gap: 8px; }
  .idea-row { display: flex; gap: 10px; align-items: center; }
  .idea-row input[type=text] { flex: 1; min-width: 0; }
  .idea-row input[type=checkbox] { width: 18px; height: 18px; accent-color: #BBF802; flex: none; }
  .idea-n { font: 800 13px 'Sora', sans-serif; color: var(--muted); min-width: 18px; }
  .chips span { font-size: 13px; color: var(--muted); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.02); }
  .class-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .done-toggle { display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
  .done-toggle .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--dim); display: grid; place-items: center; }
  .done-toggle.on { border-color: var(--lime); }
  .vista-ctl { margin-top: 20px; display: grid; gap: 10px; }
  .vc-row { display: flex; flex-wrap: wrap; gap: 12px; }
  .vc-row label { display: grid; gap: 4px; min-width: 180px; }
  .vc-row select { width: auto; }
  body:has(.vista-box) .view { max-width: none; padding: 24px 28px 60px; }
  .vista-box { position: relative; height: 560px; min-height: 420px; background: #0F0B16; border-radius: 16px; overflow: hidden; margin-top: 16px; }
  /* En la vista del ponente, la presentación se queda pegada debajo de la barra fija mientras se baja la página */
  .vista-box.pegado { position: sticky; top: calc(var(--topH, 76px) + var(--avisoH, 70px) + 12px); z-index: 10; height: 560px; min-height: 300px; box-shadow: 0 8px 24px rgba(15,11,22,.25); }
  .vista-box.tam-mini { height: 260px !important; min-height: 0 !important; }
  .tam-grupo { position: absolute; right: 12px; top: 12px; z-index: 6; display: inline-flex; gap: 4px; padding: 4px; border-radius: 99px; background: rgba(15,11,22,.75); }
  .tam-grupo button { border: 0; background: transparent; color: #fff; font: 700 12px 'Sora', sans-serif; padding: 6px 10px; border-radius: 99px; cursor: pointer; }
  .tam-grupo button.on { background: #BBF802; color: #0F0B16; }
  .vi { position: absolute; inset: 0; transition: opacity .2s; }
  .vi iframe { width: 100%; height: 100%; border: 0; display: block; background: #0F0B16; }
  .vi.grande { z-index: 1; }
  .vi.chico { z-index: 2; left: auto; top: auto; right: 14px; bottom: 14px; width: min(34%, 320px); aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; border: 2px solid #BBF802; }
  .vi.oculto { visibility: hidden; opacity: 0; pointer-events: none; }
  .vi .zoom-vivo { height: 100%; min-height: 0; border-radius: 0; } /* el Zoom se ajusta al cuadro (grande o cuadrito), sin altura mínima que lo corte */
  .vs-fila { display: grid; gap: 6px; }
  .vs-botones { display: flex; flex-wrap: wrap; gap: 8px; }
  .vs-filas { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-start; }
  .vs-filas > .vs-fila { flex: 1 1 auto; }
  .vs-btn.vs-solo { min-width: 0; padding: 8px 12px; }
  @media (min-width: 760px) { .vs-filas { flex-wrap: nowrap; } }
  .vs-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 96px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--card-2, #FAF8FD); cursor: pointer; font: 600 12px 'Inter', sans-serif; }
  .vs-ico { font-size: 22px; line-height: 1; }
  .vs-btn.on { background: #BBF802; border-color: #9CCB00; color: #0F0B16; }
  .ej-sel { display: grid; gap: 6px; } .ej-sel.oculto-ej { display: none; }
  .ej-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ej-chip { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: #fff; cursor: pointer; font: 800 12px 'Sora', sans-serif; }
  .ej-chip.on { background: #BBF802; }
  .pp-dos { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 20px; }
  .pp-dos > .card { margin-top: 0; }
  .lt { margin-top: 26px; padding: 30px 34px 24px; }
  .lt > .eyebrow { display: inline-block; margin-bottom: 30px; }
  .lt-item { position: relative; padding: 0 0 46px 56px; }
  .lt-item::before { content: ''; position: absolute; left: 14px; top: 36px; bottom: 0; border-left: 2px dotted #1B1530; }
  .lt-item:last-child::before { display: none; }
  .lt-nodo { position: absolute; left: 0; top: 4px; width: 30px; height: 30px; border-radius: 50%; background: #BBF802; border: 3px solid #111; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .lt-nodo[data-lock] { cursor: pointer; }
  .lt-nodo.cerrada { background: #111; border-color: #BBF802; }
  .lt-eb { font: 700 12px 'Inter', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #6B6480; }
  .lt-tit { font: 800 26px/1.1 'Sora', sans-serif; margin: 6px 0 8px; color: #111; }
  .lt-txt { color: #4a4560; margin: 0 0 8px; }
  .lt-din { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .lt-nums { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .lt-num { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #c9bfe0; background: #fff; color: #1B1530; font: 700 12px 'Sora', sans-serif; cursor: pointer; }
  .lt-num:hover, .lt-num:focus-visible { background: #BBF802; border-color: #BBF802; }
  .lt-tog { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; color: #111; text-align: left; }

ficamente para su geometría, materiales y componentes, pero todos deben conservar el mismo estilo cinematográfico de descomposición y reconstrucción 3D.\nGenera el video directamente. No me entregues una imagen estática ni otro prompt."

  "prompt": "Usa la imagen del producto que adjunto como referencia visual obligatoria. Crea un video publicitario cinematográfico de aproximadamente 6 a 8 segundos, replicando el concepto de la referencia:\nSECUENCIA DE ANIMACIÓN\nESCENA 1 — EXPECTATIVA\nUn vehículo de carga avanza por una carretera urbana transportando una gran cantidad de cajas que contienen el producto de referencia. La cámara observa la escena desde un puente elevado, con una perspectiva cinematográfica y profundidad de campo.\nESCENA 2 — EXPLOSIÓN DE PRODUCTOS\nAl pasar debajo del puente, la carga se abre repentinamente y las cajas se rompen. Decenas de unidades del producto salen disparadas hacia el aire en una explosión visual espectacular. Los objetos vuelan en diferentes direcciones, con movimientos físicos realistas, fragmentos de empaque y partículas suspendidas.\nESCENA 3 — PRODUCTO PROTAGONISTA\nEn medio del movimiento, la cámara cambia el enfoque y sigue una unidad del producto. Esta avanza hacia el espectador y queda flotando en el centro de la imagen, perfectamente enfocada, mientras los demás productos y fragmentos continúan moviéndose detrás, desenfocados y en cámara lenta.\nESCENA 4 — HERO SHOT\nEl producto protagonista permanece suspendido en el aire. La cámara realiza un acercamiento cinematográfico para mostrar sus detalles, materiales, forma y diseño. El movimiento termina con una toma publicitaria impactante del producto.\nREGLAS IMPORTANTES\n\n* El producto debe ser exactamente el de la fotografía que adjunto.\n* Respeta su forma, proporciones, colores, empaque, logotipo y detalles.\n* No inventes marcas ni cambies el diseño.\n* Las unidades que vuelan deben ser copias fieles del producto original.\n* Movimiento realista, gravedad, inercia y cámara lenta.\n* Estética de publicidad comercial de alto presupuesto.\n* Iluminación cinematográfica y profundidad de campo.\n* Formato vertical 9:16.\n* Sin textos, subtítulos, marcas de agua ni elementos gráficos añadidos.\n\nOBJETIV   "prompt": "VIDEO PUBLICITARIO CINEMATOGRÁFICO — THE SHOPPING CART\nActúa como director creativo, director de fotografía y especialista en producción de comerciales publicitarios de marcas internacionales.\nTu trabajo es crear un video publicitario hiperrealista, cinematográfico y visualmente impactante utilizando ÚNICAMENTE la fotografía del producto que adjunto como referencia.\nDebes crear toda la escena, el personaje, el supermercado, la animación, los movimientos de cámara y la interacción con el producto.\nNo me hagas preguntas. Toma todas las decisiones creativas necesarias para producir el video.\n\n1. PERSONAJE PRINCIPAL — MODELO EXCLUSIVO\n\nCrea un personaje masculino adulto joven, de aproximadamente 30 años.\nCARACTERÍSTICAS FÍSICAS:\n* Apariencia mediterránea.\n* Piel clara, tono cálido.\n* Cabello oscuro, abundante, ligeramente ondulado y peinado hacia atrás.\n* Rostro masculino de facciones definidas.\n* Mandíbula marcada.\n* Nariz recta.\n* Barba corta, perfectamente arreglada.\n* Cejas oscuras y definidas.\n* Complexión atlética y proporcionada.\n* Altura aproximada de 1.82 metros.\n\nVESTUARIO:\n* Traje sastre beige claro, corte moderno y elegante.\n* Suéter negro de cuello alto.\n* Lentes de sol negros de diseño contemporáneo.\n* Pañuelo negro discreto en el bolsillo del saco.\n* Reloj metálico elegante.\n* Tenis blancos premium, minimalistas.\n\nPERSONALIDAD Y ACTITUD:\nDebe transmitir sofisticación, seguridad, estilo y personalidad.\nSu apariencia debe recordar a un modelo masculino de una campaña internacional de moda y lifestyle.\nSu expresión es segura y natural. Camina con tranquilidad, sin exagerar sus movimientos.\nIMPORTANTE: Este personaje debe conservar exactamente la misma apariencia durante todas las escenas. No cambiar su rostro, cabello, barba, complexión ni vestuario.\n\n2. LOCACIÓN — SUPERMERCADO PREMIUM\nEl escenario es un supermercado moderno, amplio y sofisticado.\nCaracterísticas:\n* Pasillos amplios.\n* Estanterías blancas y metálicas.\n* Productos organizados en los estantes.\n* Iluminación blanca de techo.\n* Piso brillante y limpio.\n* Arquitectura comercial contemporánea.\n* Ambiente realista de supermercado de alta gama.\n\nLa escena debe parecer grabada en un supermercado real, no en un escenario artificial.\n\n3. CÁMARA — PERSPECTIVA DEL CARRITO\nEsta es la característica visual más importante de todo el comercial.\nLa cámara está colocada DENTRO de un carrito de supermercado, en la parte inferior de la canasta, apuntando hacia arriba.\nLa cámara observa al hombre desde el interior del carrito.\nCARACTERÍSTICAS DE CÁMARA:\n* Lente ultra gran angular de aproximadamente 14 mm.\n* Perspectiva contrapicada extrema.\n* Distorsión natural de lente gran angular.\n* Estructura metálica del carrito visible en primer plano.\n* Rejillas metálicas rodeando los bordes del encuadre.\n* Parte del techo del supermercado visible al fondo.\n* El personaje ocupa la zona central y superior del encuadre.\n\nLa cámara permanece dentro del carrito durante toda la secuencia.\nNo utilizar tomas externas del personaje ni cambiar a una perspectiva convencional.\n\n4. ANIMACIÓN Y SECUENCIA DEL VIDEO\nDURACIÓN TOTAL: 10 SEGUNDOS.\nFORMATO: Vertical 9:16.\n\nESCENA 1 — ENTRADA DEL PERSONAJE\nSEGUNDOS 0-2\nEl hombre aparece caminando por el pasillo del supermercado mientras empuja un carrito de compras.\nLa cámara se encuentra dentro de la canasta.\nEl personaje se acerca progresivamente.\nSus manos sujetan el manubrio del carrito.\nSe observa su traje beige, su suéter negro y sus lentes oscuros.\nLa cámara tiene un movimiento sutil producido por el desplazamiento del carrito.\nLa iluminación es cinematográfica y realista.\n\nESCENA 2 — DESCUBRIMIENTO DEL PRODUCTO\nSEGUNDOS 2-4\nEl hombre se detiene frente a un estante donde se encuentra el producto del cliente.\nMira hacia el estante y extiende naturalmente su mano.\nToma una unidad del producto.\nLa cámara sigue dentro del carrito, observando la acción desde abajo.\nEl producto debe ser perfectamente reconocible.\n\nESCENA 3 — EL PRODUCTO ENTRA AL CARRITO\nSEGUNDOS 4-7\nEl personaje coloca el producto dentro del carrito, acercándolo hacia la cámara.\nDespués toma otras unidades y comienza a llenar el carrito.\nLa animación debe mostrar:\n* Movimiento natural de brazos y manos.\n* Agarre realista del empaque.\n* Movimiento físico del producto.\n* Contacto realista entre el producto y la estructura del carrito.\n* Perspectiva y profundidad naturales.\nLos productos comienzan a acumularse dentro de la canasta.\nEl empaque debe conservar siempre su apariencia original.\n\nESCENA 4 — PRODUCTO PROTAGONISTA\nSEGUNDOS 7-10\nEl hombre coloca una última unidad del producto cerca de la cámara.\nEl producto se acerca al lente y ocupa progresivamente una parte importante del encuadre.\nSe genera una composición visual publicitaria donde el producto queda en primer plano y el hombre aparece al fondo, ligeramente desenfocado.\nTermina con una toma cinematográfica del producto dentro del carrito.\nEl último fotograma debe ser visualmente impactante y permitir identificar claramente el producto.\n\n5. REGLAS DE FIDELIDAD DEL PRODUCTO\nLa fotografía adjunta es la ÚNICA referencia para determinar qué producto se está anunciando.\nDebes reproducir fielmente:\n* Forma física.\n* Envase o empaque.\n* Colores originales.\n* Logotipo.\n* Nombre comercial.\n* Etiquetas.\n* Tipografía del empaque.\n* Proporciones.\n* Materiales y acabados.\n\nNO inventes otra marca.\nNO cambies el diseño.\nNO agregues etiquetas.\nNO sustituyas el producto por otro similar.\nNO inventes información comercial ni beneficios.\nSi el producto es una botella, conserva su forma y tapa.\nSi es una bolsa, conserva sus pliegues y dimensiones.\nSi es una caja, conserva su estructura.\nSi es un frasco, conserva su geometría y tapa.\nAdapta automáticamente el movimiento de las manos a la forma y tamaño del producto.\nGenera varias unidades idénticas del producto original cuando sea necesario llenar el carrito.\n\n6. DIRECCIÓN CINEMATOGRÁFICA\nEstética de campaña publicitaria internacional.\nCaracterísticas:\n* Hiperrealismo fotográfico.\n* Calidad cinematográfica premium.\n* Iluminación comercial profesional.\n* Profundidad de campo realista.\n* Texturas detalladas.\n* Reflejos naturales.\n* Movimiento fluido.\n* Física realista.\n* Anatomía humana correcta.\n* Manos y dedos naturales.\n* Movimiento de cámara estabilizado, con vibración sutil del carrito.\n* Enfoque dinámico entre personaje y producto.\n\nEl resultado debe sentirse como un comercial producido por una agencia creativa de primer nivel.\n\n7. RESTRICCIONES\nNo utilizar caricaturas.\nNo generar animación tipo videojuego.\nNo cambiar el personaje durante el video.\nNo deformar el rostro.\nNo generar manos adicionales.\nNo deformar los productos.\nNo inventar marcas.\nNo agregar textos flotantes.\nNo agregar subtítulos.\nNo agregar marcas de agua.\nNo cambiar la perspectiva de cámara.\nNo mostrar tomas externas del carrito.\nNo utilizar transiciones artificiales.\n\n8. ENTREGA FINAL\nGenera directamente el video terminado.\nFormato vertical 9:16.\nDuración objetivo de 10 segundos.\nCalidad máxima disponible.\nEl resultado debe ser un comercial cinematográfico donde un modelo masculino sofisticado llena su carrito de supermercado con el producto proporcionado por el cliente.\nEL PRODUCTO DEL CLIENTE ES EL PROTAGONISTA.\nEL PERSONAJE ES EL MODELO DE LA CAMPAÑA.\nLA CÁMARA ESTÁ DENTRO DEL CARRITO.\nNo entregues un storyboard, una descripción ni una serie de fotografías. Genera el video animado completo."
