function getField(item, field){
  if(field.indexOf('guion.')===0) return (item.guion||{})[field.slice(6)];
  if(field==='hooks_alternativos') return (item.hooks_alternativos||[]).join('\n');
  return item[field];
}
function setField(item, field, value){
  if(field.indexOf('guion.')===0){ if(!item.guion) item.guion={}; item.guion[field.slice(6)]=value; return; }
  if(field==='hooks_alternativos'){ item.hooks_alternativos = value.split('\n').map(s=>s.trim()).filter(Boolean); return; }
  item[field]=value;
}

function bindCardEvents(container){
  container.querySelectorAll('select.estado-select').forEach(sel=>{
    sel.addEventListener('change',(e)=>{
      const item = cards.find(c=>c.id===e.target.dataset.id);
      if(!item) return;
      item.estado = e.target.value;
      scheduleCardsSave();
      render();
    });
  });
  container.querySelectorAll('.fecha-input,.hora-input,.gancho-input,.detail-field textarea,.detail-field input[type=text],.detail-field select').forEach(inp=>{
    if(inp.tagName==='TEXTAREA') autoGrow(inp);
    inp.addEventListener('input',(e)=>{
      if(inp.tagName==='TEXTAREA') autoGrow(inp);
      const item = cards.find(c=>c.id===e.target.dataset.id);
      if(!item) return;
      setField(item, e.target.dataset.field, e.target.value);
      scheduleCardsSave();
    });
  });
  container.querySelectorAll('.item-del').forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.preventDefault();
      if(!confirm('¿Eliminar esta campaña? No se puede deshacer.')) return;
      cards = cards.filter(c=>c.id!==btn.dataset.id);
      document.getElementById('count-cards').textContent = cards.length;
      scheduleCardsSave();
      render();
    });
  });
  container.querySelectorAll('.copy-field-btn').forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.preventDefault();
      const item = cards.find(c=>c.id===btn.dataset.id);
      if(!item) return;
      const value = getField(item, btn.dataset.copyTarget) || '';
      navigator.clipboard.writeText(value).then(()=>{
        const prev = btn.innerHTML;
        btn.textContent = btn.classList.contains('copy-ic') ? '✅' : '✅ Copiado';
        setTimeout(()=>{ btn.innerHTML = prev; },1500);
      });
    });
  });
}

// producto con el que se venía trabajando. Aquí se llenan los módulos del Generador (grupo, producto,
// 1 idea por etapa) y arranca la guía. Se consume una sola vez.
function leerLlegada366(){
  try{
    const raw=localStorage.getItem('jefeshub_366_a_anuncios');
    if(!raw) return null;
    localStorage.removeItem('jefeshub_366_a_anuncios');
    const d=JSON.parse(raw);
    if(!d || d.cliente!==CLIENTE_ID || Date.now()-(d.ts||0)>30*60*1000) return null;
    return d;
  }catch(e){ return null; }
}
const normNombre=(s)=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
function aplicarLlegada366(d){
  cantidadPorEtapa=1; cantidadElegida=false;
  anguloIdx=''; anguloElegido=false;
  const grupo=grupos.find(g=>g.id===d.grupo_id) || grupos.find(g=>normNombre(g.nombre)===normNombre(d.grupo_nombre));
  grupoId=grupo?grupo.id:'';
  const n=normNombre(d.producto_nombre);
  const delGrupo=productos.filter(p=>p&&p.nombre&&(!grupoId||p.grupo_id===grupoId));
  const prod=n?(delGrupo.find(p=>normNombre(p.nombre)===n)||delGrupo.find(p=>normNombre(p.nombre).includes(n)||n.includes(normNombre(p.nombre)))):null;
  productoId=prod?prod.id:'';
  productoNombre=d.producto_nombre||'';
  productoTexto=d.producto_texto||'';
}

let tut = null; const tutEls = {};
function tutVisto(){ try{ return localStorage.getItem(TUT_KEY)==='1'; }catch(e){ return false; } }
function tutEl(p){
  const sels = [].concat(p.selector || []);
  for(const sel of sels){
    let n = null; try{ n = document.querySelector(sel); }catch(e){}
    if(n && (n.offsetWidth || n.offsetHeight || n.getClientRects().length)) return n;
  }
  return null;
}
function tutLimpiar(){
  ['ov','hl','card'].forEach(k=>{ if(tutEls[k] && tutEls[k].parentNode) tutEls[k].parentNode.removeChild(tutEls[k]); tutEls[k] = null; });
  window.removeEventListener('resize', tutUbicar);
  window.removeEventListener('scroll', tutUbicar, true);
  document.removeEventListener('keydown', tutTecla);
  tut = null;
}
function tutCerrar(){ try{ localStorage.setItem(TUT_KEY, '1'); }catch(e){} tutLimpiar(); }
function tutTecla(e){ if(e.key==='Escape') tutCerrar(); }
function tutIniciar(){
  document.querySelectorAll('.ay-overlay').forEach(x=>x.remove());
  tutLimpiar();
  tutEls.ov = document.createElement('div'); tutEls.ov.className = 'tt-ov dim';
  tutEls.hl = document.createElement('div'); tutEls.hl.className = 'tt-hl'; tutEls.hl.style.display = 'none';
  tutEls.card = document.createElement('div'); tutEls.card.className = 'tt-card'; tutEls.card.setAttribute('role','dialog');
  document.body.append(tutEls.ov, tutEls.hl, tutEls.card);
  tut = { i:0, token:0 };
  window.addEventListener('resize', tutUbicar);
  window.addEventListener('scroll', tutUbicar, true);
  document.addEventListener('keydown', tutTecla);
  tutMostrar(0);
}
async function tutMostrar(i){
  if(!tut) return;
  const token = ++tut.token; tut.i = i;
  const p = TUT_PASOS[i];
  if(chatAbierto) chatAbrir(false);
  if(p.tab && currentTab!==p.tab){ irATab(p.tab); await new Promise(r=>setTimeout(r,180)); if(!tut || tut.token!==token) return; }
  const n = tutEl(p);
  if(n){
    n.scrollIntoView({ block:'center', behavior:'auto' });
    if(window.innerWidth<700){ const r = n.getBoundingClientRect(); if(r.bottom > window.innerHeight*0.45 && r.height < window.innerHeight*0.4) window.scrollBy(0, r.top-130); }
  }
  tutPintar(p, i);
  setTimeout(tutUbicar, 60);
}
function tutPintar(p, i){
  const texto = typeof p.texto==='function' ? p.texto() : p.texto;
  const prog = TUT_FASES.map((f,k)=>`<span class="tt-fase${k+1===p.fase?' on':(k+1<p.fase?' ok':'')}" title="${escHtml(f)}"><i>${k+1<p.fase?'✓':k+1}</i><span>${escHtml(f)}</span></span>`).join('');
  const url = p.video ? (TUT_VIDEOS[p.video]||'') : '';
  const video = p.video ? (url
    ? `<div class="tt-video">🎬 <a href="${escHtml(url)}" target="_blank" rel="noopener">Ver el video de este paso ↗</a></div>`
    : '<div class="tt-video">🎬 Aquí va el video de este paso (próximamente). Por ahora, esta guía te explica lo mismo.</div>') : '';
  const ultimo = i === TUT_PASOS.length-1;
  tutEls.card.innerHTML = `<div class="tt-prog">${prog}</div><h4>${escHtml(p.titulo)}</h4>${p.visual ? TUT_VISUAL[p.visual] : ''}<p>${escHtml(texto)}</p>${video}
    <div class="tt-row"><button type="button" class="tt-skip" data-tt="cerrar">Cerrar</button><span class="tt-sp"></span>
    <button type="button" class="tt-btn sec" data-tt="atras"${i===0?' disabled':''}>← Atrás</button>
    <button type="button" class="tt-btn" data-tt="sig">${ultimo?'¡Listo! ✓':'Siguiente →'}</button></div>`;
  tutEls.card.querySelector('[data-tt="cerrar"]').onclick = tutCerrar;
  tutEls.card.querySelector('[data-tt="atras"]').onclick = ()=>tutMostrar(tut.i-1);
  tutEls.card.querySelector('[data-tt="sig"]').onclick = ()=>{ if(ultimo) tutCerrar(); else tutMostrar(tut.i+1); };
}
function tutUbicar(){
  if(!tut || !tutEls.card) return;
  const p = TUT_PASOS[tut.i]; const n = tutEl(p);
  const c = tutEls.card, hl = tutEls.hl, vw = window.innerWidth, vh = window.innerHeight;
  const cw = c.offsetWidth, ch = c.offsetHeight;
  if(!n){
    hl.style.display = 'none'; tutEls.ov.classList.add('dim');
    c.style.left = Math.max(12,(vw-cw)/2)+'px'; c.style.top = Math.max(10,(vh-ch)/2)+'px';
    return;
  }
  hl.style.display = ''; tutEls.ov.classList.remove('dim');
  const r = n.getBoundingClientRect(), pad = 6;
  hl.style.top = (r.top-pad)+'px'; hl.style.left = (r.left-pad)+'px';
  hl.style.width = (r.width+pad*2)+'px'; hl.style.height = (r.height+pad*2)+'px';
  let top = r.bottom + pad + 12;
  if(top+ch > vh-10) top = r.top - pad - 12 - ch;
  if(top < 10) top = Math.max(10, vh-ch-10);
  c.style.top = top+'px';
  c.style.left = Math.min(Math.max(12, r.left), vw-cw-12)+'px';
}
const ttLogo = document.getElementById('tt-abrir');
ttLogo.addEventListener('click', tutIniciar);
ttLogo.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); tutIniciar(); } });

// ─── FOCO (pastilla de arriba: ecosistema completo / un grupo / un producto) ──────────────────
// Es la misma pastilla de Jefe de Finanzas. Lo elegido manda en todo el Jefe: el chat, las ideas, el
// detalle, el targeting y las campañas nuevas usan grupoId/productoId, que el servidor convierte en
// la información de ese producto o grupo.
function focoDeEstado(){ return productoId ? productoId : (grupoId ? 'g:'+grupoId : 'all'); }
function sincronizarFoco(){
  if(window.__foco && window.__foco.get().id !== focoDeEstado()) window.__foco.set(focoDeEstado());
}
function aplicarFocoAEstado(f){
  const nuevoG = f.grupoId||'', nuevoP = f.productoId||'';
  if(nuevoG===grupoId && nuevoP===productoId) return false;
  grupoId = nuevoG; productoId = nuevoP; productoNombre = ''; productoTexto = '';
  return true;
}

cargarInicial().then(async ()=>{
  const llegada=leerLlegada366();
  try{ if(window.__foco) await window.__foco.ready; }catch(e){}
  // Las ofertas de Producto 366 que aún no están en el catálogo del ADN también se pueden elegir.
  if(window.__foco) window.__foco.lista().forEach(p=>{ if(p.origen366 && !productos.some(x=>x&&x.id===p.id)) productos.push(p); });
  if(window.__foco) aplicarFocoAEstado(window.__foco.get());
  if(llegada){ aplicarLlegada366(llegada); sincronizarFoco(); }
  await cargarChatPersistido(false);
  if(window.__foco) window.__foco.onChange(f=>{ if(aplicarFocoAEstado(f)) render(); });
  pintarIconos();
  vigilarBarraLinks();
  irATab('generador'); // el chat ya no es lo primero: se abre directo en el Generador con IA
  if(llegada || !tutVisto()) setTimeout(tutIniciar, 900);
});
