parcialmente oculto o insinuado, generando expectativa sobre lo que está por llegar.\nNo inventes otro producto ni alteres su identidad.\nESTILO FOTOGRÁFICO\n\n* Fotografía publicitaria hiperrealista.\n* Iluminación cinematográfica.\n* Contraste alto.\n* Sombras profundas.\n* Texturas realistas de cartón.\n* Luz cenital concentrada.\n* Estética premium y minimalista.\n* Composición elegante y misteriosa.\n\nREGLAS\nNo agregues marcas inventadas, textos adicionales, productos diferentes ni elementos decorativos innecesarios.\nNo deformes mi logotipo.\nNo copies los colores de la referencia si son diferentes a los de mi marca: adapta la composición a mi identidad visual.\nFORMATO FINAL: vertical 4:5, alta resolución, listo para redes sociales.\nEl resultado debe parecer una campaña profesional de expectativa previa al lanzamiento de mi producto."},
 {"n": "08", "nombre": "Máquina de garra", "desc": "Tus productos dentro de una máquina de garra verde neón, con uno atrapado por la garra. Ideal si tienes varios modelos.", "img": "img/estilos/08-maquina-de-garra.webp", "fotos": 2, "fotosTxt": "Sube la foto base + una o varias fotos de tus productos", "pasos": "<li>Descarga la foto base.</li><li>En ChatGPT sube primero la foto base y después las fotos de tus productos (una o varias).</li>", "prompt": "PROMPT MAESTRO — PRODUCTOS EN MÁQUINA DE GARRA\nActúa como director de arte especializado en publicidad comercial, fotografía de producto y renders 3D hiperrealistas.\nPrimero voy a subir la imagen de referencia y después una o varias fotografías de mis productos. Tu trabajo es integrarlos dentro de una máquina arcade de garra, siguiendo el estilo visual de la imagen de referencia.\n1. CONSERVAR LOS PRODUCTOS ORIGINALES\n\n* Utiliza exactamente los productos que te voy a proporcionar.\n* Respeta sus diseños, colores, empaques, logotipos, etiquetas, nombres y tipografías.\n* No inventes marcas ni sustituyas mis productos por otros.\n* No modifiques las proporciones ni deformes los productos.\n* Si subo varios modelos, incluye todos los que sea posible de forma clara.\n\n2. COMPOSICIÓN DE LA ESCENA\n\n* Una máquina arcade de garra de color verde neón intenso (#C8F800).\n* Estructura metálica cromada y cristal transparente.\n* Una garra metálica en la parte superior sujetando uno de mis productos.\n* El producto sostenido por la garra debe ser el protagonista.\n* Los demás productos deben estar acomodados en la parte inferior, creando volumen y profundidad.\n* Distribuye los productos de manera atractiva, como una exhibición comercial.\n* Conserva sus cajas, estuches o empaques originales cuando los productos los incluyan.\n\n3. REALISMO Y PROPORCIONES\n\n* Respeta las dimensiones y proporciones reales de cada producto.\n* No hagas que los objetos parezcan juguetes si son productos de tamaño comercial.\n* Los productos deben tener dimensiones y materiales creíbles.\n* Evita duplicaciones artificiales, deformaciones o elementos flotantes.\n* La garra debe sujetar físicamente el producto de manera lógica.\n\n4. ESTILO VISUAL\n\n* Publicidad premium hiperrealista.\n* Render 3D de calidad comercial.\n* Iluminación cinematográfica.\n* Reflejos metálicos y cristales realistas.\n* Sombras naturales.\n* Colores intensos y vibrantes.\n* Estética tecnológica, moderna y llamativa.\n\n5. REGLAS IMPORTANTES\n\n* No cambies el diseño de la máquina.\n* No cambies el color verde neón.\n* No agregues marcas inventadas.\n* No agregues textos publicitarios.\n* No elimines los empaques originales.\n* No conviertas los productos en ilustraciones.\n* La máquina debe mantener siempre la misma identidad visual.\n\nRESULTADO:\nUna fotografía publicitaria vertical en proporción 2:3, donde mis productos sean los protagonistas dentro de una máquina de garra verde neón, con una composición atractiva, realista y lista para utilizarse en campañas de marketing y redes sociales.\nCada vez que suba nuevos productos, utiliza esta misma dirección de arte y sustituye los productos anteriores por los nuevos."},
 {"n": "09", "nombre": "Mi producto, mi marca", "desc": "Una modelo extiende tu producto hacia la cámara, vestida y con fondo en los colores de tu marca.", "pendiente": true, "img": "img/estilos/09-mi-producto-mi-marca.jpg", "fotos": 3, "fotosTxt": "Sube 3 fotos: la foto base + tu producto + tu logo", "pasos": "<li>Descarga la foto base y ten a la mano tu logo.</li><li>En ChatGPT sube primero la foto base y después la foto de tu producto y tu logo.</li>", "prompt": "PROMPT MAESTRO — MI PRODUCTO, MI MARCA\nActúa como director creativo y fotógrafo especializado en campañas publicitarias de moda, lifestyle y productos de consumo.\nTe proporcionaré dos imágenes:\n\n1. FOTOGRAFÍA DE MI PRODUCTO: el producto que quiero promocionar.\n2. LOGOTIPO DE MI MARCA: para identificar los colores y la identidad visual de mi negocio.\n\nUtiliza como referencia la composición de la fotografía publicitaria que te compartí anteriormente.\n1. SUSTITUYE EL PRODUCTO\nElimina completamente el vaso de matcha de la fotografía original y coloca mi producto en su lugar.\n\n* La modelo debe sostener mi producto con una mano y extenderlo hacia la cámara.\n* El producto debe quedar en primer plano, ocupando una parte importante de la imagen.\n* Conserva fielmente su forma, tamaño, empaque, colores, etiqueta y logotipo.\n* Ajusta la perspectiva para que parezca realmente sostenido por la mano.\n* Si es necesario, adapta la posición de los dedos para sujetarlo naturalmente.\n* No inventes ni rediseñes mi producto.\n\n2. PERSONALIZA EL OUTFIT\nAnaliza mi logotipo para identificar los colores principales de mi marca.\nCambia completamente la ropa de la modelo por un outfit moderno, atractivo y comercial que combine con mi identidad visual.\nUtiliza los colores de mi marca en prendas como:\n\n* Top o camiseta.\n* Chamarra o sudadera.\n* Pantalón o falda.\n* Accesorios.\n\nCrea una combinación de colores equilibrada, moderna y visualmente atractiva. No es necesario utilizar todos los colores simultáneamente.\n3. CONSERVA LA COMPOSICIÓN\nMantén:\n\n* Una modelo joven adulta con apariencia natural.\n* Una pose dinámica y segura.\n* El producto extendido hacia la cámara.\n* El efecto de perspectiva donde el producto se ve mucho más grande en primer plano.\n* Una fotografía publicitaria de cuerpo completo.\n* Una estética de campaña comercial profesional.\n\nPuedes cambiar el rostro de la modelo para crear una persona diferente, manteniendo una apariencia natural y realista.\n4. ADAPTA EL FONDO\nUtiliza los colores de mi marca para crear un fondo de estudio llamativo y coherente con el producto y el outfit.\nEl fondo debe generar contraste suficiente para destacar el producto.\n5. CALIDAD FINAL\nFotografía hiperrealista, iluminación profesional de estudio, texturas naturales, piel realista, anatomía correcta, sombras naturales, enfoque nítido en el producto y acabado de campaña publicitaria de una marca reconocida.\nREGLAS OBLIGATORIAS\n\n* Mi producto es el protagonista.\n* No cambies ni inventes las características de mi producto.\n* No inventes textos ni promociones.\n* No deformes el logotipo.\n* No agregues productos adicionales.\n* Evita manos deformes o dedos adicionales.\n* No hagas una ilustración ni caricatura.\n\nFORMATO: fotografía vertical 4:5, alta resolución, lista para Instagram y publicidad digital.\nEl resultado debe parecer una campaña publicitaria diseñada exclusivamente para mi marca."},
 {"n": "10", "nombre": "En el bote transparente", "desc": "Tu producto dentro de un bote transparente gigante junto a una modelo. Funciona muy bien con productos pequeños o de varias piezas.", "img": "img/estilos/10-bote-transparente.jpg", "hover": "img/estilos/10-bote-transparente-ejemplo.webp", "fotos": 2, "prompt": "PROMPT MAESTRO — SUSTITUCIÓN DE PRODUCTO EN PUBLICIDAD\n\nUtiliza la primera imagen como referencia de composición, estilo y diseño publicitario.\n\nVoy a subir una fotografía de MI PRODUCTO. Quiero que sustituyas las pelotas de pádel que aparecen dentro del bote transparente por el producto que estoy subiendo.\n\nINSTRUCCIONES IMPORTANTES:\n\n1. Sustituye las pelotas por mi producto, colocándolo dentro del mismo bote transparente.\n2. Respeta fielmente la apariencia original de mi producto: forma, colores, materiales, dimensiones, textura, logotipo, empaque, etiquetas y detalles.\n3. Si mi producto viene en varias piezas, acomódalas dentro del bote de manera natural, atractiva y profesional.\n4. Ajusta el tamaño del producto a sus dimensiones reales. Debe verse proporcionado respecto al bote y no demasiado pequeño.\n5. Conserva la transparencia del recipiente y permite ver claramente mi producto en su interior.\n6. Integra sombras, reflejos, iluminación y perspectiva para que parezca una fotografía publicitaria real, no un montaje.\n7. No inventes características, marcas ni elementos que no existan en mi producto.\n\nCONSERVA EXACTAMENTE LA COMPOSICIÓN DE LA IMAGEN ORIGINAL:\n\n- La misma modelo, rostro, cuerpo y posición recargada.\n- La misma ropa deportiva.\n- La misma raqueta.\n- El mismo bote, tamaño, forma y tapa negra.\n- La misma etiqueta negra con detalles dorados y la misma distribución gráfica.\n- El mismo fondo, iluminación, encuadre y estilo fotográfico.\n\nRESULTADO DESEADO:\n\nUna fotografía publicitaria premium, hiperrealista, elegante y comercial, donde mi producto sea el protagonista dentro del bote transparente.\n\nIMPORTANTE: No modifiques ningún otro elemento de la fotografía. El único cambio debe ser sustituir las pelotas por mi producto, respetando sus dimensiones reales y su apariencia original."},
 {"n": "11", "nombre": "Sobre el mapa de tu negocio", "desc": "Tu producto en la mano, de pie sobre el mapa impreso de la zona de tu negocio. Ideal para que te ubiquen.", "img": "img/estilos/11-sobre-el-mapa.webp", "fotos": 2, "sinBase": true, "fotosTxt": "Sube 2 fotos: tu producto + una captura del mapa de tu negocio", "pasos": "<li>Toma una captura de Google Maps con la ubicación de tu negocio.</li><li>En ChatGPT sube primero la foto de tu producto y después la captura del mapa.</li>", "prompt": "Crea una fotografía fotorrealista y premium, vertical 9:16, completamente cenital.\n\nUsaré solo 2 referencias: Imagen 1 = producto y Imagen 2 = mapa.\nMuestra a una persona caminando sobre un suelo oscuro, vista desde arriba, usando jeans azul claro, tenis blancos y ropa negra. Debajo de sus pies hay un mapa físico grande impreso en papel, recreado fielmente a partir de la Imagen 2, manteniendo calles, nombres, colores, orientación y ubicación.\n\nLa persona sostiene con una mano el producto de la Imagen 1. Mantén exactamente su forma, diseño, color, detalles, logotipo y proporciones, con escala, dedos, sombras y perspectiva naturales.\nTodo debe verse como una sola fotografía real, con luz natural, sombras realistas y acabado editorial comercial.\nSin collage, sin capturas de pantalla, sin elementos digitales ni apariencia de IA. Máximo fotorrealismo."},
 {"n": "12", "nombre": "Sport premium", "desc": "Tu producto en unos lockers deportivos, con una mano a punto de tomarlo. Toda la escena se pinta con los colores de tu marca.", "img": "img/estilos/12-sport-premium.webp", "hover": "img/estilos/12-sport-premium-ejemplo.webp", "fotos": 2, "colores": true, "prompt": "PROMPT MAESTRO — CAMPAÑA PUBLICITARIA DE PRODUCTO | ESTILO SPORT PREMIUM\nActúa como director creativo, fotógrafo publicitario y especialista en fotografía comercial hiperrealista.\nVoy a subir una fotografía de mi producto. Quiero que utilices ESE producto para crear una fotografía publicitaria siguiendo exactamente la dirección de arte de la siguiente escena, adaptada a los colores de mi marca: [COLORES DE MI MARCA].\n1. PRODUCTO PROTAGONISTA\n\n* Sustituye el producto de referencia por el producto que estoy subiendo.\n* Utiliza mi fotografía como referencia principal y respeta fielmente su apariencia.\n* Conserva su marca, logotipo, colores, empaque, etiquetas, textos y diseño.\n* No inventes ni cambies características del producto.\n* No deformes el empaque ni sus proporciones.\n* Si tiene caja, botella, bolsa, frasco o cualquier presentación, consérvala.\n* El producto debe ser el elemento visual más importante de la composición.\n\n2. ESCENARIO PUBLICITARIO\nCrea una escena de estilo deportivo premium con los siguientes elementos:\n\n* Lockers deportivos modernos en el color más oscuro de mi marca, con acabado mate (si mi marca no tiene un color oscuro, usa negro mate).\n* Superficie inferior brillante en el color principal de mi marca.\n* Una mano femenina entrando desde la esquina superior derecha, como si estuviera tomando el producto.\n* La muñeca lleva una banda deportiva de tela en el color principal de mi marca.\n* A la izquierda, toallas deportivas perfectamente dobladas en los tonos de mi marca, con detalles en mi color principal.\n* A la derecha, un shaker deportivo en el color oscuro de mi marca con tapa en mi color principal.\n* Iluminación comercial de estudio.\n\nIMPORTANTE: No incluyas pelotas de tenis ni de pádel, raquetas, bolsas deportivas ni accesorios que distraigan del producto.\n3. INTEGRACIÓN DEL PRODUCTO\n\n* Coloca mi producto en el centro de la escena.\n* La mano debe interactuar naturalmente con él, como si estuviera a punto de tomarlo.\n* Ajusta su tamaño según sus dimensiones reales.\n* Respeta su forma, volumen, materiales y perspectiva.\n* Genera sombras de contacto para que parezca físicamente colocado sobre la superficie.\n* No hagas que parezca pegado digitalmente.\n\nSi subo varios productos, intégralos de forma ordenada y conserva la visibilidad de cada uno. El producto principal debe permanecer en el centro.\n4. IDENTIDAD VISUAL\nUtiliza exclusivamente los colores de mi marca para el escenario: [COLORES DE MI MARCA].\n\n* Usa el color más vibrante como color principal (superficie, banda, tapa del shaker y detalles).\n* Usa el color más oscuro para los lockers y el shaker.\n* Si hace falta, complementa solo con blanco (#FFFFFF) y gris carbón (#333333).\n\nLa escena debe transmitir:\n\n* Energía.\n* Modernidad.\n* Estilo deportivo.\n* Calidad premium.\n* Publicidad de marca internacional.\n\n5. CALIDAD FOTOGRÁFICA\n\n* Fotografía hiperrealista.\n* Calidad de campaña publicitaria profesional.\n* Iluminación cinematográfica.\n* Texturas realistas.\n* Reflejos naturales.\n* Profundidad de campo.\n* Sombras suaves.\n* Detalles nítidos.\n* Composición equilibrada.\n\n6. REGLAS OBLIGATORIAS\nNO cambiar el producto original.\nNO inventar logotipos.\nNO modificar etiquetas.\nNO cambiar los colores del empaque.\nNO alterar textos ni marcas.\nNO sustituir mi producto por uno genérico.\nNO agregar pelotas de pádel o tenis.\nNO usar colores que no sean de mi marca en el escenario.\nLa creatividad debe aplicarse al escenario y a la composición, nunca a la identidad de mi producto.\nRESULTADO FINAL\nGenera directamente la imagen, no me entregues una explicación ni otro prompt.\nFormato vertical 4:5, fotografía publicitaria hiperrealista, lista para utilizarse en Instagram, Facebook y campañas comerciales.\nCada vez que suba un producto diferente, repite esta dirección de arte y sustituye únicamente el producto protagonista."},
 {"n": "13", "nombre": "Bloque minimalista", "desc": "Tu producto en lo alto de un bloque, visto desde abajo, con fondo suave en tonos de tu marca. Elegante y de lujo.", "pendiente": true, "img": "img/estilos/13-bloque-minimalista.jpg", "fotos": 2, "colores": true, "prompt": "Actúa como un fotógrafo publicitario especializado en fotografía de productos de alta gama y como experto en dirección de arte.\nPrimero voy a subir la imagen de referencia y después una fotografía de MI PRODUCTO. Tu tarea es crear una nueva fotografía publicitaria utilizando MI PRODUCTO como protagonista y reproduciendo fielmente la composición visual de la imagen de referencia, adaptada a los colores de mi marca: [COLORES DE MI MARCA].\nINSTRUCCIONES OBLIGATORIAS:\n\n1. PRODUCTO:\n\n* Utiliza exclusivamente el producto de la fotografía que te proporciono.\n* Conserva su forma, proporciones, envase, materiales, colores originales, etiqueta, logotipo, textos y características.\n* No inventes otra presentación ni cambies el diseño del producto.\n* No sustituyas el producto por un objeto genérico.\n* No alteres su identidad comercial.\n\n2. COMPOSICIÓN FOTOGRÁFICA:\n\n* Coloca mi producto exactamente en la posición donde aparece el producto de la referencia.\n* El producto debe estar apoyado sobre el borde superior de un bloque geométrico rectangular en un tono claro y suave de los colores de mi marca (si no combina con mi producto, usa gris claro).\n* La cámara debe estar en un ángulo bajo, ligeramente por debajo del producto y mirando hacia arriba.\n* El bloque debe ocupar la parte inferior de la imagen.\n* Crea una marcada línea diagonal en la composición.\n* El producto debe destacar en la zona central superior.\n* Deja una amplia zona de espacio negativo en la parte superior.\n\n3. ILUMINACIÓN Y ESTÉTICA:\n\n* Fotografía publicitaria editorial de lujo.\n* Fondo muy claro, en una versión casi blanca y suave de los colores de mi marca (o gris perla si no combina).\n* Iluminación de estudio suave y natural.\n* Sombras definidas y elegantes.\n* Texturas realistas.\n* Materiales y reflejos fieles al producto original.\n* Estética minimalista, sofisticada y premium.\n\n4. REALISMO:\n\n* El producto debe verse físicamente real, no como una ilustración.\n* Respeta su perspectiva y dimensiones.\n* Integra correctamente las sombras de contacto con el bloque.\n* No agregues elementos decorativos innecesarios.\n\nRESULTADO:\nUna fotografía publicitaria profesional que parezca realizada por una agencia de publicidad de lujo, con mi producto ocupando el lugar exacto del producto de referencia.\nIMPORTANTE: La fotografía de referencia determina la composición, el ángulo, la posición y la iluminación. Mi fotografía determina cuál es el producto que debe aparecer. Los colores de mi marca determinan los tonos del bloque y del fondo."},
 {"n": "14", "nombre": "Concreto editorial", "desc": "Tu producto sobre un bloque de concreto, con luz de sol dura y sombras largas. Minimalismo de revista de lujo.", "img": "img/estilos/14-concreto-editorial.webp", "fotos": 1, "prompt": "Actúa como fotógrafo publicitario profesional especializado en fotografía editorial de productos de lujo.\nUtiliza la fotografía del producto que voy a subir y conviértelo en el protagonista de una fotografía publicitaria con la siguiente dirección de arte:\nCOMPOSICIÓN\n\n* Coloca el producto sobre un bloque geométrico rectangular de concreto gris oscuro.\n* El producto debe estar centrado sobre el bloque.\n* Utiliza una toma frontal ligeramente elevada.\n* El bloque debe estar apoyado sobre una superficie de concreto gris claro.\n* Fondo superior gris carbón oscuro, creando una división diagonal muy marcada con la superficie inferior.\n* Deja espacio negativo alrededor del producto.\n\nILUMINACIÓN\n\n* Fotografía completamente en blanco y negro.\n* Luz solar lateral intensa y directa.\n* Sombras largas, duras y muy definidas.\n* Contraste alto entre luces y sombras.\n* Textura de concreto visible.\n* Ligero grano fotográfico analógico.\n\nPRODUCTO\n\n* Utiliza exactamente el producto que he subido.\n* Conserva su forma, dimensiones, colores originales de diseño, materiales, etiquetas, marca y logotipo.\n* No cambies su presentación.\n* No inventes elementos ni modifiques su identidad.\n* Integra sombras de contacto realistas sobre el bloque.\n\nESTILO FINAL\nFotografía editorial de lujo, minimalismo arquitectónico, estética cinematográfica, fotografía de campaña de una marca premium.\nFormato cuadrado 1:1, máxima calidad y realismo fotográfico."},
 {"n": "15", "nombre": "Sombra en blanco y negro", "desc": "Tu producto sobre un cubo de concreto, en blanco y negro, con una sombra diagonal muy marcada. Elegante y cinematográfico.", "img": "img/estilos/15-sombra-blanco-negro.webp", "fotos": 1, "prompt": "Actúa como director creativo y fotógrafo especializado en campañas publicitarias de productos premium.\nVoy a proporcionarte una fotografía de mi producto. Debes integrarlo en una escena publicitaria reproduciendo esta dirección de arte:\nCOMPOSICIÓN\n\n* Coloca mi producto encima de un bloque cúbico de concreto gris.\n* El bloque debe estar ubicado en el centro de la composición.\n* El producto debe estar perfectamente apoyado sobre la cara superior del bloque.\n* Cámara frontal con perspectiva ligeramente elevada.\n* Superficie de concreto gris claro que se extiende hasta el fondo.\n* Fondo minimalista sin objetos adicionales.\n\nILUMINACIÓN\n\n* Fotografía en blanco y negro.\n* Luz solar intensa proveniente de la parte superior derecha.\n* Una sombra diagonal muy marcada atraviesa la escena.\n* Proyecta la sombra del producto y del bloque sobre el suelo.\n* Contraste cinematográfico.\n* Texturas rugosas y naturales del concreto.\n* Apariencia de fotografía analógica de alta gama.\n\nFIDELIDAD DEL PRODUCTO\n\n* Mi producto debe ser exactamente el de la fotografía subida.\n* No modificar su forma, envase, proporciones, etiquetas, logotipo ni textos.\n* No reemplazarlo por un perfume ni por ningún producto de ejemplo.\n* Adaptar la iluminación y las sombras al objeto original.\n* Mantener su identidad comercial.\n\nRESULTADO\nUna fotografía publicitaria minimalista, elegante, arquitectónica y cinematográfica, como una campaña de una marca internacional de lujo.\nFormato cuadrado 1:1, máxima resolución, hiperrealismo fotográfico."},
 {"n": "16", "nombre": "¿Estás listo?", "desc": "Tu producto en una mano, escondido tras un pixelado y el texto ¿ESTÁS LISTO? Crea curiosidad antes de revelarlo.", "img": "img/estilos/16-estas-listo.webp", "fotos": 2, "colores": true, "prompt": "Actúa como director creativo y fotógrafo publicitario especializado en campañas de marketing visual de alto impacto.\nPrimero voy a subir la imagen de referencia y después una fotografía de MI PRODUCTO. Utilízala para crear una imagen publicitaria siguiendo exactamente el concepto visual de la referencia, adaptada a los colores de mi marca: [COLORES DE MI MARCA].\n1. PRODUCTO\n\n* Utiliza el producto de mi fotografía como protagonista.\n* Colócalo verticalmente, sostenido por una mano humana realista.\n* La mano debe sujetar el producto desde abajo y los laterales, como si lo estuviera presentando frente a la cámara.\n* El producto debe ocupar gran parte del centro de la composición.\n* Conserva su forma, proporciones, envase, colores, logotipo, marca y características originales.\n* No inventes otro producto ni sustituyas su presentación.\n\n2. EFECTO MOSAICO\n\n* Aplica un efecto de pixelado mediante grandes cuadrados geométricos sobre el producto.\n* El mosaico debe cubrir parcialmente el producto, creando misterio y expectativa.\n* Utiliza cuadrados de diferentes tonalidades relacionados con la paleta de colores de mi marca.\n* El efecto debe integrarse visualmente con el producto y la composición.\n* La mano debe permanecer parcialmente visible alrededor del producto.\n\n3. FONDO Y COLORES\n\n* Fondo completamente en el color principal de mi marca, en su versión más brillante.\n* Utiliza variaciones claras y oscuras de los colores de mi marca.\n* Iluminación luminosa, moderna y envolvente.\n* Contraste fuerte entre el producto, la mano y el fondo.\n* Estética tecnológica, contemporánea y publicitaria.\n\n4. TIPOGRAFÍA\nIncorpora en el centro del producto el texto:\n«¿ESTÁS LISTO?»\n\n* Utiliza la letra de mi marca: [LETRA DE MI MARCA]. Si no se indica, usa tipografía sans serif condensada, pesada, moderna y ligeramente inclinada.\n* La palabra «¿ESTÁS» debe aparecer en blanco.\n* La palabra «LISTO?» debe aparecer en el color más vibrante de mi marca.\n* Agrega un trazo dinámico en ese mismo color debajo del texto.\n* El texto debe ser perfectamente legible y estar integrado en la composición.\n\n5. ESTILO FOTOGRÁFICO\n\n* Fotografía publicitaria hiperrealista.\n* Composición vertical.\n* Perspectiva frontal.\n* Iluminación de estudio profesional.\n* Acabado de campaña de lanzamiento de producto.\n* Imagen moderna, llamativa y de alto impacto visual.\n\nREGLA MÁS IMPORTANTE\nLa fotografía que subo determina el producto que aparecerá. No debes cambiarlo, reemplazarlo ni rediseñarlo.\nLa imagen de referencia determina la composición, la mano, el efecto mosaico y el concepto creativo.\nLos colores de mi marca determinan el fondo, el mosaico y el color del texto.\nEl resultado debe parecer una campaña publicitaria profesional que genera curiosidad antes de revelar un producto.\nFormato vertical 4:5, alta resolución."},
 {"n": "17", "nombre": "En primer plano", "desc": "Una mano te presenta tu producto de frente, enorme y con actitud.", "img": "img/estilos/17-primer-plano.webp", "hover": "img/estilos/17-primer-plano-ejemplo.webp", "fotos": 2, "colores": true, "prompt": "PROMPT MAESTRO — MI PRODUCTO EN PRIMER PLANO\nActúa como fotógrafo publicitario especializado en campañas disruptivas de marcas deportivas, tecnología, moda y lifestyle.\nPrimero voy a subir la imagen de referencia y después la fotografía de mi producto. Utiliza la fotografía de mi producto como referencia obligatoria.\nQuiero crear una fotografía publicitaria hiperrealista siguiendo el concepto de la imagen de referencia: una persona extendiendo su mano hacia la cámara y presentando su producto con mucha fuerza visual. Adapta la escena a los colores de mi marca: [COLORES DE MI MARCA].\n1. SUSTITUCIÓN DEL OBJETO\nColoca mi producto en la mano del modelo, sustituyendo completamente el objeto original.\n\n* El modelo debe sostenerlo firmemente con una mano.\n* El brazo debe estar extendido hacia el frente.\n* El producto debe estar muy cerca de la cámara.\n* Utiliza perspectiva forzada para que el producto se vea grande y dominante.\n* Los dedos deben rodear y sujetar el producto de manera anatómicamente natural.\n* Conserva exactamente la forma, colores, dimensiones, empaque, etiqueta y logotipo de mi producto.\n* No inventes ni rediseñes el producto.\n\n2. COMPOSICIÓN\n\n* Fotografía vertical y dinámica.\n* Producto en primerísimo plano.\n* Mano ocupando una parte importante de la composición.\n* Modelo detrás del producto, parcialmente desenfocado.\n* Perspectiva gran angular publicitaria.\n* El producto debe ser el protagonista absoluto.\n\n3. VESTUARIO\nViste al modelo con un outfit moderno, disruptivo y de diseño innovador, con detalles en los colores de mi marca.\nUtiliza moda urbana experimental, prendas técnicas, cortes asimétricos, materiales contrastantes, accesorios contemporáneos y detalles llamativos.\nEl vestuario debe complementar el producto sin competir visualmente con él.\n4. FONDO E ILUMINACIÓN\nCrea un fondo de estudio intenso en el color principal de mi marca, con suficiente contraste para que destaque el producto.\nUtiliza iluminación cinematográfica, sombras marcadas, reflejos realistas y luz lateral dramática.\n5. REALISMO\nLa integración debe ser fotográficamente creíble:\n\n* Anatomía correcta de la mano.\n* Dedos sujetando realmente el objeto.\n* Tamaño y perspectiva coherentes.\n* Texturas originales del producto.\n* Sombras de contacto.\n* Enfoque nítido en el producto.\n\nREGLAS OBLIGATORIAS\nNo cambies mi producto.\nNo inventes etiquetas ni marcas.\nNo agregues objetos adicionales.\nNo deformes el empaque.\nNo coloques el producto flotando.\nNo hagas que parezca un montaje digital.\nRESULTADO: una fotografía publicitaria hiperrealista, impactante y de aspecto premium, donde mi producto parece estar siendo presentado directamente hacia el espectador con fuerza y actitud.\nFormato vertical 4:5, alta resolución."},
 {"n": "18", "nombre": "Producto gigante", "desc": "Una modelo carga una versión gigante de tu producto en una calle moderna. Funciona con cualquier giro, hasta con una tarjeta de regalo si vendes servicios.", "img": "img/estilos/18-producto-gigante.webp", "hover": "img/estilos/18-producto-gigante-ejemplo.webp", "fotos": 1, "colores": true, "prompt": "PROMPT UNIVERSAL — PRODUCTO GIGANTE | CAMPAÑA PUBLICITARIA\nActúa como director creativo y fotógrafo especializado en campañas publicitarias de marcas internacionales.\nVoy a subir UNA fotografía de mi producto.\nTu trabajo es analizar automáticamente la imagen y crear una fotografía publicitaria hiperrealista en la que una modelo esté cargando, abrazando o sosteniendo una versión gigante de MI PRODUCTO.\nNO ME HAGAS PREGUNTAS. GENERA DIRECTAMENTE LA IMAGEN.\n1. ANALIZA MI PRODUCTO\nAntes de generar la imagen, identifica visualmente:\n\n* Qué producto es.\n* Su forma y dimensiones.\n* Sus colores.\n* Su empaque y materiales.\n* Su marca y logotipo.\n* Sus características visuales distintivas.\n\nUtiliza mi fotografía como referencia obligatoria.\n2. CONSERVA MI PRODUCTO\nEl producto debe mantenerse fiel al original:\n\n* No cambies su marca.\n* No inventes logotipos.\n* No sustituyas el empaque.\n* No alteres sus colores.\n* No inventes textos ni etiquetas.\n* No modifiques su diseño original.\n\nSi es una botella, conserva su botella.\nSi es una bolsa, conserva su bolsa.\nSi es una caja, conserva su caja.\nSi es un accesorio, conserva su forma y materiales.\nEl producto debe ser reconocible como el mismo que subí.\n3. CREA LA ESCENA PUBLICITARIA\nGenera una fotografía con estas características:\n\n* Una modelo joven adulta con apariencia comercial y estilo moderno.\n* La modelo debe estar cargando, abrazando o sosteniendo el producto gigante.\n* El producto debe ser aproximadamente 1.5 a 2 veces más grande de lo normal, dependiendo de su forma.\n* La modelo debe interactuar físicamente con el producto de manera natural.\n* El producto debe ser el protagonista de la fotografía.\n\nLa modelo debe vestir ropa moderna, casual o deportiva, seleccionada según el tipo de producto, con detalles en los colores de mi marca: [COLORES DE MI MARCA].\nNo uses siempre el mismo outfit. Adapta el vestuario para que combine con el producto y su mercado.\n4. FONDO UNIVERSAL\nUtiliza un escenario urbano minimalista y neutro:\n\n* Arquitectura contemporánea.\n* Paredes de concreto claro.\n* Edificios modernos.\n* Banquetas y superficies urbanas.\n* Luz natural.\n* Sombras cinematográficas.\n\nEl fondo debe ser elegante, limpio y versátil para funcionar con cualquier giro comercial.\nNo utilices gimnasios, cocinas, supermercados, tiendas o escenarios demasiado específicos, salvo que sean indispensables para presentar correctamente el producto.\n5. ESTILO FOTOGRÁFICO\n\n* Fotografía publicitaria hiperrealista.\n* Calidad de campaña internacional.\n* Iluminación profesional.\n* Texturas realistas.\n* Perspectiva y proporciones creíbles.\n* Sombras de contacto naturales.\n* Colores vibrantes.\n* Composición editorial de alto impacto.\n\n6. COMPOSICIÓN\n\n* Formato vertical 4:5.\n* Modelo visible de cuerpo completo siempre que sea posible.\n* Producto gigante en primer plano.\n* Manos sujetando correctamente el producto.\n* Producto claramente visible.\n* Fondo con profundidad y desenfoque sutil.\n\n7. REGLA DE ADAPTACIÓN AUTOMÁTICA\nNo importa qué producto suba.\nPuede ser:\n\n* Alimentos.\n* Bebidas.\n* Cosméticos.\n* Suplementos.\n* Tecnología.\n* Ropa.\n* Zapatos.\n* Accesorios.\n* Juguetes.\n* Productos para el hogar.\n* Productos industriales.\n\nAdapta automáticamente la pose, el vestuario, la forma de sostener el producto y los detalles visuales según su categoría.\nNo agregues elementos que distraigan ni cambies la identidad del producto.\nRESULTADO\nGenera directamente una imagen publicitaria impactante donde una modelo esté cargando un producto gigante, con una estética urbana, moderna, comercial y profesional.\nNo escribas explicaciones, no entregues otro prompt y no hagas preguntas. Genera la imagen final utilizando exclusivamente el producto que acabo de subir como referencia."},
 {"n": "19", "nombre": "Desde la bolsa", "desc": "Como si vieras desde dentro de una bolsa de papel: una mano saca tu producto al cielo azul, con tu frase arriba. Ideal para comida y antojos.", "img": "img/estilos/19-desde-la-bolsa.webp", "hover": "img/estilos/19-desde-la-bolsa-ejemplo.webp", "fotos": 1, "colores": true, "pasoFinal": false, "pasos": "<li>En ChatGPT sube la foto de tu producto.</li><li>Copia el prompt y pégalo.</li><li>Antes de enviarlo, cambia [ESCRIBE AQUÍ TU FRASE] por tu frase y envía.</li>", "prompt": "PROMPT MAESTRO — TU PRODUCTO DENTRO DE LA BOLSA\nActúa como director creativo y fotógrafo especializado en campañas publicitarias de alto impacto.\nUtiliza exclusivamente la fotografía del producto que acabo de subir para crear una fotografía publicitaria hiperrealista inspirada en esta composición:\nCONCEPTO VISUAL\nLa imagen debe parecer tomada desde el interior de una bolsa de papel kraft abierta, mirando hacia el cielo azul.\nLa bolsa ocupa los bordes y el primer plano de la fotografía, creando un marco irregular de papel rasgado y arrugado.\nA través de la abertura se observa un cielo azul intenso con algunas nubes blancas.\nUna mano humana aparece desde el exterior de la bolsa, sosteniendo mi producto y acercándolo hacia la cámara.\nINTEGRACIÓN DEL PRODUCTO\nSustituye cualquier objeto de referencia por el producto que he subido.\nEs obligatorio:\n\n* Mantener fielmente la forma, presentación, colores, materiales y características de mi producto.\n* No inventar ni modificar su empaque.\n* Colocarlo directamente en la mano de una persona.\n* Adaptar naturalmente los dedos para sujetarlo.\n* Crear una perspectiva gran angular donde el producto se vea grande y cercano a la cámara.\n* Generar sombras de contacto y reflejos naturales.\n* Respetar las proporciones reales del producto.\n\nSi es comida, debe verse fresca, apetitosa y con texturas irresistibles. Si es otro tipo de producto, conserva su apariencia original y hazlo visualmente atractivo.\nCOMPOSICIÓN\n\n* Cámara ubicada dentro de una bolsa de papel kraft.\n* Abertura irregular en la parte superior.\n* Cielo azul brillante de fondo.\n* Mano extendiendo el producto hacia el espectador.\n* Producto como protagonista absoluto.\n* Perspectiva dinámica y ligeramente exagerada.\n* Iluminación natural de día soleado.\n\nTEXTO PUBLICITARIO\nEn la parte superior del cielo coloca exactamente:\n[ESCRIBE AQUÍ TU FRASE]\nUtiliza la letra de mi marca: [LETRA DE MI MARCA]. Si no se indica, usa tipografía grande, llamativa y de estilo editorial, con buena legibilidad.\nAgrega un pequeño trazo subrayado y unos destellos en el color principal de mi marca: [COLORES DE MI MARCA].\nNo agregues otros textos ni marcas inventadas.\nREALISMO FOTOGRÁFICO\nLa imagen debe parecer una fotografía real tomada con una cámara profesional:\n\n* Textura auténtica del papel.\n* Pliegues y bordes irregulares.\n* Mano anatómicamente correcta.\n* Iluminación solar coherente.\n* Sombras naturales.\n* Producto integrado físicamente en la escena.\n* Profundidad y perspectiva realistas.\n\nREGLAS IMPORTANTES\nNo cambies el producto por una versión genérica.\nNo inventes etiquetas.\nNo deformes el empaque.\nNo agregues productos adicionales.\nNo hagas ilustraciones ni renders artificiales.\nFORMATO FINAL: vertical 9:16, 1080 × 1920 px, alta resolución, fotografía publicitaria hiperrealista lista para Instagram Reels y Stories.\nEl resultado debe conservar el mismo concepto visual de la bolsa abierta y el cielo, pero adaptado perfectamente al producto que he proporcionado."},
 {"n": "20", "nombre": "En capas flotantes", "desc": "Tu producto se separa en capas que flotan sobre fondo negro: ingredientes, piezas o componentes. Se antoja muchísimo con comida.", "img": "img/estilos/20-en-capas.webp", "hover": ["img/estilos/20-en-capas-ejemplo-1.webp", "img/estilos/20-en-capas-ejemplo-2.webp"], "fotos": 1, "colores": true, "prompt": "PROMPT MAESTRO — EXPLODED PRODUCT PHOTOGRAPHY\nActúa como un director de arte y fotógrafo especializado en fotografía publicitaria de productos y alimentos de alto impacto visual.\nVoy a subir una fotografía de mi producto. Tu trabajo es analizarla y transformarla en una fotografía publicitaria hiperrealista con el estilo visual EXPLODED VIEW (producto descompuesto en capas flotantes).\nIMPORTANTE: GENERA DIRECTAMENTE LA IMAGEN. NO ME HAGAS PREGUNTAS.\n1. ANALIZA EL PRODUCTO\nIdentifica automáticamente:\n\n* Tipo de producto.\n* Forma y estructura.\n* Materiales y texturas.\n* Componentes principales.\n* Colores originales.\n* Elementos que lo hacen reconocible.\n\n2. CREA EL EFECTO EXPLODED VIEW\nRepresenta el producto descompuesto en sus diferentes componentes, suspendidos verticalmente en el aire.\nCada elemento debe:\n\n* Mantener su forma original.\n* Tener separación visual entre capas.\n* Estar alineado con el producto principal.\n* Mostrar profundidad y perspectiva.\n* Parecer suspendido de manera natural.\n\nSi es un alimento, separa sus ingredientes en capas: pan, carne, queso, vegetales, salsas y complementos, según corresponda.\nSi es un producto físico, identifica sus piezas, materiales o componentes visuales y distribúyelos de forma creativa sin inventar funciones ni partes inexistentes.\nSi es un producto que no puede descomponerse físicamente, crea una composición flotante utilizando el producto completo y sus elementos visuales originales. NO inventes componentes.\n3. COMPOSICIÓN FOTOGRÁFICA\n\n* Composición vertical y centrada.\n* Elementos suspendidos en una columna visual.\n* Producto completo reconocible.\n* Separación clara entre cada componente.\n* Pequeñas partículas, gotas o fragmentos alrededor cuando sean apropiados.\n* Perspectiva de fotografía comercial premium.\n\n4. FONDO E ILUMINACIÓN\nUtiliza un fondo negro profundo (#050505).\nIluminación de estudio cinematográfica:\n\n* Luz lateral dramática.\n* Una luz de contorno sutil en el color principal de mi marca: [COLORES DE MI MARCA].\n* Contraste elevado.\n* Reflejos realistas.\n* Sombras profundas.\n* Texturas muy definidas.\n* Enfoque nítido sobre el producto.\n\n5. REALISMO\nEl resultado debe parecer una fotografía publicitaria real, no una ilustración.\nRespeta:\n\n* Materiales.\n* Texturas.\n* Colores.\n* Proporciones.\n* Gravedad y apariencia física.\n* Detalles originales del producto.\n\nNo agregues textos, marcas, logotipos ni ingredientes que no correspondan al producto original.\n6. FORMATO FINAL\n\n* Vertical 2:3.\n* Calidad hiperrealista.\n* Estética publicitaria premium.\n* Composición visual impactante.\n* Lista para campañas de redes sociales y anuncios.\n\nINSTRUCCIÓN FINAL:\nUtiliza exclusivamente la fotografía que acabo de subir como referencia. Adapta automáticamente el efecto EXPLODED VIEW al tipo de producto. Si es comida, haz que sus ingredientes se separen en capas apetitosas. Si es un producto físico, utiliza sus componentes reales. Conserva siempre su identidad.\nGenera directamente la imagen final."},
 {"n": "21", "nombre": "Sillón editorial", "desc": "Una persona en un sillón sostiene tu producto mientras una mano le sirve o lo presenta. Fondo y sillón con los colores de tu marca.", "img": "img/estilos/21-sillon-editorial.webp", "fotos": 2, "colores": true, "prompt": "PROMPT MAESTRO — PUBLICIDAD CON MI PRODUCTO\nUtiliza la imagen de referencia como base y la fotografía que voy a subir como referencia del producto que quiero promocionar. Primero subo la imagen de referencia y después la de mi producto.\nQuiero recrear esta misma fotografía publicitaria, sustituyendo el producto original por MI PRODUCTO, adaptada a los colores de mi marca: [COLORES DE MI MARCA].\n1. PRODUCTO\n\n* Identifica el producto de mi fotografía.\n* Sustituye las alitas por el producto que estoy subiendo.\n* Si es comida, preséntala de manera apetitosa, fresca y visualmente irresistible.\n* Si es un producto físico, intégralo de manera natural en la escena.\n* Respeta fielmente su forma, colores, textura, empaque, marca, logotipo y características originales.\n* No inventes ni modifiques la identidad de mi producto.\n\n2. COMPOSICIÓN\nConserva el concepto visual de la fotografía:\n\n* Una persona joven sentada en un sillón.\n* Una mano en primer plano sosteniendo el producto o su envase y realizando una acción relacionada con él.\n* Si el producto es una salsa, bebida o líquido, la mano puede servirlo o verterlo sobre el producto.\n* Si es un alimento, debe mostrarse en una presentación atractiva.\n* Si es un producto físico, la mano debe exhibirlo de manera creativa.\n\n3. ESTILO VISUAL\n\n* Fotografía publicitaria editorial de alto impacto.\n* Fondo intenso en el color principal de mi marca.\n* Sillón en otro color de mi marca que contraste con el fondo.\n* Outfit masculino moderno, elegante y fresco.\n* Accesorios contemporáneos.\n* Iluminación de estudio profesional.\n* Colores vibrantes y contraste cinematográfico.\n* Texturas hiperrealistas y detalles nítidos.\n\n4. REGLAS IMPORTANTES\n\n* Mantén la composición, perspectiva y encuadre de la referencia.\n* Conserva el tatuaje de ballena con la pequeña figura humana en el antebrazo de la mano que sostiene el producto.\n* No cambies el concepto creativo.\n* No agregues marcas comerciales que no estén en mi fotografía.\n* No deformes el producto.\n* El producto debe ser el protagonista de la imagen.\n\nRESULTADO\nCrea una fotografía publicitaria hiperrealista, creativa, moderna y visualmente impactante, como una campaña de una marca internacional.\nIMPORTANTE: Cada vez que suba un producto diferente, adapta la escena a ese producto sin perder la identidad visual, composición y estilo de la fotografía de referencia."},
 {"n": "22", "nombre": "Escena de película", "desc": "Un personaje lleva tus productos por un pasillo de hotel, un restaurante o una oficina, como en una escena de película. Ideal si vendes varios productos.", "pendiente": true, "img": "img/estilos/22-escena-cinematografica.webp", "hover": "img/estilos/22-escena-cinematografica-ejemplo.webp", "fotos": 1, "fotosTxt": "Sube una o varias fotos de tus productos", "colores": true, "prompt": "PROMPT MAESTRO — PRODUCTOS EN ESCENAS PUBLICITARIAS CINEMATOGRÁFICAS\nActúa como director creativo, fotógrafo publicitario y especialista en generación de imágenes hiperrealistas para campañas comerciales.\nVoy a subir una o varias fotografías de mis productos.\nTu trabajo es analizar los productos y crear una fotografía publicitaria cinematográfica donde un personaje los esté transportando, cargando, sosteniendo o presentando de una manera llamativa y natural.\nNO ME HAGAS PREGUNTAS. GENERA DIRECTAMENTE LA IMAGEN.\n1. ANALIZA LOS PRODUCTOS\nIdentifica automáticamente:\n\n* Qué productos son.\n* Sus formas y dimensiones.\n* Sus colores y materiales.\n* Sus empaques y presentaciones.\n* Sus características visuales.\n* Cómo deben manipularse y presentarse.\n\nUtiliza las fotografías que subí como referencia obligatoria.\n2. ADAPTA LA ESCENA AL PRODUCTO\nCrea una escena donde un personaje esté llevando o presentando mis productos.\nAdapta automáticamente la composición:\n\n* Si son alimentos preparados, colócalos en charolas, platos o recipientes adecuados.\n* Si son bebidas, utiliza cajas, charolas o recipientes para transportarlas.\n* Si son productos empacados, utiliza cajas, bolsas o exhibidores.\n* Si son cosméticos, accesorios o artículos pequeños, utiliza bandejas o presentaciones comerciales.\n* Si son productos grandes, haz que el personaje los cargue de manera proporcional y físicamente creíble.\n\nNo utilices recipientes que no tengan sentido para el producto.\n3. PERSONAJE\nUtiliza un personaje adulto inventado, con apariencia cinematográfica, expresión facial llamativa y pose natural. No debe parecerse a ninguna persona famosa ni real.\nPuede ser hombre o mujer, según lo que mejor funcione para la campaña.\nEl personaje debe:\n\n* Mirar hacia la cámara o tener una expresión espontánea.\n* Sostener los productos con ambas manos cuando sea necesario.\n* Mostrar claramente los productos.\n* Tener una postura natural.\n* Interactuar físicamente con los objetos.\n\nEl vestuario debe adaptarse al tipo de negocio y a la escena, con algún detalle en los colores de mi marca: [COLORES DE MI MARCA].\n4. ESCENARIO\nCrea un entorno cinematográfico realista, inspirado en fotografía editorial y publicidad comercial.\nPuedes utilizar:\n\n* Pasillos de hoteles.\n* Restaurantes modernos.\n* Cocinas profesionales.\n* Espacios comerciales.\n* Oficinas.\n* Arquitectura contemporánea.\n* Interiores elegantes.\n\nSelecciona automáticamente el escenario que mejor presente el producto.\nEl fondo debe aportar contexto sin competir visualmente con los productos.\n5. COMPOSICIÓN FOTOGRÁFICA\n\n* Personaje en el centro.\n* Productos claramente visibles en primer plano.\n* Perspectiva natural.\n* Proporciones realistas.\n* Profundidad de campo.\n* Iluminación cinematográfica.\n* Texturas detalladas.\n* Sombras naturales.\n* Fotografía hiperrealista.\n\n6. CONSERVACIÓN DEL PRODUCTO\nREGLAS OBLIGATORIAS:\n\n* No cambies las marcas.\n* No inventes logotipos.\n* No alteres los empaques.\n* No cambies los colores originales.\n* No deformes los productos.\n* No inventes etiquetas.\n* No sustituyas mis productos por versiones genéricas.\n\nSi subo varios productos, utiliza todos los que sea posible sin saturar la composición.\n7. CALIDAD Y FORMATO\n\n* Fotografía publicitaria hiperrealista.\n* Calidad de campaña comercial internacional.\n* Iluminación profesional.\n* Estética cinematográfica.\n* Alto nivel de detalle.\n* Formato vertical 2:3.\n* Sin textos publicitarios agregados.\n* Sin marcas de agua.\n\nINSTRUCCIÓN FINAL\nCada vez que suba nuevos productos, crea una escena completamente adaptada a ellos.\nNo repitas automáticamente el mismo escenario, recipiente o vestuario. Utiliza tu criterio creativo para elegir la mejor presentación comercial.\nLa imagen debe transmitir que los productos son reales, atractivos y están siendo presentados por una persona en una situación cinematográfica.\nGENERA DIRECTAMENTE LA IMAGEN FINAL. NO ME ENTREGUES EXPLICACIONES NI OTRO PROMPT."},
 {"n": "23", "nombre": "Te está llamando", "desc": "Tu producto en acercamiento extremo, como si fuera una llamada entrante en el celular. Perfecto para historias y reels.", "img": "img/estilos/23-te-esta-llamando-2.webp", "completa": false, "hover": "img/estilos/23-te-esta-llamando-ejemplo.webp", "fotos": 1, "prompt": "PROMPT MAESTRO — TU PRODUCTO TE ESTÁ LLAMANDO 📞\nActúa como director creativo, fotógrafo publicitario y diseñador especializado en campañas visuales hiperrealistas para marcas comerciales.\nUtiliza la fotografía del producto que acabo de subir como referencia principal y obligatoria.\nTu misión es convertir MI PRODUCTO en el protagonista de una fotografía publicitaria con apariencia de pantalla de llamada entrante de un teléfono inteligente.\n1. CONCEPTO VISUAL\nCrea una imagen vertical que parezca una captura de pantalla real de una llamada entrante de un celular moderno.\nEl fondo debe estar compuesto por una fotografía EXTREME MACRO ZOOM de mi producto.\nEl producto debe ocupar prácticamente toda la imagen, con una perspectiva muy cercana, impactante y envolvente.\nDebe parecer que el espectador está recibiendo una llamada directamente de ese producto.\n2. ZOOM PUBLICITARIO DEL PRODUCTO\nEsta es la parte más importante:\n\n* Utiliza un acercamiento macro extremo.\n* El producto debe llenar el encuadre.\n* Destaca sus texturas, materiales, ingredientes, acabados y detalles.\n* Crea profundidad de campo cinematográfica.\n* Utiliza iluminación comercial profesional.\n* Conserva los detalles reales del producto.\n* Si es comida, debe verse extremadamente apetitosa, fresca y realista.\n* Si es un cosmético, destaca sus texturas y empaque.\n* Si es tecnología, destaca sus materiales y acabados.\n* Si es ropa o accesorios, destaca sus tejidos y detalles.\n\nAdapta automáticamente el tipo de fotografía al producto que recibas.\nNO utilices fondos genéricos. El producto debe convertirse en todo el universo visual de la imagen.\n3. INTERFAZ DE LLAMADA REAL\nIntegra una interfaz inspirada en las llamadas entrantes de los teléfonos inteligentes modernos.\nEn la parte superior:\n\n* Hora y pequeños indicadores de señal, Wi-Fi y batería.\n* Nombre del contacto: utiliza el nombre del producto o una descripción breve.\n* Debajo coloca: \"Te está llamando...\"\n\nLa tipografía debe ser blanca, limpia, moderna, delgada y elegante, como la interfaz nativa de un celular.\nEl nombre del producto debe parecer realmente el nombre de una persona que está llamando.\n4. BOTONES DE LLAMADA\nEn la parte inferior integra dos botones circulares grandes:\nBOTÓN IZQUIERDO:\n\n* Círculo rojo.\n* Icono blanco de teléfono colgado.\n* Texto: \"Rechazar\".\n\nBOTÓN DERECHO:\n\n* Círculo verde.\n* Icono blanco de teléfono descolgado.\n* Texto: \"Aceptar\".\n\nAgrega los elementos de interfaz necesarios para que parezca una captura auténtica de una llamada entrante.\n5. INTEGRACIÓN VISUAL\nLa interfaz debe integrarse perfectamente con la fotografía.\n\n* Texto blanco con excelente legibilidad.\n* Sombras o degradados sutiles detrás de los textos cuando sean necesarios.\n* Botones claramente visibles.\n* Composición equilibrada.\n* No ocultar los detalles más atractivos del producto.\n\n6. CALIDAD PROFESIONAL\nLa calidad fotográfica debe ser de nivel campaña publicitaria internacional.\nUtiliza:\n\n* Fotografía macro profesional.\n* Resolución y nitidez extremadamente altas.\n* Texturas realistas.\n* Iluminación cinematográfica.\n* Colores naturales y vibrantes.\n* Profundidad de campo óptica.\n* Detalles definidos.\n* Apariencia de fotografía real, no ilustración ni render 3D.\n\n7. REGLAS OBLIGATORIAS\n\n1. Mi producto debe ser el protagonista absoluto.\n2. No sustituyas mi producto por otro.\n3. No inventes marcas ni etiquetas.\n4. No alteres su presentación original.\n5. No utilices fotografías de productos genéricos.\n6. No deformes los elementos de la interfaz.\n7. Mantén la apariencia de una llamada entrante real.\n8. No agregues textos publicitarios adicionales.\n\nRESULTADO FINAL\nUna imagen vertical 9:16 (1080 × 1920 px), hiperrealista, con apariencia de pantalla de llamada entrante de un celular moderno y un acercamiento macro extremo del producto.\nEl resultado debe provocar que quien vea la imagen sienta que su producto literalmente le está llamando.\nPrioriza siempre la calidad visual, el realismo y la fidelidad al producto original."},
 {"n": "24", "nombre": "La mano que rompe el papel", "desc": "Una mano atraviesa un papel rasgado para presentarte tu producto, con fondo en los colores de tu marca. Luce con joyería, comida y cosméticos.", "img": "img/estilos/24-mano-papel-rasgado.webp", "hover": "img/estilos/24-mano-papel-rasgado-ejemplo.webp", "fotos": 1, "colores": true, "prompt": "PROMPT MAESTRO — PRODUCTO EN ESCENA 3D CON EFECTO RASGADO\nActúa como director creativo y fotógrafo especializado en publicidad de productos de marcas premium.\nVoy a subir una fotografía de mi producto. Utilízala como referencia y crea una imagen publicitaria hiperrealista siguiendo el concepto visual de una mano que atraviesa una superficie de papel rasgado para presentar un producto.\nNO ME HAGAS PREGUNTAS. GENERA DIRECTAMENTE LA IMAGEN.\n1. PRODUCTO ORIGINAL\nAnaliza automáticamente el producto que subí.\nRespeta fielmente:\n\n* Su forma y dimensiones.\n* Sus colores originales.\n* Su marca y logotipo.\n* Sus etiquetas y tipografías.\n* Sus materiales y acabados.\n* Su presentación comercial.\n\nNo inventes ni sustituyas el producto.\n2. CONCEPTO VISUAL\nCrea una escena publicitaria donde:\n\n* Una mano humana realista emerge desde un agujero rasgado en una superficie.\n* La mano sostiene y presenta mi producto hacia la cámara.\n* El producto aparece en primer plano y es el protagonista.\n* Los dedos sujetan el objeto de manera natural y anatómicamente correcta.\n* El papel tiene bordes irregulares, pliegues y sombras que generan profundidad 3D.\n\nLa mano debe interactuar físicamente con el producto.\n3. ADAPTACIÓN AUTOMÁTICA\nSelecciona la mejor manera de presentar el producto según su categoría:\n\n* Alimentos: una mano sosteniendo el alimento de manera apetitosa, mostrando texturas, ingredientes y detalles.\n* Joyería: dedos delicados mostrando la pieza, con caída natural y reflejos elegantes.\n* Cosméticos: mano sosteniendo el envase o aplicador.\n* Bebidas: mano sujetando el recipiente con una perspectiva atractiva.\n* Tecnología: mano mostrando el dispositivo con una pose natural.\n* Moda y accesorios: mano presentando el artículo de manera editorial.\n* Productos para el hogar: mano mostrando el producto de forma clara y comercial.\n\nNo utilices una pose genérica para todos los productos.\n4. FONDO Y COLORES\nCrea un fondo de color sólido o degradado con los colores de mi marca: [COLORES DE MI MARCA].\nUsa dos o tres de esos colores, con suficiente contraste para que destaque el producto.\nSi los colores de mi marca no combinan con el producto, elige una paleta que lo complemente, por ejemplo:\n\n* Vino y rosa.\n* Beige y café.\n* Negro y dorado.\n* Azul y blanco.\n* Verde y crema.\n* Tonos pastel sofisticados.\n\nEl papel rasgado debe integrarse visualmente con el fondo, manteniendo una apariencia realista.\n5. ESTILO FOTOGRÁFICO\n\n* Fotografía publicitaria hiperrealista.\n* Primer plano comercial.\n* Iluminación profesional de estudio.\n* Sombras naturales.\n* Texturas detalladas.\n* Profundidad de campo.\n* Perspectiva realista.\n* Acabado premium.\n* Efecto tridimensional.\n\n6. MANOS Y PRODUCTO\n\n* Anatomía correcta.\n* Dedos proporcionados.\n* Uñas cuidadas y naturales.\n* Agarre físicamente creíble.\n* Producto completamente reconocible.\n* Reflejos y sombras coherentes.\n* Sin deformaciones ni elementos duplicados.\n\nPara joyería, utiliza una presentación fina y sofisticada, nunca excesivamente ostentosa.\n7. FORMATO FINAL\n\n* Vertical 2:3.\n* Fotografía publicitaria de alta calidad.\n* Producto en primer plano.\n* Composición limpia y visualmente impactante.\n* Sin textos publicitarios adicionales.\n* Sin marcas de agua.\n\nINSTRUCCIÓN FINAL\nCada vez que suba un producto diferente, adapta automáticamente la mano, la pose, la iluminación y la manera de presentar el producto, siempre con los colores de mi marca.\nConserva el concepto principal: una mano que atraviesa una superficie rasgada para presentar el producto.\nEl resultado debe parecer una campaña publicitaria profesional de una marca internacional.\nGENERA DIRECTAMENTE LA IMAGEN FINAL. NO ME ENTREGUES OTRO PROMPT NI UNA EXPLICACIÓN."},
 {"n": "25", "nombre": "Remolino de luz", "desc": "Tu producto flota en medio de un remolino de luz y movimiento, con colores que lo hacen resaltar. Ideal para moda, calzado y accesorios.", "img": "img/estilos/25-remolino.webp", "hover": "img/estilos/25-remolino-ejemplo.webp", "fotos": 1, "colores": true, "prompt": "PROMPT MAESTRO — PRODUCTO EN REMOLINO 3D\nActúa como director creativo y fotógrafo especializado en campañas publicitarias de productos de lujo, fotografía conceptual y composiciones comerciales de alto impacto.\nUtiliza la fotografía del producto que acabo de subir como referencia principal.\nCrea una imagen publicitaria hiperrealista con el producto flotando en el centro de un espectacular remolino circular de luz, color y movimiento.\n1. PRODUCTO PROTAGONISTA\nColoca mi producto en el centro de la composición, flotando en el aire.\n\n* Conserva fielmente su forma, dimensiones, materiales, colores y acabados.\n* No cambies su diseño original.\n* No inventes etiquetas, logotipos ni accesorios.\n* Muéstralo desde un ángulo de tres cuartos que permita apreciar sus características.\n* Haz que tenga volumen, profundidad y presencia.\n* El producto debe estar perfectamente enfocado y ser el elemento más importante.\n\n2. REMOLINO DE COLORES\nConstruye alrededor del producto un remolino circular tridimensional, como un túnel de energía en movimiento.\nEl remolino debe:\n\n* Rodear completamente el producto.\n* Crear una sensación de velocidad y movimiento.\n* Tener múltiples capas de luz y color.\n* Combinar trazos luminosos, reflejos y partículas.\n* Generar profundidad y perspectiva.\n* Crear un efecto de larga exposición fotográfica.\n\n3. COLORES INTELIGENTES\nAnaliza automáticamente los colores del producto y diseña una paleta de contraste.\nSi contrastan bien con el producto, incluye en el remolino los colores de mi marca: [COLORES DE MI MARCA].\nReglas:\n\n* No utilices exactamente los mismos colores del producto en todo el fondo.\n* Selecciona dos o tres colores complementarios o contrastantes.\n* Crea una combinación sofisticada y atractiva.\n* Utiliza degradados luminosos y reflejos metálicos.\n* El fondo debe hacer que el producto destaque inmediatamente.\n\nEjemplos:\n\n* Producto café: dorado, crema y chocolate.\n* Producto azul: naranja, ámbar y azul eléctrico.\n* Producto verde: magenta, violeta y negro.\n* Producto rosa: verde profundo, dorado y vino.\n* Producto negro: plata, azul eléctrico y blanco.\n\nAdapta siempre la combinación al producto real.\n4. ILUMINACIÓN\nUtiliza iluminación de estudio cinematográfica:\n\n* Luz principal sobre el producto.\n* Reflejos laterales.\n* Sombras naturales.\n* Iluminación volumétrica.\n* Brillos controlados.\n* Contraste dramático.\n\n5. ESTÉTICA VISUAL\nEl resultado debe parecer una campaña publicitaria internacional de una marca premium.\nCombina:\n\n* Fotografía comercial de producto.\n* Efectos de larga exposición.\n* Composición tridimensional.\n* Movimiento circular dinámico.\n* Estética futurista y editorial.\n* Realismo fotográfico extremo.\n\n6. REGLAS OBLIGATORIAS\n\n* Un solo producto protagonista.\n* No agregues productos adicionales.\n* No cambies su diseño.\n* No inventes marcas.\n* No deformes sus proporciones.\n* No agregues textos ni precios.\n* No coloques el producto sobre una superficie.\n* Debe parecer que flota en medio del remolino.\n\nRESULTADO FINAL\nFotografía vertical 9:16, resolución 1080 × 1920, máxima calidad, hiperrealista, producto perfectamente definido y fondo con movimiento circular espectacular.\nCada imagen debe tener una combinación de colores diferente, seleccionada inteligentemente para contrastar con el producto que el usuario haya subido."},
 {"n": "26", "nombre": "Presume tu producto", "desc": "Alguien presume tu producto mientras otra persona le toma foto con el celular. Se siente real y espontáneo. Funciona hasta con mascotas.", "img": "img/estilos/26-presume-tu-producto.webp", "hover": "img/estilos/26-presume-tu-producto-ejemplo.webp", "fotos": 1, "colores": true, "prompt": "PROMPT MAESTRO — PRESUME TU PRODUCTO | SOCIAL LIFESTYLE PHOTOGRAPHY\nActúa como director creativo, fotógrafo publicitario y especialista en fotografía lifestyle hiperrealista.\nVoy a subir una fotografía de mi producto. Quiero que crees una imagen publicitaria siguiendo este concepto:\nUna persona está presumiendo su producto mientras otra persona le toma una fotografía con su celular.\nNO ME HAGAS PREGUNTAS. GENERA DIRECTAMENTE LA IMAGEN.\n1. ANALIZA MI PRODUCTO\nIdentifica automáticamente:\n\n* Qué producto es.\n* Su categoría comercial.\n* Su tamaño y proporciones.\n* Sus colores y materiales.\n* Su marca, logotipo y características.\n* La mejor manera de sostenerlo o mostrarlo.\n\nUtiliza mi fotografía como referencia principal.\n2. COMPOSICIÓN PRINCIPAL\nRecrea una escena fotográfica espontánea con dos elementos protagonistas:\nPRIMER PLANO:\nUna mano sostiene mi producto de manera natural, mostrándolo claramente hacia la cámara.\nSEGUNDO ELEMENTO:\nOtra mano sostiene un smartphone y está tomando una fotografía del producto.\nLa pantalla del celular debe mostrar el mismo producto que aparece en primer plano, con una perspectiva coherente.\nEl teléfono debe tener una interfaz de cámara realista, sin textos extraños ni elementos deformados.\nLa funda del celular debe ser del color principal de mi marca: [COLORES DE MI MARCA].\n3. ADAPTACIÓN AUTOMÁTICA\nAdapta la escena dependiendo del producto:\n\n* Alimentos: una persona presume el platillo o bebida recién preparada.\n* Mascotas: una persona muestra al animal luciendo su accesorio.\n* Pádel y deportes: alguien presume su pala, raqueta o equipo.\n* Joyería: una mano presenta el collar, anillo o pulsera.\n* Tecnología: alguien muestra un dispositivo.\n* Belleza: una persona presume un cosmético.\n* Moda: alguien muestra zapatos, bolsas o accesorios.\n* Bebidas: alguien sostiene su vaso o botella.\n\nSi el producto necesita una persona, mascota, superficie o contexto para presentarse correctamente, incorpóralos de manera natural.\nNo fuerces todos los productos a tener la misma pose.\n4. FONDO Y ESCENARIO\nSelecciona automáticamente un lugar que tenga sentido para el producto.\nEjemplos:\n\n* Productos deportivos: cancha o espacio deportivo.\n* Alimentos: calle, cafetería o entorno gastronómico.\n* Mascotas: parque o calle.\n* Joyería: entorno urbano elegante.\n* Tecnología: ciudad o espacio contemporáneo.\n* Moda: calle moderna o entorno arquitectónico.\n\nEl fondo debe ser diferente y estar ligeramente desenfocado.\nEvita escenarios demasiado cargados. El producto siempre debe destacar.\n5. FOTOGRAFÍA\n\n* Estilo lifestyle editorial.\n* Fotografía espontánea y natural.\n* Perspectiva en primera persona.\n* Profundidad de campo realista.\n* Luz natural.\n* Desenfoque de fondo.\n* Texturas auténticas.\n* Manos anatómicamente correctas.\n* Smartphone realista.\n* Reflejos y sombras naturales.\n\nDebe parecer una fotografía tomada en la vida real, no un render 3D.\n6. CONSERVA EL PRODUCTO\nREGLAS OBLIGATORIAS:\n\n* No cambies su diseño.\n* No inventes marcas.\n* No alteres colores.\n* No deformes logotipos.\n* No sustituyas el producto.\n* Respeta sus dimensiones reales.\n* Conserva empaques, etiquetas y detalles originales.\n\nSi el producto tiene una marca visible, haz lo posible por mantenerla fiel a la referencia.\n7. FORMATO FINAL\n\n* Vertical 2:3.\n* Fotografía hiperrealista.\n* Composición comercial premium.\n* Producto claramente visible.\n* Smartphone mostrando el mismo producto.\n* Sin textos publicitarios agregados.\n* Sin marcas de agua.\n\nINSTRUCCIÓN FINAL\nCada vez que suba un producto diferente, adapta automáticamente el entorno, la persona, la pose, la manera de sostenerlo y el contexto.\nMantén siempre el concepto visual de una persona presumiendo su producto mientras otra lo fotografía con su celular.\nGENERA DIRECTAMENTE LA IMAGEN FINAL. NO ME HAGAS PREGUNTAS NI ME ENTREGUES OTRO PROMPT."},
 {"n": "27", "nombre": "Flotando entre manos", "desc": "Tu producto flota sobre fondo blanco entre dos manos desenfocadas, como si alguien estuviera a punto de tomarlo. Minimalista y de lujo.", "img": "img/estilos/27-flotante-entre-manos.webp", "hover": "img/estilos/27-flotante-entre-manos-ejemplo.webp", "fotos": 2, "prompt": "PROMPT MAESTRO — PRODUCTO FLOTANTE PREMIUM\nUtiliza la imagen de referencia como inspiración para la composición y utiliza la fotografía que voy a subir como referencia de MI PRODUCTO.\nQuiero crear una fotografía publicitaria hiperrealista donde mi producto sea el protagonista y aparezca flotando en el centro de la escena.\n1. MI PRODUCTO\n\n* Sustituye el objeto de referencia por el producto de mi fotografía.\n* Respeta fielmente su diseño, forma, dimensiones, colores, materiales, texturas, empaque, etiquetas y logotipos.\n* No inventes ni cambies la marca.\n* No deformes el producto.\n* Mantén todos sus detalles originales.\n\n2. COMPOSICIÓN VISUAL\n\n* Coloca mi producto flotando en el centro de la imagen.\n* En la parte superior debe aparecer una mano desenfocada que se acerque al producto, como si estuviera a punto de tomarlo.\n* En la parte inferior debe aparecer otra mano desenfocada, como si estuviera sosteniendo o recibiendo el producto.\n* El producto debe permanecer perfectamente enfocado y ser el único protagonista.\n* Genera una sensación de suspensión, profundidad y movimiento natural.\n\n3. TAMAÑO Y PROPORCIONES\n\n* Ajusta el tamaño del producto según sus dimensiones reales.\n* No lo hagas demasiado grande ni demasiado pequeño.\n* Deja suficiente espacio blanco alrededor.\n* Mantén una distancia visual amplia entre las manos y el producto.\n* El producto debe verse elegante, bien definido y claramente reconocible.\n\n4. ESTILO FOTOGRÁFICO\n\n* Fondo blanco limpio, minimalista y luminoso.\n* Manos con desenfoque artístico (efecto bokeh).\n* Profundidad de campo reducida.\n* Iluminación suave de estudio.\n* Sombras sutiles y ref function pintarCuenta() {
  document.querySelectorAll('[data-cuenta]').forEach(el => {
    if (!SESION.inicio) {
      if (!SESION.fecha) { el.innerHTML = '<b>📅 Fecha y hora por confirmar</b>'; return; }
      const dias = Math.ceil((new Date(SESION.fecha + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);
      el.innerHTML = `<small>LA CLASE ES EL</small><div class="cuenta-fecha">Jueves 3 de diciembre</div><div class="cuenta-n"><span><b>${String(Math.max(0, dias)).padStart(2, '0')}</b><i>${dias === 1 ? 'día' : 'días'}</i></span></div><p class="cuenta-hora">${SESION.hora ? esc(SESION.hora) : 'Hora por confirmar'}</p>`;
      return;
    }
    const ms = new Date(SESION.inicio) - Date.now();
    if (ms <= 0) { el.innerHTML = '<b>🔴 ¡La clase ya comenzó! Entra a la sesión.</b>'; return; }
    const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3);
    el.innerHTML = `<small>JUEVES 3 DE DICIEMBRE · 11:00 A.M. (HORA DEL CENTRO DE MÉXICO) · EMPIEZA EN</small><div class="cuenta-n">${[[d, 'días'], [h, 'horas'], [m, 'min'], [s, 'seg']].map(([v, l]) => `<span><b>${String(v).padStart(2, '0')}</b><i>${l}</i></span>`).join('')}</div>`;
  });
}

let ENVIVO = false;

let ULT_IR; // undefined = aún no leída; luego guarda la marca de la última orden de mover

/* Solo para pruebas en la computadora (localhost): no pide la clave, no guarda en el servidor y no lee el estado del servidor.
   Así la clase en vivo real no se mueve por pruebas. Se quita al terminar el sitio, junto con los accesos y el pago. */
function pruebaLocalSinClave() {
  return /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
}
async function escribirEnVivo(on, ir) {
  if (pruebaLocalSinClave()) return true;
  let t = ''; try { t = (localStorage.getItem('jefeshub_storage_token') || '').trim(); } catch (e) {}
  if (!t) { t = (window.prompt('Token de acceso para guardar cambios:') || '').trim(); if (!t) return false; try { localStorage.setItem('jefeshub_storage_token', t); } catch (e) {} }
  const value = { on: on, t: new Date().toISOString() };
  // Si no hay orden nueva, conservamos la última: si no, prender/apagar la clase borra la orden que los alumnos aún no reciben
  if (ir) value.ir = ir;
  else { const prev = await leerValor(); if (prev && prev.ir) value.ir = prev.ir; }
  try {
    const r = await fetch(VIVO_KV, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Storage-Token': t }, body: JSON.stringify({ value: value }) });
    if (r.status === 401) { try { localStorage.removeItem('jefeshub_storage_token'); } catch (e) {} return false; }
    return r.ok;
  } catch (e) { return false; }
}

/* Botón de audio de los alumnos: pide al cuadro de Zoom que se una al audio de la computadora (un solo clic) */
function tallerActivarAudio(btn) {
  const f = document.querySelector('.zoom-vivo');
  let intentos = 0;

  // Espera hasta ~20 segundos a que la clase cargue, en lugar de pedir que lo toquen otra vez
  const intentar = () => {
    const z = f && f.contentWindow && f.contentWindow.tallerZoom;
    if (!z) {
      if (++intentos < 40) { setTimeout(intentar, 500); return; }
      btn.disabled = false; btn.textContent = 'La clase no cargó. Recarga la página';
      return;
    }
    // Primero usa el mismo botón de audio de Zoom; si no lo encuentra, prueba la función directa
    const hecho = z.audioNativo ? z.audioNativo() : false;
    if (hecho) {
      btn.textContent = '🔊 Audio activado';
      setTimeout(() => btn.remove(), 3000);
      return;
    }
    z.audio().then(() => {
      // Ya hay audio: el botón de audio se quita y aparece el de micrófono (solo si la alumna quiere hablar)
      const mic = document.createElement('button');
      mic.type = 'button'; mic.className = 'zoom-btn-audio'; mic.textContent = '🎤 Prender mi micrófono';
      mic.onclick = () => tallerPrenderMic(mic);

function route() {

  const [page, sub] = h.split('/');
  let html, activo = page;
  if (page.startsWith('clase-')) {
    const c = CLASES.find(x => x.id === page.slice(6));
    if (c) { html = claseBloq(c, c.mod) ? viewBloqueada(c) : viewClase(c); activo = c.id; }

  else if (page === 'en-vivo') html = viewEnVivo();

  $('#view').innerHTML = (MODO_PONENTE ? avisoPonente() : bannerVivo()) + html;
  medirTopbar();
  // La barra de arriba y el aviso cambian de alto al terminar de pintarse: se vuelve a medir para que la presentación pegada quede justo debajo
  requestAnimationFrame(medirTopbar); setTimeout(medirTopbar, 400);
  ajustarPanelesLinea();
  if (window.GuiaMetricas) window.GuiaMetricas.montar();
  pintarCuenta(); pintarRecordatorios();
  renderNav(activo);
  refrescarRespuestas();
  document.body.classList.remove('menu-open');
  const target = sub && document.getElementById(sub);
  if (target) target.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
}

const MARCA_TOKEN = '[COLORES DE MI MARCA]';
const marcaColores = () => { try { return JSON.parse(localStorage.getItem(KEY + '-marca')) || []; } catch (e) { return []; } };
const LETRA_TOKEN = '[LETRA DE MI MARCA]';
const marcaLetra = () => { try { return JSON.parse(localStorage.getItem(KEY + '-letra')) || null; } catch (e) { return null; } };
const conMarca = t => { const c = marcaColores(), l = marcaLetra(); if (c.length) t = t.split(MARCA_TOKEN).join(c.map(x => x.toUpperCase()).join(', ')); if (l && l.desc) t = t.split(LETRA_TOKEN).join(l.desc); return t; };
window.addEventListener('message', ev => { const d = ev.data; if (d && d.taller === 'marca' && Array.isArray(d.colores)) { try { localStorage.setItem(KEY + '-marca', JSON.stringify(d.colores.filter(c => /^#[0-9a-f]{6}$/i.test(c)).slice(0, 6))); if (d.tipografia && d.tipografia.desc) localStorage.setItem(KEY + '-letra', JSON.stringify({ estilo: String(d.tipografia.estilo || '').slice(0, 40), desc: String(d.tipografia.desc).slice(0, 160) })); } catch (e) {} } });
function abrirEstilo(j) {
  const esVideo = String(j).startsWith('v'), x = esVideo ? VIDEOS_IA[+String(j).slice(1)] : ESTILOS_IMAGEN[+j]; if (!x) return;
  const cols = marcaColores(), letra = marcaLetra(), txt = x.colores ? conMarca(x.prompt) : x.prompt, usaLetra = x.prompt.includes(LETRA_TOKEN);
  const notaColores = !x.colores ? '' : cols.length
    ? `<div class="estilo-marca">🎨 Este prompt ya trae los colores de tu marca: ${cols.map(c => `<i style="background:${esc(c)}"></i>`).join('')}</div>`
    : `<div class="estilo-marca">🎨 Este prompt usa los colores de tu marca. Escríbelos donde dice <mark>${MARCA_TOKEN}</mark>, o sube tu logo arriba en «Tu logo y tus colores» y vuelve a abrir este estilo.</div>`;
  const notaLetra = !usaLetra ? '' : letra ? `<div class="estilo-marca">🔤 El texto va con la letra de tu marca: estilo ${esc(letra.estilo)}.</div>` : `<div class="estilo-marca">🔤 Este prompt usa la letra de tu marca. Elígela en tu brief del Pre, o describe cómo la quieres donde dice <mark>${LETRA_TOKEN}</mark>.</div>`;
  const m = document.createElement('div');
  m.className = 'estilo-modal';
  m.innerHTML = `<div class="estilo-ventana" role="dialog" aria-modal="true" aria-label="${esc(x.nombre)}">
    <button type="button" class="estilo-cerrar" data-cerrar-estilo aria-label="Cerrar">✕</button>
    <div class="estilo-v-top">${x.video ? `<video src="${esc(x.video)}" poster="${esc(x.img)}" muted loop playsinline autoplay controls></video>` : `<img src="${esc(x.img)}" alt="">`}<div><small>${x.video ? 'VIDEO' : 'ESTILO'} ${esc(x.n)}</small><h3>${esc(x.nombre)}</h3><p>${esc(x.desc)}</p>
      <ol class="estilo-pasos">${x.pasos ? x.pasos : x.fotos === 3 ? '<li>Descarga la foto base y ten a la mano tu logo.</li><li>En ChatGPT sube en este orden: la foto de tu producto, tu logo y la foto base.</li>' : x.fotos === 2 ? '<li>Descarga la foto base.</li><li>En ChatGPT sube primero la foto base y después la de tu producto.</li>' : '<li>En ChatGPT sube la foto de tu producto.</li>'}${x.pasoFinal === false ? '' : '<li>Copia el prompt, pégalo y envía.</li>'}</ol>
      ${x.fotos >= 2 && !x.sinBase ? `<a class="chip-btn" href="${esc(x.img)}" download="estilo-${esc(x.n)}-foto-base${esc(x.img.slice(x.img.lastIndexOf('.')))}">⬇ Descargar foto base</a>` : ''}</div></div>
    ${notaColores}${notaLetra}
    ${x.previo ? `<div class="prompt open"><div class="prompt-head"><b>${esc(x.previo.nombre)}</b><button class="copy" data-copy><svg><use href="#i-copy"/></svg><span>Copiar prompt</span></button></div><pre data-raw="${esc(conMarca(x.previo.texto))}">${marcar(conMarca(x.previo.texto))}</pre></div>` : ''}
    <div class="prompt open"><div class="prompt-head"><b>${x.previo ? '2 · Tu video (Gemini Veo)' : esc(x.nombre)}</b><button class="copy" data-copy><svg><use href="#i-copy"/></svg><span>Copiar prompt</span></button></div><pre data-raw="${esc(txt)}">${x.colores ? marcar(txt) : esc(txt)}</pre></div>
  </div>`;
  document.body.appendChild(m);
  document.body.classList.add('modal-abierto');
}
function cerrarEstilo() { document.querySelectorAll('.estilo-modal').forEach(m => m.remove()); document.body.classList.remove('modal-abierto'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarEstilo(); });

document.addEventListener('click', e => {
  const est = e.target.closest('[data-estilo]');
  if (est) { abrirEstilo(est.dataset.estilo); return; }
  if (e.target.closest('[data-cerrar-estilo]') || e.target.classList.contains('estilo-modal')) { cerrarEstilo(); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    const raw = cp.closest('.prompt').querySelector('pre').dataset.raw;
    navigator.clipboard.writeText(raw).then(() => { cp.classList.add('ok'); cp.querySelector('span').textContent = '¡Copiado!'; toast('Prompt copiado'); setTimeout(() => { cp.classList.remove('ok'); cp.querySelector('span').textContent = 'Copiar prompt'; }, 1800); });
    return;
  }
  const ex = e.target.closest('[data-expand]');
  if (ex) { const p = ex.closest('.prompt'); p.classList.toggle('open'); ex.textContent = p.classList.contains('open') ? 'Ver menos ⌃' : 'Ver prompt completo ⌄'; return; }
  if (e.target.closest('[data-copyall]')) {
    const txt = [...document.querySelectorAll('.prompt')].map(p => '## ' + (p.querySelector('.prompt-head b') || p.querySelector('b')).textContent + '\n' + p.querySelector('pre').dataset.raw).join('\n\n');
    navigator.clipboard.writeText(txt).then(() => toast('Todos los prompts copiados'));
    return;
  }
  const d = e.target.closest('[data-done]');
  if (d) {
    const id = d.dataset.done, go = d.dataset.go;
    if (d.classList.contains('btn') && done[id]) { location.hash = go ? '#clase-' + go : '#inicio'; return; }
    done[id] = !done[id] || d.classList.contains('btn'); save();
    toast(done[id] ? '¡Clase completada! 🎉' : 'Marcada como pendiente');
    const y = window.scrollY; route(); window.scrollTo(0, y);
    return;
  }
  if (e.target.closest('#menuBtn')) { document.body.classList.toggle('menu-open'); return; }
  if (document.body.classList.contains('menu-open') && !e.target.closest('aside')) document.body.classList.remove('menu-open');
});

/* Buscador: clases, etapas y prompts */
const q = $('#q'), qres = $('#qres');
q.addEventListener('input', () => {
  const t = q.value.trim().toLowerCase();
  if (t.length < 2) { qres.classList.remove('on'); return; }
  const hits = [];
  CLASES.forEach(c => {
    if ((c.titulo + ' ' + c.resumen).toLowerCase().includes(t)) hits.push({ href: '#clase-' + c.id, txt: `Clase ${c.id} · ${c.titulo}` });
    c.etapas.forEach((e, k) => {
      const blob = (e.titulo + ' ' + e.texto + ' ' + (e.prompts || []).map(p => p.nombre + ' ' + p.texto).join(' ')).toLowerCase();
      if (blob.includes(t)) hits.push({ href: `#clase-${c.id}/etapa-${k + 1}`, txt: `Clase ${c.id} › ${e.titulo}` });
    });
  });
  const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  qres.innerHTML = hits.length ? hits.slice(0, 8).map(h => `<a href="${h.href}">${esc(h.txt).replace(re, '<b>$1</b>')}</a>`).join('') : '<div class="none">Sin resultados</div>';
  qres.classList.add('on');
});
qres.addEventListener('click', () => { q.value = ''; qres.classList.remove('on'); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); document.body.classList.add('menu-open'); q.focus(); } if (e.key === 'Escape') { q.blur(); qres.classList.remove('on'); } });

iniciarRemoto();
route();

revisarEstado().then(() => { if (ENVIVO && !location.hash) location.hash = '#en-vivo'; });
</script>
