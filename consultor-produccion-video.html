<!DOCTYPE html>
<html lang="es">
<head>
<script src="/js/hub-tenant.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jefe Productor IA — JefesHub</title>
<link rel="icon" type="image/png" href="/img/fav/jefe-produccion-video.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Piel clara = mismos tokens que Jefe 366, Jefe de Contenido y Jefe de Anuncios */
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F3F3F3;
    --line:#E2E2E2;
    --text:#1A1A1A;
    --text-dim:#5F5F5F;
    --accent:#C0F800;
    --accent-soft:#F1FFC2;
    --accent-text:#4E7A00;
    --navy:#10103A;
    --shadow-card:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06);
    --shadow-pop:0 12px 32px rgba(0,0,0,.14);
    --adq:#6366F1;--adq-soft:#EEF0FF;
    --con:#0EA5E9;--con-soft:#E6F4FD;
    --conv:#16A34A;--conv-soft:#E6F8EC;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;padding:28px 16px 80px;}
  h1,h2,.display{font-family:'Sora',sans-serif;}
  .wrap{max-width:1400px;margin:0 auto;}
  .page-header{text-align:center;padding-top:62px;}
  h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin:0 0 8px;line-height:1.15;}
  /* Barra fija: se queda visible arriba al hacer scroll (pill + nombre del Jefe) */
  .topbar{position:fixed;top:0;left:0;right:0;height:70px;z-index:60;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);}
  .topbar h1{justify-self:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:clamp(20px,2.6vw,28px);}
  .back-link{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;color:var(--text-dim);text-decoration:none;padding:7px 16px;border:1px solid var(--line);border-radius:100px;background:var(--surface);transition:.15s;}
  .back-link:hover{border-color:var(--accent);color:var(--accent-text);}
  /* Scrollbar delgada y discreta */
  *{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.22) transparent;}
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:8px;}
  *::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.36);}

  /* BOTONES */
  .btn-outline{font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;padding:10px 16px;border-radius:12px;cursor:pointer;border:1px solid #CFCFCF;background:var(--surface);color:#333;transition:.15s;}
  .btn-outline:hover{border-color:var(--accent-text);color:var(--accent-text);}
  .link-btn{background:none;border:none;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:underline;padding:2px 4px;}
  .link-btn:hover{color:var(--accent-text);}
  .mode-status{font-size:14.5px;font-family:'Inter',sans-serif;color:var(--text-dim);}
  .mode-status.error{color:#C62828;}

  /* BUSCADOR GRANDE del Jefe (mismo formato que Contenido y Anuncios) */
  /* PRÓXIMOS POSTS E HISTORIAS (vienen del Jefe de Contenido) */
  .px-trabajo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding:12px 18px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:22px;}
  .px-trabajo[hidden]{display:none;}
  .px-trabajo-txt{display:flex;flex-direction:column;min-width:0;}
  .px-trabajo-lbl{font-size:12.5px;font-weight:700;color:var(--accent-text);text-transform:uppercase;letter-spacing:.06em;}
  .px-trabajo-txt strong{font:800 16px 'Sora',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .px-trabajo-btns{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .px-btn{border:1.5px solid var(--text);background:var(--surface);color:var(--text);font:700 14px 'Sora',sans-serif;padding:8px 14px;border-radius:100px;cursor:pointer;transition:.15s;}
  .px-btn:hover{background:var(--text);color:var(--accent);}
  .px-confirm{flex:1 1 100%;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:14px 16px;}
  .px-confirm-t{font-size:14.5px;line-height:1.45;}
  .px-confirm-txt{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:500 15px 'Inter',sans-serif;line-height:1.5;resize:vertical;outline:none;color:var(--text);}
  .px-confirm-sub{font-weight:700;margin-top:2px;}
  .px-logo-tip{background:#FFF8D6;border-radius:12px;padding:9px 12px;font-size:13.5px;}
  .px-confirm-sub span{font-weight:500;color:var(--text-dim);}
  .px-confirm-cambios{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:500 14.5px 'Inter',sans-serif;resize:vertical;outline:none;color:var(--text);}
  .px-confirm-btns{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .px-btn-ok{background:var(--accent);border-color:var(--accent);color:#1A1A1A;}
  .px-prox{max-width:1100px;margin:0 auto 28px;}
  .px-prox[hidden]{display:none;}
  .px-ayuda{text-align:center;color:var(--text-dim);font-size:15px;margin-bottom:14px;}
  .px-sec{margin-bottom:18px;}
  .px-sec-tit{font:800 clamp(18px,2.2vw,22px) 'Sora',sans-serif;margin-bottom:10px;}
  .px-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;}
  .px-card{display:flex;flex-direction:column;text-align:left;padding:0;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);cursor:pointer;font-family:'Inter',sans-serif;transition:.15s;}
  .px-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.10);}
  .px-card.on{border-color:var(--text);box-shadow:0 0 0 3px var(--accent);}
  .px-thumb{position:relative;display:flex;align-items:center;justify-content:center;height:84px;background:linear-gradient(135deg,var(--a),var(--b));}
  .px-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .px-ico{font-size:28px;opacity:.7;}
  .px-nuevo{position:absolute;right:8px;top:8px;background:#1A1A1A;color:var(--accent);font:800 11px 'Sora',sans-serif;padding:3px 9px;border-radius:100px;}
  .px-tit{padding:10px 12px 4px;font:700 14px/1.35 'Inter',sans-serif;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em;}
  .px-pie{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 12px 12px;}
  .px-pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:100px;background:var(--surface-2);color:var(--text);}
  .px-fecha{font-size:12.5px;color:var(--text-dim);}
  @media (max-width:1100px){
    .px-row{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;}
    .px-card{flex:0 0 min(60vw,200px);scroll-snap-align:start;}
  }
  .chat-hero{display:flex;flex-direction:column;align-items:stretch;margin:0 auto 24px;max-width:900px;}
  .hero-search{display:flex;align-items:center;gap:12px;width:100%;margin:0 auto 10px;padding:8px 10px 8px 18px;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:34px;box-shadow:0 8px 30px rgba(0,0,0,.10);transition:border-color .18s,box-shadow .18s;text-align:left;}
  .hero-search:focus-within{border-color:var(--accent);box-shadow:0 8px 30px rgba(0,0,0,.10),0 0 0 4px rgba(192,248,0,.28);}
  .hero-lupa{flex:0 0 auto;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .hero-lupa svg{width:23px;height:23px;}
  .hero-search-sep{flex:0 0 1px;align-self:stretch;margin:12px 0;background:var(--line);}
  .hero-search textarea{flex:1 1 auto;min-width:0;background:transparent;border:none;outline:none;resize:none;color:var(--text);font-family:'Inter',sans-serif;font-size:17.5px;line-height:1.45;padding:11px 0;max-height:260px;}
  .hero-search textarea::placeholder{color:var(--text-dim);opacity:.85;}
  .hero-search-send{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#1A1A1A;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
  .hero-search-send img{width:30px;height:auto;max-height:28px;object-fit:contain;display:block;}
  .hero-search-send:hover{transform:scale(1.08);}
  .hero-search-send:disabled{opacity:.5;cursor:wait;}
  .hero-meta{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;min-height:22px;margin-bottom:6px;}

  /* Interruptor Guía / Crear imagen (dentro del mismo buscador) */
  .modo-switch{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;}
  .modo-pill{padding:9px 20px;border-radius:100px;border:none;font-family:'Sora',sans-serif;font-weight:800;font-size:14px;cursor:pointer;background:var(--surface-2);color:#333;transition:.15s;}
  .modo-pill:hover{background:#E8E8E8;}
  .modo-pill.on{background:var(--accent);color:#1A1A1A;}

  /* ── Chat al estilo del Jefe 366 (tarjeta con el campo de escribir abajo) ── */
  .px-bar-wrap{position:relative;}
  .px-composer .hero-search{margin-bottom:6px;}
  .px-composer.en-chat .hero-search{margin:0 0 6px;min-height:52px;box-shadow:0 4px 16px rgba(0,0,0,.10);}
  .px-composer.en-chat .hero-meta{justify-content:flex-start;margin:0;min-height:18px;}
  .px-chat-box{position:relative;text-align:left;margin:6px 0 22px;}
  #px-chat-box [hidden]{display:none !important;}
  .px-chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 8px;}
  .px-chat-titulo{font:700 15px Sora,Inter,sans-serif;margin:0;color:#111827;}
  .px-chat-acc{display:flex;align-items:center;gap:10px;}
  .chat-min-btn{background:#FFFFFF;border:1px solid #D1D5DB;color:#374151;font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;}
  .chat-min-btn:hover{border-color:#9CA3AF;color:#111827;}
  #px-chat-box #chat-thread{background:#F8FAFC;border:1px solid #E5E7EB;border-radius:12px 12px 0 0;padding:12px 12px 4px;margin:0;max-height:62vh;min-height:110px;}
  #px-chat-box #chat-thread:empty{display:none;}
  #px-chat-box .bubble{font-size:15px;line-height:1.7;max-width:94%;padding:14px 16px;}
  #px-chat-box .bubble strong{font-weight:700;}
  .px-chat-foot{background:#F8FAFC;border:1px solid #E5E7EB;border-top:none;border-radius:0 0 12px 12px;padding:10px 12px 12px;}
  .px-typing{display:flex;align-items:center;gap:5px;width:fit-content;padding:14px 16px !important;}
  .px-typing span{width:7px;height:7px;border-radius:50%;background:#9CA3AF;animation:pxPunto 1.1s infinite ease-in-out;}
  .px-typing span:nth-child(2){animation-delay:.18s;}
  .px-typing span:nth-child(3){animation-delay:.36s;}
  @keyframes pxPunto{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

  /* Lista de sugerencias que se abre bajo el buscador (igual que en el Jefe de Contenido) */
  .sug-lista{position:absolute;top:calc(100% + 6px);left:12px;right:12px;z-index:40;display:flex;flex-direction:column;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 36px rgba(0,0,0,.16);text-align:left;}
  .sug-lista[hidden]{display:none;}
  .px-composer.en-chat .sug-lista{top:auto;bottom:calc(100% + 6px);}
  .sug-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:none;border-radius:14px;background:transparent;color:var(--text);font:500 16px 'Inter',sans-serif;text-align:left;cursor:pointer;}
  .sug-item svg{flex:0 0 auto;width:18px;height:18px;color:var(--text-dim);}
  .sug-item:hover,.sug-item.on{background:var(--surface-2);}
  .sug-post{padding:8px 14px;}
  .sug-post .sug-mini{flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;width:56px;height:40px;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,var(--a),var(--b));font-size:18px;}
  .sug-post .sug-mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .sug-post .sug-txt{display:flex;flex-direction:column;min-width:0;flex:1 1 auto;}
  .sug-post .sug-txt b{font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sug-post .sug-txt small{font-size:12.5px;color:var(--text-dim);}
  .bubble-post{display:block;margin-bottom:4px;font-size:12.5px;font-weight:600;opacity:.75;}
  .sug-sep{margin:4px 14px;border-top:1px solid var(--line);}

  /* "Trabajando en": Ver post (características) · Imagen (pronto) · Prompt de video */
  .px-progreso{flex:1 0 100%;display:flex;flex-direction:column;gap:10px;}
  .px-pasos{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;width:100%;padding:6px 0 2px;}
  .px-paso{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;border:none;background:none;cursor:pointer;padding:0 2px;font:600 11.5px/1.2 ui-monospace,'SFMono-Regular',Menlo,monospace;text-transform:uppercase;letter-spacing:.02em;color:var(--text);text-align:center;}
  .px-paso::after{content:'';position:absolute;top:14px;left:calc(50% + 20px);right:calc(-50% + 20px);border-top:2px dashed #8aa13a;}
  .px-paso:last-child::after{display:none;}
  .px-paso-c{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#fff;border:2px dashed #8aa13a;color:#fff;font-size:16px;line-height:1;transition:.15s;}
  .px-paso.ok .px-paso-c{background:#0B6B54;border:2px solid #0B6B54;}
  .px-paso.sig .px-paso-c{border:2.5px solid var(--text);box-shadow:0 0 0 4px var(--accent);}
  .px-paso:hover .px-paso-c{transform:scale(1.1);}
  .px-trabajo{position:relative;padding-right:46px;}
  .px-quitar{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.07);color:var(--text);font-size:14px;cursor:pointer;}
  .px-quitar:hover{background:rgba(0,0,0,.15);}
  .px-falta{font-size:14px;color:var(--text);margin:0;}
  .px-falta b{font-weight:700;}
  .px-btn:disabled{opacity:.55;cursor:default;border-style:dashed;}
  .px-btn:disabled:hover{background:var(--surface);color:var(--text);}
  .px-detalle{flex:1 1 100%;margin-top:4px;padding-top:12px;border-top:1px dashed var(--accent-text);display:flex;flex-direction:column;gap:12px;}
  .px-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .px-chip{background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--text);}
  .px-chip b{color:var(--accent-text);font-weight:800;margin-right:4px;}
  .px-bloque{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;}
  .px-bloque-t{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-text);margin-bottom:3px;}
  .px-bloque p{margin:0;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow-y:auto;}

  /* GALERÍA de imágenes generadas */
  .imggen-result{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:10px;}
  .imggen-result:empty{display:none;}
  .imggen-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;width:min(300px,100%);box-shadow:var(--shadow-card);}
  .imggen-card img{width:100%;border-radius:12px;display:block;}
  .imggen-prompt{margin:0;font-size:13.5px;color:var(--text-dim);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
  .imggen-download{align-self:flex-start;font-family:'Sora',sans-serif;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:#1A1A1A;text-decoration:none;background:var(--accent);border-radius:100px;padding:8px 18px;}
  .imggen-download:hover{filter:brightness(.95);}
  .imggen-spinner{width:min(300px,100%);min-height:120px;border:1px dashed #C9C9C9;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:15px;background:var(--surface);}

  /* CAJAS DE CONTENIDO (calcado de etapa-box / item-card de Jefe de Anuncios) */
  .etapa-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-card);}
  .etapa-box.guion{border-left:5px solid var(--adq);}
  .etapa-box.grabacion{border-left:5px solid var(--con);}
  .etapa-box.edicion{border-left:5px solid var(--accent);}
  .etapa-title{font-family:'Sora',sans-serif;font-weight:800;font-size:21px;margin:0 0 6px;}
  .etapa-desc{color:var(--text-dim);font-size:15px;margin:0 0 14px;line-height:1.5;}
  .check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:6px 18px;margin-top:10px;}
  .check-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-size:16px;cursor:pointer;user-select:none;transition:background .12s;}
  .check-item:hover{background:var(--surface-2);}
  .check-item input{width:22px;height:22px;flex-shrink:0;accent-color:#4E7A00;cursor:pointer;margin:0;}
  .check-item input:checked + span{color:var(--text-dim);text-decoration:line-through;}
  .dur-panel{background:var(--accent);border-radius:28px;padding:20px 26px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow-card);color:#1A1A1A;}
  .dur-pill-white{background:#fff;color:#1A1A1A;font-family:'Sora',sans-serif;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.02em;padding:10px 22px;border-radius:100px;}
  .dur-pill-dark{background:#4B4B4B;color:var(--accent);font-family:'Sora',sans-serif;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.02em;padding:9px 20px;border-radius:100px;}

  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:18px;align-items:start;}
  .item-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--horizon,var(--adq));border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-card);}
  .item-title{font-family:'Sora',sans-serif;font-weight:800;font-size:18px;line-height:1.3;margin:0;}
  .res-dato{display:flex;flex-direction:column;gap:2px;}
  .res-dato span{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#3C5E00;}
  .res-dato p{margin:0;font-size:15.5px;line-height:1.5;}
  .seccion-intro{color:var(--text-dim);font-size:16px;margin:0 0 18px;}
  /* Módulos siempre abiertos, uno debajo del otro */
  .seccion{margin:0 0 44px;}
  .seccion-h{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(22px,3vw,28px);margin:0 0 18px;}
  /* Checklist plegable: se abre al picar el título y si no, queda oculto */
  .seccion-toggle{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:12px;text-align:left;}
  .seccion-toggle:hover{color:var(--accent-text);}
  .seccion-toggle:focus-visible{outline:2px solid var(--accent-text);outline-offset:4px;border-radius:8px;}
  .seccion-toggle .chev{font-size:.6em;display:inline-block;transition:transform .18s;}
  .seccion-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .seccion.cerrado{margin-bottom:30px;}

<script>
// ─── CLIENTE ID (detectado por pathname — Vercel no expone ?cliente= al browser) ───
function detectClienteId(){ return window.__hub.slug; }
const CLIENTE_ID = detectClienteId();
const CONVERSACION_KEY = CLIENTE_ID + ':jefe-diseno-conversacion';
const API = '/api/consultor-financiero';

function escHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
const $ = (id) => document.getElementById(id);
const esMovil = () => window.innerWidth < 720;

// ─── CONTENIDO DE REFERENCIA (pestañas) ────────────────────────────────────
const CHECK_GUION = ['Hook claro', 'Mensaje principal claro', 'CTA definido'];
const CHECK_GRABACION = ['Cámara limpia', 'Luz de frente', 'Fondo ordenado', 'Sonido claro', 'Teléfono en vertical'];

const FORMATOS = [
  { nombre: 'Hablando a cámara (Talking head)', ve: 'La persona habla directamente a la cámara explicando algo.', usar: 'Explicar ideas, consejos, historias o anuncios.' },
  { nombre: 'B-roll con narración', ve: 'Se muestran clips del producto, proceso o experiencia mientras alguien narra.', usar: 'Mostrar productos, servicios o experiencias.' },
  { nombre: 'Proceso + historia (Hands / proceso)', ve: 'Se muestra un proceso mientras alguien cuenta algo.', usar: 'Contenido relajado, storytelling o educativo.' },
  { nombre: 'Inteligencia artificial (avatar / voice AI)', ve: 'El video se genera con IA o usa voz generada narrando clips.', usar: 'Cuando no quieres grabarte o quieres escalar contenido.' },
  { nombre: 'Experiencia / POV', ve: 'Se graba como si el espectador estuviera viviendo la experiencia.', usar: 'Mostrar visitas, servicios, eventos o lugares.' },
];
const HORIZONTES = ['var(--adq)', 'var(--con)', 'var(--conv)', '#C0F800', 'var(--navy)'];

const CHECK_EDICION = ['1️⃣ Cortar silencios', '2️⃣ Agregar subtítulos', '3️⃣ Zoom ligero en partes importantes', '4️⃣ Música suave (opcional)'];

function renderChecklist(){
  const items = (lista) => lista.map((t) => `<label class="check-item"><input type="checkbox"><span>${escHtml(t)}</span></label>`).join('');
  return `
    <div class="etapa-box guion"><h2 class="etapa-title">Guion</h2><div class="check-grid">${items(CHECK_GUION)}</div></div>
    <div class="etapa-box grabacion"><h2 class="etapa-title">Grabación</h2><div class="check-grid">${items(CHECK_GRABACION)}</div></div>
    <div class="etapa-box edicion"><h2 class="etapa-title">✂️ Edición</h2><p class="etapa-desc" style="margin:0;">No necesitas efectos complejos. Solo estas 4 cosas:</p><div class="check-grid">${items(CHECK_EDICION)}</div></div>
    <div class="dur-panel">
      <span class="dur-pill-white">⏱️ Duración recomendada</span>
      <span class="dur-pill-dark">Ads: 15–30 seg</span>
      <span class="dur-pill-dark">Orgánico: 20–60 seg</span>
    </div>`;
}

function renderTipos(){
  return `<p class="seccion-intro">Elige el formato según lo que quieras lograr con el video.</p>
    <div class="cards-grid">${FORMATOS.map((f, i) => `
      <div class="item-card" style="--horizon:${HORIZONTES[i % HORIZONTES.length]}">
        <h3 class="item-title">${escHtml(f.nombre)}</h3>
        <div class="res-dato"><span>Cómo se ve</span><p>${escHtml(f.ve)}</p></div>
        <div class="res-dato"><span>Cuándo usarlo</span><p>${escHtml(f.usar)}</p></div>
      </div>`).join('')}</div>`;
}

// ─── MÓDULOS siempre abiertos (sin botones): Checklist · Apps · Tipos de grabación ───
function renderContenido(){
  const hrefHerramientas = window.__hub.prefijo() + '/herramientas';
  $('content').innerHTML = `
    <section class="seccion cerrado" id="sec-checklist">
      <h2 class="seccion-h"><button type="button" class="seccion-toggle" id="check-toggle" aria-expanded="false" aria-controls="check-body">📋 Checklist antes de grabar <span class="chev" aria-hidden="true">▾</span></button></h2>
      <div id="check-body" hidden>${renderChecklist()}</div>
    </section>
    <section class="seccion">
      <a class="enlace-seccion" href="${hrefHerramientas}">
        <span class="seccion-h">📱 Apps para editar</span>
        <span class="enlace-pill">Jefe de Herramientas →</span>
      </a>
    </section>
    <section class="seccion"><h2 class="seccion-h">🎥 Tipos de grabación que mejor funcionan</h2>${renderTipos()}</section>`;
  $('check-toggle').addEventListener('click', () => {
    const abrir = $('check-toggle').getAttribute('aria-expanded') !== 'true';
    $('check-toggle').setAttribute('aria-expanded', abrir ? 'true' : 'false');
    $('check-body').hidden = !abrir;
    $('sec-checklist').classList.toggle('cerrado', !abrir);
  });
}

// ─── BUSCADOR: modo Guía (chat con memoria) o Crear imagen ─────────────────
let modo = 'guia';
let chatMessages = [];
let chatBusy = false;
let imggenBusy = false;
let imggenUsadas = null;
let imggenLimite = 15;
let chatPlegado = false; // el botón "Ocultar ▴" del chat

// Sugerencias: aparecen como lista bajo el buscador (como en el Jefe de Contenido) y cambian según lo que ya se habló.
const SUG_AYUDA_GUION = 'Pega aquí tu guion o la descripción de tu video y presiona enviar para recibir feedback.';
const SUG_GUIA_INICIO = [
  { t: 'Guíame antes de grabar', msg: 'Voy a grabar un video, guíame con el checklist antes de grabar.', enviar: true },
  { t: '¿Qué formato me conviene?', msg: '¿Qué tipo de grabación me conviene según lo que quiero lograr?', enviar: true },
  { t: 'Revisa mi guion o video', ayuda: SUG_AYUDA_GUION },
];
const SUG_GUIA_SEGUIR = [
  { t: 'Dame el guion en escenas', msg: 'Dame el guion de mi video dividido en escenas.', enviar: true },
  { t: '¿Qué luz y qué sonido necesito?', msg: '¿Qué luz y qué sonido necesito para grabarlo bien?', enviar: true },
  { t: '¿Cómo lo edito?', msg: '¿Cómo lo edito? Dame los pasos.', enviar: true },
  { t: 'Revisa mi guion o video', ayuda: SUG_AYUDA_GUION },
];
// Si el Jefe acaba de preguntar "¿anuncio u orgánico?", las respuestas salen primero.
const SUG_ANUNCIO_ORGANICO = [
  { t: 'Es para un anuncio', msg: 'Es para un anuncio.', enviar: true },
  { t: 'Es para contenido orgánico', msg: 'Es para contenido orgánico.', enviar: true },
];
// Con un post elegido, las sugerencias hablan de ese post.
const SUG_POST = [
  { t: 'Dame el guion de este post en escenas', msg: 'Dame el guion de este post dividido en escenas.', enviar: true },
  { t: '¿Qué tipo de grabación le conviene?', msg: '¿Qué tipo de grabación le conviene a este post y por qué?', enviar: true },
  { t: 'Guíame con el checklist para grabarlo', msg: 'Guíame con el checklist antes de grabar este post.', enviar: true },
  { t: 'Revisa mi guion o video', ayuda: SUG_AYUDA_GUION },
];
const SUG_IMAGEN = [
  { t: 'Foto de producto', msg: 'Foto de producto sobre fondo neutro, luz natural, estilo minimalista' },
  { t: 'Miniatura de video', msg: 'Miniatura llamativa para un video, con espacio para el título, colores vivos' },
  { t: 'Imagen para un post', msg: 'Imagen para un post de Instagram, estilo limpio y moderno' },
];

function placeholderActual(){
  const sel = typeof itemPx === 'function' ? itemPx() : null;
  if (sel && modo === 'guia') return '¿Qué necesitas para este post?';
  if (modo === 'guia') {
    return esMovil()
      ? 'Pregunta algo o busca un post…'
      : 'Pregunta algo, pega tu guion o busca uno de tus posts…';
  }
  if (sel) return 'Describe la imagen (opcional) y envía';
  return 'Describe la imagen que necesitas…';
}

// Con el cuadro vacío, la altura se mide con el texto de ayuda (placeholder) para que se lea completo.
function alturaPlaceholder(el){
  const cs = getComputedStyle(el);
  const m = document.createElement('div');
  m.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:break-word;' +
    `width:${el.clientWidth}px;font-family:${cs.fontFamily};font-size:${cs.fontSize};line-height:${cs.lineHeight};padding:${cs.padding};`;
  m.textContent = el.placeholder || ' ';
  document.body.appendChild(m);
  const h = m.offsetHeight;
  m.remove();
  return h;
}
function autoAlto(){
  const el = $('chat-input');
  el.style.height = 'auto';
  // +2px: scrollHeight redondea hacia abajo y sin ese margen asoma una mini barra de scroll.
  const tope = el.value ? 150 : 260;
  const alto = (el.value ? el.scrollHeight : alturaPlaceholder(el)) + 2;
  el.style.height = Math.min(alto, tope) + 'px';
  el.style.overflowY = alto > tope ? 'auto' : 'hidden';
}

function setStatus(texto, error){
  const el = $('chat-status');
  el.className = 'mode-status' + (error ? ' error' : '');
  el.textContent = texto || '';
}

function setBusy(v){
  $('chat-send-btn').disabled = v;
}

let sugLista = [];
let sugActiva = -1;
function normSug(s){ return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
// Publicaciones (posts, historias, campañas) que salen en la lista al buscar, como los videos en el buscador de YouTube.
const TIPO_POST_PX = { contenido: 'Post', historias: 'Historia', campanas: 'Campaña' };
function postsBuscadorPx(texto){
  const todos = [];
  ['contenido', 'historias', 'campanas'].forEach((tab) => (contenidoPx[tab] || []).forEach((r) => todos.push({ r, tab })));
  const q = normSug(texto).trim();
  const actual = trabajoPx ? trabajoPx.id : null;
  let lista;
  if (!q) {
    lista = [].concat(proximosPx(contenidoPx.contenido).map((r) => ({ r, tab: 'contenido' })), proximosPx(contenidoPx.historias).map((r) => ({ r, tab: 'historias' })),
      proximosPx(contenidoPx.campanas).map((r) => ({ r, tab: 'campanas' }))).slice(0, 3);
  } else {
    const pals = q.split(/\s+/).filter(Boolean);
    lista = todos.filter(({ r, tab }) => { const n = normSug([r.gancho, TIPO_POST_PX[tab], ESTADO_PX[estadoPx(r)].txt].join(' ')); return pals.every((p) => n.includes(p)); }).slice(0, 4);
  }
  return lista.filter(({ r }) => r.id !== actual).map(({ r, tab }) => ({ post: r, tab, t: r.gancho || '(sin título)' }));
}
function sugerenciasPx(texto){
  let base;
  if (modo === 'imagen') base = SUG_IMAGEN;
  else if (trabajoPx && itemPx()) base = SUG_POST;
  else if (!chatMessages.length) base = SUG_GUIA_INICIO;
  else {
    const ult = [...chatMessages].reverse().find((m) => m.role === 'assistant' && !m.error);
    const preguntaTipo = !!ult && /anuncio/i.test(ult.content) && /org[aá]nic/i.test(ult.content) && /\?/.test(ult.content);
    base = (preguntaTipo ? SUG_ANUNCIO_ORGANICO : []).concat(SUG_GUIA_SEGUIR);
  }
  const q = normSug(texto).trim();
  const posts = modo === 'guia' ? postsBuscadorPx(texto) : [];
  const generales = !q ? base.slice(0, 5 - posts.length)
    : base.filter((s) => { const n = normSug(s.t); return q.split(/\s+/).filter(Boolean).every((p) => n.includes(p)); }).slice(0, 3);
  return posts.concat(generales).slice(0, 6);
}
function pintarSugerencias(){
  const box = $('sug-lista'), ta = $('chat-input');
  sugLista = document.activeElement === ta ? sugerenciasPx(ta.value) : [];
  sugActiva = -1;
  if (!sugLista.length) { ocultarSugerencias(); return; }
  box.innerHTML = sugLista.map((s, i) => {
    const sep = (i > 0 && !s.post && sugLista[i - 1].post) ? '<div class="sug-sep"></div>' : '';
    if (s.post) {
      const c = ESTADO_PX[estadoPx(s.post)];
      const mini = s.post.miniatura ? `<img src="${escHtml(s.post.miniatura)}" alt="">` : (s.tab === 'historias' ? '⭕' : s.tab === 'campanas' ? '📣' : '🎬');
      return `<button type="button" class="sug-item sug-post" role="option" data-i="${i}" style="--a:${c.a};--b:${c.b}"><span class="sug-mini">${mini}</span><span class="sug-txt"><b>${escHtml(s.t)}</b><small>${TIPO_POST_PX[s.tab]} · ${c.txt} · ${fechaCortaPx(s.post.fecha)}</small></span></button>`;
    }
    return `${sep}<button type="button" class="sug-item" role="option" data-i="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>${escHtml(s.t)}</span></button>`;
  }).join('');
  box.hidden = false;
  box.querySelectorAll('.sug-item').forEach((b) => {
    b.addEventListener('mousedown', (e) => e.preventDefault()); // no le quita el foco a la barra
    b.addEventListener('click', () => elegirSugerencia(+b.dataset.i));
  });
}
function ocultarSugerencias(){
  const box = $('sug-lista');
  if (box) { box.hidden = true; box.innerHTML = ''; }
  sugLista = []; sugActiva = -1;
}
function moverSugerencia(paso){
  const items = document.querySelectorAll('#sug-lista .sug-item');
  if (!items.length) return false;
  const n = items.length;
  sugActiva = sugActiva < 0 ? (paso > 0 ? 0 : n - 1) : (sugActiva + paso + n) % n;
  items.forEach((b, i) => b.classList.toggle('on', i === sugActiva));
  return true;
}
function elegirSugerencia(i){
  const s = sugLista[i];
  if (!s) return;
  ocultarSugerencias();
  const el = $('chat-input');
  // Un post de la lista se elige como al buscar un video: se limpia la búsqueda y se escribe la indicación.
  if (s.post) { seleccionarPostPx(s.tab, s.post.id); el.value = ''; autoAlto(); el.focus(); return; }
  if (s.enviar) { enviarMensajeChat(s.msg); return; }
  if (s.ayuda) { el.value = ''; el.placeholder = s.ayuda; autoAlto(); el.focus(); return; }  // sin mensaje automático
  el.value = s.msg; autoAlto(); el.focus();
}

function setModo(m){
  modo = m;
  document.querySelectorAll('.modo-pill').forEach((p) => p.classList.toggle('on', p.dataset.modo === m));
  $('chat-input').placeholder = placeholderActual();
  document.querySelector('.chat-hero').classList.toggle('modo-imagen', m === 'imagen');
  pintarRef();
  $('imggen-result').style.display = m === 'imagen' ? '' : 'none';
  setStatus(m === 'imagen' && imggenUsadas != null ? `${imggenUsadas}/${imggenLimite} usadas hoy` : '');

let refImagen = null; // { mediaType, data (base64), dataUrl, nombre }

function pintarRef(){

// Se reduce a 1024px como maximo y se manda como JPG: pesa poco y cabe en el limite de la peticion.
function reducirImagen(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1024 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * k));
      const h = Math.max(1, Math.round(img.naturalHeight * k));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); // fondo blanco: un PNG transparente no debe quedar negro en JPG
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = c.toDataURL('image/jpeg', 0.85);
      resolve({ mediaType: 'image/jpeg', data: dataUrl.split(',')[1], dataUrl });
    };
    img.onerror = () => reject(new Error('imagen'));
    img.src = src;
  });
}

async function adjuntarReferencia(origen, nombre){
  const esArchivo = typeof origen !== 'string';
  if (esArchivo) {
    if (!['image/png', 'image/jpeg', 'image/webp'].includes(origen.type)) { setStatus('⚠️ Usa una imagen JPG, PNG o WEBP.', true); return; }
    if (origen.size > 20 * 1024 * 1024) { setStatus('⚠️ La imagen pesa demasiado (máximo 20 MB).', true); return; }
  }
  const url = esArchivo ? URL.createObjectURL(origen) : origen;
  try {
    const r = await reducirImagen(url);
    refImagen = Object.assign(r, { nombre: nombre || (esArchivo && origen.name) || 'Imagen de referencia' });
    pintarRef();
    setStatus('📎 Referencia lista. Escribe qué quieres cambiar, o envía para una imagen parecida.');
  } catch (e) {
    setStatus('⚠️ No se pudo leer esa imagen. Prueba con otra.', true);
  } finally {
    if (esArchivo) URL.revokeObjectURL(url);
  }
}

async function cargarConversacion(){
  try {
    const r = await window.storage.get(CONVERSACION_KEY);
    const guardado = r && r.value ? JSON.parse(r.value) : [];
    // Antes el atajo "Revisa mi guion o video" mandaba este mensaje solo; se quita de lo ya guardado.
    const AUTOMATICO = 'Te voy a pegar un guion para que me des feedback.';
    const limpio = [];
    for (let i = 0; i < guardado.length; i++) {
      const m = guardado[i];
      if (m && m.role === 'user' && m.content === AUTOMATICO) {
        if (guardado[i + 1] && guardado[i + 1].role === 'assistant') i++;
        continue;
      }
      limpio.push(m);
    }
    if (limpio.length !== guardado.length) { chatMessages = limpio; persistirConversacion(); }
    if (Array.isArray(limpio) && limpio.length > 0) {
      chatMessages = limpio;
      pintarChatThread();
    }
  } catch (e) {}
}

// ─── PRÓXIMOS POSTS, HISTORIAS Y CAMPAÑAS (vienen del Jefe de Contenido y del Jefe de Anuncios) ──────
// Lee los mismos posts e historias que el Jefe de Contenido (primero lo programado, luego lo que está en
// proceso y al final ideas). Al elegir uno se trabaja aquí: sus prompts de imagen y de video pasan al buscador.
const CONTENIDO_KEY = CLIENTE_ID + ':agente-contenido';
const ANUNCIOS_KEY = CLIENTE_ID + ':agente-anuncios';
const HANDOFF_KEY = CLIENTE_ID + ':productor-handoff';
const MAX_PROXIMOS = 5;
const ESTADO_PX = {
  idea:{txt:'Idea', a:'#FFE3E3', b:'#F4A0A0'},
  proceso:{txt:'En proceso', a:'#FFF8D6', b:'#FBE48E'},
  programado:{txt:'Programado', a:'#E6F2FF', b:'#A9D0F5'},
  publicado:{txt:'Publicado', a:'#EAFBB8', b:'#C6F04E'},
};
const MESES_PX = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let contenidoPx = { contenido: [], historias: [], campanas: [] };
let trabajoPx = null; // { tab, id }
let detallePx = false; // ¿se ven las características de la publicación elegida ("Ver post")?
let catalogoPx = null; // productos del ADN (para mostrar el nombre del producto); null = aún sin cargar
const FORMATO_PX = { reel: 'Reel', video: 'Video', carrusel: 'Carrusel', imagen: 'Imagen', historia: 'Historia' };
const ETAPA_PX = { adquisicion: 'Adquisición', consideracion: 'Consideración', conversion: 'Conversión' };
const RED_PX = { ig: 'Instagram', tt: 'TikTok', fb: 'Facebook', web: 'Web' };

function estadoPx(r){ return ESTADO_PX[r.estado] ? r.estado : 'idea'; }
function esNuevoPx(r){ return !!r.agregadoEn && (Date.now() - r.agregadoEn) < 24 * 60 * 60 * 1000; }
function isoHoyPx(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fechaCortaPx(f){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f || '');
  return m ? (+m[3]) + ' ' + MESES_PX[+m[2] - 1] : 'Sin fecha';
}
function proximosPx(lista){
  const hoy = isoHoyPx();
  const rank = { programado: 0, proceso: 1, idea: 2 };
  const grupo = (r) => { const f = r.fecha || ''; if (!/^\d{4}-\d{2}-\d{2}$/.test(f)) return 1; return f >= hoy ? 0 : 2; };
  return lista.filter((r) => estadoPx(r) !== 'publicado').slice().sort((a, b) => {
    const n = (esNuevoPx(b) ? 1 : 0) - (esNuevoPx(a) ? 1 : 0); if (n) return n;
    if (esNuevoPx(a) && esNuevoPx(b)) return b.agregadoEn - a.agregadoEn;
    const d = rank[estadoPx(a)] - rank[estadoPx(b)]; if (d) return d;
    const g = grupo(a) - grupo(b); if (g) return g;
    return (a.fecha || '').localeCompare(b.fecha || '') || (a.hora || '99:99').localeCompare(b.hora || '99:99');
  }).slice(0, MAX_PROXIMOS);
}
function tarjetaPx(r, tab){
  const c = ESTADO_PX[estadoPx(r)];
  const activa = trabajoPx && trabajoPx.id === r.id;
  const mini = r.miniatura ? `<img src="${escHtml(r.miniatura)}" alt="">` : `<span class="px-ico">${tab === 'historias' ? '⭕' : tab === 'campanas' ? '📣' : '🎬'}</span>`;
  return `<button type="button" class="px-card${activa ? ' on' : ''}" data-id="${escHtml(r.id)}" data-tab="${tab}" style="--a:${c.a};--b:${c.b}">
    <span class="px-thumb">${mini}${esNuevoPx(r) ? '<span class="px-nuevo">Nuevo</span>' : ''}</span>
    <span class="px-tit">${escHtml(r.gancho || '(sin título)')}</span>
    <span class="px-pie"><span class="px-pill">${c.txt}</span><span class="px-fecha">${fechaCortaPx(r.fecha)}</span></span>
  </button>`;
}
function pintarProximos(){
  const host = $('px-prox');
  const posts = proximosPx(contenidoPx.contenido), hist = proximosPx(contenidoPx.historias), camps = proximosPx(contenidoPx.campanas);
  if (!posts.length && !hist.length && !camps.length) { host.hidden = true; host.innerHTML = ''; return; }
  host.hidden = false;
  const sec = (titulo, lista, tab) => lista.length
    ? `<div class="px-sec"><div class="px-sec-tit">${titulo}</div><div class="px-row">${lista.map((r) => tarjetaPx(r, tab)).join('')}</div></div>` : '';
  host.innerHTML = sec('Próximos posts', posts, 'contenido') + sec('Próximas historias', hist, 'historias') + sec('Próximas campañas', camps, 'campanas');
  host.querySelectorAll('.px-card').forEach((b) => b.addEventListener('click', () => elegirTrabajoPx(b.dataset.tab, b.dataset.id)));

function itemPx(){
  if (!trabajoPx) return null;
  return (contenidoPx[trabajoPx.tab] || []).find((r) => r.id === trabajoPx.id) || null;
}

function txtPx(v){
  if (v == null) return '';
  if (Array.isArray(v)) return v.map(txtPx).filter(Boolean).join(', ');
  if (typeof v === 'object') return '';

// "Ver post": lo que la publicación (post, historia o campaña) tiene guardado; solo se muestra lo que tenga datos.
function detalleHtmlPx(r, tab){
  const c = r.raw || {}; // campañas: la card original del Jefe de Anuncios
  const esCamp = tab === 'campanas';
  const chips = [];
  const formato = esCamp ? c.formato : (r.formato || (tab === 'historias' ? 'historia' : 'reel'));
  if (txtPx(formato)) chips.push(['Formato', FORMATO_PX[formato] || txtPx(formato)]);
  chips.push(['Estado', ESTADO_PX[estadoPx(r)].txt]);
  const cuando = [/^\d{4}-\d{2}-\d{2}$/.test(r.fecha || '') ? fechaCortaPx(r.fecha) : '', r.hora || ''].filter(Boolean).join(' · ');
  if (cuando) chips.push(['Fecha', cuando]);
  if (!esCamp && Array.isArray(r.redes) && r.redes.length) chips.push(['Redes', r.redes.map((k) => RED_PX[k] || k).join(', ')]);
  const etapa = esCamp ? c.etapa : r.etapa;
  if (txtPx(etapa)) chips.push(['Etapa', ETAPA_PX[etapa] || txtPx(etapa)]);
  if (esCamp) {
    if (txtPx(c.audiencia)) chips.push(['Audiencia', txtPx(c.audiencia)]);
    if (txtPx(c.duracion_sugerida)) chips.push(['Duración', txtPx(c.duracion_sugerida)]);
    if (txtPx(c.cta_boton)) chips.push(['Botón', txtPx(c.cta_boton)]);
  }
  const pid = esCamp ? c.producto_id : r.productoId;
  const prod = pid && (catalogoPx || []).find((p) => p && p.id === pid);
  if (prod && prod.nombre) chips.push(['Producto', prod.nombre]);
  const notas = (r.notas != null && r.notas !== '') ? r.notas : [r.instrucciones, r.recomendacion].filter(Boolean).join('\n\n');
  const bloques = (esCamp ? [
    ['Título', r.gancho], ['Hook', c.hook], ['Objetivo', c.objetivo], ['Ángulo', c.angulo], ['Copy de la publicación', c.copy_publicacion],
    ['Visual sugerido', c.visual_sugerido], ['Guion', c.guion], ['Link de destino', c.link_destino], ['Retroalimentación', c.retroalimentacion],
    ['Prompt de imagen', r.promptImagen], ['Prompt de video', r.promptVideo],
  ] : [
    ['Título', r.gancho], ['Idea', r.ganchoIdea || r.descripcion], ['Caption', r.caption], ['Guion', r.guion], ['Notas', notas],
    ['Prompt de imagen', r.promptImagen], ['Prompt de video', r.promptVideo],
  ]).map(([t, v]) => [t, txtPx(v)]).filter(([, v]) => v);
  return `<div class="px-detalle">
    <div class="px-chips">${chips.map(([k, v]) => `<span class="px-chip"><b>${escHtml(k)}</b>${escHtml(v)}</span>`).join('')}</div>
    ${bloques.map(([t, v]) => `<div class="px-bloque"><span class="px-bloque-t">${escHtml(t)}</span><p>${escHtml(v)}</p></div>`).join('')}
  </div>`;
}
function pintarTrabajoPx(){
  const box = $('px-trabajo');
  const r = itemPx();
  if (!r) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = `<div class="px-trabajo-txt"><span class="px-trabajo-lbl">Trabajando en</span><strong>${escHtml(r.gancho || '(sin título)')}</strong></div>
    <button type="button" class="px-quitar" data-px="quitar" title="Quitar" aria-label="Quitar">✕</button>
    ${progresoPxHtml(r, trabajoPx.tab)}${detallePx ? detalleHtmlPx(r, trabajoPx.tab) : ''}${confirmarPxHtml()}`;
  box.querySelectorAll('[data-px]').forEach((b) => b.addEventListener('click', async () => {
    const a = b.dataset.px;
    if (a === 'quitar') quitarTrabajoPx();
    else if (a === 'ver') {
      detallePx = !detallePx;
      if (detallePx) await cargarCatalogoPx();
      pintarTrabajoPx();
    }
  }));
  box.querySelectorAll('[data-paso]').forEach((b) => b.addEventListener('click', () => accionPasoPx(b.dataset.paso, b.classList.contains('ok'))));
  enlazarConfirmarPx(box);
}
// Avance de la publicación: qué ya tiene (✓) y qué le falta; tocar un paso pendiente hace que el Jefe te ayude ahí mismo.
function pasosPx(r, tab){
  const c = r.raw || {};
  const esCamp = tab === 'campanas';
  const formato = esCamp ? c.formato : (r.formato || (tab === 'historias' ? 'historia' : 'reel'));
  const hay = (...v) => v.some((x) => txtPx(x));
  const pasos = [
    { id: 'post', t: 'Post', ok: esCamp ? hay(c.guion, c.hook, c.visual_sugerido, c.objetivo) : hay(r.guion, r.ganchoIdea, r.descripcion), falta: 'guion', accion: 'armar el guion con el Jefe' },
    { id: 'copy', t: 'Copy', ok: hay(r.caption), falta: 'copy', accion: 'escribir el copy con el Jefe' },
    { id: 'pimg', t: 'Prompt imagen', ok: hay(r.promptImagen), falta: 'prompt de imagen', accion: 'crear el prompt de imagen' },
    { id: 'img', t: 'Imagen', ok: !!r.miniatura, falta: 'imagen', accion: 'crear la imagen con IA' },
  ];
  if (['reel', 'video', 'historia'].includes(formato)) pasos.push({ id: 'pvid', t: 'Prompt video', ok: hay(r.promptVideo), falta: 'prompt de video', accion: 'crear el prompt de video' });
  return pasos;
}
function progresoPxHtml(r, tab){
  const pasos = pasosPx(r, tab);
  const faltan = pasos.filter((p) => !p.ok);
  const sig = faltan[0];
  const lista = faltan.map((p) => p.falta);
  const txtFalta = lista.length ? `Falta ${lista.length > 1 ? lista.slice(0, -1).join(', ') + ' y ' + lista[lista.length - 1] : lista[0]}.` : '✅ Todo listo.';
  return `<div class="px-progreso">
    <div class="px-pasos" role="list">${pasos.map((p) => `<button type="button" class="px-paso${p.ok ? ' ok' : ''}${sig && sig.id === p.id ? ' sig' : ''}" role="listitem" data-paso="${p.id}" title="${p.ok ? 'Listo — toca para verlo' : 'Falta — toca para ' + p.accion}"><span class="px-paso-c">${p.ok ? '✓' : ''}</span>${p.t}</button>`).join('')}</div>
    <p class="px-falta"><b>${ESTADO_PX[estadoPx(r)].txt}</b> · ${txtFalta} <button type="button" class="link-btn" data-px="ver" aria-expanded="${detallePx}">${detallePx ? 'Ocultar post' : 'Ver post'}</button></p>
    ${sig ? `<div><button type="button" class="px-btn px-btn-ok" data-paso="${sig.id}">✨ Siguiente: ${sig.accion}</button></div>` : ''}
  </div>`;
}
function accionPasoPx(id, ok){
  const r = itemPx(); if (!r) return;
  const alChat = () => { const b = $('px-chat-box'); if (b && !b.hidden) b.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
  if (ok) {
    if (id === 'pimg') usarPromptPx('imagen');
    else if (id === 'pvid') usarPromptPx('video');
    else { detallePx = true; cargarCatalogoPx().then(pintarTrabajoPx); }
    return;
  }
  if (id === 'post') { setModo('guia'); enviarMensajeChat('Este post todavía no tiene guion. Propónme uno dividido en escenas, con base en su título y su idea.'); alChat(); }
  else if (id === 'copy') { setModo('guia'); enviarMensajeChat('Este post todavía no tiene copy. Escríbeme el caption listo para copiar, con el tono de mi marca.'); alChat(); }
  else if (id === 'pimg') usarPromptPx('imagen');
  else if (id === 'pvid') usarPromptPx('video');
  else if (id === 'img') { setModo('imagen'); const el = $('chat-input'); el.value = r.promptImagen || ''; autoAlto(); generarImagen(); }
}
// La imagen creada se puede dejar como imagen del post (se reduce para que pese poco).
function miniaturaChicaPx(dataUrl){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 540 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}
async function guardarMiniaturaEnPostPx(tab, id, miniatura){
  const key = tab === 'campanas' ? ANUNCIOS_KEY : CONTENIDO_KEY;
  const rr = await window.storage.get(key);
  const d = rr && rr.value ? JSON.parse(rr.value) : null;
  const lista = tab === 'campanas' ? d : (d && d[tab]);
  const it = Array.isArray(lista) ? lista.find((x) => x && x.id === id) : null;
  if (!it) throw new Error('No encontré la publicación para guardar la imagen.');
  it.miniatura = miniatura;
  await window.storage.set(key, JSON.stringify(d));
}
function textoVideoPx(titulo, prompt){
  return `Este es el prompt de video para mi post «${titulo}». Ayúdame a elegir la herramienta de IA ideal y a afinarlo:\n\n${prompt}`;
}
// Si el post ya tiene su prompt guardado, lo deja en el buscador. Si no lo tiene, la IA lo arma con lo que hay
// del post y se muestra para confirmar: al confirmar se guarda en el post y (imagen) se crea la imagen.
function usarPromptPx(tipo){
  const r = itemPx(); if (!r) return;
  const guardado = tipo === 'imagen' ? r.promptImagen : r.promptVideo;
  if (guardado) { confirmPx = { tipo, estado: 'listo', texto: guardado, existente: true, cambios: '', error: '' }; pintarTrabajoPx(); return; }
  crearPromptPx(tipo);
}

// ─── PROMPT CREADO CON IA PARA CONFIRMAR ───────────────────────────────────────────────────────
let confirmPx = null; // { tipo, estado:'cargando'|'listo'|'error', texto, existente, cambios, error }
function confirmarPxHtml(){
  if (!confirmPx) return '';
  const nombre = confirmPx.tipo === 'imagen' ? 'imagen' : 'video';
  if (confirmPx.estado === 'cargando') return `<div class="px-confirm"><div class="px-confirm-t">⏳ ${confirmPx.actualizando ? 'Actualizando' : 'Armando'} el prompt de ${nombre}…</div></div>`;
  if (confirmPx.estado === 'error') return `<div class="px-confirm"><div class="px-confirm-t">⚠️ ${escHtml(confirmPx.error)}</div>
    <div class="px-confirm-btns"><button type="button" class="px-btn" data-pxc="otro">↻ Intentar de nuevo</button><button type="button" class="link-btn" data-pxc="cancelar">Cancelar</button></div></div>`;
  const titulo = confirmPx.existente
    ? `Prompt de ${nombre} guardado. Puedes editarlo o pedir otra versión.`
    : `Prompt de ${nombre} listo para Gemini. Revísalo, edítalo si quieres y confírmalo.`;
  return `<div class="px-confirm">
    <div class="px-confirm-t">${titulo}</div>
    <textarea class="px-confirm-txt" rows="6">${escHtml(confirmPx.texto)}</textarea>
    <textarea class="px-confirm-cambios" rows="2" placeholder="¿Qué quieres cambiar? (opcional) Ej. más luz, otro estilo, más corto…">${escHtml(confirmPx.cambios || '')}</textarea>
    <div class="px-confirm-btns">
      <button type="button" class="px-btn px-btn-ok" data-pxc="ok">${confirmPx.tipo === 'imagen' ? '✅ Confirmar y crear imagen' : '✅ Confirmar y guardar'}</button>
      <button type="button" class="px-btn" data-pxc="copiar">📋 Copiar</button>
      <button type="button" class="px-btn" data-pxc="actualizar">🔄 Otra versión</button>
      <button type="button" class="link-btn" data-pxc="cancelar">Cancelar</button>
    </div></div>`;
}
function enlazarConfirmarPx(box){
  const ta = box.querySelector('.px-confirm-txt');
  if (ta) ta.addEventListener('input', () => { confirmPx.texto = ta.value; });
  const cb = box.querySelector('.px-confirm-cambios');
  if (cb) cb.addEventListener('input', () => { confirmPx.cambios = cb.value; });
  box.querySelectorAll('[data-pxc]').forEach((b) => b.addEventListener('click', () => {
    const a = b.dataset.pxc;
    if (a === 'cancelar') { confirmPx = null; pintarTrabajoPx(); }
    else if (a === 'otro') crearPromptPx(confirmPx ? confirmPx.tipo : 'imagen');
    else if (a === 'actualizar') crearPromptPx(confirmPx.tipo, { actual: confirmPx.texto, cambios: confirmPx.cambios });
    else if (a === 'copiar') {
      const antes = b.textContent;
      navigator.clipboard.writeText(confirmPx.texto || '').then(() => { b.textContent = '✅ Copiado'; setTimeout(() => { b.textContent = antes; }, 1800); });
    }
    else if (a === 'ok') confirmarPromptPx();
  }));
}
async function crearPromptPx(tipo, opts){
  const r = itemPx(); if (!r) return;
  const actual = (opts && opts.actual) || '', cambios = (opts && opts.cambios) || '';
  confirmPx = { tipo, estado: 'cargando', texto: '', cambios, actualizando: !!actual, error: '' }; pintarTrabajoPx();
  try {
    let res, texto = '';
    if (trabajoPx.tab === 'campanas') {
      const c = r.raw || {};
      res = await fetch('/api/generar-anuncios', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          modo: 'pieza', cliente: CLIENTE_ID, tipo, grupo_id: c.grupo_id || '', producto_id: c.producto_id || '',
          card: { titulo: c.titulo, hook: c.hook, etapa: c.etapa, formato: c.formato, objetivo: c.objetivo, angulo: c.angulo, audiencia: c.audiencia,
            copy_publicacion: c.copy_publicacion, visual_sugerido: c.visual_sugerido, duracion_sugerida: c.duracion_sugerida,
            cta_boton: c.cta_boton, link_destino: c.link_destino, retroalimentacion: c.retroalimentacion, guion: c.guion },
          texto: cambios, prompt_actual: actual,
        }),
      });
    } else {
      res = await fetch('/api/generar-guion-organico', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          cliente: CLIENTE_ID, modo: 'prompt-medio', tipo,
          post: { gancho: r.gancho, formato: r.formato, caption: r.caption, guion: r.guion, notas: r.notas },
          texto: cambios, prompt_actual: actual, imagenes: [],
        }),
      });
    }
    const raw = await res.text(); let data = null; try { data = JSON.parse(raw); } catch (e) {}
    if (!res.ok || !data) throw new Error((data && data.error) || 'No se pudo armar el prompt. Intenta de nuevo.');
    texto = trabajoPx.tab === 'campanas'
      ? ((data.pieza && (tipo === 'imagen' ? data.pieza.prompt_imagen : data.pieza.prompt_video)) || '')
      : (data.text || '');
    if (!texto.trim()) throw new Error('La IA no devolvió el prompt. Intenta de nuevo.');
    confirmPx = { tipo, estado: 'listo', texto: texto.trim(), existente: false, cambios: '', error: '' };
  } catch (err) {
    confirmPx = { tipo, estado: 'error', texto: '', cambios, error: err.message || 'No se pudo armar el prompt.' };
  }
  pintarTrabajoPx();
}
// Guarda el prompt confirmado dentro de la publicación (lee lo guardado justo antes, para no pisar otros cambios).
async function guardarPromptEnPostPx(tab, id, tipo, texto){
  const campo = tab === 'campanas' ? (tipo === 'imagen' ? 'prompt_imagen' : 'prompt_video') : (tipo === 'imagen' ? 'promptImagen' : 'promptVideo');
  const key = tab === 'campanas' ? ANUNCIOS_KEY : CONTENIDO_KEY;
  const rr = await window.storage.get(key);
  const d = rr && rr.value ? JSON.parse(rr.value) : null;
  const lista = tab === 'campanas' ? d : (d && d[tab]);
  const it = Array.isArray(lista) ? lista.find((x) => x && x.id === id) : null;
  if (!it) throw new Error('No encontré la publicación para guardar el prompt.');
  it[campo] = texto;
  await window.storage.set(key, JSON.stringify(d));
}
async function confirmarPromptPx(){
  const r = itemPx(); if (!r || !confirmPx || confirmPx.estado !== 'listo') return;
  const { tipo } = confirmPx; const texto = (confirmPx.texto || '').trim(); if (!texto) return;
  const tab = trabajoPx.tab, id = trabajoPx.id;
  try {
    await guardarPromptEnPostPx(tab, id, tipo, texto);
  } catch (err) {
    confirmPx = { tipo, estado: 'error', texto: '', error: err.message || 'No se pudo guardar el prompt.' }; pintarTrabajoPx(); return;
  }
  if (tipo === 'imagen') r.promptImagen = texto; else r.promptVideo = texto;
  if (r.raw) { if (tipo === 'imagen') r.raw.prompt_imagen = texto; else r.raw.prompt_video = texto; }
  confirmPx = null; pintarTrabajoPx();
  const el = $('chat-input');
  if (tipo === 'imagen') { setModo('imagen'); el.value = texto; autoAlto(); generarImagen(); }
  else { setModo('guia'); el.value = textoVideoPx(r.gancho || 'mi post', texto); autoAlto(); el.focus(); }
}
// Llega desde el editor del post con "Ir a Jefe Productor IA": abre ese post y deja su prompt en el buscador.
async function aplicarTraspasoPx(){
  try {
    const r = await window.storage.get(HANDOFF_KEY);
    const h = r && r.value ? JSON.parse(r.value) : null;
    if (!h || !h.ts || Date.now() - h.ts > 2 * 60 * 60 * 1000) return;
    let visto = ''; try { visto = localStorage.getItem('px-traspaso-visto') || ''; } catch (e) {}
    if (visto === String(h.ts)) return;
    try { localStorage.setItem('px-traspaso-visto', String(h.ts)); } catch (e) {}
    // Desde el Jefe de Anuncios llega tab:'anuncios' y postId:'anuncio:<id>' (sus campañas viven en 'campanas').
    const tabH = h.tab === 'anuncios' ? 'campanas' : h.tab;
    const idH = h.tab === 'anuncios' ? String(h.postId || '').replace(/^anuncio:/, '') : h.postId;
    if ((contenidoPx[tabH] || []).some((x) => x.id === idH)) trabajoPx = { tab: tabH, id: idH };
    if (h.prompt) {
      const el = $('chat-input');
      if (h.tipo === 'video') { setModo('guia'); el.value = textoVideoPx((itemPx() || {}).gancho || 'mi post', h.prompt); }
      else { setModo('imagen'); el.value = h.prompt; }
      autoAlto();
    }
  } catch (e) {}
}
async function cargarContenidoPx(){
  try {
    const r = await window.storage.get(CONTENIDO_KEY);
    const d = r && r.value ? JSON.parse(r.value) : null;
    if (d) {
      contenidoPx.contenido = Array.isArray(d.contenido) ? d.contenido : [];
      contenidoPx.historias = Array.isArray(d.historias) ? d.historias : [];
    }
  } catch (e) {}
  // Campañas del Jefe de Anuncios: se adaptan a la misma forma que un post (título, estado, fecha, prompts).
  try {
    const r = await window.storage.get(ANUNCIOS_KEY);
    const lista = r && r.value ? JSON.parse(r.value) : [];
    contenidoPx.campanas = (Array.isArray(lista) ? lista : []).filter((c) => c && c.id).map((c) => ({
      id: c.id, gancho: c.titulo || '', estado: c.estado || 'idea', fecha: c.fecha || '', hora: c.hora || '',
      caption: c.copy_publicacion || '', descripcion: c.objetivo || '',
      promptImagen: c.prompt_imagen || '', promptVideo: c.prompt_video || '', miniatura: c.miniatura || '',
      raw: c,
    }));
  } catch (e) {}
  await aplicarTraspasoPx();
  pintarProximos(); pintarTrabajoPx();
  $('chat-input').placeholder = placeholderActual(); autoAlto();
}

/* ─── INIT ─── */
renderContenido();
setModo('guia');
pintarChatThread();
cargarConversacion();
cargarContenidoPx();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(autoAlto);
</script>
