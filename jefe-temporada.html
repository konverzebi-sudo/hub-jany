<!DOCTYPE html>
<html lang="es">
<head>
<script src="/js/hub-tenant.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jefe de Temporada — JefesHub</title>
<link rel="icon" type="image/png" href="/img/fav/jefe-temporada.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F0B16;
    --surface:#181120;
    --surface-2:#211829;
    --line:#332A3D;
    --text:#F3EEF9;
    --text-dim:#B6A9C7;
    --accent:#B8F725;
    --accent-soft:#2E3610;
    --temp:#FBBF24;--temp-soft:#332708;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#241733 0%,var(--bg) 55%);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding:28px 16px 80px;}
  h1,.display{font-family:'Sora',sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;}
  .page-header{text-align:center;padding-top:62px;}
  h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin:0 0 8px;line-height:1.15;}
  .sub{color:var(--text-dim);font-size:15px;margin:0 auto 22px;line-height:1.5;max-width:680px;}
  .topbar{position:fixed;top:0;left:0;right:0;height:70px;z-index:60;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);}
  .topbar h1{justify-self:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .back-link{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--text-dim);text-decoration:none;padding:6px 16px;border:1px solid var(--line);border-radius:100px;background:rgba(255,255,255,.03);transition:.15s;}
  .back-link:hover{border-color:var(--accent);color:var(--accent-texto, var(--accent));}
  *{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent;}
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px;}
  *::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.32);}

  .btn{font-family:'Inter',sans-serif;font-weight:700;font-size:13px;padding:10px 16px;border-radius:9px;cursor:pointer;border:none;transition:.15s;}
  .btn-solid{background:var(--accent);color:#0F0B16;}
  .btn-solid:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.5;cursor:wait;}
  .btn-outline{font-family:'Inter',sans-serif;font-weight:600;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text-dim);transition:.15s;}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent-texto, var(--accent));}
  .btn-outline:disabled{opacity:.5;cursor:wait;}
  .btn-danger-outline{font-family:'Inter',sans-serif;font-weight:600;font-size:12px;padding:7px 12px;border-radius:8px;cursor:pointer;border:1px solid #7A3A1E;background:transparent;color:#FF9466;}
  .btn-danger-outline:hover{background:#3A2013;}

  /* TOOLBAR de campaña */
  select.estado-pill{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:6px 10px;border-radius:100px;border:1px solid transparent;cursor:pointer;}
  select.estado-pill.borrador{background:#1B2142;color:#A8B4F0;border-color:#3A4380;}
  select.estado-pill.activa{background:var(--temp-soft);color:var(--temp);border-color:#6B4F14;}
  select.estado-pill.cerrada{background:var(--surface-2);color:var(--text-dim);border-color:var(--line);}
  .save-status{font-size:11.5px;font-family:'JetBrains Mono',monospace;color:#22c55e;min-width:70px;}
  .chat-inline-status{font-size:11.5px;font-family:'JetBrains Mono',monospace;font-weight:700;color:#0F0B16;}
  .chat-inline-status.error{color:#B00020;}

  /* VISTA DIVIDIDA (calcado del Jefe 366): chat general fijo/sticky en escritorio */
  /* En pantallas angostas es un botón normal en el flujo (nunca se tapa ni se pierde);
     en escritorio (>=1000px, donde de verdad cabe la vista dividida) pasa a fijo en la esquina. */
  .view-toggle-btn{justify-self:end;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:11px;padding:7px 14px;border-radius:20px;cursor:pointer;}
  .view-toggle-btn:hover{border-color:var(--accent);color:var(--accent-texto, var(--accent));}
  .topbar-izq{justify-self:start;display:flex;align-items:center;gap:10px;min-width:0;max-width:100%;}
  .topbar-izq .back-link{flex:0 5 auto;min-width:0;}
  .topbar-izq #foco-slot{flex:0 0 auto;}
  @media (max-width:900px){
    /* En pantallas angostas la pastilla de foco baja a una segunda fila de la barra fija */
    body .topbar{height:auto;padding:8px 10px;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"back titulo" "foco foco";row-gap:8px;}
    .topbar-izq{display:contents;}
    .topbar-izq .back-link{grid-area:back;}
    .topbar-izq #foco-slot{grid-area:foco;}
    .topbar h1{grid-area:titulo;}
    body{padding-top:96px;}
  }
  @media (max-width:999px){ .view-toggle-btn{ display:none; } }
  @media (min-width:1000px){
    #temporada-main.split-view{ display:grid; grid-template-columns:400px 1fr; align-items:start; gap:20px; max-width:1400px; }
    #temporada-main.split-view #general-chat-box{ position:sticky; top:80px; max-height:calc(100vh - 100px); overflow-y:auto; }
  }

  .empty-row{padding:24px;text-align:center;color:var(--text-dim);font-size:13px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;}

  /* SECCIONES DEL DOCUMENTO */
  .doc-section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;}
  .doc-section.destaca{border-color:var(--temp);}
  .doc-section.collapsed{padding-bottom:20px;}
  .doc-section.collapsed>*:not(.doc-section-head){display:none;}
  .doc-section-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer;user-select:none;}
  .doc-section.collapsed .doc-section-head{margin-bottom:0;}
  .doc-section-head::after{content:'▾';margin-left:auto;color:var(--text-dim);font-size:13px;flex-shrink:0;transition:transform .15s;}
  .doc-section.collapsed .doc-section-head::after{transform:rotate(-90deg);}
  .doc-num{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-texto, var(--accent));font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;flex-shrink:0;}
  .doc-section.destaca .doc-num{background:var(--temp-soft);color:var(--temp);}
  .doc-title{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;margin:0;}
  .doc-desc{color:var(--text-dim);font-size:12.5px;margin:-8px 0 14px 36px;line-height:1.5;}
  .fields-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
  .recap-line{font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 14px;display:flex;flex-direction:column;gap:4px;}
  .recap-line .recap-label{color:var(--accent-texto, var(--accent));font-weight:700;}

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; font-family: "JetBrains Mono", monospace; margin-bottom: 6px; }
  .field textarea, .field input[type=text], .field input[type=number], .field input[type=date], .field select { width: 100%; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 9px; color: var(--text); padding: 10px 12px; font-family: Inter, sans-serif; font-size: 13.5px; outline:none; color-scheme:dark; }
  .field textarea { min-height: 64px; resize: vertical; }
  .field textarea:focus, .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }

  .nota-box{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:14px;}
  .nota-box p{margin:0;font-size:12px;color:var(--text-dim);line-height:1.5;}
  .nota-box p b{color:var(--accent-texto, var(--accent));}
  .doc-section.destaca .nota-box{background:var(--temp-soft);border-color:var(--temp);}
  .doc-section.destaca .nota-box p b{color:var(--temp);}

  .jefe366-ref-box{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;line-height:1.6;}
  .jefe366-ref-box .ref-title{font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin-bottom:6px;}
  .jefe366-ref-box .ref-row{margin-bottom:4px;}
  .jefe366-ref-box .ref-row b{color:var(--text);}
  .jefe366-ref-box a{color:var(--accent-texto, var(--accent));}

  .metas-calc{display:flex;gap:20px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-top:4px;}
  .metas-calc-item{display:flex;flex-direction:column;gap:2px;}
  .metas-calc-item span:first-child{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .metas-calc-item span:last-child{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;color:var(--accent-texto, var(--accent));}

  /* TABLAS EDITABLES */
  .tabla-notas-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  table.tabla-notas { width: 100%; border-collapse: collapse; min-width: 560px; }
  table.tabla-notas th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); font-family: "JetBrains Mono", monospace; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
  table.tabla-notas td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.tabla-notas tr:last-child td { border-bottom: none; }
  table.tabla-notas textarea { width: 100%; min-width: 140px; min-height: 34px; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--text); padding: 7px 8px; font-family: Inter, sans-serif; font-size: 12.5px; outline: none; resize: vertical; line-height: 1.4; }
  table.tabla-notas textarea:hover { border-color: var(--line); }
  table.tabla-notas textarea:focus { border-color: var(--accent); background: var(--surface-2); }
  table.tabla-notas input.celda-fecha { width: 100%; min-width: 150px; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--text); padding: 7px 8px; font-family: Inter, sans-serif; font-size: 12.5px; outline: none; color-scheme: dark; }
  table.tabla-notas input.celda-fecha:hover { border-color: var(--line); }
  table.tabla-notas input.celda-fecha:focus { border-color: var(--accent); background: var(--surface-2); }
  .tabla-notas-del { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 13px; padding: 4px 8px; }
  .tabla-notas-del:hover { color: #EF4444; }
  .tabla-notas-add { background: transparent; border: 1px dashed var(--line); color: var(--text-dim); font-family: Inter, sans-serif; font-size: 12px; padding: 7px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
  .tabla-notas-add:hover { border-color: var(--accent); color: var(--accent-texto, var(--accent)); }

  /* CHAT GENERAL (fijo/sticky) -- calcado del Chat con el Jefe 366: caja verde brillante con
     panel interno oscuro para el hilo y los controles. */
  .chat-box{background:var(--accent);border:1.5px solid var(--accent);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px;}
  .chat-box-title{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;margin:0;color:#0F0B16;}
  .chat-box-desc{font-size:12px;color:#3B0764;margin:-6px 0 0;line-height:1.5;}
  .chat-thread{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;background:var(--panel-oscuro, #241733);border-radius:12px;padding:12px 12px 4px;}
  .chat-thread:empty{display:none;}
  .chat-msg{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;font-family:'Inter',sans-serif;max-width:96%;}
  .chat-msg-user{background:var(--accent);border:1px solid var(--accent);color:#0F0B16;font-weight:500;align-self:flex-end;}
  .chat-msg-assistant{background:var(--surface);border:1px solid var(--line);color:var(--text);align-self:flex-start;}
  .chat-msg-actions{display:flex;gap:14px;margin:-2px 0 10px;}
  .chat-msg-actions button{border:none;background:transparent;color:var(--temp);font-size:11px;font-family:'JetBrains Mono',monospace;cursor:pointer;padding:0;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .chat-msg-actions button:hover{text-decoration:underline;}
  .chat-empty{color:var(--text-dim);font-style:italic;font-size:13px;}
  .chat-box textarea{width:100%;min-height:56px;background:var(--panel-oscuro, #241733);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;resize:vertical;outline:none;}
  .chat-box textarea:focus{border-color:var(--text);}
  .chat-box .btn-outline{background:var(--panel-oscuro, #241733);border-color:var(--line);}
  .confirmo-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1.5px solid #22C55E;border-radius:10px;padding:10px 14px;font-size:13px;background:var(--panel-oscuro, #241733);}
  .confirmo-banner span{color:var(--text-dim);font-weight:600;}
  .confirmo-banner .btn{background:var(--panel-oscuro, #241733);color:var(--accent-texto, var(--accent));border:1.5px solid var(--accent);}
  .chat-uploads{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .file-btn{font-size:12px;background:var(--panel-oscuro, #241733);color:var(--accent-texto, var(--accent));border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;}
  .file-btn:hover{border-color:var(--accent);}
  .file-name{font-size:11px;color:#3B0764;font-weight:600;}

</style>
<link rel="stylesheet" href="/css/jefes-piel-blanca.css">
<link rel="stylesheet" href="/css/plataforma-dash.css">
<style id="tt-estilo">
  /* ── DISEÑO BLANCO (mismo modelo que el chat del Jefe 366): logo + barra de chat redonda + línea de tiempo de módulos ── */
  body.piel-blanca{font-size:16px;}
  .wrap{padding-top:62px;}
  @media (max-width:900px){ .wrap{padding-top:0;} }
  select.estado-pill{font-family:Inter,sans-serif;font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:700;}
  select.estado-pill.borrador{background:#F0F0F0;color:#444;border-color:#E2E2E2;}
  select.estado-pill.activa{background:#F1FFC2;color:#33520a;border-color:#C0F800;}
  select.estado-pill.cerrada{background:#fff;color:#6B6B6B;border-color:#E2E2E2;}
  .save-status{font-family:Inter,sans-serif;font-size:12.5px;color:#1F9D55;}
  .view-toggle-btn{font-family:Inter,sans-serif;font-size:12.5px;}

  /* Hero: logo + barra de chat */
  #general-chat-box.chat-box{background:transparent;border:0;border-radius:0;padding:0;margin:0 0 6px;gap:10px;}
  .tt-hero-logo{width:clamp(96px,16vw,128px);height:auto;display:block;margin:6px auto 12px;}
  .hero-search{display:flex;align-items:center;gap:12px;width:100%;max-width:760px;margin:0 auto 4px;padding:6px 10px 6px 18px;min-height:58px;background:#fff;border:1px solid #E5E7EB;border-radius:100px;box-shadow:0 8px 30px rgba(0,0,0,.12);transition:border-color .15s;}
  .hero-search:focus-within{border-color:var(--accent);}
  .hero-search .lupa{width:22px;height:22px;color:#6B7280;flex:0 0 auto;}
  .hero-search .sep{flex:0 0 1px;align-self:stretch;margin:12px 0;background:#D1D5DB;}
  .hero-search textarea#chat-input{flex:1 1 auto;min-width:0;width:auto;background:transparent;border:0;border-radius:0;outline:0;color:#111827;font:16px Inter,sans-serif;padding:10px 0;resize:none;min-height:0;height:auto;max-height:140px;overflow-y:auto;}
  .hero-search textarea#chat-input::placeholder{color:#6B7280;opacity:1;}
  .hero-send{flex:0 0 auto;width:42px;height:42px;border:0;border-radius:50%;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s;}
  .hero-send:hover{transform:scale(1.08);}
  .hero-send:disabled{opacity:.45;cursor:wait;}
  .hero-send img{width:36px;height:36px;object-fit:contain;}
  /* Sugerencias estilo buscador: tarjeta blanca debajo de la barra, una por renglón con su lupa (como en Jefe de Contenido) */
  /* Autocompletar estilo buscador (Google / YouTube): aparece bajo la barra al enfocar o escribir y se filtra con lo que escribes */
  .hero-pill-wrap{position:relative;width:100%;max-width:760px;margin:0 auto 10px;}
  /* Al bajar por la página, la barra del chat (con el monito) se queda fija arriba, pegada a la barra superior.
     Para que siga fija durante todo el tablero, el contenedor del chat no hace caja propia (en vista dividida sí). */
  #temporada-main:not(.split-view) #general-chat-box{display:contents;}
  #temporada-main:not(.split-view) .hero-pill-wrap{position:sticky;top:calc(var(--topbar-h,70px) + 4px);z-index:55;padding:6px 0 12px;background:linear-gradient(#fff 72%,rgba(255,255,255,0));}
  #temporada-main:not(.split-view) .chat-thread{margin-bottom:10px;}
  #temporada-main:not(.split-view) .confirmo-banner{margin-bottom:10px;}
  .hero-pill-wrap .hero-search{margin-bottom:0;max-width:none;}
  .hero-ico{display:flex;align-items:center;flex:0 0 auto;}
  .hero-clip{width:36px;height:36px;border:0;background:transparent;color:#6B7280;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;padding:0;transition:background .15s;}
  .hero-clip:hover{background:#F0F0F0;color:#1A1A1A;}
  .hero-clip svg{width:22px;height:22px;}
  .clip-menu{position:absolute;left:12px;right:12px;top:calc(100% + 6px);z-index:61;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 40px rgba(0,0,0,.16);padding:8px;}
  .clip-menu[hidden]{display:none;}
  .clip-op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;border-radius:12px;padding:12px 14px;cursor:pointer;font:500 16px Inter,sans-serif;color:var(--text);}
  .clip-op:hover{background:var(--surface-2);}
  .file-name:empty{display:none;}
  .file-name{display:block;text-align:center;}
  .tt-acciones{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;}
  .tt-acciones[hidden]{display:none;}
  #chat-inline-status{display:block;text-align:center;}
  #chat-inline-status:empty{display:none;}
  .file-btn{background:#F0F0F0;color:var(--text);border:1px solid #E2E2E2;font-family:Inter,sans-serif;font-size:13px;font-weight:600;}
  .file-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
  .file-name{color:var(--text-dim);}
  .chat-inline-status{font-family:Inter,sans-serif;color:var(--text-dim);}
  .chat-thread{background:transparent;padding:6px 2px;max-width:900px;width:100%;margin:0 auto;}
  .chat-msg{font-family:Inter,sans-serif;}
  .chat-msg-assistant{background:#fff;border:1px solid #E5E7EB;color:#111827;border-bottom-left-radius:3px;}
  .chat-msg-user{border-bottom-right-radius:3px;}
  .chat-msg-actions button{font-family:Inter,sans-serif;color:var(--accent-texto);text-transform:none;font-size:12.5px;}
  .confirmo-banner{background:var(--accent-soft);border:1.5px solid var(--accent);max-width:900px;width:100%;margin:0 auto;}
  .confirmo-banner span{color:#33520a;}
  .confirmo-banner .btn{background:var(--accent);color:#0F0B16;border:0;}

  /* Línea de tiempo de módulos = tablero de respuestas (círculos numerados + botón gris, como el Jefe 366) */
  .tt-tl{position:relative;display:grid;grid-template-columns:var(--split) 0 minmax(0,1fr);align-items:center;max-width:1040px;margin:18px auto 24px;text-align:left;--split:50%;}

  @media (prefers-reduced-motion:no-preference){
    .tt-tl::before{animation:ttFluye 1.1s linear infinite;background-size:3px 9px;}

    .tt-n{transition:scale .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease;animation:ttEntra .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--i,0)*70ms);}

<script>
// ─── CLIENTE ID (detectado por pathname — Vercel no expone ?cliente= al browser) ───

const TEMPORADA_KEY = CLIENTE_ID + ':temporada-campanas';

function escHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function autoAlturaTextarea(ta){ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px'; }
// Copia al portapapeles; si el navegador no deja (sin permiso, página sin https, celular), usa el método de respaldo.
function copyText(btn, text){
  const listo=()=>{ const orig=btn.dataset.orig||btn.textContent; btn.dataset.orig=orig; btn.textContent='Copiado ✓'; setTimeout(()=>{ btn.textContent=orig; },1500); };
  const respaldo=()=>{
    try{
      const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px;';
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);
      const ok=document.execCommand('copy'); document.body.removeChild(ta);
      if(ok) listo(); else btn.textContent='No se pudo copiar';
    }catch(e){ btn.textContent='No se pudo copiar'; }
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(listo).catch(respaldo);
  else respaldo();
}

async function cargarInicial(){
  try{ const r=await window.storage.get(TEMPORADA_KEY); campanas = r&&r.value?JSON.parse(r.value):[]; }catch(e){ campanas=[]; }
  try{ const r=await window.storage.get(CLIENTE_ID+':catalogo-productos'); catalogoProductos = r&&r.value?JSON.parse(r.value):[]; }catch(e){ catalogoProductos=[]; }
  try{
    // Los perfiles de cliente viven en brand-book.audiencias (mismos que Jefe 366 y el ADN
    // comparten, {lista:[...]}, en orden de prioridad de compra). Con fallbacks de solo lectura
    // hacia llaves más viejas por si el cliente no ha vuelto a Jefe 366 desde esta migración.
    let r=await window.storage.get(CLIENTE_ID+':brand-book.audiencias');
    let data = r&&r.value?JSON.parse(r.value):null;
    if(data && Array.isArray(data.lista) && data.lista.length){
      perfilesCliente366 = data.lista;
    } else {
      let r2=await window.storage.get(CLIENTE_ID+':brand-book.366-perfil-cliente');
      if(!r2 || !r2.value) r2=await window.storage.get(CLIENTE_ID+':brand-book.evergreen-perfil-cliente');

// ─── GUARDADO (debounced) + SYNC CON EL JEFE DE AGENDA ───────────────────────
// El estado se refleja en 2 lugares: el toolbar de arriba (save-status) y, si está visible, un
// texto pegado al chat (chat-inline-status) -- así un error de guardado (ej. token vencido) no
// pasa desapercibido solo porque el usuario tiene la vista scrolleada al chat.
let saveTimer=null, savePending=false;
function mostrarEstadoGuardado(texto, esError){
  const a=document.getElementById('save-status');
  if(a) a.textContent=texto;
  const b=document.getElementById('chat-inline-status');
  if(b){ b.textContent=texto; b.classList.toggle('error', !!esError); }
}
function scheduleGuardarCampanas(){
  if(!campanasLoaded) return;
  savePending=true;
  mostrarEstadoGuardado('Guardando...', false);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>doGuardarCampanas(),600);
}
async function doGuardarCampanas(opts){
  clearTimeout(saveTimer); saveTimer=null; if(!savePending) return;
  try{
    await window.storage.set(TEMPORADA_KEY, JSON.stringify(campanas), opts);
    savePending=false;
    mostrarEstadoGuardado('Guardado ✓', false);
    setTimeout(()=>{ if(!savePending) mostrarEstadoGuardado('', false); },1800);
    scheduleAgendaSync();
  }catch(e){
    mostrarEstadoGuardado(e.status===401 ? '⚠️ Token incorrecto — vuelve a intentar para que te lo vuelva a pedir.' : '⚠️ No se pudo guardar. Revisa tu conexión e intenta de nuevo.', true);
  }
}

// Espeja al calendario cruzado de Jefes ({cliente}:agenda-eventos) las 2 tablas de TODAS las
// campañas que sí tienen fecha real por fila: el Calendario final de ejecución (Módulo 12) y el
// Plan de calentamiento de precampaña (Módulo 7, columna Fecha) -- así el usuario ve en la Agenda
// qué hacer cada día, no solo el calendario final. Sin tocar los eventos de otros Jefes (Contenido,
// Anuncios) ni las temporadas creadas manualmente en la Agenda. Mismo mecanismo que ya usan esos
// dos Jefes. origenId lleva el nombre del campo (calendario / pre_calentamiento) para que la
// Agenda sepa en qué array de la campaña escribir de vuelta si el usuario edita ahí.
const TEMPORADA_TABLAS_CON_FECHA = [
  { campo:'calendario', tituloCampo:r=>r.accion||r.fase },
  { campo:'pre_calentamiento', tituloCampo:r=>'Precampaña: '+(r.contenido||r.mensaje||r.canal||r.dia) },
  { campo:'post_acciones', tituloCampo:r=>'Postcampaña: '+(r.accion||r.momento) },
];
// Franjas de color de la Agenda (agenda.temporadas): Precampaña, Campaña activa y Postcampaña de cada campaña, calculadas
// con la fecha de inicio/fin de la campaña activa y las fechas de las filas de calentamiento y de postcampaña.
const ETAPAS_AGENDA={ pre:{label:'Precampaña',color:'#F2C230'}, activa:{label:'Campaña',color:'#B8F725'}, post:{label:'Postcampaña',color:'#38BDF8'} };
const esISO=f=>/^\d{4}-\d{2}-\d{2}$/.test(f||'');
function sumarDiasISO(iso,n){ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function franjasAgendaDeCampana(camp){
  const ini=esISO(camp.fecha_inicio_activa)?camp.fecha_inicio_activa:'', fin=esISO(camp.fecha_fin_activa)?camp.fecha_fin_activa:'';
  const fechasDe=campo=>(camp[campo]||[]).map(r=>r&&r.fecha).filter(esISO).sort();
  const pre=fechasDe('pre_calentamiento'), post=fechasDe('post_acciones');
  const out=[];
  if(pre.length){
    const a=pre[0], b=ini?sumarDiasISO(ini,-1):pre[pre.length-1];
    if(a<=b) out.push({etapa:'pre',inicio:a,fin:b});
  }
  if(ini) out.push({etapa:'activa',inicio:ini,fin:(fin&&fin>=ini)?fin:ini});
  if(post.length){
    const a=fin?sumarDiasISO(fin,1):post[0], b=post[post.length-1];
    if(a<=b) out.push({etapa:'post',inicio:a,fin:b});
  }
  return out;
}
let agendaSyncTimer=null, agendaSyncPending=false;
function scheduleAgendaSync(){ agendaSyncPending=true; clearTimeout(agendaSyncTimer); agendaSyncTimer=setTimeout(syncAgendaEventos,1500); }
async function syncAgendaEventos(opts){
  clearTimeout(agendaSyncTimer); agendaSyncTimer=null; if(!agendaSyncPending) return;
  try{
    const result=await window.storage.get(AGENDA_KEY);
    const data=(result&&result.value)?JSON.parse(result.value):{eventos:[],temporadas:[]};
    const otros=(data.eventos||[]).filter(e=>e.origen!=='temporada');
    const propios=[];
    campanas.forEach(camp=>{
      TEMPORADA_TABLAS_CON_FECHA.forEach(({campo,tituloCampo})=>{
        (camp[campo]||[]).forEach(row=>{
          if(!/^\d{4}-\d{2}-\d{2}$/.test(row.fecha||'')) return;
          propios.push({
            id:'temporada-'+camp.id+'-'+campo+'-'+row.id,
            origen:'temporada', origenId:camp.id+':'+campo+':'+row.id,
            fecha:row.fecha, titulo:(camp.nombre?camp.nombre+' · ':'')+(tituloCampo(row)||'(sin título)'),
            estado:row.estado||'idea',
          });
        });
      });
    });
    data.eventos=[...otros, ...propios];
    const franjas=[];
    campanas.forEach(camp=>{
      const nom=String(camp.temporada||camp.nombre||'Campaña').trim(); const corto=nom.length>26?nom.slice(0,25)+'…':nom;
      franjasAgendaDeCampana(camp).forEach(f=>{
        const e=ETAPAS_AGENDA[f.etapa];
        franjas.push({ id:'temporada-'+camp.id+'-'+f.etapa, origen:'temporada', campanaId:camp.id, nombre:e.label+' · '+corto, fechaInicio:f.inicio, fechaFin:f.fin, color:e.color });
      });
    });
    data.temporadas=[...(data.temporadas||[]).filter(t=>t&&t.origen!=='temporada'), ...franjas];
    await window.storage.set(AGENDA_KEY, JSON.stringify(data), opts);
    agendaSyncPending=false;
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ if(savePending) doGuardarCampanas({keepalive:true}); if(agendaSyncPending) syncAgendaEventos({keepalive:true}); } });
window.addEventListener('pagehide',()=>{ if(savePending) doGuardarCampanas({keepalive:true}); if(agendaSyncPending) syncAgendaEventos({keepalive:true}); });

  'Creativos de ads': { campo:'ads_creativos', tipo:'tabla', tablaId:'tabla-creativos', columnaClave:'etapa' },

// El modelo a veces copia literal la forma en que "CAMPOS REALES DEL DOCUMENTO" describe el campo
// en el prompt (ej. ⚠️GUARDAR: Campo de texto "Objetivo principal" o Tabla "Incentivos de
// producto") en vez de solo el nombre limpio -- se quita el prefijo descriptivo y las comillas
// antes de buscarlo en el lookup, así funciona sin importar cuál de las dos formas use.
function limpiarNombreGuardar(nombre){
  let n=(nombre||'').toString().trim();
  n=n.replace(/^(campo de texto|campo|tabla)\s*[:\-]?\s*/i,'').trim();
  const m=n.match(/^["“'](.+)["”']$/);
  if(m) n=m[1].trim();
  return n;
}
function parsearBloquesGuardar(texto){
  if(!texto) return [];
  const lineas=texto.split('\n');
  const resultados=[];
  let inicioContenido=null; // índice justo después de un ⚠️INICIO explícito; null si no se abrió
  let inicioParrafo=0; // índice del párrafo actual (desde la última línea en blanco o el último ⚠️GUARDAR)
  for(let i=0;i<lineas.length;i++){
    const linea=lineas[i].trim();
    if(/^⚠️\s*INICIO\s*:?\s*$/.test(linea)){ inicioContenido=i+1; continue; }
    const m=linea.match(/^⚠️\s*GUARDAR\s*:\s*(.+?)\s*$/);
    if(m){
      const nombre=limpiarNombreGuardar(m[1]);
      // Camino feliz: el modelo sí puso ⚠️INICIO. Si se le olvidó, en vez de perder el bloque
      // entero, cae al párrafo justo antes del ⚠️GUARDAR (desde la última línea en blanco) --
      // suele ser exactamente el contenido que se quería guardar.
      const desde = inicioContenido!=null ? inicioContenido : inicioParrafo;
      const contenido = lineas.slice(desde,i).join('\n').trim();
      resultados.push({ nombre, contenido });
      inicioContenido=null;
      inicioParrafo=i+1;
      continue;
    }
    if(linea==='') inicioParrafo=i+1;
  }
  return resultados;
}
// Tolera variaciones menores del modelo en el nombre del campo (mayúsculas, acentos, signos de
// puntuación tipo ¿?¡! o comillas) -- si el match exacto contra TEMPORADA_CAMPO_LOOKUP falla,
// reintenta con ambos nombres normalizados antes de descartar el bloque.
function normalizarNombreCampo(s){
  return (s||'').toString().trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[¿?¡!."'`:]/g,'')
    .replace(/\s+/g,' ').trim();
}
const TEMPORADA_CAMPO_LOOKUP_NORM={};
function construirLookupNormalizado(){
  Object.keys(TEMPORADA_CAMPO_LOOKUP).forEach(k=>{ TEMPORADA_CAMPO_LOOKUP_NORM[normalizarNombreCampo(k)]=TEMPORADA_CAMPO_LOOKUP[k]; });
}
function buscarLookupCampo(nombre){
  return TEMPORADA_CAMPO_LOOKUP[nombre] || TEMPORADA_CAMPO_LOOKUP_NORM[normalizarNombreCampo(nombre)];
}
construirLookupNormalizado();
// Cada línea "Columna: valor" va a su columna. Una fila nueva empieza cuando aparece una columna que no sigue a la anterior en
// el orden de la tabla (o se repite), así NO importa si el Jefe dejó líneas en blanco entre las columnas de una misma fila:
// antes eso partía cada fila en varias y los textos quedaban desfasados, uno por renglón.
function parsearFilasTabla(contenido, columnas){
  const etiquetas=columnas.map((col,idx)=>({ key:col.key, idx, re:new RegExp('^'+col.label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*:\\s*(.*)$','i') }));
  const filas=[]; let actual=null, ultimoIdx=-1, ultimaKey=null;
  contenido.split('\n').forEach(raw=>{
    const l=raw.trim(); if(!l) return;
    let hallada=null, valor='';
    for(const e of etiquetas){ const m=l.match(e.re); if(m){ hallada=e; valor=m[1].trim(); break; } }
    if(hallada){
      if(!actual || hallada.idx<=ultimoIdx){ actual={}; columnas.forEach(c=>{ actual[c.key]=''; }); filas.push(actual); }
      actual[hallada.key]=valor; ultimoIdx=hallada.idx; ultimaKey=hallada.key;
    } else if(actual && ultimaKey){
      actual[ultimaKey]=(actual[ultimaKey]+' '+l).trim(); // texto que sigue en otra línea: es de la misma columna
    }
  });
  return filas.filter(fila=>Object.values(fila).some(v=>v));
}
// Filas desfasadas (cada columna en un renglón distinto): si dos o más filas seguidas tienen datos en columnas distintas
// y ninguna se traslapa, se pueden juntar en una sola. Devuelve cuántas filas quedarían.
function juntarFilasDesfasadas(filas, columnas, soloContar){
  const llenas=f=>columnas.filter(c=>(f[c.key]||'').toString().trim()).map(c=>c.key);
  const out=[]; let actual=null, claves=new Set();
  filas.forEach(f=>{
    const k=llenas(f);
    if(actual && k.length && k.every(x=>!claves.has(x)) && columnas.some(c=>!claves.has(c.key))){
      k.forEach(x=>{ actual[x]=f[x]; claves.add(x); });
    } else { actual=Object.assign({}, f); claves=new Set(k); out.push(actual); }
  });
  return soloContar ? out.length : out;
}
function reacomodarFilas(id){
  const cfg=TEMPORADA_TABLAS[id]; const camp=activeCampana(); if(!cfg||!camp) return;
  const filas=filasDeTabla(id);
  camp[cfg.campo]=juntarFilasDesfasadas(filas, cfg.columnas).map(f=>Object.assign({id:f.id||newId()}, f));
  scheduleGuardarCampanas(); if(cfg.campo==='calendario'||cfg.campo==='pre_calentamiento'||cfg.campo==='post_acciones') scheduleAgendaSync();
  renderTabla(id);
}
function procesarConfirmoTemporada(mensajes){
  const camp=activeCampana(); if(!camp) return false;
  let ultimoAssistant=null;
  for(let i=mensajes.length-1;i>=0;i--){ if(mensajes[i].role==='assistant'){ ultimoAssistant=mensajes[i]; break; } }
  if(!ultimoAssistant) return false;
  return aplicarBloques(parsearBloquesGuardar(ultimoAssistant.content));
}
// Aplica al Documento una lista de bloques {nombre, contenido} (los ⚠️INICIO/⚠️GUARDAR que entrega el Jefe).
// Producto que el usuario eligió por chat: se busca en el catálogo (por nombre); si no está, queda como producto nuevo de la
// temporada y se agrega al catálogo del ADN en cuanto se aplica (ver registrarProductoNuevoEnADN).
let productoPendienteADN='';
function normProd(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function aplicarProductoDeBloque(camp, nombre){
  const n=normProd(nombre); if(!n) return '';
  const lista=catalogoProductos.filter(p=>p&&p.id&&p.nombre);
  const hallado=lista.find(p=>normProd(p.nombre)===n) || lista.find(p=>{ const m=normProd(p.nombre); return m.length>3 && (m.includes(n)||n.includes(m)); });
  if(hallado){
    camp.producto_origen='evergreen'; camp.producto_id=hallado.id; camp.producto_nombre=String(hallado.nombre).trim(); camp.grupo_id=hallado.grupo_id||''; camp.producto_nuevo='';
    return '';
  }
  camp.producto_origen='nuevo'; camp.producto_nuevo=nombre; camp.producto_id=''; camp.producto_nombre=''; camp.grupo_id='';
  return nombre;
}
async function registrarProductoNuevoEnADN(campId, nombre){
  try{
    const key=CLIENTE_ID+':catalogo-productos';
    const r=await window.storage.get(key);
    let lista=[]; try{ lista=r&&r.value?JSON.parse(r.value):[]; }catch(e){ lista=[]; }
    if(!Array.isArray(lista)) lista=[];
    let prod=lista.find(p=>p&&p.nombre&&normProd(p.nombre)===normProd(nombre));
    if(!prod){
      prod={ id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), nombre, tipo:'Producto', grupo_id:'', precio:'', costo:'', margen_pct:'', que_tanto_se_vende:'', inventario:'', notas:'Creado desde Jefe de Temporada' };
      lista.push(prod);
      await window.storage.set(key, JSON.stringify(lista));
    }
    if(!catalogoProductos.some(p=>p&&p.id===prod.id)) catalogoProductos.push(prod);
    const camp=campanas.find(c=>c.id===campId);
    if(camp && camp.producto_origen==='nuevo' && normProd(camp.producto_nuevo)===normProd(nombre)){
      camp.producto_origen='evergreen'; camp.producto_id=prod.id; camp.producto_nombre=String(prod.nombre).trim(); camp.grupo_id=prod.grupo_id||''; camp.producto_nuevo='';
      scheduleGuardarCampanas(); renderToolbar(); sincronizarFoco();
      const f=document.getElementById('f-producto_id'); if(f) f.value=camp.producto_id;
    }
    mostrarEstadoGuardado('✓ Producto agregado al catálogo del ADN: '+nombre, false);
  }catch(e){
    mostrarEstadoGuardado('El producto quedó como nuevo de esta temporada; no se pudo agregarlo al ADN (revisa tu conexión o token).', true);
  }
}
function aplicarBloques(bloques){
  const camp=activeCampana(); if(!camp) return false;
  if(!bloques || !bloques.length) return false;
  let aplicoAlgo=false;
  const temporadaAntes=camp.temporada;
  modulosTocados=new Set();
  bloques.forEach(({nombre:nombreBruto,contenido})=>{
    // "(reemplazar)" al final del nombre: actualización de una tabla completa — sus filas se sustituyen en vez de sumarse
    const reemplazar=/\(\s*reemplazar\s*\)\s*$/i.test(nombreBruto||'');
    const nombre=(nombreBruto||'').replace(/\s*\(\s*reemplazar\s*\)\s*$/i,'');
    const lookup=buscarLookupCampo(nombre);
    if(!lookup || !contenido) return;
    const modTocado=moduloDeCampo(lookup.campo); if(modTocado) modulosTocados.add(modTocado);
    if(lookup.tipo==='texto'){
      camp[lookup.campo]=contenido;
      aplicoAlgo=true;
    } else if(lookup.tipo==='producto'){
      productoPendienteADN=aplicarProductoDeBloque(camp, contenido.split('\n')[0].trim()) || productoPendienteADN;
      aplicoAlgo=true;
    } else if(lookup.tipo==='tabla'){
      const cfg=TEMPORADA_TABLAS[lookup.tablaId];
      if(!cfg) return;
      const filasNuevas=parsearFilasTabla(contenido, cfg.columnas);
      if(!filasNuevas.length) return;
      if(!Array.isArray(camp[lookup.campo])) camp[lookup.campo]=[];
      if(reemplazar) camp[lookup.campo]=[];
      const existentes=camp[lookup.campo];
      if(lookup.columnaClave){
        const clave=lookup.columnaClave;
        const porClave={};
        existentes.forEach((f,i)=>{ const k=(f[clave]||'').toString().trim().toLowerCase(); if(k) porClave[k]=i; });
        filasNuevas.forEach(nueva=>{
          const k=(nueva[clave]||'').toString().trim().toLowerCase();
          // al actualizar una fila solo se pisan las columnas que vienen con dato (las vacías conservan lo que ya había)
          if(k && porClave[k]!=null){ const idx=porClave[k]; const llenas=Object.fromEntries(Object.entries(nueva).filter(([,v])=>String(v||'').trim())); existentes[idx]=Object.assign({},existentes[idx],llenas,{id:existentes[idx].id||newId()}); }
          else existentes.push(Object.assign({id:newId()},nueva));
        });
      } else {
        filasNuevas.forEach(f=>existentes.push(Object.assign({id:newId()},f)));
      }
      aplicoAlgo=true;
    }
  });
  // El nombre es lo primero: si todavía es uno de arranque ("Campaña de…", "Nueva campaña", "… (copia)") y acaba de quedar
  // la temporada o evento, el nombre pasa a ser «Temporada · Producto» sin tener que pedirlo aparte.
  const explicito=bloques.some(b=>{ const l=buscarLookupCampo(b.nombre); return l && l.campo==='nombre' && b.contenido; });
  if(aplicoAlgo && !explicito && camp.temporada && camp.temporada!==temporadaAntes && nombreGenerico(camp.nombre)){
    const prod=String((camp.producto_origen==='nuevo' ? camp.producto_nuevo : camp.producto_nombre)||'').trim();
    const temp=String(camp.temporada).trim(); const corto=temp.length>60?temp.slice(0,59)+'…':temp;
    camp.nombre=corto+(prod?' · '+prod:'');
    modulosTocados.add(1);
  }
  return aplicoAlgo;
}
function nombreGenerico(n){
  const t=String(n||'').trim();
  return !t || /^(nueva campaña|temporal|campaña)$/i.test(t) || /^campaña de /i.test(t) || /\(copia\)\s*$/i.test(t);
}

function distanciaEdicion(a,b){
  const fila=Array(b.length+1).fill(0).map((_,j)=>j);
  for(let i=1;i<=a.length;i++){
    let ant=fila[0]; fila[0]=i;
    for(let j=1;j<=b.length;j++){ const t=fila[j]; fila[j]=a[i-1]===b[j-1]?ant:1+Math.min(ant,fila[j],fila[j-1]); ant=t; }
  }
  return fila[b.length];
}
// "Confirmo jefe", "confirmo jefe.", "CONFIRMO JEFE!" o con un error de dedo ("confrimo jefe") cuentan igual.
function esConfirmoJefe(texto){
  const n=(texto||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
  if(n==='CONFIRMO JEFE') return true;
  if(n.length<8||n.length>20) return false;
  return distanciaEdicion(n,'CONFIRMO JEFE')<=2;
}
function pideValidarMsg(texto){
  const t=limpiarMarcadoresGuardar(texto||'').slice(-400);
  return /(correcto|lo guardo|ajustar algo|ajustamos|confirmo jefe|est[aá] bien|quedamos con)/i.test(t) && /\?|confirmo jefe/i.test(t);
}
function ocultarBanner(){ const el=document.getElementById('chat-confirmo-banner'); if(el) el.style.display='none'; }
let guardadoEnLongitud=-1; // largo del chat cuando se guardó lo platicado con el botón (para no volver a ofrecerlo igual)
function actualizarBanner(){
  const el=document.getElementById('chat-confirmo-banner'); if(!el) return;
  const ultimo=chatMessages[chatMessages.length-1];
  const del_jefe=ultimo && ultimo.role==='assistant' && !/^⚠️/.test(ultimo.content);
  // 1) El Jefe entregó bloques o está pidiendo validar: "Guardar (CONFIRMO JEFE)". Aunque no traiga bloques, CONFIRMO JEFE
  //    lee la conversación y llena los cuadros.
  // 2) Si el Jefe solo siguió platicando (por ejemplo "perfecto, dolor claro") pero ya hay respuestas del usuario, se ofrece
  //    guardar lo platicado: así ninguna respuesta se queda sin respaldar en los cuadros.
  const validando = del_jefe && (parsearBloquesGuardar(ultimo.content).length>0 || pideValidarMsg(ultimo.content));
  const usuarios=chatMessages.filter(m=>m.role==='user');
  // solo si hay una respuesta nueva que no sea el propio CONFIRMO JEFE y no se acaba de guardar todo
  const respuestas = usuarios.length>=2 && !esConfirmoJefe(usuarios[usuarios.length-1].content) && chatMessages.length!==guardadoEnLongitud;
  const texto=document.getElementById('chat-confirmo-texto'), btn=document.getElementById('chat-confirmo-btn');
  if(validando){
    // Dice el módulo REAL donde se va a guardar (según los cuadros que trae el mensaje), sin depender del número que escribió el Jefe.
    const mods=[...new Set(parsearBloquesGuardar(ultimo.content).map(b=>{ const l=buscarLookupCampo(limpiarNombreGuardar((b.nombre||'').replace(/\s*\(\s*reemplazar\s*\)\s*$/i,''))); return l?moduloDeCampo(l.campo):0; }).filter(Boolean))].sort((a,b)=>a-b);
    const nombresMod=mods.map(n=>{ const m=TEMPORADA_MODULOS_CHECKLIST.find(x=>x.num===n); return 'Módulo '+n+(m?' · '+m.nombre:''); });
    if(texto) texto.textContent = nombresMod.length ? '🫡 Se va a guardar en: '+nombresMod.join(' y ')+'.' : '🫡 Hay contenido listo para guardar en tu tablero de respuestas.';
    if(btn){ btn.textContent='Guardar (CONFIRMO JEFE)'; btn.onclick=confirmarDesdeBanner; }
    el.style.display='flex';
  } else if(del_jefe && respuestas){
    if(texto) texto.textContent='🫡 ¿Guardamos en los cuadros lo que llevamos platicado?';
    if(btn){ btn.textContent='Guardar lo platicado'; btn.onclick=()=>confirmarChat(true); }
    el.style.display='flex';
  } else {
    el.style.display='none';
  }
}
// Si el Jefe no entregó bloques para guardar (o el usuario pide "llenar los cuadros con lo platicado"), se le pide a la IA
// que saque de TODA la conversación lo ya acordado, en el mismo formato de bloques, y eso se aplica al Documento.
async function extraerYAplicar(){
  const camp=activeCampana(); if(!camp || !chatMessages.length) return false;
  mostrarEstadoGuardado('Revisando la conversación para llenar los cuadros…', false);
  try{
    const res=await fetch('/api/consultor-366',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ messages:chatMessages, accion:'extraer', cliente:CLIENTE_ID, campanaId:camp.id, agente:'temporada', producto_origen:camp.producto_origen||'evergreen', producto_id:camp.producto_id||'', producto_nombre:camp.producto_nombre||'', grupo_id:camp.grupo_id||'' }),
    });
    const data=await res.json();
    if(!res.ok){ mostrarEstadoGuardado(data.error||'No se pudo revisar la conversación.', true); return false; }
    const bloques=parsearBloquesGuardar(data.text||'');
    return aplicarBloques(bloques);
  }catch(e){ mostrarEstadoGuardado('No se pudo revisar la conversación (conexión).', true); return false; }
}
async function confirmarChat(soloExtraer){
  ocultarBanner();
  const camp0=activeCampana(); if(!camp0) return false;
  productoPendienteADN='';
  let aplicado = soloExtraer ? false : procesarConfirmoTemporada(chatMessages);
  if(!aplicado) aplicado = await extraerYAplicar();
  if(aplicado){
    guardadoEnLongitud=chatMessages.length;
    scheduleGuardarCampanas();
    // pasa al tablero de respuestas: abre el primer módulo que se llenó y lo muestra
    const primero=[...modulosTocados].sort((a,b)=>a-b)[0];
    if(primero) pasoAbierto=primero;
    render();
    if(productoPendienteADN){ const pend=productoPendienteADN; productoPendienteADN=''; registrarProductoNuevoEnADN(camp0.id, pend); }
    mostrarEstadoGuardado('✓ Cuadros llenados: '+[...modulosTocados].sort((a,b)=>a-b).map(n=>'módulo '+n).join(', '), false);
    if(primero) setTimeout(()=>{ const r=document.querySelector('#tt-tl .tt-row[data-mod="'+primero+'"]'); if(r) r.scrollIntoView({behavior:'smooth',block:'start'}); },120);
  } else {
    mostrarEstadoGuardado('No encontré nada ya acordado en la conversación para llenar los cuadros. Sigue platicando con el Jefe y vuelve a confirmar.', true);
  }
  return aplicado;
}

function leerArchivoComoTexto(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsText(file); }); }

// Copia de una campaña: mismos cuadros, chat limpio, y lo primero que se pide es el nombre.
function crearCopiaDe(id){

  const nueva=JSON.parse(JSON.stringify(camp));
  nueva.id=newId(); nueva.estado='borrador'; nueva.creadoEn=new Date().toISOString();

  nueva.calendario=(nueva.calendario||[]).map(r=>({...r,id:newId()}));

  campanas.unshift(nueva);
  campanaActivaId=nueva.id; chatAbierto=true; pasoAbierto=null; modulosTocados=new Set();

function filaTieneContenido(f){ return !!(f && Object.keys(f).some(k=>k!=='id' && (f[k]||'').toString().trim())); }
// Las tablas con filas fijas (fases, acciones de postcampaña, creativos...) nacen con el nombre de cada fila escrito:
// eso no cuenta como "llena". Solo cuenta lo que se escribió además de esos nombres de fila.
let _etiquetasFijas=null;
function etiquetasFijasDe(campo){
  if(!_etiquetasFijas){
    _etiquetasFijas={};
    const base=mkCampana();
    Object.keys(base).forEach(k=>{
      if(!Array.isArray(base[k])) return;
      const set=new Set();
      base[k].forEach(f=>{ if(f) Object.keys(f).forEach(c=>{ if(c!=='id' && typeof f[c]==='string' && f[c].trim()) set.add(f[c].trim()); }); });
      _etiquetasFijas[k]=set;
    });
  }
  return _etiquetasFijas[campo]||new Set();
}
function tablaLlena(camp, campo){
  if(!Array.isArray(camp[campo])) return false;
  const fijas=etiquetasFijasDe(campo);
  return camp[campo].some(f=>f && Object.keys(f).some(k=>{ const v=(f[k]||'').toString().trim(); return k!=='id' && v && !fijas.has(v); }));
}
function campoLleno(camp, campo){ return !!(camp[campo]||'').toString().trim(); }
function evaluarModuloCampana(camp, mod){
  const faltantes=[];
  (mod.campos||[]).forEach(c=>{ if(!campoLleno(camp,c)) faltantes.push(c); });
  (mod.tablas||[]).forEach(t=>{ if(!tablaLlena(camp,t)) faltantes.push(t); });
  if(mod.producto){
    const prod = camp.producto_origen==='nuevo' ? camp.producto_nuevo : camp.producto_nombre;
    if(!(prod||'').toString().trim()) faltantes.push('producto elegido');
  }
  return Object.assign({}, mod, { completo: faltantes.length===0, faltantes });
}
function calcularCompletitudCampana(camp){
  return TEMPORADA_MODULOS_CHECKLIST.map(mod=>evaluarModuloCampana(camp, mod));
}
function renderChecklistCompletitud(camp){
  const estado = calcularCompletitudCampana(camp);
  const chips = estado.map(m=>`<span class="chk-chip${m.completo?' ok':''}" title="${m.completo?'Completo':'Faltan datos en este módulo'}">${m.completo?'✓':'○'} ${m.num}. ${escHtml(m.nombre)}</span>`).join('');
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;">${chips}</div>`;
}
// Antes de compartir con otro Jefe, avisa (sin bloquear) si faltan módulos clave -- el usuario
// decide si de todas formas quiere compartir lo que ya tiene.
function confirmarCompletitudAntesDeCompartir(camp){
  const incompletos = calcularCompletitudCampana(camp).filter(m=>!m.completo);
  if(!incompletos.length) return true;
  const lista = incompletos.map(m=>'- Módulo '+m.num+' ('+m.nombre+')').join('\n');
  return confirm('Todavía faltan datos en estos módulos:\n\n'+lista+'\n\n¿Compartir de todas formas con lo que ya tienes?');
}
// Resumen COMPLETO (no solo 8 datos básicos) -- lleva todo lo que ya se construyó en Producto,
// Perfil de Cliente y Comunicación (dolores, deseos, miedos, objeciones, ángulos, frases, CTAs),
// no solo Definición/Documento Maestro. Es lo que hace falta para que Contenido/Anuncios (o una
// landing) tengan la base real de la campaña sin tener que reconstruirla desde cero.
function campoResumen(camp, campo, label){
  const v=(camp[campo]||'').toString().trim();
  return v ? label+':\n'+v : null;
}
function tablaResumen(tablaId, camp, titulo){
  const cfg=TEMPORADA_TABLAS[tablaId];
  if(!cfg) return null;
  const filas=(camp[cfg.campo]||[]).filter(f=>cfg.columnas.some(c=>(f[c.key]||'').toString().trim()));
  if(!filas.length) return null;
  const texto=filas.map(f=>'- '+cfg.columnas.map(c=>{
    const v=(f[c.key]||'').toString().trim();
    return v ? c.label+': '+v : null;
  }).filter(Boolean).join(' | ')).join('\n');
  return (titulo||cfg.campo)+':\n'+texto;
}

    <div class="metas-calc-item"><span>Leads necesarios estimados</span><span>${leads}</span></div>

}

  if(/^(nombre|temporada|objetivo_principal|incentivo|fecha_|producto_)/.test(c)) return 1;

  // Los tres Jefes reciben la campaña elegida (pastilla c:<id>): Contenido y Anuncios se quedan trabajándola con toda su estrategia.
  const foco='c:'+camp.id;
  try{ localStorage.setItem('jefeshub_foco_'+CLIENTE_ID, JSON.stringify({ id:foco, nombre:camp.producto_nombre||camp.nombre||'' })); }catch(e){}

}
// Vaciar cuadros (por ejemplo cuando una campaña se duplicó y quedó mezclada con la información de otra). Se conservan el
// nombre, el estado, el producto y el chat.
const CAMPOS_PROTEGIDOS=['id','nombre','estado','creadoEn','chat_general','producto_origen','producto_id','producto_nombre','producto_nuevo','grupo_id'];
function vaciarCuadros(n){
  const camp=activeCampana(); if(!camp) return;
  const base=mkCampana();
  const claves=Object.keys(base).filter(k=>!CAMPOS_PROTEGIDOS.includes(k) && (n==null || moduloDeCampo(k)===n));
  if(!claves.length) return;
  const que = n==null ? 'TODOS los cuadros de esta campaña' : 'los cuadros del módulo '+n;
  if(!confirm('¿Vaciar '+que+'? Se borra lo escrito ahí; el nombre, el producto y el chat se quedan.\n\nSi el chat también trae información de otra campaña, usa además «Reiniciar chat».')) return;
  claves.forEach(k=>{ camp[k]=base[k]; });
  if(n!=null) pasoAbierto=n;
  scheduleGuardarCampanas(); scheduleAgendaSync();
  render();
}
function abrirPaso(n, desdeChat){
  pasoAbierto = (pasoAbierto===n && !desdeChat) ? null : n;
  document.querySelectorAll('#tt-tl .tt-row:not(.ext)').forEach(r=>{
    const m=+r.dataset.mod, ab=m===pasoAbierto;
    r.classList.toggle('open',ab);
    if(ab){ r.classList.remove('actualizado'); modulosTocados.delete(m); }
    if(r.nextElementSibling) r.nextElementSibling.hidden=!ab;
  });
  if(pasoAbierto!=null){
    const row=document.querySelector('#tt-tl .tt-row[data-mod="'+pasoAbierto+'"]');
    if(row) setTimeout(()=>row.scrollIntoView({behavior:'smooth',block:'start'}),60);
  }
}
function construirLineaTiempo(container, camp){
  const secciones=[...container.querySelectorAll(':scope > .doc-section')];
  const conecta=container.querySelector(':scope > .nota-box');
  const estado=calcularCompletitudCampana(camp);
  const siguiente=estado.find(m=>!m.completo);
  const tl=document.createElement('div'); tl.className='tt-tl'; tl.id='tt-tl';
  secciones.forEach((sec,i)=>{
    const num=i+1, mod=estado[i]||{completo:false,faltantes:[]};
    const titulo=(sec.querySelector('.doc-title')||{}).textContent||('Módulo '+num);
    const row=document.createElement('div');
    row.className='tt-row'+(mod.completo?' done':'')+(siguiente&&siguiente.num===num?' next':'')+(pasoAbierto===num?' open':'')+(modulosTocados.has(num)?' actualizado':'');
    row.dataset.mod=num; row.style.setProperty('--i',i);
    row.innerHTML='<div></div><div class="tt-c"><button type="button" class="tt-n" aria-label="Módulo '+num+'">'+num+'</button></div><div class="tt-r"><button type="button" class="tt-btn">'+escHtml(titulo)+'</button></div>';
    const slot=document.createElement('div'); slot.className='tt-slot'; slot.hidden=pasoAbierto!==num;
    const info=document.createElement('div'); info.className='tt-estado'+(mod.completo?' ok':'');
    info.textContent = mod.completo
      ? '✓ Módulo completo. Aquí queda el registro de lo que lleva esta campaña.'
      : 'Lo que confirmes en el chat con CONFIRMO JEFE se llena aquí solo. También lo puedes escribir tú.';
    slot.appendChild(info); slot.appendChild(sec);
    const vac=document.createElement('div'); vac.className='tt-vaciar';
    vac.innerHTML='<button type="button" class="btn-danger-outline">Vaciar este módulo</button>';
    vac.querySelector('button').addEventListener('click',()=>vaciarCuadros(num));
    slot.appendChild(vac);
    row.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>abrirPaso(num)));
    tl.appendChild(row); tl.appendChild(slot);
  });
  // Siguientes pasos del ecosistema: llevan a otro Jefe con esta campaña ya cargada (ver abrirJefeConCampana)
  PASOS_SIGUIENTES.forEach((ps,k)=>{
    const row=document.createElement('div');
    row.className='tt-row ext'; row.dataset.mod=ps.num; row.style.setProperty('--i',secciones.length+k);
    row.innerHTML='<div></div><div class="tt-c"><button type="button" class="tt-n" aria-label="Paso '+ps.num+'">'+ps.num+'</button></div><div class="tt-r"><button type="button" class="tt-btn">'+escHtml(ps.titulo)+'</button></div>';
    row.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>abrirJefeConCampana(ps.jefe)));
    tl.appendChild(row);
  });
  container.appendChild(tl);
}

// coincida con ese producto; si no hay coincidencia (o no hay producto elegido), usa el primero
// de la lista (mayor prioridad de compra) -- mismo criterio que usa el backend en consultor-366.js.
function elegirPerfilClienteRecurrente(){
  if(!perfilesCliente366.length) return null;
  const camp=activeCampana();
  const nombreProducto=(camp?(camp.producto_origen==='nuevo'?camp.producto_nuevo:camp.producto_nombre):'')||'';
  const buscado=nombreProducto.toString().trim().toLowerCase();
  if(buscado){
    const match=perfilesCliente366.find(p=>p && p.producto_relacionado && p.producto_relacionado.toString().toLowerCase().includes(buscado));
    if(match) return match;
  }
  return perfilesCliente366[0];
}

// ─── CHAT GENERAL (guiado, definición + metas..calendario) ──────────────────
// Los bloques ⚠️INICIO...⚠️GUARDAR quedan intactos en chatMessages (los necesita
// procesarConfirmoTemporada para leer fila por fila / campo por campo) pero se OCULTAN COMPLETOS
// al mostrar el mensaje -- ese contenido es formato técnico para la máquina (ej. "Pregunta: X /
// Respuesta: Y" fila por fila), no algo que el usuario necesite leer; lo único visible es el
// texto normal que el Jefe escribe fuera de esos bloques.
function limpiarMarcadoresGuardar(texto){
  if(!texto) return texto;
  const lineas=texto.split('\n');
  const resultado=[];
  let dentroBloque=false;
  for(const linea of lineas){
    const t=linea.trim();
    if(/^⚠️\s*INICIO\s*:?\s*$/.test(t)){ dentroBloque=true; continue; }
    if(dentroBloque){
      if(/^⚠️\s*GUARDAR\s*:/.test(t)) dentroBloque=false;
      continue;
    }
    if(/^⚠️\s*GUARDAR\s*:/.test(t)) continue; // camino tolerante sin ⚠️INICIO: solo oculta el marcador
    resultado.push(linea);
  }
  return resultado.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
// alInicioDeRespuesta: cuando el Jefe contesta, se muestra su respuesta desde el PRIMER renglón (con tu mensaje arriba) y no hasta el final.
function renderChatThread(alInicioDeRespuesta){
  const thread=document.getElementById('chat-thread');
  if(!thread) return;
  if(!chatMessages.length){
    thread.innerHTML='';
    return;
  }
  // El texto a copiar se lee del mensaje (por su número), no se mete en el HTML: así comillas, signos de pesos, ${} o saltos
  // de línea ya no rompen el botón "Copiar".
  thread.innerHTML = chatMessages.map((m,i)=>{
    if(m.role==='user') return `<div class="chat-msg chat-msg-user">${escHtml(m.content)}</div>`;
    const visible=limpiarMarcadoresGuardar(m.content);
    return `<div class="chat-msg chat-msg-assistant">${escHtml(visible)}</div>
      <div class="chat-msg-actions"><button type="button" data-copiar="${i}">Copiar</button></div>`;
  }).join('');
  thread.querySelectorAll('[data-copiar]').forEach(b=>b.addEventListener('click',()=>{
    const m=chatMessages[+b.dataset.copiar]; if(m) copyText(b, limpiarMarcadoresGuardar(m.content));
  }));
  thread.scrollTop = thread.scrollHeight;
  if(alInicioDeRespuesta){
    const resp=[...thread.querySelectorAll('.chat-msg-assistant')].pop();
    if(resp){
      const previo=resp.previousElementSibling && resp.previousElementSibling.classList.contains('chat-msg-user') ? resp.previousElementSibling : resp;
      thread.scrollTop=Math.max(0, previo.offsetTop-thread.offsetTop-6);   // dentro del recuadro del chat
      previo.scrollIntoView({block:'start',behavior:'auto'});               // y en la página, debajo de la barra fija
    }
  }
}
async function enviarMensajeChat(){
  if(chatBusy) return;
  const input=document.getElementById('chat-input');
  const texto=input.value.trim();
  if(!texto) return;
  const camp=activeCampana(); if(!camp) return;
  input.value=''; input.style.height='auto';
  chatBusy=true;
  if(esConfirmoJefe(texto)){ document.getElementById('chat-send-btn').disabled=true; await confirmarChat(); }
  chatMessages.push({role:'user',content:texto});
  ocultarBanner();
  renderChatThread();
  guardarChatsEnCampana();
  document.getElementById('chat-send-btn').disabled=true;
  try{
    const res=await fetch('/api/consultor-366',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ messages:chatMessages, cliente:CLIENTE_ID, campanaId:camp.id, agente:'temporada', modulo:'plan', imagenes:chatImagenes, txtConversacion:chatTxtConversacion, producto_origen:camp.producto_origen||'evergreen', producto_id:camp.producto_id||'', producto_nombre:camp.producto_nombre||'', grupo_id:camp.grupo_id||'' }),
    });
    const data=await res.json();
    if(!res.ok){
      chatMessages.push({role:'assistant',content:'⚠️ '+(data.error||'No se pudo generar respuesta. Intenta de nuevo.')});
    } else {
      chatMessages.push({role:'assistant',content:data.text});
    }
    limpiarAdjuntosChat();
  }catch(e){
    chatMessages.push({role:'assistant',content:'⚠️ Hubo un error de conexión. Intenta de nuevo en un momento.'});
  }finally{
    chatBusy=false;
    document.getElementById('chat-send-btn').disabled=false;
    renderChatThread(true);
    actualizarBanner();
    guardarChatsEnCampana();
  }
}
function reiniciarChat(){
  if(chatMessages.length && !confirm('¿Reiniciar la conversación? Se perderá lo que llevas platicado (no lo que ya guardaste en el Documento).')) return;
  chatMessages=[];
  ocultarBanner();
  renderChatThread();
  guardarChatsEnCampana();
}

cargarInicial().then(async ()=>{
  try{ if(window.__foco) await window.__foco.ready; }catch(e){}
  if(!window.__foco) return;
  // Las ofertas de Producto 366 que aún no están en el catálogo del ADN también se pueden elegir.
  let nuevos = false;
  window.__foco.lista().forEach(p=>{ if(p.origen366 && !catalogoProductos.some(x=>x&&x.id===p.id)){ catalogoProductos.push(p); nuevos = true; } });
  if(nuevos) render();
  sincronizarFoco();
  window.__foco.onChange(f=>{ aplicarFocoACampana(f); });
});
