<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hub de Jefes</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;800;900&family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blanco:#FFFFFF; --fondo:#F6F7F1; --borde:#E4E6DB; --negro:#0F0E0C;
    --lima:#C9F507; --oliva:#A4B41C; --gris:#5D6055;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:var(--fondo); color:var(--negro); font-family:'Barlow',sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }

  .aviso{ background:var(--negro); color:#fff; font-size:13px; padding:8px 16px; text-align:center; }
  .aviso b{ color:var(--lima); }

  header{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 24px; flex-wrap:wrap; }
  .marca{ font-family:'Bebas Neue'; font-size:30px; letter-spacing:.04em; line-height:1; }
  .marca span{ color:var(--oliva); margin-left:.15em; }
  .marca span:empty{ display:none; }
  .btn-sec{ display:inline-flex; align-items:center; gap:6px; font:600 14px 'Barlow'; border:1.5px solid var(--negro); background:var(--blanco); border-radius:999px; padding:8px 16px; cursor:pointer; }
  .btn-sec:hover{ background:var(--negro); color:#fff; }

  main{ flex:1; width:100%; max-width:760px; margin:0 auto; padding:4vh 20px 40px; display:flex; flex-direction:column; align-items:center; }
  .robot{ width:110px; height:auto; margin:0 0 12px; display:block; }
  /* Texto con corchetes, igual que "Por Jany Dávila" en jefeshub.com */
  .ceja{ display:flex; align-items:center; justify-content:center; gap:16px; margin:-12px 0 26px; }
  .ceja .cor{ display:flex; flex-direction:column; gap:5px; }
  .ceja .cor i{ display:block; width:12px; height:12px; border:0 solid var(--oliva); }
  .ceja .cor.izq i:first-child{ border-top-width:2px; border-left-width:2px; }
  .ceja .cor.izq i:last-child{ border-bottom-width:2px; border-left-width:2px; }
  .ceja .cor.der i:first-child{ border-top-width:2px; border-right-width:2px; }
  .ceja .cor.der i:last-child{ border-bottom-width:2px; border-right-width:2px; }
  .ceja span{ font:600 13px/1.4 'Inter Tight',sans-serif; letter-spacing:.25em; text-transform:uppercase; color:var(--oliva); text-align:center; }
  h1{ font-family:'Inter Tight'; font-weight:900; font-size:clamp(32px,6vw,54px); line-height:1.05; letter-spacing:-.02em; text-align:center; margin:0 0 26px; }
  h1 mark{ background:var(--lima); color:var(--negro); padding:0 .18em; border-radius:6px; }

  .caja-wrap{ position:relative; width:100%; }
  .caja{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; width:100%; background:var(--blanco); border:2px solid var(--borde); border-radius:22px; padding:10px 10px 10px 18px; box-shadow:0 6px 24px rgba(15,14,12,.06); transition:border-color .15s, box-shadow .15s; }
  .caja:focus-within{ border-color:var(--negro); box-shadow:0 8px 30px rgba(15,14,12,.10); }
  .chip-jefe{ display:inline-flex; align-items:center; gap:6px; background:var(--lima); border-radius:999px; padding:4px 6px 4px 6px; font-weight:700; font-size:14px; white-space:nowrap; }
  .chip-jefe[hidden]{ display:none; }
  .chip-jefe img{ width:22px; height:22px; object-fit:contain; }
  .chip-jefe button{ border:0; background:transparent; cursor:pointer; font-size:16px; line-height:1; padding:0 4px; }
  .caja textarea{ flex:1; min-width:180px; border:0; outline:0; resize:none; font:500 18px/1.4 'Barlow'; color:var(--negro); background:transparent; padding:8px 0; max-height:160px; overflow:hidden; }
  .caja textarea::placeholder{ color:#9A9D90; }
  .btn-ir{ flex:none; width:48px; height:48px; border-radius:50%; border:0; background:var(--negro); color:var(--lima); font-size:22px; font-weight:700; cursor:pointer; display:grid; place-items:center; }
  .btn-ir:hover{ background:#2a2925; }
  .ayuda{ font-size:13px; color:var(--gris); margin:10px 0 0; text-align:center; }
  .ayuda kbd{ font:700 12px 'Barlow'; background:var(--blanco); border:1px solid var(--borde); border-radius:6px; padding:1px 6px; }

  /* Lista de @Jefes */
  .menu{ position:absolute; left:0; right:0; top:calc(100% + 8px); background:var(--blanco); border:1.5px solid var(--borde); border-radius:16px; box-shadow:0 14px 40px rgba(15,14,12,.14); padding:6px; z-index:20; max-height:340px; overflow:auto; }
  .menu[hidden]{ display:none; }
  .menu .op{ display:flex; align-items:center; gap:12px; width:100%; border:0; background:transparent; text-align:left; padding:8px 10px; border-radius:10px; cursor:pointer; }
  .menu .op[aria-selected="true"], .menu .op:hover{ background:var(--fondo); }
  .menu .op img{ width:30px; height:30px; object-fit:contain; flex:none; }
  .menu .op b{ display:block; font-size:15px; }
  .menu .op small{ color:var(--gris); font-size:13px; }
  .menu .vacio{ padding:10px; color:var(--gris); font-size:14px; }

  /* Ejemplos */
  .ejemplos{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:20px; }
  .ejemplos button{ font:500 14px 'Barlow'; background:var(--blanco); border:1px solid var(--borde); border-radius:999px; padding:7px 14px; cursor:pointer; color:var(--negro); }
  .ejemplos button:hover{ border-color:var(--negro); }

  /* Resultado */
  .resultado{ width:100%; margin-top:26px; }
  .resultado[hidden]{ display:none; }
  .tarjeta{ background:var(--negro); color:#fff; border-radius:22px; padding:22px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .tarjeta .logo{ width:64px; height:64px; border-radius:16px; background:var(--lima); display:grid; place-items:center; flex:none; }
  .tarjeta .logo img{ width:44px; height:44px; object-fit:contain; }
  .tarjeta .txt{ flex:1; min-width:200px; }
  .tarjeta .eti{ font-size:13px; color:var(--lima); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .tarjeta .nom{ font-family:'Bebas Neue'; font-size:34px; letter-spacing:.03em; line-height:1.05; }
  .tarjeta .por{ font-size:15px; color:#D7D9CF; margin-top:2px; }
  .tarjeta .preg{ font-size:14px; color:#BFC2B5; margin-top:8px; font-style:italic; }
  .btn-pri{ display:inline-flex; align-items:center; gap:8px; background:var(--lima); color:var(--negro); border:0; border-radius:999px; padding:13px 22px; font:700 16px 'Barlow'; cursor:pointer; }
  .btn-pri:hover{ filter:brightness(.95); }
  .tambien{ margin-top:14px; }
  .tambien p{ font-size:14px; color:var(--gris); margin:0 0 8px; }
  .alt{ display:flex; gap:8px; flex-wrap:wrap; }
  .alt button{ display:inline-flex; align-items:center; gap:8px; background:var(--blanco); border:1.5px solid var(--borde); border-radius:999px; padding:6px 14px 6px 8px; font:600 14px 'Barlow'; cursor:pointer; }
  .alt button:hover{ border-color:var(--negro); }
  .alt img{ width:24px; height:24px; object-fit:contain; }

  /* Fila de Jefes */
  .fila{ width:100%; margin-top:44px; }
  .fila p{ text-align:center; font-size:13px; color:var(--gris); margin:0 0 12px; }
  .iconos{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .iconos a{ width:52px; height:52px; border-radius:14px; background:var(--blanco); border:1px solid var(--borde); display:grid; place-items:center; transition:transform .12s, border-color .12s; }
  .iconos a:hover{ transform:translateY(-2px); border-color:var(--negro); }
  .iconos img{ width:30px; height:30px; object-fit:contain; }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--negro); color:#fff; padding:12px 18px; border-radius:14px; font-size:14px; max-width:calc(100% - 32px); box-shadow:0 10px 30px rgba(0,0,0,.25); z-index:50; }
  .toast[hidden]{ display:none; }

  @media (max-width:560px){
    header{ padding:14px 16px; }
    main{ padding:3vh 16px 32px; }
    .robot{ width:84px; }
    .ceja{ gap:10px; }
    .ceja span{ font-size:11px; letter-spacing:.18em; }
    .caja textarea{ font-size:16px; }
    .tarjeta{ padding:18px; }
  }
</style>
</head>
<body>
<div class="aviso"><b>Muestra</b> · Buscador de Jefes. Escribe lo que necesitas o usa <b>@</b> para llamar a un Jefe directo.</div>

<header>
  <div class="marca">HUB DE JEFES <span id="marcaCliente"></span></div>
  <a class="btn-sec" id="verTodos" href="#">Ver todos los Jefes ›</a>
</header>

<main>
  <svg class="robot" viewBox="0 0 120 112" aria-hidden="true">
    <line x1="60" y1="10" x2="60" y2="26" stroke="#C9F507" stroke-width="7" stroke-linecap="round"/>
    <circle cx="60" cy="9" r="8" fill="#C9F507"/>
    <rect x="6" y="50" width="12" height="28" rx="6" fill="#C9F507"/>
    <rect x="102" y="50" width="12" height="28" rx="6" fill="#C9F507"/>
    <rect x="16" y="24" width="88" height="80" rx="38" fill="#C9F507"/>
    <ellipse cx="44" cy="62" rx="8" ry="11" fill="#0F0E0C"/>
    <ellipse cx="76" cy="62" rx="8" ry="11" fill="#0F0E0C"/>
    <path d="M50 84 Q60 91 70 84" fill="none" stroke="#0F0E0C" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <h1>¿En qué te ayudo <mark>hoy</mark>?</h1>
  <div class="ceja"><div class="cor izq"><i></i><i></i></div><span id="cejaTxt">Hub de Jefes</span><div class="cor der"><i></i><i></i></div></div>

  <div class="caja-wrap">
    <div class="caja" id="caja">
      <span class="chip-jefe" id="chip" hidden></span>
      <textarea id="q" rows="1" placeholder="Escribe lo que necesitas… o @ para llamar a un Jefe" aria-label="¿En qué te ayudo hoy?" autocomplete="off"></textarea>
      <button class="btn-ir" id="ir" aria-label="Buscar a mi Jefe">→</button>
    </div>
    <div class="menu" id="menu" role="listbox" hidden></div>
  </div>
  <p class="ayuda">Escribe <kbd>@</kbd> para elegir a un Jefe · <kbd>Enter</kbd> para ir</p>

  <div class="ejemplos" id="ejemplos"></div>

  <section class="resultado" id="resultado" hidden aria-live="polite"></section>

  <div class="fila">
    <p>O entra directo con un Jefe</p>
    <div class="iconos" id="iconos"></div>
  </div>
</main>

<div class="toast" id="toast" hidden></div>

<script src="/js/storage-client.js"></script>
<script>
(function(){
  // Hub desde la ruta (/rancho-seco/buscar → rancho-seco). Sin datos de marca en el código.
  const HUB = (() => { const s = location.pathname.split('/').filter(Boolean)[0] || ''; return s && !s.includes('.') && s !== 'buscar' ? s : 'jefeshub'; })();
  const PRE = HUB === 'jefeshub' ? '' : '/' + HUB;
  document.getElementById('verTodos').href = PRE ? PRE : '/consultor.html';

  // Los Jefes, con palabras que los identifican (sin acentos, en minúsculas).
  const JEFES = [
    { id:'366', nombre:'Jefe 366', alias:['366','estrategia'], logo:'jefe-366', ruta:'/jefe-366', que:'Tu estrategia base para vender todo el año',
      claves:['estrategia','plan','366','todo el ano','objetivo','documento maestro','posicionamiento','oferta','mi negocio','crecer','hacia donde'] },
    { id:'contenido', nombre:'Jefe de Contenido', alias:['contenido'], logo:'jefe-contenido-logo-negro', ruta:'/jefe-contenido', que:'Posts, reels e historias con tu voz',
      claves:['post','reel','publicacion','publicar','contenido','historia','historias','caption','copy','guion','instagram','tiktok','carrusel','ideas de contenido','que publico','que subo','hashtag'] },
    { id:'whatsapp', nombre:'Jefe de WhatsApp y Ventas', alias:['whatsapp','ventas'], logo:'jefe-whatsapp-logo-negro', ruta:'/jefe-whatsapp', que:'Mensajes que cierran ventas',
      claves:['whatsapp','mensaje','cobrar','responder','contestar','cerrar venta','cerrar la venta','objecion','seguimiento','chat','cotizacion','me dejo en visto','cliente dice','esta caro','bienvenida'] },
    { id:'finanzas', nombre:'Jefe de Finanzas', alias:['finanzas','financiero'], logo:'jefe-finanzas-logo-negro', ruta:'/jefe-financiero', que:'Tus números y tu meta',
      claves:['dinero','precio','precios','cuanto debo','cuanto cobro','meta','ganancia','costo','costos','margen','facturacion','numeros','finanzas','utilidad','punto de equilibrio','cuanto vender','cuanto necesito','vender','tengo que vender','al mes','cuanto gano'] },
    { id:'faro', nombre:'Jefe del Faro', alias:['faro','radar'], logo:'jefe-faro-logo-negro', ruta:'/jefe-radar', que:'Tu mercado, tu competencia y la idea del día',
      claves:['competencia','competidor','tendencia','tendencias','mercado','de moda','investigar','radar','idea del dia','que hacen otros','viral'] },
    { id:'anuncios', nombre:'Jefe de Anuncios', alias:['anuncios'], logo:'jefe-anuncios-logo-negro', ruta:'/jefe-anuncios', que:'Anuncios listos para Meta',
      claves:['anuncio','anuncios','ads','publicidad','pagada','pautar','pauta','promocionar','facebook ads','meta ads','segmentacion','presupuesto de anuncios'] },
    { id:'productor', nombre:'Jefe Productor IA', alias:['productor','produccion','imagen'], logo:'jefe-produccion-video-logo-negro', ruta:'/jefe-produccion-video', que:'Imágenes y videos con IA',
      claves:['imagen','imagenes','foto','fotos','video con ia','video ia','generar imagen','diseno','producir','prompt de imagen','fotografia de producto','mockup'] },
    { id:'resultados', nombre:'Jefe de Resultados', alias:['resultados','cierre'], logo:'jefe-resultados-logo-negro', ruta:'/jefe-cierre', que:'Mide y mejora tus ventas',
      claves:['resultados','metricas','reporte','cuanto vendi','medir','rendimiento','optimizar','alcance','funciono','no funciono','cierre de mes','analizar','como me fue','me fue','como voy','este mes','vendi'] },
    { id:'temporada', nombre:'Jefe de Temporada', alias:['temporada'], logo:'jefe-temporada-logo-negro', ruta:'/jefe-temporada', que:'Las fechas clave para vender más',
      claves:['navidad','buen fin','san valentin','14 de febrero','dia de las madres','10 de mayo','dia del padre','temporada','hot sale','black friday','fin de ano','ano nuevo','regreso a clases','dia de muertos','halloween','fecha especial','campana de'] },
    { id:'agenda', nombre:'Jefe de Agenda', alias:['agenda'], logo:'jefe-agenda-logo-negro', ruta:'/jefe-agenda', que:'Organiza tu semana',
      claves:['agenda','semana','calendario','pendientes','organizar','organizo','horario','tareas','que hago hoy','recordatorio'] },
    { id:'herramientas', nombre:'Jefe de Herramientas', alias:['herramientas','apps'], logo:'jefe-herramientas-logo-negro', ruta:'/herramientas', que:'Las apps de tu negocio',
      claves:['app','apps','herramienta','herramientas','canva','capcut','aplicacion','programa','que uso para'] },
    { id:'adn', nombre:'ADN del negocio', alias:['adn','marca'], logo:'jefe-366', ruta:'/adn', que:'La información de tu marca que usan todos',
      claves:['adn','mi marca','colores','logo','tono de voz','identidad','mi cliente ideal','audiencia','quien es mi cliente'] },
  ];
  const porId = Object.fromEntries(JEFES.map(j => [j.id, j]));
  const logoSrc = j => '/img/' + j.logo + '.webp';

  const quitar = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  // Elige al Jefe por palabras clave: gana el que tiene más coincidencias; si empatan,
  // el que se mencionó primero ("un anuncio para el Buen Fin" → Anuncios).
  function elegir(texto){
    const t = ' ' + quitar(texto).replace(/[^a-z0-9ñ ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
    const posDe = c => { const i = t.indexOf(' ' + c + ' '); return i >= 0 ? i : (c.length > 5 ? t.indexOf(c) : -1); };
    return JEFES.map(j => {
      let vistas = j.claves.filter(c => posDe(c) >= 0);
      vistas = vistas.filter(c => !vistas.some(o => o !== c && o.includes(c)));   // "imagen" e "imagenes" cuentan una vez
      const pos = vistas.length ? Math.min(...vistas.map(posDe)) : Infinity;
      return { j, p: vistas.length, pos };
    }).filter(x => x.p > 0).sort((a, b) => b.p - a.p || a.pos - b.pos);
  }

  // ---- Elementos
  const $ = id => document.getElementById(id);
  const q = $('q'), menu = $('menu'), chip = $('chip'), res = $('resultado');
  let elegido = null;   // Jefe llamado con @
  let opciones = [], sel = 0;

  // Ajusta el alto del cuadro de texto.
  function crecer(){ q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 160) + 'px'; q.style.overflowY = q.scrollHeight > 160 ? 'auto' : 'hidden'; }

  // ---- @ menciones
  function textoArroba(){
    const antes = q.value.slice(0, q.selectionStart);
    const m = antes.match(/(^|\s)@([^\s@]*)$/);
    return m ? m[2] : null;
  }
  function filtrar(f){
    const k = quitar(f);
    if (!k) return JEFES;
    return JEFES.filter(j => quitar(j.nombre).includes(k) || j.alias.some(a => a.startsWith(k)));
  }
  function pintarMenu(){
    const f = textoArroba();
    if (f === null || elegido) { menu.hidden = true; return; }
    opciones = filtrar(f);
    sel = Math.min(sel, Math.max(opciones.length - 1, 0));
    menu.innerHTML = opciones.length
      ? opciones.map((j, i) => '<button type="button" class="op" role="option" data-i="' + i + '" aria-selected="' + (i === sel) + '"><img src="' + logoSrc(j) + '" alt=""><span><b>' + j.nombre + '</b><small>' + j.que + '</small></span></button>').join('')
      : '<div class="vacio">No encontré ese Jefe. Prueba con otro nombre.</div>';
    menu.hidden = false;
  }
  function ponerJefe(j){
    // Quita el "@texto" que se estaba escribiendo.
    const pos = q.selectionStart;
    const antes = q.value.slice(0, pos).replace(/(^|\s)@[^\s@]*$/, '$1');
    q.value = (antes + q.value.slice(pos)).replace(/^\s+/, '');
    elegido = j;
    chip.innerHTML = '<img src="' + logoSrc(j) + '" alt="">' + j.nombre + '<button type="button" aria-label="Quitar Jefe">×</button>';
    chip.hidden = false;
    chip.querySelector('button').onclick = quitarJefe;
    menu.hidden = true; sel = 0;
    q.placeholder = '¿Qué le pides al ' + j.nombre + '?';
    q.focus(); crecer();
  }
  function quitarJefe(){
    elegido = null; chip.hidden = true; chip.innerHTML = '';
    q.placeholder = 'Escribe lo que necesitas… o @ para llamar a un Jefe';
    q.focus();
  }

  menu.addEventListener('mousedown', e => {
    const b = e.target.closest('.op'); if (!b) return;
    e.preventDefault(); ponerJefe(opciones[+b.dataset.i]);
  });
  q.addEventListener('input', () => { crecer(); pintarMenu(); });
  q.addEventListener('click', pintarMenu);
  q.addEventListener('blur', () => setTimeout(() => { menu.hidden = true; }, 120));
  q.addEventListener('keydown', e => {
    if (!menu.hidden && opciones.length) {
      if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % opciones.length; pintarMenu(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); sel = (sel - 1 + opciones.length) % opciones.length; pintarMenu(); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); ponerJefe(opciones[sel]); return; }
    }
    if (e.key === 'Escape') { menu.hidden = true; return; }
    if (e.key === 'Backspace' && elegido && q.selectionStart === 0 && q.selectionEnd === 0) { quitarJefe(); return; }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); buscar(); }
  });
  $('ir').addEventListener('click', buscar);

  // ---- Buscar
  function buscar(){
    const texto = q.value.trim();
    if (elegido) { ir(elegido, texto); return; }
    if (!texto) { q.focus(); aviso('Escribe lo que necesitas o usa @ para elegir a un Jefe.'); return; }
    // Si escribió "@Nombre" completo sin elegir de la lista, lo respeta.
    const m = texto.match(/@([^\s@]+)/);
    if (m) { const f = filtrar(m[1]); if (f.length) { ir(f[0], texto.replace(m[0], '').trim()); return; } }
    mostrar(texto, elegir(texto));
  }

  function mostrar(texto, lista){
    const esc = s => s.replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
    if (!lista.length) {
      res.innerHTML = '<div class="tarjeta"><div class="txt"><div class="eti">No estoy segura</div><div class="nom">¿Con quién quieres trabajarlo?</div><div class="por">Elige a un Jefe y le paso tu pregunta. (En la versión final, aquí decide la IA.)</div></div></div>' +
        '<div class="tambien"><div class="alt">' + JEFES.map(j => '<button type="button" data-id="' + j.id + '"><img src="' + logoSrc(j) + '" alt="">' + j.nombre + '</button>').join('') + '</div></div>';
    } else {
      const g = lista[0].j;
      res.innerHTML = '<div class="tarjeta"><div class="logo"><img src="' + logoSrc(g) + '" alt=""></div>' +
        '<div class="txt"><div class="eti">Te ayuda</div><div class="nom">' + g.nombre + '</div><div class="por">' + g.que + '</div>' +
        '<div class="preg">“' + esc(texto.length > 140 ? texto.slice(0, 140) + '…' : texto) + '”</div></div>' +
        '<button type="button" class="btn-pri" data-id="' + g.id + '">Ir con este Jefe ›</button></div>' +
        (lista.length > 1 ? '<div class="tambien"><p>También te pueden ayudar:</p><div class="alt">' +
          lista.slice(1, 3).map(x => '<button type="button" data-id="' + x.j.id + '"><img src="' + logoSrc(x.j) + '" alt="">' + x.j.nombre + '</button>').join('') + '</div></div>' : '');
    }
    res.hidden = false;
    res.querySelectorAll('[data-id]').forEach(b => b.onclick = () => ir(porId[b.dataset.id], texto));
  }

  // Lleva al Jefe. La pregunta viaja guardada en esta pestaña (no en el link), para que el Jefe la lea.
  function ir(j, texto){
    try { if (texto) sessionStorage.setItem('jh-pregunta', JSON.stringify({ jefe: j.id, texto, t: Date.now() })); } catch (e) {}
    location.href = PRE + j.ruta;
  }

  function aviso(t){ const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(aviso._t); aviso._t = setTimeout(() => el.hidden = true, 2600); }

  // ---- Ejemplos y fila de Jefes
  const EJEMPLOS = ['Ideas para un reel de esta semana', 'Mensaje para un cliente que dice que está caro', 'Anuncio para Navidad', '¿Cuánto tengo que vender al mes?', 'Qué está haciendo mi competencia'];
  $('ejemplos').innerHTML = EJEMPLOS.map(e => '<button type="button">' + e + '</button>').join('');
  $('ejemplos').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (elegido) quitarJefe(); q.value = b.textContent; crecer(); buscar(); });

  $('iconos').innerHTML = JEFES.filter(j => j.id !== 'adn').map(j => '<a href="' + PRE + j.ruta + '" title="' + j.nombre + '" aria-label="' + j.nombre + '"><img src="' + logoSrc(j) + '" alt=""></a>').join('');

  // ---- Nombre de la marca (del ADN, en vivo)
  (async () => {
    try {
      const r = await window.storage.get(HUB + ':brand-book.identidad');
      const d = r && r.value ? (typeof r.value === 'string' ? JSON.parse(r.value) : r.value) : null;
      if (d && d.nombre) { $('marcaCliente').textContent = d.nombre; $('cejaTxt').textContent = 'Hub de Jefes de: ' + d.nombre; }
    } catch (e) {}
  })();

  q.focus();
})();
</script>
</body>
</html>
