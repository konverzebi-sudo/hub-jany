<style>
  :root{
    /* Piel clara = mismos tokens que Jefe Productor IA, Jefe 366, Contenido y Anuncios */
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F3F3F3;
    --line:#E2E2E2;
    --text:#1A1A1A;
    --text-dim:#5F5F5F;
    --accent:#C0F800;
    --accent-soft:#F1FFC2;
    --accent-text:#4E7A00;
    --navy:#10103A;
    --shadow-card:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06);
    --adq:#6366F1;
    --con:#0EA5E9;
    --conv:#16A34A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;padding:28px 16px 80px;}
  h1,h2,.display{font-family:'Inter Tight',sans-serif;}
  .wrap{max-width:1400px;margin:0 auto;}
  .page-header{text-align:center;padding-top:62px;}
  h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin:0 0 8px;line-height:1.15;}
  /* Barra fija: se queda visible arriba al hacer scroll (pill + nombre del Jefe) */
  .topbar{position:fixed;top:0;left:0;right:0;height:70px;z-index:60;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);}
  .topbar h1{justify-self:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:clamp(20px,2.6vw,28px);}
  .back-link{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-family:'Barlow',sans-serif;font-weight:600;font-size:14px;color:var(--text-dim);text-decoration:none;padding:7px 16px;border:1px solid var(--line);border-radius:100px;background:var(--surface);transition:.15s;}
  .back-link:hover{border-color:var(--accent);color:var(--accent-text);}
  /* Scrollbar delgada y discreta */
  *{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.22) transparent;}
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:8px;}
  *::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.36);}

  /* HERO */
  .hero-logo{display:block;height:120px;width:auto;margin:0 auto 14px;}
  .seccion-intro{color:var(--text-dim);font-size:16px;margin:0 auto 20px;max-width:640px;text-align:center;line-height:1.55;}

  /* BARRA: vista (centrada) + botón "+" */
  .edit-bar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px;}
  .view-switch{display:inline-flex;background:var(--surface-2);border-radius:100px;padding:4px;gap:2px;}
  .view-switch button{border:none;background:transparent;font-family:'Inter Tight',sans-serif;font-weight:800;font-size:13.5px;padding:8px 16px;border-radius:100px;cursor:pointer;color:#333;transition:.15s;}
  .view-switch button:hover{background:#E8E8E8;}
  .view-switch button.on{background:var(--accent);color:#1A1A1A;}
  .btn-plus{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#1A1A1A;font-size:28px;font-weight:700;line-height:1;padding:0 0 3px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card);transition:.15s;}
  .btn-plus:hover{transform:scale(1.08);}
  .hint{text-align:center;font-size:13.5px;color:var(--text-dim);margin:0 0 30px;min-height:1.5em;}
  .hint.ok{color:var(--accent-text);font-weight:600;}
  .hint.error{color:#C62828;font-weight:600;}
  .btn-outline{font-family:'Barlow',sans-serif;font-weight:600;font-size:14.5px;padding:10px 18px;border-radius:100px;cursor:pointer;border:1px solid #CFCFCF;background:var(--surface);color:#333;transition:.15s;}
  .btn-outline:hover{border-color:var(--accent-text);color:var(--accent-text);background:var(--accent-soft);}
  .btn-solid{font-family:'Inter Tight',sans-serif;font-weight:800;font-size:14px;padding:11px 24px;border-radius:100px;cursor:pointer;border:none;background:var(--accent);color:#1A1A1A;transition:.15s;}
  .btn-solid:hover{filter:brightness(.95);}
  .btn-solid:disabled{opacity:.5;cursor:wait;}
  .btn-danger{font-family:'Barlow',sans-serif;font-weight:600;font-size:13px;padding:9px 16px;border-radius:100px;cursor:pointer;border:1px solid #F0C4C4;background:#fff;color:#B42318;transition:.15s;}
  .btn-danger:hover{background:#FEF3F2;}
  .link-btn{background:none;border:none;color:var(--text-dim);font-family:'Barlow',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:underline;padding:2px 4px;}
  .link-btn:hover{color:var(--accent-text);}
  .reset-wrap{text-align:center;margin:10px 0 0;}

  /* SECCIONES */
  .seccion{margin:0 0 46px;}
  .seccion-h{font-family:'Inter Tight',sans-serif;font-weight:800;font-size:clamp(22px,3vw,28px);margin:0 0 18px;}

  /* LOGOS */
  .app-head{display:flex;align-items:center;gap:12px;}
  .app-desc{margin:-4px 0 0;font-size:14.5px;color:var(--text-dim);line-height:1.4;}
  /* Logos (img/apps/*.png). Los transparentes (glifo) llevan marco blanco; los de tarjeta completa llenan el cuadro. */
  .app-logo-img{width:40px;height:40px;border-radius:11px;flex-shrink:0;object-fit:cover;display:block;}
  .app-logo-img.glifo{object-fit:contain;padding:6px;background:#fff;border:1px solid var(--line);}
  .app-logo-emoji{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--accent-soft);border:1px solid #CDE98A;}
  .app-logo-img.lg,.app-logo-emoji.lg{width:80px;height:80px;border-radius:20px;}
  .app-logo-img.xl,.app-logo-emoji.xl{width:104px;height:104px;border-radius:26px;box-shadow:0 10px 26px rgba(0,0,0,.28);}
  .app-logo-img.glifo.lg,.app-logo-img.glifo.xl{padding:14px;}
  .app-logo-emoji.lg{font-size:40px;}
  .app-logo-emoji.xl{font-size:54px;}
  .app-links{display:flex;gap:8px;flex-wrap:wrap;}
  .app-links a{font-family:'Barlow',sans-serif;font-weight:700;font-size:14px;padding:8px 16px;border-radius:100px;border:1px solid #CFCFCF;background:var(--surface);color:#333;text-decoration:none;transition:.15s;}
  .app-links a:hover{border-color:var(--accent-text);color:var(--accent-text);background:var(--accent-soft);}

  /* VISTA "TARJETAS" (estilo App Store · Hoy) */
  .today-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:20px;}
  .today-card{display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-card);}
  .today-cover{position:relative;min-height:300px;padding:14px 16px 18px;color:var(--ink,#fff);background:linear-gradient(165deg,var(--c1),var(--c2));display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;}
  .today-cover::before{content:'';position:absolute;width:230px;height:230px;border-radius:50%;right:-80px;top:-70px;background:rgba(255,255,255,.14);}
  .today-cover::after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;left:-60px;bottom:70px;background:rgba(0,0,0,.10);}
  .today-tag{position:relative;z-index:1;align-self:flex-start;background:rgba(255,255,255,.94);color:#1A1A1A;font-family:'Inter Tight',sans-serif;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px 11px;border-radius:8px;}
  .today-icon{position:relative;z-index:1;align-self:center;margin:8px 0;}
  .today-title{position:relative;z-index:1;font-family:'Inter Tight',sans-serif;font-weight:800;font-size:23px;line-height:1.15;}
  .today-title small{display:block;font:600 12px 'Barlow',sans-serif;opacity:.88;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
  .today-foot{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;flex:1;}
  .today-desc{margin:0;font-size:14.5px;color:var(--text-dim);line-height:1.4;min-height:2.8em;}
  .today-foot .app-links a{background:var(--surface-2);border:none;color:#0A5BD8;text-transform:uppercase;font-size:12.5px;letter-spacing:.04em;font-weight:800;padding:8px 16px;}
  .today-foot .app-links a:hover{background:var(--accent-soft);color:var(--accent-text);}

  /* VISTA "ÍCONOS" (cuadrícula de apps) */
  .icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:20px 12px;}
  .icon-tile{display:flex;flex-direction:column;align-items:center;gap:9px;background:none;border:none;cursor:pointer;font-family:'Barlow',sans-serif;padding:10px 6px;border-radius:20px;transition:.15s;}
  .icon-tile:hover{background:var(--surface-2);transform:translateY(-2px);}
  .icon-tile .app-logo-img,.icon-tile .app-logo-emoji{box-shadow:0 4px 14px rgba(0,0,0,.14);}
  .icon-name{font-size:14px;font-weight:600;color:var(--text);text-align:center;line-height:1.25;}

  /* VENTANAS (ver app / editar app) */
  .modal-back{position:fixed;inset:0;z-index:80;background:rgba(10,10,20,.5);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
  .modal-back.top{z-index:90;}
  .modal-box{position:relative;width:min(340px,100%);}
  .modal-box .today-card{box-shadow:0 12px 32px rgba(0,0,0,.28);}
  .modal-x{position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:#1A1A1A;font-size:16px;cursor:pointer;}

  /* EDITOR */
  .ed-box{background:#fff;border-radius:24px;width:min(460px,100%);padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.28);max-height:calc(100vh - 32px);overflow-y:auto;}
  .ed-box h3{margin:0;font-family:'Inter Tight',sans-serif;font-weight:800;font-size:21px;}
  .ed-in{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;padding:9px 12px;outline:none;}
  .ed-in:focus{border-color:var(--accent-text);background:#fff;box-shadow:0 0 0 3px rgba(192,248,0,.28);}
  .ed-nombre{font-family:'Inter Tight',sans-serif;font-weight:800;font-size:16px;}
  .ed-label{font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 -4px;}
  .ed-row{display:flex;gap:10px;align-items:center;}
  .ed-emoji{width:76px;flex:none;text-align:center;}
  .ed-up{display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
  .ed-row{flex-wrap:wrap;}
  input.ed-color{width:52px;height:38px;padding:2px;flex:none;cursor:pointer;}
  .ed-link{display:grid;grid-template-columns:minmax(90px,.8fr) minmax(0,1.8fr) auto;gap:6px;align-items:center;}
  .ed-x{border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:16px;padding:6px 8px;border-radius:8px;}
  .ed-x:hover{color:#B42318;background:#FEF3F2;}
  .ed-add{align-self:flex-start;}
  .ed-error{margin:0;color:#C62828;font-size:14px;font-weight:600;}
  .ed-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-top:6px;}
  .ed-actions .btn-danger{margin-right:auto;}
  @media (max-width:520px){ .ed-link{grid-template-columns:1fr auto;} .ed-link input:nth-child(2){grid-column:1 / 2;} }

  /* Celular: las tarjetas se deslizan de lado, como en el App Store */
  @media (max-width:720px){
    .today-row{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 12px;gap:14px;}
    .today-row .today-card{flex:0 0 78vw;max-width:320px;scroll-snap-align:start;}
  }
</style>

<script>
const CLIENTE_ID = window.__hub.slug;
const KEY = CLIENTE_ID + ':herramientas-apps';
const VISTA_KEY = 'herramientas:vista';

function escHtml(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const $ = (id) => document.getElementById(id);
const clonar = (o) => JSON.parse(JSON.stringify(o));
// Solo http(s): lo demás (javascript:, data:...) se descarta. Sin esquema -> se asume https://
function urlSegura(u){
  u = (u || '').trim();
  if (!u) return '';
  if (/^https?:\/\//i.test(u)) return u;
  if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';
  return 'https://' + u;
}
const logoValido = (l) => typeof l === 'string' && /^[a-z0-9-]+$/.test(l);
const hexOk = (c) => typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c);
// Logo propio: imagen chica (data URL png/jpeg/webp) que se guarda junto con la app.
const imgOk = (s) => typeof s === 'string' && s.length <= 80000 && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/]+=*$/.test(s);

// ─── COLORES de las tarjetas ────────────────────────────────────────────────
const COLORES_DEF = ['#6366F1', '#0EA5E9', '#16A34A', '#F59E0B', '#10103A'];
function mezclar(hex, t, hacia){
  const n = parseInt(hex.slice(1), 16);
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.round(v + (hacia - v) * t).toString(16).padStart(2, '0')).join('');
}
function luz(hex){
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
}
function coloresDe(a, i){
  const c = hexOk(a.color) ? a.color : COLORES_DEF[i % COLORES_DEF.length];
  return { c1: c, c2: mezclar(c, 0.5, 0), ink: luz(c) > 0.62 ? '#1A1A1A' : '#FFFFFF' };
}

// logo = archivo en /img/apps/ · glifo = logo transparente (lleva marco blanco) · emoji = apps sin logo · color = tarjeta

let secciones = clonar(DEFAULTS); // lo publicado (o lo guardado del hub)

let ed = null;                    // editor abierto: { modo:'app'|'seccion', ... }
let estado = { txt: '', tipo: '' };
let estadoTimer = null;

// Acepta solo la forma esperada: lo demás se ignora y se usan los valores originales.
function normalizar(data){
  if (!Array.isArray(data)) return null;
  const out = data.filter(s => s && typeof s.titulo === 'string' && Array.isArray(s.apps)).map(s => ({
    titulo: s.titulo,
    apps: s.apps.filter(a => a && typeof a.nombre === 'string').map(a => {
      const o = { nombre: a.nombre, links: (Array.isArray(a.links) ? a.links : []).filter(l => Array.isArray(l) && typeof l[0] === 'string' && typeof l[1] === 'string').map(l => [l[0], l[1]]) };
      if (typeof a.desc === 'string' && a.desc) o.desc = a.desc;
      if (hexOk(a.color)) o.color = a.color;
      if (imgOk(a.img)) o.img = a.img;
      if (logoValido(a.logo)) { o.logo = a.logo; if (a.glifo) o.glifo = true; }
      else o.emoji = typeof a.emoji === 'string' && a.emoji ? a.emoji : '🧩';
      return o;
    }),
  }));
  return out.length ? out : null;
}

// Una app lista para guardar: sin espacios sobrantes, sin enlaces vacíos y solo URLs http(s).
function limpiarApp(a){
  const o = { nombre: (a.nombre || '').trim(), links: (a.links || []).map(l => [(l[0] || '').trim(), urlSegura(l[1])]).filter(l => l[0] && l[1]) };
  if (a.desc && a.desc.trim()) o.desc = a.desc.trim();
  if (hexOk(a.color)) o.color = a.color;
  if (imgOk(a.img)) o.img = a.img;
  if (logoValido(a.logo)) { o.logo = a.logo; if (a.glifo) o.glifo = true; }
  else o.emoji = (a.emoji || '').trim() || '🧩';
  return o;
}

// ─── VISTA ──────────────────────────────────────────────────────────────────
function logoHtml(a, tam){
  const t = tam ? ' ' + tam : '';
  const px = tam === 'xl' ? 104 : tam === 'lg' ? 80 : 40;
  if (imgOk(a.img)) return `<img class="app-logo-img${t}" src="${escHtml(a.img)}" alt="${escHtml(a.nombre)}" width="${px}" height="${px}">`;
  return logoValido(a.logo)
    ? `<img class="app-logo-img${a.glifo ? ' glifo' : ''}${t}" src="/img/apps/${a.logo}.png" alt="${escHtml(a.nombre)}" width="${px}" height="${px}" loading="lazy">`
    : `<div class="app-logo-emoji${t}" aria-hidden="true">${escHtml(a.emoji || '🧩')}</div>`;
}

const sinEmoji = (t) => (t || '').replace(/^[^\p{L}\p{N}]+/u, '').trim();

function linksHtml(a){
  const links = a.links.map(([t, u]) => [t, urlSegura(u)]).filter(([t, u]) => t.trim() && u);
  return `<div class="app-links">${links.map(([t, u]) => `<a href="${escHtml(u)}" target="_blank" rel="noopener">${escHtml(t)}</a>`).join('')}</div>`;
}

// Tarjeta grande estilo "Hoy" del App Store: portada de color, ícono, nombre y botones
function tarjetaHoy(a, i, seccion, si){
  const c = coloresDe(a, i);
  const tiendas = a.links.filter(l => l[0].trim() && urlSegura(l[1])).map(l => l[0].trim()).join(' · ');
  return `<article class="today-card" data-ctx="app" data-s="${si}" data-a="${i}">
    <div class="today-cover" style="--c1:${c.c1};--c2:${c.c2};--ink:${c.ink}">
      <span class="today-tag">${escHtml(sinEmoji(seccion))}</span>
      <div class="today-icon">${logoHtml(a, 'xl')}</div>
      <div class="today-title">${tiendas ? `<small>${escHtml(tiendas)}</small>` : ''}${escHtml(a.nombre)}</div>
    </div>
    <div class="today-foot">
      ${a.desc ? `<p class="today-desc">${escHtml(a.desc)}</p>` : ''}
      ${linksHtml(a)}
    </div>
  </article>`;
}

function seccionVista(s, si){
  const cuerpo = vista === 'iconos'
    ? `<div class="icon-grid">${s.apps.map((a, ai) => `<button class="icon-tile" type="button" data-act="abrir" data-ctx="app" data-s="${si}" data-a="${ai}">${logoHtml(a, 'lg')}<span class="icon-name">${escHtml(a.nombre)}</span></button>`).join('')}</div>`
    : `<div class="today-row">${s.apps.map((a, ai) => tarjetaHoy(a, ai, s.titulo, si)).join('')}</div>`;
  return `<section class="seccion"><h2 class="seccion-h" data-s="${si}">${escHtml(s.titulo)}</h2>${cuerpo}</section>`;
}

function abrirApp(si, ai){
  const s = secciones[si], a = s && s.apps[ai];
  if (!a) return;
  $('modal').innerHTML = `<div class="modal-back" data-act="cerrar-fondo"><div class="modal-box">
    <button class="modal-x" type="button" data-act="cerrar" aria-label="Cerrar">✕</button>${tarjetaHoy(a, ai, s.titulo, si)}</div></div>`;
}
const cerrarApp = () => { $('modal').innerHTML = ''; };

function pintarHint(){
  const h = $('hint');
  h.className = 'hint ' + estado.tipo;
  h.textContent = estado.txt;
}
function setEstado(txt, tipo, ms){
  estado = { txt, tipo };
  pintarHint();
  clearTimeout(estadoTimer);
  if (ms) estadoTimer = setTimeout(() => { estado = { txt: '', tipo: '' }; pintarHint(); }, ms);
}

function render(){
  $('content').innerHTML = secciones.map(seccionVista).join('')
    + `<p class="reset-wrap"><button class="link-btn" type="button" data-act="restaurar">Restaurar lista original</button></p>`;
  $('edit-bar').innerHTML = `<div class="view-switch" role="group" aria-label="Vista">
      <button type="button" data-act="vista" data-v="tarjetas" class="${vista === 'tarjetas' ? 'on' : ''}">▭ Tarjetas</button>
      <button type="button" data-act="vista" data-v="iconos" class="${vista === 'iconos' ? 'on' : ''}">▦ Íconos</button>
    </div>
    <button class="btn-plus" type="button" data-act="nueva-app" aria-label="Agregar app" title="Agregar app">+</button>`;
  pintarHint();
}

// ─── EDITOR (clic derecho / mantener presionado / botón +) ──────────────────
function abrirEditor(si, ai){
  if (ed) return;
  cerrarApp();
  const nueva = ai == null;
  const data = nueva
    ? { nombre: '', emoji: '🧩', color: COLORES_DEF[0], desc: '', links: [['App Store', ''], ['Play Store', '']] }
    : clonar(secciones[si].apps[ai]);
  data.desc = data.desc || '';
  ed = { modo: 'app', s: nueva ? null : si, a: ai, data, seccion: nueva ? (secciones.length ? 0 : 'nueva') : si, nuevaSec: '', error: '', guardando: false };
  pintarEditor('#ed-nombre');
}
function abrirSeccion(si){
  if (ed) return;
  cerrarApp();
  ed = { modo: 'seccion', s: si, titulo: secciones[si].titulo, error: '', guardando: false };
  pintarEditor('#ed-titulo');
}
function cerrarEditor(){ ed = null; pintarEditor(); }

function pintarEditor(enfocar){
  if (!ed) { $('editor').innerHTML = ''; return; }
  const err = ed.error ? `<p class="ed-error">${escHtml(ed.error)}</p>` : '';
  let cuerpo;
  if (ed.modo === 'seccion') {
    cuerpo = `<h3>Sección</h3>
      <label class="ed-label" for="ed-titulo">Título (puedes empezar con un emoji)</label>
      <input id="ed-titulo" class="ed-in" data-e="titulo" value="${escHtml(ed.titulo)}" placeholder="Título de la sección">
      ${err}
      <div class="ed-actions">
        <button class="btn-danger" type="button" data-act="ed-del-sec">Quitar sección</button>
        <button class="btn-outline" type="button" data-act="ed-cancelar">Cancelar</button>
        <button class="btn-solid" type="submit">Guardar</button>
      </div>`;
  } else {
    const d = ed.data;
    cuerpo = `<h3>${ed.a == null ? 'Nueva app' : 'Editar app'}</h3>
      <div class="app-head">${logoHtml(d)}<input id="ed-nombre" class="ed-in ed-nombre" data-e="nombre" value="${escHtml(d.nombre)}" placeholder="Nombre de la app"></div>
      <div class="ed-row">
        <label class="btn-outline ed-up">🖼️ Subir logo<input type="file" accept="image/*" data-e="archivo" hidden></label>
        ${imgOk(d.img) ? '<button class="btn-outline" type="button" data-act="ed-quitar-img">Quitar logo</button>' : ''}
        <span class="app-desc" style="margin:0">o pega una imagen (Ctrl+V)</span>
      </div>
      ${(logoValido(d.logo) || imgOk(d.img)) ? '' : `<div class="ed-row"><input class="ed-in ed-emoji" data-e="emoji" value="${escHtml(d.emoji || '🧩')}" maxlength="4" aria-label="Emoji"><span class="app-desc" style="margin:0">…o un emoji como ícono</span></div>`}
      <div class="ed-row"><input class="ed-in ed-color" type="color" data-e="color" value="${hexOk(d.color) ? d.color : COLORES_DEF[0]}" aria-label="Color de la tarjeta"><span class="app-desc" style="margin:0">Color de la tarjeta</span></div>
      <input class="ed-in" data-e="desc" value="${escHtml(d.desc)}" placeholder="Descripción (opcional)">
      <label class="ed-label" for="ed-seccion">Sección</label>
      <select id="ed-seccion" class="ed-in" data-e="seccion">
        ${secciones.map((s, i) => `<option value="${i}"${ed.seccion === i ? ' selected' : ''}>${escHtml(s.titulo)}</option>`).join('')}
        <option value="nueva"${ed.seccion === 'nueva' ? ' selected' : ''}>➕ Nueva sección…</option>
      </select>
      ${ed.seccion === 'nueva' ? `<input class="ed-in" data-e="nuevaSec" value="${escHtml(ed.nuevaSec)}" placeholder="Título de la nueva sección">` : ''}
      <div class="ed-label">Botones de descarga</div>
      ${d.links.map((l, li) => `<div class="ed-link">
        <input class="ed-in" data-e="l0" data-l="${li}" value="${escHtml(l[0])}" placeholder="Botón (ej. App Store)">
        <input class="ed-in" data-e="l1" data-l="${li}" value="${escHtml(l[1])}" placeholder="https://…">
        <button class="ed-x" type="button" data-act="ed-del-link" data-l="${li}" aria-label="Quitar enlace" title="Quitar enlace">✕</button>
      </div>`).join('')}
      <button class="btn-outline ed-add" type="button" data-act="ed-add-link">+ Enlace</button>
      ${err}
      <div class="ed-actions">
        ${ed.a == null ? '' : '<button class="btn-danger" type="button" data-act="ed-del-app">Quitar app</button>'}
        <button class="btn-outline" type="button" data-act="ed-cancelar">Cancelar</button>
        <button class="btn-solid" type="submit">Guardar</button>
      </div>`;
  }
  $('editor').innerHTML = `<div class="modal-back top" data-act="ed-fondo"><form class="ed-box" id="ed-form" role="dialog" aria-modal="true" novalidate>${cuerpo}</form></div>`;
  if (enfocar) { const el = document.querySelector('#editor ' + enfocar); if (el) el.focus(); }
}

async function persistir(nuevo){
  if (ed) { ed.guardando = true; ed.error = ''; }
  try {
    await window.storage.set(KEY, JSON.stringify(nuevo));
    secciones = nuevo; ed = null; pintarEditor(); render();
    setEstado('✅ Guardado', 'ok', 3000);
  } catch (e) {
    const msg = 'No se pudo guardar (revisa el token de acceso e inténtalo de nuevo).';
    if (ed) { ed.guardando = false; ed.error = msg; pintarEditor(); }
    else setEstado(msg, 'error', 7000);
  }
}

function guardarEditor(){
  if (!ed || ed.guardando) return;
  const nuevo = clonar(secciones);
  if (ed.modo === 'seccion') {
    nuevo[ed.s].titulo = ed.titulo.trim() || nuevo[ed.s].titulo;
  } else {
    const app = limpiarApp(ed.data);
    if (!app.nombre) { ed.error = 'Ponle un nombre a la app.'; pintarEditor('#ed-nombre'); return; }
    let destino = ed.seccion;
    if (destino === 'nueva') { nuevo.push({ titulo: ed.nuevaSec.trim() || '📌 Nueva sección', apps: [] }); destino = nuevo.length - 1; }
    if (ed.a == null) nuevo[destino].apps.push(app);
    else if (destino === ed.s) nuevo[ed.s].apps[ed.a] = app;
    else { nuevo[ed.s].apps.splice(ed.a, 1); nuevo[destino].apps.push(app); }
  }
  persistir(nuevo);
}

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'ed-form') return;
  e.preventDefault();
  guardarEditor();
});

// Logo propio: se recorta al centro en cuadrado, se baja a 128 px y se guarda dentro de la app.
function archivoAIcono(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      const L = 128, lado = Math.min(im.naturalWidth, im.naturalHeight);
      if (!lado) { reject(new Error('vacía')); return; }
      const c = document.createElement('canvas'); c.width = c.height = L;
      const ctx = c.getContext('2d');
      ctx.drawImage(im, (im.naturalWidth - lado) / 2, (im.naturalHeight - lado) / 2, lado, lado, 0, 0, L, L);
      let d = c.toDataURL('image/png');
      if (d.length > 70000) { // fotos pesadas: JPG con fondo blanco
        ctx.globalCompositeOperation = 'destination-over'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, L, L);
        d = c.toDataURL('image/jpeg', 0.85);
      }
      if (imgOk(d)) resolve(d); else reject(new Error('grande'));
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('lectura')); };
    im.src = url;
  });
}
async function subirIcono(file){
  if (!ed || ed.modo !== 'app' || !file) return;
  if (!/^image\//.test(file.type)) { ed.error = 'Elige un archivo de imagen (PNG, JPG o WebP).'; pintarEditor(); return; }
  try { ed.data.img = await archivoAIcono(file); ed.error = ''; }
  catch (e) { if (ed) ed.error = 'No se pudo leer esa imagen. Prueba con otra.'; }
  if (ed) pintarEditor();
}
document.addEventListener('paste', (e) => {
  if (!ed || ed.modo !== 'app') return;
  const it = [...((e.clipboardData && e.clipboardData.items) || [])].find(i => i.kind === 'file' && /^image\//.test(i.type));
  if (!it) return;
  e.preventDefault();
  subirIcono(it.getAsFile());
});

// Escribir en el editor solo actualiza el borrador (no vuelve a pintar, para no perder el cursor).
document.addEventListener('input', (e) => {
  const t = e.target;
  if (!ed || !t.dataset || !t.dataset.e || t.tagName === 'SELECT') return;
  const k = t.dataset.e;
  if (ed.modo === 'seccion') { if (k === 'titulo') ed.titulo = t.value; return; }
  if (k === 'l0' || k === 'l1') ed.data.links[+t.dataset.l][k === 'l0' ? 0 : 1] = t.value;
  else if (k === 'nuevaSec') ed.nuevaSec = t.value;
  else if (k === 'nombre' || k === 'emoji' || k === 'color' || k === 'desc') ed.data[k] = t.value;
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (!ed || ed.modo !== 'app' || !t.dataset) return;
  if (t.dataset.e === 'archivo') { subirIcono(t.files && t.files[0]); return; }
  if (t.dataset.e !== 'seccion') return;
  ed.seccion = t.value === 'nueva' ? 'nueva' : +t.value;
  pintarEditor(ed.seccion === 'nueva' ? '[data-e=nuevaSec]' : null);
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (ed) cerrarEditor(); else cerrarApp();
});

// Clic derecho: sobre una app abre su editor; sobre el título de una sección, el de la sección.
// Sobre los botones de descarga se deja el menú normal del navegador (copiar enlace, etc.).
document.addEventListener('contextmenu', (e) => {
  const t = e.target;
  if (t.closest('a, input, textarea, select, #editor')) return;
  const app = t.closest('[data-ctx="app"]');
  if (app) { e.preventDefault(); abrirEditor(+app.dataset.s, +app.dataset.a); return; }
  const sec = t.closest('.seccion-h[data-s]');
  if (sec) { e.preventDefault(); abrirSeccion(+sec.dataset.s); }
});

// Celular (sobre todo iPhone, que no manda "clic derecho"): mantener presionado ~0.6 s.
let lpTimer = null, lpPos = null, suprimir = 0;
document.addEventListener('touchstart', (e) => {
  const t = e.target;
  const app = t.closest('[data-ctx="app"]');
  if (!app || t.closest('a')) return;
  const p = e.touches[0];
  lpPos = [p.clientX, p.clientY];
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => { lpTimer = null; suprimir = Date.now(); abrirEditor(+app.dataset.s, +app.dataset.a); }, 600);
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (!lpTimer) return;
  const p = e.touches[0];
  if (Math.abs(p.clientX - lpPos[0]) > 10 || Math.abs(p.clientY - lpPos[1]) > 10) { clearTimeout(lpTimer); lpTimer = null; }
}, { passive: true });
['touchend', 'touchcancel'].forEach((n) => document.addEventListener(n, () => { clearTimeout(lpTimer); lpTimer = null; }));

document.addEventListener('click', (e) => {
  // Justo después de una pulsación larga no se debe abrir el enlace/ventana que estaba debajo del dedo.
  if (Date.now() - suprimir < 800) { e.preventDefault(); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const { act, s, a, l, v } = b.dataset;
  if (act === 'cerrar-fondo') { if (e.target === b) cerrarApp(); return; }
  if (act === 'cerrar') { cerrarApp(); return; }
  if (act === 'abrir') { abrirApp(+s, +a); return; }
  if (act === 'vista') { vista = v; try { localStorage.setItem(VISTA_KEY, v); } catch (x) {} render(); return; }
  if (act === 'nueva-app') { abrirEditor(null, null); return; }
  if (act === 'restaurar') {
    if (confirm('¿Volver a la lista original? Se pierden las apps que agregaste o cambiaste.')) persistir(clonar(DEFAULTS));
    return;
  }
  // Acciones del editor
  if (act === 'ed-fondo') { if (e.target === b) cerrarEditor(); return; }
  if (!ed) return;
  if (act === 'ed-cancelar') cerrarEditor();
  else if (act === 'ed-add-link') { ed.data.links.push(['', '']); pintarEditor(); const f = document.querySelectorAll('#editor [data-e=l0]'); if (f.length) f[f.length - 1].focus(); }
  else if (act === 'ed-quitar-img') { delete ed.data.img; pintarEditor(); }
  else if (act === 'ed-del-link') { ed.data.links.splice(+l, 1); pintarEditor(); }
  else if (act === 'ed-del-app') {
    if (!confirm('¿Quitar "' + (ed.data.nombre || 'esta app') + '"?')) return;
    const nuevo = clonar(secciones); nuevo[ed.s].apps.splice(ed.a, 1); persistir(nuevo);
  }
  else if (act === 'ed-del-sec') {
    const n = secciones[ed.s].apps.length;
    if (n && !confirm('¿Quitar la sección y sus ' + n + ' app(s)?')) return;
    const nuevo = clonar(secciones); nuevo.splice(ed.s, 1); persistir(nuevo);
  }
});

render();
// Carga lo guardado de este hub (si existe); si no, quedan las originales.
(async function(){
  try {
    const r = await window.storage.get(KEY);
    const guardado = r && r.value ? normalizar(JSON.parse(r.value)) : null;
    if (guardado && !ed) { secciones = guardado; render(); }
  } catch (e) {}
})();
</script>
