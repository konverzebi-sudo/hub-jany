<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página no encontrada</title>
<style>body{margin:0;background:#F5F2FF;font-family:system-ui,sans-serif;color:#5B5784;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:16px;}a{color:#7C5CF2;font-weight:600;}</style>
<script>
  // Rutas viejas del dashboard de Jany: /X, /XX/... y /rescate.html mandan a /x/ (el dashboard vive solo ahí).
  // Se conserva lo que sigue de la dirección, por ejemplo ?t= de los links de Casa Jany que ya se compartieron.
  (function(){
    var p = location.pathname, m = /^\/(?:X|XX)(\/.*)?$/.exec(p), to = '';
    if (m) to = '/x' + (m[1] || '/');
    else if (p === '/rescate.html') to = '/x/rescate.html';
    if (to) location.replace(to + location.search + location.hash);
  })();
</script>
</head>
<body><p>No encontramos esa página.<br><a href="/">Ir al inicio</a></p></body>
</html>
