<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cuestionario Clínica Svelty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: una sola columna centrada tipo "expediente"; una pregunta por pantalla, barra de acciones fija abajo en el celular */
:root{
  /* Colores del logo Svelty: verde #85A333 y gris #716D6E */
  --brand:#82AA09; --brand-gray:#716D6E;
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#000000; --muted:#3A3A3A; --line:#D6D6D6;
  --accent:#5E7A1F; --accent-ink:#FFFFFF; --accent-soft:#EDF3DD;
  --rose:#000000; --rose-soft:#F0F0F0; --warn:#9A5B00; --warn-soft:#FBF0DC; --ok:#5E7A1F;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}

/* Inicio */
.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.logo{width:170px;height:auto;display:block}
.mark{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#FFFFFF;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.hero h1{font-size:clamp(28px,6vw,40px);margin:6px 0 12px}
.hero p{max-width:60ch;margin:0 0 8px}
.parts{display:grid;gap:12px;margin-top:24px}
.part{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;background:#3A3637;color:#FFFFFF;border:2px solid #3A3637;border-radius:var(--r);padding:16px}
.part:hover{border-color:var(--brand)}
.hero{border-left:4px solid var(--brand);padding-left:16px}
.part .tag{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.part .tag{background:var(--brand);color:#FFFFFF}
.part h2{font-size:18px}
.part h2{color:#FFFFFF}
.part .who{font-size:14px;color:#D9D6D6}
.part .meter{background:#5A5556}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.part .pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;min-width:3.5em;text-align:right;color:var(--brand)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:24px;font-size:14px}
.note b{font-weight:600}

/* Pregunta */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 22px}
.progress>i{display:block;height:100%;background:var(--brand);transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
.qcard h2{font-size:clamp(21px,4.6vw,27px);margin:6px 0 8px}
.req{color:var(--warn);font-size:13px;font-weight:600}
.help{color:var(--muted);margin:0 0 16px;max-width:62ch}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-weight:600;font-size:14px}
input[type=text],input[type=url],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;min-width:0}
textarea{min-height:130px;resize:vertical}
input[type=text]:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.opt input{width:18px;height:18px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:12px}
.thumb{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);aspect-ratio:1;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .fname{position:absolute;inset:auto 0 0 0;font-size:11px;padding:3px 6px;background:var(--surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .doc{display:grid;place-items:center;height:100%;font-size:12px;color:var(--muted);padding:6px;text-align:center;word-break:break-all}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:none;background:var(--surface);color:var(--ink);font-weight:700;line-height:1}
.colors{display:flex;flex-wrap:wrap;gap:12px}
.swatch{display:grid;gap:6px;justify-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.swatch input[type=color]{width:56px;height:56px;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--bg)}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:var(--bg)}
.item-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item-head b{font-family:var(--display)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:12px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.actions .in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
.actions .spacer{flex:1}
.saved{font-size:13px;color:var(--muted);margin-top:12px;min-height:1.4em}

/* Índice y revisión */
.sheet{position:fixed;inset:0;background:rgba(10,20,16,.45);display:flex;justify-content:flex-end;z-index:20}
.sheet .panel{background:var(--surface);width:min(420px,100%);height:100%;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px}
.idx-group{margin-top:18px}
.idx-group h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:600;margin-bottom:6px}
.idx{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:none;padding:8px 6px;border-radius:8px}
.idx:hover{background:var(--bg)}
.idx.cur{background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--line)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.miss{border-color:var(--warn)}
.rv-group{margin-top:26px}
.rv-group h3{font-size:19px;margin-bottom:8px}
.rv{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.rv .q{font-weight:600;font-size:15px}
.rv .a{white-space:pre-wrap;color:var(--muted);font-size:15px;min-width:0;overflow-wrap:anywhere}
.rv .a.empty{color:var(--warn)}
.rv .mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rv .mini img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.chip{font-size:13px;font-weight:600;border-radius:999px;padding:5px 12px;background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.send{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:28px;display:grid;gap:12px}
.send h3{font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pre{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--brand);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 14px}
.pretag{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 8px;white-space:nowrap}
.agency{border:1.5px dashed var(--brand);border-radius:var(--r);padding:16px;margin-top:24px;display:grid;gap:10px}
.legal{margin-top:32px;display:grid;gap:10px}
.legal h2{font-size:20px}
.legal>p{margin:0 0 4px}
.lk{display:grid;gap:4px;background:#FFFFFF;border:2px solid #FFFFFF;border-radius:var(--r);padding:14px 16px;color:var(--ink);text-decoration:none}
.lk:hover{border-color:#3A3637}
.lk b{color:#3A3637;font-size:17px}
.lk span{font-size:14px;color:#3A3A3A}
.consent{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:16px;margin-top:6px}
.consent>div{display:grid;gap:4px;flex:1 1 240px;min-width:0}
.consent span{font-size:14px}
html:has(body.home),body.home{background:var(--brand)}
body.home{color:#FFFFFF}
body.home .eyebrow{color:#FFFFFF}
body.home .hero{border-left-color:#FFFFFF}
body.home .hero h1,body.home .hero p,body.home .hero .muted{color:#FFFFFF}
body.home .legal>h2,body.home .legal>p{color:#FFFFFF}
body.home .note{background:#FFFFFF;border-color:#FFFFFF;color:#000000}
body.home .consent{background:#FFFFFF;color:#000000}
body.home .consent .muted{color:#3A3A3A}
body.home .consent .btn.primary{background:#3A3637;border-color:#3A3637;color:#FFFFFF}
body.home .part .tag{background:var(--brand)}
body.home .agency{border-color:#FFFFFF;color:#FFFFFF}
body.home .agency .muted{color:#FFFFFF}
body.home :focus-visible{outline-color:#FFFFFF}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000000;color:#FFFFFF;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head><body>

<div class="wrap" id="app" aria-live="polite"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ===== Configuración =====
   CONTACTO_ENTREGA: escribe aquí el WhatsApp o correo al que deben enviar el archivo.
   Si se deja vacío, el texto dirá "a quien te compartió este cuestionario". */
const CONTACTO_ENTREGA = "";
const STORE = "svelty_cuestionario_v6";
/* PRELLENADO: lo genera el "Modo agencia" (abre la página con #agencia al final de la dirección). No lo edites a mano salvo que sepas lo que haces. */
const PRELLENADO = /*PRELLENADO*/{"answers":{},"files":{}}/*FIN*/;

/* ===== Preguntas ===== */
const SVC_FIELDS = (extra)=>[
  {id:"nombre", t:"text", l:"Nombre del servicio"},
  {id:"frase", t:"text", l:"En una frase, ¿qué logra el paciente con este servicio?"},
  {id:"para", t:"textarea", l:"¿Para qué tipo de paciente es? (situación, edad, objetivo)"},
  {id:"beneficios", t:"textarea", l:"Beneficios principales (uno por línea)"},
  {id:"proceso", t:"textarea", l:"¿Cómo es el proceso, paso a paso?"},
  ...extra,
  {id:"resultados", t:"textarea", l:"¿Cuándo empieza a ver resultados y qué resultados son realistas?"},
  {id:"incluye", t:"textarea", l:"¿Qué incluye exactamente? (consultas, estudios, material, seguimiento)"},
  {id:"precio", t:"text", l:"Precio normal"},
  {id:"no_es_para", t:"textarea", l:"¿A quién NO se le recomienda?"},
  {id:"dudas", t:"textarea", l:"Dudas más frecuentes de este servicio y su respuesta"},
  {id:"foto", t:"files", l:"Fotos del servicio (opcional)", accept:"image/*", multiple:1}
];
const PERFIL_FIELDS = [
  {id:"nombre", t:"text", l:"Nombre del perfil (ej. “Mamá después del embarazo”)"},
  {id:"quien", t:"textarea", l:"¿Quién es? Edad, ocupación, situación"},
  {id:"quiere", t:"textarea", l:"¿Qué quiere lograr? Con sus propias palabras"},
  {id:"frena", t:"textarea", l:"¿Qué le frena o le da miedo antes de decidirse?"},
  {id:"intentado", t:"textarea", l:"¿Qué ha intentado antes?"},
  {id:"servicio", t:"text", l:"¿Qué servicio le recomienda normalmente?"}
];
const DOC_FIELDS = [
  {id:"nombre", t:"text", l:"Nombre completo como aparece en la cédula"},
  {id:"titulo", t:"text", l:"Título profesional (ej. Licenciatura en Nutrición, Médico Cirujano)"},
  {id:"inst_titulo", t:"text", l:"Institución que expidió el título"},
  {id:"cedula", t:"text", l:"Número de cédula profesional"},
  {id:"especialidad", t:"text", l:"Especialidad o maestría (si aplica)"},

];
const EQUIPO_FIELDS = [
  {id:"nombre", t:"text", l:"Nombre completo (tal como aparece en la cédula)"},
  {id:"rol", t:"text", l:"Función en el equipo (ej. médico general, nutrióloga, enfermera, cosmiatra)"},
  {id:"titulo", t:"text", l:"Título profesional (ej. Licenciatura en Nutrición, Médico Cirujano)"},
  {id:"inst_titulo", t:"text", l:"Institución que expidió el título"},
  {id:"cedula", t:"text", l:"Número de cédula profesional"},
  {id:"especialidad", t:"text", l:"Especialidad o maestría (si aplica)"},
  {id:"inst_esp", t:"text", l:"Institución que otorgó la especialidad"},
  {id:"cedula_esp", t:"text", l:"Número de cédula de especialidad"},
  {id:"consejo", t:"text", l:"Certificación del consejo de su especialidad: nombre del consejo, número y vigencia (obligatoria para cirugía estética)"},
  {id:"realiza", t:"textarea", l:"¿Qué servicios o procedimientos realiza en la clínica?"},
  {id:"sucursal", t:"text", l:"Sucursal(es) donde atiende"},
  {id:"foto", t:"files", l:"Foto profesional", accept:"image/*"},
  {id:"docs", t:"files", l:"Foto de la cédula y del certificado (para verificar los datos; no se publican)", accept:"image/*,.pdf", multiple:1},
  {id:"autoriza", t:"check", l:"Autoriza aparecer en el sitio con su nombre, foto y datos profesionales"}
];
const DOCTOR_GROUPS = (o)=>[
  {name:"Quién atiende", qs:[
    {id:"perfil", t:"repeat", single:1, req:1, unit:"Datos profesionales", q:o.perfilQ, h:"Estos datos deben aparecer junto a su nombre en el sitio, por ley (Ley General de Salud, art. 83).", fields:DOC_FIELDS},
    {id:"foto", t:"files", req:1, q:o.fotoQ, h:"Retrato con buena luz y fondo limpio. Si tiene fotos atendiendo pacientes, súbalas también más adelante.", accept:"image/*"},
    {id:"sucursal", t:"pick", source:{sec:"admin", q:"sucursales"}, q:"¿En qué sucursal(es) atiende?", h:"Elija de las sucursales registradas en los datos generales."},
    {id:"dias", t:"text", q:"¿Qué días y horario atiende en cada sucursal?", h:"Ejemplo: Centro lunes y miércoles 10–18 h; Norte viernes 9–14 h."},
    {id:"equipo", t:"repeat", unit:"Integrante", q:"Integrantes del equipo médico", h:"Registre a cada profesional de la salud que atiende pacientes en su área. La ley pide mostrar el título, la institución que lo expidió y la cédula (y en su caso la especialidad y su certificación) en toda publicidad de servicios de salud. Si no hay más integrantes, sáltela.", fields:EQUIPO_FIELDS},
    {id:"fotos_trabajo", t:"files", multiple:1, q:"Fotos atendiendo pacientes o en consulta", h:"Dan mucha confianza en el sitio. Solo si los pacientes que aparecen lo autorizaron.", accept:"image/*"}
  ]},
  {name:"Historia", qs:[
    {id:"historia", t:"textarea", req:1, q:"Cuéntenos su historia", h:"¿Cómo empezó en esta especialidad? ¿Qué "+o.lo+" llevó a dedicarse a esto? Escríbalo como si se lo contara a un paciente."},
    {id:"momentos", t:"textarea", q:"Momentos clave de su trayectoria", h:"Ejemplo: año en que empezó, cuándo llegó a Svelty, un caso que "+o.lo+" marcó, un logro importante."},
    {id:"formacion", t:"textarea", q:"Cursos, diplomados y asociaciones", h:"Lo que no anotó en sus datos profesionales."},
    {id:"cifras", t:"text", req:1, q:o.cifrasQ, h:"Cifras reales aproximadas. Generan mucha confianza."},
    {id:"filosofia", t:"textarea", q:"¿Cuál es su forma de trabajar con sus pacientes?", h:"Lo que nunca deja de hacer y lo que "+o.lo+" distingue en consulta."}
  ]},
  {name:"Lo que reconocen sus pacientes", qs:[
    {id:"reconocen", t:"textarea", req:1, q:"¿Qué es lo que más le reconocen y agradecen sus pacientes?", h:"De su trato, su forma de explicar, el seguimiento o los resultados."},
    {id:"frases", t:"textarea", q:"Frases textuales que le dicen sus pacientes", h:"Tal cual las dicen, una por línea. Ejemplo: “Por fin entendí cómo comer”."}
  ]},
  {name:"Servicios que maneja", qs:[
    {id:"servicios", t:"repeat", req:1, unit:o.unit, q:o.serviciosQ, h:o.serviciosH, fields:SVC_FIELDS(o.extraFields)},
    ...o.serviciosExtra
  ]},
  {name:"Productos", qs:[
    {id:"productos", t:"repeat", unit:"Producto", q:"Registre los productos que vende o recomienda en su área", h:o.productosH, fields:[

      {id:"para_que", t:"textarea", l:"¿Para qué sirve y a quién se lo recomienda?"},
      {id:"presentacion", t:"text", l:"Presentación (tamaño, cantidad, sabor)"},
      {id:"precio", t:"text", l:"Precio"},
      {id:"servicio", t:"text", l:"¿Con qué servicio se complementa?"},
      {id:"foto", t:"files", l:"Foto del producto", accept:"image/*", multiple:1}
    ]}
  ]},
  {name:"Lo que más se vende", qs:[
    {id:"mas_vendido", t:"pick", max:3, req:1, q:"¿Cuáles son los servicios que más vende?", h:"Elija hasta 3 de los que registró."},
    {id:"mas_margen", t:"pick", max:3, q:"¿Cuáles le dejan más ganancia?", h:"Elija hasta 3. Esta respuesta es solo para la agencia y no se publica."},
    {id:"impulsar", t:"pick", max:3, req:1, q:"¿Cuáles quiere impulsar más con el nuevo sitio?", h:"Elija hasta 3. Pueden ser nuevos o de buen margen que hoy se venden poco."}
  ]},
  {name:"Tipos de pacientes", qs:[
    {id:"perfiles", t:"repeat", req:1, unit:"Perfil", q:"Describa los tipos de pacientes que atiende", h:"Agregue de 2 a 4 perfiles distintos. Cada perfil tendrá su propio mensaje en el sitio.", fields:PERFIL_FIELDS}
  ]},
  {name:"Objeciones", qs:[
    {id:"objeciones", t:"repeat", req:1, unit:"Objeción", q:o.objecionQ, h:o.objecionH, fields:[
      {id:"objecion", t:"text", l:"Lo que dice el paciente"},{id:"respuesta", t:"textarea", l:"Cómo lo responde usted"}]},
    {id:"mitos", t:"textarea", q:o.mitosQ}
  ]},
  {name:"Testimonios y resultados", qs:[
    {id:"testimonios", t:"repeat", unit:"Testimonio", q:"Agregue testimonios reales de pacientes", h:"Solo de pacientes que firmaron la autorización (el formato se descarga en la pantalla de inicio). Pueden usar iniciales.", fields:[
      {id:"nombre", t:"text", l:"Nombre o iniciales"},{id:"servicio", t:"text", l:"Servicio que tomó"},{id:"resultado", t:"text", l:"Resultado y en cuánto tiempo"},{id:"texto", t:"textarea", l:"Testimonio"},
      {id:"foto", t:"files", l:"Foto o captura (opcional)", accept:"image/*"},
      {id:"ok", t:"check", l:"Tengo autorización del paciente para publicarlo"}]},
    {id:"antes", t:"files", multiple:1, q:"Fotos de antes y después", h:"Solo con consentimiento firmado del paciente.", accept:"image/*"},
    {id:"antes_ok", t:"choice", q:"¿Estas fotos cuentan con consentimiento firmado para uso publicitario?", opts:["Sí, todas","Algunas","No subí fotos"]},
    {id:"resenas", t:"text", q:"¿Tiene reseñas en Google, Facebook o Doctoralia? ¿Cuántas y con qué calificación?"}
  ]}
];

// Archivos en IndexedDB (con respaldo en memoria)
const mem=new Map(); let dbp=null;
function idb(){ if(dbp) return dbp; dbp=new Promise(res=>{ try{ const r=indexedDB.open(STORE,1); r.onupgradeneeded=()=>r.result.createObjectStore("files"); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){ res(null); } }); return dbp; }
async function putFile(id,rec){ mem.set(id,rec); const d=await idb(); if(!d) return; try{ await new Promise((ok,ko)=>{ const t=d.transaction("files","readwrite"); t.objectStore("files").put(rec,id); t.oncomplete=ok; t.onerror=ko; }); }catch(e){} }
async function getFile(id){ if(mem.has(id)) return mem.get(id); const d=await idb(); if(!d) return null; try{ return await new Promise(ok=>{ const r=d.transaction("files").objectStore("files").get(id); r.onsuccess=()=>{ if(r.result) mem.set(id,r.result); ok(r.result||null); }; r.onerror=()=>ok(null); }); }catch(e){ return null; } }
async function delFile(id){ mem.delete(id); urls.delete(id); const d=await idb(); if(!d) return; try{ d.transaction("files","readwrite").objectStore("files").delete(id); }catch(e){} }
const urls=new Map();
async function fileURL(id){ if(urls.has(id)) return urls.get(id); const f=await getFile(id); if(!f) return null; const u=URL.createObjectURL(f.blob); urls.set(id,u); return u; }
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);

// Optimizar imágenes (no el logo)
async function prepare(file, keep){
  const isImg=/^image\/(jpeg|png|webp|heic|heif)/.test(file.type);
  if(keep || !isImg || file.size<400*1024) return {blob:file, name:file.name, type:file.type||"application/octet-stream"};
  try{
    const bmp=await createImageBitmap(file);
    const max=1800, sc=Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.86));
    if(!blob || blob.size>=file.size) return {blob:file,name:file.name,type:file.type};
    return {blob, name:file.name.replace(/\.[^.]+$/,"")+".jpg", type:"image/jpeg"};
  }catch(e){ return {blob:file,name:file.name,type:file.type}; }
}

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(t._t); t._t=setTimeout(()=>t.hidden=true,2600); }
function isAnswered(q,v){
  if(v==null) return false;
  if(q.t==="text"||q.t==="textarea"||q.t==="choice") return String(v).trim()!=="";
  if(q.t==="multi"||q.t==="files"||q.t==="pick") return Array.isArray(v)&&v.length>0;
  if(q.t==="colors") return Array.isArray(v)&&v.some(Boolean);
  if(q.t==="socials") return !!(v&&((v.facebook||"").trim()||(v.instagram||"").trim()||(v.otras||[]).some(o=>(o.url||"").trim())));
  if(q.t==="repeat") return Array.isArray(v)&&v.some(it=>Object.entries(it).some(([k,x])=>Array.isArray(x)?x.length:(typeof x==="string"?x.trim():false)));
  return false;
}
function stats(s){ const a=state.answers[s.key]; let done=0, miss=0; s.flat.forEach(q=>{ const ok=isAnswered(q,a[q.id]); if(ok) done++; else if(q.req) miss++; }); return {done,total:s.flat.length,miss}; }

function sec(){ return SECTIONS.find(x=>x.key===view.s); }

function renderQ(){
  const s=sec(), q=s.flat[view.i], a=state.answers[s.key], v=a[q.id];
  const pct=Math.round((view.i)/s.flat.length*100);
  app.innerHTML=`
  <div class="topbar">
    <button class="btn ghost small" id="home">← Inicio</button>
    <span class="eyebrow">${esc(s.title)}</span>
    <button class="btn small" id="idx">Índice</button>
  </div>
  <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>
  <article class="qcard">
    <div class="eyebrow">${esc(q.group)} · Pregunta ${view.i+1} de ${s.flat.length}</div>
    <h2 id="qt">${esc(q.q)}</h2>
    ${q.req?'<div class="req">Indispensable</div>':''}
    ${q.h?`<p class="help">${esc(q.h)}</p>`:'<div style="height:10px"></div>'}
    ${isAnswered(q,v)&&isPrefilled(s.key,q.id,v)?'<div class="pre">Esta respuesta ya viene llena. Revísenla y corrijan si algo no está bien.</div>':''}
    <div id="input"></div>
    <div class="saved" id="saved"></div>
  </article>`;
  buildInput(document.getElementById("input"), q, v, val=>{ a[q.id]=val; persist(); });
  document.getElementById("home").onclick=()=>go({name:"home"});
  document.getElementById("idx").onclick=openIndex;
  actions([
    `<button class="btn" id="prev" ${view.i===0?"disabled":""}>Anterior</button>`,
    `<span class="spacer"></span>`,
    `<button class="btn ghost" id="skip">Saltar</button>`,
    `<button class="btn primary" id="next">${view.i===s.flat.length-1?"Revisar todo":"Siguiente"}</button>`
  ]);
  document.getElementById("prev").onclick=()=>go({i:view.i-1});
  const nxt=()=>{ if(view.i===s.flat.length-1) go({name:"review"}); else go({i:view.i+1}); };
  document.getElementById("next").onclick=nxt;
  document.getElementById("skip").onclick=nxt;
  const first=app.querySelector("#input input[type=text], #input textarea");
  if(first && matchMedia("(min-width:700px)").matches) first.focus();
  if(q.t==="text"){ app.querySelector("#input input").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); nxt(); } }); }
}

function actions(btns){
  let bar=document.getElementById("actions");
  if(!bar){ bar=document.createElement("div"); bar.id="actions"; bar.className="actions"; document.body.appendChild(bar); }
  bar.innerHTML=`<div class="in">${btns.join("")}</div>`;
}

/* Constructores de campos */
function buildInput(host,q,v,set){
  const t=q.t;
  if(t==="text"){ host.innerHTML=`<input type="text" id="f_${q.id}" value="${esc(v||"")}" aria-labelledby="qt">`; host.firstChild.oninput=e=>set(e.target.value); return; }
  if(t==="textarea"){ host.innerHTML=`<textarea id="f_${q.id}" aria-labelledby="qt">${esc(v||"")}</textarea>`; host.firstChild.oninput=e=>set(e.target.value); return; }
  if(t==="choice"||t==="multi"){
    const type=t==="choice"?"radio":"checkbox"; const cur=t==="multi"?(v||[]):v;
    host.innerHTML=`<div class="opts" role="${t==="choice"?"radiogroup":"group"}" aria-labelledby="qt">${q.opts.map((o,k)=>`<label class="opt"><input type="${type}" name="o_${q.id}" id="o_${q.id}_${k}" value="${esc(o)}" ${(t==="multi"?cur.includes(o):cur===o)?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div>
    ${t==="choice"?`<button class="btn ghost small" id="clr" style="margin-top:8px">Quitar selección</button>`:""}`;
    host.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{ if(t==="choice") set(inp.value); else set([...host.querySelectorAll("input:checked")].map(x=>x.value)); });
    const c=host.querySelector("#clr"); if(c) c.onclick=()=>{ host.querySelectorAll("input").forEach(x=>x.checked=false); set(""); };
    return;
  }
  if(t==="colors"){
    const cur=Array.isArray(v)?v.slice():["","","",""];
    while(cur.length<4) cur.push("");
    const draw=()=>{ host.innerHTML=`<div class="colors">${cur.map((c,k)=>`<div class="swatch"><input type="color" id="c_${k}" value="${c||"#ffffff"}" aria-label="Color ${k+1}"><span>${c?c.toUpperCase():"Sin elegir"}</span>${c?`<button class="btn ghost small" data-k="${k}">Quitar</button>`:""}</div>`).join("")}</div>`;
      host.querySelectorAll("input[type=color]").forEach((inp,k)=>inp.onchange=()=>{ cur[k]=inp.value; set(cur.slice()); draw(); });
      host.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>{ cur[+b.dataset.k]=""; set(cur.slice()); draw(); }); };
    draw(); return;
  }
  if(t==="files"){ buildFiles(host,q,v||[],set,"qt"); return; }
  if(t==="pick"){ buildPick(host,q,v||[],set); return; }
  if(t==="socials"){ buildSocials(host,q,v,set); return; }
  if(t==="repeat"){ buildRepeat(host,q,v||[],set); return; }
}

function serviceNames(sk, qid){
  const out=[]; (state.answers[sk][qid]||[]).forEach(it=>{ const n=String(it.nombre||"").trim(); if(n && !out.includes(n)) out.push(n); });
  return out;
}

  const d=Object.assign({facebook:"",instagram:"",otras:[]}, v?JSON.parse(JSON.stringify(v)):{});

  const draw=()=>{
    host.innerHTML=`

      <div class="field"><label for="s_ig">Instagram</label><input type="text" id="s_ig" inputmode="url" placeholder="instagram.com/… o @usuario" value="${esc(d.instagram)}"></div>
      ${d.otras.map((o,k)=>`<div class="item">
        <div class="item-head"><b>Otra red ${k+1}</b><button class="btn ghost small" data-del="${k}">Eliminar</button></div>
        <div class="field"><label for="s_r${k}">Red social</label><input type="text" id="s_r${k}" data-k="${k}" data-f="red" placeholder="TikTok, YouTube, Doctoralia…" value="${esc(o.red||"")}"></div>
        <div class="field"><label for="s_u${k}">Enlace o usuario</label><input type="text" id="s_u${k}" data-k="${k}" data-f="url" inputmode="url" value="${esc(o.url||"")}"></div>
      </div>`).join("")}
      <button class="btn" id="s_add" style="margin-top:14px">+ Agregar otra red social</button>`;
    host.querySelector("#s_fb").oninput=e=>{ d.facebook=e.target.value; save(); };
    host.querySelector("#s_ig").oninput=e=>{ d.instagram=e.target.value; save(); };
    host.querySelectorAll("[data-f]").forEach(inp=>inp.oninput=()=>{ d.otras[+inp.dataset.k][inp.dataset.f]=inp.value; save(); });
    host.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ d.otras.splice(+b.dataset.del,1); save(); draw(); });
    host.querySelector("#s_add").onclick=()=>{ d.otras.push({red:"",url:""}); save(); draw(); const el=host.querySelector(`#s_r${d.otras.length-1}`); if(el) el.focus(); };
  };
  draw();
}
function buildPick(host,q,cur,set){
  const src=q.source||{sec:view.s,q:"servicios"}; const sk=src.sec; const names=serviceNames(sk, src.q); cur.forEach(c=>{ if(!names.includes(c)) names.push(c); });
  if(!names.length){
    host.innerHTML=`<div class="note" style="margin-top:0">${src.q==="sucursales"?"Todavía no hay sucursales registradas. Se llenan en los datos generales de la clínica.":"Todavía no hay servicios registrados. Primero llene la sección de servicios y aquí aparecerán para elegir."}</div><button class="btn primary" id="gocat" style="margin-top:12px">${src.q==="sucursales"?"Ir a las sucursales":"Ir a los servicios"}</button>`;
    host.querySelector("#gocat").onclick=()=>{ const a=SECTIONS.find(x=>x.key===sk); go({name:"q", s:sk, i:a.flat.findIndex(x=>x.id===src.q)}); };
    return;
  }
  host.innerHTML=`<div class="opts" role="group" aria-labelledby="qt">${names.map((o,k)=>`<label class="opt"><input type="checkbox" id="p_${q.id}_${k}" value="${esc(o)}" ${cur.includes(o)?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div>
    <p class="muted" style="font-size:14px;margin:10px 0 0">${src.q==="sucursales"?"¿Falta alguna? Se agrega en los datos generales de la clínica.":"¿Falta alguno? Agréguelo en la sección de servicios y regrese aquí."}</p>`;

  });
}
function buildFiles(host,q,list,set,labelId){
  const multiple=!!q.multiple;
  host.innerHTML=`<label class="drop" id="d_${q.id}"><input type="file" ${multiple?"multiple":""} accept="${esc(q.accept||"image/*")}" aria-labelledby="${labelId||""}">
    <div><b>${multiple?"Elegir archivos":"Elegir archivo"}</b></div><div class="muted" style="font-size:14px">o arrástrelos aquí</div></label>
    <div class="thumbs"></div>`;
  const drop=host.querySelector(".drop"), inp=host.querySelector("input"), th=host.querySelector(".thumbs");
  const draw=async()=>{ th.innerHTML=""; for(const ref of list){ const f=await getFile(ref.id); const d=document.createElement("div"); d.className="thumb";
      if(f && /^image\//.test(f.type) && !/svg/.test(f.type)){ d.innerHTML=`<img alt="${esc(ref.name)}" src="${await fileURL(ref.id)}"><span class="fname">${esc(ref.name)}</span>`; }
      else d.innerHTML=`<div class="doc">${esc(ref.name)}</div>`;
      const x=document.createElement("button"); x.setAttribute("aria-label","Quitar "+ref.name); x.textContent="×";
      x.onclick=async(e)=>{ e.preventDefault(); list=list.filter(r=>r.id!==ref.id); await delFile(ref.id); set(list.slice()); draw(); };
      d.appendChild(x); th.appendChild(d); } };
  const add=async(files)=>{ if(!files.length) return; toast("Subiendo…");
    if(!multiple){ for(const r of list) await delFile(r.id); list=[]; files=[files[0]]; }
    for(const file of files){ const rec=await prepare(file,q.keep); const id=uid(); await putFile(id,rec); list.push({id,name:rec.name}); }
    set(list.slice()); draw(); toast(files.length>1?"Archivos agregados":"Archivo agregado"); };
  inp.onchange=()=>add([...inp.files]);
  drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over");});
  drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
  drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("over");add([...e.dataTransfer.files]);});
  draw();
}

function buildRepeat(host,q,items,set){
  if(!items.length) items=[{}];
  while(items.length<(q.min||1)) items.push({});
  const save=()=>set(items.map(x=>Object.assign({},x)));
  const draw=()=>{
    host.innerHTML="";
    items.forEach((it,n)=>{
      const box=document.createElement("div"); box.className="item";
      box.innerHTML=q.single?"":`<div class="item-head"><b>${esc(q.unit)} ${n+1}</b>${items.length>1?`<button class="btn ghost small" data-del>Eliminar</button>`:""}</div>`;
      q.fields.forEach(f=>{
        const fid=`r_${q.id}_${n}_${f.id}`;
        const w=document.createElement("div");
        if(f.t==="check"){ w.className="check"; w.innerHTML=`<input type="checkbox" id="${fid}" ${it[f.id]?"checked":""}><label for="${fid}">${esc(f.l)}</label>`; w.querySelector("input").onchange=e=>{ it[f.id]=e.target.checked?"Sí":""; save(); }; }
        else if(f.t==="files"){ w.className="field"; w.innerHTML=`<label id="${fid}_l">${esc(f.l)}</label><div></div>`; buildFiles(w.lastChild, Object.assign({id:fid},f), it[f.id]||[], val=>{ it[f.id]=val; save(); }, fid+"_l"); }
        else { w.className="field"; w.innerHTML=`<label for="${fid}">${esc(f.l)}</label>`+(f.t==="textarea"?`<textarea id="${fid}" style="min-height:90px">${esc(it[f.id]||"")}</textarea>`:`<input type="text" id="${fid}" value="${esc(it[f.id]||"")}">`);
          w.querySelector("input,textarea").oninput=e=>{ it[f.id]=e.target.value; save(); }; }
        box.appendChild(w);
      });
      const del=box.querySelector("[data-del]");
      if(del) del.onclick=async()=>{ for(const f of q.fields) if(f.t==="files") for(const r of (it[f.id]||[])) await delFile(r.id); items.splice(n,1); save(); draw(); };
      host.appendChild(box);
    });
    if(q.single) return;
    const addb=document.createElement("button"); addb.className="btn"; addb.style.marginTop="12px"; addb.textContent=`+ Agregar ${q.unit.toLowerCase()}`;
    addb.onclick=()=>{ items.push({}); draw(); const boxes=host.querySelectorAll(".item"); boxes[boxes.length-1].scrollIntoView({behavior:"smooth",block:"start"}); };
    host.appendChild(addb);
  };
  draw();
}

/* Revisión */
function textAnswer(q,v){
  if(!isAnswered(q,v)) return "";
  if(q.t==="multi"||q.t==="pick") return v.join(", ");
  if(q.t==="colors") return v.filter(Boolean).map(c=>c.toUpperCase()).join("  ");
  if(q.t==="socials"){ const l=[]; if((v.facebook||"").trim()) l.push("Facebook: "+v.facebook.trim()); if((v.instagram||"").trim()) l.push("Instagram: "+v.instagram.trim()); (v.otras||[]).forEach(o=>{ if((o.url||"").trim()) l.push((o.red||"Otra red").trim()+": "+o.url.trim()); }); return l.join("\n"); }
  if(q.t==="files") return v.map(r=>r.name).join(", ");
  if(q.t==="repeat") return v.filter(it=>Object.values(it).some(x=>Array.isArray(x)?x.length:String(x||"").trim())).map((it,n)=>`${q.unit} ${n+1}:\n`+q.fields.map(f=>{ const x=it[f.id]; const s=Array.isArray(x)?x.map(r=>r.name).join(", "):(x||""); return s?`• ${f.l}: ${s}`:""; }).filter(Boolean).join("\n")).join("\n\n");
  return String(v);
}
function collectRefs(q,v){ const out=[]; if(q.t==="files"&&Array.isArray(v)) out.push(...v); if(q.t==="repeat"&&Array.isArray(v)) v.forEach(it=>q.fields.forEach(f=>{ if(f.t==="files"&&Array.isArray(it[f.id])) out.push(...it[f.id]); })); return out; }

function buildMarkdown(s, fileNames){
  const a=state.answers[s.key]; const d=new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
  let md=`# Clínica Svelty — ${s.title}\n\n${s.who} · ${d}\n`;
  s.groups.forEach(g=>{ md+=`\n## ${g.name}\n`; g.qs.forEach(q=>{ let txt=textAnswer(q,a[q.id]);
    if(fileNames){ collectRefs(q,a[q.id]).forEach(r=>{ if(fileNames[r.id]) txt=txt.split(r.name).join(fileNames[r.id]); }); }
    md+=`\n**${q.q}**${q.req?" (indispensable)":""}\n\n${txt||"_Sin responder_"}\n`; }); });
  return md;
}
async function copyText(s){
  const txt=buildMarkdown(s).replace(/\*\*/g,"*");
  try{ await navigator.clipboard.writeText(txt); toast("Respuestas copiadas"); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("Respuestas copiadas"); }catch(_){ toast("No se pudo copiar. Usen la descarga ZIP."); } ta.remove(); }
}
async function exportZip(s){
  if(typeof JSZip==="undefined"){ toast("No cargó el generador de ZIP. Revisen su conexión."); return; }
  toast("Preparando archivo…");
  const a=state.answers[s.key], zip=new JSZip(), date=new Date().toISOString().slice(0,10);
  const base=`Svelty_${s.key}_${date}`, folder=zip.folder(base), files=folder.folder("archivos");
  const names={}; let n=0;
  for(const q of s.flat){ for(const r of collectRefs(q,a[q.id])){ const f=await getFile(r.id); if(!f) continue; n++;
    const safe=`${q.id}_${String(n).padStart(2,"0")}_${r.name.replace(/[^\w.\-]+/g,"_")}`; names[r.id]="archivos/"+safe; files.file(safe,f.blob); } }
  folder.file("respuestas.md", buildMarkdown(s,names));
  folder.file("respuestas.json", JSON.stringify({seccion:s.title, llena:s.who, fecha:date, respuestas:a, archivos:names},null,2));
  const blob=await zip.generateAsync({type:"blob"});
  await saveBlob(blob, base+".zip");
}
async function saveBlob(blob, filename){
  try{
    if(window.claude && typeof window.claude.use==="function"){
      const dl=await window.claude.use("downloads");
      if(dl){ try{ await dl.save({filename, data:blob}); toast("Archivo listo"); return; }catch(e){ if(e&&e.code==="declined") return; } }
    }
  }catch(e){}
  try{ const u=URL.createObjectURL(blob); const l=document.createElement("a"); l.href=u; l.download=filename; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); toast("Descarga iniciada"); }
  catch(e){ toast("No se pudo descargar en esta vista."); }

async function downloadConsent(){
  const bin=atob(CONSENT_DOCX), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  await saveBlob(new Blob([u8],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}),"Autorizacion_uso_de_imagen_Svelty.docx");
}
async function blobToDataURL(b){ return await new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); }); }
async function exportPrefilled(){
  let src=null;
  try{ const r=await fetch(location.href.split("#")[0],{cache:"no-store"}); if(r.ok) src=await r.text(); }catch(e){}
  if(!src || src.indexOf("/*PRELLENADO*/")<0){ toast("Esta opción funciona en la versión hospedada (index.html)."); return; }
  toast("Preparando archivo…");
  const files={};
  for(const sct of SECTIONS){ const a=state.answers[sct.key]; for(const q of sct.flat){ for(const r of collectRefs(q,a[q.id])){ const f=await getFile(r.id); if(f) files[r.id]={name:f.name||r.name, type:f.type, data:await blobToDataURL(f.blob)}; } } }
  const json=JSON.stringify({answers:state.answers, files}).replace(/</g,"\\u003c");
  const out=src.replace(/\/\*PRELLENADO\*\/[\s\S]*?\/\*FIN\*\//, ()=>"/*PRELLENADO*/"+json+"/*FIN*/");
  await saveBlob(new Blob([out],{type:"text/html"}),"index.html");
}
async function resetAll(){
  try{ localStorage.removeItem(STORE); }catch(e){}
  try{ const d=await idb(); if(d) await new Promise(ok=>{ const t=d.transaction("files","readwrite"); t.objectStore("files").clear(); t.oncomplete=ok; t.onerror=ok; }); }catch(e){}
  mem.clear(); urls.clear();
  state={answers:{admin:{},nutricion:{},estetica:{}}};
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
  toast("Se borraron las respuestas de este navegador"); go({name:"home"});
}
async function loadPrefillFiles(){
  const pf=(PRELLENADO&&PRELLENADO.files)||{};
  for(const id of Object.keys(pf)){ if(await getFile(id)) continue; try{ const blob=await (await fetch(pf[id].data)).blob(); await putFile(id,{blob,name:pf[id].name,type:pf[id].type}); }catch(e){} }
}
window.addEventListener("hashchange",()=>{ if(view.name==="home") render(); });
loadPrefillFiles().finally(()=>render());
</script>
