<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JefesHub — Central de Agentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root{
    --bg: #0D1008;
    --surface: #111408;
    --surface-2: #191D0C;
    --accent: #B8F725;
    --accent-soft: rgba(184,247,37,0.10);
    --chalk: #F3F6E8;
    --chalk-dim: #A8B490;
    --line: #262D10;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; }
  body{
    background: radial-gradient(ellipse 120% 60% at 50% -10%, #1A2510 0%, var(--bg) 55%);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  /* Grafo a pantalla completa */
  .graph-full{ position: fixed; inset: 0; }
  .center-aura{
    position: fixed; top: 50%; left: 50%; width: 900px; height: 900px;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    filter: blur(24px); pointer-events: none;
  }
  #hub-graph{ display:block; width:100%; height:100%; cursor: grab; position: relative; }
  #hub-graph:active{ cursor: grabbing; }
  .star{ fill: var(--chalk); animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:.12; } 50%{ opacity:.65; } }
  .graph-link{ stroke: var(--chalk-dim); stroke-width: 1.2; opacity: .38; }
  .graph-link.satellite-link{ stroke: var(--chalk); stroke-width: .7; opacity: .14; }
  .graph-node{ cursor: pointer; }
  .graph-node.locked{ cursor: not-allowed; }
  .graph-node.satellite{ pointer-events: none; }
  .graph-node.satellite circle{ fill: var(--chalk); opacity: .4; }
  .graph-node circle{ stroke-width: 1.5; transition: filter .15s ease; }
  .graph-node.active circle{
    fill: var(--surface-2);
    stroke: var(--accent);
    filter: drop-shadow(0 0 8px rgba(184,247,37,0.35));
  }
  .graph-node.active:hover circle{ filter: drop-shadow(0 0 16px rgba(184,247,37,0.65)); }
  .graph-node.locked circle{ fill: var(--surface); stroke: var(--line); opacity: .55; }
  .graph-node .node-emoji{ font-size: 22px; text-anchor: middle; dominant-baseline: central; pointer-events: none; user-select: none; }
  .graph-node .node-lock{ font-size: 16px; text-anchor: middle; dominant-baseline: central; pointer-events: none; opacity: .6; }
  .graph-node .node-label{ font-family:'JetBrains Mono',monospace; font-size: 11px; letter-spacing: .02em; text-anchor: middle; fill: var(--chalk-dim); pointer-events: none; user-select: none; }
  .graph-node.active .node-label{ fill: var(--chalk); }
  .graph-node .node-num{ font-family:'JetBrains Mono',monospace; font-size: 9px; letter-spacing: .1em; text-anchor: middle; fill: var(--chalk-dim); opacity: .8; pointer-events: none; }

  /* Nodo central: ADN del negocio */
  .graph-node.adn-node circle{
    fill: var(--surface-2);
    stroke: #555;
    stroke-width: 2;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.08));
  }
  .graph-node.adn-node.connected circle{
    stroke: var(--accent);
    filter: drop-shadow(0 0 18px rgba(184,247,37,0.5));
    animation: adn-pulse 2.2s ease-in-out infinite;
  }
  @keyframes adn-pulse{ 0%,100%{ filter: drop-shadow(0 0 14px rgba(184,247,37,0.4)); } 50%{ filter: drop-shadow(0 0 26px rgba(184,247,37,0.75)); } }
  .graph-node.adn-node .node-emoji{ font-size: 30px; }
  .graph-node.adn-node .node-label{ font-size: 12px; fill: var(--chalk); }
  .graph-node.adn-node .node-status{ font-family:'JetBrains Mono',monospace; font-size: 9px; letter-spacing: .12em; text-transform:uppercase; text-anchor: middle; fill: #888; pointer-events: none; }
  .graph-node.adn-node.connected .node-status{ fill: var(--accent); }

  /* Overlay superior: breadcrumb de marca */
  .top-overlay{
    position: fixed; top: 20px; left: 24px; z-index: 10;
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace; font-size: 11px; letter-spacing:.13em; text-transform:uppercase;
    color: var(--chalk-dim);
    padding: 7px 16px; border: 1px solid var(--line); border-radius: 100px;
    background: rgba(13,16,8,0.65); backdrop-filter: blur(6px);
  }
  .graph-hint{
    position: fixed; top: 20px; right: 24px; z-index: 10;
    font-family:'JetBrains Mono',monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--chalk-dim); opacity: .7;
  }

  /* Pastilla de tokens, abajo al centro */
  .tokens-pill{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
    font-size: 12px; color: var(--chalk-dim);
    background: rgba(17,20,8,0.75); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 100px;
    padding: 8px 18px; white-space: nowrap;
  }

  /* FAB: Editar ADN */
  .fab-adn{
    position:fixed; bottom:24px; right:24px; z-index: 20;
    display:flex; align-items:center; gap:9px;
    background:#191D0C; border:1px solid var(--line); border-radius:40px;
    padding:11px 18px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.07em; text-transform:uppercase;
    color: var(--chalk-dim); text-decoration:none; transition:.15s;
  }
  .fab-adn:hover{ border-color: var(--accent); color: var(--accent); }

  .footer-overlay{
    position: fixed; bottom: 24px; left: 24px; z-index: 10;
    font-size: 11px; color: var(--chalk-dim); opacity: .6;
    max-width: 260px; line-height: 1.5;
  }
  .footer-overlay a{ color: var(--accent); text-decoration:none; }
  @media (max-width: 720px){
    .footer-overlay{ display:none; }
    .tokens-pill{ font-size: 10px; max-width: 82vw; overflow:hidden; text-overflow:ellipsis; }
  }
</style>
</head>
<body>

<div class="graph-full">
  <div class="center-aura"></div>
  <svg id="hub-graph"></svg>
</div>

<div class="top-overlay">
  <span style="color:#B8F725;">JefesHub</span><span style="opacity:.4;">·</span>
  <span>Centro de Control</span><span style="opacity:.4;">·</span>
  <span id="brand-marca-label" style="color:#B8F725;">JefesHub</span>
</div>
<span class="graph-hint">Arrastra los nodos · Click para entrar</span>

<div class="tokens-pill" id="tokens-pill">🔢 Cargando tokens…</div>

<a class="fab-adn" href="/adn">✦ Editar ADN del negocio</a>

<div class="footer-overlay">
  JefesHub<br>
  Equipo de Marketing IA por <a href="https://jefeshub.com">JefesHub</a>
</div>

<script src="/js/storage-client.js"></script>
<script>
(function initHubGraph(){
  const CLIENTE_ID = 'jefeshub';

  const jefes = [
    {id:0, num:'01', emoji:'🌱', nombre:'Jefe Evergreen', activo:true, href:'/consultor-evergreen'},
    {id:1, num:'02', emoji:'💰', nombre:'Jefe Finanzas', activo:true, href:'/consultor-financiero'},
    {id:2, num:'03', emoji:'🚦', nombre:'Jefe de Conversión', activo:true, href:'/consultor-cierre'},
    {id:3, num:'04', emoji:'📳', nombre:'WhatsApp y Ventas', activo:true, href:'/consultor-whatsapp'},
    {id:4, num:'05', emoji:'☢️', nombre:'Radar de Tendencias', activo:true, href:'/consultor-radar'},
    {id:5, num:'06', emoji:'🗓️', nombre:'Jefe Contenido', activo:true, href:'/consultor-contenido'},
    {id:6, num:'07', emoji:'📣', nombre:'Anuncios y Campañas', activo:true, href:'/consultor-anuncios'},
    {id:7, num:'08', emoji:'🎨', nombre:'Activos IA', activo:false, href:null},
    {id:8, num:'09', emoji:'👁️', nombre:'Optimización', activo:true, href:'/consultor-optimizacion'},
    {id:9, num:'10', emoji:'🕐', nombre:'Campañas de Temporada', activo:false, href:null},
  ];
  // Nodo central: el ADN del negocio. Todos los Jefes conectan hacia el
  // (hub-and-spoke) -- la conexion es decorativa/tematica, no representa
  // paso de datos real entre Jefes.
  const adnNode = {id:'adn', esADN:true, nombre:'ADN pendiente', href:'/adn'};
  const nodesData = [adnNode, ...jefes];
  const linksData = jefes.map(j => ({source:'adn', target:j.id}));

  // Nodos satelite: puntos decorativos sin datos ni click, solo dan la
  // textura de "constelacion" densa (inspirado en la vista de grafo de
  // Obsidian) -- no representan informacion real.
  function agregarSatelites(parent, cantidad){
    for(let i=0;i<cantidad;i++){
      const id = 'sat-' + parent.id + '-' + i;
      nodesData.push({id, esSatelite:true});
      linksData.push({source:parent.id, target:id, esSatelite:true});
    }
  }
  agregarSatelites(adnNode, 14);
  jefes.forEach(j => agregarSatelites(j, j.activo ? 5 : 2));

  const svg = d3.select('#hub-graph');
  let width = window.innerWidth, height = window.innerHeight;
  svg.attr('viewBox', [0,0,width,height]);

  const starsLayer = svg.append('g').attr('class','stars-layer');
  function pintarEstrellas(){
    const cantidad = 90;
    const estrellas = Array.from({length: cantidad}, () => ({
      cx: Math.random()*width, cy: Math.random()*height,
      r: Math.random()*1.3 + 0.4, delay: Math.random()*3.6
    }));
    starsLayer.selectAll('circle').data(estrellas).join('circle')
      .attr('class','star')
      .attr('cx', d=>d.cx).attr('cy', d=>d.cy).attr('r', d=>d.r)
      .style('animation-delay', d => d.delay + 's');
  }
  pintarEstrellas();

  adnNode.x = width/2; adnNode.y = height/2;
  adnNode.fx = width/2; adnNode.fy = height/2; // fijo en el centro siempre

  const r0 = Math.min(width,height)/2 - 90;
  jefes.forEach((d,i)=>{
    const angle = (i/jefes.length)*2*Math.PI;
    d.x = width/2 + r0*Math.cos(angle);
    d.y = height/2 + r0*Math.sin(angle);
  });

  function radioDe(d){ return d.esADN ? 60 : d.esSatelite ? 2.4 : (d.activo?46:36); }

  // El simulador de D3 se "enfria" y se detiene solo tras ~5s por diseño.
  // Un alphaTarget permanente arriba de alphaMin lo mantiene vivo para
  // siempre, y esta fuerza de "vida" le da un temblor organico continuo
  // (si no, el grafo se congela por completo una vez que se acomoda).
  const ALPHA_VIDA = 0.045;
  function fuerzaVida(alpha){
    for (const d of nodesData){
      if (d.esADN) continue;
      const intensidad = d.esSatelite ? 0.5 : 0.18;
      d.vx += (Math.random()-0.5) * intensidad * alpha;
      d.vy += (Math.random()-0.5) * intensidad * alpha;
    }
  }

  const simulation = d3.forceSimulation(nodesData)
    .force('link', d3.forceLink(linksData).id(d=>d.id)
      .distance(d => d.esSatelite ? 26 + Math.random()*22 : 190)
      .strength(d => d.esSatelite ? 0.7 : 0.5))
    .force('charge', d3.forceManyBody().strength(d => d.esSatelite ? -6 : -340))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collide', d3.forceCollide(d => d.esSatelite ? 5 : radioDe(d)+16))
    .force('vida', fuerzaVida)
    .alphaTarget(ALPHA_VIDA);

  const link = svg.append('g').selectAll('line')
    .data(linksData).join('line')
    .attr('class', d => 'graph-link' + (d.esSatelite ? ' satellite-link' : ''));

  const node = svg.append('g').selectAll('g')
    .data(nodesData).join('g')
    .attr('class', d => d.esADN ? 'graph-node adn-node' : d.esSatelite ? 'graph-node satellite' : 'graph-node ' + (d.activo ? 'active' : 'locked'))
    .call(d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended));

  node.append('circle').attr('r', radioDe);
  const nodePrincipal = node.filter(d=>!d.esADN && !d.esSatelite);
  nodePrincipal.append('text').attr('class','node-num').attr('y', d=>d.activo?-26:-22).text(d=>d.num);
  nodePrincipal.append('text').attr('class','node-emoji').attr('y', d=>d.activo?-4:-2).text(d=>d.emoji);
  nodePrincipal.filter(d=>!d.activo).append('text').attr('class','node-lock').attr('y',18).text('🔒');
  nodePrincipal.append('text').attr('class','node-label').attr('y', d=>radioDe(d)+18).text(d=>d.nombre);
  nodePrincipal.append('title').text(d => d.activo ? d.nombre : d.nombre + ' — Próximamente');

  // Nodo ADN: emoji, nombre del negocio (o "ADN pendiente"), y estado.
  node.filter(d=>d.esADN).append('text').attr('class','node-emoji').attr('y', -8).text('🧬');
  node.filter(d=>d.esADN).append('text').attr('class','node-label').attr('id','adn-node-label').attr('y', 16).text(d=>d.nombre);
  node.filter(d=>d.esADN).append('text').attr('class','node-status').attr('id','adn-node-status').attr('y', 32).text('Pendiente');
  node.filter(d=>d.esADN).append('title').attr('id','adn-node-title').text('Editar ADN del negocio');

  let dragDistance = 0;
  node.on('click', (event, d) => {
    if (dragDistance > 6) return;
    if (d.esADN && d.href) { window.location.href = d.href; return; }
    if (d.activo && d.href) window.location.href = d.href;
  });

  simulation.on('tick', () => {
    link.attr('x1', d=>d.source.x).attr('y1', d=>d.source.y).attr('x2', d=>d.target.x).attr('y2', d=>d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  function dragstarted(event, d){
    dragDistance = 0;
    if (!event.active) simulation.alphaTarget(0.25).restart();
    if (d.esADN) return; // el nodo ADN se queda fijo en el centro
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d){
    dragDistance += Math.abs(event.dx) + Math.abs(event.dy);
    if (d.esADN) return;
    d.fx = event.x; d.fy = event.y;
  }
  function dragended(event, d){
    if (!event.active) simulation.alphaTarget(ALPHA_VIDA);
    if (d.esADN) return;
    d.fx = null; d.fy = null;
  }

  window.addEventListener('resize', () => {
    width = window.innerWidth; height = window.innerHeight;
    svg.attr('viewBox', [0,0,width,height]);
    adnNode.fx = width/2; adnNode.fy = height/2;
    simulation.force('center', d3.forceCenter(width/2, height/2));
    simulation.alpha(0.3).restart();
    pintarEstrellas();
  });

  // ---------- ADN + tokens (misma logica de siempre, ahora actualiza el grafo) ----------
  (async function checkADN(){
    try{
      const result = await window.storage.get(CLIENTE_ID + ':brand-book.identidad');
      if(result && result.value){
        const data = JSON.parse(result.value);
        const nombre = data.nombre || '';
        if(nombre){
          const marcaLabel = document.getElementById('brand-marca-label');
          if(marcaLabel) marcaLabel.textContent = nombre;
          const adnG = document.querySelector('.graph-node.adn-node');
          if(adnG) adnG.classList.add('connected');
          const lbl = document.getElementById('adn-node-label');
          if(lbl) lbl.textContent = nombre;
          const status = document.getElementById('adn-node-status');
          if(status) status.textContent = 'Conectado';
          const title = document.getElementById('adn-node-title');
          if(title) title.textContent = nombre + ' — Editar ADN';
        }
      }
    }catch(e){}

    try{
      const r = await window.storage.get(CLIENTE_ID + ':uso-tokens-log');
      const items = r && r.value ? JSON.parse(r.value) : [];
      const inputT = items.reduce((s, it) => s + (it.inputTokens || 0), 0);
      const outputT = items.reduce((s, it) => s + (it.outputTokens || 0), 0);
      const total = inputT + outputT;
      document.getElementById('tokens-pill').textContent = total > 0
        ? `🔢 ${total.toLocaleString('es-MX')} tokens (entrada: ${inputT.toLocaleString('es-MX')} · salida: ${outputT.toLocaleString('es-MX')})`
        : '🔢 Todavía no hay uso registrado';
    }catch(e){
      document.getElementById('tokens-pill').textContent = '🔢 No se pudo cargar el uso';
    }
  })();
})();
</script>
</body>
</html>
