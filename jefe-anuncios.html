<!DOCTYPE html>
<html lang="es">
<head>
<script src="/js/hub-tenant.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jefe de Anuncios & Campañas de Paga — JefesHub</title>
<link rel="icon" type="image/png" href="/img/fav/jefe-anuncios.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Piel clara = mismos tokens que Jefe 366 y Jefe de Contenido */
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F3F3F3;
    --line:#E2E2E2;
    --text:#1A1A1A;
    --text-dim:#5F5F5F;
    --accent:#C0F800;
    --accent-soft:#F1FFC2;
    --accent-text:#4E7A00;
    --navy:#10103A;
    --shadow-card:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06);
    --shadow-pop:0 12px 32px rgba(0,0,0,.14);
    --adq:#6366F1;--adq-soft:#EEF0FF;
    --con:#0EA5E9;--con-soft:#E6F4FD;
    --conv:#16A34A;--conv-soft:#E6F8EC;
    --st-idea-bg:#EDEDED;--st-idea-fg:#555;
    --st-proceso-bg:#FFF1D6;--st-proceso-fg:#9A6200;
    --st-publicado-bg:#E3F6E8;--st-publicado-fg:#1F7A3A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;padding:28px 16px 80px;}
  h1,.display{font-family:'Sora',sans-serif;}
  .wrap{max-width:1400px;margin:0 auto;}
  .page-header{text-align:center;padding-top:62px;}
  h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin:0 0 8px;line-height:1.15;}
  /* Barra fija: se queda visible arriba al hacer scroll (pill + nombre del Jefe, mismo h1 de siempre) */
  .topbar{position:fixed;top:0;left:0;right:0;height:70px;z-index:60;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);}
  .topbar h1{justify-self:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:clamp(20px,2.6vw,28px);}
  .back-link{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;color:var(--text-dim);text-decoration:none;padding:7px 16px;border:1px solid var(--line);border-radius:100px;background:var(--surface);transition:.15s;}
  .back-link:hover{border-color:var(--accent);color:var(--accent-text);}
  /* Scrollbar delgada y discreta */
  *{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.22) transparent;}
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:8px;}
  *::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.36);}

  /* HERO: logo + frase en pastilla */
  .hero-logo{display:block;margin:0 auto 14px;}
  .hero-logo img{width:150px;height:auto;max-width:60%;object-fit:contain;display:block;margin:0 auto;}
  /* Al abrir (sin pestaña elegida) el bloque logo + chat + botones queda centrado en la pantalla */
  .wrap.modo-inicio .page-header{padding-top:max(40px,11vh);}

  /* TABS en pastilla -- sticky: se quedan fijas arriba al deslizar */
  .tabs{display:flex;justify-content:center;gap:14px;margin:0 0 22px;flex-wrap:wrap;position:sticky;top:70px;z-index:40;background:var(--bg);padding:12px 0;}
  .tab{padding:13px 28px;cursor:pointer;font-size:16px;font-weight:800;color:#333;background:var(--surface-2);border-radius:100px;user-select:none;font-family:'Sora',sans-serif;text-transform:uppercase;letter-spacing:.02em;transition:.15s;}
  .tab:hover{background:#E8E8E8;}
  .tab.active{color:#1A1A1A;background:var(--accent);}
  .tab .count{display:inline-block;margin-left:8px;background:rgba(0,0,0,.1);color:#1A1A1A;border-radius:12px;padding:1px 9px;font-size:13px;font-family:'Inter',sans-serif;font-weight:700;}

  /* PASTILLAS DE PRODUCTO */
  .prod-pills{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:0 0 22px;}
  .prod-pill{padding:12px 26px;border-radius:100px;border:none;font-family:'Sora',sans-serif;font-weight:800;font-size:15.5px;cursor:pointer;background:var(--navy);color:#fff;transition:.15s;max-width:100%;}
  .prod-pill:hover{filter:brightness(1.25);}
  .prod-pill.active{background:var(--accent);color:#1A1A1A;}

  /* BUTTONS / FIELDS (compartido con Jefe Contenido) */
  .btn{font-family:'Inter',sans-serif;font-weight:700;font-size:15px;padding:12px 20px;border-radius:12px;cursor:pointer;border:none;transition:.15s;}
  .btn-solid{background:var(--accent);color:#1A1A1A;}
  .btn-solid:hover{filter:brightness(.95);}
  .btn:disabled{opacity:.5;cursor:wait;}
  .btn-outline{font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;padding:10px 16px;border-radius:12px;cursor:pointer;border:1px solid #CFCFCF;background:var(--surface);color:#333;transition:.15s;}
  .btn-outline:hover{border-color:var(--accent-text);color:var(--accent-text);}
  .btn-outline:disabled{opacity:.4;cursor:wait;}
  .btn-guion{border:none;background:transparent;color:var(--accent-text);font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;padding:2px 0;text-decoration:none;}
  .btn-guion:hover{text-decoration:underline;}
  .mode-field{display:flex;flex-direction:column;gap:6px;}
  .mode-field label{font-size:14px;color:var(--text-dim);font-weight:600;font-family:'Inter',sans-serif;}
  .mode-field select,.mode-field input[type=text],.mode-field textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-family:'Inter',sans-serif;font-size:16px;padding:11px 14px;outline:none;}
  .mode-field select:focus,.mode-field input[type=text]:focus,.mode-field textarea:focus{border-color:var(--accent-text);background:#fff;}
  .mode-field input[type=text]::placeholder,.mode-field textarea::placeholder{color:var(--text-dim);opacity:.7;}
  .mode-status{font-size:14.5px;font-family:'Inter',sans-serif;color:var(--text-dim);}
  .mode-status.error{color:#C62828;}

  /* GENERADOR: toolbar + selección */
  .anuncios-toolbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 24px;margin-bottom:16px;box-shadow:var(--shadow-card);}
  /* Siguiente paso: barra lima que solo aparece cuando hay ideas marcadas. */
  .anuncios-selection-bar{display:none;align-items:center;gap:16px;flex-wrap:wrap;background:var(--accent);border-radius:24px;padding:16px 26px;margin-bottom:20px;box-shadow:var(--shadow-card);color:#1A1A1A;}
  .anuncios-selection-bar.visible{display:flex;animation:selBarIn .25s ease-out;}
  @keyframes selBarIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .anuncios-selection-bar .mode-status{color:#1A1A1A;font-weight:700;font-size:16px;}
  .anuncios-selection-bar .mode-field label{color:#1A1A1A;}
  .anuncios-selection-bar select{background:#fff;}
  .anuncios-selection-bar #anuncios-detalle-btn{background:#4B4B4B;color:var(--accent);border:none;border-radius:100px;font-family:'Sora',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.02em;padding:12px 24px;}
  .anuncios-selection-bar #anuncios-detalle-btn:hover{filter:brightness(1.2);}

  /* VER ÁNGULOS (caja colapsable de solo lectura, mismos datos que en Jefe 366) */
  .mini-details{width:100%;margin-top:6px;border-top:1px solid var(--line);padding-top:14px;}
  .mini-details summary{cursor:pointer;font-family:'Inter',sans-serif;font-weight:700;font-size:14.5px;color:var(--accent-text);list-style:none;}
  .mini-details summary::-webkit-details-marker{display:none;}
  .mini-details summary::before{content:'▶ ';font-size:11px;}
  .mini-details[open] summary::before{content:'▼ ';}
  .mini-details .anuncios-table-wrap{margin-top:12px;}

  /* CAJAS POR ETAPA + TABLA EDITABLE */
  .etapa-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-card);}
  .etapa-box.adquisicion{border-left:5px solid var(--adq);}
  .etapa-box.consideracion{border-left:5px solid var(--con);}
  .etapa-box.conversion{border-left:5px solid var(--conv);}
  .etapa-title{font-family:'Sora',sans-serif;font-weight:800;font-size:21px;margin:0 0 6px;}
  .etapa-desc{color:var(--text-dim);font-size:15px;margin:0 0 14px;line-height:1.5;}
  .anuncios-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;}
  table.anuncios-table{width:100%;border-collapse:collapse;min-width:640px;}
  table.anuncios-table th{text-align:left;font-size:13.5px;font-weight:700;color:var(--text-dim);font-family:'Inter',sans-serif;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);}
  table.anuncios-table td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px;}
  table.anuncios-table tr:last-child td{border-bottom:none;}
  table.anuncios-table input[type=checkbox]{width:20px;height:20px;accent-color:#4E7A00;margin-top:12px;}
  table.anuncios-table textarea{width:100%;min-height:48px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--text);padding:8px 10px;font-family:Inter,sans-serif;font-size:15px;line-height:1.45;outline:none;resize:vertical;}
  table.anuncios-table textarea:hover{border-color:var(--line);}
  table.anuncios-table textarea:focus{border-color:var(--accent-text);background:#fff;}
  .anuncios-row-del{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;padding:6px 10px;}
  .anuncios-row-del:hover{color:#D32F2F;}
  .anuncios-row-add{background:transparent;border:1px dashed #BDBDBD;color:var(--text-dim);font-family:Inter,sans-serif;font-weight:600;font-size:14px;padding:9px 16px;border-radius:12px;cursor:pointer;}
  .anuncios-row-add:hover{border-color:var(--accent-text);color:var(--accent-text);}
  .gen-badge{display:inline-block;font-size:12px;font-family:'Inter',sans-serif;font-weight:700;color:var(--accent-text);background:var(--accent-soft);border-radius:100px;padding:2px 9px;margin-left:6px;white-space:nowrap;}

  /* CARDS (calcado de item-card de Jefe Contenido) */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:18px;align-items:start;}
  .cards-grid .item-card:has(details[open]){grid-column:1/-1;}
  .estado-seccion{margin-bottom:28px;}
  .estado-seccion-title{display:flex;align-items:center;gap:10px;font-family:'Sora',sans-serif;font-weight:800;font-size:18px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 16px;padding:14px 22px;border-radius:16px;background:var(--st-idea-bg);color:var(--st-idea-fg);}
  .estado-seccion-title.proceso{background:var(--st-proceso-bg);color:var(--st-proceso-fg);}
  .estado-seccion-title.publicado{background:var(--st-publicado-bg);color:var(--st-publicado-fg);}
  .estado-seccion-title .estado-count{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;opacity:.75;}
  .item-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .item-card textarea.gancho-input{font-size:18px;}

  /* TABLERO SEMANAL + EDITOR (formato Jefe de Contenido) */
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow-card);transition:transform .12s,box-shadow .12s;outline:none;}
  .pcard:hover,.pcard:focus-visible{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.12);}
  .pthumb{position:relative;height:104px;background:linear-gradient(135deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;}
  .pthumb-ico{font-size:34px;opacity:.85;}
  .pthumb-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .pthumb .pchip,.pthumb .pthumb-etapa{z-index:1;}
  .pchip{position:absolute;top:10px;left:10px;background:#fff;border-radius:100px;padding:3px 11px;font-size:12.5px;font-weight:700;color:#1A1A1A;text-transform:capitalize;}
  .pthumb-etapa{position:absolute;bottom:10px;left:10px;}
  .pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;}
  .ptitle{font-family:'Sora',sans-serif;font-weight:800;font-size:15.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
  .pnets{display:flex;flex-wrap:wrap;gap:5px;}
  .pnet{font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--text-dim);border-radius:100px;padding:2px 9px;}
  .pprod{background:var(--accent-soft);color:var(--accent-text);}
  .pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .ppill{font-size:12.5px;font-weight:700;border-radius:100px;padding:4px 12px;}
  .ppill.idea{background:var(--st-idea-bg);color:var(--st-idea-fg);}
  .ppill.proceso{background:var(--st-proceso-bg);color:var(--st-proceso-fg);}
  .ppill.publicado{background:var(--st-publicado-bg);color:var(--st-publicado-fg);}
  .phora{font-size:12.5px;color:var(--text-dim);font-weight:600;}
  body.pm-abierto{overflow:hidden;}
  .pm-overlay{position:fixed;inset:0;background:rgba(16,16,58,.45);z-index:2000;display:flex;align-items:center;justify-content:center;padding:18px;}
  .pm-dialog{background:#fff;border-radius:26px;width:min(1100px,100%);max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);}
  .pm-head{display:flex;align-items:flex-start;gap:10px;padding:22px 26px 14px;}
  .pm-head-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
  .pm-titulo{font-size:26px !important;}
  .pm-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .pm-icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px;color:var(--text-dim);flex-shrink:0;}
  .pm-icon-btn:hover{border-color:var(--accent-text);color:var(--text);}
  .pm-bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 26px;background:#F0F0F0;font-weight:600;color:var(--text-dim);}
  .pm-bar label{display:flex;align-items:center;gap:10px;font-size:15px;}
  .pm-bar .fecha-input{width:auto;background:#fff;}
  .pm-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0;flex:1;overflow:hidden;}
  .pm-form{overflow-y:auto;padding:20px 26px;display:flex;flex-direction:column;gap:20px;min-width:0;}
  .pm-label{font-weight:800;font-size:16px;margin-bottom:10px;}
  .pm-pills{display:flex;flex-wrap:wrap;gap:10px;}
  .pm-pill{border:1.5px solid var(--line);background:#fff;border-radius:100px;padding:10px 20px;font-family:'Inter',sans-serif;font-weight:700;font-size:15.5px;color:var(--text);cursor:pointer;transition:.12s;}
  .pm-pill:hover{border-color:#999;}
  .pm-pill.on{background:#10101A;color:var(--accent);border-color:#10101A;}
  .pm-side{background:#F7F7F7;border-left:1px solid var(--line);padding:20px 18px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .pm-nets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .pm-nets span{font-size:12px;font-weight:700;background:#EAEAEA;color:var(--text-dim);border-radius:100px;padding:4px 11px;}
  .pm-phone{width:210px;background:#10101A;border-radius:34px;padding:8px;}
  .pm-screen{position:relative;height:340px;border-radius:27px;overflow:hidden;background:linear-gradient(160deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;}
  .pm-ico{font-size:44px;opacity:.7;}
  .pm-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;background:#000;}
  .pm-screen > .pchip{z-index:2;}
  .pm-caption{z-index:1;}
  .pm-caption-fuera{width:210px;font-size:12.5px;line-height:1.35;color:var(--text);text-align:left;}
  .pm-caption-fuera p{margin:3px 0 0;overflow-wrap:anywhere;color:var(--text-dim);}
  .pm-hint a{color:var(--accent-text);font-weight:700;}
  .pm-caption{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:12.5px;line-height:1.35;}
  .pm-caption p{margin:4px 0 0;overflow-wrap:anywhere;}
  .pm-meta{font-size:13.5px;color:var(--text-dim);}
  .pm-hint{font-size:13px;color:var(--text-dim);text-align:center;margin:0;line-height:1.4;}
  .pm-piezas{display:flex;flex-direction:column;gap:14px;padding:16px;border:1.5px dashed #CDE98A;border-radius:18px;background:#FBFFEA;}
  .pm-hint-inline{font-weight:500;font-size:13px;color:var(--text-dim);}
  .pm-pieza-btns{display:flex;flex-wrap:wrap;gap:10px;}
  .pm-pieza-btn{border:none;background:var(--accent);color:#1A1A1A;border-radius:100px;padding:10px 18px;font-family:'Inter',sans-serif;font-weight:700;font-size:15px;cursor:pointer;transition:.12s;}
  .pm-pieza-btn.hecho{background:#fff;border:1.5px solid var(--line);}
  .pm-pieza-btn:hover:not(:disabled){filter:brightness(.95);}
  .pm-pieza-btn:disabled,[data-pieza-crear]:disabled{opacity:.55;cursor:wait;}
  .pm-pieza-ask{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
  .pm-pieza-ask[hidden]{display:none;}
  .pm-hint-txt{font-size:13.5px;color:var(--text-dim);}
  .pm-ask-texto{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-family:'Inter',sans-serif;font-size:15px;resize:vertical;outline:none;}
  .pm-ask-fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .pm-pieza-campos{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .pm-pieza-cab{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;cursor:pointer;text-align:left;padding:13px 16px;font-family:'Inter',sans-serif;}
  .pm-pieza-cab:hover{background:#FAFFE0;}
  .pm-pieza-titulo{font-family:'Sora',sans-serif;font-weight:800;font-size:15px;white-space:nowrap;}
  .pm-pieza-resumen{flex:1;min-width:0;font-size:13.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pm-pieza-campos.abierto .pm-pieza-resumen{display:none;}
  .pm-pieza-campos.abierto .pm-pieza-titulo{flex:1;}
  .pm-pieza-chev{transition:transform .15s;color:var(--text-dim);}
  .pm-pieza-campos.abierto .pm-pieza-chev{transform:rotate(180deg);}
  .pm-pieza-cuerpo{display:none;flex-direction:column;gap:12px;padding:4px 16px 16px;}
  .pm-pieza-campos.abierto .pm-pieza-cuerpo{display:flex;}
  .pm-gemini{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .pm-copiar-gemini{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#1A1A1A;border:none;border-radius:100px;padding:12px 22px;cursor:pointer;font-family:'Sora',sans-serif;font-weight:800;font-size:15.5px;transition:.12s;}
  .pm-copiar-gemini span{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;opacity:.75;}
  .pm-copiar-gemini:hover{filter:brightness(.95);transform:translateY(-1px);}
  .pm-abrir-gemini{font-size:14px;font-weight:700;color:var(--accent-text);text-decoration:none;}
  .pm-abrir-gemini:hover{text-decoration:underline;}
  .pm-logo-tip{flex:1 1 100%;font-size:13.5px;line-height:1.45;color:var(--text-dim);background:#FFF8D6;border-radius:12px;padding:9px 12px;}
  .pm-links{display:flex;flex-direction:column;gap:10px;}
  .pm-links-t{font-family:'Inter',sans-serif;font-weight:700;font-size:14.5px;color:#1F5FA8;}
  .pm-lk-lista{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .pm-lk{display:inline-flex;align-items:center;gap:2px;background:#EEF5FD;border:1px solid #BBD7F2;border-radius:100px;padding:3px 4px 3px 4px;max-width:100%;}
  .pm-lk.on{background:#DCEBFA;border-color:#1F5FA8;box-shadow:0 0 0 3px rgba(31,95,168,.12);}
  .pm-lk-main{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#1F5FA8;font-family:'Inter',sans-serif;font-weight:700;font-size:14.5px;padding:3px 8px 3px 4px;min-width:0;}
  .pm-lk-ico{width:28px;height:28px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .pm-lk-nom{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pm-lk-go{font-size:12px;opacity:.7;}
  .pm-lk-btn{border:none;background:transparent;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:13px;color:#1F5FA8;opacity:.75;}
  .pm-lk-btn:hover{background:#fff;opacity:1;}
  .pm-lk-add{border:1.5px dashed #9DBFE3;background:transparent;color:#1F5FA8;border-radius:100px;padding:8px 16px;font-family:'Inter',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}
  .pm-lk-add:hover{background:#EEF5FD;}
  .pm-lk-editor{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px;border:1px solid #BBD7F2;border-radius:16px;background:#fff;}
  .pm-lk-editor input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:'Inter',sans-serif;font-size:15px;outline:none;color:var(--text);min-width:0;}
  .pm-link-nombre{font-weight:700;}
  .pm-link-url{color:#1F5FA8 !important;}
  .pm-lk-editor input:focus{border-color:#1F5FA8;background:#fff;}
  .pm-lk-editor-btns{display:flex;align-items:center;gap:10px;}
  .pm-lk-quitar{border:none;background:none;color:var(--text-dim);font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:underline;}
  .pm-lk-quitar:hover{color:#D32F2F;}
  .pm-linkchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .pm-linkchips:empty{display:none;}
  .pm-linkchip{border:1px solid var(--line);background:#fff;border-radius:100px;padding:4px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text-dim);}
  .pm-linkchip.on{background:#10101A;color:var(--accent);border-color:#10101A;}
  @media (max-width:600px){.pm-lk-editor{grid-template-columns:1fr;}}
  .pm-foot{display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:14px 26px;border-top:1px solid var(--line);}
  .pm-cancel{background:none;border:none;font-family:'Inter',sans-serif;font-weight:700;font-size:16px;cursor:pointer;color:var(--text);padding:10px 14px;}
  @media (max-width:820px){.pm-body{grid-template-columns:1fr;overflow-y:auto;}.pm-form{overflow:visible;}.pm-side{border-left:none;border-top:1px solid var(--line);}.pm-dialog{max-height:98vh;}}
  .empty-row{padding:22px;text-align:center;color:var(--text-dim);font-size:15.5px;background:var(--surface);border:1px dashed #C9C9C9;border-radius:16px;}
  .item-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--horizon,var(--adq));border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-card);transition:transform .12s,box-shadow .12s;}
  .item-card.dragging{opacity:.4;}
  .item-card.drag-over{border-color:var(--accent-text);box-shadow:0 0 0 3px var(--accent-soft);}
  .item-top{display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .item-top-right{display:flex;align-items:center;gap:6px;}
  .drag-handle{cursor:grab;color:#A0A0A0;font-size:18px;line-height:1;user-select:none;flex-shrink:0;}
  .drag-handle:active{cursor:grabbing;}
  .item-del{border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:16px;padding:5px 8px;border-radius:8px;opacity:.6;transition:.15s;}
  .item-del:hover{color:#D32F2F;opacity:1;background:rgba(211,47,47,.1);}
  select.estado-select{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;padding:7px 14px;border-radius:100px;border:1px solid transparent;cursor:pointer;}
  select.estado-select.idea{background:var(--st-idea-bg);color:var(--st-idea-fg);}
  select.estado-select.proceso{background:var(--st-proceso-bg);color:var(--st-proceso-fg);}
  select.estado-select.publicado{background:var(--st-publicado-bg);color:var(--st-publicado-fg);}
  .fecha-input{width:140px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:6px 10px;outline:none;color-scheme:light;}
  .fecha-input:focus{border-color:var(--accent-text);}
  textarea.gancho-input{width:100%;border:none;background:transparent;color:var(--text);font-family:'Sora',sans-serif;font-size:19px;font-weight:800;line-height:1.35;resize:none;padding:0;outline:none;min-height:28px;}
  .badges-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-family:'Inter',sans-serif;font-weight:700;padding:4px 11px;border-radius:100px;border:1px solid transparent;}
  .badge-adquisicion{background:var(--adq-soft);color:#4338CA;border-color:#D5D8FB;}
  .badge-consideracion{background:var(--con-soft);color:#0369A1;border-color:#C2E4F7;}
  .badge-conversion{background:var(--conv-soft);color:#15803D;border-color:#C3EBD0;}
  .badge-tipo{background:var(--surface-2);color:var(--text-dim);border-color:var(--line);}
  .item-details{border-top:1px solid var(--line);padding-top:10px;}
  .item-details summary{cursor:pointer;font-size:15px;font-weight:700;color:var(--accent-text);font-family:'Inter',sans-serif;list-style:none;display:flex;align-items:center;justify-content:space-between;}
  .item-details summary::-webkit-details-marker{display:none;}
  .detail-grid{display:flex;flex-direction:column;gap:14px;margin-top:12px;}
  .detail-field{display:flex;flex-direction:column;gap:2px;}
  .detail-field-head{display:flex;align-items:center;justify-content:space-between;}
  .detail-field label{display:block;font-size:14px;color:var(--text-dim);font-weight:600;font-family:'Inter',sans-serif;margin-bottom:5px;}
  .detail-field textarea,.detail-field input[type=text],.detail-field select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-family:'Inter',sans-serif;font-size:15.5px;padding:10px 12px;resize:vertical;outline:none;line-height:1.5;}
  .detail-field textarea:focus,.detail-field input[type=text]:focus,.detail-field select:focus{border-color:var(--accent-text);background:#fff;}
  .detail-field input[type=text]::placeholder,.detail-field textarea::placeholder{color:var(--text-dim);opacity:.7;}
  .meta-fields-box{background:#FAFAFA;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .meta-fields-title{margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:var(--text);}
  .meta-fields-box .detail-field textarea,.meta-fields-box .detail-field input[type=text],.meta-fields-box .detail-field select{background:#fff;}
  .retro-field textarea{background:var(--accent-soft);border-color:#CDE98A;min-height:48px;}
  .retro-field label{color:var(--accent-text);}
  .link-field .link-input{color:#1F5FA8;border-color:#BBD7F2;}
  .link-field label{color:#1F5FA8;}
  .carpeta-box{background:var(--surface);border:1px solid #BBD7F2;border-radius:16px;padding:16px 20px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-card);}
  .carpeta-box label{font-size:14px;color:#1F5FA8;font-weight:700;font-family:'Inter',sans-serif;}
  .carpeta-box input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:#1F5FA8;font-family:'Inter',sans-serif;font-size:15.5px;padding:11px 14px;outline:none;}
  .carpeta-box input[type=text]:focus{border-color:#1F5FA8;background:#fff;}
  .carpeta-box input[type=text]::placeholder{color:var(--text-dim);opacity:.7;}
  .carpeta-box-collapsed{cursor:pointer;padding:12px 20px;}
  .carpeta-box-collapsed .carpeta-collapsed-hint{font-size:13px;color:var(--text-dim);opacity:.8;}
  .carpeta-box-collapsed:hover{border-color:#1F5FA8;}

  /* CONSULTA CON EL JEFE: pastilla grande tipo Jefe de Contenido (clip + texto + enviar) */
  .chat-hero{display:flex;flex-direction:column;align-items:stretch;margin:0 auto 24px;max-width:900px;}
  .hero-search{display:flex;align-items:center;gap:12px;width:100%;margin:0 auto 10px;padding:8px 10px 8px 18px;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:34px;box-shadow:0 8px 30px rgba(0,0,0,.10);transition:border-color .18s,box-shadow .18s;text-align:left;}
  .hero-search:focus-within{border-color:var(--accent);box-shadow:0 8px 30px rgba(0,0,0,.10),0 0 0 4px rgba(192,248,0,.28);}
  .hero-attach{flex:0 0 auto;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;border-radius:50%;transition:.15s;}
  .hero-attach:hover{color:var(--accent-text);background:var(--accent-soft);}
  .hero-attach svg{width:23px;height:23px;}
  .hero-search-sep{flex:0 0 1px;align-self:stretch;margin:12px 0;background:var(--line);}
  .hero-search textarea{flex:1 1 auto;min-width:0;background:transparent;border:none;outline:none;resize:none;color:var(--text);font-family:'Inter',sans-serif;font-size:17.5px;line-height:1.45;padding:11px 0;max-height:260px;}
  .hero-search textarea::placeholder{color:var(--text-dim);opacity:.85;}
  .hero-search-send{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#1A1A1A;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
  .hero-search-send img{width:28px;height:28px;object-fit:contain;display:block;}
  .hero-search-send:hover{transform:scale(1.08);}
  .hero-search-send:disabled{opacity:.5;cursor:wait;}
  .hero-meta{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;min-height:22px;margin-bottom:6px;}
  .link-btn{background:none;border:none;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:underline;padding:2px 4px;}
  .link-btn:hover{color:var(--accent-text);}

  /* Adjuntar imagen en el chat */
  .chat-adjunto-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:4px;}
  .chat-adjunto-hint{font-size:14px;color:var(--text-dim);}
  .chat-adjunto-preview{display:none;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:100px;padding:5px 12px 5px 6px;font-size:14px;color:var(--text-dim);}
  .chat-adjunto-preview img{width:34px;height:34px;object-fit:cover;border-radius:50%;}
  .chat-adjunto-preview button{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;}
  .chat-adjunto-preview button:hover{color:#D32F2F;}
  .chat-msg-imagen-tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text-dim);margin-bottom:4px;}

  /* CHAT -- hilo de conversación */
  .chat-thread{display:flex;flex-direction:column;gap:12px;max-height:520px;overflow-y:auto;margin-top:6px;}
  .chat-thread:empty{display:none;}
  .chat-msg{border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.65;white-space:pre-wrap;font-family:'Inter',sans-serif;max-width:92%;}
  .chat-msg-user{background:var(--accent-soft);border:1px solid #CDE98A;color:var(--text);align-self:flex-end;}
  .chat-msg-assistant{background:var(--surface-2);border:1px solid var(--line);color:var(--text);align-self:flex-start;}
  .chat-msg-actions{display:flex;gap:16px;margin-top:10px;}
  .chat-msg-actions button{border:none;background:transparent;color:var(--accent-text);font-size:14px;font-family:'Inter',sans-serif;cursor:pointer;padding:0;font-weight:700;}
  .chat-msg-actions button:hover{text-decoration:underline;}
  .chat-msg-actions button.done{color:#15803D;pointer-events:none;}
  .chat-empty{color:var(--text-dim);font-size:15px;}

  /* ESTRUCTURA DE ADS: Campaña > Conjunto de Anuncios > (nota + link a Anuncios) */
  .campana-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:20px;padding:22px 24px;margin-bottom:18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-card);}
  .campana-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  /* Títulos en pastilla oscura con texto lima (Campaña / Conjunto / Anuncios) */
  .pill-title{display:inline-block;background:#4B4B4B;color:var(--accent);font-family:'Sora',sans-serif;font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.02em;padding:9px 22px;border-radius:100px;}
  .pill-title-sm{align-self:flex-start;font-size:16px;padding:7px 20px;}
  .campana-top-actions{display:flex;align-items:center;gap:10px;}
  .btn-sm{padding:9px 16px;font-size:14px;border-radius:100px;}
  .btn-pill{border-radius:100px;padding:12px 24px;font-family:'Sora',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.02em;}
  .btn-pill-gray{border:none;background:#E3E3E3;color:#333;border-radius:100px;padding:12px 24px;font-family:'Sora',sans-serif;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;transition:.15s;}
  .btn-pill-gray:hover{background:#D5D5D5;}
  .anuncios-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px;}
  .campana-fields-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .campana-fields-grid input[type=date]{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-family:'Inter',sans-serif;font-size:16px;padding:10px 12px;outline:none;color-scheme:light;width:100%;}

  /* CAMPAÑA GUARDADA: panel lima con el resumen */
  .campana-resumen{background:var(--accent);border-radius:28px;padding:22px 26px;margin-bottom:18px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow-card);color:#1A1A1A;}
  .res-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .campana-resumen.nueva{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);}
  .campana-resumen.nueva .res-pill-white{background:#4B4B4B;color:var(--accent);}
  .campana-resumen.nueva .res-btn-white{background:var(--accent);color:#1A1A1A;}
  .estructura-barra{display:flex;justify-content:flex-end;margin-bottom:12px;}
  .res-colapsar{border:none;cursor:pointer;text-align:left;}
  .res-colapsar:hover{filter:brightness(.96);}
  .res-colapsar .res-chev{margin-left:6px;}
  .campana-resumen.colapsada{padding-top:14px;padding-bottom:14px;gap:0;}
  .campana-resumen.colapsada .res-body,.campana-resumen.colapsada .res-pane{display:none !important;}
  .campana-resumen.colapsada .res-colapsar .res-chev{transform:rotate(-90deg);}
  .res-pill-white{background:#fff;color:#1A1A1A;font-family:'Sora',sans-serif;font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.02em;padding:10px 24px;border-radius:100px;}
  .res-btn{border:none;background:#4B4B4B;color:var(--accent);font-family:'Sora',sans-serif;font-weight:800;font-size:14.5px;text-transform:uppercase;letter-spacing:.02em;padding:10px 20px;border-radius:100px;cursor:pointer;transition:.15s;}
  .res-btn:hover{filter:brightness(1.2);}
  .res-btn-white{background:#fff;color:#1A1A1A;}
  .res-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start;}
  .res-info{display:flex;flex-direction:column;gap:16px;}
  .res-fecha{font-family:'Sora',sans-serif;font-weight:800;font-size:17px;text-transform:uppercase;}
  .res-fecha span{font-family:'Inter',sans-serif;font-weight:600;text-transform:none;}
  .res-pills{display:flex;flex-wrap:wrap;gap:12px;}
  .res-pill-dark.on .res-chev{transform:rotate(180deg);}
  .res-fecha{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .res-fecha-input{background:#fff;border:none;border-radius:100px;color:#1A1A1A;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;padding:8px 16px;outline:none;color-scheme:light;}
  .res-pane{display:none;background:#fff;border-radius:20px;padding:18px 20px;color:var(--text);flex-direction:column;gap:14px;}
  .res-pane.abierto{display:flex;}
  .res-pill-dark{border:none;cursor:pointer;text-align:left;transition:.15s;background:#4B4B4B;color:var(--accent);font-family:'Sora',sans-serif;font-weight:800;font-size:15.5px;text-transform:uppercase;letter-spacing:.02em;padding:9px 20px;border-radius:100px;}
  .res-pill-dark:hover{filter:brightness(1.2);}
  .res-chev{display:inline-block;transition:transform .15s;margin-left:4px;}
  .res-dato{display:flex;flex-direction:column;margin-bottom:8px;}
  .res-dato span{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#3C5E00;}
  .res-conjunto{padding-bottom:6px;margin-bottom:10px;border-bottom:1px dashed rgba(0,0,0,.2);}
  .res-conjunto:last-child{border-bottom:none;margin-bottom:0;}
  .res-conjunto-t{font-family:'Sora',sans-serif;font-weight:800;text-transform:uppercase;margin-bottom:6px;}
  .res-spec{margin-bottom:6px;}
  .res-spec,.res-anuncio,.res-pill-dark,.res-pill-white{overflow-wrap:anywhere;min-width:0;max-width:100%;}
  .res-anuncio{flex-wrap:wrap;}
  .campana-resumen{max-width:100%;overflow:hidden;}
  .res-anuncios{background:#FAFFE0;border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto;}
  .res-anuncio{display:flex;align-items:center;gap:10px;font-size:15.5px;padding:5px 0;}
  .res-check{color:#4E7A00;font-weight:800;flex-shrink:0;}
  .res-vacio{color:var(--text-dim);}
  @media (max-width:900px){.res-body{grid-template-columns:1fr;}}
  .campana-fields-grid .mode-field input,.campana-fields-grid .mode-field select{width:100%;}
  .conjuntos-wrap{display:flex;flex-direction:column;gap:14px;margin-top:4px;padding-top:14px;border-top:1px dashed #CFCFCF;}
  .conjuntos-title{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;color:var(--text);}
  .conjunto-card{background:#FAFAFA;border:1px solid var(--line);border-left:4px solid var(--con);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
  .conjunto-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .conjunto-fields-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .conjunto-fields-grid .mode-field input,.conjunto-fields-grid .mode-field textarea{width:100%;}
  .conjunto-fields-grid .mode-field textarea{min-height:44px;resize:vertical;font-family:'Inter',sans-serif;}
  .anuncios-nota-box{background:var(--accent-soft);border:1px dashed #A8CC3A;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .anuncios-nota-box p{margin:0;font-size:14.5px;color:#444;line-height:1.5;}
  .anuncios-nota-box p b{color:var(--accent-text);}
  .hack-final-box{background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:22px 26px;margin-top:24px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-card);}
  .hack-final-title{font-family:'Sora',sans-serif;font-weight:800;font-size:19px;color:var(--text);margin:0;}
  .hack-final-box p{margin:0;font-size:16px;color:var(--text);line-height:1.6;}
  .anuncios-link-list{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
  .anuncio-link-row{display:flex;align-items:center;gap:10px;font-size:15px;padding:4px 0;cursor:pointer;}
  .anuncio-link-row input{flex-shrink:0;width:18px;height:18px;accent-color:#4E7A00;}
  .anuncio-link-row .badge{flex-shrink:0;}
  .anuncio-link-titulo{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  .anuncio-link-titulo:hover{color:var(--accent-text);text-decoration:underline;}

  /* LINKS ARRIBA: círculos con pastilla "Pega tu link aquí" (igual que Jefe de Contenido) */
  [data-tip]{position:relative;}

  .cx-pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:4px 6px 4px 14px;box-shadow:var(--shadow-card);animation:cxSlide .22s ease both;}

<script>
// ─── CLIENTE ID (detectado por pathname — Vercel no expone ?cliente= al browser) ───
function detectClienteId(){ return window.__hub.slug; }
const CLIENTE_ID = detectClienteId();
const BORRADOR_KEY = CLIENTE_ID + ':anuncios-ideas-borrador';
const CARDS_KEY = CLIENTE_ID + ':agente-anuncios';
const AGENDA_KEY = CLIENTE_ID + ':agenda-eventos';
const ESTRUCTURA_KEY = CLIENTE_ID + ':anuncios-estructura';
const CARPETA_KEY = CLIENTE_ID + ':anuncios-carpeta-link';
const BM_KEY = CLIENTE_ID + ':anuncios-bm-link';

const ETAPAS = [
  { key:'adquisicion', label:'📢 Adquisición', desc:'Para gente que no conoce la marca todavía — hook de scroll-stop, no vende directo.' },
  { key:'consideracion', label:'🔵 Consideración', desc:'Para gente que ya vio la marca pero no decide — resuelve objeciones, muestra el método.' },
  { key:'conversion', label:'🟢 Conversión', desc:'Para gente lista para comprar — oferta directa, urgencia, CTA fuerte.' },
];
const FORMATOS = ['reel', 'imagen estática', 'carrusel'];
// Misma lista fija que api/generar-anuncios.js (CTA_OPTIONS) -- botones reales de Meta Ads Manager.
const CTA_OPTIONS = ['Enviar mensaje', 'Más información', 'Comprar ahora', 'Reservar', 'Solicitar hora', 'Registrarte', 'Contactarnos', 'Llamar ahora', 'Obtener oferta', 'Suscribirse'];
const MAX_CAMPOS_META_POR_LOTE = 12;
const ETAPA_LABEL = {}; ETAPAS.forEach(e=>{ ETAPA_LABEL[e.key]=e.label; });

// ─── ESTRUCTURA DE ADS: taxonomía real de objetivos de Meta Ads (ODAX) ──────
const OBJETIVOS = [
  { key:'reconocimiento', label:'📣 Reconocimiento' },
  { key:'trafico', label:'🚦 Tráfico' },
  { key:'interaccion', label:'💬 Interacción' },
  { key:'leads', label:'🎯 Clientes potenciales' },
  { key:'promocion_app', label:'📱 Promoción de la app' },
  { key:'ventas', label:'💰 Ventas' },
];
const OBJETIVO_TIPO_MAP = {
  reconocimiento: ['Alcance', 'Reconocimiento de marca'],
  trafico: ['Tráfico al sitio web', 'Tráfico a la app', 'Mensajes (WhatsApp/Messenger/Instagram)', 'Llamadas'],
  interaccion: ['Mensajes (WhatsApp/Messenger/Instagram)', 'Interacción con la publicación', 'Seguidores de la página'],
  leads: ['Formulario instantáneo', 'Mensajes (WhatsApp/Messenger/Instagram)', 'Llamadas'],
  promocion_app: ['Instalaciones de la app', 'Eventos dentro de la app'],
  ventas: ['Conversiones en el sitio web', 'Ventas del catálogo', 'Mensajes (WhatsApp/Messenger/Instagram)'],
};
const GENEROS = ['Todos', 'Mujeres', 'Hombres'];

function escHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function autoGrow(el){ el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

// ─── ESTADO ─────────────────────────────────────────────────────────────────
let grupos = [];
let productos = [];
let angulos366 = [];
let comunicaciones366 = []; // las Comunicaciones 366 guardadas (puede haber varias: por grupo o por producto)
let angulosFirma = '';
let grupoId = '';
let productoId = '';
let productoNombre = ''; // producto que venía trabajándose en Jefe 366 (solo en modo guiado)
let productoTexto = '';
let anguloIdx = '';
let cantidadPorEtapa = 3;
let borradorStore = {};
let cards = [];
let draggedCardId = null;
let estructuras = [];
let linkCarpeta = '';
let linkBM = '';
let chatMessages = []; // {role:'user'|'assistant', content, usada?:boolean} -- efímero, no se guarda (mismo patrón que Jefe Contenido)
let chatDraft = '';
let chatStatus = '';
let formatoSel = FORMATOS[0];
let genStatus = '';
let cardsLoaded = false;
let currentTab = ''; // al abrir solo se ve el chat y los 3 botones; el contenido aparece al elegir una pestaña
let filtroProductoGuardadas = ''; // '' = todos; '__sin__' = campañas sin producto; si no, id de producto
// Imagen adjunta al siguiente mensaje de Consulta en vivo -- efímero, no se guarda (se limpia al
// enviar el mensaje o elegir otro archivo).
let chatImagenBase64 = '';
let chatImagenMediaType = 'image/jpeg';
let chatImagenNombre = '';

function grupoKey(){ return grupoId || 'general'; }
function datosActuales(){
  const key = grupoKey();
  if(!borradorStore[key]) borradorStore[key] = {};
  ETAPAS.forEach(e=>{ if(!Array.isArray(borradorStore[key][e.key])) borradorStore[key][e.key]=[]; });
  return borradorStore[key];
}
function mkIdeaId(etapa){ return etapa+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function mkCardId(){ return 'ac'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function mkCampanaId(){ return 'camp'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function mkConjuntoId(){ return 'conj'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function mkCampana(){ return { id:mkCampanaId(), objetivo:'', tipo:'', grupo_id:grupoId||'', producto_id:productoId||'', resultado_esperado:'', fecha_inicio:'', guardada:false, conjuntos:[] }; }
// Presupuesto mínimo recomendado y duración por defecto -- regla fija del negocio, no depende
// del contexto de marca, así que se aplica siempre igual (no se le pide a la IA que la decida).
const PRESUPUESTO_DIARIO_MINIMO = '$100 MXN (mínimo recomendado)';
const DURACION_DEFAULT = 'Indefinido';
function mkConjunto(){ return { id:mkConjuntoId(), ubicacion:'', edad:'', genero:'Todos', intereses:'', presupuesto_diario:PRESUPUESTO_DIARIO_MINIMO, duracion:DURACION_DEFAULT, tipo_contenido:'', anuncios_ids:[] }; }

async function cargarInicial(){
  try{ const r=await window.storage.get(CLIENTE_ID+':grupos-negocio'); grupos = r&&r.value?JSON.parse(r.value):[]; }catch(e){ grupos=[]; }
  try{ const r=await window.storage.get(CLIENTE_ID+':catalogo-productos'); productos = r&&r.value?JSON.parse(r.value):[]; }catch(e){ productos=[]; }
  try{
    // Migración: esta llave vivía bajo el nombre "evergreen-comunicacion" -- si la nueva viene
    // vacía, se cae a la vieja (solo lectura, Jefe 366 es quien migra escribiendo hacia adelante).
    let r=await window.storage.get(CLIENTE_ID+':brand-book.366-comunicacion');
    if(!r || !r.value) r=await window.storage.get(CLIENTE_ID+':brand-book.evergreen-comunicacion');
    const d = r&&r.value?JSON.parse(r.value):{};
    // Jefe 366 guarda {lista:[{nombre, grupo_id, angulos_evergreen:[...]}, ...]} (una Comunicación por pestaña);
    // el formato viejo era un solo objeto plano con angulos_evergreen.
    comunicaciones366 = Array.isArray(d.lista) ? d.lista.filter(Boolean) : (Object.keys(d).length ? [d] : []);
    recalcularAngulos366();
  }catch(e){ comunicaciones366=[]; angulos366=[]; }
  try{ const r=await window.storage.get(BORRADOR_KEY); borradorStore = r&&r.value?JSON.parse(r.value):{}; }catch(e){ borradorStore={}; }
  try{
    const r=await window.storage.get(CARDS_KEY);
    cards = r&&r.value?JSON.parse(r.value):[];
  }catch(e){ cards=[]; }
  if(migrarFechasLegacyCards()){ scheduleCardsSave(); }
  scheduleAgendaSync();
  try{
    const r=await window.storage.get(ESTRUCTURA_KEY);
    estructuras = r&&r.value?JSON.parse(r.value):[];
  }catch(e){ estructuras=[]; }
  try{
    const r=await window.storage.get(CARPETA_KEY);
    linkCarpeta = r&&r.value?JSON.parse(r.value):'';
  }catch(e){ linkCarpeta=''; }
  try{
    const r=await window.storage.get(BM_KEY);
    linkBM = r&&r.value?JSON.parse(r.value):'';
  }catch(e){ linkBM=''; }
  cardsLoaded = true;
  document.getElementById('count-cards').textContent = cards.length;
}

// ─── GUARDADO (debounced, igual patrón que jefe-contenido-v2.html) ────────
let borradorSaveTimer=null;
function scheduleBorradorSave(){ clearTimeout(borradorSaveTimer); borradorSaveTimer=setTimeout(guardarBorrador,600); }
async function guardarBorrador(opts){ try{ await window.storage.set(BORRADOR_KEY, JSON.stringify(borradorStore), opts); }catch(e){} }

let cardsSaveTimer=null, cardsPendingSave=false;
function scheduleCardsSave(){ cardsPendingSave=true; clearTimeout(cardsSaveTimer); cardsSaveTimer=setTimeout(doSaveCards,500); }
async function doSaveCards(opts){
  clearTimeout(cardsSaveTimer); cardsSaveTimer=null; if(!cardsPendingSave) return;
  try{ await window.storage.set(CARDS_KEY, JSON.stringify(cards), opts); cardsPendingSave=false; scheduleAgendaSync(); }catch(e){}
}

// Migra fecha "dd/mm" (sin año, formato viejo) a ISO "YYYY-MM-DD" asumiendo
// el año actual — el usuario corrige a mano con el picker si el año no aplica.
function migrarFechasLegacyCards(){
  let cambio=false;
  const anio=new Date().getFullYear();
  cards.forEach(item=>{
    const m=(item.fecha||'').trim().match(/^(\d{1,2})\/(\d{1,2})$/);
    if(!m) return;
    const day=parseInt(m[1],10), month=parseInt(m[2],10);
    if(month<1||month>12||day<1||day>31) return;
    item.fecha=anio+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    cambio=true;
  });
  return cambio;
}

// ─── SYNC CON EL JEFE DE AGENDA ─────────────────────────────────────────────
// Espeja las campañas con fecha al calendario cruzado de Jefes
// ({cliente}:agenda-eventos), sin tocar los eventos de otros Jefes (ej.
// Contenido) ni las temporadas creadas manualmente en la Agenda.
let agendaSyncTimer=null, agendaSyncPending=false;
function scheduleAgendaSync(){ agendaSyncPending=true; clearTimeout(agendaSyncTimer); agendaSyncTimer=setTimeout(syncAgendaEventos,1500); }
async function syncAgendaEventos(opts){
  clearTimeout(agendaSyncTimer); agendaSyncTimer=null; if(!agendaSyncPending) return;
  try{
    const result=await window.storage.get(AGENDA_KEY);
    const data=(result&&result.value)?JSON.parse(result.value):{eventos:[],temporadas:[]};
    const otros=(data.eventos||[]).filter(e=>e.origen!=='anuncios');
    const propios=[];
    cards.forEach(item=>{
      if(!/^\d{4}-\d{2}-\d{2}$/.test(item.fecha||'')) return;
      propios.push({
        id:'anuncios-'+item.id,
        origen:'anuncios', origenId:item.id,
        fecha:item.fecha, titulo:item.titulo||item.hook||'(sin título)', estado:item.estado||'idea',
      });
    });
    data.eventos=[...otros, ...propios];
    await window.storage.set(AGENDA_KEY, JSON.stringify(data), opts);
    agendaSyncPending=false;
  }catch(e){}
}
let estructuraSaveTimer=null;
function scheduleEstructuraSave(){ clearTimeout(estructuraSaveTimer); estructuraSaveTimer=setTimeout(guardarEstructura,600); }
async function guardarEstructura(opts){ try{ await window.storage.set(ESTRUCTURA_KEY, JSON.stringify(estructuras), opts); }catch(e){} }

let carpetaSaveTimer=null;
function scheduleCarpetaSave(){ clearTimeout(carpetaSaveTimer); carpetaSaveTimer=setTimeout(guardarCarpeta,600); }
async function guardarCarpeta(opts){ try{ await window.storage.set(CARPETA_KEY, JSON.stringify(linkCarpeta), opts); }catch(e){} }

let bmSaveTimer=null;
function scheduleBMSave(){ clearTimeout(bmSaveTimer); bmSaveTimer=setTimeout(guardarBM,600); }
async function guardarBM(opts){ try{ await window.storage.set(BM_KEY, JSON.stringify(linkBM), opts); }catch(e){} }

document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ if(cardsPendingSave) doSaveCards({keepalive:true}); guardarBorrador({keepalive:true}); guardarEstructura({keepalive:true}); guardarCarpeta({keepalive:true}); guardarBM({keepalive:true}); if(agendaSyncPending) syncAgendaEventos({keepalive:true}); } });
window.addEventListener('pagehide',()=>{ if(cardsPendingSave) doSaveCards({keepalive:true}); guardarBorrador({keepalive:true}); guardarEstructura({keepalive:true}); guardarCarpeta({keepalive:true}); guardarBM({keepalive:true}); if(agendaSyncPending) syncAgendaEventos({keepalive:true}); });

// ─── TABS ─────────────────────────────────────────────────────────────────
function render(){
  const contentEl = document.getElementById('content');
  contentEl.innerHTML='';
  document.querySelector('.wrap').classList.toggle('modo-inicio', !currentTab);
  const chatHost = document.getElementById('chat-host');
  chatHost.innerHTML='';
  renderChat(chatHost);
  if(currentTab==='generador') renderGenerador(contentEl);
  else if(currentTab==='estructura') renderEstructura(contentEl);
  else if(currentTab==='guardadas') renderGuardadas(contentEl);
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    // Segundo clic en la pestaña abierta = se cierra y queda solo el chat arriba.
    if(currentTab===t.dataset.tab){ currentTab=''; }
    else { t.classList.add('active'); currentTab = t.dataset.tab; }
    render();
  });
});

// ─── GENERADOR ────────────────────────────────────────────────────────────
function seleccionadas(){
  const datos = datosActuales();
  const items = [];
  ETAPAS.forEach(e=>{ (datos[e.key]||[]).forEach(it=>{ if(it.selected) items.push(Object.assign({etapa:e.key}, it)); }); });
  return items;
}

// Los ángulos que se ofrecen: los de la Comunicación 366 del grupo elegido (si tiene una propia); si no,
// los de todas las Comunicaciones guardadas, sin repetir.
function recalcularAngulos366(){
  const delGrupo = grupoId ? comunicaciones366.filter(c=>c && c.grupo_id===grupoId) : [];
  const fuente = delGrupo.length ? delGrupo : comunicaciones366;
  const vistos = new Set(), out = [];
  fuente.forEach(c=>(Array.isArray(c.angulos_evergreen) ? c.angulos_evergreen : []).forEach(f=>{
    if(!f || !f.angulo || !String(f.angulo).trim()) return;
    const k = String(f.angulo).trim().toLowerCase();
    if(vistos.has(k)) return; vistos.add(k); out.push(f);
  }));
  const firma = out.map(f=>f.angulo).join('|');
  if(firma !== angulosFirma){ angulosFirma = firma; anguloIdx = ''; } // cambió la lista: el índice elegido ya no sirve
  angulos366 = out;
}

function renderGenerador(container){
  recalcularAngulos366();
  const datos = datosActuales();
  const productosDisponibles = productos.filter(p => p && p.nombre && (!grupoId || p.grupo_id === grupoId));

  const wrap = document.createElement('div');

  const toolbar = document.createElement('div');
  toolbar.className='anuncios-toolbar';
  toolbar.innerHTML = `
    <div class="mode-field" style="min-width:200px;">
      <label>Producto o servicio a vender</label>
      <select id="anuncios-producto-sel">
        <option value="">Todo el grupo</option>
        ${productosDisponibles.map(p=>`<option value="${p.id}"${productoId===p.id?' selected':''}>${escHtml(p.nombre)}</option>`).join('')}
      </select>
    </div>
    <div class="mode-field" style="min-width:200px;">
      <label>Grupo de negocio</label>
      <select id="anuncios-grupo-sel">
        <option value="">General (sin grupo)</option>
        ${grupos.map(g=>`<option value="${g.id}"${grupoId===g.id?' selected':''}>${escHtml(g.nombre)}</option>`).join('')}
      </select>
    </div>
    <div class="mode-field" style="min-width:200px;">
      <label>Ángulo 366 (opcional)</label>
      <select id="anuncios-angulo-sel">
        <option value=""${anguloIdx===''?' selected':''}>Todos los ángulos (mezcla automática)</option>
        ${angulos366.map((f,i)=>`<option value="${i}"${String(anguloIdx)===String(i)?' selected':''}>${escHtml(f.angulo)}</option>`).join('')}
      </select>
    </div>
    <div class="mode-field" style="min-width:150px;">
      <label>Cuántas por etapa</label>
      <select id="anuncios-cantidad-sel">
        <option value="1"${cantidadPorEtapa===1?' selected':''}>1 (3 en total)</option>
        <option value="2"${cantidadPorEtapa===2?' selected':''}>2 (6 en total)</option>
        <option value="3"${cantidadPorEtapa===3?' selected':''}>3 (9 en total)</option>
      </select>
    </div>
    <button class="btn btn-solid" id="anuncios-gen-btn" type="button">✨ Generar ideas</button>
    <span class="mode-status" id="anuncios-gen-status">${escHtml(genStatus)}</span>

async function generarIdeas(){
  const btn = document.getElementById('anuncios-gen-btn');
  const statusEl = document.getElementById('anuncios-gen-status');
  const anguloSelIdx = document.getElementById('anuncios-angulo-sel').value;
  const anguloFila = anguloSelIdx !== '' ? angulos366[anguloSelIdx] : null;
  const anguloTexto = anguloFila ? [anguloFila.angulo, anguloFila.accion, anguloFila.emocion, anguloFila.conecta].filter(Boolean).join(' — ') : '';
  const cantidad = parseInt(document.getElementById('anuncios-cantidad-sel').value, 10) || 3;
  const total = cantidad * 3;
  btn.disabled = true; btn.textContent = 'Generando...';
  statusEl.className='mode-status'; statusEl.textContent=`⏳ Leyendo ADN + 366 + Radar para armar ${total} idea(s)...`;
  try{
    const res = await fetch('/api/generar-anuncios', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ modo: 'ideas', cliente: CLIENTE_ID, grupo_id: grupoId, producto_id: productoId, angulo_texto: anguloTexto, cantidad_por_etapa: cantidad, producto_texto: productoTexto }),
    });
    const data = await res.json();
    if(!res.ok){ statusEl.textContent='Error: '+(data.error||'No se pudo generar.'); statusEl.classList.add('error'); return; }
    const datos = datosActuales();
    ETAPAS.forEach(e=>{
      const nuevas = Array.isArray(data.ideas[e.key]) ? data.ideas[e.key] : [];
      nuevas.forEach(it=>{
        datos[e.key].push({ id:mkIdeaId(e.key), titulo: it.titulo||'', hook: it.hook||'', porque: it.porque||'', selected:false });
      });
    });
    genStatus = `✅ ${total} idea(s) generadas — revísalas, edítalas y marca las que quieras desarrollar.`;
    scheduleBorradorSave();
    render();
  }catch(e){
    statusEl.textContent='Error de conexión.'; statusEl.classList.add('error');
  }finally{
    btn.disabled=false; btn.textContent='✨ Generar ideas';
  }
}

async function generarDetalleSeleccionadas(){
  const statusEl = document.getElementById('anuncios-detalle-status');
  const btn = document.getElementById('anuncios-detalle-btn');
  const sel = seleccionadas();
  if(!sel.length){
    statusEl.className='mode-status error'; statusEl.textContent='Selecciona al menos una idea primero.';
    return;
  }
  const formato = document.getElementById('anuncios-formato-sel').value;
  btn.disabled = true;
  statusEl.className='mode-status'; statusEl.textContent='⏳ Desarrollando guion, copy y prompts de '+sel.length+' idea(s)...';
  try{
    const res = await fetch('/api/generar-anuncios', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        modo: 'detalle', cliente: CLIENTE_ID, grupo_id: grupoId, producto_id: productoId, producto_texto: productoTexto, formato,
        ideas: sel.map(it=>({ id: it.id, titulo: it.titulo, hook: it.hook, etapa: it.etapa })),
      }),
    });
    const data = await res.json();
    if(!res.ok){ statusEl.textContent='Error: '+(data.error||'No se pudo generar.'); statusEl.classList.add('error'); return; }

    const detallesPorId = {};
    (data.detalles||[]).forEach(d=>{ detallesPorId[d.id]=d; });

    let creadas = 0;
    sel.forEach(it=>{
      const det = detallesPorId[it.id];
      if(!det) return;
      cards.unshift({
        id: mkCardId(),
        etapa: it.etapa,
        formato: data.formato || formato,
        grupo_id: grupoId || '',
        producto_id: productoId || '',
        titulo: it.titulo,
        hook: it.hook,
        objetivo: det.objetivo || '',
        angulo: det.angulo || '',
        audiencia: det.audiencia || '',
        guion: det.guion,
        version_15s: det.version_15s || '',
        hooks_alternativos: Array.isArray(det.hooks_alternativos) ? det.hooks_alternativos : [],
        visual_sugerido: det.visual_sugerido || '',
        duracion_sugerida: det.duracion_sugerida || '',
        copy_publicacion: det.copy_publicacion,
        prompt_imagen: det.prompt_imagen,
        prompt_video: det.prompt_video,
        caption_whatsapp: det.caption_whatsapp,
        titulo_anuncio: det.titulo_anuncio || '',
        descripcion_anuncio: det.descripcion_anuncio || '',
        cta_boton: det.cta_boton || '',
        link_destino: det.link_destino || '',
        estado: 'idea',
        fecha: '',
        retroalimentacion: '',
        link_archivo_final: '',
      });
      creadas++;
      // Ya se convirtió en campaña -- se quita de la lista de ideas en vez de solo desmarcarla.
      const lista = datosActuales()[it.etapa];
      if(lista){
        const idx = lista.findIndex(f=>f.id===it.id);
        if(idx!==-1) lista.splice(idx,1);
      }
    });

    document.getElementById('count-cards').textContent = cards.length;
    scheduleCardsSave();
    scheduleBorradorSave();
    statusEl.textContent = `✅ ${creadas} campaña(s) creada(s) en "Campañas guardadas".`;
    render();
  }catch(e){
    statusEl.textContent='Error de conexión.'; statusEl.classList.add('error');
  }finally{
    btn.disabled=false;
  }
}

// ─── SUBIR IMAGEN (compartido con el adjunto de Consulta en vivo) ─────────
// Reduce cualquier imagen (o el fotograma extraído de un video) a un JPEG comprimido en base64
// antes de mandarlo al servidor -- mantiene el payload ligero y dentro del límite de la función
// serverless, y el tamaño recomendado para la API de Claude (lado largo ~1568px).
function comprimirCanvasAJpegBase64(canvas, calidad){
  const dataUrl = canvas.toDataURL('image/jpeg', calidad);
  return dataUrl.split(',')[1];
}
function dibujarEnCanvasRedimensionado(origenAncho, origenAlto, maxLado){
  let w = origenAncho, h = origenAlto;
  if(w > maxLado || h > maxLado){
    const escala = maxLado / Math.max(w, h);
    w = Math.round(w * escala); h = Math.round(h * escala);
  }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  return canvas;
}
function imagenFileAJpegBase64(file, maxLado){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const canvas = dibujarEnCanvasRedimensionado(img.naturalWidth, img.naturalHeight, maxLado);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(comprimirCanvasAJpegBase64(canvas, 0.85));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen.')); };
    img.src = url;
  });
}
function videoFileAFotogramaJpegBase64(file, maxLado){
  return new Promise((resolve, reject)=>{
    const video = document.createElement('video');
    video.muted = true; video.playsInline = true;
    const url = URL.createObjectURL(file);
    video.onloadedmetadata = ()=>{ video.currentTime = Math.min(1, (video.duration||1) / 3); };
    video.onseeked = ()=>{
      const canvas = dibujarEnCanvasRedimensionado(video.videoWidth, video.videoHeight, maxLado);
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(comprimirCanvasAJpegBase64(canvas, 0.85));
    };
    video.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('No se pudo leer el video.')); };
    video.src = url;
  });
}

// Procesa un archivo (del <input type=file> del chat o pegado con Ctrl+V) y lo deja listo para
// adjuntarlo al siguiente mensaje de Consulta en vivo. Busca los elementos por id porque cuando se
// llama desde el paste global no se conoce el contenedor de origen.
async function procesarArchivoChatImagen(file){
  const preview = document.getElementById('chat-adjunto-preview');
  const hint = document.getElementById('chat-adjunto-hint');
  if(!preview || !hint) return; // la pestaña de chat no está en pantalla ahorita
  chatImagenBase64 = ''; chatImagenNombre = ''; preview.style.display = 'none';
  if(!file) return;
  hint.textContent = '⏳ Procesando archivo...';
  try{
    const esVideo = file.type.startsWith('video/');
    const base64 = esVideo ? await videoFileAFotogramaJpegBase64(file, 1280) : await imagenFileAJpegBase64(file, 1280);
    chatImagenBase64 = base64;
    chatImagenMediaType = 'image/jpeg';
    chatImagenNombre = file.name || 'imagen-pegada.jpg';
    preview.querySelector('img').src = 'data:image/jpeg;base64,' + base64;
    preview.querySelector('span').textContent = chatImagenNombre;
    preview.style.display = 'inline-flex';
    hint.textContent = esVideo ? '✅ Fotograma extraído del video -- cuéntale al Jefe qué se dice en el video si quieres que lo tome en cuenta.' : '✅ Imagen lista para enviar.';
  }catch(err){
    hint.textContent = 'No se pudo procesar el archivo.';
  }
}

// Pegar con Ctrl+V en cualquier parte de la página adjunta la imagen al chat, mientras la pestaña
// Consulta en vivo esté abierta -- se registra UNA sola vez a nivel documento (no en cada render).
function handleGlobalPasteChatImagen(e){
  const fileInput = document.getElementById('chat-file-input');
  if(!fileInput) return; // el chat no está en pantalla ahorita, no interceptar el paste
  const items = (e.clipboardData && e.clipboardData.items) || [];
  let imgFile = null;
  for(const item of items){
    if(item.kind === 'file' && item.type && item.type.startsWith('image/')){ imgFile = item.getAsFile(); break; }
  }
  if(!imgFile) return; // no había imagen en el portapapeles -- deja el paste normal (ej. texto)
  e.preventDefault();
  procesarArchivoChatImagen(imgFile);
}
document.addEventListener('paste', handleGlobalPasteChatImagen);

// círculo (clic abre el link) y un lápiz al pasar el cursor para editarlo.
const ICONOS_SVG = {
  carpeta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  meta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6 8C4.2 8 2.6 10 2.6 12s1.6 4 4 4c2.2 0 3.6-1.7 5.4-4s3.2-4 5.4-4c2.4 0 4 2 4 4s-1.6 4-4 4c-2.2 0-3.6-1.7-5.4-4S8.8 8 6.6 8z"/></svg>',
};
function linkHref(link){
  const v=(link||'').trim();
  if(!v) return '';
  return /^https?:\/\//i.test(v) ? v : 'https://'+v;
}
let carpetaEditando=false, bmEditando=false;
const LINK_ICONOS = [
  { id:'carpeta', icono:'carpeta', titulo:'Carpeta de campaña (Drive u otro)',
    get:()=>linkCarpeta, set:v=>{ linkCarpeta=v; scheduleCarpetaSave(); },
    editando:()=>carpetaEditando, setEditando:v=>{ carpetaEditando=v; } },
  { id:'bm', icono:'meta', titulo:'Business Manager (Meta Ads)',
    get:()=>linkBM, set:v=>{ linkBM=v; scheduleBMSave(); },
    editando:()=>bmEditando, setEditando:v=>{ bmEditando=v; } },
];
function pintarIconos(){
  const host=document.getElementById('cx-icons');
  if(!host) return;
  host.innerHTML='';
  LINK_ICONOS.forEach(cfg=>{
    const link=(cfg.get()||'').trim();
    const editando=cfg.editando();
    const mostrarInput=!link||editando;
    const box=document.createElement('div');
    box.className='cx-ic';
    const titulo=escHtml(cfg.titulo);
    let html='';
    if(link && !editando){
      html+=`<a class="cx-circle" href="${escHtml(linkHref(link))}" target="_blank" rel="noopener" data-tip="${titulo} · clic para abrir" aria-label="${titulo}">${ICONOS_SVG[cfg.icono]}</a>
             <button type="button" class="cx-edit" data-edit="${cfg.id}" title="Editar link" aria-label="Editar link de ${titulo}">✎</button>`;
    } else {
      html+=`<button type="button" class="cx-circle vacio" data-focus="${cfg.id}" data-tip="${titulo}" aria-label="${titulo}">${ICONOS_SVG[cfg.icono]}</button>`;
    }
    if(mostrarInput){
      html+=`<div class="cx-pill"><input type="text" data-link-input="${cfg.id}" placeholder="Pega tu link aquí" value="${escHtml(link)}" aria-label="Link: ${titulo}"><button type="button" data-ok="${cfg.id}">Listo</button>${link?`<button type="button" class="ghost" data-cancel="${cfg.id}" aria-label="Cancelar">✕</button>`:''}</div>`;
    }
    box.innerHTML=html;
    host.appendChild(box);

    const input=box.querySelector('[data-link-input]');
    if(input){
      input.addEventListener('input',e=>cfg.set(e.target.value));
      const cerrar=()=>{ if((cfg.get()||'').trim()){ cfg.setEditando(false); pintarIconos(); } };
      input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); cerrar(); } if(e.key==='Escape'){ cfg.setEditando(false); pintarIconos(); } });
      input.addEventListener('blur',cerrar);
      box.querySelectorAll('.cx-pill button').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
      const ok=box.querySelector('[data-ok]'); if(ok) ok.addEventListener('click',cerrar);
      const cancel=box.querySelector('[data-cancel]'); if(cancel) cancel.addEventListener('click',()=>{ cfg.setEditando(false); pintarIconos(); });
      if(editando) input.focus();
    }
    const edit=box.querySelector('[data-edit]');
    if(edit) edit.addEventListener('click',()=>{ cfg.setEditando(true); pintarIconos(); });
    const vacio=box.querySelector('[data-focus]');
    if(vacio) vacio.addEventListener('click',()=>{ const i=box.querySelector('input'); if(i) i.focus(); });
  });
}

    `;

  }

  if(!cards.length){

    empty.textContent = 'Todavía no hay campañas guardadas. Aprueba ideas en el Generador y elige un formato para crearlas.';
    container.appendChild(empty);

  }
  // Filtro por producto (pastillas): "Todos" + cada producto que ya tenga campañas guardadas.
  const idsConCampanas = [...new Set(cards.map(c=>c.producto_id||''))];
  if(filtroProductoGuardadas && !idsConCampanas.includes(filtroProductoGuardadas==='__sin__'?'':filtroProductoGuardadas)) filtroProductoGuardadas = '';
  const nombreDe = (id)=>{ const p = productos.find(x=>x&&x.id===id); return id ? (p?p.nombre:'Producto') : 'Sin producto'; };
  const filtroEl = document.createElement('div');
  filtroEl.className = 'prod-pills';
  filtroEl.id = 'guardadas-producto-pills';
  filtroEl.innerHTML = `<button type="button" class="prod-pill${filtroProductoGuardadas===''?' active':''}" data-filtro="">Todos (${cards.length})</button>` +
    idsConCampanas.map(id=>`<button type="button" class="prod-pill${filtroProductoGuardadas===(id===''?'__sin__':id)?' active':''}" data-filtro="${escHtml(id||'__sin__')}">${escHtml(nombreDe(id))} (${cards.filter(c=>(c.producto_id||'')===id).length})</button>`).join('');
  container.appendChild(filtroEl);
  filtroEl.querySelectorAll('.prod-pill').forEach(b=>b.addEventListener('click',()=>{
    filtroProductoGuardadas = b.dataset.filtro; render();
  }));
  const visibles = filtroProductoGuardadas==='' ? cards : cards.filter(c=>(c.producto_id||'')===(filtroProductoGuardadas==='__sin__'?'':filtroProductoGuardadas));

  // Categorizadas por producto: una barra por producto (en el orden de tu lista de productos, y
  // "Sin producto" al final) con sus campañas debajo; dentro de cada una, primero lo que está en
  // proceso, luego ideas y al final lo publicado, y por fecha.
  const rank = {proceso:0, idea:1, publicado:2};
  const orden = (x,y)=>(rank[x.estado||'idea']-rank[y.estado||'idea']) || (x.fecha||'9999').localeCompare(y.fecha||'9999') || porHoraCard(x,y);
  const idsOrdenados = productos.filter(p=>p&&p.id&&visibles.some(c=>c.producto_id===p.id)).map(p=>p.id);
  visibles.forEach(c=>{ const id=c.producto_id||''; if(id && !idsOrdenados.includes(id)) idsOrdenados.push(id); });
  if(visibles.some(c=>!c.producto_id)) idsOrdenados.push('');
  idsOrdenados.forEach(id=>{
    const delProducto = visibles.filter(c=>(c.producto_id||'')===id).sort(orden);
    if(!delProducto.length) return;
    const seccion = document.createElement('div');
    seccion.className = 'estado-seccion';
    seccion.innerHTML = `<p class="estado-seccion-title">${escHtml(nombreDe(id))} <span class="estado-count">${delProducto.length}</span></p>
      <div class="cards-grid">${delProducto.map(c=>buildPostCard(c, true)).join('')}</div>`;
    container.appendChild(seccion);
  });
  container.querySelectorAll('.pcard').forEach(el=>{
    el.addEventListener('click',()=>abrirPostModal(el.dataset.id));
    el.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); abrirPostModal(el.dataset.id); } });
  });
}

// Backfill de una sola vez: completa Título/Descripción/CTA de Meta Ads Manager en las tarjetas
// que se crearon antes de que existieran estos 3 campos. Las tarjetas nuevas ya salen completas
// desde generarDetalleSeleccionadas() -- este botón es solo para ponerse al día con las viejas.
async function completarCamposMeta(){
  const statusEl = document.getElementById('completar-meta-status');
  const btn = document.getElementById('completar-meta-btn');
  const faltantes = cards.filter(c=>!c.titulo_anuncio || !c.cta_boton || !c.link_destino);
  if(!faltantes.length) return;
  btn.disabled = true;
  // Se agrupa por grupo_id antes de lotear -- el link_destino depende del grupo de negocio de
  // cada tarjeta (cada Comunicación 366 puede tener su propio número/mensaje de WhatsApp), así
  // que una misma llamada a la API no puede mezclar tarjetas de distintos grupos.
  const porGrupo = {};
  faltantes.forEach(c=>{ const g = c.grupo_id || ''; (porGrupo[g] = porGrupo[g] || []).push(c); });
  let hechos = 0;
  const total = faltantes.length;
  for(const grupoIdLote of Object.keys(porGrupo)){
    const cardsDelGrupo = porGrupo[grupoIdLote];
    for(let i=0;i<cardsDelGrupo.length;i+=MAX_CAMPOS_META_POR_LOTE){
      const lote = cardsDelGrupo.slice(i, i+MAX_CAMPOS_META_POR_LOTE);
      statusEl.className = 'mode-status';
      statusEl.textContent = `⏳ Completando ${hechos+1}-${Math.min(hechos+lote.length, total)} de ${total}...`;
      try{
        const res = await fetch('/api/generar-anuncios', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            modo:'completar_meta', cliente: CLIENTE_ID, grupo_id: grupoIdLote,
            cards: lote.map(c=>({ id:c.id, titulo:c.titulo, hook:c.hook, objetivo:c.objetivo, guion:c.guion, copy_publicacion:c.copy_publicacion })),
          }),
        });
        const data = await res.json();
        if(!res.ok || !data.campos){ statusEl.textContent='Error: '+(data.error||'No se pudo completar.'); statusEl.classList.add('error'); btn.disabled=false; return; }
        const porId = {};
        data.campos.forEach(c=>{ porId[c.id]=c; });
        lote.forEach(c=>{
          const campos = porId[c.id];
          if(!campos) return;
          c.titulo_anuncio = campos.titulo_anuncio || c.titulo_anuncio;
          c.descripcion_anuncio = campos.descripcion_anuncio || c.descripcion_anuncio;
          c.cta_boton = campos.cta_boton || c.cta_boton;
          c.link_destino = c.link_destino || campos.link_destino || '';
          hechos++;
        });
        scheduleCardsSave();
      }catch(err){
        statusEl.textContent = 'Error de conexión.'; statusEl.classList.add('error'); btn.disabled=false; return;
      }
    }
  }
  statusEl.textContent = `✅ ${hechos} campaña(s) completadas con Título/Descripción/CTA/Link de Meta.`;
  render();
}
