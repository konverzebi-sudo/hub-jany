    document.getElementById('ed-ui').innerHTML=`<span class="wchip">${fm.label}</span>${fm.play&&!interactivo?'<span class="wplay"></span>':''}
      <div class="ed-screen-txt"><b>${escHtml(marca)}</b><span>${escHtml(cap.slice(0,140))}${cap.length>140?'…':''}</span></div>`;
  }
  const nets=document.getElementById('ed-prev-nets');
  if(nets) nets.innerHTML=draft.redes.length ? draft.redes.map(k=>`<span class="wnet">${{ig:'Instagram',tt:'TikTok',fb:'Facebook'}[k]||k}</span>`).join('') : '<span class="wnote">Elige al menos una red</span>';
  const pc=document.getElementById('ed-prev-cap');
  if(pc) pc.textContent=`${fm.label} · ${alto==='tall'?'9:16':'4:5'}${draft.hora?' · '+draft.hora:''}`;
  const pm=document.getElementById('ed-prev-mat');
  if(pm){
    if(!mi) pm.innerHTML='<span class="wnote">Agrega un link de material y aquí lo verás (se muestra el más avanzado que tengas).</span>';
    else pm.innerHTML=`<a class="wcal-link" href="${mi.abrir}" target="_blank" rel="noopener">🔗 Abrir ${fu.label.toLowerCase()}</a>${mi.tipo==='link'?`<span class="wnote">${escHtml(mi.host||'')} no deja mostrarse dentro de otra página. Ábrelo con el botón o sube una portada.</span><label class="wcal-link" for="ed-mini-file" style="cursor:pointer;">📷 Subir portada</label>`:''}`;
  }
  const fl=document.getElementById('ed-fuentes');
  if(fl){
    const fs=fuentesMaterial(draft);
    fl.innerHTML=fs.length>1 ? fs.map(f=>`<button type="button" class="ed-fuente${fu&&f.k===fu.k?' on':''}" data-fuente="${f.k}">${f.label}</button>`).join('') : '';
  }
  const pi=document.getElementById('ed-prodinfo');
  if(pi){
    pi.innerHTML = draft.productoId ? '' : infoProductoHTML('', editorCtx.id);
    const linea=document.getElementById('ed-prodline'); if(linea) linea.hidden = !pi.innerHTML;
  }
  const pill=document.getElementById('ed-estado-pill');
  if(pill){ pill.className='wpill '+draft.estado; pill.textContent=ESTADO_LABEL[draft.estado]||''; }
}

function enlazarEditor(ov){
  const draft=editorCtx.draft;
  ov.querySelectorAll('[data-ed]').forEach(el=>{
    const f=el.dataset.ed;
    const upd=()=>{ draft[f]=el.value; actualizarPreviewEditor(); };
    if(f==='linkArchivo'||f==='linkFinal'||f==='linkPub'){
      let t=null;
      el.addEventListener('input',()=>{ draft[f]=el.value; clearTimeout(t); t=setTimeout(actualizarPreviewEditor,600); });
      el.addEventListener('change',upd);
    } else {
      el.addEventListener('input',upd);
      el.addEventListener('change',upd);
    }
  });
  ov.querySelector('#ed-formatos').addEventListener('click',e=>{
    const b=e.target.closest('[data-formato]'); if(!b) return;
    draft.formato=b.dataset.formato;
    ov.querySelectorAll('[data-formato]').forEach(x=>x.classList.toggle('on',x===b));
    actualizarPreviewEditor();
  });
  ov.querySelector('#ed-redes').addEventListener('click',e=>{
    const b=e.target.closest('[data-red]'); if(!b) return;
    const k=b.dataset.red;
    const set=new Set(draft.redes);
    if(set.has(k)) set.delete(k); else set.add(k);
    draft.redes=['ig','tt','fb'].filter(x=>set.has(x));
    b.classList.toggle('on',set.has(k));
    actualizarPreviewEditor();
  });
  const refMini=()=>{
    const img=ov.querySelector('#ed-mini-img');
    img.src=draft.miniatura||''; img.hidden=!draft.miniatura;
    ov.querySelector('#ed-mini-quitar').hidden=!draft.miniatura;
    ov.querySelector('#ed-mini-txt').textContent='📷 '+(draft.miniatura?'Cambiar imagen':'Subir imagen');
    actualizarPreviewEditor();
  };
  ov.querySelector('#ed-mini-file').addEventListener('change',async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    draft.miniatura=(await comprimirMiniatura(f))||draft.miniatura;
    refMini();
  });
  ov.querySelector('#ed-mini-quitar').addEventListener('click',()=>{ draft.miniatura=''; refMini(); });
  ov.querySelector('#ed-copiar').addEventListener('click',e=>{
    if(!draft.caption) return;
    const b=e.currentTarget, prev=b.textContent;
    navigator.clipboard.writeText(draft.caption).then(()=>{ b.textContent='✅ Copiado'; setTimeout(()=>{b.textContent=prev;},1500); });
  });
  const cajaGuion=ov.querySelector('[data-guion-box]');
  const crearGuion=()=>{
    cajaGuion.hidden=false;
    generateGuion(null,ov.querySelector('[data-ed="guion"]'),{gancho:draft.gancho,descripcion:draft.descripcion,etapa:draft.etapa});
  };
  ov.querySelector('#ed-guion').addEventListener('click',crearGuion);
  // Guion: si todavía no hay, lo crea; si ya hay, abre o cierra su cajita.
  ov.querySelector('[data-tool="guion"]').addEventListener('click',e=>{
    if(!draft.guion.trim()){ crearGuion(); e.currentTarget.classList.add('on'); return; }
    cajaGuion.hidden=!cajaGuion.hidden;
    e.currentTarget.classList.toggle('on',!cajaGuion.hidden);
  });
  ov.querySelector('#ed-copiar-guion').addEventListener('click',e=>{
    if(!draft.guion) return;
    const b=e.currentTarget, prev=b.textContent;
    navigator.clipboard.writeText(draft.guion).then(()=>{ b.textContent='✅ Copiado'; setTimeout(()=>{b.textContent=prev;},1500); });
  });
  enlazarMedios(ov);
  enlazarMaterial(ov);
  enlazarProductoSel(ov);
  enlazarProductoAuto(ov);
  ov.querySelector('#ed-fuentes').addEventListener('click',e=>{
    const b=e.target.closest('[data-fuente]'); if(!b) return;
    editorCtx.fuente=b.dataset.fuente;
    actualizarPreviewEditor();
  });
  ov.querySelector('#ed-x').addEventListener('click',cerrarEditor);
  ov.querySelector('#ed-cancel').addEventListener('click',cerrarEditor);
  ov.querySelector('#ed-save').addEventListener('click',guardarEditor);
  const del=ov.querySelector('#ed-del');
  if(del) del.addEventListener('click',()=>{
    if(!confirm('¿Eliminar esto? No se puede deshacer.')) return;
    const hit=findItem(editorCtx.id);
    if(hit){ state[hit.tab]=state[hit.tab].filter(r=>r.id!==editorCtx.id); }
    actualizarContadores(); scheduleSave(); cerrarEditor(); refrescarVistas();
  });
}

function guardarEditor(){
  const {tab,id,draft}=editorCtx;
  let row;
  if(id){
    const hit=findItem(id);
    if(!hit){ cerrarEditor(); return; }
    row=hit.row;
  } else {
    const nid=(tab==='historias'?'h':'c')+'_new'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    row={id:nid, orden:state[tab].length+1, fase:tab==='historias'?'Semana 1 · Atraer/Conexión':'Semana 1', linkRef:'', linkArchivo:''};
    state[tab].unshift(row);
  }
  row.gancho=draft.gancho.trim()||'Nueva idea — escribe el gancho aquí';
  row.estado=draft.estado; row.fecha=draft.fecha; row.hora=draft.hora;
  row.formato=draft.formato; row.redes=draft.redes.slice();
  row.caption=draft.caption; row.descripcion=draft.descripcion; row.ganchoIdea=draft.ganchoIdea;
  row.guion=draft.guion; row.promptImagen=draft.promptImagen; row.promptVideo=draft.promptVideo;
  row.linkVirgen=draft.linkVirgen; row.linkArchivo=draft.linkArchivo; row.linkFinal=draft.linkFinal; row.linkPub=draft.linkPub; row.linkRef=draft.linkRef; row.notas=draft.notas;
  if(draft.productoId){ row.productoId=draft.productoId; row.productoNombre=nombreProducto(draft.productoId)||row.productoNombre||''; }
  else { delete row.productoId; delete row.productoNombre; }
  if(draft.etapa!==(row.etapa||getDefaults(row).etapa)) row.etapa=draft.etapa;
  if(draft.miniatura) row.miniatura=draft.miniatura; else delete row.miniatura;
  if(+draft.semana!==semanaDeFase(row.fase)){
    const suffix=tab==='historias' ? FASE_SUFFIJOS[+draft.semana]||'' : '';
    row.fase=suffix ? `Semana ${draft.semana} · ${suffix}` : `Semana ${draft.semana}`;
  }
  const idGuardado=row.id;
  actualizarContadores(); scheduleSave(); cerrarEditor(); refrescarVistas();
  return idGuardado;
}

// ─── MATERIAL FINAL: qué se puede mostrar a partir del "Link de material" ───────
// Imagen o video directo, YouTube, Google Drive, Instagram y TikTok se ven dentro de la tarjeta y
// del celular; cualquier otro link (p. ej. Google Photos) queda como botón "Abrir material".
function infoMaterial(url){
  let u=(url||'').trim();
  if(!u) return null;
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  let L; try{ L=new URL(u); }catch(e){ return null; }
  const h=L.hostname.replace(/^www\./,'').toLowerCase();
  const ext=((L.pathname.match(/\.([a-z0-9]+)$/i)||[])[1]||'').toLowerCase();
  if(h.endsWith('dropbox.com')){ L.searchParams.delete('dl'); L.searchParams.set('raw','1'); }
  const limpio=x=>x.replace(/"/g,'%22').replace(/'/g,'%27').replace(/</g,'%3C').replace(/>/g,'%3E');
  const abrir=limpio(L.toString());
  let m, id=null;
  if(['jpg','jpeg','png','gif','webp','avif','bmp'].includes(ext) || h.endsWith('googleusercontent.com')) return {tipo:'img',src:abrir,thumb:abrir,abrir,host:h};
  if(['mp4','webm','mov','m4v','ogv'].includes(ext)) return {tipo:'video',src:abrir,thumb:null,abrir,host:h};
  if(h==='youtu.be') id=L.pathname.slice(1).split('/')[0];
  else if(h.endsWith('youtube.com')){
    if(L.pathname.startsWith('/watch')) id=L.searchParams.get('v');
    else if((m=L.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{6,})/))) id=m[1];
  }
  if(id && /^[\w-]{6,}$/.test(id)) return {tipo:'embed',src:'https://www.youtube.com/embed/'+id,thumb:'https://img.youtube.com/vi/'+id+'/hqdefault.jpg',abrir,host:h};
  if(h==='drive.google.com'){
    m=L.pathname.match(/\/file\/d\/([\w-]+)/); id=m?m[1]:L.searchParams.get('id');
    if(id && /^[\w-]+$/.test(id)) return {tipo:'embed',src:'https://drive.google.com/file/d/'+id+'/preview',thumb:'https://drive.google.com/thumbnail?id='+id+'&sz=w640',abrir,host:h};
  }
  if(h.endsWith('instagram.com') && (m=L.pathname.match(/^\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([\w-]+)/)))
    return {tipo:'embed',src:'https://www.instagram.com/'+(m[1]==='reels'?'reel':m[1])+'/'+m[2]+'/embed',thumb:'https://hub-jany.vercel.app/api/check-link?ig='+m[2],abrir,host:h};
  if(h.endsWith('tiktok.com') && (m=L.pathname.match(/\/video\/(\d+)/)))
    return {tipo:'embed',src:'https://www.tiktok.com/embed/v2/'+m[1],thumb:null,abrir,host:h};
  return {tipo:'link',abrir,host:h};
}
// Capa de material sobre la miniatura (si el material no carga, se quita y se ve la miniatura).
function materialCapaHTML(mi){
  if(!mi) return '';
  if(mi.tipo==='video') return `<video class="wmat" src="${mi.src}#t=0.5" muted preload="metadata" playsinline></video>`;
  if(mi.thumb) return `<img class="wmat" src="${mi.thumb}" alt="" loading="lazy" draggable="false" referrerpolicy="no-referrer" onerror="this.remove()">`;
  return '';
}

// Tres links de material: final (lo que se publica), para editar (lo crudo) y de publicación (ya publicado).
// La vista usa el primero que se pueda mostrar, en ese orden; en el editor se puede cambiar de uno a otro.
// Etapas del material, de la más cruda a la más avanzada. La vista previa y las tarjetas usan el material más
// avanzado que se tenga (primero lo ya publicado, luego lo listo para publicar, para editar y al final el virgen).
const ETAPAS_MATERIAL = [['virgen','linkVirgen','Material virgen'],['editar','linkArchivo','Listo para editar'],['final','linkFinal','Editado, listo para publicar'],['pub','linkPub','Ya publicado']];
const FUENTES_DEF = [['pub','linkPub','Ya publicado'],['final','linkFinal','Listo para publicar'],['editar','linkArchivo','Para editar'],['virgen','linkVirgen','Material virgen']];
function fuentesMaterial(o){ return FUENTES_DEF.map(([k,campo,label])=>({k,label,mi:infoMaterial(o[campo])})).filter(f=>f.mi); }
function fuenteElegida(o, k){
  const fs=fuentesMaterial(o);
  if(!fs.length) return null;
  return (k && fs.find(f=>f.k===k)) || fs.find(f=>f.mi.tipo!=='link') || fs[0];
}
function fechaCorta(r){
  const d=parseFecha(r.fecha);
  return d ? `${d.getDate()} ${MESES_CORTOS[d.getMonth()]}` : 'Sin fecha';
}
function wcardPost(r, i, conFecha){
  const f=formatoDeItem(r,'contenido'), fm=FORMATOS_META[f];
  const est=ESTADO_LABEL[r.estado]?r.estado:'idea';
 const fu=fuenteElegida(r); const mi=fu?fu.mi:null; const gr=ESTADO_GRAD[est];
  return `<article class="wcard" tabindex="0" role="button" ${conFecha?'':'draggable="true"'} data-id="${escHtml(r.id)}" data-tab="contenido" style="--i:${i}" aria-label="${escHtml(r.gancho||'Post')}">
    <div class="wthumb" style="--thumb-a:${gr[0]};--thumb-b:${gr[1]};">
      ${r.miniatura?`<img src="${r.miniatura}" alt="" loading="lazy" draggable="false">`:`<span class="wthumb-ico">${fm.ico}</span>`}
      ${materialCapaHTML(mi)}
      <span class="wchip">${fm.label}</span>${esNuevo(r)?'<span class="wnuevo">Nuevo</span>':''}${fm.play?'<span class="wplay"></span>':''}
      ${mi?`<a class="wlink" href="${mi.abrir}" target="_blank" rel="noopener" title="Abrir material" onclick="event.stopPropagation()">🔗 Material</a>`:''}
    </div>
    <div class="wbody">
      <div class="wtitle">${escHtml(r.gancho||'(sin título)')}</div>
      ${r.productoNombre?`<div class="wnets"><span class="wnet wprod">◆ ${escHtml(r.productoNombre)}</span></div>`:''}
      <div class="wfoot"><span class="wpill ${est}">${ESTADO_LABEL[est]}</span><span class="whora">${conFecha?escHtml(fechaCorta(r)+(r.hora?' · '+r.hora:'')):escHtml(r.hora||'')}</span></div>
    </div>
  </article>`;
}
function wcardHistoria(r, i, conFecha){
  const est=ESTADO_LABEL[r.estado]?r.estado:'idea';
  const fuH=fuenteElegida(r); const mi=fuH?fuH.mi:null;
  const fondos=[mi&&(mi.tipo==='img'||mi.thumb)?mi.thumb:null, r.miniatura||null].filter(Boolean).map(u=>`url('${u}')`).join(',');
  const ring = fondos ? `<span style="background-image:${fondos}"></span>` : '<span>⭕</span>';
  return `<article class="wcard mini" tabindex="0" role="button" ${conFecha?'':'draggable="true"'} data-id="${escHtml(r.id)}" data-tab="historias" style="--i:${i};--horizon:${ESTADO_GRAD[est][1]}" aria-label="${escHtml(r.gancho||'Historia')}">
    <div class="wmini-ring">${ring}</div>
    <div class="wbody">
      <div class="wtitle">${escHtml(r.gancho||'(sin título)')}</div>
      <div class="wfoot"><span class="wpill ${est}">${ESTADO_LABEL[est]}</span><span class="whora">${conFecha?escHtml(fechaCorta(r)+(r.hora?' · '+r.hora:'')):escHtml(r.hora||'')}</span></div>
    </div>
  </article>`;
}

// Los "siguientes" de cada sección: primero lo programado (azul, por fecha), si faltan se completa con
// lo que está en proceso (amarillo) y al final con ideas (rojo), hasta WIDGET_MAX tarjetas.
// Lo que se acaba de agregar desde el chat ("Usar en Contenido") va primero durante un día, para editarlo rápido.
const NUEVO_MS = 24*60*60*1000;
function esNuevo(r){ return !!r.agregadoEn && (Date.now()-r.agregadoEn) < NUEVO_MS; }
function proximosPorEstado(lista){
  const hoy=isoDeDate(hoyMedianoche());
  const rank={programado:0,proceso:1,idea:2};
  const estDe=r=>ESTADO_LABEL[r.estado]?r.estado:'idea';
  const grupoFecha=r=>{ const f=r.fecha||''; if(!/^\d{4}-\d{2}-\d{2}$/.test(f)) return 1; return f>=hoy?0:2; }; // con fecha próxima, sin fecha, ya pasada
  return lista.filter(r=>estDe(r)!=='publicado' && pasaFoco(r)).slice().sort((a,b)=>{
    const n=(esNuevo(b)?1:0)-(esNuevo(a)?1:0); if(n) return n;
    if(esNuevo(a) && esNuevo(b)) return b.agregadoEn-a.agregadoEn;
    const d=rank[estDe(a)]-rank[estDe(b)]; if(d) return d;
    const g=grupoFecha(a)-grupoFecha(b); if(g) return g;
    return (a.fecha||'').localeCompare(b.fecha||'') || porHora(a,b);
  }).slice(0,WIDGET_MAX);
}
function wresumenEstados(items){
  const n={programado:0,proceso:0,idea:0};
  items.forEach(r=>{ n[ESTADO_LABEL[r.estado]?r.estado:'idea']++; });
  return [['programado','programado','programados'],['proceso','en proceso','en proceso'],['idea','idea','ideas']]
    .filter(([k])=>n[k]).map(([k,uno,varios])=>`${n[k]} ${n[k]>1?varios:uno}`).join(' · ');
}
function wstripHTML(lista, tab){
  const items=proximosPorEstado(lista);
  const tarjetas=items.map((r,i)=> tab==='contenido' ? wcardPost(r,i,true) : wcardHistoria(r,i,true)).join('');
  return `<div class="wstrip">${tarjetas}${items.length?'':`<p class="wnote wvacio">Todavía no hay ${tab==='contenido'?'posts':'historias'}. Agrega el primero con “+ Añadir”.</p>`}</div>`;
}

  const sec=(tab,titulo,textoCal)=>{
    const items=proximosPorEstado(tab==='contenido'?state.contenido:state.historias);

          <span class="wnote">${escHtml(wresumenEstados(items))}</span>
          <button type="button" class="wadd-btn" data-add="${tab}">+ Añadir</button>
        </div>
      </div>
      ${wstripHTML(tab==='contenido'?state.contenido:state.historias,tab)}
      <div class="wsec-foot">
        <span></span>
        <button type="button" class="wcal-link" data-cal-abrir="${tab}">📅 ${textoCal}</button>
      </div>
    </div>`;
  };
  host.innerHTML=sec('contenido','Próximos posts','Ver calendario de posts')+sec('historias','Próximas historias','Ver calendario de historias');

  if(widgetAnimar){
    host.classList.add('anim');
    setTimeout(()=>host.classList.remove('anim'),1400);

  }
  enlazarWidget(host);
}

function enlazarWidget(host){
  host.querySelectorAll('[data-abrir]').forEach(b=>b.addEventListener('click',()=>abrirDashboard(b.dataset.abrir)));
  host.querySelectorAll('[data-cal-abrir]').forEach(b=>b.addEventListener('click',()=>abrirDashboard(b.dataset.calAbrir)));
  host.querySelectorAll('.wcard').forEach(c=>{
    const abrir=()=>abrirEditor(c.dataset.tab, c.dataset.id);
    c.addEventListener('click',abrir);
    c.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); abrir(); } });
  });
  host.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{
    abrirEditor(b.dataset.add, null);
  }));
}

// ─── STORAGE ──────────────────────────────────────────────────────────────────
async function loadStorage(){
  try{
    const result=await window.storage.get(STORAGE_KEY);
    if(result&&result.value){
      const saved=JSON.parse(result.value);
      if(saved.historias) state.historias=saved.historias;
      if(saved.contenido) state.contenido=saved.contenido;
      if(saved.banco){ saved.banco.forEach(b=>{if(b.aprobada===undefined)b.aprobada=!!b.gancho;}); state.banco=saved.banco; }
      if(saved.bancoIdeas){ saved.bancoIdeas.forEach(b=>{if(b.selected===undefined)b.selected=false;}); state.bancoIdeas=saved.bancoIdeas; }
      const when=result.updatedAt?new Date(result.updatedAt).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      statusEl.textContent=when?`Cargado — último guardado ${when}`:'Tu selección se cargó.';
    }
  }catch(e){
    statusEl.textContent='Nueva sesión (sin datos guardados aún).';
  }
  if(migrarFechasLegacy()){ scheduleSave(); }
  if(autoPublicarProgramados()){ scheduleSave(); }
  scheduleAgendaSync();
  try{
    const r=await window.storage.get(CARPETA_KEY);
    linkCarpeta = r&&r.value?JSON.parse(r.value):'';
  }catch(e){ linkCarpeta=''; }
  try{
    const rfb=await window.storage.get(FB_SCHEDULER_KEY);
    linkFbScheduler = rfb&&rfb.value?JSON.parse(rfb.value):'';
  }catch(e){ linkFbScheduler=''; }
  try{
    const rin=await window.storage.get(INSPIRACION_KEY);
    const arr = rin&&rin.value?JSON.parse(rin.value):[];
    linkInspiracion = Array.isArray(arr) ? arr.filter(u=>typeof u==='string' && u.trim()) : [];
  }catch(e){ linkInspiracion=[]; }
  pintarIconos();
  actualizarContadores();
  widgetAnimar=true;
  renderWidget();
  cargarCatalogo().then(()=>{ buildProductoFilter(); });
}

// Migra fechas "dd/mm" (sin año, formato viejo) a ISO "YYYY-MM-DD" asumiendo
// el año actual — el usuario corrige a mano con el picker si el año no aplica.
function migrarFechasLegacy(){
  let cambio=false;
  const anio=new Date().getFullYear();
  [...state.historias, ...state.contenido].forEach(item=>{
    const m=(item.fecha||'').trim().match(/^(\d{1,2})\/(\d{1,2})$/);
    if(!m) return;
    const day=parseInt(m[1],10), month=parseInt(m[2],10);
    if(month<1||month>12||day<1||day>31) return;
    item.fecha=fechaISO(anio, month, day);
    cambio=true;
  });
  return cambio;
}

// Si un item "programado" ya llegó (o pasó) su fecha, lo pasa solo a "publicado" -- se revisa
// cada vez que se carga la página.
function autoPublicarProgramados(){
  let cambio=false;
  const hoy=fechaISO(new Date().getFullYear(), new Date().getMonth()+1, new Date().getDate());
  [...state.historias, ...state.contenido].forEach(item=>{
    if(item.estado==='programado' && item.fecha && item.fecha<=hoy){
      item.estado='publicado';
      cambio=true;
    }
  });
  return cambio;
}

let saveTimer=null,pendingSave=false;
function scheduleSave(){ pendingSave=true; scheduleWidgetRender(); statusEl.textContent='Guardando...'; clearTimeout(saveTimer); saveTimer=setTimeout(()=>doSave(),500); }
async function doSave(opts){
  clearTimeout(saveTimer); saveTimer=null; if(!pendingSave) return;
  try{
    await window.storage.set(STORAGE_KEY,JSON.stringify({historias:state.historias,contenido:state.contenido,banco:state.banco,bancoIdeas:state.bancoIdeas}),opts);
    pendingSave=false; statusEl.textContent='Guardado.';
    scheduleAgendaSync();
  }catch(e){
    statusEl.textContent=e.status===401?'Token incorrecto.':'No se pudo guardar.';
  }
}

// ─── SYNC CON EL JEFE DE AGENDA ─────────────────────────────────────────────
// Espeja las historias/contenido con fecha al calendario cruzado de Jefes
// ({cliente}:agenda-eventos), sin tocar los eventos que vienen de otros
// Jefes (ej. Anuncios) ni las temporadas creadas manualmente en la Agenda.
let agendaSyncTimer=null,agendaSyncPending=false;
function scheduleAgendaSync(){ agendaSyncPending=true; clearTimeout(agendaSyncTimer); agendaSyncTimer=setTimeout(syncAgendaEventos,1500); }
async function syncAgendaEventos(opts){
  clearTimeout(agendaSyncTimer); agendaSyncTimer=null; if(!agendaSyncPending) return;
  try{
    const result=await window.storage.get(AGENDA_KEY);
    const data=(result&&result.value)?JSON.parse(result.value):{eventos:[],temporadas:[]};
    const otros=(data.eventos||[]).filter(e=>e.origen!=='contenido');
    const propios=[];
    [...state.historias.map(r=>({...r,_tab:'historias'})), ...state.contenido.map(r=>({...r,_tab:'contenido'}))].forEach(item=>{
      if(!/^\d{4}-\d{2}-\d{2}$/.test(item.fecha||'')) return;
      propios.push({
        id:'contenido-'+item._tab+'-'+item.id,
        origen:'contenido', origenTab:item._tab, origenId:item.id,
        fecha:item.fecha, titulo:item.gancho||'(sin título)', estado:item.estado||'idea',
      });
    });
    data.eventos=[...otros, ...propios];
    await window.storage.set(AGENDA_KEY, JSON.stringify(data), opts);
    agendaSyncPending=false;
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&agendaSyncPending) syncAgendaEventos({keepalive:true}); });
window.addEventListener('pagehide',()=>{ if(agendaSyncPending) syncAgendaEventos({keepalive:true}); });

// ─── LLEGADA DESDE JEFE 366 + GUÍA DE USO ─────────────────────────────────
// Al darle "Ir con el Jefe de Contenido" en el paso 7 de Jefe 366, esa página deja en localStorage el
// producto con el que se venía trabajando. Aquí se llenan los módulos de "366 IA" con eso (grupo,
// producto, las 5 categorías, 1 idea detallada de cada una) y arranca la guía. Se consume una sola vez.
function leerLlegada366(){
  try{
    const raw=localStorage.getItem('jefeshub_366_a_contenido');
    if(!raw) return null;
    localStorage.removeItem('jefeshub_366_a_contenido');
    const d=JSON.parse(raw);
    if(!d || d.cliente!==CLIENTE_ID || Date.now()-(d.ts||0)>30*60*1000) return null;
    return d;
  }catch(e){ return null; }
}
const normNombre=(s)=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/s+/g,' ').trim();
function aplicarLlegada366(d){
  evergreenTipo='todos';
  evergreenDetalle='1d';
  const grupo=evergreenGrupos.find(g=>g.id===d.grupo_id) || evergreenGrupos.find(g=>normNombre(g.nombre)===normNombre(d.grupo_nombre));
  const n=normNombre(d.producto_nombre);
  const candidatos=evergreenProductos.filter(p=>p&&p.nombre&&(!grupo||p.grupo_id===grupo.id));
  const prod=n?(candidatos.find(p=>normNombre(p.nombre)===n)||candidatos.find(p=>normNombre(p.nombre).includes(n)||n.includes(normNombre(p.nombre)))):null;
  // El producto se elige en la pastilla de arriba (al cambiarla se limpia lo que traía de Jefe 366, por eso va primero).
  if(window.__foco) window.__foco.set(prod ? prod.id : (grupo ? 'g:'+grupo.id : 'all'));
  evergreenGrupoId=grupo?grupo.id:'';
  evergreenProductoId=prod?prod.id:'';
  evergreenProductoNombre=d.producto_nombre||'';
  evergreenProductoTexto=d.producto_texto||'';
}

loadStorage().then(async ()=>{
  const hash = location.hash.replace('#','');
  // Link directo a un post o historia (lo usa el Jefe de Agenda): #post=<id> abre su vista y su ficha.
  const mPost = hash.match(/^post=(.+)$/);
  if(mPost){
    let id=''; try{ id=decodeURIComponent(mPost[1]); }catch(e){}
    const hit = id ? findItem(id) : null;
    if(hit){ abrirDashboard(hit.tab, id); setTimeout(()=>abrirEditor(hit.tab, id), 450); }
    return;
  }
  if(hash==='366'){
    const llegada=leerLlegada366();
    if(llegada){ await ensureEvergreenLoaded(); aplicarLlegada366(llegada); }
    elegirHerramienta('ideas');
    if(llegada) GuiaJefe.iniciar('contenido');
    return;
  }
  if(hash==='banco'){ elegirHerramienta('banco'); return; }
  // Los segmentos del dashboard son <a href="#historias">, etc. -- así el clic derecho ofrece
  // "abrir en pestaña nueva"; al abrirla aterriza directo en esa vista.
  if(VISTAS.includes(hash)) abrirDashboard(hash);
});
</script>
