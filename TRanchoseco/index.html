<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canchas de Fútbol · Pagos y Marcadores</title>
<style>
:root{--bg:#171a22;--panel:#232735;--text:#f3f4f6;--muted:#9aa1b2;--yellow:#ffe600;--grass:#1d5a25;--line:rgba(255,255,255,.6);--danger:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 12px 6px}
.logo{display:block;height:72px;width:auto;margin:0 auto 8px}
.search{position:relative;max-width:560px;margin:0 auto}
.search input{width:100%;padding:13px 16px 13px 46px;border:0;border-radius:999px;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.45);outline:none;background:#fff;color:#111}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#666}
.results{position:absolute;top:56px;left:0;right:0;background:#fff;color:#111;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.5);max-height:60vh;overflow:auto;display:none;z-index:9}
.results.show{display:block}
.results button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #eee;padding:11px 16px;cursor:pointer;font:inherit}
.results button:hover{background:#fff8c2}
.results small{color:#666}
.empty-res{padding:12px 16px;color:#666}
.results .addteam{background:var(--yellow);color:#111;font-weight:700;text-align:center;border-bottom:0;border-radius:0 0 12px 12px}
.tabs{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.tab{background:#2a2f3f;color:var(--muted);border:0;border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit}
.tab.on{background:var(--yellow);color:#111;font-weight:600}
main{max-width:600px;margin:0 auto;padding:8px 12px 40px}
.view{display:none}
.view.on{display:block}
.fwrap{margin:14px 0}
.fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:0 4px;font-weight:600}
.link{background:none;border:0;color:#7dd3fc;cursor:pointer;font:inherit;font-size:13px}
.field{position:relative;background:var(--grass);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 45px,transparent 45px 90px);border:4px solid #0f3d17;border-radius:6px;padding:20px 6px 16px;min-height:170px;overflow:hidden}
.field::before{content:"";position:absolute;inset:12px;border:2px solid var(--line);border-radius:3px;pointer-events:none}
.field::after{content:"";position:absolute;left:50%;top:12px;bottom:12px;width:2px;background:var(--line);pointer-events:none}
.circle{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;border:2px solid var(--line);border-radius:50%;pointer-events:none}
.row{position:relative;z-index:1;display:grid;grid-template-columns:52px 1fr 1fr 52px;align-items:center}
.dollar{justify-self:center;width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:#222;font-size:24px;font-weight:600;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.dollar:hover{transform:scale(1.06)}
.tcol{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pw{position:relative}
.plus{width:68px;height:68px;border-radius:50%;border:0;background:var(--yellow);color:#111;font-size:34px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.35);line-height:1}
.plus:hover{transform:scale(1.05)}
.badge{position:absolute;top:-6px;right:-6px;min-width:26px;height:26px;padding:0 6px;border-radius:999px;background:#111;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.tname{background:#fff;color:#222;border-radius:999px;padding:3px 10px;font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minus{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:999px;width:26px;height:22px;font-size:14px;cursor:pointer;line-height:1}
.nomatch{position:relative;z-index:1;text-align:center;color:#fff;padding:50px 0;opacity:.9}
.btn{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit;font-weight:600}
.btn.primary{background:var(--yellow);color:#111}
.btn.ghost{background:#333a4d;color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.toolbar{margin-bottom:12px}
.card{background:var(--panel);border-radius:12px;padding:14px;margin-bottom:12px}
.team{display:flex;justify-content:space-between;gap:10px;align-items:center}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.muted{color:var(--muted)}
label{display:block;margin-bottom:12px;color:var(--muted);font-size:14px}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px;border-radius:8px;border:1px solid #3d4459;background:#11131a;color:var(--text);font:inherit}
input[type=file]{padding:6px;width:auto}
.whistle{background:#fff;color:#111;border:0;border-radius:999px;width:36px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-right:8px;vertical-align:middle}
.whistle:hover{background:var(--yellow)}
.marcador{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#11131a;color:#fff;border-radius:10px;padding:12px;margin-bottom:12px;font-size:15px}
.marcador span{font-size:22px;font-weight:700}
.sugs{display:flex;flex-direction:column;gap:4px;margin:-6px 0 12px;max-height:180px;overflow:auto}
.sug{background:#f3f4f6;color:#111;border:1px solid #e5e7eb;border-radius:8px;padding:9px 12px;text-align:left;cursor:pointer;font:inherit}
.sug:hover{background:#fff8c2}
.lbl{color:#444;font-size:14px;margin:0 0 6px}
.modal .lbl{color:#444}
.tiles{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:14px}
.tile{background:#f3f4f6;color:#111;border:1px solid #cfd3dc;border-radius:8px;padding:10px 0;font:inherit;font-weight:700;cursor:pointer}
.tile.on{background:var(--yellow);border-color:#d4b800}
.tile:disabled{opacity:.6;cursor:default}
.juegoq{color:#fff;font-size:12px;opacity:.9}
.modal .montoGrande{font-size:28px;font-weight:700;text-align:center;padding:14px}
.modal .resumen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.modal .resumen div{background:#f3f4f6;border-radius:10px;padding:10px;text-align:center}
.modal .resumen b{display:block;font-size:18px;margin-top:4px}
.cuadros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sq{aspect-ratio:1/1;background:#f3f4f6;color:#111;border:1px solid #cfd3dc;border-radius:10px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:4px}
.sq.on{background:var(--yellow);border-color:#d4b800}
.switchrow{display:flex;align-items:center;gap:12px;margin-bottom:14px;color:#111}
.switch{position:relative;display:inline-block;width:52px;height:28px;margin:0}
.switch input{opacity:0;width:0;height:0;margin:0}
.slider{position:absolute;inset:0;background:#cfd3dc;border-radius:999px;cursor:pointer;transition:.2s}
.slider::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--yellow)}
.switch input:checked + .slider::before{transform:translateX(24px)}
.addrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.addrow input{margin:0;flex:1}
.rowbtns{display:flex;gap:6px;flex-shrink:0}
.plist li{align-items:center}
.chk{display:flex;gap:8px;align-items:center;color:var(--text)}
.chk input{width:auto;margin:0}
h3{margin:6px 0 10px}
h4{margin:18px 0 8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:20}
.modal-bg.show{display:flex}
.modal{background:#fff;color:#111;border-radius:14px;width:100%;max-width:520px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.modal form{margin:0}
.modal h3,.modal h4{color:#111}
.modal label{color:#444}
.modal input,.modal select,.modal textarea{background:#fff;color:#111;border-color:#cfd3dc}
.modal .muted{color:#666}
.modal .bal div{background:#f3f4f6}
.modal .bal small{color:#666}
.modal .plist li{border-bottom-color:#e5e7eb}
.modal .plist small{color:#666}
.modal .btn.ghost{background:#e5e7eb;color:#111}
.modal .chk{color:#111}
.modal .pend{color:#dc2626}
.modal .card{background:#f3f4f6}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 16px}
.bal div{background:#11131a;border-radius:10px;padding:10px}
.bal b{display:block;font-size:15px;margin:3px 0}
.bal small{color:var(--muted)}
.plist{list-style:none;padding:0;margin:0}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #2f3445}
.plist small{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kpis div{background:var(--panel);border-radius:12px;padding:12px}
.kpis b{display:block;font-size:18px;margin-top:4px}
.kpis small{color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}
th,td{padding:8px 6px;border-bottom:1px solid #2f3445;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600}
.pend{color:#f87171;font-weight:600}
.ok{color:#4ade80;font-weight:600}
@media (max-width:420px){
  .plus{width:58px;height:58px;font-size:30px}
  .dollar{width:44px;height:44px;font-size:21px}
  .row{grid-template-columns:44px 1fr 1fr 44px}
}
</style>
</head>
<body>
<header>
  <img class="logo" src="escudo.png" alt="Rancho Seco Fútbol Rápido">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar equipo o jugador…" autocomplete="off">
    <div id="results" class="results"></div>
  </div>
  <nav class="tabs">
    <button class="tab on" data-act="tab" data-tab="canchas">Canchas</button>
    <button class="tab" data-act="tab" data-tab="equipos">Equipos</button>
    <button class="tab" data-act="tab" data-tab="pagos">Pagos</button>
    <button class="tab" data-act="tab" data-tab="ajustes">Ajustes</button>
  </nav>
</header>

<main>
  <section id="tab-canchas" class="view on"><div id="fields"></div></section>
  <section id="tab-equipos" class="view">
    <div class="toolbar"><button class="btn primary" data-act="newteam">+ Nuevo equipo</button></div>
    <div id="teams-list"></div>
  </section>
  <section id="tab-pagos" class="view"><div id="pagos"></div></section>
  <section id="tab-ajustes" class="view"><div id="ajustes"></div></section>
</main>

<div id="modal-bg" class="modal-bg"><div id="modal" class="modal"></div></div>

<script>
const KEY='canchas-futbol-v1';
const DEF={teams:[],matches:[],payments:[],config:{inscripcion:1500,arbitraje:500,totalJuegos:15,recibieron:['Junior','Charro','Victor','Rony'],arbitros:[],cuentas:[]}};
const clone=o=>JSON.parse(JSON.stringify(o));
// Completa los datos que vengan de la nube o del celular sin estas listas
function completar(d){
  const cfg={...clone(DEF.config),...(d.config||{})};
  if(!cfg.recibieron||!cfg.recibieron.length) cfg.recibieron=[...DEF.config.recibieron];
  if(!cfg.arbitros) cfg.arbitros=[];
  return {...clone(DEF),...d,config:cfg};
}

function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(!s) return clone(DEF);
    return completar(s);
  }catch(e){return clone(DEF);}
}
let db=load();

/* ---------- Nube compartida (todos los celulares ven lo mismo) ---------- */
const API='https://agentes.jefeshub.com/api/storage/';
const REMOTE_KEY='rancho-seco:canchas-futbol-802c57d7818d81b0';
const ACC='canchas-acceso';
// El código de acceso del hub llega una vez en el link (?k=...) y se guarda en este celular
(function capturarAcceso(){
  try{
    const u=new URL(location.href);
    const k=(u.searchParams.get('k')||'').trim();
    if(k){
      localStorage.setItem(ACC,k);
      u.searchParams.delete('k');
      history.replaceState(history.state,'',u.pathname+u.search+u.hash);
    }
  }catch(e){}
})();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){alert('No se pudo guardar en este navegador.');}
  subirNube();
}
async function subirNube(){
  let c=(localStorage.getItem(ACC)||'').trim();
  if(!c){
    c=(window.prompt('Código de acceso del hub Rancho Seco (solo se pide una vez):')||'').trim();
    if(!c) return;
    localStorage.setItem(ACC,c);
  }
  try{
    const r=await fetch(API+encodeURIComponent(REMOTE_KEY),{
      method:'POST',headers:{'Content-Type':'application/json',
        ...(/^[a-f0-9]{24}$/.test(c)?{'X-Hub-Codigo':c}:{'X-Storage-Token':c})},
      body:JSON.stringify({value:db})
    });
    if(r.status===401){localStorage.removeItem(ACC);alert('El código de acceso no sirve. Vuelve a abrir tu link de acceso.');}
    else if(!r.ok) alert('No se pudo guardar en la nube. Se guardó solo en este celular.');
  }catch(e){alert('Sin conexión: se guardó solo en este celular.');}
}
async function cargarNube(){
  try{
    const r=await fetch(API+encodeURIComponent(REMOTE_KEY),{cache:'no-store'});
    if(!r.ok) return;
    const j=await r.json();
    if(j&&j.value){
      db=completar(j.value);
      localStorage.setItem(KEY,JSON.stringify(db));
      renderAll();
    }else if(db.teams.length||db.payments.length){
      subirNube(); // la nube está vacía: sube lo que ya hay en este celular
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden) cargarNube();});

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-MX');
const sum=arr=>arr.reduce((s,p)=>s+Number(p.monto||0),0);
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
const teamById=id=>db.teams.find(t=>t.id===id);
const teamName=id=>teamById(id)?.name||'—';
const activeMatch=f=>db.matches.find(m=>m.field===f&&m.activo);
const matchById=id=>db.matches.find(m=>m.id===id);
const matchesOf=tid=>db.matches.filter(m=>m.a===tid||m.b===tid);
const teamActiveMatch=tid=>db.matches.find(m=>m.activo&&(m.a===tid||m.b===tid));
const optionsList=arr=>arr.map(x=>`<option value="${esc(x)}">`).join('');
function recibieronList(){return [...new Set([...db.config.recibieron,...db.payments.map(p=>p.recibio)].filter(Boolean))];}
function cuentasList(){return [...new Set([...db.config.cuentas,...db.payments.map(p=>p.cuenta)].filter(Boolean))];}

// Arbitraje: solo cuentan los juegos desde el juego que el equipo marcó en su primer registro
function balance(tid){
  const t=teamById(tid);
  // Arbitraje: solo cuentan los partidos creados desde que el equipo se registró
  const ms=t?.registroDesde?matchesOf(tid).filter(m=>String(m.creado||'')>=t.registroDesde).length:0;
  const pays=db.payments.filter(p=>p.teamId===tid);
  const insDue=Number(db.config.inscripcion)||0;
  const insP=Math.max(sum(pays.filter(p=>p.tipo==='inscripcion')),t?.inscripcionPrevia?insDue:0);
  const arbP=sum(pays.filter(p=>p.tipo==='arbitraje'));
  const arbDue=(Number(db.config.arbitraje)||0)*ms;
  return {ms,insDue,insP,insPend:Math.max(0,insDue-insP),arbDue,arbP,arbPend:Math.max(0,arbDue-arbP)};
}

/* ---------- Modal ---------- */
function openModal(html){$('#modal').innerHTML=html;$('#modal-bg').classList.add('show');}
function closeModal(){$('#modal-bg').classList.remove('show');$('#modal').innerHTML='';}

/* ---------- Tabs ---------- */
function showTab(name){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='tab-'+name));
  if(name==='ajustes') renderAjustes();
}
function renderAll(){renderFields();renderTeams();renderPagos();}

/* ---------- Canchas ---------- */
function side(m,s){
  const tid=s==='A'?m.a:m.b;
  const sc=s==='A'?m.sa:m.sb;
  return `<div class="tcol">
    <div class="pw"><button class="plus" data-act="score" data-match="${m.id}" data-side="${s}" aria-label="Sumar gol">+</button><span class="badge">${sc||0}</span></div>
    <span class="tname">${esc(teamName(tid))}</span>
    <small class="juegoq">${teamById(tid)?.juegoActual?`Juego ${teamById(tid).juegoActual}`:'Sin juego'}</small>
    <button class="minus" data-act="unscore" data-match="${m.id}" data-side="${s}" aria-label="Restar gol">−</button>
  </div>`;
}
function renderFields(){
  let h='';
  for(let f=1;f<=4;f++){
    const m=activeMatch(f);
    h+=`<section class="fwrap">
      <div class="fhead"><span>Cancha ${f}</span>${m?`<button class="whistle" data-act="terminar" data-match="${m.id}" title="Terminar partido" aria-label="Terminar partido">${SILBATO}</button>`:''}<button class="link" data-act="assign" data-field="${f}">${m?'Cambiar partido':'Asignar partido'}</button></div>
      <div class="field"><span class="circle"></span>`;
    if(m){
      h+=`<div class="row">
        <button class="dollar" data-act="pay" data-team="${m.a}" data-match="${m.id}" title="Pagos de ${esc(teamName(m.a))}">$</button>
        ${side(m,'A')}
        ${side(m,'B')}
        <button class="dollar" data-act="pay" data-team="${m.b}" data-match="${m.id}" title="Pagos de ${esc(teamName(m.b))}">$</button>
      </div>`;
    }else{
      h+=`<div class="nomatch">Sin partido asignado</div>`;
    }
    h+=`</div></section>`;
  }
  $('#fields').innerHTML=h;
}
function changeScore(mid,side,d){
  const m=matchById(mid); if(!m) return;
  const k=side==='A'?'sa':'sb';
  m[k]=Math.max(0,(m[k]||0)+d);
  save(); renderFields();
}
// Campo para escribir el equipo: al escribir, salen abajo los equipos que coinciden
function buscadorEquipo(s,titulo,teamId){
  const t=teamById(teamId);
  return `<label>${titulo}<input id="as-${s}-txt" autocomplete="off" placeholder="Escribe para buscar" value="${esc(t?t.name:'')}"></label>
    <div class="sugs" id="as-${s}-sug"></div>
    <input type="hidden" name="${s}" id="as-${s}-val" value="${esc(teamId||'')}">`;
}
function activarBuscador(s){
  const txt=$(`#as-${s}-txt`), sug=$(`#as-${s}-sug`), val=$(`#as-${s}-val`);
  const pintar=()=>{
    const term=norm(txt.value.trim());
    const hits=db.teams.filter(t=>!term||norm(t.name).includes(term)).slice(0,8);
    sug.innerHTML=hits.map(t=>`<button type="button" class="sug" data-pick="${t.id}" data-side="${s}">${esc(t.name)}</button>`).join('')||'<div class="muted">Ningún equipo con ese nombre</div>';
  };
  txt.addEventListener('input',()=>{val.value='';pintar();});
  txt.addEventListener('focus',pintar);
  sug.addEventListener('click',e=>{
    const b=e.target.closest('[data-pick]'); if(!b) return;
    val.value=b.dataset.pick;
    txt.value=teamName(b.dataset.pick);
    sug.innerHTML='';
  });
}
function openAssign(f){
  if(db.teams.length<2){
    openTeam(null);
    const note=document.createElement('p');
    note.className='muted';
    note.textContent=`Para asignar la cancha necesitas al menos 2 equipos. Registra este y luego el siguiente.`;
    $('#modal form')?.prepend(note);
    return;
  }
  const cur=activeMatch(f);
  openModal(`<form id="as-form">
    <h3>Cancha ${f}</h3>
    ${buscadorEquipo('a','Equipo 1',cur?cur.a:'')}
    ${buscadorEquipo('b','Equipo 2',cur?cur.b:'')}
    <p id="as-err" class="pend"></p>
    <div class="actions">
      ${cur?`<button type="button" class="btn danger" data-act="unassign" data-field="${f}">Quitar partido</button>`:''}
      <button type="button" class="btn ghost" data-act="close">Cancelar</button>
      <button class="btn primary">Guardar</button>
    </div>
  </form>`);
  ['a','b'].forEach(s=>activarBuscador(s));
  $('#as-form').onsubmit=e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const a=fd.get('a'), b=fd.get('b');
    if(!a||!b){$('#as-err').textContent='Elige los dos equipos de la lista.';return;}
    if(a===b){$('#as-err').textContent='Elige dos equipos distintos.';return;}
    db.matches.forEach(m=>{if(m.field===f&&m.activo)m.activo=false;});
    db.matches.push({id:uid(),field:f,a,b,sa:0,sb:0,activo:true,creado:new Date().toISOString()});
    save(); closeModal(); renderAll();
  };
}
function unassign(f){
  db.matches.forEach(m=>{if(m.field===f&&m.activo)m.activo=false;});
  save(); closeModal(); renderAll();
}

/* ---------- Pagos ---------- */
function openPay(teamId,matchId){
  const t=teamById(teamId); if(!t) return;
  const m=matchById(matchId);
  const b=balance(teamId);
  const pays=db.payments.filter(p=>p.teamId===teamId).sort((x,y)=>String(y.fecha).localeCompare(String(x.fecha)));
  const ins=Number(db.config.inscripcion)||0;
  const adeudo=b.insPend+b.arbPend;
  openModal(`<form id="pay-form">
    <h3>Pago · ${esc(t.name)}</h3>
    <p class="muted">${m?`Cancha ${m.field}`:'Sin partido asignado (se guarda sin cancha)'}</p>
    <label>¿Cuánto está pagando?<input class="montoGrande" name="monto" id="p-monto" type="number" min="1" step="1" required value="${ins}"></label>
    <div class="resumen" id="p-res">
      <div><small>Adeudo total</small><b>${money(adeudo)}</b></div>
      <div><small>Número de juego</small><b>${t.registroDesde?t.juegoActual:'—'}</b></div>
    </div>
    <label>Tipo de pago
      <select name="tipo" id="p-tipo">
        <option value="inscripcion">Inscripción</option>
        <option value="arbitraje">Arbitraje</option>
      </select>
    </label>
    <div class="lbl">Quién lo recibió</div>
    <div class="cuadros" id="p-recibe">
      ${db.config.recibieron.map(n=>`<button type="button" class="sq" data-n="${esc(n)}">${esc(n)}</button>`).join('')}
    </div>
    <input type="hidden" name="recibio" id="p-recibio" value="">
    <div class="lbl">Método</div>
    <div class="switchrow">
      <span>Efectivo</span>
      <label class="switch"><input type="checkbox" id="p-met"><span class="slider"></span></label>
      <span>Transferencia</span>
    </div>
    <input type="hidden" name="metodo" id="p-metodo" value="efectivo">
    <label id="p-cuenta-l" style="display:none">Cuenta donde se pagó<input name="cuenta" list="dl-cta" autocomplete="off"></label>
    <label>Fecha<input name="fecha" type="date" required value="${today()}"></label>
    <label>Nota (opcional)<input name="nota" autocomplete="off"></label>
    <datalist id="dl-cta">${optionsList(cuentasList())}</datalist>
    <div class="actions">
      <button type="button" class="btn ghost" data-act="close">Cancelar</button>
      <button class="btn primary">Guardar pago</button>
    </div>
    <h4>Pagos de este equipo</h4>
    ${pays.length?`<ul class="plist">${pays.map(p=>`<li>
      <span>${esc(p.fecha)} · ${p.tipo==='inscripcion'?'Inscripción':'Arbitraje'} · <b>${money(p.monto)}</b><br>
      <small>${esc(p.recibio)} · ${p.metodo==='transferencia'?'Transferencia':'Efectivo'}${p.cuenta?' · '+esc(p.cuenta):''}${p.nota?' · '+esc(p.nota):''}</small></span>
      <button type="button" class="btn danger sm" data-act="delpay" data-id="${p.id}" data-team="${teamId}" data-match="${matchId||''}">Borrar</button>
    </li>`).join('')}</ul>`:'<p class="muted">Aún no hay pagos.</p>'}
  </form>`);
  $('#p-tipo').onchange=e=>{$('#p-monto').value=e.target.value==='inscripcion'?(Number(db.config.inscripcion)||0):(Number(db.config.arbitraje)||0);};
  // Quién recibe: cuadros (uno solo seleccionado)
  $('#p-recibe').onclick=e=>{
    const b=e.target.closest('[data-n]'); if(!b) return;
    $('#p-recibio').value=b.dataset.n;
    document.querySelectorAll('#p-recibe .sq').forEach(x=>x.classList.toggle('on',x===b));
  };
  // Método: interruptor efectivo / transferencia
  $('#p-met').onchange=e=>{
    const tr=e.target.checked;
    $('#p-metodo').value=tr?'transferencia':'efectivo';
    $('#p-cuenta-l').style.display=tr?'block':'none';
  };
  $('#pay-form').onsubmit=e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const monto=Number(fd.get('monto'));
    if(!(monto>0)){alert('El monto debe ser mayor a 0');return;}
    if(!fd.get('recibio')){alert('Elige quién lo recibió');return;}
    if(!t.registroDesde){
      // Primera vez: se guarda en qué juego va el equipo y desde cuándo cuenta el arbitraje
      const desde=Number(fd.get('desde'));
      if(!(desde>=1&&desde<=db.config.totalJuegos)){alert(`El juego en el que va el equipo debe estar entre 1 y ${db.config.totalJuegos}`);return;}
      t.desdeJuego=desde;
      t.juegoActual=desde;
      t.registroDesde=new Date().toISOString();
    }
    db.payments.push({
      id:uid(),teamId,matchId:matchId||null,
      tipo:fd.get('tipo'),monto,
      recibio:String(fd.get('recibio')).trim(),
      metodo:String(fd.get('metodo')),
      cuenta:String(fd.get('cuenta')||'').trim(),
      fecha:fd.get('fecha'),
      nota:String(fd.get('nota')||'').trim(),
      creado:new Date().toISOString()
    });
    save(); closeModal(); renderAll();
  };
}
const SILBATO='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 9h12l5-4v14l-5-4H2z"/><circle cx="19" cy="12" r="1.8"/></svg>';
function openTerminar(mid){
  const m=matchById(mid); if(!m) return;
  const arbs=db.config.arbitros||[];
  openModal(`<form id="tp-form">
    <h3>Terminar partido · Cancha ${m.field}</h3>
    <div class="marcador"><b>${esc(teamName(m.a))}</b><span>${m.sa||0} – ${m.sb||0}</span><b>${esc(teamName(m.b))}</b></div>
    <label>Árbitro
      <select name="arbitro" id="tp-arb">
        ${arbs.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('')}
        <option value="__nuevo__">+ Agregar árbitro nuevo</option>
      </select>
    </label>
    <label id="tp-nuevo-l" style="display:none">Nombre del árbitro nuevo<input name="nuevo" autocomplete="off"></label>
    <p id="tp-err" class="pend"></p>
    <div class="actions">
      <button type="button" class="btn ghost" data-act="close">Cancelar</button>
      <button class="btn primary">Terminar partido</button>
    </div>
  </form>`);
  const sel=$('#tp-arb'), nl=$('#tp-nuevo-l');
  const toggle=()=>{nl.style.display=sel.value==='__nuevo__'?'block':'none';};
  sel.onchange=toggle;
  if(!arbs.length) sel.value='__nuevo__';
  toggle();
  $('#tp-form').onsubmit=e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    let arb=String(fd.get('arbitro')||'');
    if(arb==='__nuevo__') arb=String(fd.get('nuevo')||'').trim();
    if(!arb){$('#tp-err').textContent='Elige o escribe el árbitro.';return;}
    if(!db.config.arbitros.some(a=>norm(a)===norm(arb))) db.config.arbitros.push(arb);
    m.terminado=true;
    // Cada equipo avanza al siguiente juego al terminar su partido
    [teamById(m.a),teamById(m.b)].forEach(t=>{if(t?.juegoActual) t.juegoActual=Math.min(db.config.totalJuegos,t.juegoActual+1);});
    m.activo=false;
    m.resultado={a:m.sa||0,b:m.sb||0};
    m.arbitro=arb;
    m.terminadoEn=new Date().toISOString();
    save(); closeModal(); renderAll();
  };
}
function partidosTerminadosHTML(){
  const ts=db.matches.filter(m=>m.terminado).sort((a,b)=>String(b.terminadoEn).localeCompare(String(a.terminadoEn)));
  return `<h3>Partidos terminados</h3><div class="scroll"><table>
    <tr><th>Cancha</th><th>Equipos</th><th>Marcador</th><th>Árbitro</th></tr>
    ${ts.length?ts.map(m=>`<tr><td>${m.field}</td>
      <td>${esc(teamName(m.a))} vs ${esc(teamName(m.b))}</td>
      <td>${m.resultado?m.resultado.a:0} – ${m.resultado?m.resultado.b:0}</td>
      <td>${esc(m.arbitro||'—')}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">Aún no hay partidos terminados</td></tr>'}

}
function deletePayment(id,teamId,matchId){
  if(!confirm('¿Borrar este pago?')) return;
  db.payments=db.payments.filter(p=>p.id!==id);
  save(); renderAll();
  openPay(teamId,matchId);
}

    list.length?list.map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right">${money(v)}</td></tr>`).join(''):'<tr><td class="muted">Sin pagos</td></tr>'

      <div><small>Arbitrajes</small><b>${money(totArb)}</b></div>
      <div><small>Pendiente total</small><b class="${pend?'pend':'ok'}">${money(pend)}</b></div>
    </div>
    <h3>Saldo por equipo</h3>
    <div class="scroll"><table>
      <tr><th>Equipo</th><th>Inscripción</th><th>Arbitraje</th><th>Pendiente</th></tr>
      ${rows.length?rows.map(({t,b})=>`<tr>
        <td>${esc(t.name)}</td>
        <td>${money(b.insP)} / ${money(b.insDue)}</td>
        <td>${money(b.arbP)} / ${money(b.arbDue)} <small class="muted">(${b.ms} juego${b.ms===1?'':'s'})</small></td>
        <td class="${b.insPend+b.arbPend?'pend':'ok'}">${money(b.insPend+b.arbPend)}</td>
      </tr>`).join(''):'<tr><td colspan="4" class="muted">Sin equipos</td></tr>'}
    </table></div>
    ${partidosTerminadosHTML()}
    <h3>Historial de pagos</h3>
    <div class="scroll"><table>
      <tr><th>Fecha</th><th>Equipo</th><th>Tipo</th><th>Cancha</th><th>Monto</th><th>Recibió</th><th>Cuenta</th></tr>

        <td>${esc(p.recibio)}</td><td>${esc(p.cuenta)}</td></tr>`;}).join(''):'<tr><td colspan="7" class="muted">Sin pagos registrados</td></tr>'}
    </table></div>
    ${mini('Recibido por persona',byKey('recibio'))}
    ${mini('Recibido por cuenta',byKey('cuenta'))}`;
}

/* ---------- Equipos ---------- */
let draft=null; // equipo en edición: {id,name,players:[],lider}
function openTeam(id,presetName=''){
  const t=id?teamById(id):null;
  draft={id:t?t.id:null,name:t?t.name:presetName,players:t?[...t.players]:[],lider:t?t.lider:null};
  openModal(`<form id="tm-form" onsubmit="return false">
    <h3>${t?'Editar equipo':'Nuevo equipo'}</h3>
    <label>Nombre del equipo<input id="tm-name" autocomplete="off" value="${esc(draft.name)}"></label>
    <label>Jugadores (el primero es el líder, quien paga)</label>
    <div class="addrow">
      <input id="tm-pl" autocomplete="off" placeholder="Nombre del jugador">
      <button type="button" class="btn primary sm" data-act="addplayer">Agregar</button>
    </div>
    <ul class="plist" id="tm-list"></ul>
    <p id="tm-err" class="pend"></p>
    <div class="actions">
      <button type="button" class="btn ghost" data-act="close">Cancelar</button>
      <button type="button" class="btn primary" data-act="saveteam">Guardar equipo</button>
    </div>
  </form>`);
  $('#tm-name').addEventListener('input',()=>{
    const term=norm($('#tm-name').value.trim());
    const hits=term?db.teams.filter(t=>t.id!==draft.id&&norm(t.name).includes(term)).map(t=>t.name):[];
    $('#tm-err').textContent=hits.length?`Ya existe: ${hits.join(', ')}. Usa ese equipo.`:'';
  });
  renderDraft();
  $('#tm-pl').focus();
}
function renderDraft(){
  const list=$('#tm-list'); if(!list) return;
  list.innerHTML=draft.players.length?draft.players.map((p,i)=>`<li>
    <span>${esc(p)}${p===draft.lider?' <b>· LÍDER (paga)</b>':''}</span>
    <span class="rowbtns">
      ${p===draft.lider?'':`<button type="button" class="btn ghost sm" data-act="lider" data-i="${i}">Hacer líder</button>`}
      <button type="button" class="btn danger sm" data-act="quitarj" data-i="${i}">Quitar</button>
    </span></li>`).join(''):'<li class="muted">Aún no hay jugadores.</li>';
}
function addPlayerDraft(){
  const inp=$('#tm-pl');
  const name=inp.value.trim();
  if(!name) return;
  if(draft.players.some(p=>norm(p)===norm(name))){$('#tm-err').textContent='Ese jugador ya está en la lista.';return;}
  draft.players.push(name);
  if(!draft.lider) draft.lider=name;
  inp.value=''; $('#tm-err').textContent='';
  renderDraft(); inp.focus();
}
function saveDraft(){
  const name=$('#tm-name').value.trim();
  if(!name){$('#tm-err').textContent='Escribe el nombre del equipo.';return;}
  if(db.teams.some(t=>t.id!==draft.id&&norm(t.name)===norm(name))){
    $('#tm-err').textContent='Ya existe un equipo con ese nombre. Búscalo y úsalo; no lo registres otra vez.';
    return;
  }
  if(!draft.players.length){$('#tm-err').textContent='Agrega al menos un jugador (el líder).';return;}
  const data={name,players:[...draft.players],lider:draft.lider||draft.players[0]};
  const t=draft.id?teamById(draft.id):null;
  if(t) Object.assign(t,data); else db.teams.push({id:uid(),...data});
  draft=null; save(); closeModal(); renderAll();
}
function deleteTeam(id){
  const t=teamById(id); if(!t) return;
  if(matchesOf(id).length||db.payments.some(p=>p.teamId===id)){
    alert(`${t.name} tiene partidos o pagos registrados, no se puede borrar.`);return;
  }
  if(!confirm(`¿Borrar el equipo ${t.name}?`)) return;
  db.teams=db.teams.filter(x=>x.id!==id);
  save(); renderAll();
}
function renderTeams(){
  $('#teams-list').innerHTML=db.teams.length?db.teams.map(t=>`<div class="card team">
    <div><b>${esc(t.name)}</b><br><small class="muted">Líder (paga): ${esc(t.lider||'—')}</small><br><small class="muted">${t.players.length} jugador${t.players.length===1?'':'es'}${t.players.length?': '+esc(t.players.join(', ')):''}</small></div>
    <div class="actions" style="margin-top:0">
      <button class="btn ghost sm" data-act="editteam" data-id="${t.id}">Editar</button>
      <button class="btn danger sm" data-act="delteam" data-id="${t.id}">Borrar</button>
    </div></div>`).join(''):'<p class="muted">Aún no hay equipos. Agrega el primero.</p>';
}

/* ---------- Ajustes ---------- */
function renderAjustes(){
  $('#ajustes').innerHTML=`
    <form id="aj-form" class="card">
      <h3>Montos</h3>
      <label>Inscripción (por equipo)<input name="inscripcion" type="number" min="0" value="${Number(db.config.inscripcion)||0}"></label>
      <label>Arbitraje (por equipo y por juego)<input name="arbitraje" type="number" min="0" value="${Number(db.config.arbitraje)||0}"></label>
      <label>Total de juegos del torneo<input name="totalJuegos" type="number" min="1" value="${Number(db.config.totalJuegos)||15}"></label>
      <h3>Sugerencias al registrar pagos</h3>
      <label>Personas que reciben (separadas por coma)<input name="recibieron" autocomplete="off" value="${esc(db.config.recibieron.join(', '))}"></label>
      <label>Árbitros (separados por coma)<input name="arbitros" autocomplete="off" value="${esc(db.config.arbitros.join(', '))}"></label>
      <label>Cuentas (separadas por coma)<input name="cuentas" autocomplete="off" value="${esc(db.config.cuentas.join(', '))}"></label>
      <div class="actions"><button class="btn primary">Guardar ajustes</button></div>
    </form>
    <div class="card">
      <h3>Respaldo</h3>
      <p class="muted">Los datos se guardan en este navegador. Exporta un respaldo para no perderlos o llevarlos a otra computadora.</p>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn ghost" data-act="export">Exportar respaldo</button>
        <input type="file" id="imp" accept="application/json,.json">
      </div>
    </div>`;
  $('#aj-form').onsubmit=e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const list=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
    db.config.inscripcion=Math.max(0,Number(fd.get('inscripcion'))||0);
    db.config.arbitraje=Math.max(0,Number(fd.get('arbitraje'))||0);
    db.config.totalJuegos=Math.max(1,Number(fd.get('totalJuegos'))||15);
    db.config.recibieron=list(fd.get('recibieron'));
    db.config.arbitros=list(fd.get('arbitros'));
    db.config.cuentas=list(fd.get('cuentas'));
    save(); renderAll(); alert('Ajustes guardados');
  };
  $('#imp').onchange=e=>{
    const file=e.target.files[0]; if(!file) return;
    if(!confirm('Esto reemplaza los datos actuales de este navegador. ¿Continuar?')){e.target.value='';return;}
    file.text().then(txt=>{
      const d=JSON.parse(txt);
      if(!Array.isArray(d.teams)||!Array.isArray(d.matches)||!Array.isArray(d.payments)) throw new Error('formato');
      db={...clone(DEF),...d,config:{...DEF.config,...(d.config||{})}};
      save(); renderAll(); renderAjustes(); alert('Respaldo importado');
    }).catch(()=>alert('El archivo no es un respaldo válido.'));
  };
}
function exportDb(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`canchas-respaldo-${today()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---------- Buscador ---------- */
const q=$('#q');
function renderResults(){
  const box=$('#results');
  const term=norm(q.value.trim());
  if(!term){box.classList.remove('show');box.innerHTML='';return;}
  const hits=[];
  db.teams.forEach(t=>{
    const teamHit=norm(t.name).includes(term);
    const ph=t.players.find(p=>norm(p).includes(term));
    if(teamHit||ph) hits.push({t,player:teamHit?null:ph});
  });
  box.innerHTML=hits.length?hits.slice(0,30).map(({t,player})=>{
    const am=teamActiveMatch(t.id);
    return `<button data-act="pickresult" data-team="${t.id}"><b>${esc(t.name)}</b>${player?` · ${esc(player)}`:''}<br><small>${am?`Cancha ${am.field}`:'Sin partido asignado'}</small></button>`;
  }).join(''):`<div class="empty-res">No hay equipos ni jugadores con ese nombre.</div>
    <button class="addteam" data-act="addteam" data-name="${esc(q.value.trim())}">+ AGREGAR EQUIPO</button>`;
  box.classList.add('show');
}
function pickResult(tid){
  q.value='';
  $('#results').classList.remove('show');
  openPay(tid,teamActiveMatch(tid)?.id||null);
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='modal-bg'){closeModal();return;}
  if(!e.target.closest('.search')) $('#results').classList.remove('show');
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const d=el.dataset;
  switch(d.act){
    case 'tab': showTab(d.tab); break;
    case 'pay': openPay(d.team,d.match||null); break;
    case 'score': changeScore(d.match,d.side,1); break;
    case 'unscore': changeScore(d.match,d.side,-1); break;
    case 'assign': openAssign(Number(d.field)); break;
    case 'unassign': unassign(Number(d.field)); break;
    case 'newteam': openTeam(null); break;
    case 'editteam': openTeam(d.id); break;
    case 'delteam': deleteTeam(d.id); break;
    case 'delpay': deletePayment(d.id,d.team,d.match||null); break;
    case 'close': closeModal(); break;
    case 'terminar': openTerminar(d.match); break;
    case 'addplayer': addPlayerDraft(); break;
    case 'lider': draft.lider=draft.players[+d.i]; renderDraft(); break;
    case 'quitarj': {const r=draft.players.splice(+d.i,1)[0]; if(draft.lider===r) draft.lider=draft.players[0]||null; renderDraft(); break;}
    case 'saveteam': saveDraft(); break;
    case 'pickresult': pickResult(d.team); break;
    case 'addteam': q.value=''; $('#results').classList.remove('show'); openTeam(null,d.name); break;
    case 'export': exportDb(); break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter'&&e.target.id==='tm-pl'){e.preventDefault();addPlayerDraft();}
});
