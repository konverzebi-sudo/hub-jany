<!DOCTYPE html>
<html lang="es">
<head>
<script src="/js/hub-tenant.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jefe de Herramientas — JefesHub</title>
<link rel="icon" type="image/png" href="/img/favicon-180.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Piel clara = mismos tokens que Jefe Productor IA, Jefe 366, Contenido y Anuncios */
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F3F3F3;
    --line:#E2E2E2;
    --text:#1A1A1A;
    --text-dim:#5F5F5F;
    --accent:#C0F800;
    --accent-soft:#F1FFC2;
    --accent-text:#4E7A00;
    --navy:#10103A;
    --shadow-card:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06);
    --adq:#6366F1;
    --con:#0EA5E9;
    --conv:#16A34A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;padding:28px 16px 80px;}
  h1,h2,.display{font-family:'Sora',sans-serif;}
  .wrap{max-width:1400px;margin:0 auto;}
  .page-header{text-align:center;padding-top:62px;}
  h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin:0 0 8px;line-height:1.15;}
  /* Barra fija: se queda visible arriba al hacer scroll (pill + nombre del Jefe) */
  .topbar{position:fixed;top:0;left:0;right:0;height:70px;z-index:60;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);}
  .topbar h1{justify-self:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:clamp(20px,2.6vw,28px);}
  .back-link{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;color:var(--text-dim);text-decoration:none;padding:7px 16px;border:1px solid var(--line);border-radius:100px;background:var(--surface);transition:.15s;}
  .back-link:hover{border-color:var(--accent);color:var(--accent-text);}
  /* Scrollbar delgada y discreta */
  *{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.22) transparent;}
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:8px;}
  *::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.36);}

  /* HERO */
  .hero-icon{width:88px;height:88px;margin:0 auto 14px;border-radius:24px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:var(--shadow-card);}
  .seccion-intro{color:var(--text-dim);font-size:16px;margin:0 auto 34px;max-width:640px;text-align:center;line-height:1.55;}

  /* SECCIONES */
  .seccion{margin:0 0 44px;}
  .seccion-h{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(22px,3vw,28px);margin:0 0 18px;}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:18px;align-items:start;}
  .item-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--horizon,var(--adq));border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-card);}

  /* TARJETAS DE APP */
  .app-head{display:flex;align-items:center;gap:12px;}
  .app-nombre{font-family:'Sora',sans-serif;font-weight:800;font-size:18px;}
  .app-desc{margin:-4px 0 0;font-size:14.5px;color:var(--text-dim);line-height:1.4;}
  /* Logos oficiales (img/apps/*.png). Los transparentes (glifo) llevan marco blanco; los de tarjeta completa llenan el cuadro. */
  .app-logo-img{width:40px;height:40px;border-radius:11px;flex-shrink:0;object-fit:cover;display:block;}
  .app-logo-img.glifo{object-fit:contain;padding:6px;background:#fff;border:1px solid var(--line);}
  /* Apps sin logo en el repo: emoji en cuadro lima suave */
  .app-logo-emoji{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--accent-soft);border:1px solid #CDE98A;}
  .app-links{display:flex;gap:8px;flex-wrap:wrap;}
  .app-links a{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;padding:8px 16px;border-radius:100px;border:1px solid #CFCFCF;background:var(--surface);color:#333;text-decoration:none;transition:.15s;}
  .app-links a:hover{border-color:var(--accent-text);color:var(--accent-text);background:var(--accent-soft);}
</style>
<link rel="stylesheet" href="/css/plataforma-dash.css">
</head>
<body>
<div class="topbar">
  <a id="back-hub" href="/" class="back-link">&lt;&lt; Hub de Jefes <span style="opacity:.4;">//</span> <span id="brand-marca-label">—</span></a>
  <h1>Jefe de Herramientas</h1>
</div>
<div class="wrap" id="wrap">
  <script>(function(){var b=window.__hub.slug!=='jefeshub'?'/'+window.__hub.slug:null;if(b)document.getElementById('back-hub').href=b;})();</script>
  <script src="/js/storage-client.js"></script>
  <script>(async function(){
    var BRANDS=window.__hub.marcas({'rancho-seco':{fallback:'Rancho Seco',color:'#F2C230'},'rim':{fallback:'RIM',color:'#F472B6'},'optica-one':{fallback:'Óptica One',color:'#38BDF8'},'jefeshub':{fallback:'JefesHub',color:'#B8F725'}});
    var key=window.__hub.slug;
    var b=BRANDS[key];var el=document.getElementById('brand-marca-label');
    el.textContent=b.fallback;
    var bar=document.getElementById('back-hub');
    bar.style.color='#1A1A1A';bar.style.borderColor=b.color;
    try{var r=await window.storage.get(key+':brand-book.identidad');if(r&&r.value){var d=JSON.parse(r.value);if(d.nombre)el.textContent=d.nombre;}}catch(e){}
  })();</script>

  <div class="page-header">
    <div class="hero-icon" aria-hidden="true">🧰</div>
  </div>
  <p class="seccion-intro">Todas las apps que necesitas para atender, publicar y editar desde tu celular. Elige tu tienda (iPhone o Android) y te lleva directo a la descarga oficial.</p>

  <div id="content"></div>
</div>

<script>
function escHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

// logo = archivo en /img/apps/ · emoji = apps sin logo en el repo · glifo = logo transparente (lleva marco blanco)
const APPS_REDES = [
  { nombre: 'WhatsApp Business', emoji: '💬', desc: 'Para atender clientes, mandar catálogo y respuestas rápidas.', links: [
    ['App Store', 'https://apps.apple.com/us/app/whatsapp-business/id1386412985'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.whatsapp.w4b'] ] },
  { nombre: 'Facebook', emoji: '📘', desc: 'Para publicar en tu página y responder mensajes y comentarios.', links: [
    ['App Store', 'https://apps.apple.com/us/app/facebook/id284882215'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.facebook.katana'] ] },
  { nombre: 'Instagram', emoji: '📸', desc: 'Para subir historias, reels y publicaciones, y ver tus mensajes.', links: [
    ['App Store', 'https://apps.apple.com/us/app/instagram/id389801252'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.instagram.android'] ] },
  { nombre: 'Anuncios de Facebook', emoji: '📢', desc: 'Administrador de anuncios (Meta Ads): revisa y ajusta tus campañas.', links: [
    ['App Store', 'https://apps.apple.com/us/app/meta-ads-manager/id964397083'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.facebook.adsmanager'] ] },
  { nombre: 'TikTok', emoji: '🎵', desc: 'Para publicar tus videos cortos y llegar a audiencia nueva.', links: [
    ['App Store', 'https://apps.apple.com/us/app/tiktok/id835599320'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.zhiliaoapp.musically'] ] },
];

const APPS_EDITAR = [
  { nombre: 'CapCut', logo: 'capcut', glifo: true, links: [
    ['App Store', 'https://apps.apple.com/us/app/capcut-photo-video-editor/id1500855883'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.lemon.lvoverseas'],
    ['Web', 'https://www.capcut.com/'] ] },
  { nombre: 'Edits (Instagram)', logo: 'edits', glifo: false, links: [
    ['App Store', 'https://apps.apple.com/us/app/edits-an-instagram-app/id6738967378'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.instagram.basel'] ] },
  { nombre: 'Canva', logo: 'canva', glifo: false, links: [
    ['App Store', 'https://apps.apple.com/us/app/canva-ai-photo-video-editor/id897446215'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.canva.editor'],
    ['Web', 'https://www.canva.com/'] ] },
];

const APPS_IA = [
  { nombre: 'Gemini', logo: 'gemini', glifo: true, links: [
    ['App Store', 'https://apps.apple.com/us/app/google-gemini/id6477489729'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.google.android.apps.bard'],
    ['Web', 'https://gemini.google.com/'] ] },
  { nombre: 'ChatGPT', logo: 'chatgpt', glifo: true, links: [
    ['App Store', 'https://apps.apple.com/us/app/chatgpt/id6448311069'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.openai.chatgpt'],
    ['Web', 'https://chatgpt.com/'] ] },
  { nombre: 'ElevenLabs', logo: 'elevenlabs', glifo: true, desc: 'Para generar audio.', links: [
    ['Web', 'https://join.elevenlabs.io/es'] ] },
  { nombre: 'Higgsfield', logo: 'higgsfield', glifo: false, desc: 'Producción de video pro con IA.', links: [
    ['Web', 'https://higgsfield.ai/'] ] },
];

const HORIZONTES = ['var(--adq)', 'var(--con)', 'var(--conv)', '#C0F800', 'var(--navy)'];

function tarjetasApps(lista){
  return `<div class="cards-grid">${lista.map((a, i) => `
    <div class="item-card" style="--horizon:${HORIZONTES[i % HORIZONTES.length]}">
      <div class="app-head">${a.logo
        ? `<img class="app-logo-img${a.glifo ? ' glifo' : ''}" src="/img/apps/${a.logo}.png" alt="${escHtml(a.nombre)}" width="40" height="40" loading="lazy">`
        : `<div class="app-logo-emoji" aria-hidden="true">${a.emoji}</div>`}<div class="app-nombre">${escHtml(a.nombre)}</div></div>
      ${a.desc ? `<p class="app-desc">${escHtml(a.desc)}</p>` : ''}
      <div class="app-links">${a.links.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${escHtml(t)}</a>`).join('')}</div>
    </div>`).join('')}</div>`;
}

document.getElementById('content').innerHTML = `
  <section class="seccion"><h2 class="seccion-h">💬 Apps para atender y vender</h2>${tarjetasApps(APPS_REDES)}</section>
  <section class="seccion"><h2 class="seccion-h">📱 Apps para editar</h2>${tarjetasApps(APPS_EDITAR)}</section>
  <section class="seccion"><h2 class="seccion-h">✨ Apps para editar con IA</h2>${tarjetasApps(APPS_IA)}</section>`;
</script>
<script src="/js/jefes-nav.js" defer></script>
</body>
</html>
