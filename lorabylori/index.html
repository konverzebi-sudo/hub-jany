<style>
/* Layout: una columna centrada tipo app; tarjeta apilada al centro, acciones debajo. Marca Hub de Jefes: lima + negro + grises claros */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --fg:#151515; --muted:#5F5F5A; --line:#E6E6E1; --green:#5E7A00;
  --lime:#C4F000; --lime-soft:#EEF9C8; --ink:#151515; --on-ink:#FFFFFF;
  --accent:#151515; --accent-soft:#EFEFEC; --tag:#5E7300;
  --ok:#151515; --ok-soft:#E4F7A6; --no:#151515; --no-soft:#EFEFEC;
  --shadow:0 2px 0 rgba(20,20,20,.04),0 18px 44px -18px rgba(20,20,20,.22);
  --display:"Inter Tight","Arial Black",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E0E; --surface:#1A1A1A; --fg:#F2F2EE; --muted:#9C9C95; --line:#2E2E2C;
  --lime-soft:#2B3410; --green:#C4F000; --ink:#F2F2EE; --on-ink:#111111;
  --accent:#F2F2EE; --accent-soft:#262626; --tag:#C4F000;
  --ok:#C4F000; --ok-soft:#2B3410; --no:#F2F2EE; --no-soft:#262626;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#1A1A1A; --fg:#F2F2EE; --muted:#9C9C95; --line:#2E2E2C;
  --lime-soft:#2B3410; --green:#C4F000; --ink:#F2F2EE; --on-ink:#111111;
  --accent:#F2F2EE; --accent-soft:#262626; --tag:#C4F000;
  --ok:#C4F000; --ok-soft:#2B3410; --no:#F2F2EE; --no-soft:#262626;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding-inline:16px;padding-block:0;overflow-x:hidden}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:18px 28px;min-height:100%}
header{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand h1{font:900 26px/1.02 var(--display);letter-spacing:-.025em;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand small{display:inline-block;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);border:1.5px solid var(--lime);border-radius:999px;padding:4px 12px;margin-bottom:10px}
.tools{display:flex;align-items:center;gap:10px}
.theme{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.theme:hover{border-color:var(--lime)}
.theme svg{width:17px;height:17px}
.theme .sun{display:none}
:root[data-dark="1"] .theme .sun{display:block}:root[data-dark="1"] .theme .moon{display:none}
.frame.broken::after{content:"No se pudo cargar este link";position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:#151515;color:#C4F000;font:500 12px var(--mono)}
.frame video,.frame iframe{width:100%;height:100%;object-fit:cover;display:block;border:0;background:#000}
.card{border:1px solid var(--line)}
.brand h1 .g{background:var(--lime);color:#151515;padding:0 .18em;border-radius:.18em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.count{color:var(--green)!important;font-weight:500}
.when{color:var(--green)!important}
.title{color:var(--fg)}
.lbl{color:var(--green)!important}
.hint{color:var(--muted)}
.count{font:500 12px var(--mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lime);transition:width .35s ease}

.stage{position:relative;flex:1;min-height:560px}
.card{position:absolute;inset:0;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;will-change:transform}
.card.back{transform:scale(.95) translateY(14px);opacity:.6;pointer-events:none}
.card.fly{transition:transform .4s ease,opacity .4s ease}
.media{position:relative;flex:none;background:#000;display:flex;justify-content:center;overflow:hidden}
.media .frame{position:relative;width:100%;max-width:100%;overflow:hidden}
.frame.r45{aspect-ratio:4/5;max-height:46vh;width:auto;height:46vh}
.frame.r916{aspect-ratio:9/16;height:46vh;width:auto}
.frame.r11{aspect-ratio:1/1;height:46vh;width:auto;max-width:100%}
.frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.track{display:flex;height:100%;transition:transform .3s ease}
.track img{flex:0 0 100%}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:5px;justify-content:center}
.dots b{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.dots b.on{background:#fff}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center}
.nav.l{left:8px}.nav.r{right:8px}
.badge{position:absolute;top:10px;left:10px;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;padding:4px 8px;border-radius:6px}
.reel img{animation:kb 8s ease-in-out infinite alternate;transform-origin:60% 60%}
@keyframes kb{from{transform:scale(1.05)}to{transform:scale(1.22) translateX(-4%)}}
@media (prefers-reduced-motion:reduce){.reel img{animation:none}.card.fly,.track,.bar i{transition:none}}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.play span{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center}
.play span::after{content:"";border-left:18px solid #1E1A17;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.hl{background:#151515;display:grid;place-items:center;width:100%;height:100%}
.hl svg{width:58%;height:auto}
.stamp{position:absolute;top:22px;font:800 26px var(--display);letter-spacing:.04em;padding:4px 12px;border:3px solid;border-radius:8px;opacity:0;transform:rotate(-12deg);pointer-events:none;background:rgba(255,255,255,.12)}
.stamp.ok{left:18px;color:#151515;border-color:#C4F000;background:#C4F000}
.stamp.no{right:18px;color:#fff;border-color:#151515;background:#151515;transform:rotate(12deg)}

.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1;overflow:auto}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:600 11.5px var(--body);padding:3px 10px;border-radius:999px;background:var(--lime);color:#151515}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.when{font:500 12px var(--mono);color:var(--fg);margin-left:auto;font-variant-numeric:tabular-nums}
.title{font:700 17px/1.2 var(--display);margin:0;text-wrap:balance}
.caption{white-space:pre-line;font-size:14px;color:var(--fg);margin:0;overflow-wrap:anywhere}
.caption .tag{color:var(--tag);font-weight:500}

.actions{display:flex;justify-content:center;align-items:center;gap:22px}
.btn{border:0;cursor:pointer;font:600 14px var(--body)}
.round{width:64px;height:64px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .15s}
.round:hover{transform:scale(1.06)}
.round:focus-visible,.btn:focus-visible,.nav:focus-visible{outline:3px solid var(--tag);outline-offset:3px}
.round.no{background:#151515;color:#C4F000}.round.ok{background:var(--lime);color:#151515}
.round svg{width:28px;height:28px}
.undo{width:44px;height:44px;border-radius:50%;background:var(--lime-soft);border:0;color:#151515;display:grid;place-items:center}
.undo:disabled{opacity:.35;cursor:default}
.hint{text-align:center;font-size:12px;color:var(--muted);margin:0}

.sheet-bg{position:fixed;inset:0;background:rgba(15,10,6,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-inline:0}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.sheet h2{font:800 19px var(--display);margin:0}
.sheet p.sub{margin:-8px 0 0;color:var(--muted);font-size:13px}
.lbl{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.reasons{display:flex;flex-wrap:wrap;gap:8px}
.reasons input{position:absolute;opacity:0;pointer-events:none}
.reasons label{padding:7px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13.5px}
.reasons input:checked+label{background:var(--lime);border-color:var(--lime);color:#151515;font-weight:600}
.reasons input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);padding:10px 12px;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.field{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px}
.row .btn{flex:1;padding:13px;border-radius:12px}
.primary{background:var(--ink);color:var(--on-ink)}
.ghost{background:transparent;border:1px solid var(--line)!important;color:var(--fg)}
.err{color:var(--no);font-size:13px;margin:0}

.done{display:flex;flex-direction:column;gap:14px}
.done h2{font:800 24px/1.1 var(--display);margin:0}
.tally{display:flex;gap:10px}
.tally div{flex:1;background:var(--surface);border-radius:14px;padding:12px 14px}
.tally b{display:block;font:800 28px var(--display);font-variant-numeric:tabular-nums}
.tally .o{background:var(--lime)!important}.tally .o b,.tally .o span{color:#151515}
.tally span{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;background:var(--surface);border-radius:14px;padding:10px;align-items:flex-start}
.item img,.item .ph{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:none;background:#151515}
.item .t{min-width:0;display:flex;flex-direction:column;gap:3px}
.item .t strong{font-size:14px}
.pill{align-self:flex-start;font:600 11px var(--body);padding:2px 8px;border-radius:999px}
.pill.ok{background:var(--lime);color:#151515}.pill.no{background:var(--accent-soft);color:var(--fg);border:1px solid var(--line)}
.item .fb{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:0}
.restart{align-self:flex-start;padding:10px 16px;border-radius:10px;background:var(--fg);color:var(--bg)}
@media (max-height:720px){.frame.r45,.frame.r916,.frame.r11{height:40vh}.stage{min-height:520px}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <div><small>Hub de Jefes // Lora by Lori</small><h1>Revisión de <span class="g">contenido</span></h1></div>
      <div class="tools"><span class="count" id="count">1 / 5</span><button class="theme" id="theme" type="button" aria-label="Cambiar a modo claro u oscuro"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
    </div>

  </header>

  <main id="main">
    <div class="stage" id="stage"></div>

      <button class="btn undo" id="undo" aria-label="Deshacer la última decisión" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button class="btn round no" id="btnNo" aria-label="No aprobar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>

      </button>
      <span style="width:44px"></span>
    </div>
    <p class="hint" style="margin-top:10px">Desliza a la derecha para aprobar, a la izquierda si quieres cambios.</p>
  </main>
  <section id="done" class="done" hidden></section>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <form class="sheet" id="sheet" novalidate>
    <h2>¿Qué cambiarías?</h2>
    <p class="sub" id="sheetFor"></p>
    <div class="field">
      <span class="lbl">Lo que no te convence</span>
      <div class="reasons" id="reasons"></div>
    </div>
    <div class="field">
      <label class="lbl" for="fbChange">¿Qué mejorarías?</label>
      <textarea id="fbChange" placeholder="Ej. El copy está muy largo, quiero algo más directo"></textarea>
    </div>
    <div class="field">
      <label class="lbl" for="fbIdea">Tu propuesta (opcional)</label>
      <textarea id="fbIdea" placeholder="Ej. Usar una foto del caballo en competencia en lugar del atardecer"></textarea>
    </div>
    <p class="err" id="err" hidden>Marca al menos un motivo o escribe qué mejorarías.</p>
    <div class="row">
      <button type="button" class="btn ghost" id="cancel">Volver</button>
      <button type="submit" class="btn primary">Enviar comentarios</button>
    </div>
  </form>
</div>

 {id:1,title:"Presentación del caballo estrella",date:"2026-10-12T18:00",tipo:"Post",formato:"Imagen",ratio:"r45",imgs:["https://lh3.googleusercontent.com/pw/AP1GczOPxGelSzkP9Og1_b-Kk5v0Xz72lXll_mvVKU4ndoIzuEVMa9mtTkwY7l-TEWkHlc3mrFU14_4i2km7LTj8gZ07dUnNviJ6pOVR9z88JJHDsbLXQKJw=w1600"],

  const vid=(p.formato==="Video"||p.formato==="Reel");
  if(vid){p.video={src:L[0]};p.imgs=[];p.reel=false}else{p.imgs=L;p.video=null}});
const REASONS=["Imagen o video","Texto del caption","Hashtags","Fecha u horario","Tono de marca","Otro"];
const DIAS=["dom","lun","mar","mié","jue","vie","sáb"],MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmt(s){const [d,t]=s.split("T");const [y,m,dd]=d.split("-").map(Number);const wd=new Date(y,m-1,dd).getDay();let [h,mi]=t.split(":").map(Number);const ap=h>=12?"pm":"am";h=h%12||12;return `${DIAS[wd]} ${dd} ${MES[m-1]} · ${h}:${String(mi).padStart(2,"0")} ${ap}`}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function capHTML(s){return esc(s).replace(/(#[\wÁÉÍÓÚÑáéíóúñ]+)/g,'<span class="tag">$1</span>')}

const isDrive=u=>/drive\.google\.com/.test(u);
function driveId(u){const m=String(u).match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/);return m?(m[1]||m[2]):null}
function S(i){if(typeof i==="number")return IMG[i];const id=isDrive(i)&&driveId(i);return id?`https://lh3.googleusercontent.com/d/${id}=w1600`:i}
const ONERR=`onerror="imgFail(this)"`;
function imgFail(im){const id=isDrive(im.dataset.src||'')&&driveId(im.dataset.src);if(id&&!im.dataset.retry){im.dataset.retry=1;im.src=`https://drive.google.com/thumbnail?id=${id}&sz=w1600`;return}im.closest('.frame').classList.add('broken')}
let idx=0;const decisions=[];
const stage=document.getElementById("stage");

function mediaHTML(p){
  if(p.hl&&!p.imgs.length&&!p.video) return `<div class="frame ${p.ratio}"><div class="hl">${HL_SVG}</div><span class="badge">Portada destacado</span></div>`;
  if(p.video){const v=p.video,id=isDrive(v.src)&&driveId(v.src);
    const inner=id?`<iframe src="https://drive.google.com/file/d/${id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`
      :`<video poster="${v.poster||""}" controls playsinline muted loop autoplay preload="metadata">${(v.sources||[v.src]).map(s=>`<source src="${s}" type="video/mp4">`).join("")}</video>`;
    return `<div class="frame ${p.ratio}">${inner}<span class="badge">${p.tipo} · video</span></div>`;}
  if(p.imgs.length>1){
    return `<div class="frame ${p.ratio}"><div class="track">${p.imgs.map(i=>`<img src="${S(i)}" data-src="${i}" alt="" ${ONERR}>`).join("")}</div>
    <span class="badge">Carrusel · <span class="ci">1</span>/${p.imgs.length}</span>
    <button class="nav l" type="button" aria-label="Foto anterior">‹</button><button class="nav r" type="button" aria-label="Foto siguiente">›</button>
    <div class="dots">${p.imgs.map((_,k)=>`<b class="${k?"":"on"}"></b>`).join("")}</div></div>`;
  }
  if(p.reel) return `<div class="frame ${p.ratio} reel"><img src="${S(p.imgs[0])}" alt=""><span class="badge">Reel · 0:08 · simulación</span><div class="play"><span></span></div></div>`;
  return `<div class="frame ${p.ratio}"><img src="${S(p.imgs[0])}" data-src="${p.imgs[0]}" alt="" ${ONERR}><span class="badge">${p.tipo==="Historia"?"Historia 9:16":p.tipo==="Highlight"?"Portada destacado":"Post 4:5"}</span></div>`;
}
function cardEl(p,back){
  const el=document.createElement("article");
  el.className="card"+(back?" back":"");
  el.innerHTML=`<div class="media">${mediaHTML(p)}<span class="stamp ok">APROBAR</span><span class="stamp no">CAMBIOS</span></div>
  <div class="body"><div class="meta"><span class="chip">${p.tipo}</span><span class="chip plain">${p.formato}</span><span class="when">${fmt(p.date)}</span></div>
  <h2 class="title">${esc(p.title)}</h2><p class="caption">${capHTML(p.caption)}</p></div>`;
  return el;
}
function wireCarousel(el){
  const tr=el.querySelector(".track");if(!tr)return;
  const n=tr.children.length;let k=0;const dots=el.querySelectorAll(".dots b"),ci=el.querySelector(".ci");
  const go=d=>{k=(k+d+n)%n;tr.style.transform=`translateX(-${k*100}%)`;dots.forEach((b,j)=>b.classList.toggle("on",j===k));ci.textContent=k+1};
  el.querySelector(".nav.l").addEventListener("click",e=>{e.stopPropagation();go(-1)});
  el.querySelector(".nav.r").addEventListener("click",e=>{e.stopPropagation();go(1)});
  el.querySelectorAll(".nav").forEach(b=>b.addEventListener("pointerdown",e=>e.stopPropagation()));
}
function render(){
  stage.innerHTML="";
  if(idx>=POSTS.length){showDone();return}
  if(POSTS[idx+1]) stage.appendChild(cardEl(POSTS[idx+1],true));
  const top=cardEl(POSTS[idx]);stage.appendChild(top);wireCarousel(top);drag(top);
  document.getElementById("count").textContent=`${idx+1} / ${POSTS.length}`;
  document.getElementById("bar").style.width=`${idx/POSTS.length*100}%`;
  document.getElementById("undo").disabled=decisions.length===0;
}
function drag(el){
  let x0=0,y0=0,dx=0,on=false;const so=el.querySelector(".stamp.ok"),sn=el.querySelector(".stamp.no");
  el.addEventListener("pointerdown",e=>{if(e.button&&e.button!==0)return;if(e.target.closest("video,iframe,.nav"))return;on=true;x0=e.clientX;y0=e.clientY;dx=0;el.setPointerCapture(e.pointerId)});
  el.addEventListener("pointermove",e=>{if(!on)return;dx=e.clientX-x0;const dy=(e.clientY-y0)*.2;
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    so.style.opacity=Math.max(0,Math.min(1,dx/90));sn.style.opacity=Math.max(0,Math.min(1,-dx/90))});
  const end=()=>{if(!on)return;on=false;
    if(dx>110) approve();else if(dx<-110) askChanges();
    else{el.classList.add("fly");el.style.transform="";so.style.opacity=0;sn.style.opacity=0;setTimeout(()=>el.classList.remove("fly"),400)}};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
}
function topCard(){return stage.querySelector(".card:not(.back)")}
function flyOut(dir,cb){const el=topCard();if(!el){cb();return}
  el.classList.add("fly");el.querySelector(dir>0?".stamp.ok":".stamp.no").style.opacity=1;
  el.style.transform=`translate(${dir*600}px,40px) rotate(${dir*24}deg)`;el.style.opacity=0;setTimeout(cb,380)}
function snapBack(){const el=topCard();if(!el)return;el.classList.add("fly");el.style.transform="";el.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0);setTimeout(()=>el.classList.remove("fly"),400)}
function approve(){const p=POSTS[idx];decisions.push({p,ok:true});flyOut(1,()=>{idx++;render()})}

const sheetBg=document.getElementById("sheetBg"),reasonsEl=document.getElementById("reasons");
reasonsEl.innerHTML=REASONS.map((r,i)=>`<input type="checkbox" id="rs${i}" value="${r}"><label for="rs${i}">${r}</label>`).join("");
function askChanges(){
  const p=POSTS[idx];document.getElementById("sheetFor").textContent=`${p.title} · ${p.formato}`;
  document.getElementById("sheet").reset();document.getElementById("err").hidden=true;
  sheetBg.hidden=false;setTimeout(()=>document.getElementById("rs0").focus(),50);
}
document.getElementById("cancel").addEventListener("click",()=>{sheetBg.hidden=true;snapBack()});
document.getElementById("sheet").addEventListener("submit",e=>{e.preventDefault();
  const rs=[...reasonsEl.querySelectorAll("input:checked")].map(i=>i.value);
  const ch=document.getElementById("fbChange").value.trim(),idea=document.getElementById("fbIdea").value.trim();
  if(!rs.length&&!ch){document.getElementById("err").hidden=false;return}
  sheetBg.hidden=true;decisions.push({p:POSTS[idx],ok:false,rs,ch,idea});flyOut(-1,()=>{idx++;render()});
});
document.getElementById("btnOk").addEventListener("click",approve);
document.getElementById("btnNo").addEventListener("click",askChanges);
document.getElementById("undo").addEventListener("click",()=>{if(!decisions.length)return;decisions.pop();idx--;render()});
document.addEventListener("keydown",e=>{if(!sheetBg.hidden||idx>=POSTS.length)return;
  if(e.key==="ArrowRight")approve();if(e.key==="ArrowLeft")askChanges()});

function thumb(p){if(p.video)return p.video.poster?`<img src="${p.video.poster}" alt="">`:`<div class="ph"></div>`;return p.imgs.length?`<img src="${S(p.imgs[0])}" alt="">`:`<div class="ph"></div>`}
function showDone(){
  document.getElementById("bar").style.width="100%";document.getElementById("count").textContent="Listo";
  const ok=decisions.filter(d=>d.ok).length,no=decisions.length-ok;
  document.getElementById("main").hidden=true;const dn=document.getElementById("done");dn.hidden=false;dn.innerHTML=`
    <h2>Gracias, revisión completa</h2>
    <div class="tally"><div class="o"><b>${ok}</b><span>Aprobadas</span></div><div class="n"><b>${no}</b><span>Con cambios</span></div></div>
    <div class="list">${decisions.map(d=>`<div class="item">${thumb(d.p)}<div class="t"><strong>${esc(d.p.title)}</strong>
      <span class="pill ${d.ok?"ok":"no"}">${d.ok?"Aprobada":"Con cambios"}</span>
      ${d.ok?"":`<span class="fb">${esc([d.rs.join(", "),d.ch,d.idea&&("Propuesta: "+d.idea)].filter(Boolean).join(" · "))}</span>`}
    </div></div>`).join("")}</div>
    <p class="note">Versión de prueba. En la versión final, cada decisión y comentario se guarda automáticamente en tu calendario de Notion.</p>
    <button class="btn restart" id="restart" type="button">Revisar de nuevo</button>`;
  document.getElementById("restart").addEventListener("click",()=>{idx=0;decisions.length=0;dn.hidden=true;document.getElementById("main").hidden=false;render()});
}
(function(){const R=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)");
 let saved=null;try{saved=localStorage.getItem("tema")}catch(e){}
 const apply=th=>{if(th){R.setAttribute("data-theme",th)}const dark=th?th==="dark":mq.matches;R.setAttribute("data-dark",dark?"1":"0")};
 apply(saved||"light");mq.addEventListener&&mq.addEventListener("change",()=>apply(R.getAttribute("data-theme")));
 document.getElementById("theme").addEventListener("click",()=>{const next=R.getAttribute("data-dark")==="1"?"light":"dark";apply(next);try{localStorage.setItem("tema",next)}catch(e){}});
})();
render();
</script>

</body>
</html>
