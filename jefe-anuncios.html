// Jerarquía Campaña > Conjunto de Anuncios > (nota + link a Campañas guardadas, sin datos
// propios en ese 3er nivel -- confirmado con el usuario). Mismo ciclo de guardado debounced que
// borradorStore/cards, guardado en {cliente}:anuncios-estructura.

function renderEstructura(container){
  const wrap = document.createElement('div');

  if(!estructuras.length){
    // Sin campañas todavía: el botón vive aquí; con campañas, cada una lo trae en su encabezado.
    const empty = document.createElement('div');
    empty.className = 'empty-row';
    empty.innerHTML = 'Todavía no hay campañas de estructura.<br><br><button class="btn btn-solid" type="button" data-nueva-campana>+ Nueva campaña</button>';
    wrap.appendChild(empty);
  } else {
    const barra = document.createElement('div');
    barra.className = 'estructura-barra';
    barra.innerHTML = '<button class="btn btn-solid btn-sm" type="button" data-nueva-campana>+ Nueva campaña</button>';
    wrap.appendChild(barra);
    estructuras.forEach(campana=>wrap.appendChild(buildCampanaEstructuraCard(campana)));
  }

  const hackFinal = document.createElement('div');
  hackFinal.className = 'hack-final-box';
  hackFinal.innerHTML = `
    <p class="hack-final-title">🧠 HACK FINAL</p>
    <p>👉 Lo que no se mide, no se puede mejorar.</p>
    <p>👉 Tu trabajo no es hacer el anuncio perfecto, es probar hasta encontrar el que funciona.</p>
    <p>👉 Entre más claro tengas esto, menos dinero pierdes — y más abierta estás a la mejora continua.</p>
  `;
  wrap.appendChild(hackFinal);

  container.appendChild(wrap);

  wrap.querySelectorAll('[data-nueva-campana]').forEach(b=>b.addEventListener('click', ()=>{
    estructuras.unshift(mkCampana());
    scheduleEstructuraSave();
    render();
  }));
}

// La campaña es siempre el panel lima: pastilla con el nombre, fecha de inicio, las pastillas
// "Objetivo de campaña" y "Especificaciones del conjunto" (al pulsarlas se abren sus datos para
// ver y editar) y a la derecha los anuncios vinculados. Sin guardar se ven abiertas; ya guardada
// sale cerrada. Lo que el usuario abre/cierra a mano se conserva aunque se vuelva a pintar.
const resEstado = new Map();
const resColapsadas = new Set(); // campañas encogidas a una sola línea
function resAbierto(campana, clave){
  const k = campana.id+':'+clave;
  return resEstado.has(k) ? resEstado.get(k) : !campana.guardada;
}
// Una campaña recién creada y sin tocar va en blanco; en cuanto lleva algún dato (producto, objetivo,
// fecha, resultado, conjuntos o guardada) pasa al panel lima.
function campanaNueva(c){
  // el producto/grupo con el que nace (el foco de arriba) no cuenta como "datos"
  return !c.guardada && !c.objetivo && !c.tipo && (c.producto_id||'')===(productoId||'') && (c.grupo_id||'')===(grupoId||'') && !c.fecha_inicio
    && !c.resultado_esperado && !(c.conjuntos||[]).length;
}
function nombreAlcance(campana){
  const prod = productos.find(p=>p&&p.id===campana.producto_id);
  const grupo = grupos.find(g=>g&&g.id===campana.grupo_id);
  return prod ? prod.nombre : (grupo ? grupo.nombre : 'General');
}
function htmlAnunciosVinculados(campana){
  const ids = [...new Set((campana.conjuntos||[]).flatMap(c=>c.anuncios_ids||[]))];
  const anuncios = ids.map(id=>cards.find(c=>c.id===id)).filter(Boolean);
  return anuncios.length ? anuncios.map(c=>`
    <div class="res-anuncio">
      <span class="res-check">✔</span>
      <span class="badge badge-${c.etapa}">${ETAPA_LABEL[c.etapa]||c.etapa}</span>
      <span class="anuncio-link-titulo" data-editar-card="${c.id}" title="Abrir y editar esta campaña">${escHtml(c.titulo)} ✎</span>
    </div>`).join('') : '<div class="res-anuncio res-vacio">Todavía no vinculaste anuncios a esta campaña.</div>';
}
async function guardarCampana(campana){
  campana.guardada = true;
  resEstado.delete(campana.id+':obj'); resEstado.delete(campana.id+':esp');
  clearTimeout(estructuraSaveTimer);
  await guardarEstructura();
  render();
}

// Un solo selector: cada grupo con "Todo el grupo" y sus productos/servicios debajo.
function opcionesAlcance(campana){
  const sel = campana.producto_id ? 'p:'+campana.producto_id : (campana.grupo_id ? 'g:'+campana.grupo_id : '');
  const opt = (v,t)=>`<option value="${v}"${sel===v?' selected':''}>${escHtml(t)}</option>`;
  const prods = productos.filter(p=>p&&p.nombre);
  let html = opt('','General (sin grupo)');
  grupos.filter(g=>g&&g.nombre).forEach(g=>{
    html += `<optgroup label="${escHtml(g.nombre)}">` + opt('g:'+g.id,'Todo el grupo · '+g.nombre) + prods.filter(p=>p.grupo_id===g.id).map(p=>opt('p:'+p.id,p.nombre)).join('') + '</optgroup>';
  });
  const sueltos = prods.filter(p=>!p.grupo_id || !grupos.some(g=>g&&g.id===p.grupo_id));
  if(sueltos.length) html += '<optgroup label="Sin grupo">' + sueltos.map(p=>opt('p:'+p.id,p.nombre)).join('') + '</optgroup>';
  return html;
}

      });
      const data = await res.json();
      if(!res.ok || !data.perfil){ alert('Error: '+(data.error||'No se pudo sugerir el perfil.')); return; }
      Object.assign(conjunto, data.perfil);
      if(!conjunto.duracion.trim()) conjunto.duracion = DURACION_DEFAULT;
      if(!conjunto.presupuesto_diario.trim()) conjunto.presupuesto_diario = PRESUPUESTO_DIARIO_MINIMO;
      scheduleEstructuraSave();
      render();
    }catch(err){
      alert('Error de conexión.');
    }finally{
      btn.disabled = false; btn.textContent = prevText;
    }
  });

  return card;
}

// Mismo patrón que "Consulta en vivo" de Jefe Contenido (jefe-contenido-v2.html): la Messages
// API no guarda estado, así que se manda TODO el historial en cada turno -- pero el contexto real
// (ADN, las 4 Notas 366, Radar, retroalimentación) lo vuelve a leer el servidor en cada
// llamada via construirContexto(), así que el chat "conoce" el 366 desde el primer mensaje,
// no solo lo que se escribe dentro del chat. Conversación efímera, no se guarda en storage.

  autoAltoChat();

  chatInputEl.addEventListener('keydown',(e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviarMensajeChat(); } });

function pintarChatThread(){
  const box = document.getElementById('chat-thread');
  if(!box) return;
  if(!chatMessages.length){
    box.innerHTML = '';
    return;
  }
  box.innerHTML = chatMessages.map((m,i)=>{
    if(m.role==='user'){
      const tagImagen = m.imagenNombre ? `<div class="chat-msg-imagen-tag">📎 ${escHtml(m.imagenNombre)}</div>` : '';
      return `<div class="chat-msg chat-msg-user">${tagImagen}${escHtml(m.content)}</div>`;
    }
    const badgeEtapa = m.etapa ? `<span class="badge badge-${m.etapa}" style="margin-bottom:6px;">${ETAPA_LABEL[m.etapa]||m.etapa}</span><br>` : '';
    return `<div class="chat-msg chat-msg-assistant">${badgeEtapa}${escHtml(m.content)}
      <div class="chat-msg-actions">
        <button type="button" data-copy-idx="${i}">📋 Copiar</button>
        <button type="button" data-usar-idx="${i}" class="${m.usada?'done':''}">${m.usada?'✅ Agregado a Campañas guardadas':'✅ Guardar como campaña'}</button>
      </div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
  box.querySelectorAll('[data-copy-idx]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      navigator.clipboard.writeText(chatMessages[+btn.dataset.copyIdx].content).then(()=>{
        const prev=btn.textContent; btn.textContent='✅ Copiado';
        setTimeout(()=>{ btn.textContent=prev; },1500);
      });
    });
  });
  box.querySelectorAll('[data-usar-idx]').forEach(btn=>{
    btn.addEventListener('click',()=>usarRespuestaChatComoCampana(+btn.dataset.usarIdx));
  });
}

async function enviarMensajeChat(){
  const mensaje = (chatDraft||'').trim();
  const statusEl = document.getElementById('chat-status');
  if(!mensaje && !chatImagenBase64){ if(statusEl) statusEl.textContent='⚠️ Escribe tu mensaje o adjunta una imagen primero.'; return; }
  const btn = document.getElementById('chat-send-btn');
  if(btn) btn.disabled = true;
  if(statusEl){ statusEl.className='mode-status'; statusEl.textContent='⏳ Leyendo ADN + 366 + Radar para responderte...'; }

  // La imagen SOLO se manda en esta llamada -- en chatMessages queda como texto (con el nombre del
  // archivo como tag) para no ir resendando los bytes en cada turno siguiente de la conversación.
  const imagenParaEnviar = chatImagenBase64;
  const imagenMediaType = chatImagenMediaType;
  const nombreImagen = chatImagenNombre;
  const textoUsuario = mensaje || 'Analiza esta imagen del anuncio y dame tu opinión estratégica.';

  chatMessages.push({ role:'user', content: textoUsuario, imagenNombre: nombreImagen || '' });
  chatDraft = '';
  chatImagenBase64=''; chatImagenNombre='';
  pintarChatThread();
  try{
    const historialParaEnviar = chatMessages.map((m,i)=>{
      const esUltimo = i === chatMessages.length - 1;
      if(esUltimo && imagenParaEnviar){
        return { role: m.role, content: [
          { type:'image', source:{ type:'base64', media_type: imagenMediaType, data: imagenParaEnviar } },
          { type:'text', text: m.content },
        ]};
      }
      return { role: m.role, content: m.content };
    });
    const res = await fetch('/api/generar-anuncios', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ modo:'chat', cliente: CLIENTE_ID, grupo_id: grupoId, producto_id: productoId, messages: historialParaEnviar }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Error al consultar al Jefe.');
    // Cuando el Jefe entrega un guion completo, la 1a línea trae "ETAPA: adquisicion|consideracion|
    // conversion" (metadata para clasificar la tarjeta si se guarda como campaña) -- se separa del
    // texto que se muestra/copia, nunca se le enseña esa línea cruda al usuario.
    const textoCrudo = data.text || '';
    const matchEtapa = textoCrudo.match(/^\s*ETAPA:\s*(adquisicion|consideracion|conversion)\s*\n?/i);
    const etapaDetectada = matchEtapa ? matchEtapa[1].toLowerCase() : '';
    const textoLimpio = matchEtapa ? textoCrudo.slice(matchEtapa[0].length) : textoCrudo;
    chatMessages.push({role:'assistant', content:textoLimpio, etapa: etapaDetectada});
    chatStatus = '✅ Listo';
  }catch(err){
    chatMessages.pop();
    chatDraft = mensaje;
    chatStatus = '❌ ' + (err.message || 'Error al consultar al Jefe.');
  }
  render();
}

function usarRespuestaChatComoCampana(idx){
  const msg = chatMessages[idx];
  if(!msg || msg.role!=='assistant' || msg.usada) return;
  const preguntaPrevia = (chatMessages[idx-1] && chatMessages[idx-1].role==='user') ? chatMessages[idx-1].content : '';
  const primeraLinea = (msg.content.split('\n').find(l=>l.trim())||'').slice(0,140);
  cards.unshift({
    id: mkCardId(),
    etapa: (msg.etapa && ETAPAS.some(e=>e.key===msg.etapa)) ? msg.etapa : 'consideracion',
    formato: 'reel',
    grupo_id: grupoId || '',
    producto_id: productoId || '',
    titulo: primeraLinea || 'Idea desde Consulta en vivo',
    hook: primeraLinea,
    objetivo: '', angulo: '', audiencia: '',
    guion: { hook:'', problema:'', solucion:'', prueba:'', costo_inaccion:'', cta:'' },
    version_15s: '', hooks_alternativos: [], visual_sugerido: '', duracion_sugerida: '',
    copy_publicacion: msg.content,
    prompt_imagen: '', prompt_video: '', caption_whatsapp: '',
    titulo_anuncio: '', descripcion_anuncio: '', cta_boton: '', link_destino: '',
    estado: 'idea', fecha: '',
    retroalimentacion: preguntaPrevia ? `Pregunta original en el chat: ${preguntaPrevia}` : '',
    link_archivo_final: '',
  });
  msg.usada = true;
  document.getElementById('count-cards').textContent = cards.length;
  scheduleCardsSave();
  chatStatus = '✅ Se guardó como campaña -- revísala y complétala en "Campañas guardadas".';
  render();
}

// ─── LINKS DEL ANUNCIO (varios, con nombre personalizable) ───────────────────────────────────
// Cada anuncio puede guardar todos los links que necesite (Drive, Canva, el video, la imagen...) con el nombre
// que el usuario les ponga. `link_archivo_final` sigue existiendo y siempre refleja el primer link con dirección.
let linkVistaId = ''; // link que se está viendo en el celular (si está vacío, el primero que se pueda mostrar)
function mkLinkId(){ return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function linksDe(item){
  if(!Array.isArray(item.links)){
    item.links = item.link_archivo_final ? [{ id:mkLinkId(), nombre:'Anuncio final', url:item.link_archivo_final }] : [];
  }
  return item.links;
}
function sincronizarLinkPrincipal(item){
  const l = (item.links||[]).find(x=>x && x.url && x.url.trim());
  item.link_archivo_final = l ? l.url.trim() : '';
}
function linksConUrl(item){ return linksDe(item).filter(l=>l && l.url && l.url.trim()); }
function linkVista(item){
  const ls = linksConUrl(item);
  if(!ls.length) return null;
  return ls.find(l=>l.id===linkVistaId) || ls.find(l=>{ const m = infoMaterial(l.url); return m && m.tipo!=='link'; }) || ls[0];
}
function nombreLink(l, i){ return (l.nombre||'').trim() || ('Link '+(i+1)); }
// Miniatura de la tarjeta: la primera imagen que salga de alguno de los links.
function linkMiniatura(item){
  for(const l of linksConUrl(item)){ const m = infoMaterial(l.url); if(m && m.thumb) return m.thumb; }
  return '';
}

// Qué se puede mostrar a partir del "Link del anuncio final": imagen o video directo, YouTube, Google Drive,
// Instagram y TikTok se ven dentro del celular; cualquier otro link queda como botón "Abrir".
function infoMaterial(url){
  let u = (url||'').trim();
  if(!u) return null;
  if(!/^https?:\/\//i.test(u)) u = 'https://'+u;
  let L; try{ L = new URL(u); }catch(e){ return null; }
  const h = L.hostname.replace(/^www\./,'').toLowerCase();
  const ext = ((L.pathname.match(/\.([a-z0-9]+)$/i)||[])[1]||'').toLowerCase();
  if(h.endsWith('dropbox.com')){ L.searchParams.delete('dl'); L.searchParams.set('raw','1'); }
  const limpio = x=>x.replace(/"/g,'%22').replace(/'/g,'%27').replace(/</g,'%3C').replace(/>/g,'%3E');
  const abrir = limpio(L.toString());
  let m, id = null;
  if(['jpg','jpeg','png','gif','webp','avif','bmp'].includes(ext) || h.endsWith('googleusercontent.com')) return {tipo:'img', src:abrir, thumb:abrir, abrir, host:h};
  if(['mp4','webm','mov','m4v','ogv'].includes(ext)) return {tipo:'video', src:abrir, thumb:null, abrir, host:h};
  if(h==='youtu.be') id = L.pathname.slice(1).split('/')[0];
  else if(h.endsWith('youtube.com')){
    if(L.pathname.startsWith('/watch')) id = L.searchParams.get('v');
    else if((m = L.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{6,})/))) id = m[1];
  }
  if(id && /^[\w-]{6,}$/.test(id)) return {tipo:'embed', src:'https://www.youtube.com/embed/'+id, thumb:'https://img.youtube.com/vi/'+id+'/hqdefault.jpg', abrir, host:h};
  if(h==='drive.google.com'){
    m = L.pathname.match(/\/file\/d\/([\w-]+)/); id = m ? m[1] : L.searchParams.get('id');
    if(id && /^[\w-]+$/.test(id)) return {tipo:'embed', src:'https://drive.google.com/file/d/'+id+'/preview', thumb:'https://drive.google.com/thumbnail?id='+id+'&sz=w640', abrir, host:h};
  }
  if(h.endsWith('instagram.com') && (m = L.pathname.match(/^\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([\w-]+)/)))
    return {tipo:'embed', src:'https://www.instagram.com/'+(m[1]==='reels'?'reel':m[1])+'/'+m[2]+'/embed', thumb:null, abrir, host:h};
  if(h.endsWith('tiktok.com') && (m = L.pathname.match(/\/video\/(\d+)/)))
    return {tipo:'embed', src:'https://www.tiktok.com/embed/v2/'+m[1], thumb:null, abrir, host:h};
  return {tipo:'link', abrir, host:h};
}

    // Solo cambió texto/redes/formato: se actualiza sin tocar el material (así el video no se reinicia).
    box.querySelector('.pm-nets').innerHTML = redesHtml;
    const cap = box.querySelector('.pm-caption') || box.querySelector('.pm-caption-fuera'); if(cap) cap.innerHTML = captionHtml;
    box.querySelector('.pm-screen > .pchip').textContent = item.formato||'reel';
    box.querySelector('.pm-meta').textContent = (item.formato||'reel') + ' · 9:16';
    pintarChipsLinks(item, box);
    return;
  }
  box.dataset.media = claveMedia;

  let capa = '', enVivo = false;
  if(mi){
    if(mi.tipo==='img') capa = `<img class="pm-media" src="${mi.src}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`;
    else if(mi.tipo==='video'){ capa = `<video class="pm-media" src="${mi.src}#t=0.5" controls playsinline preload="metadata"></video>`; enVivo = true; }
    else if(mi.tipo==='embed'){
      if(mi.thumb) capa += `<img class="pm-media" src="${mi.thumb}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`;
      capa += `<iframe class="pm-media pm-embed" src="${mi.src}" allow="autoplay; fullscreen" allowfullscreen loading="lazy" referrerpolicy="no-referrer"></iframe>`;
      enVivo = true;
    }
  }
  const ayuda = !mi
    ? 'Pega el link del anuncio final (Drive, YouTube, Instagram, TikTok o una imagen/video directo) y aquí lo verás.'
    : (mi.tipo==='link'
        ? `Este link no se puede mostrar aquí. <a href="${mi.abrir}" target="_blank" rel="noopener">Abrir material ↗</a>`
        : `<a href="${mi.abrir}" target="_blank" rel="noopener">Abrir en una pestaña ↗</a>${mi.host==='drive.google.com' ? '<br>Si no se ve, en Drive comparte el archivo con “Cualquier persona con el enlace”.' : ''}`);
  box.innerHTML = `
    <div class="pm-nets">${redesHtml}</div>
    <div class="pm-linkchips"></div>
    <div class="pm-phone"><div class="pm-screen" style="--a:${gr[0]};--b:${gr[1]};">
      ${mi && mi.tipo!=='link' ? '' : `<span class="pm-ico">${FORMATO_ICO[item.formato]||'🎬'}</span>`}
      ${capa}
      <span class="pchip">${escHtml(item.formato||'reel')}</span>
      ${enVivo ? '' : `<div class="pm-caption">${captionHtml}</div>`}
    </div></div>
    ${enVivo ? `<div class="pm-caption-fuera">${captionHtml}</div>` : ''}
    <div class="pm-meta">${meta}</div>
    <p class="pm-hint">${ayuda}</p>`;
  pintarChipsLinks(item, box);
}

// Con 2 o más links, chips con su nombre sobre el celular para elegir cuál se ve.
function pintarChipsLinks(item, box){
  const cont = box.querySelector('.pm-linkchips'); if(!cont) return;
  const ls = linksDe(item).map((l,i)=>({l,i})).filter(x=>x.l.url && x.l.url.trim());
  const sel = linkVista(item);
  cont.innerHTML = ls.length > 1 ? ls.map(x=>`<button type="button" class="pm-linkchip${sel && sel.id===x.l.id?' on':''}" data-vista-link="${x.l.id}">${escHtml(nombreLink(x.l,x.i))}</button>`).join('') : '';
  if(!box._chipsListo){
    box._chipsListo = true;
    box.addEventListener('click',(e)=>{
      const b = e.target.closest('[data-vista-link]'); if(!b) return;
      const it = cards.find(c=>c.id===postModalId); if(!it) return;
      linkVistaId = b.dataset.vistaLink; pintarPreviewPost(it); pintarLinks(it);
    });
  }
}

// Links del anuncio: se ven como pastillas compactas (icono + nombre; clic abre el link) con 📱 para verlo en el celular
// y ✎ para editarlo. "+ Agregar link" abre una fila para escribir nombre y dirección; al darle "Listo" vuelve a ser pastilla.
let linkEditandoId = '';
function iconoLink(url){
  const m = infoMaterial(url); if(!m) return '🔗';
  const h = m.host || '';
  if(h.includes('drive.google')) return '📁';
  if(h.includes('youtu')) return '▶️';
  if(h.includes('instagram')) return '📷';
  if(h.includes('tiktok')) return '🎵';
  if(h.includes('canva')) return '🎨';
  if(m.tipo==='img') return '🖼️';
  if(m.tipo==='video') return '🎬';
  return '🔗';
}
function pintarLinks(item, modal){
  const box = (modal||postModalEl).querySelector('#pm-links');
  if(!box) return;
  const links = linksDe(item);
  const sel = linkVista(item);
  const pastilla = (l,i)=>`
    <span class="pm-lk${sel && sel.id===l.id ? ' on' : ''}" data-lid="${l.id}">
      <a class="pm-lk-main" href="${escHtml(linkHref(l.url))}" target="_blank" rel="noopener" title="Abrir ${escHtml(nombreLink(l,i))}">
        <span class="pm-lk-ico">${iconoLink(l.url)}</span><span class="pm-lk-nom">${escHtml(nombreLink(l,i))}</span><span class="pm-lk-go">↗</span>
      </a>
      <button type="button" class="pm-lk-btn" data-lk-ver title="Verlo en el celular">📱</button>
      <button type="button" class="pm-lk-btn" data-lk-edit title="Editar nombre o link">✎</button>
    </span>`;
  const editor = (l)=>`
    <div class="pm-lk-editor" data-lid="${l.id}">
      <input type="text" class="pm-link-nombre" placeholder="Nombre (Video, Imagen, Anuncio final…)" value="${escHtml(l.nombre)}" aria-label="Nombre del link">
      <input type="text" class="pm-link-url" placeholder="https://… (Drive, Canva, YouTube…)" value="${escHtml(l.url)}" aria-label="Dirección del link">
      <div class="pm-lk-editor-btns">
        <button type="button" class="btn btn-solid btn-sm" data-lk-listo>Listo</button>
        <button type="button" class="pm-lk-quitar" data-lk-quitar>Quitar</button>
      </div>
    </div>`;
  const editando = links.find(l=>l.id===linkEditandoId);
  box.innerHTML = `
    <div class="pm-links-t">🔗 Links del anuncio <span class="pm-hint-inline">(Drive, Canva, el video, la imagen…)</span></div>
    <div class="pm-lk-lista">
      ${links.filter(l=>l.id!==linkEditandoId && l.url && l.url.trim()).map((l)=>pastilla(l, links.indexOf(l))).join('')}
      ${editando ? '' : '<button type="button" class="pm-lk-add" data-link-add>＋ Agregar link</button>'}
    </div>
    ${editando ? editor(editando) : ''}`;
  const guardar = ()=>{ sincronizarLinkPrincipal(item); scheduleCardsSave(); };
  box.querySelectorAll('.pm-lk').forEach(el=>{
    const l = links.find(x=>x.id===el.dataset.lid); if(!l) return;
    el.querySelector('[data-lk-ver]').addEventListener('click',()=>{ linkVistaId = l.id; pintarPreviewPost(item); pintarLinks(item); });
    el.querySelector('[data-lk-edit]').addEventListener('click',()=>{ linkEditandoId = l.id; pintarLinks(item); const i = box.querySelector('.pm-link-url'); if(i) i.focus(); });
  });
  const ed = box.querySelector('.pm-lk-editor');
  if(ed && editando){
    const nom = ed.querySelector('.pm-link-nombre'), url = ed.querySelector('.pm-link-url');
    nom.addEventListener('input',()=>{ editando.nombre = nom.value; guardar(); });
    url.addEventListener('input',()=>{ editando.url = url.value; guardar(); pintarPreviewPost(item); });
    const cerrar = ()=>{
      // un link sin dirección no se queda
      if(!(editando.url||'').trim()) item.links = links.filter(x=>x.id!==editando.id);
      linkEditandoId = ''; guardar(); pintarLinks(item); pintarPreviewPost(item);
    };
    ed.querySelector('[data-lk-listo]').addEventListener('click', cerrar);
    [nom,url].forEach(i=>i.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); cerrar(); } }));
    ed.querySelector('[data-lk-quitar]').addEventListener('click',()=>{
      item.links = links.filter(x=>x.id!==editando.id); linkEditandoId = ''; guardar(); pintarLinks(item); pintarPreviewPost(item);
    });
  }
  const add = box.querySelector('[data-link-add]');
  if(add) add.addEventListener('click',()=>{
    const nuevo = { id:mkLinkId(), nombre:'', url:'' };
    links.push(nuevo); linkEditandoId = nuevo.id; pintarLinks(item);
    const i = box.querySelector('.pm-link-nombre'); if(i) i.focus();
  });
}

// ─── PIEZAS BAJO DEMANDA (guion · caption de WhatsApp · prompt de imagen · prompt de video) ─────
// El detalle base ya no las trae para no gastar tokens de más: cada una se crea solo cuando el usuario
// pulsa su botón. Lo que ya tenga contenido (tarjetas anteriores o piezas ya creadas) se muestra y
// se puede regenerar.
const PIEZAS = {
  guion:{ ico:'📝', boton:'Crear guion', rehacer:'Regenerar guion', carga:'Escribiendo el guion…' },
  whatsapp:{ ico:'💬', boton:'Caption de WhatsApp', rehacer:'Regenerar caption', carga:'Escribiendo el caption…' },
  imagen:{ ico:'🖼️', boton:'Prompt de imagen con IA', rehacer:'Actualizar o rehacer prompt de imagen', carga:'Creando el prompt de imagen…' },
  video:{ ico:'🎬', boton:'Prompt de video con IA', rehacer:'Actualizar o rehacer prompt de video', carga:'Creando el prompt de video…' },
};
function piezaTieneContenido(item, tipo){
  if(tipo==='guion') return !!(item.version_15s || (item.hooks_alternativos||[]).length || Object.values(item.guion||{}).some(Boolean));
  if(tipo==='whatsapp') return !!item.caption_whatsapp;
  if(tipo==='imagen') return !!item.prompt_imagen;
  return !!item.prompt_video;
}
const piezasAbiertas = new Set(); // "idTarjeta:tipo" de los bloques que el usuario tiene desplegados
const piezaMaterial = { imagen:null, video:null };
function resumenPieza(item, tipo){
  let t = '';
  if(tipo==='guion') t = (item.guion && item.guion.hook) || item.version_15s || '';
  else if(tipo==='whatsapp') t = item.caption_whatsapp || '';
  else if(tipo==='imagen') t = item.prompt_imagen || '';
  else t = item.prompt_video || '';
  t = t.replace(/\s+/g,' ').trim();
  return t.length > 90 ? t.slice(0,90)+'…' : t;
}
// Cada pieza ya creada se muestra como una fila (título + primeras palabras); al pulsarla se despliega
// todo su contenido y al pulsar de nuevo se esconde, para que la tarjeta no quede larguísima.
function bloquePieza(item, tipo, titulo, cuerpo, extra){
  const k = item.id+':'+tipo, abierto = piezasAbiertas.has(k);
  return `<div class="pm-pieza-campos${abierto?' abierto':''}" data-pieza-bloque="${tipo}">
    <button type="button" class="pm-pieza-cab" data-pieza-toggle="${tipo}">
      <span class="pm-pieza-titulo">${titulo}</span>
      <span class="pm-pieza-resumen">${escHtml(resumenPieza(item,tipo))}</span>
      <span class="pm-pieza-chev">▾</span>
    </button>
    <div class="pm-pieza-cuerpo">${cuerpo}${extra||''}</div>
  </div>`;
}
function botonGemini(tipo){
  return `<div class="pm-gemini">
    <button type="button" class="pm-copiar-gemini" data-copiar-prompt="${tipo}">📋 Copiar prompt <span>listo para pegar en Gemini</span></button>
    <a class="pm-abrir-gemini" href="https://gemini.google.com/app" target="_blank" rel="noopener">Abrir Gemini ↗</a>
    ${tipo==='imagen' ? '<div class="pm-logo-tip">💡 <b>Sube tu logotipo a Gemini junto con este prompt</b> (clip 📎): el prompt ya le indica en qué esquina colocarlo y lleva el llamado a la acción dentro de la imagen.</div>' : '<div class="pm-logo-tip">💡 <b>Sube tu logotipo a Gemini junto con este prompt</b> (clip 📎) para que aparezca al final. El video dura de 15 a 20 segundos y lleva voz.</div>'}
  </div>`;
}

function pintarPiezas(item, modal){
  const box = (modal||postModalEl).querySelector('#pm-piezas');
  if(!box) return;
  const tiene = t=>piezaTieneContenido(item,t);
  const btn = t=>`<button type="button" class="pm-pieza-btn${tiene(t)?' hecho':''}" data-pieza="${t}">${PIEZAS[t].ico} ${tiene(t)?PIEZAS[t].rehacer:PIEZAS[t].boton}</button>`;
  const existe = t=>tiene(t);
  const ask = t=>existe(t) ? `<div class="pm-pieza-ask" data-ask="${t}" hidden>
      <div class="pm-hint-txt">¿Qué quieres cambiar? Escríbelo y ajusto tu prompt (por ejemplo: “más luz”, “que salga mi producto”, “otro estilo”). Si lo dejas vacío, te doy otra versión.</div>
      <textarea class="pm-ask-texto" rows="2" placeholder="Ej. que el fondo sea más claro y agrega mi logo en una esquina…"></textarea>
      <div class="pm-ask-fila">
        <label class="btn-guion" style="cursor:pointer;">📎 Agregar imagen o video<input type="file" class="pm-ask-file" data-tipo="${t}" accept="image/*,video/*" style="display:none;"></label>
        <span class="pm-ask-prev" data-prev="${t}"></span>
        <button type="button" class="btn btn-solid btn-sm" data-pieza-crear="${t}" data-modo="actualizar">✏️ Actualizar prompt</button>
        <button type="button" class="btn btn-outline btn-sm" data-pieza-crear="${t}" data-modo="rehacer">🔄 Rehacer desde cero</button>
      </div></div>` : `<div class="pm-pieza-ask" data-ask="${t}" hidden>
      <div class="pm-hint-txt">¿Tienes material real que quieras tomar en cuenta? Es opcional: cuéntalo con palabras o agrega una imagen o un video.</div>
      <textarea class="pm-ask-texto" rows="2" placeholder="Ej. la foto de mi local, mi logo en blanco, que salga mi producto…"></textarea>
      <div class="pm-ask-fila">
        <label class="btn-guion" style="cursor:pointer;">📎 Agregar imagen o video<input type="file" class="pm-ask-file" data-tipo="${t}" accept="image/*,video/*" style="display:none;"></label>
        <span class="pm-ask-prev" data-prev="${t}"></span>
        <button type="button" class="btn btn-solid btn-sm" data-pieza-crear="${t}" data-modo="crear">Crear prompt</button>
      </div></div>`;
  let campos = '';
  if(tiene('guion')){
    campos += bloquePieza(item, 'guion', '📝 Guion',
      guionFieldHtml(item,'hook','Hook (primeros 3 seg)') +
      guionFieldHtml(item,'problema','Problema o error') +
      guionFieldHtml(item,'solucion','Solución / método') +
      guionFieldHtml(item,'prueba','Prueba o testimonio') +
      guionFieldHtml(item,'costo_inaccion','Costo de la inacción') +
      guionFieldHtml(item,'cta','CTA') +
      textFieldHtml(item,'version_15s','Versión 15 segundos') +
      textFieldHtml(item,'hooks_alternativos','3 hooks alternativos (uno por línea)'));
  }
  if(tiene('whatsapp')) campos += bloquePieza(item, 'whatsapp', '💬 Caption para WhatsApp', promptFieldHtml(item,'caption_whatsapp','Caption'));
  if(tiene('imagen')) campos += bloquePieza(item, 'imagen', '🖼️ Prompt de imagen', promptFieldHtml(item,'prompt_imagen','Prompt'), botonGemini('imagen'));
  if(tiene('video')) campos += bloquePieza(item, 'video', '🎬 Prompt de video', promptFieldHtml(item,'prompt_video','Prompt'), botonGemini('video'));

  box.innerHTML = `
    <div class="pm-label">✨ Crea solo lo que necesites <span class="pm-hint-inline">(la IA se usa únicamente cuando pulsas el botón)</span></div>
    <div class="pm-pieza-btns">${['guion','whatsapp','imagen','video'].map(btn).join('')}</div>
    ${ask('imagen')}${ask('video')}
    <div class="mode-status" id="pm-pieza-status"></div>
    ${campos}`;
  bindCardEvents(box);

  const status = box.querySelector('#pm-pieza-status');
  box.querySelectorAll('[data-pieza-toggle]').forEach(b=>b.addEventListener('click',()=>{
    const t = b.dataset.piezaToggle, k = item.id+':'+t;
    const bloque = b.closest('.pm-pieza-campos');
    const abre = bloque.classList.toggle('abierto');
    if(abre) piezasAbiertas.add(k); else piezasAbiertas.delete(k);
  }));
  box.querySelectorAll('[data-pieza]').forEach(b=>b.addEventListener('click',()=>{
    const t = b.dataset.pieza;
    if(t==='imagen' || t==='video'){
      const a = box.querySelector('[data-ask="'+t+'"]'); a.hidden = !a.hidden;
      return;
    }
    if(tiene(t) && !confirm('Ya hay contenido en esta pieza. ¿Regenerarla y reemplazarlo?')) return;
    crearPieza(item, t, '', null, box);
  }));
  box.querySelectorAll('.pm-ask-file').forEach(inp=>inp.addEventListener('change', async (e)=>{
    const f = e.target.files && e.target.files[0]; const t = e.target.dataset.tipo; e.target.value = '';
    const prev = box.querySelector('[data-prev="'+t+'"]');
    if(!f){ return; }
    prev.textContent = '⏳ Preparando…';
    try{
      const base64 = f.type.startsWith('video/') ? await videoFileAFotogramaJpegBase64(f, 1280) : await imagenFileAJpegBase64(f, 1280);
      piezaMaterial[t] = { nombre:f.name||'archivo', data:base64, esVideo:f.type.startsWith('video/') };
      prev.textContent = (piezaMaterial[t].esVideo?'🎞️ ':'🖼️ ') + piezaMaterial[t].nombre + (piezaMaterial[t].esVideo?' (un cuadro del video)':'');
    }catch(err){ piezaMaterial[t] = null; prev.textContent = '⚠️ No pude leer el archivo'; }
  }));
  box.querySelectorAll('[data-pieza-crear]').forEach(b=>b.addEventListener('click',()=>{
    const t = b.dataset.piezaCrear, modo = b.dataset.modo;
    const texto = box.querySelector('[data-ask="'+t+'"] .pm-ask-texto').value;
    if(modo==='rehacer' && !confirm('Se reemplazará tu prompt por uno nuevo hecho desde cero. ¿Continuar?')) return;
    // "Actualizar": la IA parte del prompt que ya tienes y aplica solo lo que pides cambiar.
    const actual = modo==='actualizar' ? (t==='video' ? item.prompt_video : item.prompt_imagen) : '';
    crearPieza(item, t, texto, piezaMaterial[t], box, actual);
  }));
  box.querySelectorAll('[data-copiar-prompt]').forEach(b=>b.addEventListener('click',()=>{
    const t = b.dataset.copiarPrompt; const txt = (t==='video' ? item.prompt_video : item.prompt_imagen) || '';
    if(!txt) return;
    const antes = b.innerHTML;
    navigator.clipboard.writeText(txt).then(()=>{ b.innerHTML = '✅ Copiado <span>pégalo en Gemini</span>'; setTimeout(()=>{ b.innerHTML = antes; },1800); });
  }));
}

async function crearPieza(item, tipo, texto, material, box, promptActual){
  const status = box.querySelector('#pm-pieza-status');
  const botones = box.querySelectorAll('.pm-pieza-btn,[data-pieza-crear]');
  botones.forEach(b=>b.disabled = true);
  status.textContent = '⏳ ' + PIEZAS[tipo].carga;
  try{
    const res = await fetch('/api/generar-anuncios', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        modo:'pieza', cliente: CLIENTE_ID, tipo,
        grupo_id: item.grupo_id || grupoId || '', producto_id: item.producto_id || productoId || '',
        card: {
          titulo:item.titulo, hook:item.hook, etapa:item.etapa, formato:item.formato, objetivo:item.objetivo, angulo:item.angulo,
          audiencia:item.audiencia, copy_publicacion:item.copy_publicacion, visual_sugerido:item.visual_sugerido,
          duracion_sugerida:item.duracion_sugerida, cta_boton:item.cta_boton, link_destino:item.link_destino,
          retroalimentacion:item.retroalimentacion, guion:item.guion,
        },
        texto: texto || '',
        prompt_actual: promptActual || '',
        imagenes: material ? [{ mediaType:'image/jpeg', data:material.data }] : [],
      }),
    });
    const raw = await res.text(); let data = null; try{ data = JSON.parse(raw); }catch(e){}
    if(!res.ok || !data) throw new Error((data && data.error) || (res.status===413 ? 'El archivo pesa mucho; prueba con uno más ligero.' : 'No se pudo crear la pieza.'));
    Object.assign(item, data.pieza || {});
    piezasAbiertas.add(item.id+':'+tipo);
    if(!item.guion) item.guion = {};
    scheduleCardsSave();
    piezaMaterial[tipo] = null;
    pintarPiezas(item);
    pintarPreviewPost(item);
  }catch(err){
    status.textContent = '⚠️ ' + (err.message || 'No se pudo crear la pieza.');
    botones.forEach(b=>b.disabled = false);
  }
}

function cerrarPostModal(){
  if(postModalEl){ postModalEl.remove(); postModalEl = null; }
  document.removeEventListener('keydown', teclaPostModal);
  document.body.classList.remove('pm-abierto');
  postModalSnapshot = null; postModalId = null;
  render();
}
function teclaPostModal(e){ if(e.key==='Escape') guardarPostModal(); }
async function guardarPostModal(){
  clearTimeout(cardsSaveTimer);
  if(cardsPendingSave) await doSaveCards();
  cerrarPostModal();
}
function cancelarPostModal(){
  if(postModalSnapshot){
    const i = cards.findIndex(c=>c.id===postModalId);
    if(i!==-1) cards[i] = postModalSnapshot;
    scheduleCardsSave();
  }
  cerrarPostModal();
}

      <div class="pm-body">
        <div class="pm-form">
          <div class="pm-sec"><div class="pm-label">Formato</div>
            <div class="pm-pills" id="pm-formatos">${FORMATOS.map(f=>`<button type="button" class="pm-pill${item.formato===f?' on':''}" data-formato="${f}">${FORMATO_ICO[f]||''} ${f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join('')}</div></div>
          <div class="pm-sec"><div class="pm-label">Redes donde se publica</div>
            <div class="pm-pills" id="pm-redes">${REDES.map(([k,n])=>`<button type="button" class="pm-pill${redesDe(item).includes(k)?' on':''}" data-red="${k}">${n}</button>`).join('')}</div></div>
          <div class="detail-grid">
            <div class="clasif-row" style="display:flex;gap:10px;flex-wrap:wrap;">${clasifFieldsHtml(item)}</div>
            ${textFieldHtml(item,'objetivo','Objetivo del anuncio')}
            <div class="detail-field retro-field">
              <label>💬 Retroalimentación (se usa en las próximas generaciones)</label>
              <textarea data-id="${item.id}" data-field="retroalimentacion" placeholder="Ej: falta mencionar que son 10 agentes de IA trabajando para el negocio...">${escHtml(item.retroalimentacion)}</textarea>
            </div>
            <div class="pm-links" id="pm-links"></div>
            ${textFieldHtml(item,'visual_sugerido','Visual sugerido (qué mostrar)')}
            ${textFieldHtml(item,'duracion_sugerida','Duración sugerida')}
            ${promptFieldHtml(item,'copy_publicacion','Copy para publicar')}
            ${metaFieldsHtml(item)}
            <div class="pm-piezas" id="pm-piezas"></div>
          </div>
        </div>
        <aside class="pm-side" id="pm-preview"></aside>
      </div>
      <div class="pm-foot">
        <button type="button" class="pm-cancel" id="pm-cancel">Cancelar</button>
        <button type="button" class="btn btn-solid btn-pill" id="pm-save">Guardar</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  document.body.classList.add('pm-abierto');
  postModalEl = el;
  pintarPreviewPost(item);
  bindCardEvents(el);
  linkVistaId = '';
  pintarLinks(item, el);
  pintarPiezas(item, el);

  // La vista previa y el chip de estado se mantienen al día mientras se edita.
  el.addEventListener('input', ()=>pintarPreviewPost(item));
  el.querySelectorAll('#pm-formatos [data-formato]').forEach(b=>b.addEventListener('click',()=>{
    item.formato = b.dataset.formato;
    el.querySelectorAll('#pm-formatos .pm-pill').forEach(x=>x.classList.toggle('on', x===b));
    scheduleCardsSave(); pintarPreviewPost(item);
  }));
  el.querySelectorAll('#pm-redes [data-red]').forEach(b=>b.addEventListener('click',()=>{
    const set = new Set(redesDe(item));
    if(set.has(b.dataset.red)) set.delete(b.dataset.red); else set.add(b.dataset.red);
    item.redes = REDES.map(r=>r[0]).filter(k=>set.has(k));
    b.classList.toggle('on', set.has(b.dataset.red));
    scheduleCardsSave(); pintarPreviewPost(item);
  }));
  el.querySelector('.estado-select').addEventListener('change',(e)=>{
    e.target.className = 'estado-select '+e.target.value;
    el.querySelector('#pm-chip-estado').textContent = ESTADO_LABEL[e.target.value]||e.target.value;
  });
  el.querySelector('#pm-del').addEventListener('click',()=>{
    if(!confirm('¿Eliminar esta campaña? No se puede deshacer.')) return;
    cards = cards.filter(c=>c.id!==item.id);
    document.getElementById('count-cards').textContent = cards.length;
    scheduleCardsSave();
    postModalSnapshot = null;
    cerrarPostModal();
  });
  el.querySelector('#pm-x').addEventListener('click', guardarPostModal);
  el.querySelector('#pm-save').addEventListener('click', guardarPostModal);
  el.querySelector('#pm-cancel').addEventListener('click', cancelarPostModal);
  el.addEventListener('mousedown',(e)=>{ if(e.target===el) guardarPostModal(); });
  document.addEventListener('keydown', teclaPostModal);
  const t = el.querySelector('.pm-titulo'); if(t) autoGrow(t);
}

function getField(item, field){
  if(field.indexOf('guion.')===0) return (item.guion||{})[field.slice(6)];
  if(field==='hooks_alternativos') return (item.hooks_alternativos||[]).join('\n');
  return item[field];
}
function setField(item, field, value){
  if(field.indexOf('guion.')===0){ if(!item.guion) item.guion={}; item.guion[field.slice(6)]=value; return; }
  if(field==='hooks_alternativos'){ item.hooks_alternativos = value.split('\n').map(s=>s.trim()).filter(Boolean); return; }
  item[field]=value;
}

function bindCardEvents(container){
  container.querySelectorAll('select.estado-select').forEach(sel=>{
    sel.addEventListener('change',(e)=>{
      const item = cards.find(c=>c.id===e.target.dataset.id);
      if(!item) return;
      item.estado = e.target.value;
      scheduleCardsSave();
      render();
    });
  });
  container.querySelectorAll('.fecha-input,.hora-input,.gancho-input,.detail-field textarea,.detail-field input[type=text],.detail-field select').forEach(inp=>{
    if(inp.tagName==='TEXTAREA') autoGrow(inp);
    inp.addEventListener('input',(e)=>{
      if(inp.tagName==='TEXTAREA') autoGrow(inp);
      const item = cards.find(c=>c.id===e.target.dataset.id);
      if(!item) return;
      setField(item, e.target.dataset.field, e.target.value);
      scheduleCardsSave();
    });
  });
  container.querySelectorAll('.item-del').forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.preventDefault();
      if(!confirm('¿Eliminar esta campaña? No se puede deshacer.')) return;
      cards = cards.filter(c=>c.id!==btn.dataset.id);
      document.getElementById('count-cards').textContent = cards.length;
      scheduleCardsSave();
      render();
    });
  });
  container.querySelectorAll('.copy-field-btn').forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.preventDefault();
      const item = cards.find(c=>c.id===btn.dataset.id);
      if(!item) return;
      const value = getField(item, btn.dataset.copyTarget) || '';
      navigator.clipboard.writeText(value).then(()=>{
        const prev = btn.textContent;
        btn.textContent='✅ Copiado';
        setTimeout(()=>{ btn.textContent=prev; },1500);
      });
    });
  });
}

// ─── LLEGADA DESDE JEFE 366 + GUÍA DE USO ─────────────────────────────────
// Al darle "Ir con el Jefe de Anuncios" en el paso 8 de Jefe 366, esa página deja en localStorage el
// producto con el que se venía trabajando. Aquí se llenan los módulos del Generador (grupo, producto,
// 1 idea por etapa) y arranca la guía. Se consume una sola vez.
function leerLlegada366(){
  try{
    const raw=localStorage.getItem('jefeshub_366_a_anuncios');
    if(!raw) return null;
    localStorage.removeItem('jefeshub_366_a_anuncios');
    const d=JSON.parse(raw);
    if(!d || d.cliente!==CLIENTE_ID || Date.now()-(d.ts||0)>30*60*1000) return null;
    return d;
  }catch(e){ return null; }
}
const normNombre=(s)=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
function aplicarLlegada366(d){
  cantidadPorEtapa=1;
  anguloIdx='';
  const grupo=grupos.find(g=>g.id===d.grupo_id) || grupos.find(g=>normNombre(g.nombre)===normNombre(d.grupo_nombre));
  grupoId=grupo?grupo.id:'';
  const n=normNombre(d.producto_nombre);
  const delGrupo=productos.filter(p=>p&&p.nombre&&(!grupoId||p.grupo_id===grupoId));
  const prod=n?(delGrupo.find(p=>normNombre(p.nombre)===n)||delGrupo.find(p=>normNombre(p.nombre).includes(n)||n.includes(normNombre(p.nombre)))):null;
  productoId=prod?prod.id:'';
  productoNombre=d.producto_nombre||'';
  productoTexto=d.producto_texto||'';
}

// ─── FOCO (pastilla de arriba: ecosistema completo / un grupo / un producto) ──────────────────
// Es la misma pastilla de Jefe de Finanzas. Lo elegido manda en todo el Jefe: el chat, las ideas, el
// detalle, el targeting y las campañas nuevas usan grupoId/productoId, que el servidor convierte en
// la información de ese producto o grupo.
function focoDeEstado(){ return productoId ? productoId : (grupoId ? 'g:'+grupoId : 'all'); }
function sincronizarFoco(){
  if(window.__foco && window.__foco.get().id !== focoDeEstado()) window.__foco.set(focoDeEstado());
}
function aplicarFocoAEstado(f){
  const nuevoG = f.grupoId||'', nuevoP = f.productoId||'';
  if(nuevoG===grupoId && nuevoP===productoId) return false;
  grupoId = nuevoG; productoId = nuevoP; productoNombre = ''; productoTexto = '';
  return true;
}

// ─── INIT ─────────────────────────────────────────────────────────────────
cargarInicial().then(async ()=>{
  const llegada=leerLlegada366();
  try{ if(window.__foco) await window.__foco.ready; }catch(e){}
  // Las ofertas de Producto 366 que aún no están en el catálogo del ADN también se pueden elegir.
  if(window.__foco) window.__foco.lista().forEach(p=>{ if(p.origen366 && !productos.some(x=>x&&x.id===p.id)) productos.push(p); });
  if(window.__foco) aplicarFocoAEstado(window.__foco.get());
  if(llegada){ aplicarLlegada366(llegada); sincronizarFoco(); }
  if(window.__foco) window.__foco.onChange(f=>{ if(aplicarFocoAEstado(f)) render(); });
  pintarIconos();
  render();
  if(llegada) GuiaJefe.iniciar('anuncios');
});
