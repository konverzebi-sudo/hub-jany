<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rancho Seco — Hub de Jefes</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root{
    --bg: #0F0B16;
    --surface: #181120;
    --surface-2: #211829;
    --accent: #F2C230;
    --accent-soft: rgba(242,194,48,0.12);
    --chalk: #F3EEF9;
    --chalk-dim: #B6A9C7;
    --line: #332A3D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; }
  body{
    background: radial-gradient(ellipse 120% 60% at 50% -10%, #1B1224 0%, var(--bg) 55%);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  /* Grafo a pantalla completa */
  .graph-full{ position: fixed; inset: 0; }
  .center-aura{
    position: fixed; top: 50%; left: 50%; width: 900px; height: 900px;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    filter: blur(24px); pointer-events: none;
  }
  #hub-graph{ display:block; width:100%; height:100%; cursor: grab; position: relative; touch-action: none; }
  #hub-graph:active{ cursor: grabbing; }
  .star{ fill: var(--chalk); animation: twinkle 3.6s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:.12; } 50%{ opacity:.65; } }
  .stars-layer{ transform-box: view-box; transform-origin: center; animation: girar-fondo 220s linear infinite; }
  @keyframes girar-fondo{ from{ transform: rotate(0deg); } to{ transform: rotate(360deg); } }
  @keyframes respirar{ 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.07); } }
  .graph-node.active .node-icon, .graph-node.active .node-emoji,
  .graph-node.locked .node-icon, .graph-node.locked .node-emoji{ transform-box: fill-box; transform-origin: center; animation: respirar 4.4s ease-in-out infinite; }
  .graph-link{ stroke: var(--chalk-dim); stroke-width: 1.2; opacity: .38; }
  .graph-link.satellite-link{ stroke: var(--chalk); stroke-width: .7; opacity: .14; }
  .graph-node{ cursor: pointer; }
  .graph-node.locked{ cursor: not-allowed; }
  .graph-node.satellite{ pointer-events: none; }
  .graph-node.satellite circle{ fill: var(--chalk); opacity: .4; }
  .graph-node circle{ stroke-width: 1.5; transition: filter .15s ease; pointer-events: all; }
  /* Sin circulo alrededor del icono -- solo queda como area de click/arrastre invisible */
  .graph-node.active circle, .graph-node.locked circle{ fill: none; stroke: none; }
  .graph-node.active .node-icon, .graph-node.active .node-emoji{
    filter: drop-shadow(0 0 8px rgba(242,194,48,0.4));
    transition: filter .15s ease;
  }
  .graph-node.active:hover .node-icon, .graph-node.active:hover .node-emoji{ filter: drop-shadow(0 0 16px rgba(242,194,48,0.7)); }
  .graph-node.locked .node-icon, .graph-node.locked .node-emoji{ filter: grayscale(1); opacity: .45; }
  .graph-node .node-emoji{ font-size: 22px; text-anchor: middle; dominant-baseline: central; pointer-events: none; user-select: none; }
  .graph-node .node-lock{ font-size: 16px; text-anchor: middle; dominant-baseline: central; pointer-events: none; opacity: .6; }
  .graph-node .node-label{ font-family:'Oswald',sans-serif; font-size: 11px; letter-spacing: .04em; text-anchor: middle; fill: var(--chalk-dim); pointer-events: none; user-select: none; }
  .graph-node.active .node-label{ fill: var(--chalk); }
  .graph-node .node-num{ font-family:'Oswald',sans-serif; font-size: 9px; letter-spacing: .1em; text-anchor: middle; fill: var(--chalk-dim); opacity: .9; pointer-events: none; paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width: 3px; stroke-linejoin: round; }
  .graph-node .node-icon{ pointer-events: none; }

  /* Nodo central: ADN del negocio */
  .graph-node.adn-node circle{
    fill: var(--surface-2);
    stroke: #555;
    stroke-width: 2;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.08));
  }
  .graph-node.adn-node.connected circle{
    stroke: var(--accent);
    filter: drop-shadow(0 0 18px rgba(242,194,48,0.5));
    animation: adn-pulse 2.2s ease-in-out infinite;
  }
  @keyframes adn-pulse{ 0%,100%{ filter: drop-shadow(0 0 14px rgba(242,194,48,0.4)); } 50%{ filter: drop-shadow(0 0 26px rgba(242,194,48,0.75)); } }
  .graph-node.adn-node .node-emoji{ font-size: 30px; }
  .graph-node.adn-node .node-label{ font-size: 12px; fill: var(--chalk); }
  .graph-node.adn-node .node-status{ font-family:'Oswald',sans-serif; font-size: 9px; letter-spacing: .12em; text-transform:uppercase; text-anchor: middle; fill: #888; pointer-events: none; }
  .graph-node.adn-node.connected .node-status{ fill: var(--accent); }

  /* Overlay superior: breadcrumb de marca */
  .top-overlay{
    position: fixed; top: 20px; left: 24px; z-index: 10;
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Oswald',sans-serif; font-size: 11px; letter-spacing:.16em; text-transform:uppercase;
    color: var(--chalk-dim);
    padding: 7px 16px; border: 1px solid var(--line); border-radius: 100px;
    background: rgba(15,11,22,0.65); backdrop-filter: blur(6px);
  }
  .graph-hint{
    position: fixed; top: 20px; right: 24px; z-index: 10;
    font-family:'Oswald',sans-serif; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--chalk-dim); opacity: .7;
  }

  /* Pastilla de tokens, abajo al centro */
  .tokens-pill{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
    font-size: 12px; color: var(--chalk-dim);
    background: rgba(24,17,32,0.75); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 100px;
    padding: 8px 18px; white-space: nowrap;
  }

  /* FAB: Editar ADN */
  .fab-adn{
    position:fixed; bottom:24px; right:24px; z-index: 20;
    display:flex; align-items:center; gap:9px;
    background:#211829; border:1px solid var(--line); border-radius:40px;
    padding:11px 18px; font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.07em; text-transform:uppercase;
    color: var(--chalk-dim); text-decoration:none; transition:.15s;
  }
  .fab-adn:hover{ border-color: var(--accent); color: var(--accent); }

  .footer-overlay{
    position: fixed; bottom: 24px; left: 24px; z-index: 10;
    font-size: 11px; color: var(--chalk-dim); opacity: .6;
    max-width: 260px; line-height: 1.5;
  }
  .footer-overlay a{ color: var(--accent); text-decoration:none; }
  @media (max-width: 720px){
    .footer-overlay{ display:none; }
    .tokens-pill{ font-size: 10px; max-width: 82vw; overflow:hidden; text-overflow:ellipsis; }
  }
  @media (max-width: 480px){
    .graph-node .node-label{ font-size: 9px; }
    .graph-node .node-emoji{ font-size: 18px; }
  }
</style>
</head>
<body>

<div class="graph-full">
  <div class="center-aura"></div>
  <svg id="hub-graph"></svg>
</div>

<div class="top-overlay">
  <span style="color:#B8F725;">JefesHub</span><span style="opacity:.4;">·</span>
  <span>Hub de Jefes</span><span style="opacity:.4;">·</span>
  <span id="brand-marca-label" style="color:#F2C230;">Rancho Seco</span>
</div>
<span class="graph-hint">Arrastra los nodos · Click para entrar</span>

<div class="tokens-pill" id="tokens-pill">🔢 Cargando tokens…</div>

<a class="fab-adn" href="/rancho-seco/adn">✦ Editar ADN del negocio</a>

<div class="footer-overlay">
  Rancho Seco — filial oficial Club Chivas<br>
  Equipo de Marketing IA por <a href="https://jefeshub.com">JefesHub</a>
</div>

<script src="/js/storage-client.js"></script>
<script>
(function initHubGraph(){
  const CLIENTE_ID = 'rancho-seco';

  const jefes = [
    {id:0, num:'01', icono:'jefe-366', nombre:'Jefe 366', activo:true, href:'/rancho-seco/consultor-366'},
    {id:5, num:'02', icono:'jefe-contenido', nombre:'Jefe de Contenido', activo:true, href:'/rancho-seco/consultor-contenido'},
    {id:3, num:'03', icono:'jefe-whatsapp', nombre:'WhatsApp y Ventas', activo:true, href:'/rancho-seco/consultor-whatsapp'},
    {id:1, num:'04', icono:'jefe-finanzas', nombre:'Jefe de Finanzas', activo:true, href:'/rancho-seco/consultor-financiero'},
    {id:4, num:'05', icono:'jefe-radar', nombre:'Jefe del Faro', activo:true, href:'/rancho-seco/consultor-radar'},
    {id:6, num:'06', icono:'jefe-anuncios', nombre:'Jefe de Anuncios', activo:true, href:'/rancho-seco/consultor-anuncios'},
    {id:7, num:'07', icono:'jefe-produccion-video', nombre:'Jefe Productor IA', activo:true, href:'/rancho-seco/consultor-produccion-video'},
    {id:2, num:'08', icono:'jefe-conversion', nombre:'Jefe de Conversión', activo:true, href:'/rancho-seco/consultor-cierre'},
    {id:8, num:'09', icono:'jefe-optimizacion', nombre:'Jefe de Mejora Constante', activo:true, href:'/rancho-seco/consultor-optimizacion'},
    {id:9, num:'10', icono:'jefe-temporada', nombre:'Campañas de Temporada', activo:true, href:'/rancho-seco/consultor-temporada'},
    {id:10, num:'11', icono:'jefe-agenda', nombre:'Jefe de Agenda', activo:true, href:'/rancho-seco/consultor-agenda'},
  ];
  // Nodo central: el ADN del negocio. Todos los Jefes conectan hacia el
  // (hub-and-spoke) -- la conexion es decorativa/tematica, no representa
  // paso de datos real entre Jefes.
  const adnNode = {id:'adn', esADN:true, nombre:'ADN pendiente', href:'/rancho-seco/adn'};
  const nodesData = [adnNode, ...jefes];
  const linksData = jefes.map(j => ({source:'adn', target:j.id}));

  // Nodos satelite: puntos decorativos sin datos ni click, solo dan la
  // textura de "constelacion" densa (inspirado en la vista de grafo de
  // Obsidian) -- no representan informacion real.
  function agregarSatelites(parent, cantidad){
    const radioPadre = parent.esADN ? 60 : (parent.activo?46:36);
    for(let i=0;i<cantidad;i++){
      const id = 'sat-' + parent.id + '-' + i;
      const orbitRadius = radioPadre + 16 + Math.random()*30;
      const orbitSpeed = (Math.random()<0.5 ? -1 : 1) * (0.006 + Math.random()*0.016);
      nodesData.push({id, esSatelite:true, parentRef:parent, orbitRadius, orbitSpeed, orbitAngle: Math.random()*Math.PI*2});
      linksData.push({source:parent.id, target:id, esSatelite:true});
    }
  }
  agregarSatelites(adnNode, 14);
  jefes.forEach(j => agregarSatelites(j, j.activo ? 5 : 2));

  const svg = d3.select('#hub-graph');
  let width = window.innerWidth, height = window.innerHeight;
  let margenArriba = Math.min(140, height * 0.22); // deja espacio para el breadcrumb + instrucciones de arriba
  svg.attr('viewBox', [0,0,width,height]);

  // Todo lo visual vive dentro de zoomRoot para poder hacer pinch-zoom
  // (o rueda/ctrl+scroll en escritorio) sin pelearse con el drag de
  // cada nodo, que sigue funcionando igual.
  const zoomRoot = svg.append('g').attr('class','zoom-root');
  const starsLayer = zoomRoot.append('g').attr('class','stars-layer');
  const graphGroup = zoomRoot.append('g').attr('class','graph-depth');
  svg.call(d3.zoom().scaleExtent([0.4, 3.2]).on('zoom', (event) => {
    zoomRoot.attr('transform', event.transform);
  }));
  function pintarEstrellas(){
    const cantidad = 90;
    const estrellas = Array.from({length: cantidad}, () => ({
      cx: Math.random()*width, cy: Math.random()*height,
      r: Math.random()*1.3 + 0.4, delay: Math.random()*3.6
    }));
    starsLayer.selectAll('circle').data(estrellas).join('circle')
      .attr('class','star')
      .attr('cx', d=>d.cx).attr('cy', d=>d.cy).attr('r', d=>d.r)
      .style('animation-delay', d => d.delay + 's');
  }
  pintarEstrellas();

  adnNode.x = width/2; adnNode.y = height/2;
  adnNode.fx = width/2; adnNode.fy = height/2; // fijo en el centro siempre

  const r0 = Math.min(width,height)/2 - 90;
  jefes.forEach((d,i)=>{
    const angle = (i/jefes.length)*2*Math.PI;
    d.x = width/2 + r0*Math.cos(angle);
    d.y = height/2 + r0*Math.sin(angle);
  });

  function radioDe(d){ return d.esADN ? 60 : d.esSatelite ? 2.4 : (d.activo?46:36); }

  // El simulador de D3 se "enfria" y se detiene solo tras ~5s por diseño.
  // Un alphaTarget permanente arriba de alphaMin lo mantiene vivo para
  // siempre, y esta fuerza de "vida" le da un temblor organico continuo
  // (si no, el grafo se congela por completo una vez que se acomoda).
  const ALPHA_VIDA = 0.045;
  function fuerzaVida(alpha){
    for (const d of nodesData){
      if (d.esADN || d.esSatelite) continue;
      d.vx += (Math.random()-0.5) * 0.34 * alpha;
      d.vy += (Math.random()-0.5) * 0.34 * alpha;
      // Empuje suave (no una pared dura) para que no invadan el area del
      // breadcrumb/instrucciones -- entre mas se metan ahi, mas fuerte los
      // regresa, pero sin pegarlos todos exactamente a la misma altura.
      if (d.y < margenArriba) d.vy += (margenArriba - d.y) * 0.06;
    }
  }

  const simulation = d3.forceSimulation(nodesData)
    .force('link', d3.forceLink(linksData).id(d=>d.id)
      .distance(d => d.esSatelite ? 26 + Math.random()*22 : 190)
      .strength(d => d.esSatelite ? 0.7 : 0.5))
    .force('charge', d3.forceManyBody().strength(d => d.esSatelite ? -6 : -340))
    .force('center', d3.forceCenter(width/2, height/2))
    .force('collide', d3.forceCollide(d => d.esSatelite ? 5 : radioDe(d)+16))
    .force('vida', fuerzaVida)
    .alphaTarget(ALPHA_VIDA);

  const link = graphGroup.append('g').selectAll('line')
    .data(linksData).join('line')
    .attr('class', d => 'graph-link' + (d.esSatelite ? ' satellite-link' : ''));

  const node = graphGroup.append('g').selectAll('g')
    .data(nodesData).join('g')
    .attr('class', d => d.esADN ? 'graph-node adn-node' : d.esSatelite ? 'graph-node satellite' : 'graph-node ' + (d.activo ? 'active' : 'locked'))
    .call(d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended));

  // Envolvemos el contenido clickeable en <a> real (no solo un handler de click en JS) para que
  // el navegador ofrezca "Abrir enlace en pestaña nueva" en el clic derecho, y que clic central /
  // Ctrl+clic abran una pestaña nueva de forma nativa -- antes solo funcionaba el clic normal.
  const nodeLink = node.append('a')
    .attr('href', d => d.href || null)
    .attr('xlink:href', d => d.href || null);

  nodeLink.append('circle').attr('r', radioDe);
  const nodePrincipal = nodeLink.filter(d=>!d.esADN && !d.esSatelite);
  nodePrincipal.append('image').attr('class','node-icon')
    .attr('href', d => '/img/' + d.icono + '.webp')
    .attr('width', d => radioDe(d)*1.15).attr('height', d => radioDe(d)*1.15)
    .attr('x', d => -radioDe(d)*1.15/2).attr('y', d => -radioDe(d)*1.15/2)
    .style('animation-delay', () => (Math.random()*4.4) + 's');
  nodePrincipal.append('text').attr('class','node-num').attr('y', d=>d.activo?-26:-22).text(d=>d.num);
  nodePrincipal.filter(d=>!d.activo).append('text').attr('class','node-lock').attr('y',18).text('🔒');
  nodePrincipal.append('text').attr('class','node-label').attr('y', d=>radioDe(d)+18).text(d=>d.nombre);
  nodePrincipal.append('title').text(d => d.activo ? d.nombre : d.nombre + ' — Próximamente');

  // Nodo ADN: emoji, nombre del negocio (o "ADN pendiente"), y estado.
  // El nombre del negocio no tiene largo fijo -- si no encoge la letra,
  // un nombre largo se desborda del circulo.
  function ajustarTextoADN(el, texto){
    if(!el) return;
    el.textContent = texto;
    const maxWidth = 104, base = 12;
    let largo;
    try{ largo = el.getComputedTextLength(); }
    catch(e){ largo = texto.length * base * 0.55; }
    el.style.fontSize = (largo > maxWidth ? Math.max(8, base * maxWidth / largo) : base) + 'px';
  }
  nodeLink.filter(d=>d.esADN).append('text').attr('class','node-label').attr('id','adn-node-label').attr('y', 2);
  ajustarTextoADN(document.getElementById('adn-node-label'), adnNode.nombre);
  nodeLink.filter(d=>d.esADN).append('text').attr('class','node-status').attr('id','adn-node-status').attr('y', 20).text('Pendiente');
  nodeLink.filter(d=>d.esADN).append('title').attr('id','adn-node-title').text('Editar ADN del negocio');

  // El <a> ya navega solo con clic normal, Ctrl/Cmd+clic, clic central o "Abrir en pestaña nueva"
  // del menú de clic derecho. Solo hace falta cancelar la navegación cuando el clic en realidad
  // fue el final de un arrastre.
  let dragDistance = 0;
  node.on('click', (event) => {
    if (dragDistance > 6) event.preventDefault();
  });

  simulation.on('tick', () => {
    // Manten los Jefes dentro del viewport (con espacio para su etiqueta
    // debajo) -- sin esto, en pantallas angostas (celular) un nodo puede
    // terminar empujado al borde y quedar con el icono/texto cortado.
    for (const d of nodesData){
      if (d.esADN || d.esSatelite) continue;
      const r = radioDe(d) + 58;
      d.x = Math.max(r, Math.min(width - r, d.x));
      d.y = Math.max(r, Math.min(height - r, d.y)); // pared dura solo pegado al borde real -- el margen del breadcrumb ya lo maneja el empuje suave de arriba
    }
    for (const d of nodesData){
      if (d.esSatelite && d.parentRef){
        d.orbitAngle += d.orbitSpeed;
        d.x = d.parentRef.x + d.orbitRadius * Math.cos(d.orbitAngle);
        d.y = d.parentRef.y + d.orbitRadius * Math.sin(d.orbitAngle);
      }
    }
    link.attr('x1', d=>d.source.x).attr('y1', d=>d.source.y).attr('x2', d=>d.target.x).attr('y2', d=>d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  // Paralaje suave con el mouse: sensacion de profundidad barata moviendo
  // el grafo y el fondo de estrellas a velocidades distintas.
  document.querySelector('.graph-full').addEventListener('mousemove', (e) => {
    const relX = (e.clientX - width/2) / width;
    const relY = (e.clientY - height/2) / height;
    graphGroup.style('transform', `translate(${relX*22}px,${relY*22}px)`);
    starsLayer.style('transform', `translate(${relX*-8}px,${relY*-8}px)`);
  });

  function dragstarted(event, d){
    dragDistance = 0;
    if (!event.active) simulation.alphaTarget(0.25).restart();
    if (d.esADN) return; // el nodo ADN se queda fijo en el centro
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d){
    dragDistance += Math.abs(event.dx) + Math.abs(event.dy);
    if (d.esADN) return;
    d.fx = event.x; d.fy = event.y;
  }
  function dragended(event, d){
    if (!event.active) simulation.alphaTarget(ALPHA_VIDA);
    if (d.esADN) return;
    d.fx = null; d.fy = null;
  }

  window.addEventListener('resize', () => {
    width = window.innerWidth; height = window.innerHeight;
    margenArriba = Math.min(140, height * 0.22);
    svg.attr('viewBox', [0,0,width,height]);
    adnNode.fx = width/2; adnNode.fy = height/2;
    simulation.force('center', d3.forceCenter(width/2, height/2));
    simulation.alpha(0.3).restart();
    pintarEstrellas();
  });

  // ---------- ADN + tokens (misma logica de siempre, ahora actualiza el grafo) ----------
  (async function checkADN(){
    try{
      const result = await window.storage.get(CLIENTE_ID + ':brand-book.identidad');
      if(result && result.value){
        const data = JSON.parse(result.value);
        const nombre = data.nombre || '';
        if(nombre){
          const marcaLabel = document.getElementById('brand-marca-label');
          if(marcaLabel) marcaLabel.textContent = nombre;
          const adnG = document.querySelector('.graph-node.adn-node');
          if(adnG) adnG.classList.add('connected');
          ajustarTextoADN(document.getElementById('adn-node-label'), nombre);
          const status = document.getElementById('adn-node-status');
          if(status) status.textContent = 'Tu ADN';
          const title = document.getElementById('adn-node-title');
          if(title) title.textContent = nombre + ' — Editar ADN';
        }
      }
    }catch(e){}

    try{
      const r = await window.storage.get(CLIENTE_ID + ':uso-tokens-log');
      const items = r && r.value ? JSON.parse(r.value) : [];
      const inputT = items.reduce((s, it) => s + (it.inputTokens || 0), 0);
      const outputT = items.reduce((s, it) => s + (it.outputTokens || 0), 0);
      const total = inputT + outputT;
      document.getElementById('tokens-pill').textContent = total > 0
        ? `🔢 ${total.toLocaleString('es-MX')} tokens (entrada: ${inputT.toLocaleString('es-MX')} · salida: ${outputT.toLocaleString('es-MX')})`
        : '🔢 Todavía no hay uso registrado';
    }catch(e){
      document.getElementById('tokens-pill').textContent = '🔢 No se pudo cargar el uso';
    }
  })();
})();
</script>
</body>
</html>
