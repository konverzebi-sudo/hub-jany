<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hub de Jefes</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;800;900&family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blanco:#FFFFFF; --fondo:#F6F7F1; --borde:#E4E6DB; --negro:#0F0E0C;
    --lima:#C9F507; --oliva:#A4B41C; --gris:#5D6055;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:#FFFFFF; color:var(--negro); font-family:'Barlow',sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  /* Fondo blanco con la cuadrícula muy sutil (10%) */
  body::before{ content:''; position:fixed; inset:0; z-index:-1; background:url('/img/fondo-buscador.webp') center / cover no-repeat; opacity:.1; pointer-events:none; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; color:inherit; }

  .aviso{ background:var(--negro); color:#fff; font-size:13px; padding:8px 16px; text-align:center; }
  .aviso b{ color:var(--lima); }

  header{ position:absolute; top:0; right:0; display:flex; justify-content:flex-end; align-items:center; padding:16px 24px; z-index:5; }
  .btn-sec{ display:inline-flex; align-items:center; gap:6px; font:600 14px 'Barlow'; border:1.5px solid var(--negro); background:var(--blanco); border-radius:999px; padding:8px 16px; cursor:pointer; }
  .btn-sec:hover{ background:var(--negro); color:#fff; }

  main{ flex:1; width:100%; max-width:820px; margin:0 auto; padding:56px 20px 16vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .robot{ width:110px; height:auto; margin:0 0 12px; display:block; }
  h1{ font-family:'Inter Tight'; font-weight:900; font-size:clamp(32px,6vw,54px); line-height:1.05; letter-spacing:-.02em; text-align:center; margin:0 0 26px; }
  h1 mark{ background:var(--lima); color:var(--negro); padding:0 .18em; border-radius:6px; }

  /* Texto con corchetes, igual que "Por Jany Dávila" en jefeshub.com */
  .ceja{ display:flex; align-items:center; justify-content:center; gap:16px; margin:-12px 0 26px; }
  .ceja .cor{ display:flex; flex-direction:column; gap:5px; }
  .ceja .cor i{ display:block; width:12px; height:12px; border:0 solid #8A9714; }
  .ceja .cor.izq i:first-child{ border-top-width:2px; border-left-width:2px; }
  .ceja .cor.izq i:last-child{ border-bottom-width:2px; border-left-width:2px; }
  .ceja .cor.der i:first-child{ border-top-width:2px; border-right-width:2px; }
  .ceja .cor.der i:last-child{ border-bottom-width:2px; border-right-width:2px; }
  .ceja span{ font:700 13px/1.4 'Inter Tight',sans-serif; letter-spacing:.25em; text-transform:uppercase; color:#6E7A0E; text-align:center; }

  .caja-wrap{ position:relative; width:100%; max-width:760px; }
  .caja{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; width:100%; background:var(--blanco); border:2px solid var(--borde); border-radius:22px; padding:10px 10px 10px 18px; box-shadow:0 6px 24px rgba(15,14,12,.06); transition:border-color .15s, box-shadow .15s; }
  .caja:focus-within, .caja:hover{ border-color:var(--negro); box-shadow:0 8px 30px rgba(15,14,12,.10); }
  .chip-jefe{ display:inline-flex; align-items:center; gap:6px; background:var(--lima); border-radius:999px; padding:4px 6px; font-weight:700; font-size:14px; white-space:nowrap; }
  .chip-jefe[hidden]{ display:none; }
  .chip-jefe img{ width:22px; height:22px; object-fit:contain; }
  .chip-jefe button{ border:0; background:transparent; cursor:pointer; font-size:16px; line-height:1; padding:0 4px; }
  .chip-proy{ background:#fff; border:2px solid #1A1A1A; padding:4px 10px; }
  .menu .op .ini{ width:30px; height:30px; flex:none; border-radius:9px; background:#F6F7F1; border:1.5px solid #E4E6DB; display:grid; place-items:center; font:700 14px Barlow,sans-serif; color:#0F0E0C; }
  .caja .q-ed{ flex:1; min-width:180px; border:0; outline:0; font:500 18px/1.4 'Barlow'; color:var(--negro); background:transparent; padding:8px 0; max-height:160px; overflow-y:auto; white-space:pre-wrap; word-break:break-word; position:relative; }
  .caja .q-ed.vacio::before{ content:attr(data-ph); color:#9A9D90; position:absolute; left:0; top:8px; pointer-events:none; }
  .tag{ display:inline-flex; align-items:center; gap:6px; vertical-align:middle; border-radius:999px; padding:3px 6px 3px 10px; margin:0 2px; font:700 15px/1.3 'Barlow',sans-serif; white-space:nowrap; user-select:none; }
  .tag img{ width:20px; height:20px; object-fit:contain; }
  .tag-jefe{ background:var(--lima); }
  .tag-proy{ background:#fff; border:2px solid #1A1A1A; padding:1px 8px 1px 9px; }
  .tag-x{ border:0; background:transparent; cursor:pointer; font-size:16px; line-height:1; padding:0 4px; color:inherit; }
  .btn-ir{ flex:none; width:48px; height:48px; border-radius:50%; border:0; background:var(--negro); color:var(--lima); font-size:22px; font-weight:700; cursor:pointer; display:grid; place-items:center; }
  .btn-ir:hover{ background:#2a2925; }

  /* Lista que sale debajo de la caja: @Jefes o sugerencias */
  .menu{ position:absolute; left:0; right:0; top:calc(100% + 8px); background:var(--blanco); border:1.5px solid var(--borde); border-radius:16px; box-shadow:0 14px 40px rgba(15,14,12,.14); padding:6px; z-index:20; max-height:380px; overflow:auto; }
  .menu[hidden]{ display:none; }
  .menu .tit{ font-size:12px; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:.08em; padding:8px 10px 4px; }
  .menu .tit b{ color:var(--negro); background:var(--lima); border-radius:6px; padding:1px 6px; margin-left:4px; }
  .menu .op{ display:flex; align-items:center; gap:12px; width:100%; border:0; background:transparent; text-align:left; padding:8px 10px; border-radius:10px; cursor:pointer; }
  .menu .op[aria-selected="true"], .menu .op:hover{ background:var(--fondo); }
  .menu .op img{ width:30px; height:30px; object-fit:contain; flex:none; }
  .menu .op b{ display:block; font-size:15px; }
  .menu .op small{ color:var(--gris); font-size:13px; }
  .menu .op.sug{ padding:9px 10px; }
  .menu .op.sug .lupa{ width:18px; height:18px; flex:none; color:#9A9D90; }
  .menu .op.sug span{ flex:1; font-size:15px; font-weight:500; }
  .menu .op.sug span em{ font-style:normal; font-weight:700; }
  .menu .op.sug img{ width:22px; height:22px; opacity:.85; }
  .menu .vacio{ padding:10px; color:var(--gris); font-size:14px; }

  /* Resultado */
  .resultado{ width:100%; max-width:760px; margin-top:22px; }
  .resultado[hidden]{ display:none; }
  .tarjeta{ background:var(--negro); color:#fff; border-radius:22px; padding:22px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .tarjeta .logo{ width:64px; height:64px; border-radius:16px; background:var(--lima); display:grid; place-items:center; flex:none; }
  .tarjeta .logo img{ width:44px; height:44px; object-fit:contain; }
  .tarjeta .txt{ flex:1; min-width:200px; }
  .tarjeta .eti{ font-size:13px; color:var(--lima); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .tarjeta .nom{ font-family:'Bebas Neue'; font-size:34px; letter-spacing:.03em; line-height:1.05; }
  .tarjeta .por{ font-size:15px; color:#D7D9CF; margin-top:2px; }
  .tarjeta .preg{ font-size:14px; color:#BFC2B5; margin-top:8px; font-style:italic; }
  .btn-pri{ display:inline-flex; align-items:center; gap:8px; background:var(--lima); color:var(--negro); border:0; border-radius:999px; padding:12px 20px; font:700 15px 'Barlow'; cursor:pointer; white-space:nowrap; }
  .btn-pri:hover{ filter:brightness(.95); }
  .tambien{ margin-top:14px; }
  .tambien p{ font-size:14px; color:var(--gris); margin:0 0 8px; }
  .alt{ display:flex; gap:8px; flex-wrap:wrap; }
  .alt button{ display:inline-flex; align-items:center; gap:8px; background:var(--blanco); border:1.5px solid var(--borde); border-radius:999px; padding:6px 14px 6px 8px; font:600 14px 'Barlow'; cursor:pointer; }
  .alt button:hover{ border-color:var(--negro); }
  .alt img{ width:24px; height:24px; object-fit:contain; }

  /* Fila de Jefes */
  .fila{ width:100%; margin-top:40px; }
  .fila .ayuda{ text-align:center; font-size:14px; font-weight:500; color:#3F423A; margin:0 0 12px; }
  .iconos{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; user-select:none; }
  .ico{ position:relative; width:54px; height:54px; border-radius:14px; background:var(--blanco); border:1.5px solid var(--borde); display:grid; place-items:center; cursor:pointer; transition:transform .12s, border-color .12s, background .12s; padding:0; touch-action:manipulation; }
  .ico:hover{ transform:translateY(-2px); border-color:var(--negro); }
  .ico img{ width:30px; height:30px; object-fit:contain; pointer-events:none; }
  .ico[aria-pressed="true"]{ background:var(--lima); border-color:var(--negro); }
  .ico .pin{ position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--negro); color:var(--lima); font-size:10px; display:none; place-items:center; }
  .ico.fijo .pin{ display:grid; }
  .ico.arrastrando{ opacity:.35; }
  .iconos.ordenando .ico{ cursor:grabbing; }
  .ico:focus-visible{ outline:3px solid var(--negro); outline-offset:2px; }

  /* Tus links de trabajo (los mismos de la barra de los Jefes) */
  .links{ width:100%; margin:0 0 18px; padding-bottom:16px; border-bottom:1px solid var(--borde); }
  .links .cab{ display:flex; align-items:center; gap:10px; margin:0 0 12px; }
  .links .cab span{ font-size:12px; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:.14em; }
  .links .cab button{ font:600 12.5px 'Barlow'; background:transparent; border:1px solid var(--borde); border-radius:999px; padding:4px 10px; cursor:pointer; color:var(--gris); }
  .links .cab button[aria-pressed="true"]{ background:var(--negro); color:var(--lima); border-color:var(--negro); }
  .lk-fila{ display:flex; flex-wrap:wrap; gap:10px; user-select:none; }
  .lk{ position:relative; width:46px; height:46px; border-radius:50%; border:2px solid var(--negro); background:var(--blanco); display:grid; place-items:center; cursor:pointer; padding:0; color:var(--negro); touch-action:manipulation; transition:transform .12s; text-decoration:none; }
  .lk:hover{ transform:translateY(-2px); }
  .lk svg{ width:20px; height:20px; pointer-events:none; }
  .lk .letra{ font:800 16px 'Inter Tight'; pointer-events:none; }
  .lk.vacio{ border-style:dashed; border-color:#B5B8AD; color:#9A9D90; }
  .lk.mas{ border-color:var(--lima); border-width:2.5px; font-size:24px; line-height:1; }
  .lk.arrastrando{ opacity:.35; }
  .lk-fila.editando .lk:not(.mas)::after{ content:'✎'; position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--negro); color:var(--lima); font-size:10px; display:grid; place-items:center; }
  .lk-form{ max-width:460px; margin:14px 0 0; background:var(--blanco); border:1.5px solid var(--borde); border-radius:16px; padding:14px; display:grid; gap:8px; }
  .lk-form[hidden]{ display:none; }
  .lk-form b{ font-size:15px; }
  .lk-form small{ color:var(--gris); font-size:13px; }
  .lk-form input{ width:100%; font:500 15px 'Barlow'; border:1.5px solid var(--borde); border-radius:10px; padding:9px 12px; outline:0; }
  .lk-form input:focus{ border-color:var(--negro); }
  .lk-form .acc{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .lk-form .borrar{ margin-left:auto; font:600 13px 'Barlow'; background:transparent; border:0; color:#B42318; cursor:pointer; }

  /* Widget */
  .widget{ width:100%; margin-top:18px; background:var(--blanco); border:1.5px solid var(--borde); border-radius:22px; padding:20px; box-shadow:0 8px 28px rgba(15,14,12,.06); }
  .widget[hidden]{ display:none; }
  .w-cab{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .w-cab .wl{ width:46px; height:46px; border-radius:12px; background:var(--lima); display:grid; place-items:center; flex:none; }
  .w-cab .wl img{ width:30px; height:30px; object-fit:contain; }
  .w-cab .wt{ flex:1; min-width:160px; }
  .w-cab .wn{ font-family:'Bebas Neue'; font-size:28px; letter-spacing:.03em; line-height:1; }
  .w-cab .wq{ font-size:14px; color:var(--gris); }
  .w-acc{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn-pin{ font:600 13px 'Barlow'; background:transparent; border:1.5px solid var(--borde); border-radius:999px; padding:7px 12px; cursor:pointer; }
  .btn-pin:hover{ border-color:var(--negro); }
  .btn-pin[aria-pressed="true"]{ background:var(--negro); color:var(--lima); border-color:var(--negro); }
  .btn-x{ width:34px; height:34px; border-radius:50%; border:1.5px solid var(--borde); background:transparent; cursor:pointer; font-size:18px; line-height:1; }
  .btn-x:hover{ border-color:var(--negro); }
  .w-cuerpo .eti{ font-size:12px; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:.08em; margin:0 0 6px; }
  .w-cuerpo p{ margin:0 0 10px; line-height:1.5; }
  .w-cuerpo .vacio{ color:var(--gris); }
  .w-cuerpo .cifra{ font-family:'Bebas Neue'; font-size:46px; line-height:1; letter-spacing:.02em; }
  .w-cuerpo .cifra small{ font-family:'Barlow'; font-size:15px; color:var(--gris); letter-spacing:0; margin-left:4px; }
  .w-cuerpo .barra{ height:10px; background:var(--fondo); border-radius:999px; overflow:hidden; margin:8px 0 10px; }
  .w-cuerpo .barra i{ display:block; height:100%; background:var(--lima); border-radius:999px; }
  .w-cuerpo .lista{ list-style:none; margin:0 0 12px; padding:0; display:grid; gap:8px; }
  .w-cuerpo .lista li a, .w-cuerpo .lista li > div{ display:flex; gap:10px; align-items:center; background:var(--fondo); border-radius:12px; padding:10px 12px; }
  .w-cuerpo .lista li a:hover{ outline:1.5px solid var(--negro); }
  .w-cuerpo .lista .f{ font-family:'Bebas Neue'; font-size:18px; min-width:58px; letter-spacing:.03em; }
  .w-cuerpo .lista .t{ flex:1; font-weight:500; }
  .w-cuerpo .atras{ color:#B42318; font-weight:700; font-size:13px; }
  .w-cuerpo .viene{ list-style:none; margin:0 0 12px; padding:0; display:grid; gap:10px; }
  .w-cuerpo .viene li{ display:flex; gap:14px; align-items:center; background:var(--fondo); border-radius:14px; padding:14px 16px; }
  .w-cuerpo .viene li::before{ content:''; width:10px; height:10px; border-radius:50%; background:var(--oliva); flex:none; }
  .w-cuerpo .viene li.pronto::before{ background:var(--lima); box-shadow:0 0 0 3px rgba(201,245,7,.35); }
  .w-cuerpo .viene b{ display:block; font-size:16px; font-weight:700; line-height:1.3; }
  .w-cuerpo .viene small{ display:block; color:var(--gris); font-size:14px; margin-top:2px; }
  .w-cuerpo .posts{ list-style:none; margin:0 0 12px; padding:0; display:grid; gap:10px; }
  .w-cuerpo .posts a{ display:flex; gap:14px; align-items:center; background:var(--fondo); border-radius:14px; padding:12px 16px; }
  .w-cuerpo .posts a:hover{ outline:1.5px solid var(--negro); }
  .w-cuerpo .posts .mini{ width:56px; height:72px; border-radius:10px; background:var(--negro); color:var(--lima); display:grid; place-items:center; flex:none; font:800 13px 'Barlow'; letter-spacing:.02em; text-transform:uppercase; }
  .w-cuerpo .posts b{ display:block; font-size:17px; font-weight:700; line-height:1.3; }
  .w-cuerpo .posts small{ display:block; color:var(--gris); font-size:14px; margin-top:4px; }
  .w-cuerpo .posts .atr{ color:#B42318; font-weight:700; }
  .w-cuerpo .wa-in{ background:var(--fondo); border:1.5px solid var(--borde); border-radius:16px; padding:12px; margin-bottom:12px; }
  .w-cuerpo .wa-in:focus-within{ border-color:var(--negro); }
  .w-cuerpo .wa-in textarea{ width:100%; border:0; outline:0; resize:vertical; min-height:70px; background:transparent; font:500 16px/1.45 'Barlow'; color:var(--negro); }
  .w-cuerpo .wa-acc{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .w-cuerpo .btn-sub{ display:inline-flex; align-items:center; gap:6px; font:600 14px 'Barlow'; background:var(--blanco); border:1.5px solid var(--borde); border-radius:999px; padding:8px 14px; cursor:pointer; }
  .w-cuerpo .btn-sub:hover{ border-color:var(--negro); }
  .w-cuerpo .wa-img{ display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--gris); }
  .w-cuerpo .wa-img img{ width:38px; height:38px; object-fit:cover; border-radius:8px; border:1px solid var(--borde); }
  .w-cuerpo .wa-img button{ border:0; background:transparent; cursor:pointer; font-size:16px; }
  .w-cuerpo .wa-res .eti{ margin-top:6px; }
  .w-cuerpo .wa-res .nota{ color:var(--gris); font-size:14px; margin:0 0 10px; }
  .w-cuerpo details.bienv{ margin-top:14px; border-top:1px solid var(--borde); padding-top:10px; }
  .w-cuerpo details.bienv summary{ cursor:pointer; font-size:12px; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:.08em; }
  .w-cuerpo details.bienv .burbuja{ margin-top:10px; }
  /* Anuncios: vistas previas chiquitas, como dentro del Jefe de Anuncios */
  .w-cuerpo .ads{ display:flex; gap:12px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:6px; scroll-snap-type:x mandatory; }
  .w-cuerpo .adm{ flex:0 0 190px; scroll-snap-align:start; background:#fff; border:1px solid var(--borde); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 4px 14px rgba(15,14,12,.06); }
  .w-cuerpo .adm-est{ display:flex; align-items:center; gap:6px; padding:8px 10px; font-size:12.5px; font-weight:700; background:var(--negro); color:#fff; }
  .w-cuerpo .adm-est::before{ content:''; width:8px; height:8px; border-radius:50%; background:var(--lima); flex:none; }
  .w-cuerpo .adm-est.prox::before{ background:#F2C230; }
  .w-cuerpo .adm-est.otro::before{ background:#9A9D90; }
  .w-cuerpo .adm-top{ display:flex; align-items:center; gap:8px; padding:8px 10px 4px; }
  .w-cuerpo .adm-av{ width:26px; height:26px; border-radius:50%; background:var(--lima); display:grid; place-items:center; font:800 12px 'Inter Tight'; flex:none; }
  .w-cuerpo .adm-top b{ display:block; font-size:12.5px; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .w-cuerpo .adm-top small{ display:block; font-size:11px; color:var(--gris); }
  .w-cuerpo .adm-copy{ padding:2px 10px 8px; font-size:12.5px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; min-height:3.5em; }
  .w-cuerpo .adm-media{ position:relative; aspect-ratio:1/1; background:linear-gradient(160deg,#EAFBB8,#C6F04E); display:grid; place-items:center; overflow:hidden; font-size:30px; }
  .w-cuerpo .adm-media img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .w-cuerpo .adm-media .pchip{ position:absolute; left:8px; bottom:8px; background:rgba(15,14,12,.75); color:#fff; font-size:11px; font-weight:700; border-radius:999px; padding:2px 8px; text-transform:capitalize; }
  .w-cuerpo .adm-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; background:#F0F2F5; margin-top:auto; }
  .w-cuerpo .adm-foot b{ font-size:12px; line-height:1.25; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .w-cuerpo .adm-foot span{ background:#E4E6EB; border-radius:6px; padding:5px 8px; font-size:11.5px; font-weight:700; white-space:nowrap; flex:none; }
  .w-cuerpo .adm-nom{ padding:6px 10px 8px; font-size:11.5px; color:var(--gris); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border-top:1px solid var(--borde); }
  /* Resultados: los 4 análisis del Jefe, cada uno con su link directo */
  .w-cuerpo .rutas{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:6px; }
  .w-cuerpo .rutas a{ display:flex; flex-direction:column; gap:6px; background:#fff; border:1.5px solid var(--borde); border-radius:16px; padding:16px; transition:border-color .12s, transform .12s; }
  .w-cuerpo .rutas a:hover{ border-color:var(--lima); transform:translateY(-2px); }
  .w-cuerpo .rutas .em{ font-size:28px; line-height:1; }

<script>
(function(){
  // Hub desde la ruta (/rancho-seco/buscar → rancho-seco). Sin datos de marca en el código.
  const HUB = (() => { const s = location.pathname.split('/').filter(Boolean)[0] || ''; return s && !s.includes('.') && s !== 'buscar' ? s : 'jefeshub'; })();
  const PRE = HUB === 'jefeshub' ? '' : '/' + HUB;
  const $ = id => document.getElementById(id);
  $('verTodos').href = PRE ? PRE : '/tablero';
  // Cálculos que ya usa el tablero principal (js/tablero-hub.js).
  const T = (window.__tableroHub && window.__tableroHub._probar) || {};

  // ── Los Jefes, con palabras que los identifican (sin acentos, en minúsculas) ──
  const JEFES = [
    { id:'366', nombre:'Jefe 366', alias:['366','estrategia'], logo:'jefe-366-logo-negro', ruta:'/jefe-366', que:'Tu estrategia base para vender todo el año',
      claves:['estrategia','plan','366','todo el ano','objetivo','documento maestro','posicionamiento','oferta','mi negocio','crecer','hacia donde'] },
    { id:'contenido', nombre:'Jefe de Contenido', alias:['contenido'], logo:'jefe-contenido-logo-negro', ruta:'/jefe-contenido', que:'Posts, reels e historias con tu voz',
      claves:['post','posts','reel','reels','publicacion','publicar','contenido','historia','historias','caption','copy','guion','instagram','tiktok','carrusel','ideas de contenido','que publico','que subo','hashtag','calendario de contenido','atrasados'] },
    { id:'whatsapp', nombre:'Jefe de WhatsApp y Ventas', alias:['whatsapp','ventas'], logo:'jefe-whatsapp-logo-negro', ruta:'/jefe-whatsapp', que:'Mensajes que cierran ventas',
      claves:['whatsapp','mensaje','cobrar','responder','contestar','cerrar venta','cerrar la venta','objecion','seguimiento','chat','cotizacion','me dejo en visto','cliente dice','esta caro','bienvenida','no contestaron'] },
    { id:'finanzas', nombre:'Jefe de Finanzas', alias:['finanzas','financiero'], logo:'jefe-finanzas-logo-negro', ruta:'/jefe-financiero', que:'Tus números y tu meta',
      claves:['dinero','precio','precios','cuanto debo','cuanto cobro','meta','ganancia','costo','costos','margen','facturacion','numeros','finanzas','utilidad','punto de equilibrio','cuanto vender','cuanto necesito','vender','tengo que vender','al mes','cuanto gano'] },
    { id:'faro', nombre:'Jefe del Faro', alias:['faro','radar'], logo:'jefe-faro-logo-negro', ruta:'/jefe-radar', que:'Tu mercado, tu competencia y la idea del día',
      claves:['competencia','competidor','tendencia','tendencias','mercado','de moda','investigar','radar','idea del dia','que hacen otros','viral'] },
    { id:'anuncios', nombre:'Jefe de Anuncios', alias:['anuncios'], logo:'jefe-anuncios-logo-negro', ruta:'/jefe-anuncios', que:'Anuncios listos para Meta',
      claves:['anuncio','anuncios','ads','publicidad','pagada','pautar','pauta','promocionar','facebook ads','meta ads','segmentacion','presupuesto de anuncios'] },
    { id:'productor', nombre:'Jefe Productor IA', alias:['productor','produccion','imagen'], logo:'jefe-produccion-video-logo-negro', ruta:'/jefe-produccion-video', que:'Imágenes y videos con IA',
      claves:['imagen','imagenes','foto','fotos','video con ia','video ia','generar imagen','diseno','producir','prompt de imagen','fotografia de producto','mockup','con ia'] },
    { id:'resultados', nombre:'Jefe de Resultados', alias:['resultados','cierre'], logo:'jefe-resultados-logo-negro', ruta:'/jefe-cierre', que:'Mide y mejora tus ventas',
      claves:['resultados','metricas','reporte','cuanto vendi','medir','rendimiento','optimizar','alcance','funciono','no funciono','cierre de mes','analizar','como me fue','me fue','como voy','este mes','vendi'] },
    { id:'temporada', nombre:'Jefe de Temporada', alias:['temporada'], logo:'jefe-temporada-logo-negro', ruta:'/jefe-temporada', que:'Las fechas clave para vender más',
      claves:['navidad','buen fin','san valentin','14 de febrero','dia de las madres','10 de mayo','dia del padre','temporada','hot sale','black friday','fin de ano','ano nuevo','regreso a clases','dia de muertos','halloween','fecha especial','campana de','reyes','cuesta de enero','semana santa','verano','fiestas patrias','primavera'] },
    { id:'agenda', nombre:'Jefe de Agenda', alias:['agenda'], logo:'jefe-agenda-logo-negro', ruta:'/jefe-agenda', que:'Organiza tu semana',
      claves:['agenda','semana','calendario','pendientes','organizar','organiza','organizo','horario','tareas','que hago hoy','recordatorio'] },
    { id:'herramientas', nombre:'Jefe de Herramientas', alias:['herramientas','apps'], logo:'jefe-herramientas-logo-negro', ruta:'/herramientas', que:'Las apps de tu negocio',
      claves:['app','apps','herramienta','herramientas','canva','capcut','aplicacion','programa','que uso para'] },
    { id:'adn', nombre:'ADN del negocio', alias:['adn','marca'], logo:'jefe-366-logo-negro', ruta:'/adn', que:'La información de tu marca que usan todos',
      claves:['adn','mi marca','colores','logo','tono de voz','identidad','mi cliente ideal','cliente ideal','audiencia','quien es mi cliente'] },
  ];
  // El Jefe de Prospección solo existe en el hub de Jany.
  if (HUB === 'jefeshub') JEFES.splice(JEFES.length - 1, 0, { id:'prospeccion', nombre:'Jefe de Prospección', alias:['prospeccion','prospectos'], logo:'jefe-prospeccion-logo-negro', ruta:'/jefe-prospeccion', que:'Primer contacto con clientes nuevos',
    claves:['prospeccion','prospectos','prospecto','clientes nuevos','primer contacto','buscar clientes','conseguir clientes','lista de prospectos','mensaje en frio','contactar'] });
  const porId = Object.fromEntries(JEFES.map(j => [j.id, j]));
  const logoSrc = j => '/img/' + j.logo + '.webp';
  const quitar = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const corta = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1).trim() + '…' : s; };

  // Elige al Jefe por palabras clave: gana el que tiene más coincidencias; si empatan, el que se mencionó primero.
  function elegir(texto){
    const t = ' ' + quitar(texto).replace(/[^a-z0-9ñ ]+/g, ' ').replace(/\s+/g, ' ') + ' ';
    const posDe = c => { const i = t.indexOf(' ' + c + ' '); return i >= 0 ? i : (c.length > 5 ? t.indexOf(c) : -1); };
    return JEFES.map(j => {
      let vistas = j.claves.filter(c => posDe(c) >= 0);
      vistas = vistas.filter(c => !vistas.some(o => o !== c && o.includes(c)));
      const pos = vistas.length ? Math.min(...vistas.map(posDe)) : Infinity;
      return { j, p: vistas.length, pos };
    }).filter(x => x.p > 0).sort((a, b) => b.p - a.p || a.pos - b.pos);
  }

  // ── Leer y guardar en el storage del hub ──
  function leer(k){
    return Promise.resolve().then(() => window.storage.get(HUB + ':' + k))
      .then(x => { if (!x || !x.value) return null; return typeof x.value === 'string' ? JSON.parse(x.value) : x.value; }, () => null)
      .catch(() => null);
  }
  // Llaves sin el prefijo del hub (ej. el Jefe de Prospección guarda en 'jefe-prospeccion:leads').
  function leerLlave(k){
    return Promise.resolve().then(() => window.storage.get(k))
      .then(x => { if (!x || !x.value) return null; return typeof x.value === 'string' ? JSON.parse(x.value) : x.value; }, () => null)
      .catch(() => null);
  }
  function guardar(k, v){ try { return Promise.resolve(window.storage.set(HUB + ':' + k, JSON.stringify(v))).catch(() => {}); } catch (e) { return Promise.resolve(); } }
  const isoDe = f => f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0');
  const HOY = isoDe(new Date());

  // Arrastrar para acomodar (lo usan los Jefes y los links). En celular: dejar presionado medio segundo.

      const p = HOY.split('-'); const hasta = isoDe(new Date(+p[0], +p[1] - 1, +p[2] + 6));
      const sem = ev.filter(e => e && /^\d{4}-\d{2}-\d{2}$/.test(e.fecha || '') && e.fecha >= HOY && e.fecha <= hasta).sort((a, b) => a.fecha < b.fecha ? -1 : 1);
      const lista = sem.length
        ? '<div class="eti">Pendientes de la semana</div><ul class="viene">' + sem.slice(0, 6).map(e => '<li><div><b>' + esc(corta(e.titulo, 90)) + '</b><small>' + esc(fechaCorta(e.fecha)) + '</small></div></li>').join('') + '</ul>' + (sem.length > 6 ? '<p class="vacio">Y ' + (sem.length - 6) + ' más.</p>' : '')
        : '<p class="vacio">Semana libre: no hay pendientes en tu agenda.</p>' + pide(['Organiza mi semana']);
      pinta(semanaHTML(d) + lista);
    },
    productor(d, pinta){
      // Lo último que se creó con IA (las imágenes guardadas en los posts y anuncios), completas y grandes, + qué crear hoy.
      const piezas = [];
      ['contenido', 'historias'].forEach(tab => (d.contenido && Array.isArray(d.contenido[tab]) ? d.contenido[tab] : []).forEach(x => {
        if (x && /^data:image\//.test(x.miniatura || '')) piezas.push({ img: x.miniatura, t: x.gancho || x.descripcion || 'Sin título', f: x.formato || (tab === 'historias' ? 'historia' : 'post'), fecha: x.fecha || '', href: r('/jefe-contenido#post=' + encodeURIComponent(x.id)) });
      }));
      (Array.isArray(d.anuncios) ? d.anuncios : []).forEach(x => {
        if (x && /^data:image\//.test(x.miniatura || '')) piezas.push({ img: x.miniatura, t: x.titulo || x.hook || 'Anuncio', f: 'anuncio', fecha: x.fecha || '', href: r('/jefe-anuncios') });
      });
      piezas.sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
      const ver = piezas.slice(0, 3);
      const IA = '<img src="/img/robot-hub-lima.webp" alt="">';
      pinta((ver.length
          ? '<div class="eti">Lo último que creaste con IA</div><div class="crea">' + ver.map((x, i) => '<a href="' + esc(x.href) + '"><div class="im"><img src="' + esc(x.img) + '" alt="" loading="lazy"><span class="n">' + (i + 1) + '</span><span class="pchip">' + esc(x.f) + '</span></div><div class="tx">' + esc(x.t) + '</div></a>').join('') + '</div>'
          : '<p class="vacio">Todavía no tienes imágenes hechas con IA. ¡Crea la primera!</p>') +
        '<div class="eti" style="margin-top:6px">¿Qué creamos hoy?</div><div class="crear-ia">' +
        [['Foto de producto con IA', 'Foto de producto'], ['Imagen para mi post de hoy', 'Imagen para mi post'], ['Prompt de video para reels', 'Video para reels'], ['Guion de video corto', 'Guion de video']]
          .map(x => '<button type="button" data-pide="' + esc(x[0]) + '">' + IA + '<span>' + esc(x[1]) + ' con <em>IA</em></span></button>').join('') + '</div>');
    },
    resultados(d, pinta){
      // Cada tarjeta abre el Jefe de Resultados directo en ese análisis (/jefe-cierre?ruta=...).
      const RUTAS = [
        ['tienda', '🏪', 'Tienda Online / Landing', 'Vendes por página web, landing, carrito o checkout.'],
        ['evento', '🎤', 'Cita, Llamada o Evento', 'Vendes por llamada, cita, masterclass, webinar, reserva o evento.'],
        ['mensaje', '💬', 'WhatsApp / Mensajes', 'Vendes por WhatsApp, Instagram DM o chat. Aquí mides tus tasas.'],
        ['campanas', '📈', 'Meta Ads', 'Sube tu reporte de Ads Manager y recibe qué anuncio escalar, cuál apagar y qué producir.'],
      ];
      pinta('<div class="eti">¿Qué quieres analizar?</div><div class="rutas">' + RUTAS.map(x =>
        '<a href="' + esc(r('/jefe-cierre?ruta=' + x[0])) + '"><span class="em" aria-hidden="true">' + x[1] + '</span><b>' + esc(x[2]) + '</b><small>' + esc(x[3]) + '</small></a>').join('') + '</div>');
    },
    herramientas(d, pinta){
      // Las apps del Jefe de Herramientas de este hub (o las de inicio). "+" agrega, ✎ edita o borra y se acomodan
      // arrastrando (el orden de aquí se guarda aparte; lo que se agrega o borra también sale en el Jefe).
      const A = (nombre, logo, glifo, links) => ({ nombre, logo, glifo: !!glifo, links });
      const BASE = [
        { titulo: '💬 Apps para atender y vender', apps: [
          A('WhatsApp Business', 'whatsapp-business', 0, [['App Store', 'https://apps.apple.com/us/app/whatsapp-business/id1386412985'], ['Play Store', 'https://play.google.com/store/apps/details?id=com.whatsapp.w4b']]),
          A('Facebook', 'facebook', 0, [['App Store', 'https://apps.apple.com/us/app/facebook/id284882215'], ['Play Store', 'https://play.google.com/store/apps/details?id=com.facebook.katana']]),
          A('Instagram', 'instagram', 0, [['App Store', 'https://apps.apple.com/us/app/instagram/id389801252'], ['Play Store', 'https://play.google.com/store/apps/details?id=com.instagram.android']]),
          A('Anuncios de Facebook', 'meta-ads', 0, [['App Store', 'https://apps.apple.com/us/app/meta-ads-manager/id964397083'], ['Play Store', 'https://play.google.com/store/apps/details?id=com.facebook.adsmanager']]),
          A('TikTok', 'tiktok', 0, [['App Store', 'https://apps.apple.com/us/app/tiktok/id835599320'], ['Play Store', 'https://play.google.com/store/apps/details?id=com.zhiliaoapp.musically']]) ] },
        { titulo: '📱 Apps para editar', apps: [
          A('CapCut', 'capcut', 1, [['App Store', 'https://apps.apple.com/us/app/capcut-photo-video-editor/id1500855883'], ['Play Store', 'https://play.google.com/store/apps/details?id=com.lemon.lvoverseas'], ['Web', 'https://www.capcut.com/']]),
          A('Edits (Instagram)', 'edits', 0, [['App Store', 'https://apps.apple.com/us/app/edits-an-instagram-app/id6738967378'], ['Play Store', 'https://play.google.com/store/apps/details?id=com.instagram.basel']]),
          A('Canva', 'canva', 0, [['App Store', 'https://apps.apple.com/us/app/canva-ai-photo-video-editor/id897446215'], ['Play Store', 'https://play.google.com/store/apps/details?id=com.canva.editor'], ['Web', 'https://www.canva.com/']]) ] },
        { titulo: '✨ Apps para editar con IA', apps: [
          A('Gemini', 'gemini', 1, [['App Store', 'https://apps.apple.com/us/app/google-gemini/id6477489729'], ['Play Store', 'https://play.google.com/store/apps/details?id=com.google.android.apps.bard'], ['Web', 'https://gemini.google.com/']]),
          A('ChatGPT', 'chatgpt', 1, [['App Store', 'https://apps.apple.com/us/app/chatgpt/id6448311069'], ['Play Store', 'https://play.google.com/store/apps/details?id=com.openai.chatgpt'], ['Web', 'https://chatgpt.com/']]),
          A('ElevenLabs', 'elevenlabs', 1, [['Web', 'https://join.elevenlabs.io/es']]),
          A('Higgsfield', 'higgsfield', 0, [['Web', 'https://higgsfield.ai/']]) ] },
      ];
      const seguras = u => { u = String(u || '').trim(); if (/^https?:\/\//i.test(u)) return u; if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return ''; return u ? 'https://' + u : ''; };
      const imgOk = x => typeof x === 'string' && x.length <= 80000 && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/]+=*$/.test(x);
      const secciones = () => (d.apps && d.apps.some(sec => sec && Array.isArray(sec.apps) && sec.apps.length)) ? d.apps : JSON.parse(JSON.stringify(BASE));
      const pos = n => { const i = (prefs.apps || []).indexOf(n); return i < 0 ? 999 : i; };
      const todas = () => secciones().flatMap(sec => (sec && Array.isArray(sec.apps) ? sec.apps : [])).filter(a => a && typeof a.nombre === 'string').sort((a, b) => pos(a.nombre) - pos(b.nombre));
      const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua), android = /Android/i.test(ua);
      const linkDe = a => {
        const ls = (Array.isArray(a.links) ? a.links : []).filter(l => Array.isArray(l) && seguras(l[1]));
        const busca = t => ls.find(l => String(l[0]).toLowerCase().includes(t));
        const l = (ios && busca('app store')) || (android && busca('play')) || (!ios && !android && busca('web')) || ls[0];
        return l ? seguras(l[1]) : '';
      };
      let editandoApps = false;
      const logoDe = a => imgOk(a.img) ? '<span class="ap"><img src="' + esc(a.img) + '" alt="" draggable="false"></span>'
        : (typeof a.logo === 'string' && /^[a-z0-9-]+$/.test(a.logo)) ? '<span class="ap' + (a.glifo ? ' glifo' : '') + '"><img src="/img/apps/' + a.logo + '.png" alt="" loading="lazy" draggable="false"></span>'
        : '<span class="ap" aria-hidden="true">' + esc(a.emoji || '🧩') + '</span>';
      function pintarApps(){
        const caja = $('wApps'); if (!caja) return;
        caja.classList.toggle('editando', editandoApps);
        caja.innerHTML = todas().map(a => {
          const u = linkDe(a);
          return editandoApps || !u
            ? '<button type="button" class="apl" data-id="' + esc(a.nombre) + '">' + logoDe(a) + esc(a.nombre) + '</button>'
            : '<a class="apl" data-id="' + esc(a.nombre) + '" href="' + esc(u) + '" target="_blank" rel="noopener" draggable="false">' + logoDe(a) + esc(a.nombre) + '</a>';
        }).join('') + '<button type="button" class="apl mas-app" title="Agregar una app"><span class="ap">+</span>Agregar</button>';
      }
      async function guardarSecciones(sec){
        d.apps = sec; await guardar('herramientas-apps', sec); pintarApps();
      }
      function formApp(a){
        const f = $('wAppForm');
        const web = a ? ((a.links || []).find(l => /web/i.test(l[0])) || (a.links || [])[0] || ['', ''])[1] : '';
        f.innerHTML = '<b>' + (a ? esc(a.nombre) : 'Agregar una app') + '</b><input id="apNom" placeholder="Nombre (ej. Notion, Calendly)" value="' + esc(a ? a.nombre : '') + '" autocomplete="off"><input id="apUrl" placeholder="Link de la app o su página" value="' + esc(web) + '" autocomplete="off">' +
          '<div class="acc"><button type="button" class="btn-ter" id="apOk">Guardar</button><button type="button" class="btn-pin" id="apNo">Cancelar</button>' + (a ? '<button type="button" class="borrar" id="apBorrar">Quitar app</button>' : '') + '</div>';
        f.hidden = false; $('apNom').focus();
        $('apNo').onclick = () => { f.hidden = true; };
        $('apOk').onclick = async () => {
          const nombre = $('apNom').value.trim(), url = seguras($('apUrl').value);
          if (!nombre || !url) { aviso('Pon el nombre y el link de la app.'); return; }
          const sec = JSON.parse(JSON.stringify(secciones()));
          if (a) { sec.forEach(x => (x.apps || []).forEach(y => { if (y.nombre === a.nombre) { y.nombre = nombre; const l = (y.links || []).find(z => /web/i.test(z[0])); if (l) l[1] = url; else y.links = (y.links || []).concat([['Web', url]]); } })); prefs.apps = (prefs.apps || []).map(n => n === a.nombre ? nombre : n); }
          else {
            let mias = sec.find(x => x.titulo === '⭐ Mis apps');
            if (!mias) { mias = { titulo: '⭐ Mis apps', apps: [] }; sec.push(mias); }
            mias.apps.push({ nombre, emoji: '🧩', links: [['Web', url]] });
            prefs.apps = todas().map(x => x.nombre).concat([nombre]);
          }
          guardarPrefs(); f.hidden = true; await guardarSecciones(sec); aviso('Listo, guardada.');
        };
        const b = $('apBorrar');
        if (b) b.onclick = async () => {
          const sec = JSON.parse(JSON.stringify(secciones()));
          sec.forEach(x => { x.apps = (x.apps || []).filter(y => y.nombre !== a.nombre); });
          f.hidden = true; await guardarSecciones(sec.filter(x => x.apps.length || x.titulo !== '⭐ Mis apps'));
        };
      }
      pinta('<div id="wLinks"></div><div class="apps-cab"><span class="eti">Tus apps</span><button type="button" id="apEditar" aria-pressed="false">✎ Editar</button></div><div class="apps" id="wApps"></div><div class="lk-form" id="wAppForm" hidden></div>');
      pintarApps();
      const caja = $('wApps');
      caja.addEventListener('click', e => {
        const b = e.target.closest('.apl'); if (!b || b.tagName === 'A') return;
        e.preventDefault();
        if (b.classList.contains('mas-app')) { formApp(null); return; }
        const a = todas().find(x => x.nombre === b.dataset.id); if (a) formApp(a);
      });
      $('apEditar').onclick = () => { editandoApps = !editandoApps; $('apEditar').setAttribute('aria-pressed', String(editandoApps)); $('wAppForm').hidden = true; pintarApps(); };
      ordenable(caja, '.apl', orden => { prefs.apps = orden.filter(Boolean); guardarPrefs(); });
      const w = $('wLinks'); if (w && LK_BOX) { w.appendChild(LK_BOX); form.hidden = true; }
    },
  };
})();
</script>
</body>
