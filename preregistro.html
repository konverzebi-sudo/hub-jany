<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienvenido — ADN de tu negocio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --text:#1A1A1A; --dim:#6B6B6B; --pill:#F0F0F0; --line:#E4E4E4;
    --lime:#BDF71E; --lime-deep:#A6E000; --robot:#C6F40E; --ok:#1F9D55;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font-family:'Libre Franklin',system-ui,sans-serif;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  #app{max-width:640px;margin:0 auto;padding:28px 20px 56px}
  .view{animation:in .22s ease both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ── Inicio ─────────────────────────── */
  .robot{display:block;width:150px;height:auto;margin:6px auto 20px}
  .welcome{margin:0 auto;max-width:470px;text-align:center;font-size:17px;line-height:1.5;color:#3a3a3a}
  .welcome strong{font-weight:700;color:#111}
  .hint{margin:8px auto 0;text-align:center;font-size:14px;color:var(--dim)}
  .map{margin:26px auto 0;max-width:520px;display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);align-items:center}
  .map .l,.map .c,.map .r{padding:15px 0}
  .map .c{position:relative;display:flex;justify-content:center;align-self:stretch;align-items:center}
  .map .c::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dotted #555;transform:translateX(-50%)}
  .map .first .c::before{top:50%}
  .map .last .c::before{bottom:50%}
  .map .r{padding-left:6px}
  .row{display:contents;cursor:pointer}
  .row:focus-visible .pill{outline:2px solid #111;outline-offset:2px}
  .adn{position:relative;z-index:1;background:var(--lime);padding:6px 14px;border-radius:10px;font-size:20px;font-weight:500}
  .dot{position:relative;z-index:1;width:52px;height:52px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;box-shadow:0 0 0 6px #fff}
  .row.next .dot{box-shadow:0 0 0 6px #fff,0 0 0 9px #111}
  .row.done .dot{background:#111;color:var(--lime)}
  .pill{display:inline-block;background:var(--pill);padding:12px 20px;border-radius:12px;font-size:19px;font-weight:400;line-height:1.25;text-align:left;transition:background .15s}
  .pill small{display:block;margin-top:2px;font-size:12.5px;color:var(--dim)}
  .row:hover .pill{background:#E6E6E6}
  .row.done .pill{background:#E9F9C4}
  @media (max-width:520px){
    .map{grid-template-columns:minmax(0,.55fr) 56px minmax(0,1.45fr)}
    .pill{font-size:17px;padding:11px 14px}
  }

  .cta{display:block;width:100%;max-width:440px;margin:26px auto 0;padding:17px 20px;border-radius:14px;background:var(--lime);color:#111;font-size:17px;font-weight:700;text-align:center;transition:background .15s,transform .05s}
  .cta:hover{background:var(--lime-deep)}
  .cta:active{transform:scale(.99)}

  /* ── Preguntas ───────────────────────── */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .back{flex:none;width:40px;height:40px;border-radius:50%;background:var(--pill);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
  .back:hover{background:#E6E6E6}
  .prog{flex:1;min-width:0}
  .prog small{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--dim);margin-bottom:6px}
  .bar{height:6px;border-radius:99px;background:var(--pill);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--lime-deep);border-radius:99px;transition:width .25s ease}
  .q-sec{display:inline-block;background:var(--lime);padding:4px 10px;border-radius:8px;font-size:13px;font-weight:700;margin-bottom:16px}
  .q-title{font-size:25px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
  .q-help{margin-top:8px;font-size:15px;line-height:1.5;color:var(--dim)}
  .q-body{margin-top:22px}
  input[type=text],input[type=tel],input[type=number],textarea{width:100%;font:inherit;font-size:19px;color:var(--text);background:#fff;border:2px solid var(--line);border-radius:14px;padding:15px 16px;outline:none;transition:border-color .15s}
  textarea{min-height:140px;resize:vertical;line-height:1.5;font-size:17px}
  input:focus,textarea:focus{border-color:#111}
  ::placeholder{color:#A8A8A8}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{padding:12px 16px;border-radius:12px;background:var(--pill);font-size:16px;font-weight:500;text-align:left;border:2px solid transparent;transition:background .12s}
  .chip:hover{background:#E6E6E6}
  .chip.on{background:var(--lime);border-color:#111;font-weight:700}
  .chip small{display:block;font-size:12.5px;font-weight:400;color:#444;margin-top:2px}
  .chips.stack{display:grid;grid-template-columns:1fr}
  .actions{margin-top:28px;display:grid;gap:12px}
  .skip{justify-self:center;padding:10px 14px;font-size:15px;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
  .skip:hover{color:#111}
  .save{margin-top:18px;text-align:center;font-size:12.5px;color:var(--dim);min-height:18px}
  .save.ok{color:var(--ok)}

  .logo-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:190px;border:2px dashed #C9C9C9;border-radius:16px;background:#FAFAFA;padding:18px;text-align:center;cursor:pointer;font-size:16px;color:var(--dim)}
  .logo-drop:hover{border-color:#111}
  .logo-drop img{max-width:200px;max-height:130px;object-fit:contain}
  .swatches{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
  .sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--dim);position:relative}
  .sw input{width:64px;height:64px;padding:0;border:2px solid var(--line);border-radius:50%;background:none;cursor:pointer;-webkit-appearance:none;appearance:none;overflow:hidden}
  .sw input::-webkit-color-swatch-wrapper{padding:0}
  .sw input::-webkit-color-swatch{border:0;border-radius:50%}
  .sw input::-moz-color-swatch{border:0;border-radius:50%}
  .sw button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#111;color:#fff;font-size:12px;line-height:22px}
  .sw-add{width:64px;height:64px;border-radius:50%;border:2px dashed #C9C9C9;font-size:26px;color:var(--dim)}
  .sw-add:hover{border-color:#111;color:#111}

  /* ── Final ───────────────────────────── */
  .done h1{margin-top:6px}
  .link{display:block;margin:16px auto 0;font-size:15px;color:var(--dim);text-decoration:underline;text-underline-offset:3px;text-align:center}
  .note{margin:22px auto 0;max-width:440px;padding:12px 14px;border-radius:12px;background:#FFF6DB;font-size:13.5px;line-height:1.45;color:#6B5200}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<script>
(function(){
'use strict';

// ── Marca (igual que ADN.html: se detecta desde la URL) ──────────────
function detectClienteId(){
  var p = location.pathname;
  if(/\/rancho-seco(\/|$)/.test(p)) return 'rancho-seco';
  if(/\/rim(\/|$)/.test(p)) return 'rim';
  if(/\/optica-one(\/|$)/.test(p)) return 'optica-one';
  return 'jefeshub';
}
var CLIENTE_ID = detectClienteId();
var PREFIX = CLIENTE_ID === 'jefeshub' ? '' : '/' + CLIENTE_ID;
function storageKey(s){ return CLIENTE_ID + ':brand-book.' + s; }
var DRAFT_KEY = 'prereg:' + CLIENTE_ID;

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Opciones (mismas que ADN.html para que todo cuadre) ──────────────
var GIROS = ['Restaurante / Alimentos y Bebidas','Moda / Ropa y Accesorios','Belleza / Estética y Cuidado personal','Salud / Bienestar y Fitness','Servicios Profesionales','Educación / Cursos y Capacitación','E-commerce / Tienda en línea','Tecnología / Software','Construcción / Inmobiliaria','Arte / Diseño y Creatividad','Entretenimiento / Eventos','Turismo / Viajes y Hospitalidad','Retail / Tienda física','Consultoría / Coaching','Legal / Financiero','Salud Médica / Dental','Otro'];
var OBJETIVOS = [
  ['📣 Más posicionamiento','Que más gente te conozca','Más posicionamiento'],
  ['🎯 Más prospectos','Que te contacten personas interesadas','Más prospectos'],
  ['🛒 Ventas en línea','Más conversiones en tu tienda o web','Ventas en línea'],
  ['🎪 Evento / lanzamiento','Llenar o promocionar un evento','Evento / lanzamiento'],
  ['📋 Atraer talento','Publicar vacantes y reclutar','Atraer talento'],
  ['✏️ Meta específica','Tengo un objetivo diferente','Meta específica']
];
var TONOS = ['Divertido','Profesional','Inspirador','Directo','Cercano','Aspiracional','Educativo','Urgente'];
var FRECUENCIAS = ['Diario','3-4 veces por semana','1-2 veces por semana','Esporádico','No estoy publicando'];
var TIPOS = ['Fotos','Videos cortos','Reels','Stories','Lives','Carruseles','Blog','Newsletter','Podcasts'];
var CANALES = {
  website:   function(h){ return /^http/.test(h) ? h : 'https://' + h; },
  instagram: function(h){ return 'https://instagram.com/' + h.replace(/^@/,''); },
  facebook:  function(h){ return 'https://facebook.com/' + h; },
  tiktok:    function(h){ return 'https://tiktok.com/@' + h.replace(/^@/,''); }
};

function csv(s){ return String(s).split(',').map(function(x){ return x.trim(); }).filter(Boolean); }
function handleQ(key, titulo, ph){
  return { id:key, tipo:'text', titulo:titulo, ph:ph,
    get:function(o){ return (o[key] && o[key].handle) || ''; },
    set:function(o,v){ v = v.trim(); o[key] = { handle:v, link: v ? CANALES[key](v) : '' }; } };
}
function simple(key, tipo, titulo, extra){
  var q = { id:key, tipo:tipo, titulo:titulo,
    get:function(o){ return o[key] == null ? '' : o[key]; },
    set:function(o,v){ o[key] = typeof v === 'string' ? v.trim() : v; } };
  for(var k in extra) q[k] = extra[k];
  return q;
}

// ── Las 4 secciones del pre-registro ─────────────────────────────────
var SECCIONES = [
  { id:'identidad', nombre:'Identidad', preguntas:[
    simple('nombre','text','¿Cómo se llama tu negocio?',{ph:'Ej. Casa Aurora'}),
    simple('giro_categoria','uno','¿A qué se dedica?',{ayuda:'Elige la opción que más se parezca.',opts:GIROS,
      set:function(o,v){ o.giro_categoria = v; if(v !== 'Otro') o.giro_texto = ''; }}),
    simple('giro_texto','text','Cuéntanos a qué te dedicas',{ph:'Ej. Veterinaria especializada en perros de raza',
      cond:function(o){ return o.giro_categoria === 'Otro'; }}),
    simple('producto_estrella','text','¿Cuál es tu producto o servicio estrella?',{ayuda:'Lo que más vendes o lo que mejor te representa.'}),
    simple('telefono','tel','¿A qué número te contactan tus clientes?',{ayuda:'WhatsApp o teléfono del negocio.',ph:'33 1234 5678'}),
    simple('objetivos','multi','¿Qué quieres lograr con tu marketing?',{ayuda:'Puedes elegir varias.',opts:OBJETIVOS,
      get:function(o){ return o.objetivos || []; }}),
    simple('obj_otro_texto','text','¿Cuál es tu meta específica?',{ph:'Ej. Llenar la agenda de citas de agosto',
      cond:function(o){ return (o.objetivos || []).indexOf('Meta específica') >= 0; }}),
    simple('historia','area','¿Cuál es la historia de tu negocio?',{ayuda:'En pocas palabras: cómo empezó y dónde está hoy.',ph:'Empezamos en 2018 con una pequeña tienda…'}),
    simple('anio_inicio','number','¿En qué año empezaste?',{ph:'2018'}),
    simple('meta_ventas_mensual','number','¿Cuánto quieres vender al mes?',{ayuda:'Tu meta mensual de ventas, en pesos.',ph:'50000'}),
    simple('objetivo_principal','area','¿Cuál es el gran objetivo de tu negocio?',{ph:'Ser la marca líder de mi categoría en mi ciudad…'}),
    simple('mejora_deseada','area','¿Qué te gustaría mejorar?',{ph:'Responder más rápido, vender más en línea, dar mejor seguimiento…'})
  ]},
  { id:'visual', nombre:'Logo y Colores', preguntas:[
    simple('logo','logo','Sube tu logo',{ayuda:'Si no lo tienes a la mano, salta esta pregunta y súbelo después.',
      get:function(o){ return o.logo || ''; }}),
    simple('paleta','colores','¿Cuáles son los colores de tu marca?',{ayuda:'Elige hasta 5. Toca un círculo para cambiarlo.',
      get:function(o){ return o.paleta || []; }})
  ]},
  { id:'tono', nombre:'Voz y Tono', preguntas:[
    simple('tonos','multi','¿Cómo suena tu marca?',{ayuda:'Elige los que más te representen.',opts:TONOS.map(function(t){ return [t,'',t]; }),
      get:function(o){ return o.tonos || []; }}),
    simple('palabras_si','text','¿Qué palabras SÍ usa tu marca?',{ayuda:'Sepáralas con coma.',ph:'chambear, jefa, tribu',
      get:function(o){ return (o.palabras_si || []).join(', '); }, set:function(o,v){ o.palabras_si = csv(v); }}),
    simple('palabras_no','text','¿Qué palabras NUNCA diría?',{ayuda:'Sepáralas con coma.',ph:'sinergia, disruptivo',
      get:function(o){ return (o.palabras_no || []).join(', '); }, set:function(o,v){ o.palabras_no = csv(v); }}),
    simple('persona','area','¿A quién le habla tu marca?',{ayuda:'Descríbelo como si se lo presentaras a alguien.',ph:'Mujeres de 25-40 años que quieren verse bien sin gastar de más…'})
  ]},
  { id:'redes', nombre:'Redes y Contenido', preguntas:[
    handleQ('instagram','¿Cuál es tu Instagram?','@tunegocio'),
    handleQ('facebook','¿Y tu página de Facebook?','Nombre de la página'),
    handleQ('tiktok','¿Tienes TikTok?','@tunegocio'),
    handleQ('website','¿Tienes sitio web?','tunegocio.com'),
    simple('_frecuencia','uno','¿Cada cuánto publicas?',{opts:FRECUENCIAS}),
    simple('_tipos_contenido','multi','¿Qué tipo de contenido usas?',{ayuda:'Elige todos los que apliquen.',opts:TIPOS.map(function(t){ return [t,'',t]; }),
      get:function(o){ return o._tipos_contenido || []; }}),
    simple('_temas','area','¿De qué temas ya hablas en tus redes?',{ph:'Tips, reseñas de productos, detrás de cámaras…'})
  ]}
];

// ── Estado ───────────────────────────────────────────────────────────
var datos = {};        // un objeto por sección, con el mismo formato que usa ADN.html
var saltadas = {};     // { seccion: { preguntaId: true } }
var pendiente = false; // hay cambios que no pudieron subirse al servidor
var estadoGuardado = '';

function leerDraft(){ try{ return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null') || {}; }catch(e){ return {}; } }
function escribirDraft(){
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({ datos:datos, saltadas:saltadas, pendiente:pendiente })); }catch(e){}
}
function parseValor(v){ if(typeof v === 'string'){ try{ return JSON.parse(v) || {}; }catch(e){ return {}; } } return v || {}; }

async function cargar(){
  var draft = leerDraft();
  var remotos = await Promise.all(SECCIONES.map(async function(s){
    try{
      var res = await fetch('/api/storage/' + encodeURIComponent(storageKey(s.id)), { cache:'no-store' });
      if(!res.ok) return {};
      var j = await res.json();
      return parseValor(j.value);
    }catch(e){ return {}; }
  }));
  SECCIONES.forEach(function(s,i){
    datos[s.id] = Object.assign({}, remotos[i], (draft.datos && draft.datos[s.id]) || {});
  });
  saltadas = draft.saltadas || {};
  pendiente = !!draft.pendiente;
}

async function subir(secId, keepalive){
  var token = '';
  try{ token = (localStorage.getItem('jefeshub_storage_token') || '').trim(); }catch(e){}
  if(!token) return false; // sin token no se pide nada al cliente: queda en este dispositivo
  try{
    var res = await fetch('/api/storage/' + encodeURIComponent(storageKey(secId)), {
      method:'POST', cache:'no-store', keepalive:!!keepalive,
      headers:{ 'Content-Type':'application/json', 'X-Storage-Token':token },
      body: JSON.stringify({ value: JSON.stringify(datos[secId]) })
    });
    if(res.status === 401){ try{ localStorage.removeItem('jefeshub_storage_token'); }catch(e){} }
    return res.ok;
  }catch(e){ return false; }
}

async function guardar(secId){
  escribirDraft();
  var ok = await subir(secId);
  pendiente = !ok;
  escribirDraft();
  estadoGuardado = ok ? 'ok' : 'local';
  var el = document.getElementById('save');
  if(el) pintarEstado(el);
}
function pintarEstado(el){
  if(estadoGuardado === 'ok'){ el.textContent = '✓ Guardado'; el.className = 'save ok'; }
  else if(estadoGuardado === 'local'){ el.textContent = 'Guardado en este dispositivo'; el.className = 'save'; }
  else { el.textContent = ''; el.className = 'save'; }
}
function vaciar(){
  if(!pendiente) return;
  SECCIONES.forEach(function(s){ subir(s.id, true); });
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') vaciar(); });

// ── Utilidades de progreso ───────────────────────────────────────────
function activas(sec){ return sec.preguntas.filter(function(q){ return !q.cond || q.cond(datos[sec.id]); }); }
function respondida(sec, q){
  var v = q.get(datos[sec.id]);
  return Array.isArray(v) ? v.length > 0 : String(v).trim() !== '';
}
function resuelta(sec, q){ return respondida(sec, q) || !!(saltadas[sec.id] && saltadas[sec.id][q.id]); }
function primeraPendiente(sec){
  var qs = activas(sec);
  for(var i = 0; i < qs.length; i++) if(!resuelta(sec, qs[i])) return i;
  return -1;
}
function seccionCompleta(sec){ return primeraPendiente(sec) === -1; }
function siguienteSeccionPendiente(desde){
  for(var i = 0; i < SECCIONES.length; i++){
    var s = (desde + i) % SECCIONES.length;
    if(!seccionCompleta(SECCIONES[s])) return s;
  }
  return -1;
}
function hayProgreso(){
  return SECCIONES.some(function(s){ return activas(s).some(function(q){ return resuelta(s, q); }); });
}

// ── Vistas ───────────────────────────────────────────────────────────
var app = document.getElementById('app');
var ROBOT = '<svg class="robot" viewBox="0 0 300 280" role="img" aria-label="Jany" xmlns="http://www.w3.org/2000/svg">' +
  '<circle cx="150" cy="16" r="14" fill="#C6F40E"/><path d="M143 28h14l4 22h-22z" fill="#C6F40E"/>' +
  '<rect x="104" y="44" width="92" height="24" rx="12" fill="#C6F40E"/>' +
  '<rect x="6" y="104" width="38" height="80" rx="18" fill="#C6F40E"/><rect x="256" y="104" width="38" height="80" rx="18" fill="#C6F40E"/>' +
  '<rect x="30" y="58" width="240" height="208" rx="104" fill="#C6F40E"/>' +
  '<rect x="64" y="92" width="172" height="130" rx="62" fill="#fff"/>' +
  '<ellipse cx="112" cy="150" rx="13" ry="19" fill="#C6F40E"/><ellipse cx="188" cy="150" rx="13" ry="19" fill="#C6F40E"/></svg>';

function vistaInicio(){
  var proxima = siguienteSeccionPendiente(0);
  var filas = SECCIONES.map(function(s,i){
    var qs = activas(s), hechas = qs.filter(function(q){ return resuelta(s,q); }).length;
    var completa = seccionCompleta(s);
    var detalle = completa ? '' : (hechas ? '<small>' + hechas + ' de ' + qs.length + '</small>' : '');
    return '<div class="row' + (completa ? ' done' : '') + (i === proxima ? ' next' : '') + '" role="button" tabindex="0" data-sec="' + i + '">' +
      '<div class="l"></div><div class="c"><span class="dot">' + (completa ? '✓' : (i + 1)) + '</span></div>' +
      '<div class="r"><span class="pill">' + esc(s.nombre) + detalle + '</span></div></div>';
  }).join('');
  app.innerHTML = '<div class="view">' + ROBOT +
    '<p class="welcome"><strong>¡Te damos la bienvenida!</strong> Llena el ADN de tu negocio: así ayudas a <strong>Jany</strong>, la inteligencia artificial que usaremos para tu negocio, a entender tu negocio.</p>' +
    '<p class="hint">' + (hayProgreso() ? 'Toca el paso marcado para continuar donde te quedaste.' : 'Una pregunta a la vez. Toca el paso 1 para empezar; puedes saltar y volver cuando quieras.') + '</p>' +
    '<div class="map">' +
      '<div class="row first" style="cursor:default"><div class="l"></div><div class="c"><span class="adn">ADN</span></div><div class="r"></div></div>' +
      filas +
      '<div class="row last' + (proxima === -1 ? ' next' : '') + '" role="button" tabindex="0" data-fin="1"><div class="l"></div><div class="c"><span class="dot">🚀</span></div><div class="r"><span class="pill">Entrar a mi Hub</span></div></div>' +
    '</div></div>';
  app.querySelectorAll('.row[data-sec]').forEach(function(r){
    var abrir = function(){ abrirSeccion(parseInt(r.dataset.sec, 10)); };
    r.onclick = abrir;
    r.onkeydown = function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); abrir(); } };
  });
  var fin = app.querySelector('.row[data-fin]');
  fin.onclick = vistaFinal;
  fin.onkeydown = function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); vistaFinal(); } };
  window.scrollTo(0, 0);
}

function abrirSeccion(idx){
  var i = primeraPendiente(SECCIONES[idx]);
  vistaPregunta(idx, i === -1 ? 0 : i);
}

function vistaPregunta(si, qi){
  var sec = SECCIONES[si], qs = activas(sec);
  if(qi >= qs.length){
    var sig = siguienteSeccionPendiente(si + 1);
    if(sig === -1 || sig === si) return vistaFinal();
    return abrirSeccion(sig);
  }
  if(qi < 0) return vistaInicio();
  var q = qs[qi], o = datos[sec.id];
  var valor = q.get(o);
  var pct = Math.round((qi / qs.length) * 100);
  var cuerpo = '';

  if(q.tipo === 'text' || q.tipo === 'tel' || q.tipo === 'number'){
    cuerpo = '<input id="inp" type="' + q.tipo + '"' + (q.tipo === 'number' ? ' inputmode="numeric"' : '') +
      ' placeholder="' + esc(q.ph || '') + '" value="' + esc(valor) + '" autocomplete="off">';
  } else if(q.tipo === 'area'){
    cuerpo = '<textarea id="inp" placeholder="' + esc(q.ph || '') + '">' + esc(valor) + '</textarea>';
  } else if(q.tipo === 'uno' || q.tipo === 'multi'){
    var sel = Array.isArray(valor) ? valor : [valor];
    cuerpo = '<div class="chips' + (q.opts.length > 9 || q.tipo === 'uno' && q.opts.length > 5 ? ' stack' : '') + '" id="chips">' +
      q.opts.map(function(op){
        var val = Array.isArray(op) ? op[2] : op, etiqueta = Array.isArray(op) ? op[0] : op, desc = Array.isArray(op) ? op[1] : '';
        return '<button type="button" class="chip' + (sel.indexOf(val) >= 0 ? ' on' : '') + '" data-v="' + esc(val) + '">' + esc(etiqueta) +
          (desc ? '<small>' + esc(desc) + '</small>' : '') + '</button>';
      }).join('') + '</div>';
  } else if(q.tipo === 'logo'){
    cuerpo = '<label class="logo-drop" id="drop">' +
      (valor ? '<img src="' + esc(valor) + '" alt="Tu logo"><span>Toca para cambiarlo</span>' : '<span style="font-size:34px">🖼️</span><span>Toca para subir tu logo</span>') +
      '<input type="file" id="file" accept="image/*" hidden></label>';
  } else if(q.tipo === 'colores'){
    cuerpo = '<div class="swatches" id="sws"></div>';
  }

  app.innerHTML = '<div class="view">' +
    '<div class="top"><button class="back" id="back" aria-label="Volver">←</button>' +
    '<div class="prog"><small><span>' + esc(sec.nombre) + '</span><span>' + (qi + 1) + ' de ' + qs.length + '</span></small>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div></div></div>' +
    '<h2 class="q-title">' + esc(q.titulo) + '</h2>' +
    (q.ayuda ? '<p class="q-help">' + esc(q.ayuda) + '</p>' : '') +
    '<div class="q-body">' + cuerpo + '</div>' +
    '<div class="actions"><button class="cta" id="next" style="margin:0">Siguiente</button>' +
    '<button class="skip" id="skip">Saltar por ahora</button></div>' +
    '<div class="save" id="save"></div></div>';
  pintarEstado(document.getElementById('save'));
  window.scrollTo(0, 0);

  var leer = function(){
    var inp = document.getElementById('inp');
    return inp ? inp.value : null;
  };
  var avanzar = async function(saltar){
    var v = leer();
    if(v !== null) q.set(o, v);
    if(saltar){
      (saltadas[sec.id] = saltadas[sec.id] || {})[q.id] = true;
    } else if(saltadas[sec.id]) delete saltadas[sec.id][q.id];
    await guardar(sec.id);
    // recalcula por si la pregunta cambió qué preguntas condicionales aplican
    var nuevas = activas(sec), idx = nuevas.indexOf(q);
    vistaPregunta(si, (idx < 0 ? qi : idx) + 1);
  };
  document.getElementById('next').onclick = function(){ avanzar(!respondidaAhora()); };
  document.getElementById('skip').onclick = function(){ avanzar(true); };
  document.getElementById('back').onclick = function(){
    var v = leer(); if(v !== null && v.trim() !== '') { q.set(o, v); escribirDraft(); }
    qi > 0 ? vistaPregunta(si, qi - 1) : vistaInicio();
  };
  function respondidaAhora(){
    var v = leer();
    if(v !== null) return v.trim() !== '';
    var cur = q.get(o);
    return Array.isArray(cur) ? cur.length > 0 : String(cur).trim() !== '';
  }

  var inp = document.getElementById('inp');
  if(inp){
    if(q.tipo !== 'area') inp.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('next').click(); } });
    if(window.matchMedia('(hover:hover)').matches) inp.focus();
  }

  var chips = document.getElementById('chips');
  if(chips){
    chips.querySelectorAll('.chip').forEach(function(b){
      b.onclick = function(){
        var val = b.dataset.v;
        if(q.tipo === 'uno'){
          q.set(o, val);
          escribirDraft();
          document.getElementById('next').click();
          return;
        }
        var arr = (q.get(o) || []).slice(), k = arr.indexOf(val);
        k >= 0 ? arr.splice(k, 1) : arr.push(val);
        q.set(o, arr);
        b.classList.toggle('on', k < 0);
      };
    });
  }

  var file = document.getElementById('file');
  if(file){
    file.onchange = function(){
      var f = file.files && file.files[0]; if(!f) return;
      var img = new Image(), url = URL.createObjectURL(f);
      img.onload = function(){
        var max = 400, k = Math.min(1, max / Math.max(img.width, img.height));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        q.set(o, cv.toDataURL('image/png'));
        vistaPregunta(si, qi);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); };
      img.src = url;
    };
  }

  var sws = document.getElementById('sws');
  if(sws){
    var pintarSw = function(){
      var paleta = q.get(o) || [];
      sws.innerHTML = paleta.map(function(c,i){
        return '<div class="sw"><input type="color" value="' + esc(c) + '" data-i="' + i + '" aria-label="Color ' + (i + 1) + '">' +
          '<button type="button" data-x="' + i + '" aria-label="Quitar color">✕</button><span>' + esc(c.toUpperCase()) + '</span></div>';
      }).join('') + (paleta.length < 5 ? '<button type="button" class="sw-add" id="sw-add" aria-label="Agregar color">+</button>' : '');
      sws.querySelectorAll('input[type=color]').forEach(function(inp2){
        inp2.onchange = function(){ var p = (q.get(o) || []).slice(); p[+inp2.dataset.i] = inp2.value.toUpperCase(); q.set(o, p); pintarSw(); };
      });
      sws.querySelectorAll('button[data-x]').forEach(function(b){
        b.onclick = function(){ var p = (q.get(o) || []).slice(); p.splice(+b.dataset.x, 1); q.set(o, p); pintarSw(); };
      });
      var add = document.getElementById('sw-add');
      if(add) add.onclick = function(){ var p = (q.get(o) || []).slice(); p.push('#CCCCCC'); q.set(o, p); pintarSw(); };
    };
    pintarSw();
  }
}

function vistaFinal(){
  var completas = SECCIONES.filter(seccionCompleta).length;
  app.innerHTML = '<div class="view done">' + ROBOT +
    '<h1>' + (completas === SECCIONES.length ? '¡Listo! Jany ya conoce tu negocio' : 'Ya puedes entrar a tu Hub') + '</h1>' +
    '<p class="lead">' + (completas === SECCIONES.length
      ? 'Siguiente paso: en <strong>Jefe 366</strong> vas a vaciar toda la información de tu negocio, ya con tu ADN cargado.'
      : 'Te faltan algunas respuestas, pero puedes completarlas cuando quieras desde el ADN de tu negocio.') + '</p>' +
    '<a class="cta" style="text-decoration:none" href="' + PREFIX + '/jefe-366">Empezar con Jefe 366</a>' +
    '<a class="link" href="' + (PREFIX || '/') + '">Ir a mi Hub de Jefes</a>' +
    '<button class="link" id="edit" style="width:100%">Revisar mis respuestas</button>' +
    (pendiente ? '<p class="note">Tus respuestas están guardadas en este dispositivo. Avísanos para terminar de enviarlas a tu Hub.</p>' : '') +
    '</div>';
  document.getElementById('edit').onclick = vistaInicio;
  window.scrollTo(0, 0);
}

cargar().then(vistaInicio);
})();
</script>
