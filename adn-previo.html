<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tu ADN del negocio — JefesHub</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0F0B16; --surface:#181120; --surface-2:#211829; --line:#332A3D; --text:#F3EEF9; --text-dim:#B6A9C7; --accent:#B8F725; --accent-soft:#2E3610; --err:#F87171; }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#241733 0%,var(--bg) 55%);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  h1,h2,h3{font-family:'Sora',sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 90px;}
  .brand{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);margin-bottom:18px;}
  .progreso{display:flex;gap:6px;margin:0 0 22px;}
  .progreso span{flex:1;height:5px;border-radius:5px;background:var(--line);}
  .progreso span.hecho{background:var(--accent);}
  .progreso span.actual{background:var(--accent);opacity:.55;}
  h1{font-size:clamp(24px,4vw,32px);font-weight:800;line-height:1.15;margin:0 0 10px;}
  .desc{color:var(--text-dim);font-size:14.5px;line-height:1.6;margin:0 0 22px;}
  .desc strong{color:var(--text);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;}
  .field label small{font-weight:400;color:var(--text-dim);}
  .field .hint{font-size:12px;color:var(--text-dim);margin-top:5px;line-height:1.45;}
  input[type=text],input[type=tel],input[type=number],textarea,select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 12px;font-family:'Inter',sans-serif;font-size:16px;outline:none;}
  textarea{min-height:84px;resize:vertical;}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.row2{grid-template-columns:1fr;}}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-size:13px;padding:8px 14px;border-radius:100px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-dim);cursor:pointer;font-family:'Inter',sans-serif;}
  .chip.sel{background:var(--accent);border-color:var(--accent);color:#0F0B16;font-weight:600;}
  .prod{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--surface-2);}
  .prod .row2{margin-bottom:10px;}
  .prod-del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;text-decoration:underline;padding:0;margin-top:8px;}
  .nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;}
  .btn{background:var(--accent);border:none;color:#0F0B16;font-weight:700;font-size:15px;padding:13px 22px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn:disabled{opacity:.5;cursor:wait;}
  .btn.sec{background:transparent;border:1px solid var(--line);color:var(--text-dim);font-weight:600;}
  .btn.add{background:transparent;border:1px dashed var(--line);color:var(--accent);width:100%;}
  .msg{font-size:13px;margin-top:12px;min-height:18px;}
  .msg.err{color:var(--err);}
  .msg.ok{color:var(--accent);}
  .listo{text-align:center;padding:30px 10px;}
  .listo .check{font-size:46px;margin-bottom:10px;}
  .lista-ok{list-style:none;padding:0;margin:16px auto;max-width:360px;text-align:left;color:var(--text-dim);font-size:14px;line-height:1.9;}
  .lista-ok li::before{content:'✓ ';color:var(--accent);font-weight:700;}
  .borrador{font-size:12px;color:var(--text-dim);margin-top:14px;text-align:center;}
  .bienvenida{text-align:center;}
  .bienvenida .robot{width:104px;height:auto;display:block;margin:6px auto 14px;}
  .bienvenida h1{max-width:620px;margin-left:auto;margin-right:auto;}
  .bienvenida .desc{max-width:600px;margin-left:auto;margin-right:auto;}
  .timeline{position:relative;display:grid;gap:30px;width:fit-content;max-width:100%;margin:6px auto 22px;text-align:left;}
  .timeline::before{content:'';position:absolute;left:19px;top:34px;bottom:20px;border-left:3px dotted var(--text-dim);opacity:.55;}
  .tl-root{position:relative;display:flex;justify-content:center;width:38px;z-index:1;}
  .tl-root span{background:var(--accent);color:#0F0B16;font-family:'Sora',sans-serif;font-weight:800;font-size:16px;padding:7px 14px;border-radius:10px;white-space:nowrap;}
  .tl-item{position:relative;display:flex;align-items:center;gap:16px;z-index:1;}
  .tl-num{flex:0 0 38px;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#0F0B16;font-family:'Sora',sans-serif;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px var(--bg);}
  .tl-label{background:var(--surface-2);border-radius:10px;padding:9px 20px;font-size:clamp(14px,3.6vw,17px);color:var(--text);}
  .tl-note{color:var(--text-dim);font-size:13px;line-height:1.7;max-width:520px;margin:0 auto 22px;}
  .tl-note strong{color:var(--text);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const params = new URLSearchParams(location.search);
const CLIENTE = (params.get('c') || '').toLowerCase().trim();
const CODIGO = (params.get('k') || '').trim();
const DRAFT_KEY = 'jefeshub_adnprevio_' + CLIENTE;

const GIROS = ['Restaurante / Alimentos y Bebidas','Moda / Ropa y Accesorios','Belleza / Estética y Cuidado personal','Salud / Bienestar y Fitness','Servicios Profesionales','Educación / Cursos y Capacitación','E-commerce / Tienda en línea','Tecnología / Software','Construcción / Inmobiliaria','Arte / Diseño y Creatividad','Entretenimiento / Eventos','Turismo / Viajes y Hospitalidad','Retail / Tienda física','Consultoría / Coaching','Legal / Financiero','Otro'];
const OBJETIVOS = ['Más posicionamiento','Más prospectos','Ventas en línea','Evento / lanzamiento','Atraer talento','Meta específica'];
const TONOS = ['Divertido','Profesional','Inspirador','Directo','Cercano','Aspiracional','Educativo','Urgente'];
const TIPOS_CONTENIDO = ['Fotos','Videos cortos','Reels','Stories','Lives','Carruseles','Blog','Newsletter','Podcasts'];
const FRECUENCIAS = ['Diario','3-4 veces por semana','1-2 veces por semana','Esporádico','No estoy publicando'];

// Cada paso: sec = sección del ADN donde cae; los campos se guardan en datos[sec][id].
const PASOS = [
  { sec:'identidad', titulo:'Tu negocio', desc:'Lo básico para que tus Jefes sepan **quién eres**. No tiene que ser perfecto: escribe como si se lo contaras a alguien en persona.', campos:[
    { id:'nombre', label:'Nombre del negocio', tipo:'text', req:true },
    { id:'giro_categoria', label:'¿A qué se dedica?', tipo:'select', opciones:GIROS },
    { id:'giro_texto', label:'Cuéntanos a qué te dedicas', tipo:'text', ph:'Ej. Academia de fútbol infantil', soloSi:{ id:'giro_categoria', valor:'Otro' } },
    { id:'telefono', label:'WhatsApp del negocio', tipo:'tel', ph:'Con lada, ej. 5218441234567', hint:'Es el número al que te escriben tus clientes.' },
    { id:'anio_inicio', label:'¿En qué año empezó?', tipo:'text', ph:'Ej. 2019' },
    { id:'producto_estrella', label:'Tu producto o servicio estrella', tipo:'text', ph:'Lo que más te piden o más te gustaría vender', hint:'' },
    { id:'historia', label:'Tu historia', tipo:'textarea', ph:'¿Cómo y por qué empezó el negocio? ¿Qué lo hace especial?' },
    { id:'objetivos', label:'¿Qué quieres lograr con tu marketing?', tipo:'chips', opciones:OBJETIVOS, hint:'Puedes elegir varios.' },
    { id:'objetivo_principal', label:'Tu objetivo principal en los próximos meses', tipo:'textarea', ph:'Ej. Llenar 20 lugares de mi torneo / duplicar mis ventas por WhatsApp' },
    { id:'mejora_deseada', label:'Si pudieras mejorar UNA cosa de tu negocio, ¿cuál sería?', tipo:'textarea' },
  ]},
  { sec:'audiencias', titulo:'Tu cliente ideal', desc:'Piensa en la persona que **más te compra** (o la que quisieras que te comprara). Mientras más real sea la descripción, mejor te escribirán los Jefes.', campos:[
    { id:'descripcion_breve', label:'¿Quién es esa persona?', tipo:'textarea', ph:'Ej. Papás de niños de 6 a 12 años que quieren que sus hijos hagan deporte...' },
    { id:'edad', label:'Edad aproximada', tipo:'text', ph:'Ej. 30 a 45 años', mitad:true },
    { id:'ubicacion', label:'¿Dónde vive o se mueve?', tipo:'text', ph:'Ej. Saltillo, zona sur', mitad:true },
    { id:'ocupacion', label:'¿A qué se dedica?', tipo:'text', ph:'Ej. Empleado, dueño de negocio, estudiante...' },
    { id:'problema_resuelve', label:'¿Qué problema o necesidad le resuelves?', tipo:'textarea' },
    { id:'que_convenceria', label:'¿Qué lo convence de comprarte?', tipo:'textarea', ph:'Precio, confianza, resultados, cercanía, garantía...' },
    { id:'objecion_comun', label:'¿Qué duda u objeción te pone casi siempre?', tipo:'textarea', ph:'Ej. "Está caro", "Lo voy a pensar", "¿y si no funciona?"' },
    { id:'frases', label:'Frases reales que te dicen tus clientes', tipo:'textarea', ph:'Tal cual las dicen, aunque sean informales. Una por renglón.', hint:'Copiarlas de WhatsApp o comentarios es lo mejor que puedes hacer.' },
  ]},
  { sec:'catalogo', titulo:'Qué vendes', desc:'Agrega tus productos o servicios principales. Con 3 a 5 es suficiente para empezar; después los completas en tu ADN.', tipo:'catalogo' },
  { sec:'tono', titulo:'Cómo hablas', desc:'Aquí le enseñas a la IA **a sonar como tú**. Piensa en cómo le hablas a un cliente por WhatsApp.', campos:[
    { id:'tonos', label:'¿Cómo suena tu marca?', tipo:'chips', opciones:TONOS, hint:'Elige los que más te representen.' },
    { id:'palabras_si', label:'Palabras o frases que SÍ usas', tipo:'tags', ph:'Separadas por coma. Ej. crack, ¡vamos!, familia' },
    { id:'palabras_no', label:'Palabras que NUNCA usarías', tipo:'tags', ph:'Separadas por coma. Ej. oferta imperdible, estimado cliente' },
    { id:'persona', label:'Si tu marca fuera una persona, ¿cómo sería?', tipo:'textarea', ph:'Ej. Un amigo entusiasta, directo y que siempre te anima...' },
    { id:'ejemplo_si', label:'Un ejemplo de cómo SÍ escribes', tipo:'textarea', ph:'Un mensaje, caption o anuncio que sientas 100% tuyo.' },
    { id:'ejemplo_no', label:'Un ejemplo de cómo NO escribirías', tipo:'textarea', ph:'Algo que se sentiría falso o que no va contigo.' },
  ]},
  { sec:'redes', titulo:'Dónde te encuentran', desc:'Tus redes y tu WhatsApp. Si no tienes alguna, déjala en blanco.', campos:[
    { id:'whatsapp_numero', label:'WhatsApp para recibir clientes', tipo:'tel', ph:'Con lada, ej. 5218441234567', copiaDe:{ sec:'identidad', id:'telefono' } },
    { id:'whatsapp_mensaje', label:'Mensaje que les aparece al escribirte', tipo:'textarea', ph:'Ej. Hola, quiero información sobre sus servicios', hint:'Con esto armamos tu link de WhatsApp.' },
    { id:'instagram', label:'Instagram', tipo:'text', ph:'@usuario', mitad:true },
    { id:'facebook', label:'Facebook', tipo:'text', ph:'usuario o página', mitad:true },
    { id:'tiktok', label:'TikTok', tipo:'text', ph:'@usuario', mitad:true },
    { id:'youtube', label:'YouTube', tipo:'text', ph:'@canal', mitad:true },
    { id:'linkedin', label:'LinkedIn', tipo:'text', ph:'usuario', mitad:true },
    { id:'website', label:'Página web', tipo:'text', ph:'tudominio.com', mitad:true },
    { id:'direccion', label:'Dirección (si tienes local físico)', tipo:'text', ph:'Calle, número, colonia, ciudad' },
    { id:'frecuencia', label:'¿Cada cuánto publicas hoy?', tipo:'select', opciones:FRECUENCIAS },
    { id:'tipos_contenido', label:'Tipos de contenido que usas', tipo:'chips', opciones:TIPOS_CONTENIDO },
    { id:'temas', label:'¿De qué temas hablas en tus redes?', tipo:'textarea' },
  ]},
];

let datos = {};
let paso = -1; // -1 = bienvenida, 0..n-1 = pasos, n = enviado
let enviando = false;

try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); if (d && typeof d === 'object') datos = d; } catch (e) {}
function guardarBorrador() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(datos)); } catch (e) {} }
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function val(sec, id) { return (datos[sec] && datos[sec][id]) != null ? datos[sec][id] : ''; }
function setVal(sec, id, v) { if (!datos[sec]) datos[sec] = {}; datos[sec][id] = v; guardarBorrador(); }

function campoHtml(sec, c) {
  const v = val(sec, c.id);
  const cid = `f-${sec}-${c.id}`;
  let ctrl = '';
  if (c.tipo === 'textarea') ctrl = `<textarea id="${cid}" placeholder="${esc(c.ph || '')}" data-s="${sec}" data-i="${c.id}">${esc(v)}</textarea>`;
  else if (c.tipo === 'select') ctrl = `<select id="${cid}" data-s="${sec}" data-i="${c.id}"><option value="">— Selecciona —</option>${c.opciones.map(o => `<option${v === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else if (c.tipo === 'chips') { const sel = Array.isArray(v) ? v : []; ctrl = `<div class="chips">${c.opciones.map(o => `<button type="button" class="chip${sel.includes(o) ? ' sel' : ''}" data-chip="1" data-s="${sec}" data-i="${c.id}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`; }
  else if (c.tipo === 'tags') ctrl = `<input type="text" id="${cid}" placeholder="${esc(c.ph || '')}" value="${esc(Array.isArray(v) ? v.join(', ') : v)}" data-s="${sec}" data-i="${c.id}" data-tags="1">`;
  else ctrl = `<input type="${c.tipo === 'tel' ? 'tel' : 'text'}" id="${cid}" placeholder="${esc(c.ph || '')}" value="${esc(v)}" data-s="${sec}" data-i="${c.id}">`;
  const oculto = c.soloSi && val(sec, c.soloSi.id) !== c.soloSi.valor;
  return `<div class="field" data-wrap="${sec}-${c.id}" ${oculto ? 'style="display:none"' : ''}><label for="${cid}">${esc(c.label)}${c.req ? ' <small>(obligatorio)</small>' : ''}</label>${ctrl}${c.hint ? `<div class="hint">${esc(c.hint)}</div>` : ''}</div>`;
}

function camposHtml(sec, campos) {
  let html = '', i = 0;
  while (i < campos.length) {
    if (campos[i].mitad && campos[i + 1] && campos[i + 1].mitad) { html += `<div class="row2">${campoHtml(sec, campos[i])}${campoHtml(sec, campos[i + 1])}</div>`; i += 2; }
    else { html += campoHtml(sec, campos[i]); i++; }
  }
  return html;
}

function catalogoHtml() {
  const filas = Array.isArray(datos.catalogo) && datos.catalogo.length ? datos.catalogo : [{}];
  return filas.map((r, i) => `<div class="prod">
    <div class="field"><label>Nombre del producto o servicio</label><input type="text" data-cat="${i}" data-f="nombre" value="${esc(r.nombre || '')}" placeholder="Ej. Paquete de 3 vallas publicitarias"></div>
    <div class="row2">
      <div class="field"><label>Tipo</label><select data-cat="${i}" data-f="tipo">${['Producto','Servicio','Paquete'].map(t => `<option${(r.tipo || 'Producto') === t ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Precio <small>(opcional)</small></label><input type="text" data-cat="${i}" data-f="precio" value="${esc(r.precio || '')}" placeholder="Ej. 1500"></div>
    </div>
    <div class="field"><label>¿Qué tanto se vende?</label><select data-cat="${i}" data-f="que_tanto_se_vende"><option value="">— Selecciona —</option>${['Mucho','Regular','Poco','No sé aún'].map(t => `<option${r.que_tanto_se_vende === t ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Algo importante de este producto <small>(opcional)</small></label><input type="text" data-cat="${i}" data-f="notas" value="${esc(r.notas || '')}" placeholder="Ej. Incluye instalación"></div>
    ${filas.length > 1 ? `<button type="button" class="prod-del" data-delcat="${i}">Quitar este producto</button>` : ''}
  </div>`).join('') + `<button type="button" class="btn add" id="add-prod">+ Agregar otro producto</button>`;
}

function render() {
  const app = document.getElementById('app');
  if (!CLIENTE || !CODIGO) { app.innerHTML = `<div class="brand">// JefesHub</div><h1>Enlace incompleto</h1><p class="desc">Este enlace no está completo. Pídele a quien te lo compartió que te lo envíe de nuevo.</p>`; return; }
  if (paso === PASOS.length) { return renderListo(app); }
  const barra = `<div class="progreso">${PASOS.map((_, i) => `<span class="${i < paso ? 'hecho' : i === paso ? 'actual' : ''}"></span>`).join('')}</div>`;
  if (paso === -1) {
    app.innerHTML = `<div class="bienvenida"><div class="brand">// JefesHub · Tu ADN del negocio</div>
      <svg class="robot" viewBox="0 0 200 200" role="img" aria-label="Asistente de JefesHub">
        <circle cx="100" cy="16" r="11" fill="#C0F800"/><path d="M97 25 L94 52 L106 52 L103 25 Z" fill="#C0F800"/>
        <rect x="64" y="46" width="72" height="34" rx="14" fill="#C0F800"/><ellipse cx="100" cy="132" rx="78" ry="62" fill="#C0F800"/>
        <rect x="12" y="98" width="30" height="62" rx="15" fill="#C0F800"/><rect x="158" y="98" width="30" height="62" rx="15" fill="#C0F800"/>
        <ellipse cx="100" cy="134" rx="58" ry="44" fill="#FFFFFF"/><ellipse cx="78" cy="132" rx="9" ry="14" fill="#C0F800"/><ellipse cx="122" cy="132" rx="9" ry="14" fill="#C0F800"/>
      </svg>
      <h1>Te damos la bienvenida a tu ADN</h1>
      <p class="desc">Antes de nuestra primera sesión, cuéntanos de tu negocio. Con esto <strong>le enseñamos a la inteligencia artificial de tus Jefes quién eres</strong>, qué vendes, a quién y cómo hablas, para que desde el primer día trabaje con tu información real y no con algo genérico.</p>
      <div class="timeline">
        <div class="tl-root"><span>ADN</span></div>
        ${PASOS.map((p, i) => `<div class="tl-item"><span class="tl-num">${i + 1}</span><span class="tl-label">${esc(p.titulo)}</span></div>`).join('')}
      </div>
      <p class="tl-note">⏱️ Tarda unos <strong>10 a 15 minutos</strong>. Escribe con tus palabras, como si le explicaras a alguien nuevo. Tus respuestas se guardan en este dispositivo mientras avanzas, así que puedes salir y volver. Al final das clic en <strong>Enviar</strong> y todo queda cargado en tu ADN.</p>
      <button class="btn" id="empezar">Empezar</button></div>`;
    document.getElementById('empezar').onclick = () => { paso = 0; render(); window.scrollTo(0, 0); };
    return;
  }
  const p = PASOS[paso];
  const ultimo = paso === PASOS.length - 1;
  app.innerHTML = `<div class="brand">// Paso ${paso + 1} de ${PASOS.length}</div>${barra}
    <h1>${esc(p.titulo)}</h1><p class="desc">${md(p.desc)}</p>
    <div class="card">${p.tipo === 'catalogo' ? catalogoHtml() : camposHtml(p.sec, p.campos)}</div>
    <div class="msg" id="msg"></div>
    <div class="nav"><button class="btn sec" id="atras">← Atrás</button><button class="btn" id="siguiente">${ultimo ? 'Enviar mi ADN' : 'Siguiente →'}</button></div>
    <div class="borrador">Tus respuestas se guardan solas en este dispositivo.</div>`;
  // Prellenar WhatsApp con el teléfono del paso 1 si aún está vacío
  p.campos && p.campos.forEach(c => { if (c.copiaDe && !val(p.sec, c.id)) { const v = val(c.copiaDe.sec, c.copiaDe.id); if (v) { setVal(p.sec, c.id, v); const el = document.getElementById(`f-${p.sec}-${c.id}`); if (el) el.value = v; } } });
  enlazar();
  document.getElementById('atras').onclick = () => { paso--; render(); window.scrollTo(0, 0); };
  document.getElementById('siguiente').onclick = () => avanzar(ultimo);
}

function enlazar() {
  document.querySelectorAll('[data-s][data-i]').forEach(el => {
    if (el.dataset.chip) return;
    el.addEventListener('input', () => {
      const v = el.dataset.tags ? el.value.split(',').map(s => s.trim()).filter(Boolean) : el.value;
      setVal(el.dataset.s, el.dataset.i, v);
      PASOS[paso].campos && PASOS[paso].campos.forEach(c => { if (c.soloSi && c.soloSi.id === el.dataset.i) { const w = document.querySelector(`[data-wrap="${el.dataset.s}-${c.id}"]`); if (w) w.style.display = el.value === c.soloSi.valor ? '' : 'none'; } });
    });
  });
  document.querySelectorAll('[data-chip]').forEach(b => b.addEventListener('click', () => {
    const cur = Array.isArray(val(b.dataset.s, b.dataset.i)) ? val(b.dataset.s, b.dataset.i).slice() : [];
    const k = cur.indexOf(b.dataset.v); k >= 0 ? cur.splice(k, 1) : cur.push(b.dataset.v);
    setVal(b.dataset.s, b.dataset.i, cur); b.classList.toggle('sel');
  }));
  document.querySelectorAll('[data-cat]').forEach(el => el.addEventListener('input', () => {
    if (!Array.isArray(datos.catalogo) || !datos.catalogo.length) datos.catalogo = [{}];
    datos.catalogo[+el.dataset.cat][el.dataset.f] = el.value; guardarBorrador();
  }));
  const add = document.getElementById('add-prod');
  if (add) add.onclick = () => { if (!Array.isArray(datos.catalogo) || !datos.catalogo.length) datos.catalogo = [{}]; datos.catalogo.push({}); guardarBorrador(); render(); };
  document.querySelectorAll('[data-delcat]').forEach(b => b.onclick = () => { datos.catalogo.splice(+b.dataset.delcat, 1); guardarBorrador(); render(); });
}

function avanzar(ultimo) {
  const p = PASOS[paso], msg = document.getElementById('msg');
  if (p.sec === 'identidad' && !String(val('identidad', 'nombre')).trim()) { msg.className = 'msg err'; msg.textContent = 'Escribe el nombre de tu negocio para continuar.'; return; }
  if (!ultimo) { paso++; render(); window.scrollTo(0, 0); return; }
  enviar();
}

async function enviar() {
  if (enviando) return;
  enviando = true;
  const btn = document.getElementById('siguiente'), msg = document.getElementById('msg');
  btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Enviando...';
  const secciones = {};
  PASOS.forEach(p => { if (datos[p.sec] !== undefined) secciones[p.sec] = datos[p.sec]; });
  try {
    const res = await fetch('/api/storage/adn-previo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cliente: CLIENTE, codigo: CODIGO, secciones }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { msg.className = 'msg err'; msg.textContent = data.error || 'No se pudo enviar. Intenta de nuevo.'; btn.disabled = false; enviando = false; return; }
    window.__resultado = data; paso = PASOS.length; render(); window.scrollTo(0, 0);
  } catch (e) { msg.className = 'msg err'; msg.textContent = 'Error de conexión. Intenta de nuevo.'; btn.disabled = false; }
  enviando = false;
}

const NOMBRES_SEC = { identidad:'Tu negocio', audiencias:'Tu cliente ideal', catalogo:'Lo que vendes', tono:'Cómo hablas', redes:'Dónde te encuentran' };
function renderListo(app) {
  const r = window.__resultado || {};
  const g = (r.guardadas || []).map(s => `<li>${esc(NOMBRES_SEC[s] || s)}</li>`).join('');
  const o = (r.omitidas || []).length ? `<p class="desc" style="text-align:center">Estas secciones ya tenían información editada en tu ADN, así que no las modificamos: ${(r.omitidas || []).map(s => esc(NOMBRES_SEC[s] || s)).join(', ')}.</p>` : '';
  app.innerHTML = `<div class="listo"><div class="check">✅</div><h1>¡Listo! Tu ADN ya está cargado</h1>
    <p class="desc">Guardamos esto en el ADN de tu negocio:</p><ul class="lista-ok">${g || '<li>Tu información</li>'}</ul>${o}
    <p class="desc">Nos vemos en la primera sesión. Ahí lo revisamos juntos y lo afinamos. Si recuerdas algo más, puedes volver a abrir este enlace y enviarlo otra vez.</p></div>`;
}
render();
</script>
