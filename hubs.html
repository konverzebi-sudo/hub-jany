<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hub de Hubs — JefesHub</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FFFFFF; --text:#1A1A1A; --dim:#6B6B6B; --line:#E4E4E4; --pill:#F0F0F0; --lime:#C0F800; --lime-deep:#A6E000; --ok:#1F9D55; --err:#D92D20; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Libre Franklin',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
  .top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .robot{width:54px;height:54px;flex:none}
  h1{font-size:clamp(26px,5vw,36px);font-weight:800;letter-spacing:-.01em;line-height:1.1}
  .sub{color:var(--dim);margin:6px 0 26px;font-size:15.5px;line-height:1.5;max-width:60ch}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 18px rgba(0,0,0,.04);transition:transform .18s ease,box-shadow .18s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.09)}
  .logo{height:84px;border-radius:14px;background:#FAFAFA;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .logo img{max-width:80%;max-height:68px;object-fit:contain}
  .ini{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#111}
  .nom{font-weight:700;font-size:18px;line-height:1.2}
  .ruta{font-size:12.5px;color:var(--dim);margin-top:2px}
  .tok{font-size:13px;color:var(--dim);background:var(--pill);border-radius:99px;padding:5px 11px;align-self:flex-start}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
  .btn{background:var(--lime);color:#111;font-weight:700;font-size:14px;padding:10px 16px;border-radius:11px;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--lime-deep)}
  .btn.sec{background:var(--pill);font-weight:600}
  .btn.sec:hover{background:#E4E4E4}
  .chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .nuevo{border:2px dashed #C9C9C9;background:#FAFAFA;align-items:center;justify-content:center;text-align:center;min-height:250px;cursor:pointer;color:var(--dim);gap:8px}
  .nuevo:hover{border-color:#111;color:#111}
  .nuevo .mas{width:64px;height:64px;border-radius:14px;background:var(--lime);color:#111;font-size:38px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
  .msg{margin-top:14px;font-size:13.5px;min-height:18px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  /* modal */
  .velo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:20}
  .velo.on{display:flex}
  .modal{background:#fff;border-radius:20px;padding:24px 22px;width:min(560px,100%);margin:auto;box-shadow:0 24px 70px rgba(0,0,0,.3)}
  .modal h2{font-size:24px;margin-bottom:4px}
  .modal p.d{color:var(--dim);font-size:14px;margin-bottom:16px;line-height:1.5}
  .f{margin-bottom:14px}
  .f label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
  .f small{font-weight:400;color:var(--dim)}
  input[type=text]{width:100%;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
  input[type=text]:focus{border-color:#111}
  .slugrow{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--dim)}
  .slugrow input{flex:1}
  .color{display:flex;gap:10px;align-items:center}
  .color input{width:52px;height:44px;border:2px solid var(--line);border-radius:10px;padding:2px;background:#fff;cursor:pointer}
  .jefes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .jefes label{display:flex;gap:9px;align-items:center;background:var(--pill);border-radius:10px;padding:9px 11px;font-weight:500;font-size:13.5px;margin:0;cursor:pointer}
  .jefes input{width:17px;height:17px;accent-color:#111}
  .mact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .res .lk{background:var(--pill);border-radius:12px;padding:11px 13px;margin:8px 0;font-size:13.5px;word-break:break-all}
  .res .lk b{display:block;font-size:12px;color:var(--dim);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
  .res .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <svg class="robot" viewBox="0 0 200 200" role="img" aria-label="JefesHub">
      <circle cx="100" cy="16" r="11" fill="#C0F800"/><path d="M97 25 L94 52 L106 52 L103 25 Z" fill="#C0F800"/>
      <rect x="64" y="46" width="72" height="34" rx="14" fill="#C0F800"/><ellipse cx="100" cy="132" rx="78" ry="62" fill="#C0F800"/>
      <rect x="12" y="98" width="30" height="62" rx="15" fill="#C0F800"/><rect x="158" y="98" width="30" height="62" rx="15" fill="#C0F800"/>
      <ellipse cx="100" cy="134" rx="58" ry="44" fill="#FFFFFF"/><ellipse cx="78" cy="132" rx="9" ry="14" fill="#C0F800"/><ellipse cx="122" cy="132" rx="9" ry="14" fill="#C0F800"/>
    </svg>
    <h1>Hub de Hubs</h1>
  </div>
  <p class="sub">Todos los hubs de tus clientes en un solo lugar. Crea uno nuevo, mándale su link para que llene su ADN y revisa cuántos tokens lleva usados.</p>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>
</div>

<div class="velo" id="velo">
  <div class="modal" id="modal"></div>
</div>

<script src="/js/storage-client.js"></script>
<script>
(function () {
  'use strict';
  var BASE = [
    { slug: 'jefeshub', nombre: 'JefesHub', color: '#B8F725', home: '/', adn: '/adn', fijo: true },
    { slug: 'rancho-seco', nombre: 'Rancho Seco', color: '#F2C230', home: '/rancho-seco', adn: '/rancho-seco/adn', fijo: true },
    { slug: 'rim', nombre: 'RIM', color: '#F472B6', home: '/rim', adn: '/rim/adn', fijo: true },
    { slug: 'optica-one', nombre: 'Óptica One', color: '#38BDF8', home: '/optica-one', adn: '/optica-one/adn', fijo: true }
  ];
  var JEFES = [['jefe-366', 'Jefe 366'], ['jefe-contenido', 'Jefe de Contenido'], ['jefe-whatsapp', 'WhatsApp y Ventas'], ['jefe-financiero', 'Jefe de Finanzas'],
    ['jefe-radar', 'Jefe del Faro'], ['jefe-anuncios', 'Jefe de Anuncios'], ['jefe-produccion-video', 'Jefe Productor IA'], ['jefe-cierre', 'Jefe de Conversión'],
    ['jefe-optimizacion', 'Jefe de Mejora Constante'], ['jefe-temporada', 'Campañas de Temporada'], ['jefe-agenda', 'Jefe de Agenda']];
  var RESERVADOS = ['adn', 'jefes', 'hubs', 'api', 'js', 'css', 'img', 'pre-hub', 'adn-previo', 'adn-previo-admin', 'nodisenes', 'herramientas', 'prospeccion',
    'taller-gracias', 'jefeshub', 'rancho-seco', 'rim', 'optica-one', 'hub', 'index', 'admin', 'login', 'terminos', 'aviso-privacidad', 'bienvenida', 'oficial'];
  var KEY = 'jefeshub_storage_token';
  var grid = document.getElementById('grid'), msg = document.getElementById('msg'), velo = document.getElementById('velo'), modal = document.getElementById('modal');

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function aviso(t, cls) { msg.textContent = t || ''; msg.className = 'msg' + (cls ? ' ' + cls : ''); }
  function token() { try { return (localStorage.getItem(KEY) || '').trim(); } catch (e) { return ''; } }
  function parse(v) { if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return null; } } return v; }
  async function leer(key) {
    try { var r = await window.storage.get(key); return r && r.value != null ? parse(r.value) : null; } catch (e) { return null; }
  }
  async function leerRegistro() { var r = await leer('hubs:registro'); return r && Array.isArray(r.hubs) ? r : { hubs: [] }; }
  function copiar(t) {
    return (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(function () {
      var i = document.createElement('input'); i.value = t; document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove();
    });
  }
  function slugDe(n) {
    return String(n).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  }

  async function linkPreRegistro(slug) {
    var t = token();
    if (!t) { t = (window.prompt('Token de acceso:') || '').trim(); if (!t) return ''; }
    try {
      var r = await fetch('/api/storage/adn-previo?cliente=' + encodeURIComponent(slug), { headers: { 'X-Storage-Token': t }, cache: 'no-store' });
      var d = await r.json().catch(function () { return {}; });
      if (r.status === 401) { try { localStorage.removeItem(KEY); } catch (e) {} aviso('Token incorrecto.', 'err'); return ''; }
      if (!r.ok || !d.codigo) { aviso(d.error || 'No se pudo generar el link.', 'err'); return ''; }
      try { localStorage.setItem(KEY, t); } catch (e) {}
      return location.origin + '/pre-hub?c=' + encodeURIComponent(slug) + '&k=' + d.codigo;
    } catch (e) { aviso('Error de conexión.', 'err'); return ''; }
  }

  async function datosDe(h) {
    var res = await Promise.all([leer(h.slug + ':brand-book.visual'), leer(h.slug + ':brand-book.identidad'), leer(h.slug + ':uso-tokens-log')]);
    var logo = res[0] && res[0].logo ? res[0].logo : '';
    var nombre = (res[1] && res[1].nombre) || h.nombre || h.slug;
    var items = Array.isArray(res[2]) ? res[2] : [];
    var tokens = items.reduce(function (s, it) { return s + (it.inputTokens || 0) + (it.outputTokens || 0); }, 0);
    return { logo: logo, nombre: nombre, tokens: tokens };
  }

  function tarjeta(h, d) {
    var cab = d.logo ? '<img src="' + esc(d.logo) + '" alt="Logo de ' + esc(d.nombre) + '">' : '<span class="ini" style="background:' + esc(h.color) + '">' + esc((d.nombre || '?').charAt(0).toUpperCase()) + '</span>';
    return '<article class="card" data-slug="' + esc(h.slug) + '">' +
      '<div class="logo">' + cab + '</div>' +
      '<div><div class="nom">' + esc(d.nombre) + '</div><div class="ruta">' + (h.slug === 'jefeshub' ? 'agentes.jefeshub.com' : '/' + esc(h.slug)) + (h.fijo ? '' : ' · nuevo') + '</div></div>' +
      '<span class="tok">🔢 ' + (d.tokens ? d.tokens.toLocaleString('es-MX') + ' tokens' : 'Sin uso todavía') + '</span>' +
      '<div class="acts"><a class="btn" href="' + esc(h.home) + '" target="_blank" rel="noopener">Abrir hub</a>' +
      '<a class="btn sec" href="' + esc(h.adn) + '" target="_blank" rel="noopener">ADN</a>' +
      '<button class="btn sec" data-link="' + esc(h.slug) + '" title="Copiar link para que el cliente llene su ADN">🔗 Link</button></div></article>';
  }

  async function pintar() {
    var reg = await leerRegistro();
    var hubs = BASE.concat(reg.hubs.filter(function (h) { return !BASE.some(function (b) { return b.slug === h.slug; }); }).map(function (h) {
      return { slug: h.slug, nombre: h.nombre, color: h.color || '#B8F725', home: '/' + h.slug, adn: '/' + h.slug + '/adn', jefes: h.jefes };
    }));
    var datos = await Promise.all(hubs.map(datosDe));
    grid.innerHTML = hubs.map(function (h, i) { return tarjeta(h, datos[i]); }).join('') +
      '<article class="card nuevo" id="nuevo" role="button" tabindex="0"><div class="mas">+</div><div class="nom" style="color:inherit">Crear nuevo hub</div><div class="ruta">Un cliente, su propio hub</div></article>';
    document.getElementById('nuevo').onclick = abrirModal;
    document.getElementById('nuevo').onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrirModal(); } };
    grid.querySelectorAll('[data-link]').forEach(function (b) {
      b.onclick = async function () {
        var l = await linkPreRegistro(b.dataset.link);
        if (l) { await copiar(l); aviso('Link de pre-registro copiado ✓ — mándaselo a tu cliente', 'ok'); }
      };
    });
  }

  function cerrar() { velo.classList.remove('on'); modal.innerHTML = ''; }
  velo.addEventListener('click', function (e) { if (e.target === velo) cerrar(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrar(); });

  function abrirModal() {
    modal.innerHTML = '<h2>Crear nuevo hub</h2><p class="d">Cada hub guarda su información por separado. Después de crearlo le mandas su link para que llene su ADN.</p>' +
      '<div class="f"><label for="n-nombre">Nombre del cliente o negocio</label><input type="text" id="n-nombre" placeholder="Ej. Arqivan" autocomplete="off"></div>' +
      '<div class="f"><label for="n-slug">Dirección del hub <small>(minúsculas, sin espacios)</small></label><div class="slugrow"><span>agentes.jefeshub.com/</span><input type="text" id="n-slug" placeholder="arqivan" autocomplete="off"></div></div>' +
      '<div class="f"><label>Color de su hub</label><div class="color"><input type="color" id="n-color" value="#B8F725"><span style="color:var(--dim);font-size:13px">Se usa en sus botones y brillos.</span></div></div>' +
      '<div class="f"><label>Jefes que tendrá activos</label><div class="jefes" id="n-jefes">' +
      JEFES.map(function (j) { return '<label><input type="checkbox" value="' + j[0] + '" checked> ' + esc(j[1]) + '</label>'; }).join('') + '</div></div>' +
      '<div class="msg" id="n-msg"></div>' +
      '<div class="mact"><button class="btn sec" id="n-cancel" type="button">Cancelar</button><button class="btn" id="n-ok" type="button">Crear hub</button></div>';
    velo.classList.add('on');
    var nom = document.getElementById('n-nombre'), sl = document.getElementById('n-slug'), tocado = false;
    nom.addEventListener('input', function () { if (!tocado) sl.value = slugDe(nom.value); });
    sl.addEventListener('input', function () { tocado = true; sl.value = slugDe(sl.value); });
    document.getElementById('n-cancel').onclick = cerrar;
    document.getElementById('n-ok').onclick = crear;
    nom.focus();
  }

  async function crear() {
    var nm = document.getElementById('n-msg'), btn = document.getElementById('n-ok');
    function err(t) { nm.textContent = t; nm.className = 'msg err'; }
    var nombre = document.getElementById('n-nombre').value.trim(), slug = slugDe(document.getElementById('n-slug').value);
    var color = document.getElementById('n-color').value.toUpperCase();
    var jefes = Array.prototype.map.call(document.querySelectorAll('#n-jefes input:checked'), function (i) { return i.value; });
    if (!nombre) return err('Escribe el nombre del cliente.');
    if (!/^[a-z0-9][a-z0-9-]{1,39}$/.test(slug)) return err('La dirección debe tener de 2 a 40 letras minúsculas, números o guiones.');
    if (RESERVADOS.indexOf(slug) >= 0 || /^(jefe|consultor)-/.test(slug)) return err('Esa dirección está reservada. Elige otra.');
    if (!jefes.length) return err('Elige al menos un Jefe.');
    btn.disabled = true; nm.textContent = 'Creando…'; nm.className = 'msg';
    try {
      var reg = await leerRegistro();
      if (reg.hubs.some(function (h) { return h.slug === slug; })) { btn.disabled = false; return err('Ya existe un hub con esa dirección.'); }
      reg.hubs.push({ slug: slug, nombre: nombre, color: color, jefes: jefes, creado: new Date().toISOString() });
      await window.storage.set('hubs:registro', JSON.stringify(reg));
    } catch (e) {
      btn.disabled = false;
      return err(e && e.status === 401 ? 'Token incorrecto. Intenta de nuevo.' : 'No se pudo crear el hub. Intenta de nuevo.');
    }
    var link = await linkPreRegistro(slug);
    var base = location.origin;
    modal.innerHTML = '<div class="res"><h2>✅ ' + esc(nombre) + ' ya tiene su hub</h2><p class="d">Esto es lo que sigue: mándale el link de pre-registro para que llene su ADN. El hub se lo das tú cuando quieras.</p>' +
      '<div class="lk"><b>Link de pre-registro (para el cliente)</b><div class="row"><span>' + esc(link || 'No se pudo generar ahora; usa el botón 🔗 Link de su tarjeta.') + '</span>' +
      (link ? '<button class="btn sec" data-c="' + esc(link) + '">Copiar</button>' : '') + '</div></div>' +
      '<div class="lk"><b>Su hub</b><div class="row"><span>' + esc(base + '/' + slug) + '</span><button class="btn sec" data-c="' + esc(base + '/' + slug) + '">Copiar</button></div></div>' +
      '<div class="lk"><b>Su ADN</b><div class="row"><span>' + esc(base + '/' + slug + '/adn') + '</span><button class="btn sec" data-c="' + esc(base + '/' + slug + '/adn') + '">Copiar</button></div></div>' +
      '<div class="mact"><button class="btn" id="n-fin" type="button">Listo</button></div></div>';
    modal.querySelectorAll('[data-c]').forEach(function (b) { b.onclick = async function () { await copiar(b.dataset.c); b.textContent = 'Copiado ✓'; }; });
    document.getElementById('n-fin').onclick = function () { cerrar(); pintar(); };
  }

  pintar();
})();
</script>
</body>
</html>
