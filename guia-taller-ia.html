<!DOCTYPE html>
<html lang="es">
<head>
<script>document.documentElement.className += ' js';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Guía del taller · Tu primer asistente con IA · Jefes Hub</title>
<meta name="theme-color" content="#3B1468">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  GUÍA DEL ALUMNO — Taller IA para tu negocio (BOCETO)
  Todo el contenido vive en el objeto CURSO al final del archivo:
  módulos → clases → etapas → prompts. Para otro taller solo se cambia CURSO.
  El progreso se guarda en el navegador de cada alumna/o.
-->
<style>
  :root {
    --bg: #0F0B16; --side: #0B0811; --card: #181120; --card-2: #211829;
    --lime: #BBF802; --lime-soft: #2F3D05; --ink: #0F0B16;
    --purple: #7B2FBE; --pink: #A65BE8;
    --text: #FFFFFF; --muted: #D6CFE0; --dim: #B6A9C7; --line: #332A3D;
    --sideW: 300px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body { background: var(--bg); color: var(--text); font: 16px/1.6 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: 'Sora', sans-serif; line-height: 1.15; letter-spacing: -.02em; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .lime { color: var(--lime); }

  /* ---------- LAYOUT ---------- */
  .app { display: grid; grid-template-columns: var(--sideW) 1fr; min-height: 100vh; }
  aside {
    position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side);
    border-right: 1px solid var(--line); padding: 22px 16px 30px; display: flex; flex-direction: column; gap: 18px;
  }
  .brand { font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: .06em; font-size: 15px; padding: 0 8px; }
  .brand span { color: var(--lime); }
  .brand small { display: block; margin-top: 4px; font-weight: 500; letter-spacing: .12em; font-size: 10px; color: var(--dim); text-transform: uppercase; }
  .search { position: relative; }
  .search input {
    width: 100%; padding: 11px 38px 11px 38px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-size: 14px; outline: none;
  }
  .search input:focus { border-color: var(--lime); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--dim); }
  .search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 500 11px 'JetBrains Mono', monospace; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .search-res { margin-top: 8px; display: none; flex-direction: column; gap: 2px; }
  .search-res.on { display: flex; }
  .search-res a { padding: 8px 10px; border-radius: 10px; font-size: 13px; color: var(--muted); }
  .search-res a:hover { background: var(--card); color: #fff; }
  .search-res a b { color: var(--lime); font-weight: 600; }
  .search-res .none { padding: 8px 10px; font-size: 13px; color: var(--dim); }

  .nav-home { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; font-weight: 600; font-size: 14px; border: 1px solid transparent; }
  .nav-home.on, .nav-item.on { background: var(--card); border-color: var(--lime); }
  .nav-home .ico { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; background: var(--lime); color: var(--ink); }
  .nav-mod { display: flex; align-items: center; gap: 8px; padding: 0 10px; margin-top: 6px; font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--pink); }
  .nav-item { display: grid; grid-template-columns: 34px 1fr 20px; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 12px; font-size: 14px; color: var(--muted); border: 1px solid transparent; }
  .nav-item:hover { background: var(--card); color: #fff; }
  .nav-item .n { font: 600 11px 'JetBrains Mono', monospace; color: var(--dim); background: rgba(255,255,255,.05); border-radius: 7px; padding: 3px 0; text-align: center; }
  .nav-item.on .n { background: var(--lime); color: var(--ink); }
  .nav-item .ok { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--lime); color: var(--ink); opacity: 0; }
  .nav-item.done .ok { opacity: 1; }
  .nav-item .ok svg { width: 11px; height: 11px; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 14px; border-top: 1px solid var(--line); }
  .side-foot a { padding: 8px 10px; border-radius: 10px; font-size: 13px; color: var(--dim); }
  .side-foot a:hover { color: #fff; background: var(--card); }

  /* ---------- TOPBAR ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 40px; background: rgba(15,11,22,.92); border-bottom: 1px solid var(--line); }
  .crumbs { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs b { color: #fff; font-weight: 600; }
  .top-actions { display: flex; gap: 8px; flex: none; }
  .chip-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); color: var(--muted); }
  .chip-btn:hover { border-color: var(--lime); color: #fff; }
  .chip-btn.solid { background: var(--lime); color: var(--ink); border-color: var(--lime); }
  .menu-btn { display: none; }
  main { min-width: 0; }
  .view { max-width: 1040px; margin: 0 auto; padding: 36px 40px 90px; }

  /* ---------- COMUNES ---------- */
  .eyebrow { display: inline-flex; gap: 8px; font: 500 12px 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--lime); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
  .eyebrow::before { content: "//"; color: var(--pink); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 26px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; border-radius: 999px; background: var(--lime); color: var(--ink); font: 700 15px 'Sora', sans-serif; }
  .btn.ghost { background: transparent; color: #fff; border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--lime); }
  .btn svg { width: 18px; height: 18px; }
  .sec-title { display: flex; align-items: center; gap: 12px; margin: 48px 0 18px; }
  .sec-title .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--lime-soft); color: var(--lime); flex: none; }
  .sec-title h2 { font-size: 24px; }
  .sec-title p { color: var(--dim); font-size: 14px; }

  /* ---------- INICIO ---------- */
  .hero { position: relative; overflow: hidden; border-radius: 28px; padding: 46px; background: radial-gradient(ellipse at 85% 10%, rgba(123,47,190,.55), transparent 55%), linear-gradient(160deg, #1e1530, var(--card)); border: 1px solid var(--line); }
  .hero h1 { font-size: clamp(34px, 5vw, 56px); margin: 18px 0 14px; max-width: 640px; }
  .hero p { color: var(--muted); max-width: 560px; font-size: 17px; }
  .hero .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .stats { display: flex; gap: 36px; margin-top: 30px; flex-wrap: wrap; }
  .stats b { display: block; font: 800 30px 'Sora', sans-serif; color: var(--lime); }
  .stats small { color: var(--dim); font-size: 13px; }
  .progress-card { display: flex; align-items: center; gap: 18px; margin-top: 18px; }
  .ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--lime) calc(var(--p) * 1%), var(--line) 0); }
  .ring span { width: 50px; height: 50px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font: 700 13px 'JetBrains Mono', monospace; }
  .progress-card .txt { flex: 1; }
  .progress-card .txt small { display: block; color: var(--dim); font-size: 13px; }
  .steps4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .step4 { position: relative; padding: 22px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
  .step4 .num { font: 700 12px 'JetBrains Mono', monospace; color: var(--ink); background: var(--lime); padding: 3px 9px; border-radius: 999px; }
  .step4 .big { font-size: 34px; margin: 14px 0 6px; }
  .step4 h3 { font-size: 18px; margin-bottom: 6px; }
  .step4 p { color: var(--dim); font-size: 14px; }
  .path { display: flex; flex-direction: column; gap: 16px; }
  .mod { padding: 22px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); }
  .mod-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .mod-head .ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: var(--card-2); border: 1px solid var(--line); flex: none; }
  .mod-head small { font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .1em; color: var(--pink); text-transform: uppercase; }
  .mod-head h3 { font-size: 19px; }
  .mod-head .cnt { margin-left: auto; font: 600 12px 'JetBrains Mono', monospace; color: var(--lime); background: var(--lime-soft); padding: 4px 10px; border-radius: 999px; }
  .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .class-card { display: block; padding: 18px; border-radius: 16px; background: var(--card-2); border: 1px solid var(--line); transition: border-color .2s, transform .2s; }
  .class-card:hover { border-color: var(--lime); transform: translateY(-2px); }
  .class-card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .class-card .lab { font: 600 11px 'JetBrains Mono', monospace; color: var(--lime); letter-spacing: .08em; }
  .class-card .badge { font: 600 11px 'JetBrains Mono', monospace; padding: 2px 9px; border-radius: 999px; background: var(--lime); color: var(--ink); display: none; }
  .class-card.done .badge { display: inline-block; }
  .class-card h4 { font: 700 16px 'Sora', sans-serif; margin-bottom: 6px; }
  .class-card p { color: var(--dim); font-size: 13.5px; }
  .class-card .meta { margin-top: 10px; font-size: 12px; color: var(--dim); }

  /* ---------- CLASE ---------- */
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font: 600 12px 'JetBrains Mono', monospace; padding: 5px 12px; border-radius: 999px; background: var(--lime); color: var(--ink); }
  .tag.soft { background: rgba(255,255,255,.05); color: var(--pink); border: 1px solid var(--line); }
  .class-head { display: grid; grid-template-columns: 1fr 300px; gap: 30px; align-items: center; margin-top: 16px; }
  .class-head h1 { font-size: clamp(30px, 4.4vw, 46px); margin-bottom: 10px; }
  .class-head .sub { color: var(--muted); font-size: 17px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .chips span { font-size: 13px; color: var(--muted); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.02); }
  .class-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .done-toggle { display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
  .done-toggle .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--dim); display: grid; place-items: center; }
  .done-toggle.on { border-color: var(--lime); }
  .done-toggle.on .box { background: var(--lime); border-color: var(--lime); color: var(--ink); }
  .cover { aspect-ratio: 16/10; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: radial-gradient(ellipse at 70% 20%, rgba(123,47,190,.6), transparent 60%), var(--card-2); display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; }
  .cover small { font: 600 11px 'JetBrains Mono', monospace; color: var(--lime); letter-spacing: .1em; }
  .cover b { font: 800 22px 'Sora', sans-serif; line-height: 1.15; }
  .cover .emoji { font-size: 44px; margin-bottom: auto; }
  .tip { display: flex; gap: 14px; margin-top: 26px; padding: 18px 20px; border-radius: 16px; background: rgba(187,248,2,.07); border: 1px solid rgba(187,248,2,.35); color: var(--text); }
  .tip span { font-size: 22px; }
  .map { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 14px; }
  .map a { display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .map a:hover { border-color: var(--lime); color: #fff; }
  .map a i { font-style: normal; flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 12px 'JetBrains Mono', monospace; background: var(--lime-soft); color: var(--lime); }
  .checklist { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .checklist li { display: flex; gap: 12px; color: var(--muted); }
  .checklist li::before { content: "✓"; color: var(--lime); font-weight: 700; flex: none; }
  .timeline { list-style: none; position: relative; margin-top: 10px; }
  .timeline::before { content: ""; position: absolute; left: 21px; top: 10px; bottom: 10px; width: 2px; background: linear-gradient(var(--lime), var(--line)); }
  .etapa { position: relative; padding-left: 64px; padding-bottom: 34px; }
  .etapa .node { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font: 800 18px 'Sora', sans-serif; background: var(--lime); color: var(--ink); box-shadow: 0 0 0 6px var(--bg); }
  .etapa small { font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .12em; color: var(--pink); }
  .etapa h3 { font-size: 22px; margin: 4px 0 8px; }
  .etapa p { color: var(--muted); }
  .prompt { margin-top: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); overflow: hidden; }
  .prompt-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card-2); }
  .prompt-head b { font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .prompt-head b::before { content: ">_"; font: 700 12px 'JetBrains Mono', monospace; color: var(--lime); }
  .copy { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--lime); color: var(--lime); flex: none; }
  .copy.ok { background: var(--lime); color: var(--ink); }
  .copy svg { width: 14px; height: 14px; }
  .prompt-note { padding: 10px 16px 0; font-size: 13px; color: var(--pink); }
  .prompt pre { position: relative; margin: 0; padding: 16px; white-space: pre-wrap; word-wrap: break-word; font: 14px/1.65 'Inter', sans-serif; color: var(--muted); max-height: 170px; overflow: hidden; }
  .prompt pre::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(transparent, var(--card)); }
  .prompt.open pre { max-height: none; }
  .prompt.open pre::after { display: none; }
  .prompt pre mark { background: rgba(187,248,2,.16); color: var(--lime); border-radius: 4px; padding: 0 3px; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .expand { width: 100%; padding: 10px; font-size: 13px; font-weight: 600; color: var(--lime); border-top: 1px solid var(--line); }
  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; }
  .pager a { padding: 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); }
  .pager a:hover { border-color: var(--lime); }
  .pager small { font: 600 11px 'JetBrains Mono', monospace; color: var(--dim); letter-spacing: .1em; }
  .pager b { display: block; font: 700 16px 'Sora', sans-serif; margin-top: 4px; }
  .pager .next { text-align: right; }
  .complete-bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 30px; padding: 20px 24px; border-radius: 18px; background: var(--lime); color: var(--ink); }
  .complete-bar b { font: 700 18px 'Sora', sans-serif; }
  .complete-bar .btn { background: var(--ink); color: var(--lime); }
  .res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .res { display: block; padding: 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .res:hover { border-color: var(--lime); }
  .res b { display: block; font-family: 'Sora', sans-serif; margin-bottom: 4px; }
  .res span { font-size: 13.5px; color: var(--dim); }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 30px); opacity: 0; padding: 10px 18px; border-radius: 999px; background: var(--lime); color: var(--ink); font-weight: 700; font-size: 14px; transition: .25s; z-index: 50; pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- TEMA: barra morada + contenido claro ---------- */
  body { background: #FAF8FD; }
  aside {
    background: linear-gradient(180deg, #3B1468 0%, #2A0F4A 55%, #1C0A33 100%);
    border-right: 0;
    --card: rgba(255,255,255,.08); --line: rgba(255,255,255,.14); --dim: #CDBCE6; --muted: #EDE4FA;
  }
  aside .nav-mod { color: var(--lime); }
  aside .search input { background: rgba(255,255,255,.1); }
  main {
    --bg: #FAF8FD; --card: #FFFFFF; --card-2: #F4EFFB; --line: #E6DDF2;
    --text: #1B1326; --muted: #4A3F5C; --dim: #7A6E8C; --pink: #7B2FBE;
    --lime-soft: #F0E6FC;
    color: var(--text); background: var(--bg);
  }
  main .lime { color: var(--purple); }
  main .topbar { background: rgba(250,248,253,.94); }
  main .crumbs b { color: var(--text); }
  main .chip-btn:hover, main .class-card:hover, main .map a:hover, main .pager a:hover, main .res:hover, main .done-toggle.on { border-color: var(--purple); }
  main .chip-btn:hover, main .map a:hover { color: var(--text); }
  main .eyebrow { color: var(--purple); background: #F4EFFB; }
  main .card, main .step4, main .mod, main .class-card, main .prompt, main .res, main .pager a { box-shadow: 0 6px 24px -18px rgba(59,20,104,.35); }
  main .sec-title .ico { color: var(--purple); }
  main .map a i { color: var(--purple); }
  main .stats b, main .class-card .lab, main .mod-head .cnt { color: var(--purple); }
  main .mod-head .cnt { background: #F0E6FC; }
  main .tip { background: #F7FCE6; border-color: #C8E86B; color: var(--text); }
  main .prompt-head b::before, main .expand { color: var(--purple); }
  main .copy { border-color: var(--purple); color: var(--purple); }
  main .copy.ok { background: var(--purple); color: #fff; }
  main .prompt pre mark { background: #EFE3FC; color: var(--purple); }
  main .prompt pre::after { background: linear-gradient(transparent, #fff); }
  main .checklist li::before { color: var(--purple); }
  main .timeline::before { background: linear-gradient(var(--purple), var(--line)); }
  main .etapa .node { box-shadow: 0 0 0 6px var(--bg); }
  main .done-toggle .box { border-color: var(--dim); }
  main .ring span { background: #fff; }
  /* Las piezas "hero" siguen oscuras para dar contraste */
  main .hero, main .cover { --text: #fff; --muted: #E5DCF2; --dim: #C9BBDD; --line: rgba(255,255,255,.14); color: #fff; }
  main .hero { background: radial-gradient(ellipse at 85% 10%, rgba(187,248,2,.18), transparent 50%), linear-gradient(160deg, #3B1468, #1C0A33); }
  main .hero .lime, main .hero .stats b, main .cover small { color: var(--lime); }
  main .hero .eyebrow { color: var(--lime); background: rgba(255,255,255,.08); }
  main .hero .btn.ghost { color: #fff; }
  main .cover { background: radial-gradient(ellipse at 70% 20%, rgba(187,248,2,.2), transparent 60%), linear-gradient(160deg, #3B1468, #1C0A33); }
  main .complete-bar { background: linear-gradient(120deg, #3B1468, #5A1F92); color: #fff; }
  main .complete-bar .btn { background: var(--lime); color: var(--ink); }

  .brief-caja { margin-top: 14px; } .brief-hueco { margin-top: 12px; }
  .app-card { margin-top: 14px; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: #fff; border: 1px solid #E6DDF2; }
  .app-card img { flex: none; border-radius: 12px; }
  .app-txt b { font: 700 16px 'Sora', sans-serif; }
  .app-acc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .ico-dl { width: 16px; height: 16px; }
  .etapa-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .etapa-checks { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; }
  .chk { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 15px; }

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'inicio';
  const [page, sub] = h.split('/');
  let html, activo = page;
  if (page.startsWith('clase-')) {
    const c = CLASES.find(x => x.id === page.slice(6));
    if (c) { html = claseBloq(c, c.mod) ? viewBloqueada(c) : viewClase(c); activo = c.id; }
  } else if (page === 'recursos') html = viewRecursos();
  else if (page === 'en-vivo') html = viewEnVivo();
  if (!html) { html = viewInicio(); activo = 'inicio'; }
  $('#view').innerHTML = (MODO_PONENTE ? '<div class="aviso-ponente">🎤 <b>Vista de ponente.</b> Ves exactamente lo mismo que tus alumnos; los <span>cuadros verdes</span> son las decisiones que solo tú puedes tomar.</div>' : '') + html;
  if (window.GuiaMetricas) window.GuiaMetricas.montar();
  pintarCuenta(); pintarRecordatorios();
  renderNav(activo);
  document.body.classList.remove('menu-open');
  const target = sub && document.getElementById(sub);
  if (target) target.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    const raw = cp.closest('.prompt').querySelector('pre').dataset.raw;
    navigator.clipboard.writeText(raw).then(() => { cp.classList.add('ok'); cp.querySelector('span').textContent = '¡Copiado!'; toast('Prompt copiado'); setTimeout(() => { cp.classList.remove('ok'); cp.querySelector('span').textContent = 'Copiar prompt'; }, 1800); });
    return;
  }
  const ex = e.target.closest('[data-expand]');
  if (ex) { const p = ex.closest('.prompt'); p.classList.toggle('open'); ex.textContent = p.classList.contains('open') ? 'Ver menos ⌃' : 'Ver prompt completo ⌄'; return; }
  if (e.target.closest('[data-copyall]')) {
    const txt = [...document.querySelectorAll('.prompt')].map(p => '## ' + p.querySelector('.prompt-head b').textContent + '\n' + p.querySelector('pre').dataset.raw).join('\n\n');
    navigator.clipboard.writeText(txt).then(() => toast('Todos los prompts copiados'));
    return;
  }
  const d = e.target.closest('[data-done]');
  if (d) {
    const id = d.dataset.done, go = d.dataset.go;
    if (d.classList.contains('btn') && done[id]) { location.hash = go ? '#clase-' + go : '#inicio'; return; }
    done[id] = !done[id] || d.classList.contains('btn'); save();
    toast(done[id] ? '¡Clase completada! 🎉' : 'Marcada como pendiente');
    const y = window.scrollY; route(); window.scrollTo(0, y);
    return;
  }
  if (e.target.closest('#menuBtn')) { document.body.classList.toggle('menu-open'); return; }
  if (document.body.classList.contains('menu-open') && !e.target.closest('aside')) document.body.classList.remove('menu-open');
});

/* Buscador: clases, etapas y prompts */
const q = $('#q'), qres = $('#qres');
q.addEventListener('input', () => {
  const t = q.value.trim().toLowerCase();
  if (t.length < 2) { qres.classList.remove('on'); return; }
  const hits = [];
  CLASES.forEach(c => {
    if ((c.titulo + ' ' + c.resumen).toLowerCase().includes(t)) hits.push({ href: '#clase-' + c.id, txt: `Clase ${c.id} · ${c.titulo}` });
    c.etapas.forEach((e, k) => {
      const blob = (e.titulo + ' ' + e.texto + ' ' + (e.prompts || []).map(p => p.nombre + ' ' + p.texto).join(' ')).toLowerCase();
      if (blob.includes(t)) hits.push({ href: `#clase-${c.id}/etapa-${k + 1}`, txt: `Clase ${c.id} › ${e.titulo}` });
    });
  });
  const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  qres.innerHTML = hits.length ? hits.slice(0, 8).map(h => `<a href="${h.href}">${esc(h.txt).replace(re, '<b>$1</b>')}</a>`).join('') : '<div class="none">Sin resultados</div>';
  qres.classList.add('on');
});
qres.addEventListener('click', () => { q.value = ''; qres.classList.remove('on'); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); document.body.classList.add('menu-open'); q.focus(); } if (e.key === 'Escape') { q.blur(); qres.classList.remove('on'); } });
