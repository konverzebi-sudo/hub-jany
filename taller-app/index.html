<!DOCTYPE html>
<html lang="es">
<head>
<script>document.documentElement.className += ' js';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tu Primer Asesor con IA · Hub Jefes</title>
<meta name="theme-color" content="#3B1468">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: #FAF8FD; --card: #FFFFFF; --card-2: #F4EFFB; --line: #E6DDF2;
    --text: #1B1326; --muted: #4A3F5C; --dim: #7A6E8C;
    --lime: #BBF802; --ink: #0F0B16; --purple: #7B2FBE; --purple-d: #3B1468; --soft: #F0E6FC;
    --ok: #2FA36B; --warn: #E0A100; --bad: #D64545;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.55 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: 'Sora', sans-serif; line-height: 1.15; letter-spacing: -.02em; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .hidden { display: none !important; }

  /* Layout */
  .app { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }
  aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 16px; color: #fff;
    background: linear-gradient(180deg, #3B1468 0%, #2A0F4A 55%, #1C0A33 100%); display: flex; flex-direction: column; gap: 14px; }
  .brand { font: 700 15px 'JetBrains Mono', monospace; letter-spacing: .06em; padding: 0 8px; }
  .brand span { color: var(--lime); }
  .brand small { display: block; font-size: 10px; letter-spacing: .12em; color: #CDBCE6; margin-top: 4px; text-transform: uppercase; }
  .who { padding: 12px; border-radius: 14px; background: rgba(255,255,255,.08); font-size: 14px; }
  .who b { display: block; }
  .who small { color: #CDBCE6; }
  .bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.15); margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--lime); border-radius: 99px; transition: width .4s; }
  .nav-mod { font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--lime); padding: 0 10px; margin-top: 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 14px; color: #EDE4FA; border: 1px solid transparent; }
  .nav-item:hover { background: rgba(255,255,255,.08); }
  .nav-item.on { background: rgba(255,255,255,.1); border-color: var(--lime); }
  .nav-item .st { margin-left: auto; font-size: 12px; }
  .nav-item.locked { opacity: .55; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid rgba(255,255,255,.14); padding-top: 12px; }
  .side-foot button, .side-foot a { text-align: left; padding: 8px 10px; border-radius: 10px; font-size: 13px; color: #CDBCE6; }
  .side-foot button:hover, .side-foot a:hover { background: rgba(255,255,255,.08); color: #fff; }
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 32px; background: rgba(250,248,253,.94); border-bottom: 1px solid var(--line); }
  .topbar .t { font-size: 14px; color: var(--dim); }
  .topbar .t b { color: var(--text); }
  .topbar .menu-btn { display: none; }
  .view { max-width: 1060px; margin: 0 auto; padding: 32px 32px 100px; }

  /* Comunes */
  .eyebrow { display: inline-flex; gap: 8px; font: 500 12px 'JetBrains Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--purple); padding: 6px 14px; border-radius: 99px; background: var(--card-2); }
  .eyebrow::before { content: "//"; color: var(--purple); opacity: .6; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: 0 6px 24px -18px rgba(59,20,104,.35); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border-radius: 99px; font: 700 15px 'Sora', sans-serif; background: var(--lime); color: var(--ink); }
  .btn.dark { background: var(--purple-d); color: #fff; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn.sm { padding: 8px 14px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .hero { border-radius: 24px; padding: 40px; color: #fff; background: radial-gradient(ellipse at 85% 10%, rgba(187,248,2,.18), transparent 50%), linear-gradient(160deg, #3B1468, #1C0A33); }
  .hero h1 { font-size: clamp(28px, 4.4vw, 46px); margin: 14px 0 12px; }
  .hero p { color: #E5DCF2; max-width: 620px; font-size: 17px; }
  .hero .eyebrow { background: rgba(255,255,255,.1); color: var(--lime); }
  .sec-h { display: flex; align-items: center; gap: 12px; margin: 34px 0 14px; }
  .sec-h .n { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font: 700 13px 'JetBrains Mono', monospace; background: var(--soft); color: var(--purple); }
  .sec-h h2 { font-size: 22px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 99px; font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .04em; }
  .pill.on { background: #E6F7D0; color: #3F6B00; }
  .pill.off { background: #EEE9F4; color: var(--dim); }
  .pill.lock { background: #EEE9F4; color: var(--dim); }
  .pill.warn { background: #FFF2CC; color: #8A6400; }
  .pill.bad { background: #FDE2E2; color: #A12E2E; }
  .lockbox { text-align: center; padding: 60px 24px; }
  .lockbox .ico { font-size: 44px; }
  .lockbox h2 { margin: 12px 0 8px; }
  .lockbox p { color: var(--dim); }
  .tool { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
  .tool b { font-family: 'Sora', sans-serif; }
  .tool small { display: block; color: var(--dim); }
  .tool .go { margin-left: auto; }
  label.f { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .f-help { font-size: 13px; color: var(--dim); margin: -2px 0 8px; }
  input[type=text], input[type=email], input[type=url], input[type=number], textarea, select {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--purple); box-shadow: 0 0 0 3px var(--soft); }
  textarea { min-height: 110px; resize: vertical; }
  .field { margin-bottom: 16px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 15px; }
  .opt input { accent-color: var(--purple); width: 18px; height: 18px; }
  .opt.sel { border-color: var(--purple); background: var(--card-2); }
  .ok-msg { padding: 14px 16px; border-radius: 14px; background: #EFFADF; border: 1px solid #C8E86B; }
  .muted { color: var(--dim); }
  .small { font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .space { justify-content: space-between; }

  /* Visualización de puntos */
  .viz { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: center; }
  .orb { position: relative; width: 260px; height: 260px; margin: 0 auto; }
  .orb svg { width: 100%; height: 100%; }
  .orb .cnt { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .orb .cnt b { display: block; font: 800 40px 'Sora', sans-serif; color: var(--purple-d); }
  .orb .cnt small { color: var(--dim); font-size: 12px; }
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .brow { display: grid; grid-template-columns: 1fr 70px; gap: 10px; align-items: center; font-size: 14px; }
  .brow .track { grid-column: 1 / -1; height: 10px; border-radius: 99px; background: var(--card-2); overflow: hidden; }
  .brow .track i { display: block; height: 100%; border-radius: 99px; transition: width .5s; }
  .brow .pct { text-align: right; font: 600 12px 'JetBrains Mono', monospace; color: var(--muted); }

  /* Stepper prework */
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0; }
  .step { padding: 8px 12px; border-radius: 99px; font: 600 12px 'JetBrains Mono', monospace; border: 1px solid var(--line); background: #fff; color: var(--dim); }
  .step.on { background: var(--purple-d); color: #fff; border-color: var(--purple-d); }
  .step.done { border-color: #A6D45A; color: #3F6B00; }
  .prod { border: 1px dashed var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .thumbs figure { position: relative; width: 96px; height: 96px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--card-2); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .thumbs button { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(15,11,22,.75); color: #fff; font-size: 12px; }

  /* Chat y ayuda */
  .chat { display: flex; flex-direction: column; height: 420px; border: 1px solid var(--line); border-radius: 16px; background: #fff; overflow: hidden; }
  .chat .msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 9px 13px; border-radius: 14px; background: var(--card-2); font-size: 14px; }
  .msg.me { margin-left: auto; background: var(--purple-d); color: #fff; }
  .msg small { display: block; font-size: 11px; opacity: .7; margin-bottom: 2px; }
  .chat form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  .chat form input { flex: 1; }
  .help-fab { position: fixed; right: 20px; bottom: 20px; z-index: 30; display: inline-flex; align-items: center; gap: 8px; padding: 14px 20px; border-radius: 99px; background: var(--purple-d); color: #fff; font: 700 14px 'Sora', sans-serif; box-shadow: 0 14px 30px -10px rgba(59,20,104,.6); }
  .drawer { position: fixed; right: 20px; bottom: 84px; z-index: 31; width: min(420px, calc(100vw - 32px)); max-height: 76vh; overflow-y: auto; }

  /* Paneles */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi { padding: 18px; border-radius: 16px; background: #fff; border: 1px solid var(--line); }
  .kpi b { display: block; font: 800 30px 'Sora', sans-serif; color: var(--purple-d); }
  .kpi small { color: var(--dim); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .06em; color: var(--dim); text-transform: uppercase; }
  .ctrl { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .ctrl:last-child { border-bottom: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .seg button { padding: 7px 12px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--purple-d); color: #fff; }
  .answers { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; }
  .answer { padding: 12px 14px; border-radius: 12px; background: var(--card-2); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 11px; border-radius: 99px; font-size: 13px; background: var(--soft); color: var(--purple-d); }
  .tagbtn { padding: 4px 10px; border-radius: 99px; font: 600 11px 'JetBrains Mono', monospace; border: 1px solid var(--line); color: var(--dim); }
  .tagbtn.on { background: var(--purple-d); color: #fff; border-color: var(--purple-d); }
  .sol { padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .sol.on { border-color: var(--purple); box-shadow: 0 0 0 3px var(--soft); }
  .proj { min-height: 100vh; padding: 40px 6vw; color: #fff; background: radial-gradient(ellipse at 85% 0%, rgba(187,248,2,.16), transparent 50%), linear-gradient(160deg, #3B1468, #0F0B16); }
  .proj h1 { font-size: clamp(28px, 4vw, 52px); margin: 16px 0 30px; max-width: 1100px; }
  .proj .eyebrow { background: rgba(255,255,255,.1); color: var(--lime); }
  .proj-x { position: fixed; top: 18px; right: 22px; padding: 8px 14px; border-radius: 99px; background: rgba(255,255,255,.12); font-size: 14px; }
  .proj-viz { grid-template-columns: minmax(280px, 420px) 1fr; }
  .proj .orb { width: min(420px, 80vw); height: min(420px, 80vw); }
  .proj .orb .cnt b { color: #fff; font-size: 64px; }
  .proj .orb .cnt small, .proj .brow, .proj .brow .pct { color: #EDE4FA; font-size: 18px; }
  .proj .brow .track { background: rgba(255,255,255,.12); height: 14px; }
  .proj .chip { background: rgba(187,248,2,.15); color: var(--lime); font-size: 18px; padding: 8px 16px; }
  .proj-answers { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-top: 26px; }
  .proj .answer { background: rgba(255,255,255,.08); color: #fff; font-size: 18px; padding: 18px; }
  /* Calentando motores: mismo modelo que la guía del taller */
  .view > div > .eyebrow:first-child, .view > .eyebrow:first-child { font: 700 13px 'JetBrains Mono', monospace; letter-spacing: .06em; padding: 7px 14px; background: var(--lime); color: var(--ink); }
  .view > div > .eyebrow:first-child::before, .view > .eyebrow:first-child::before { display: none; }
  .view > div > .eyebrow:first-child + h1, .view > .eyebrow:first-child + h1 { font-size: clamp(30px, 4.4vw, 46px); font-weight: 800; }
  .cl-head.solo { grid-template-columns: 1fr; }
  /* Portada y menú con el modelo de la guía */
  .hero.portada { border-radius: 28px; padding: 46px; background: radial-gradient(ellipse at 85% 10%, rgba(123,47,190,.55), transparent 55%), linear-gradient(160deg, #3B1468, #1C0A33); }
  .hero.portada .eyebrow { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: var(--lime); }
  .hero.portada .eyebrow::before { color: #C77DFF; }
  .hero.portada h1 { font-size: clamp(38px, 6vw, 68px); font-weight: 800; margin: 18px 0 14px; line-height: 1.02; }
  .hero.portada h1 .lime { color: var(--lime); }
  .hero .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .hero .btn { padding: 15px 26px; font-size: 16px; }
  .hero .btn.ghost { color: #fff; border-color: rgba(255,255,255,.22); }
  .stats { display: flex; gap: 40px; margin-top: 32px; flex-wrap: wrap; }
  .stats b { display: block; font: 800 34px 'Sora', sans-serif; color: var(--lime); }
  .stats small { color: #C9BBDD; font-size: 14px; }
  .progress-card { display: flex; align-items: center; gap: 18px; margin-top: 18px; }
  .ring { --p: 0; width: 72px; height: 72px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--purple) calc(var(--p) * 1%), var(--line) 0); }
  .ring span { width: 58px; height: 58px; border-radius: 50%; background: #fff; display: grid; place-items: center; font: 700 14px 'JetBrains Mono', monospace; }
  .progress-card .txt { flex: 1; font-size: 18px; }
  .progress-card .txt small { display: block; color: var(--dim); font-size: 14px; }
  .chip-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; border: 1px solid var(--line); color: var(--text); background: #fff; }
  .chip-btn:hover { border-color: var(--purple); }
  .sec-title { display: flex; align-items: center; gap: 14px; margin: 48px 0 18px; }
  .sec-title .ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--soft); font-size: 20px; flex: none; }
  .sec-title h2 { font-size: clamp(24px, 2.8vw, 32px); }
  .sec-title p { color: var(--dim); font-size: 15px; }
  .steps4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .step4 { padding: 22px; border-radius: 18px; background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 24px -18px rgba(59,20,104,.35); }
  .step4 .num { font: 700 12px 'JetBrains Mono', monospace; color: var(--ink); background: var(--lime); padding: 3px 9px; border-radius: 999px; }
  .step4 .big { font-size: 34px; margin: 14px 0 6px; }
  .step4 h3 { font-size: 18px; margin-bottom: 6px; }
  .step4 p { color: var(--dim); font-size: 14px; }
  .path { display: flex; flex-direction: column; gap: 16px; }
  .mod { padding: 22px; border-radius: 20px; background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 24px -18px rgba(59,20,104,.35); }
  .mod-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .mod-head .ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: var(--card-2); border: 1px solid var(--line); flex: none; }
  .mod-head small { font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .1em; color: var(--purple); text-transform: uppercase; }
  .mod-head h3 { font-size: 19px; }
  .mod-head .cnt { margin-left: auto; font: 600 12px 'JetBrains Mono', monospace; color: var(--purple); background: var(--soft); padding: 4px 10px; border-radius: 999px; }
  .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .class-card { display: block; padding: 18px; border-radius: 16px; background: var(--card-2); border: 1px solid var(--line); transition: border-color .2s, transform .2s; }
  .class-card:hover { border-color: var(--purple); transform: translateY(-2px); }
  .class-card.lock { opacity: .6; }
  .class-card .lab { font: 600 11px 'JetBrains Mono', monospace; color: var(--purple); letter-spacing: .08em; }
  .class-card h4 { font: 700 16px 'Sora', sans-serif; margin: 8px 0 4px; }
  .class-card p { color: var(--dim); font-size: 14px; }
  .nav-home { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; font-weight: 600; font-size: 15px; border: 1px solid transparent; color: #fff; }
  .nav-home.on { background: rgba(255,255,255,.1); border-color: var(--lime); }
  .nav-home .ico { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--lime); color: var(--ink); }
  aside .nav-mod { margin-top: 12px; }
  .top-cta { margin-left: auto; }
  @media (max-width: 900px) { .steps4 { grid-template-columns: 1fr 1fr; } .hero.portada { padding: 28px 22px; } .stats { gap: 24px; } }
  .nav-item .nn { font: 700 12px 'JetBrains Mono', monospace; padding: 3px 8px; border-radius: 8px; background: rgba(255,255,255,.1); color: #EDE4FA; }
  .nav-item.on .nn { background: var(--lime); color: var(--ink); }
  .cl-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .cl-tag { font: 700 13px 'JetBrains Mono', monospace; letter-spacing: .06em; padding: 7px 14px; border-radius: 999px; background: var(--lime); color: var(--ink); }
  .cl-tag.soft { background: #fff; border: 1px solid var(--line); color: var(--purple); font-weight: 600; }
  .cl-head { display: grid; grid-template-columns: 1fr 280px; gap: 30px; align-items: center; margin-top: 16px; }
  .cl-head h1 { font-size: clamp(34px, 5vw, 56px); font-weight: 800; margin-bottom: 10px; }
  .cl-head .sub { color: var(--muted); font-size: 17px; }
  .cl-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .cl-chips span { font-size: 14px; color: var(--muted); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; }
  .cl-chips span.on { background: var(--lime); color: var(--ink); border-color: var(--lime); font-weight: 700; }
  .cl-cover { aspect-ratio: 16/10; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; background: radial-gradient(ellipse at 70% 20%, rgba(187,248,2,.2), transparent 60%), linear-gradient(160deg, #3B1468, #1C0A33); }
  .cl-cover .emoji { font-size: 44px; margin-bottom: auto; }
  .cl-cover small { font: 600 11px 'JetBrains Mono', monospace; color: var(--lime); letter-spacing: .1em; }
  .cl-cover b { font: 800 22px 'Sora', sans-serif; line-height: 1.15; }
  .cl-tip { display: flex; gap: 14px; margin-top: 26px; padding: 18px 20px; border-radius: 16px; background: #F7FCE6; border: 1px solid #C8E86B; font-size: 16px; }

<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   PLATAFORMA DE TALLERES · HUB JEFES
   Una sola página con 3 vistas según el rol (alumno · ponente · soporte).
   Los permisos reales viven en Supabase (RLS): esta página solo muestra.
   Modo demo sin Supabase:  index.html?demo=alumno | ponente | soporte
   (los cambios se sincronizan entre pestañas del mismo navegador)
   ===================================================================== */
const CFG = window.TALLER_CONFIG || {};
const qs = new URLSearchParams(location.search);
const DEMO = qs.get('demo') || (!CFG.supabaseUrl ? 'alumno' : '');
/* Modo incrustado: la guía del taller muestra aquí dentro una dinámica (?embed=clave) o el formulario (?embed=prepara) */
const EMBED = qs.get('embed') || '';
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = t => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); };
const hora = d => new Date(d).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
const COLORES = ['#3B1468', '#7B2FBE', '#A65BE8', '#BBF802', '#8FC400', '#5A1F92', '#C9A2F0', '#6B8E00', '#2A0F4A', '#D7B8F5'];
const ETIQUETAS = ['URGENTE', 'PARA PONENTE', 'PREGUNTA FRECUENTE', 'RESUELTA'];
const STOP = new Set('que de la el en y a los las un una mi me lo no se es con por para mas más pero como al del muy ya sus su le o si yo tengo hacer cuando eso esto'.split(' '));

/* =====================================================================
   CAPA DE DATOS
   ===================================================================== */
function crearApiDemo(rol) {
  const KEY = 'taller-demo-v2';
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel('taller-demo') : null;
  const uid = 'u-' + rol;
  const base = () => ({
    taller: { id: 't1', nombre: 'Tu Primer Asesor con IA' },
    perfiles: { 'u-alumno': { nombre: 'Ana (demo)', email: 'ana@demo' }, 'u-luis': { nombre: 'Luis (demo)', email: 'luis@demo' }, 'u-marta': { nombre: 'Marta (demo)', email: 'marta@demo' }, 'u-ponente': { nombre: 'Jany', email: 'jany@demo' }, 'u-soporte': { nombre: 'Soporte', email: 'soporte@demo' } },
    miembros: [{ user_id: 'u-alumno', rol: 'alumno' }, { user_id: 'u-luis', rol: 'alumno' }, { user_id: 'u-marta', rol: 'alumno' }, { user_id: 'u-ponente', rol: 'ponente' }, { user_id: 'u-soporte', rol: 'soporte' }],
    secciones: [
      { id: 's1', clave: 'empieza', titulo: 'Empieza por aquí', orden: 1, estado: 'disponible' },
      { id: 's2', clave: 'calienta', titulo: 'Calentando motores', orden: 2, estado: 'disponible' },
      { id: 's3', clave: 'prepara', titulo: 'Prepara tu negocio', orden: 3, estado: 'disponible' },
      { id: 's4', clave: 'modulo-2', titulo: 'Módulo 2', orden: 4, estado: 'bloqueada' },
      { id: 's5', clave: 'modulo-3', titulo: 'Módulo 3', orden: 5, estado: 'bloqueada' }],
    contenidos: { s1: CONTENIDO_EMPIEZA_DEMO, s2: { intro: 'Cuatro dinámicas rápidas para conocernos. Jany abre cada una durante la presentación: respóndela aquí cuando te lo indique.' }, s3: { intro: 'Esta información la usará El Hubcito para personalizar tu ejercicio práctico. Puedes guardar y continuar después.' } },
    actividades: ACTIVIDADES_DEMO,
    respuestas: [], estado_vivo: { etapa_actual: 'antes' },
    solicitudes: [], mensajes: [],
    notas: [{ id: 'n1', orden: 1, titulo: 'Bienvenida', objetivo: 'Romper el hielo', guion: 'Presentarme y explicar la plataforma.', pregunta: '¿Desde dónde nos ven?', respuestas_esperadas: 'Ciudades', transicion: 'Abrir dinámica de metas', minutos: 5 }],
    archivos: []
  });
  const leer = () => { try { return JSON.parse(localStorage.getItem(KEY)) || base(); } catch (e) { return base(); } };
  let db = leer();
  const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} bc && bc.postMessage('cambio'); };
  let alCambio = () => {};
  bc && (bc.onmessage = () => { db = leer(); alCambio(); });
  window.addEventListener('storage', e => { if (e.key === KEY) { db = leer(); alCambio(); } });
  const id = () => Math.random().toString(36).slice(2, 10);
  const visible = s => rol !== 'alumno' || s.estado !== 'bloqueada';
  return {
    demo: true,
    async sesion() { return { id: uid, email: db.perfiles[uid].email }; },
    async salir() { localStorage.removeItem(KEY); location.search = ''; },
    async cargar() {
      const secs = db.secciones;
      return {
        taller: db.taller, rol, perfil: db.perfiles[uid], user: { id: uid },
        secciones: secs,
        contenidos: Object.fromEntries(secs.filter(visible).map(s => [s.id, db.contenidos[s.id] || {}])),
        actividades: db.actividades.filter(a => rol !== 'alumno' || visible(secs.find(s => s.id === a.seccion_id))).sort((x, y) => x.orden - y.orden),
        misRespuestas: db.respuestas.filter(r => r.user_id === uid),
        estado: db.estado_vivo
      };
    },
    async responder(actividad_id, datos, completada) {
      const a = db.actividades.find(x => x.id === actividad_id);
      const s = db.secciones.find(x => x.id === a.seccion_id);
      if (a.estado !== 'abierta' || s.estado !== 'disponible') throw new Error('La actividad no está abierta');
      let r = db.respuestas.find(x => x.actividad_id === actividad_id && x.user_id === uid);
      if (!r) { r = { id: id(), actividad_id, user_id: uid }; db.respuestas.push(r); }
      Object.assign(r, { datos, completada: !!completada, actualizado_en: new Date().toISOString() });
      guardar();
    },
    async setSeccion(sid, estado) { db.secciones.find(s => s.id === sid).estado = estado; guardar(); },
    async setActividad(aid, estado) { db.actividades.find(a => a.id === aid).estado = estado; guardar(); },
    async setEtapa(etapa_actual, actividad_activa) { db.estado_vivo = { etapa_actual, actividad_activa }; guardar(); },
    async respuestasDe(aid) { return db.respuestas.filter(r => r.actividad_id === aid).map(r => ({ ...r, nombre: db.perfiles[r.user_id]?.nombre })); },
    async miembros() { return db.miembros.map(m => ({ ...m, nombre: db.perfiles[m.user_id]?.nombre, email: db.perfiles[m.user_id]?.email })); },
    async todasRespuestas() { return db.respuestas; },
    async resultados(aid) { const a = db.actividades.find(x => x.id === aid); return agregar(a, db.respuestas.filter(r => r.actividad_id === aid)); },
    async anonimas(aid) {
      const a = db.actividades.find(x => x.id === aid);
      return db.respuestas.filter(r => r.actividad_id === aid && r.datos?.texto && (rol === 'ponente' || a.config.mostrar_grupo || r.destacada))
        .sort((x, y) => (y.destacada ? 1 : 0) - (x.destacada ? 1 : 0)).map(r => r.datos.texto);
    },
    async setConfig(aid, config) { db.actividades.find(a => a.id === aid).config = config; guardar(); },
    async reiniciar(aid) { if (rol !== 'ponente') throw new Error('Solo la ponente'); db.respuestas = db.respuestas.filter(r => r.actividad_id !== aid); guardar(); },
    async destacar(rid, v) { if (rol !== 'ponente') throw new Error('Solo la ponente'); const r = db.respuestas.find(x => x.id === rid); if (r) r.destacada = !!v; guardar(); },
    async notas() { return db.notas; },
    async guardarNota(n) { if (n.id) Object.assign(db.notas.find(x => x.id === n.id), n); else db.notas.push({ ...n, id: id() }); guardar(); },
    async crearSolicitud(tema) { const s = { id: id(), user_id: uid, tema, estado: 'pendiente', etiquetas: [], creado_en: new Date().toISOString() }; db.solicitudes.push(s); guardar(); return s; },
    async solicitudes() {
      const all = db.solicitudes.map(s => ({ ...s, nombre: db.perfiles[s.user_id]?.nombre }));
      if (rol === 'soporte') return all;
      if (rol === 'ponente') return all.filter(s => s.etiquetas.includes('PARA PONENTE')).map(({ id, nombre, tema, estado, etiquetas, resumen_ponente, creado_en }) => ({ id, nombre, tema, estado, etiquetas, resumen_ponente, creado_en }));
      return all.filter(s => s.user_id === uid);
    },
    async actualizarSolicitud(sid, patch) { Object.assign(db.solicitudes.find(s => s.id === sid), patch, { atendida_por: uid }); guardar(); },
    async mensajes(canal, solicitud_id) {
      return db.mensajes.filter(m => m.canal === canal && (canal !== 'ayuda' || m.solicitud_id === solicitud_id))
        .map(m => ({ ...m, nombre: db.perfiles[m.user_id]?.nombre }));
    },
    async enviar(canal, texto, solicitud_id) { db.mensajes.push({ id: id(), canal, texto, solicitud_id: solicitud_id || null, user_id: uid, creado_en: new Date().toISOString() }); guardar(); },
    async subir(file, categoria) {
      const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(file); });
      const a = { path: categoria + '-' + id(), url, categoria }; db.archivos.push(a); guardar(); return a.path;
    },
    async urlArchivo(path) { return db.archivos.find(a => a.path === path)?.url || ''; },
    async borrarArchivo(path) { db.archivos = db.archivos.filter(a => a.path !== path); guardar(); },
    escuchar(cb) { alCambio = cb; },
    presencia(cb) { cb(db.miembros.filter(m => m.rol === 'alumno').length); }
  };
}

function crearApiSupabase() {
  const sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  let T = null, U = null;
  const chk = ({ data, error }) => { if (error) throw error; return data; };
  return {
    demo: false, sb,
    async sesion() { const { data } = await sb.auth.getSession(); U = data.session?.user || null; return U; },
    async entrar(email) {
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
    },
    async salir() { await sb.auth.signOut(); location.reload(); },
    async cargar() {
      T = chk(await sb.from('talleres').select('id,nombre,fecha').eq('slug', CFG.taller).maybeSingle());
      if (!T) return { sinAcceso: true };
      const yo = chk(await sb.from('miembros').select('rol').eq('taller_id', T.id).eq('user_id', U.id).maybeSingle());
      if (!yo) return { sinAcceso: true };
      const perfil = chk(await sb.from('perfiles').select('nombre,email').eq('id', U.id).maybeSingle()) || {};
      const secciones = chk(await sb.from('secciones').select('*').eq('taller_id', T.id).order('orden'));
      const conts = chk(await sb.from('contenidos').select('seccion_id,cuerpo'));
      const actividades = chk(await sb.from('actividades').select('*').eq('taller_id', T.id).order('orden'));
      const misRespuestas = chk(await sb.from('respuestas').select('*').eq('user_id', U.id));
      const estado = chk(await sb.from('estado_vivo').select('*').eq('taller_id', T.id).maybeSingle()) || {};
      return { taller: T, rol: yo.rol, perfil, user: U, secciones, contenidos: Object.fromEntries(conts.map(c => [c.seccion_id, c.cuerpo])), actividades, misRespuestas, estado };
    },
    async responder(actividad_id, datos, completada) {
      chk(await sb.from('respuestas').upsert({ actividad_id, user_id: U.id, datos, completada: !!completada }, { onConflict: 'actividad_id,user_id' }));
    },
    async setSeccion(id, estado) { chk(await sb.from('secciones').update({ estado }).eq('id', id)); },
    async setActividad(id, estado) { chk(await sb.from('actividades').update({ estado }).eq('id', id)); },
    async setEtapa(etapa_actual, actividad_activa) { chk(await sb.from('estado_vivo').upsert({ taller_id: T.id, etapa_actual, actividad_activa: actividad_activa || null, actualizado_en: new Date().toISOString() })); },
    async miembros() {
      const m = chk(await sb.from('miembros').select('user_id,rol').eq('taller_id', T.id));
      const p = chk(await sb.from('perfiles').select('id,nombre,email').in('id', m.map(x => x.user_id)));
      return m.map(x => ({ ...x, ...(p.find(y => y.id === x.user_id) || {}) }));
    },
    async respuestasDe(aid) {
      const r = chk(await sb.from('respuestas').select('*').eq('actividad_id', aid));
      const p = r.length ? chk(await sb.from('perfiles').select('id,nombre').in('id', r.map(x => x.user_id))) : [];
      return r.map(x => ({ ...x, nombre: p.find(y => y.id === x.user_id)?.nombre }));
    },
    async todasRespuestas() {
      const ids = (chk(await sb.from('actividades').select('id').eq('taller_id', T.id))).map(a => a.id);
      return ids.length ? chk(await sb.from('respuestas').select('actividad_id,user_id,completada').in('actividad_id', ids)) : [];
    },
    async resultados(aid) {
      const a = S.actividades.find(x => x.id === aid);
      const rows = chk(await sb.rpc('resultados_actividad', { a: aid })) || [];
      const participantes = chk(await sb.rpc('participantes_actividad', { a: aid })) || 0;
      const cnt = {}; (a?.config?.opciones || []).forEach(o => cnt[o] = 0);
      rows.forEach(r => cnt[r.opcion] = Number(r.votos));
      return { resultados: Object.entries(cnt).map(([opcion, votos]) => ({ opcion, votos })).sort((x, y) => y.votos - x.votos), participantes: Number(participantes) };
    },
    async anonimas(aid) { return (chk(await sb.rpc('respuestas_anonimas', { a: aid })) || []).map(r => r.texto); },
    async setConfig(aid, config) { chk(await sb.from('actividades').update({ config }).eq('id', aid)); },
    async reiniciar(aid) { chk(await sb.rpc('reiniciar_actividad', { a: aid })); },
    async destacar(rid, v) { chk(await sb.rpc('destacar_respuesta', { r: rid, v: !!v })); },
    async notas() { return chk(await sb.from('notas_ponente').select('*').eq('taller_id', T.id).order('orden')); },

    async solicitudes() {

      const p = s.length ? chk(await sb.from('perfiles').select('id,nombre').in('id', [...new Set(s.map(x => x.user_id))])) : [];
      return s.map(x => ({ ...x, nombre: p.find(y => y.id === x.user_id)?.nombre }));
    },

      if (!/^image\/(png|jpeg|webp)$/.test(file.type)) throw new Error('Solo imágenes PNG, JPG o WEBP');

      const path = `${T.id}/${U.id}/${categoria}-${Date.now()}-${limpio}`;
      chk(await sb.storage.from('prework').upload(path, file, { upsert: false }));
      return path;
    },

    async borrarArchivo(path) { chk(await sb.storage.from('prework').remove([path])); },
    escuchar(cb) {
      let t; const deb = () => { clearTimeout(t); t = setTimeout(cb, 250); };

      ['secciones', 'actividades', 'estado_vivo', 'solicitudes', 'mensajes'].forEach(tab =>
        ch.on('postgres_changes', { event: '*', schema: 'public', table: tab, filter: `taller_id=eq.${T.id}` }, deb));

    }
  };
}

/* Progreso del alumno: secciones vistas + actividades respondidas + prework */
function progreso() {
  const metas = CLAVES_DINAMICAS.map(act).filter(Boolean);
  const pw = act('prework');
  let total = 1 + metas.length + 6, hecho = 0;
  if (localStorage.getItem('vio-empieza')) hecho++;
  metas.forEach(a => { if (miResp(a)) hecho++; });
  const d = miResp(pw)?.datos || {};
  'ABCDEF'.split('').forEach(b => { if (d._ok && d._ok[b]) hecho++; });
  return Math.round(hecho / total * 100);
}

/* Visualización: órbita de puntos (un punto por selección, color por opción) */
function orbita(resultados, participantes) {
  const pts = [];
  resultados.forEach((r, i) => { for (let k = 0; k < r.votos; k++) pts.push(COLORES[i % COLORES.length]); });
  const n = pts.length;
  const dots = pts.map((c, k) => {
    const ang = k * 2.39996, rad = 34 + 82 * Math.sqrt((k + .5) / Math.max(n, 1));
    return `<circle cx="${130 + rad * Math.cos(ang)}" cy="${130 + rad * Math.sin(ang)}" r="${n > 120 ? 4 : 6}" fill="${c}"><animate attributeName="r" from="0" to="${n > 120 ? 4 : 6}" dur=".5s" fill="freeze"/></circle>`;
  }).join('');
  return `<div class="orb"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="124" fill="none" stroke="#E6DDF2" stroke-dasharray="3 6"/>${dots}</svg>
    <div class="cnt"><div><b>${participantes}</b><small>participantes</small></div></div></div>`;
}
function barras(resultados, participantes, top) {
  const max = Math.max(1, participantes);
  const esTop = (r, i) => top && i < top && r.votos > 0;
  return `<div class="bars">${resultados.map((r, i) => `
    <div class="brow ${esTop(r, i) ? 'top' : ''}"><span>${esc(r.opcion)}${esTop(r, i) ? '<em class="top-badge">TOP ' + (i + 1) + '</em>' : ''}</span><span class="pct">${r.votos} · ${Math.round(r.votos / max * 100)}%</span>
    <div class="track"><i style="width:${Math.round(r.votos / max * 100)}%;background:${COLORES[i % COLORES.length]}"></i></div></div>`).join('') || '<p class="muted">Aún no hay respuestas.</p>'}</div>`;
}
function agregar(actividad, respuestas) {
  const cnt = {};
  (actividad.config.opciones || []).forEach(o => cnt[o] = 0);
  const users = new Set();
  respuestas.forEach(r => {
    users.add(r.user_id);
    (r.datos?.opciones || []).forEach(o => cnt[o] = (cnt[o] || 0) + 1);
  });
  return { resultados: Object.entries(cnt).map(([opcion, votos]) => ({ opcion, votos })).sort((a, b) => b.votos - a.votos), participantes: users.size };
}
function temasFrecuentes(textos) {
  const c = {};
  textos.join(' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[^a-zñ]+/).forEach(w => { if (w.length > 3 && !STOP.has(w)) c[w] = (c[w] || 0) + 1; });
  return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 12);
}

function leerBloque(k, D) {

async function montarArchivos(D, a, soloLectura) {
  D.E = D.E || {};
  const pintar = async cat => {
    const cont = document.querySelector(`[data-thumbs="${cat}"]`);
    const paths = D.E[cat] || [];
    cont.innerHTML = paths.length ? '' : '<span class="small muted">Sin archivos</span>';
    for (const p of paths) {
      const url = await api.urlArchivo(p);
      const f = document.createElement('figure');
      f.innerHTML = `<img src="${esc(url)}" alt="">${soloLectura ? '' : '<button title="Quitar">✕</button>'}`;
      if (!soloLectura) f.querySelector('button').onclick = async () => { try { await api.borrarArchivo(p); } catch (e) {} D.E[cat] = D.E[cat].filter(x => x !== p); await api.responder(a.id, D, 'ABCDEF'.split('').every(x => D._ok[x])); pintar(cat); };
      cont.appendChild(f);
    }
  };
  MATERIALES.forEach(([cat]) => pintar(cat));
  document.querySelectorAll('input[type=file]').forEach(inp => inp.onchange = async () => {
    const cat = inp.dataset.cat, max = +inp.dataset.max;
    const files = [...inp.files];
    if ((D.E[cat] || []).length + files.length > max) { toast(`Máximo ${max} en esta categoría`); inp.value = ''; return; }
    for (const f of files) {
      try { const p = await api.subir(f, cat); D.E[cat] = (D.E[cat] || []).concat(p); }
      catch (err) { toast(err.message); }
    }
    inp.value = '';
    try { await api.responder(a.id, D, 'ABCDEF'.split('').every(x => D._ok[x])); } catch (e) {}
    pintar(cat); toast('Archivos guardados');
  });
}

        const g = agregar(a, rs);
        const otros = rs.map(r => r.datos?.otro).filter(Boolean);
        html += `${vizHtml(a, g)}${otros.length ? `<p class="small muted" style="margin-top:14px"><b>Otros:</b> ${otros.map(esc).join(' · ')}</p>` : ''}`;
      } else {
        const textos = rs.map(r => r.datos?.texto || '').filter(Boolean);
        html += `<b class="small">Temas más repetidos</b><div class="chips" style="margin:8px 0 14px">${temasFrecuentes(textos).map(([w, n]) => `<span class="chip">${esc(w)} · ${n}</span>`).join('') || '<span class="small muted">—</span>'}</div>
          <label class="row small"><input type="checkbox" id="anon" checked> Mostrar sin nombres (para proyectar)</label>
          <div class="answers" id="answers" style="margin-top:10px">${rs.map(r => `<div class="answer"><small class="muted" data-nombre>${esc(r.nombre || 'Participante')} · </small>${esc(r.datos?.texto || '')}</div>`).join('') || '<p class="muted">Sin respuestas.</p>'}</div>`;
      }
      html += `</div>`;
    }
    pv.innerHTML = html;
    pv.querySelectorAll('[data-mostrar]').forEach(b => b.onclick = async () => {
      const a = S.actividades.find(x => x.id === b.dataset.mostrar);
      try { await api.setConfig(a.id, { ...a.config, mostrar_grupo: !a.config.mostrar_grupo }); toast(a.config.mostrar_grupo ? 'Oculto para el grupo' : 'Ahora el grupo lo ve (sin nombres)'); await recargar(); } catch (err) { toast(err.message); }
    });
    const anon = $('#anon'); if (anon) { const t = () => document.querySelectorAll('[data-nombre]').forEach(e => e.classList.toggle('hidden', anon.checked)); anon.onchange = t; t(); }
  } else if (ruta === 'participacion') {
    const [miembros, resp] = await Promise.all([api.miembros(), api.todasRespuestas()]);
    const alumnos = miembros.filter(m => m.rol === 'alumno');
    const sol = await api.solicitudes();
    pv.innerHTML = `<span class="eyebrow">Participación</span><h1 style="margin:12px 0 18px">Participación</h1>
      <div class="kpis"><div class="kpi"><b>${alumnos.length}</b><small>inscritos</small></div><div class="kpi"><b>${new Set(resp.map(r => r.user_id)).size}</b><small>respondieron algo</small></div>
      <div class="kpi"><b>${resp.filter(r => r.completada).length}</b><small>actividades completadas</small></div><div class="kpi"><b>${sol.length}</b><small>casos PARA PONENTE</small></div></div>
      <div class="card" style="margin-top:16px"><table><tr><th>Participante</th>${S.actividades.map(a => `<th>${esc(a.clave)}</th>`).join('')}</tr>
      ${alumnos.map(m => `<tr><td>${esc(m.nombre || m.email || '—')}</td>${S.actividades.map(a => { const r = resp.find(x => x.user_id === m.user_id && x.actividad_id === a.id); return `<td>${r ? (r.completada ? '✅' : '🟡') : '·'}</td>`; }).join('')}</tr>`).join('') || `<tr><td colspan="9" class="muted">Sin participantes todavía.</td></tr>`}</table></div>`;
  } else if (ruta === 'notas') {
    const notas = await api.notas();
    const campo = (n, k, l, area) => `<div class="field"><label class="f">${l}</label>${area ? `<textarea data-k="${k}">${esc(n[k] || '')}</textarea>` : `<input type="text" data-k="${k}" value="${esc(n[k] || '')}">`}</div>`;
    pv.innerHTML = `<span class="eyebrow">Solo tú las ves</span><h1 style="margin:12px 0 18px">Notas de ponente</h1><div class="stack" id="notas">${[...notas, { orden: notas.length + 1, titulo: '' }].map(n => `
      <form class="card" data-id="${esc(n.id || '')}"><div class="grid2">${campo(n, 'titulo', 'Diapositiva / etapa')}${campo(n, 'minutos', 'Tiempo estimado (min)')}</div>
      ${campo(n, 'objetivo', 'Objetivo de la explicación', 1)}${campo(n, 'guion', 'Guion', 1)}<div class="grid2">${campo(n, 'pregunta', 'Pregunta al público', 1)}${campo(n, 'respuestas_esperadas', 'Respuestas esperadas', 1)}</div>${campo(n, 'transicion', 'Transición a la siguiente actividad', 1)}
      <button class="btn sm">${n.id ? 'Guardar' : '+ Agregar nota'}</button></form>`).join('')}</div>`;
    pv.querySelectorAll('form').forEach(f => f.onsubmit = async e => {
      e.preventDefault(); const n = { orden: 0 }; if (f.dataset.id) n.id = f.dataset.id;
      f.querySelectorAll('[data-k]').forEach(i => n[i.dataset.k] = i.dataset.k === 'minutos' ? (parseInt(i.value) || null) : i.value.trim());
      if (!n.titulo) return toast('Ponle un título');
      try { await api.guardarNota(n); toast('Nota guardada'); render(); } catch (err) { toast(err.message); }
    });
  } else if (ruta === 'coordinacion') {
    const sol = await api.solicitudes();
    pv.innerHTML = `<span class="eyebrow">Soporte</span><h1 style="margin:12px 0 18px">Casos para ti</h1>
      <div class="stack">${sol.map(s => `<div class="card"><div class="row space"><b>${esc(s.nombre || 'Participante')}</b><span class="small muted">${hora(s.creado_en)}</span></div>
        <p style="margin:8px 0">${esc(s.resumen_ponente || 'Soporte aún no escribe el resumen.')}</p><div class="chips">${s.etiquetas.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div>`).join('') || '<div class="card muted">Nada pendiente. Soporte te avisará aquí.</div>'}</div>
      <div class="sec-h"><span class="n">🤝</span><h2>Chat con soporte</h2></div><div id="coord"></div>`;
    montarChat('#coord', 'coordinacion');
  } else if (ruta === 'chat') { pv.innerHTML = `<span class="eyebrow">Grupo</span><h1 style="margin:12px 0 16px">Chat del grupo</h1><div id="cg"></div>`; montarChat('#cg', 'grupal'); }
}

/* ---------------- SOPORTE ---------------- */
async function vistaSoporte() {
  const ruta = UI.ruta || 'solicitudes';
  const nav = `<div class="nav-mod">Panel de soporte</div>
    <a href="#solicitudes" class="nav-item ${ruta === 'solicitudes' ? 'on' : ''}">🛟 Solicitudes</a>
    <a href="#coordinacion" class="nav-item ${ruta === 'coordinacion' ? 'on' : ''}">🤝 Coordinación con Jany</a>
    <a href="#chat" class="nav-item ${ruta === 'chat' ? 'on' : ''}">💬 Chat del grupo</a>`;
  $('#root').innerHTML = marco(nav, `<div id="sv">Cargando…</div>`, `<b>Panel de soporte</b>`);
  const sv = $('#sv');
  if (ruta === 'solicitudes') {
    const sol = await api.solicitudes();
    const pend = sol.filter(s => s.estado !== 'resuelta');
    if (!UI.solicitudSel && pend[0]) UI.solicitudSel = pend[0].id;
    const sel = sol.find(s => s.id === UI.solicitudSel);
    const pillE = e => `<span class="pill ${e === 'pendiente' ? 'bad' : e === 'atendiendo' ? 'warn' : 'on'}">${e.toUpperCase()}</span>`;
    sv.innerHTML = `<span class="eyebrow">Soporte</span><h1 style="margin:12px 0 18px">Solicitudes <span class="muted" style="font-size:18px">(${pend.length} abiertas)</span></h1>
      <div class="grid2" style="grid-template-columns:340px 1fr;align-items:start">
        <div class="stack" style="gap:10px">${sol.map(s => `<div class="sol ${s.id === UI.solicitudSel ? 'on' : ''}" data-s="${s.id}"><div class="row space"><b>${esc(s.nombre || 'Participante')}</b>${pillE(s.estado)}</div>
          <p class="small muted" style="margin-top:4px">${hora(s.creado_en)} · ${esc((s.tema || '').slice(0, 70))}</p>${s.etiquetas.length ? `<div class="chips" style="margin-top:6px">${s.etiquetas.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}</div>`).join('') || '<div class="card muted">Sin solicitudes por ahora.</div>'}</div>
        <div>${sel ? `<div class="card"><div class="row space"><h2 style="font-size:19px">${esc(sel.nombre || 'Participante')}</h2>
            <div class="seg" id="segE">${['pendiente', 'atendiendo', 'resuelta'].map(e => `<button data-e="${e}" class="${sel.estado === e ? 'on' : ''}">${e}</button>`).join('')}</div></div>
          <div class="row" style="margin:12px 0">${ETIQUETAS.map(t => `<button class="tagbtn ${sel.etiquetas.includes(t) ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
          ${sel.etiquetas.includes('PARA PONENTE') ? `<div class="field"><label class="f">Resumen para Jany (es lo único que ella ve)</label><textarea id="resumen" maxlength="600">${esc(sel.resumen_ponente || '')}</textarea><button class="btn sm" id="bRes" style="margin-top:8px">Enviar resumen a Jany</button></div>` : ''}
          <div id="chatPriv"></div></div>` : '<div class="card muted">Elige una solicitud.</div>'}</div></div>`;
    sv.querySelectorAll('[data-s]').forEach(d => d.onclick = () => { UI.solicitudSel = d.dataset.s; render(); });
    if (sel) {
      sv.querySelectorAll('#segE button').forEach(b => b.onclick = async () => {
        const et = b.dataset.e === 'resuelta' ? [...new Set([...sel.etiquetas, 'RESUELTA'])] : sel.etiquetas.filter(t => t !== 'RESUELTA');
        try { await api.actualizarSolicitud(sel.id, { estado: b.dataset.e, etiquetas: et }); render(); } catch (err) { toast(err.message); }
      });
      sv.querySelectorAll('[data-t]').forEach(b => b.onclick = async () => {
        const t = b.dataset.t, et = sel.etiquetas.includes(t) ? sel.etiquetas.filter(x => x !== t) : [...sel.etiquetas, t];
        try { await api.actualizarSolicitud(sel.id, { etiquetas: et, ...(t === 'RESUELTA' && !sel.etiquetas.includes(t) ? { estado: 'resuelta' } : {}) }); render(); } catch (err) { toast(err.message); }
      });
      const bRes = $('#bRes'); if (bRes) bRes.onclick = async () => { try { await api.actualizarSolicitud(sel.id, { resumen_ponente: $('#resumen').value.trim() }); toast('Resumen enviado a Jany'); } catch (err) { toast(err.message); } };
      montarChat('#chatPriv', 'ayuda', sel.id, 340);
    }
  } else if (ruta === 'coordinacion') { sv.innerHTML = `<span class="eyebrow">Equipo</span><h1 style="margin:12px 0 16px">Coordinación con Jany</h1><div id="co"></div>`; montarChat('#co', 'coordinacion'); }
  else { sv.innerHTML = `<span class="eyebrow">Grupo</span><h1 style="margin:12px 0 16px">Chat del grupo</h1><div id="cg"></div>`; montarChat('#cg', 'grupal'); }
}

/* =====================================================================
   ARRANQUE Y RUTEO
   ===================================================================== */
/* ---------------- INCRUSTADO EN LA GUÍA ---------------- */
function vistaEmbed() {
  document.body.classList.add('embed');
  const root = $('#root');
  if (EMBED === 'prepara') {
    const s = sec('prepara'), a = act('prework');
    if (!s || s.estado === 'bloqueada' || !a) root.innerHTML = `<div class="card din-espera">🔒 Se habilitará pronto.</div>`;
    else { root.innerHTML = `${a.estado === 'finalizada' ? `<div class="ok-msg">🔒 Jany cerró la preparación. Puedes consultar tus respuestas, ya no editarlas.</div>` : ''}<div class="steps" id="steps"></div><div class="card" id="bloque"></div>`; montarPrepara(); }
  } else {
    const a = act(EMBED);
    if (a) { root.innerHTML = '<ol class="din-list" id="dinamicas"></ol>'; pintarDinamica(a, '', $('#dinamicas')); }
    else root.innerHTML = `<div class="card din-espera">⏳ Esta dinámica se abrirá cuando Jany lo indique durante la presentación.</div>`;
  }
  avisarAltura();
}
function avisarAltura() {
  if (window.parent === window) return;
  const h = Math.ceil(document.getElementById('root').getBoundingClientRect().height) + 8;
  window.parent.postMessage({ taller: 'altura', din: EMBED, h }, '*');
}
if (EMBED && 'ResizeObserver' in window) new ResizeObserver(() => avisarAltura()).observe(document.getElementById('root'));

async function recargar() { const d = await api.cargar(); if (!d.sinAcceso) S = d; render(); }
function render() {
  UI.ruta = decodeURIComponent(location.hash.slice(1));
  if (EMBED && S.rol === 'alumno') return vistaEmbed();
  if (S.rol === 'ponente') vistaPonente();
  else if (S.rol === 'soporte') vistaSoporte();
  else vistaAlumno();
  const bs = $('#bSalir'); if (bs) bs.onclick = () => api.salir();
  const bm = $('#bMenu'); if (bm) bm.onclick = () => document.body.classList.toggle('menu');
}
window.addEventListener('hashchange', () => { document.body.classList.remove('menu'); UI.paso = UI.ruta === 'prepara' ? UI.paso : 0; render(); window.scrollTo(0, 0); });
document.addEventListener('click', e => { if (document.body.classList.contains('menu') && !e.target.closest('aside') && !e.target.closest('#bMenu')) document.body.classList.remove('menu'); });

(async function iniciar() {
  try {
    if (!api.demo) {
      const u = await api.sesion();
      if (!u) return pantallaLogin();
      api.sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.reload(); });
    }
    const d = await api.cargar();
    if (d.sinAcceso) return pantallaSinAcceso();
    S = d;
    render();
    api.escuchar(() => recargar());
  } catch (err) {
    $('#root').innerHTML = `<div class="login"><div class="card"><h2>No se pudo cargar</h2><p class="muted">${esc(err.message)}</p></div></div>`;
  }
})();
</script>
