<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brigada Impulso Mujer</title>
  <meta name="description" content="Regístrate a las actividades de la Brigada de Red Impulso Mujer MX." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <span class="brand" data-bind="marca"></span>
      <a class="btn btn--small" href="#registro">Regístrate</a>
    </div>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero">
      <div class="wrap">
        <p class="eyebrow">Evento gratuito · Cupo limitado</p>
        <h1 data-bind="nombre"></h1>
        <p class="hero__lema" data-bind="lema"></p>
        <ul class="hero__datos">
          <li><strong>Fecha</strong><span data-bind="fecha"></span></li>
          <li><strong>Horario</strong><span data-bind="horario"></span></li>
          <li><strong>Lugar</strong><span data-bind="lugar"></span></li>
        </ul>
        <a class="btn" href="#registro">Quiero registrarme</a>
      </div>
    </section>

    <!-- SOBRE EL EVENTO -->
    <section class="section" id="evento">
      <div class="wrap wrap--narrow">
        <h2>Sobre la brigada</h2>
        <p data-bind="descripcion"></p>
      </div>
    </section>

    <!-- ACTIVIDADES / AGENDA -->
    <section class="section section--alt" id="actividades">
      <div class="wrap">
        <h2>Agenda de actividades</h2>
        <div class="cards" id="lista-actividades"></div>
      </div>
    </section>

    <!-- REGISTRO -->
    <section class="section" id="registro">
      <div class="wrap wrap--narrow">
        <h2>Regístrate</h2>
        <p class="muted">Elige las actividades a las que quieres asistir.</p>

        <form id="form-registro" class="form" novalidate>
          <label>Nombre completo
            <input name="nombre" required autocomplete="name" />
          </label>
          <div class="form__row">
            <label>Teléfono / WhatsApp
              <input name="telefono" type="tel" required autocomplete="tel" />
            </label>
            <label>Correo electrónico
              <input name="email" type="email" autocomplete="email" />
            </label>
          </div>
          <div class="form__row">
            <label>Edad
              <input name="edad" type="number" min="0" max="120" />
            </label>
            <label>Municipio / Colonia
              <input name="ubicacion" />
            </label>
          </div>

          <fieldset>
            <legend>Actividades</legend>
            <div id="opciones-actividades" class="checks"></div>
          </fieldset>

          <label class="check">
            <input type="checkbox" name="aviso" required />
            <span>Acepto que mis datos se usen para organizar este evento.</span>
          </label>

          <button class="btn btn--block" type="submit">Enviar registro</button>
          <p class="form__msg" id="form-msg" role="status"></p>
        </form>
      </div>
    </section>

    <!-- PREGUNTAS -->
    <section class="section section--alt" id="faq">
      <div class="wrap wrap--narrow">
        <h2>Preguntas frecuentes</h2>
        <div id="lista-faq"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p><strong data-bind="marca"></strong></p>
      <p id="contacto" class="footer__links"></p>
      <p class="muted small"><span data-bind="lugar"></span> · <span data-bind="direccion"></span></p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
