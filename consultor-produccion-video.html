<!DOCTYPE html>
<html lang="es">
<head>
<script src="/js/hub-tenant.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jefe Productor IA — JefesHub</title>
<link rel="icon" type="image/png" href="/img/fav/jefe-produccion-video.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Piel clara = mismos tokens que Jefe 366, Jefe de Contenido y Jefe de Anuncios */
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F3F3F3;
    --line:#E2E2E2;
    --text:#1A1A1A;
    --text-dim:#5F5F5F;
    --accent:#C0F800;
    --accent-soft:#F1FFC2;
    --accent-text:#4E7A00;
    --navy:#10103A;
    --shadow-card:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06);
    --shadow-pop:0 12px 32px rgba(0,0,0,.14);
    --adq:#6366F1;--adq-soft:#EEF0FF;
    --con:#0EA5E9;--con-soft:#E6F4FD;
    --conv:#16A34A;--conv-soft:#E6F8EC;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;padding:28px 16px 80px;}
  h1,h2,.display{font-family:'Sora',sans-serif;}
  .wrap{max-width:1400px;margin:0 auto;}
  .page-header{text-align:center;padding-top:62px;}
  h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin:0 0 8px;line-height:1.15;}
  /* Barra fija: se queda visible arriba al hacer scroll (pill + nombre del Jefe) */
  .topbar{position:fixed;top:0;left:0;right:0;height:70px;z-index:60;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);}
  .topbar h1{justify-self:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:clamp(20px,2.6vw,28px);}
  .back-link{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;color:var(--text-dim);text-decoration:none;padding:7px 16px;border:1px solid var(--line);border-radius:100px;background:var(--surface);transition:.15s;}
  .back-link:hover{border-color:var(--accent);color:var(--accent-text);}
  /* Scrollbar delgada y discreta */
  *{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.22) transparent;}
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:8px;}
  *::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.36);}

  /* HERO: logo lima + buscador */
  .hero-logo{display:block;margin:0 auto 14px;}
  .hero-logo img{width:150px;height:auto;max-width:60%;object-fit:contain;display:block;margin:0 auto;}

  /* BOTONES */
  .btn-outline{font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;padding:10px 16px;border-radius:12px;cursor:pointer;border:1px solid #CFCFCF;background:var(--surface);color:#333;transition:.15s;}
  .btn-outline:hover{border-color:var(--accent-text);color:var(--accent-text);}
  .link-btn{background:none;border:none;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:underline;padding:2px 4px;}
  .link-btn:hover{color:var(--accent-text);}
  .mode-status{font-size:14.5px;font-family:'Inter',sans-serif;color:var(--text-dim);}
  .mode-status.error{color:#C62828;}

  /* BUSCADOR GRANDE del Jefe (mismo formato que Contenido y Anuncios) */
  .chat-hero{display:flex;flex-direction:column;align-items:stretch;margin:0 auto 24px;max-width:900px;}
  .hero-search{display:flex;align-items:center;gap:12px;width:100%;margin:0 auto 10px;padding:8px 10px 8px 18px;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:34px;box-shadow:0 8px 30px rgba(0,0,0,.10);transition:border-color .18s,box-shadow .18s;text-align:left;}
  .hero-search:focus-within{border-color:var(--accent);box-shadow:0 8px 30px rgba(0,0,0,.10),0 0 0 4px rgba(192,248,0,.28);}
  .hero-lupa{flex:0 0 auto;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .hero-lupa svg{width:23px;height:23px;}
  .hero-search-sep{flex:0 0 1px;align-self:stretch;margin:12px 0;background:var(--line);}
  .hero-search textarea{flex:1 1 auto;min-width:0;background:transparent;border:none;outline:none;resize:none;color:var(--text);font-family:'Inter',sans-serif;font-size:17.5px;line-height:1.45;padding:11px 0;max-height:260px;}
  .hero-search textarea::placeholder{color:var(--text-dim);opacity:.85;}
  .hero-search-send{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#1A1A1A;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
  .hero-search-send img{width:30px;height:auto;max-height:28px;object-fit:contain;display:block;}
  .hero-search-send:hover{transform:scale(1.08);}
  .hero-search-send:disabled{opacity:.5;cursor:wait;}
  .hero-meta{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;min-height:22px;margin-bottom:6px;}

  /* Interruptor Guía / Crear imagen (dentro del mismo buscador) */
  .modo-switch{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;}
  .modo-pill{padding:9px 20px;border-radius:100px;border:none;font-family:'Sora',sans-serif;font-weight:800;font-size:14px;cursor:pointer;background:var(--surface-2);color:#333;transition:.15s;}
  .modo-pill:hover{background:#E8E8E8;}
  .modo-pill.on{background:var(--accent);color:#1A1A1A;}

  /* Atajos (pastillas bajo el buscador) */
  .sugerencias{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:2px 0 8px;}
  .sugerencia{border:1px solid #CFCFCF;background:var(--surface);color:#333;border-radius:100px;padding:8px 16px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:.15s;}
  .sugerencia:hover{border-color:var(--accent-text);color:var(--accent-text);background:var(--accent-soft);}

  /* CHAT -- hilo de conversación (mismas clases que Contenido/Anuncios) */
  .chat-thread{display:flex;flex-direction:column;gap:12px;max-height:520px;overflow-y:auto;margin-top:6px;}
  .chat-thread:empty{display:none;}
  .chat-msg{border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.65;white-space:pre-wrap;font-family:'Inter',sans-serif;max-width:92%;}
  .chat-msg-user{background:var(--accent-soft);border:1px solid #CDE98A;color:var(--text);align-self:flex-end;}
  .chat-msg-assistant{background:var(--surface-2);border:1px solid var(--line);color:var(--text);align-self:flex-start;}

  /* GALERÍA de imágenes generadas */
  .imggen-result{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:10px;}
  .imggen-result:empty{display:none;}
  .imggen-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;width:min(300px,100%);box-shadow:var(--shadow-card);}
  .imggen-card img{width:100%;border-radius:12px;display:block;}
  .imggen-prompt{margin:0;font-size:13.5px;color:var(--text-dim);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
  .imggen-download{align-self:flex-start;font-family:'Sora',sans-serif;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:#1A1A1A;text-decoration:none;background:var(--accent);border-radius:100px;padding:8px 18px;}
  .imggen-download:hover{filter:brightness(.95);}
  .imggen-spinner{width:min(300px,100%);min-height:120px;border:1px dashed #C9C9C9;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:15px;background:var(--surface);}

  /* CAJAS DE CONTENIDO (calcado de etapa-box / item-card de Jefe de Anuncios) */
  .etapa-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-card);}
  .etapa-box.guion{border-left:5px solid var(--adq);}
  .etapa-box.grabacion{border-left:5px solid var(--con);}
  .etapa-box.edicion{border-left:5px solid var(--accent);}
  .etapa-title{font-family:'Sora',sans-serif;font-weight:800;font-size:21px;margin:0 0 6px;}
  .etapa-desc{color:var(--text-dim);font-size:15px;margin:0 0 14px;line-height:1.5;}
  .check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:6px 18px;margin-top:10px;}
  .check-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-size:16px;cursor:pointer;user-select:none;transition:background .12s;}
  .check-item:hover{background:var(--surface-2);}
  .check-item input{width:22px;height:22px;flex-shrink:0;accent-color:#4E7A00;cursor:pointer;margin:0;}
  .check-item input:checked + span{color:var(--text-dim);text-decoration:line-through;}
  .dur-panel{background:var(--accent);border-radius:28px;padding:20px 26px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow-card);color:#1A1A1A;}
  .dur-pill-white{background:#fff;color:#1A1A1A;font-family:'Sora',sans-serif;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.02em;padding:10px 22px;border-radius:100px;}
  .dur-pill-dark{background:#4B4B4B;color:var(--accent);font-family:'Sora',sans-serif;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.02em;padding:9px 20px;border-radius:100px;}

  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:18px;align-items:start;}
  .item-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--horizon,var(--adq));border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-card);}
  .item-title{font-family:'Sora',sans-serif;font-weight:800;font-size:18px;line-height:1.3;margin:0;}
  .res-dato{display:flex;flex-direction:column;gap:2px;}
  .res-dato span{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#3C5E00;}
  .res-dato p{margin:0;font-size:15.5px;line-height:1.5;}
  .seccion-intro{color:var(--text-dim);font-size:16px;margin:0 0 18px;}
  /* Módulos siempre abiertos, uno debajo del otro */
  .seccion{margin:0 0 44px;}
  .seccion-h{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(22px,3vw,28px);margin:0 0 18px;}

  /* APPS PARA EDITAR */
  .app-head{display:flex;align-items:center;gap:12px;}
  .app-nombre{font-family:'Sora',sans-serif;font-weight:800;font-size:18px;}
  .app-logo{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:14px;color:#fff;letter-spacing:-0.02em;}
  .app-logo-capcut{background:linear-gradient(#0F0F10,#0F0F10) padding-box,linear-gradient(135deg,#00F6FF 0%,#FF3B7F 50%,#FFD23F 100%) border-box;border:2px solid transparent;}
  .app-logo-edits{background:linear-gradient(135deg,#FEDA75 0%,#FA7E1E 25%,#D62976 50%,#962FBF 75%,#4F5BD5 100%);}
  .app-logo-canva{background:linear-gradient(135deg,#00C4CC 0%,#7D2AE8 100%);}
  .app-logo-gemini{background:linear-gradient(135deg,#4285F4 0%,#9B72CB 50%,#D96570 100%);font-size:18px;}
  .app-logo-chatgpt{background:#10A37F;}
  .app-logo-elevenlabs{background:#111;letter-spacing:.02em;}
  .app-logo-higgsfield{background:linear-gradient(135deg,#10103A 0%,#6366F1 100%);}
  .app-desc{margin:-4px 0 0;font-size:14.5px;color:var(--text-dim);line-height:1.4;}
  /* "Apps para editar con IA": mismo texto que el titulo "Apps para editar" (sin pastilla gris) */
  .apps-titulo{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(22px,3vw,28px);line-height:1.2;color:var(--text);margin:6px 0 18px;}
  .apps-titulo:not(:first-child){margin-top:30px;}
  .app-links{display:flex;gap:8px;flex-wrap:wrap;}
  .app-links a{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;padding:8px 16px;border-radius:100px;border:1px solid #CFCFCF;background:var(--surface);color:#333;text-decoration:none;transition:.15s;}
  .app-links a:hover{border-color:var(--accent-text);color:var(--accent-text);background:var(--accent-soft);}

  @media (max-width:720px){
    .hero-search textarea{font-size:16px;}
    .modo-pill{padding:8px 16px;font-size:13px;}
  }
</style>
<link rel="stylesheet" href="/css/plataforma-dash.css">

<body>
<div class="topbar">
  <a id="back-hub" href="/" class="back-link">&lt;&lt; Hub de Jefes <span style="opacity:.4;">//</span> <span id="brand-marca-label">—</span></a>
  <h1>Jefe Productor IA</h1>
</div>
<div class="wrap" id="wrap">
  <script>(function(){var b=window.__hub.slug!=='jefeshub'?'/'+window.__hub.slug:null;if(b)document.getElementById('back-hub').href=b;})();</script>
  <script src="/js/storage-client.js"></script>
  <script>(async function(){
    var BRANDS=window.__hub.marcas({'rancho-seco':{fallback:'Rancho Seco',color:'#F2C230'},'rim':{fallback:'RIM',color:'#F472B6'},'optica-one':{fallback:'Óptica One',color:'#38BDF8'},'jefeshub':{fallback:'JefesHub',color:'#B8F725'}});
    var key=window.__hub.slug;
    var b=BRANDS[key];var el=document.getElementById('brand-marca-label');
    el.textContent=b.fallback;
    var bar=document.getElementById('back-hub');
    bar.style.color='#1A1A1A';bar.style.borderColor=b.color;
    try{var r=await window.storage.get(key+':brand-book.identidad');if(r&&r.value){var d=JSON.parse(r.value);if(d.nombre)el.textContent=d.nombre;}}catch(e){}
  })();</script>

  <div class="page-header">
    <span class="hero-logo"><img src="/img/jefe-produccion-video-logo-lima.webp" alt="Jefe Productor IA" width="150" height="144"></span>
  </div>

  <!-- Buscador del Jefe: un solo cuadro para la guía (chat) y para crear imágenes -->
  <div class="chat-hero">
    <div class="hero-search">
      <span class="hero-lupa" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </span>
      <span class="hero-search-sep"></span>
      <textarea id="chat-input" rows="1" placeholder=""></textarea>
      <button class="hero-search-send" id="chat-send-btn" type="button" aria-label="Enviar" title="Enviar">
        <img src="/img/jefe-produccion-video-logo-negro.webp" alt="" aria-hidden="true">
      </button>
    </div>
    <div class="modo-switch" role="group" aria-label="¿Qué quieres hacer?">
      <button class="modo-pill on" type="button" data-modo="guia">💬 Guía</button>
      <button class="modo-pill" type="button" data-modo="imagen">🖼️ Crear imagen</button>
    </div>
    <div class="hero-meta">
      <span class="mode-status" id="chat-status"></span>
      <button class="link-btn" id="chat-reset-btn" type="button" style="display:none;">Nueva conversación</button>
    </div>
    <div class="sugerencias" id="sugerencias"></div>
    <div id="chat-thread" class="chat-thread"></div>
    <div id="imggen-result" class="imggen-result"></div>
  </div>

  <div id="content"></div>
</div>

<script>
// ─── CLIENTE ID (detectado por pathname — Vercel no expone ?cliente= al browser) ───
function detectClienteId(){ return window.__hub.slug; }
const CLIENTE_ID = detectClienteId();
const CONVERSACION_KEY = CLIENTE_ID + ':jefe-diseno-conversacion';
const API = '/api/consultor-financiero';

function escHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
const $ = (id) => document.getElementById(id);
const esMovil = () => window.innerWidth < 720;

// ─── CONTENIDO DE REFERENCIA (pestañas) ────────────────────────────────────
const CHECK_GUION = ['Hook claro', 'Mensaje principal claro', 'CTA definido'];
const CHECK_GRABACION = ['Cámara limpia', 'Luz de frente', 'Fondo ordenado', 'Sonido claro', 'Teléfono en vertical'];

const APPS = [
  { nombre: 'CapCut', logo: 'capcut', txt: 'CC', links: [
    ['App Store', 'https://apps.apple.com/us/app/capcut-photo-video-editor/id1500855883'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.lemon.lvoverseas'],
    ['Web', 'https://www.capcut.com/'] ] },
  { nombre: 'Edits (Instagram)', logo: 'edits', txt: 'Ed', links: [
    ['App Store', 'https://apps.apple.com/us/app/edits-an-instagram-app/id6738967378'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.instagram.basel'] ] },
  { nombre: 'Canva', logo: 'canva', txt: 'C', links: [
    ['App Store', 'https://apps.apple.com/us/app/canva-ai-photo-video-editor/id897446215'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.canva.editor'],
    ['Web', 'https://www.canva.com/'] ] },
];

const APPS_IA = [
  { nombre: 'Gemini', logo: 'gemini', txt: '✦', links: [
    ['App Store', 'https://apps.apple.com/us/app/google-gemini/id6477489729'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.google.android.apps.bard'],
    ['Web', 'https://gemini.google.com/'] ] },
  { nombre: 'ChatGPT', logo: 'chatgpt', txt: 'AI', links: [
    ['App Store', 'https://apps.apple.com/us/app/chatgpt/id6448311069'],
    ['Play Store', 'https://play.google.com/store/apps/details?id=com.openai.chatgpt'],
    ['Web', 'https://chatgpt.com/'] ] },
  { nombre: 'ElevenLabs', logo: 'elevenlabs', txt: '11', desc: 'Para generar audio.', links: [
    ['Web', 'https://join.elevenlabs.io/es'] ] },
  { nombre: 'Higgsfield', logo: 'higgsfield', txt: 'H', desc: 'Producción de video pro con IA.', links: [
    ['Web', 'https://higgsfield.ai/'] ] },
];

const FORMATOS = [
  { nombre: 'Hablando a cámara (Talking head)', ve: 'La persona habla directamente a la cámara explicando algo.', usar: 'Explicar ideas, consejos, historias o anuncios.' },
  { nombre: 'B-roll con narración', ve: 'Se muestran clips del producto, proceso o experiencia mientras alguien narra.', usar: 'Mostrar productos, servicios o experiencias.' },
  { nombre: 'Proceso + historia (Hands / proceso)', ve: 'Se muestra un proceso mientras alguien cuenta algo.', usar: 'Contenido relajado, storytelling o educativo.' },
  { nombre: 'Inteligencia artificial (avatar / voice AI)', ve: 'El video se genera con IA o usa voz generada narrando clips.', usar: 'Cuando no quieres grabarte o quieres escalar contenido.' },
  { nombre: 'Experiencia / POV', ve: 'Se graba como si el espectador estuviera viviendo la experiencia.', usar: 'Mostrar visitas, servicios, eventos o lugares.' },
];
const HORIZONTES = ['var(--adq)', 'var(--con)', 'var(--conv)', '#C0F800', 'var(--navy)'];

const CHECK_EDICION = ['1️⃣ Cortar silencios', '2️⃣ Agregar subtítulos', '3️⃣ Zoom ligero en partes importantes', '4️⃣ Música suave (opcional)'];

function renderChecklist(){
  const items = (lista) => lista.map((t) => `<label class="check-item"><input type="checkbox"><span>${escHtml(t)}</span></label>`).join('');
  return `
    <div class="etapa-box guion"><h2 class="etapa-title">Guion</h2><div class="check-grid">${items(CHECK_GUION)}</div></div>
    <div class="etapa-box grabacion"><h2 class="etapa-title">Grabación</h2><div class="check-grid">${items(CHECK_GRABACION)}</div></div>
    <div class="etapa-box edicion"><h2 class="etapa-title">✂️ Edición</h2><p class="etapa-desc" style="margin:0;">No necesitas efectos complejos. Solo estas 4 cosas:</p><div class="check-grid">${items(CHECK_EDICION)}</div></div>
    <div class="dur-panel">
      <span class="dur-pill-white">⏱️ Duración recomendada</span>
      <span class="dur-pill-dark">Ads: 15–30 seg</span>
      <span class="dur-pill-dark">Orgánico: 20–60 seg</span>
    </div>`;
}

function tarjetasApps(lista){
  return `<div class="cards-grid">${lista.map((a, i) => `
    <div class="item-card" style="--horizon:${HORIZONTES[i % HORIZONTES.length]}">
      <div class="app-head"><div class="app-logo app-logo-${a.logo}">${escHtml(a.txt)}</div><div class="app-nombre">${escHtml(a.nombre)}</div></div>
      ${a.desc ? `<p class="app-desc">${escHtml(a.desc)}</p>` : ''}
      <div class="app-links">${a.links.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${escHtml(t)}</a>`).join('')}</div>
    </div>`).join('')}</div>`;
}

function renderApps(){
  return `${tarjetasApps(APPS)}
    <div class="apps-titulo">📱 Apps para editar con IA</div>${tarjetasApps(APPS_IA)}`;
}

function renderTipos(){
  return `<p class="seccion-intro">Elige el formato según lo que quieras lograr con el video.</p>
    <div class="cards-grid">${FORMATOS.map((f, i) => `
      <div class="item-card" style="--horizon:${HORIZONTES[i % HORIZONTES.length]}">
        <h3 class="item-title">${escHtml(f.nombre)}</h3>
        <div class="res-dato"><span>Cómo se ve</span><p>${escHtml(f.ve)}</p></div>
        <div class="res-dato"><span>Cuándo usarlo</span><p>${escHtml(f.usar)}</p></div>
      </div>`).join('')}</div>`;
}

// ─── MÓDULOS siempre abiertos (sin botones): Checklist · Apps · Tipos de grabación ───
function renderContenido(){
  $('content').innerHTML = `
    <section class="seccion"><h2 class="seccion-h">📋 Checklist antes de grabar</h2>${renderChecklist()}</section>
    <section class="seccion"><h2 class="seccion-h">📱 Apps para editar</h2>${renderApps()}</section>
    <section class="seccion"><h2 class="seccion-h">🎥 Tipos de grabación que mejor funcionan</h2>${renderTipos()}</section>`;
}

// ─── BUSCADOR: modo Guía (chat con memoria) o Crear imagen ─────────────────
let modo = 'guia';
let chatMessages = [];
let chatBusy = false;
let imggenBusy = false;
let imggenUsadas = null;
let imggenLimite = 15;

const SUGERENCIAS = {
  guia: [
    { txt: '🎥 Guíame antes de grabar', msg: 'Voy a grabar un video, guíame con el checklist antes de grabar.', enviar: true },
    { txt: '¿Qué formato me conviene?', msg: '¿Qué tipo de grabación me conviene según lo que quiero lograr?', enviar: true },
    { txt: '📝 Revisa mi guion o video', ayuda: 'Pega aquí tu guion o la descripción de tu video y presiona enviar para recibir feedback.' },
  ],
  imagen: [
    { txt: 'Foto de producto', msg: 'Foto de producto sobre fondo neutro, luz natural, estilo minimalista' },
    { txt: 'Miniatura de video', msg: 'Miniatura llamativa para un video, con espacio para el título, colores vivos' },
    { txt: 'Imagen para un post', msg: 'Imagen para un post de Instagram, estilo limpio y moderno' },
  ],
};

function placeholderActual(){
  if (modo === 'guia') {
    return esMovil()
      ? 'Soy tu guía para grabar. Pregúntame o pega tu guion…'
      : 'Soy tu guía: antes de grabar revisa el checklist y las mejores herramientas de IA para hacerlo… Pregúntame, o pega tu guion o la descripción de tu video y te doy feedback.';
  }
  return esMovil()
    ? `Describe la imagen que necesitas… (máx. ${imggenLimite} al día por marca)`
    : `Describe la imagen que necesitas (para un post, un anuncio, una miniatura) y la IA la genera. Límite de ${imggenLimite} imágenes al día por marca.`;
}

// Con el cuadro vacío, la altura se mide con el texto de ayuda (placeholder) para que se lea completo.
function alturaPlaceholder(el){
  const cs = getComputedStyle(el);
  const m = document.createElement('div');
  m.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:break-word;' +
    `width:${el.clientWidth}px;font-family:${cs.fontFamily};font-size:${cs.fontSize};line-height:${cs.lineHeight};padding:${cs.padding};`;
  m.textContent = el.placeholder || ' ';
  document.body.appendChild(m);
  const h = m.offsetHeight;
  m.remove();
  return h;
}
function autoAlto(){
  const el = $('chat-input');
  el.style.height = 'auto';
  // +2px: scrollHeight redondea hacia abajo y sin ese margen asoma una mini barra de scroll.
  const tope = el.value ? 150 : 260;
  const alto = (el.value ? el.scrollHeight : alturaPlaceholder(el)) + 2;
  el.style.height = Math.min(alto, tope) + 'px';
  el.style.overflowY = alto > tope ? 'auto' : 'hidden';
}

function setStatus(texto, error){
  const el = $('chat-status');
  el.className = 'mode-status' + (error ? ' error' : '');
  el.textContent = texto || '';
}

function setBusy(v){
  $('chat-send-btn').disabled = v;
}

function pintarSugerencias(){
  const box = $('sugerencias');
  const hayContenido = modo === 'guia' ? chatMessages.length > 0 : !!$('imggen-result').children.length;
  if (hayContenido) { box.innerHTML = ''; return; }
  box.innerHTML = SUGERENCIAS[modo].map((s, i) => `<button type="button" class="sugerencia" data-i="${i}">${escHtml(s.txt)}</button>`).join('');
  box.querySelectorAll('.sugerencia').forEach((b) => {
    b.addEventListener('click', () => {
      const s = SUGERENCIAS[modo][+b.dataset.i];
      if (s.enviar) { enviarMensajeChat(s.msg); return; }
      const el = $('chat-input');
      if (s.ayuda) { el.value = ''; el.placeholder = s.ayuda; autoAlto(); el.focus(); return; }  // sin mensaje automático
      el.value = s.msg; autoAlto(); el.focus();
    });
  });
}

function setModo(m){
  modo = m;
  document.querySelectorAll('.modo-pill').forEach((p) => p.classList.toggle('on', p.dataset.modo === m));
  $('chat-input').placeholder = placeholderActual();
  $('chat-thread').style.display = m === 'guia' ? '' : 'none';
  $('imggen-result').style.display = m === 'imagen' ? '' : 'none';
  $('chat-reset-btn').style.display = (m === 'guia' && chatMessages.length) ? '' : 'none';
  setStatus(m === 'imagen' && imggenUsadas != null ? `${imggenUsadas}/${imggenLimite} usadas hoy` : '');
  autoAlto();
  pintarSugerencias();
}
document.querySelectorAll('.modo-pill').forEach((p) => p.addEventListener('click', () => setModo(p.dataset.modo)));

// ── Guía (chat con memoria) ──
function pintarChatThread(){
  const box = $('chat-thread');
  $('chat-reset-btn').style.display = (modo === 'guia' && chatMessages.length) ? '' : 'none';
  pintarSugerencias();
  if (!chatMessages.length) { box.innerHTML = ''; return; }
  box.innerHTML = chatMessages.map((m) => {
    if (m.role === 'user') return `<div class="chat-msg chat-msg-user">${escHtml(m.content)}</div>`;
    return `<div class="chat-msg chat-msg-assistant">${escHtml(m.content)}</div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function persistirConversacion(){
  window.storage.set(CONVERSACION_KEY, JSON.stringify(chatMessages)).catch(() => {});
}

async function llamarAgente(){
  chatBusy = true; setBusy(true);
  setStatus('⏳ Leyendo tu ADN para responderte...');
  try {
    const response = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agente: 'diseno', messages: chatMessages, cliente: CLIENTE_ID }),
    });
    const data = await response.json();
    if (!response.ok) chatMessages.push({ role: 'assistant', content: '⚠️ ' + (data.error || 'No se pudo generar respuesta. Intenta de nuevo.') });
    else chatMessages.push({ role: 'assistant', content: data.text });
  } catch (err) {
    chatMessages.push({ role: 'assistant', content: '⚠️ Hubo un error de conexión. Intenta de nuevo en un momento.' });
  } finally {
    chatBusy = false; setBusy(false); setStatus('');
    pintarChatThread();
    persistirConversacion();
  }
}

function enviarMensajeChat(textoDirecto){
  if (chatBusy) return;
  const el = $('chat-input');
  const texto = (typeof textoDirecto === 'string' ? textoDirecto : el.value).trim();
  if (!texto) { setStatus('⚠️ Escribe tu mensaje primero.', true); return; }
  chatMessages.push({ role: 'user', content: texto });
  if (typeof textoDirecto !== 'string') { el.value = ''; autoAlto(); }
  pintarChatThread();
  llamarAgente();
}

$('chat-reset-btn').addEventListener('click', () => {
  chatMessages = [];
  pintarChatThread();
  persistirConversacion();
});

// ── Crear imagen ──
function mensajeErrorImagen(e){
  if (/OPENAI_API_KEY/i.test(e || '')) return 'La creación de imágenes todavía no está activada en este hub (falta conectar el servicio de IA de imágenes).';
  return e || 'No se pudo generar la imagen. Intenta de nuevo.';
}

async function generarImagen(){
  if (imggenBusy) return;
  const el = $('chat-input');
  const prompt = el.value.trim();
  if (!prompt) { setStatus('⚠️ Describe primero la imagen que necesitas.', true); return; }
  const galeria = $('imggen-result');

  imggenBusy = true; setBusy(true);
  setStatus('⏳ Generando imagen… puede tardar unos segundos.');
  const spinnerId = 'imggen-spin-' + Date.now();
  galeria.insertAdjacentHTML('afterbegin', `<div class="imggen-spinner" id="${spinnerId}">Generando imagen...</div>`);
  pintarSugerencias();

  try {
    const response = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agente: 'diseno-imagen', prompt, cliente: CLIENTE_ID }),
    });
    const data = await response.json();
    document.getElementById(spinnerId)?.remove();
    if (!response.ok) {
      setStatus('⚠️ ' + mensajeErrorImagen(data.error), true);
    } else {
      const card = document.createElement('div');
      card.className = 'imggen-card';
      card.innerHTML = `<img src="${data.image}" alt="${escHtml(prompt)}">
        <p class="imggen-prompt">${escHtml(prompt)}</p>
        <a class="imggen-download" href="${data.image}" download="imagen-${Date.now()}.png">Descargar</a>`;
      galeria.insertAdjacentElement('afterbegin', card);
      if (typeof data.usadasHoy === 'number') {
        imggenUsadas = data.usadasHoy;
        imggenLimite = data.limiteDiario || imggenLimite;
        $('chat-input').placeholder = placeholderActual();
        setStatus(`✅ Imagen lista · ${imggenUsadas}/${imggenLimite} usadas hoy`);
      } else {
        setStatus('✅ Imagen lista');
      }
    }
  } catch (err) {
    document.getElementById(spinnerId)?.remove();
    setStatus('⚠️ Hubo un error de conexión. Intenta de nuevo en un momento.', true);
  } finally {
    imggenBusy = false; setBusy(false);
    pintarSugerencias();
  }
}

function enviarDelBuscador(){ return modo === 'guia' ? enviarMensajeChat() : generarImagen(); }
$('chat-send-btn').addEventListener('click', enviarDelBuscador);
$('chat-input').addEventListener('input', autoAlto);
$('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarDelBuscador(); }
});
window.addEventListener('resize', () => { $('chat-input').placeholder = placeholderActual(); autoAlto(); });

async function cargarConversacion(){
  try {
    const r = await window.storage.get(CONVERSACION_KEY);
    const guardado = r && r.value ? JSON.parse(r.value) : [];
    // Antes el atajo "Revisa mi guion o video" mandaba este mensaje solo; se quita de lo ya guardado.
    const AUTOMATICO = 'Te voy a pegar un guion para que me des feedback.';
    const limpio = [];
    for (let i = 0; i < guardado.length; i++) {
      const m = guardado[i];
      if (m && m.role === 'user' && m.content === AUTOMATICO) {
        if (guardado[i + 1] && guardado[i + 1].role === 'assistant') i++;
        continue;
      }
      limpio.push(m);
    }
    if (limpio.length !== guardado.length) { chatMessages = limpio; persistirConversacion(); }
    if (Array.isArray(limpio) && limpio.length > 0) {
      chatMessages = limpio;
      pintarChatThread();
    }
  } catch (e) {}
}

/* ─── INIT ─── */
renderContenido();
setModo('guia');
pintarChatThread();
cargarConversacion();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(autoAlto);
</script>
