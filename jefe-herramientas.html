<style>
  :root{
    /* Piel clara = mismos tokens que Jefe Productor IA, Jefe 366, Contenido y Anuncios */
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F3F3F3;
    --line:#E2E2E2;
    --text:#1A1A1A;
    --text-dim:#5F5F5F;
    --accent:#C0F800;
    --accent-soft:#F1FFC2;
    --accent-text:#4E7A00;
    --navy:#10103A;
    --shadow-card:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06);
    --adq:#6366F1;
    --con:#0EA5E9;
    --conv:#16A34A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;padding:28px 16px 80px;}
  h1,h2,.display{font-family:'Sora',sans-serif;}
  .wrap{max-width:1400px;margin:0 auto;}
  .page-header{text-align:center;padding-top:62px;}
  h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin:0 0 8px;line-height:1.15;}
  /* Barra fija: se queda visible arriba al hacer scroll (pill + nombre del Jefe) */
  .topbar{position:fixed;top:0;left:0;right:0;height:70px;z-index:60;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);}
  .topbar h1{justify-self:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:clamp(20px,2.6vw,28px);}
  .back-link{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;color:var(--text-dim);text-decoration:none;padding:7px 16px;border:1px solid var(--line);border-radius:100px;background:var(--surface);transition:.15s;}
  .back-link:hover{border-color:var(--accent);color:var(--accent-text);}
  /* Scrollbar delgada y discreta */
  *{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.22) transparent;}
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:8px;}
  *::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.36);}

  /* HERO */
  .hero-logo{display:block;height:120px;width:auto;margin:0 auto 14px;}
  .seccion-intro{color:var(--text-dim);font-size:16px;margin:0 auto 20px;max-width:640px;text-align:center;line-height:1.55;}

  /* BARRA SUPERIOR: vista + edición */
  .edit-bar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 30px;}
  .view-switch{display:inline-flex;background:var(--surface-2);border-radius:100px;padding:4px;gap:2px;}
  .view-switch button{border:none;background:transparent;font-family:'Sora',sans-serif;font-weight:800;font-size:13.5px;padding:8px 16px;border-radius:100px;cursor:pointer;color:#333;transition:.15s;}
  .view-switch button:hover{background:#E8E8E8;}
  .view-switch button.on{background:var(--accent);color:#1A1A1A;}
  .btn-outline{font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;padding:10px 18px;border-radius:100px;cursor:pointer;border:1px solid #CFCFCF;background:var(--surface);color:#333;transition:.15s;}
  .btn-outline:hover{border-color:var(--accent-text);color:var(--accent-text);background:var(--accent-soft);}
  .btn-solid{font-family:'Sora',sans-serif;font-weight:800;font-size:14px;padding:11px 24px;border-radius:100px;cursor:pointer;border:none;background:var(--accent);color:#1A1A1A;transition:.15s;}
  .btn-solid:hover{filter:brightness(.95);}
  .btn-solid:disabled{opacity:.5;cursor:wait;}
  .btn-danger{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;padding:7px 14px;border-radius:100px;cursor:pointer;border:1px solid #F0C4C4;background:#fff;color:#B42318;transition:.15s;}
  .btn-danger:hover{background:#FEF3F2;}
  .edit-status{font-size:14.5px;color:var(--text-dim);}
  .edit-status.error{color:#C62828;}
  .edit-status.ok{color:var(--accent-text);}

  /* SECCIONES */
  .seccion{margin:0 0 46px;}
  .seccion-h{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(22px,3vw,28px);margin:0 0 18px;}
  .seccion-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px;}
  .seccion-top .seccion-h{margin:0;}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:18px;align-items:start;}
  .cards-grid.edit{grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));}
  .item-card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--horizon,var(--adq));border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-card);}

  /* LOGOS */
  .app-head{display:flex;align-items:center;gap:12px;}
  .app-desc{margin:-4px 0 0;font-size:14.5px;color:var(--text-dim);line-height:1.4;}
  /* Logos (img/apps/*.png). Los transparentes (glifo) llevan marco blanco; los de tarjeta completa llenan el cuadro. */
  .app-logo-img{width:40px;height:40px;border-radius:11px;flex-shrink:0;object-fit:cover;display:block;}
  .app-logo-img.glifo{object-fit:contain;padding:6px;background:#fff;border:1px solid var(--line);}
  .app-logo-emoji{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--accent-soft);border:1px solid #CDE98A;}
  .app-logo-img.lg,.app-logo-emoji.lg{width:80px;height:80px;border-radius:20px;}
  .app-logo-img.xl,.app-logo-emoji.xl{width:104px;height:104px;border-radius:26px;box-shadow:0 10px 26px rgba(0,0,0,.28);}
  .app-logo-img.glifo.lg,.app-logo-img.glifo.xl{padding:14px;}
  .app-logo-emoji.lg{font-size:40px;}
  .app-logo-emoji.xl{font-size:54px;}
  .app-links{display:flex;gap:8px;flex-wrap:wrap;}
  .app-links a{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;padding:8px 16px;border-radius:100px;border:1px solid #CFCFCF;background:var(--surface);color:#333;text-decoration:none;transition:.15s;}
  .app-links a:hover{border-color:var(--accent-text);color:var(--accent-text);background:var(--accent-soft);}

  /* VISTA "TARJETAS" (estilo App Store · Hoy) */
  .today-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:20px;}
  .today-card{display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-card);}
  .today-cover{position:relative;min-height:300px;padding:14px 16px 18px;color:var(--ink,#fff);background:linear-gradient(165deg,var(--c1),var(--c2));display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;}
  .today-cover::before{content:'';position:absolute;width:230px;height:230px;border-radius:50%;right:-80px;top:-70px;background:rgba(255,255,255,.14);}
  .today-cover::after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;left:-60px;bottom:70px;background:rgba(0,0,0,.10);}
  .today-tag{position:relative;z-index:1;align-self:flex-start;background:rgba(255,255,255,.94);color:#1A1A1A;font-family:'Sora',sans-serif;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px 11px;border-radius:8px;}
  .today-icon{position:relative;z-index:1;align-self:center;margin:8px 0;}
  .today-title{position:relative;z-index:1;font-family:'Sora',sans-serif;font-weight:800;font-size:23px;line-height:1.15;}
  .today-title small{display:block;font:600 12px 'Inter',sans-serif;opacity:.88;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
  .today-foot{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;flex:1;}
  .today-desc{margin:0;font-size:14.5px;color:var(--text-dim);line-height:1.4;min-height:2.8em;}
  .today-foot .app-links a{background:var(--surface-2);border:none;color:#0A5BD8;text-transform:uppercase;font-size:12.5px;letter-spacing:.04em;font-weight:800;padding:8px 16px;}
  .today-foot .app-links a:hover{background:var(--accent-soft);color:var(--accent-text);}

  /* VISTA "ÍCONOS" (cuadrícula de apps) */
  .icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:20px 12px;}
  .icon-tile{display:flex;flex-direction:column;align-items:center;gap:9px;background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;padding:10px 6px;border-radius:20px;transition:.15s;}
  .icon-tile:hover{background:var(--surface-2);transform:translateY(-2px);}
  .icon-tile .app-logo-img,.icon-tile .app-logo-emoji{box-shadow:0 4px 14px rgba(0,0,0,.14);}
  .icon-name{font-size:14px;font-weight:600;color:var(--text);text-align:center;line-height:1.25;}

  /* VENTANA al tocar un ícono */
  .modal-back{position:fixed;inset:0;z-index:80;background:rgba(10,10,20,.5);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
  .modal-box{position:relative;width:min(340px,100%);}
  .modal-box .today-card{box-shadow:0 12px 32px rgba(0,0,0,.28);}
  .modal-x{position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:#1A1A1A;font-size:16px;cursor:pointer;}

  /* MODO EDICIÓN */
  .ed-in{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;padding:9px 12px;outline:none;}
  .ed-in:focus{border-color:var(--accent-text);background:#fff;box-shadow:0 0 0 3px rgba(192,248,0,.28);}
  .ed-nombre{font-family:'Sora',sans-serif;font-weight:800;font-size:16px;}
  .ed-titulo{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;max-width:520px;}
  .ed-link{display:grid;grid-template-columns:minmax(96px,.8fr) minmax(0,1.8fr) auto;gap:6px;align-items:center;}
  .ed-x{border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:16px;padding:6px 8px;border-radius:8px;}
  .ed-x:hover{color:#B42318;background:#FEF3F2;}
  .ed-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .ed-emoji{width:76px;flex:none;text-align:center;}
  input.ed-color{width:52px;height:38px;padding:2px;flex:none;cursor:pointer;}
  .add-app{border:2px dashed #CFCFCF;background:transparent;border-radius:18px;min-height:96px;color:var(--text-dim);font-family:'Inter',sans-serif;font-weight:700;font-size:15px;cursor:pointer;transition:.15s;}
  .add-app:hover{border-color:var(--accent-text);color:var(--accent-text);background:var(--accent-soft);}
  @media (max-width:520px){ .ed-link{grid-template-columns:1fr auto;} .ed-link input:nth-child(2){grid-column:1 / 2;} }
  /* Celular: las tarjetas se deslizan de lado, como en el App Store */
  @media (max-width:720px){
    .today-row{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 12px;gap:14px;}
    .today-row .today-card{flex:0 0 78vw;max-width:320px;scroll-snap-align:start;}
  }
</style>

<script>
const CLIENTE_ID = window.__hub.slug;
const KEY = CLIENTE_ID + ':herramientas-apps';
const VISTA_KEY = 'herramientas:vista';

function escHtml(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const $ = (id) => document.getElementById(id);
const clonar = (o) => JSON.parse(JSON.stringify(o));
// Solo http(s): lo demás (javascript:, data:...) se descarta. Sin esquema -> se asume https://
function urlSegura(u){
  u = (u || '').trim();
  if (!u) return '';
  if (/^https?:\/\//i.test(u)) return u;
  if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';
  return 'https://' + u;
}
const logoValido = (l) => typeof l === 'string' && /^[a-z0-9-]+$/.test(l);
const hexOk = (c) => typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c);

// ─── COLORES de las tarjetas ────────────────────────────────────────────────
const COLORES_DEF = ['#6366F1', '#0EA5E9', '#16A34A', '#F59E0B', '#10103A'];
function mezclar(hex, t, hacia){
  const n = parseInt(hex.slice(1), 16);
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.round(v + (hacia - v) * t).toString(16).padStart(2, '0')).join('');
}
function luz(hex){
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
}
function coloresDe(a, i){
  const c = hexOk(a.color) ? a.color : COLORES_DEF[i % COLORES_DEF.length];
  return { c1: c, c2: mezclar(c, 0.5, 0), ink: luz(c) > 0.62 ? '#1A1A1A' : '#FFFFFF' };
}

// logo = archivo en /img/apps/ · glifo = logo transparente (lleva marco blanco) · emoji = apps sin logo · color = tarjeta
const DEFAULTS = [
  { titulo: '💬 Apps para atender y vender', apps: [
    { nombre: 'WhatsApp Business', logo: 'whatsapp-business', color: '#25D366', desc: 'Para atender clientes, mandar catálogo y respuestas rápidas.', links: [
      ['App Store', 'https://apps.apple.com/us/app/whatsapp-business/id1386412985'],
      ['Play Store', 'https://play.google.com/store/apps/details?id=com.whatsapp.w4b'] ] },
    { nombre: 'Facebook', logo: 'facebook', color: '#1877F2', desc: 'Para publicar en tu página y responder mensajes y comentarios.', links: [
      ['App Store', 'https://apps.apple.com/us/app/facebook/id284882215'],
      ['Play Store', 'https://play.google.com/store/apps/details?id=com.facebook.katana'] ] },
    { nombre: 'Instagram', logo: 'instagram', color: '#D6249F', desc: 'Para subir historias, reels y publicaciones, y ver tus mensajes.', links: [
      ['App Store', 'https://apps.apple.com/us/app/instagram/id389801252'],
      ['Play Store', 'https://play.google.com/store/apps/details?id=com.instagram.android'] ] },
    { nombre: 'Anuncios de Facebook', logo: 'meta-ads', color: '#0A66FF', desc: 'Administrador de anuncios (Meta Ads): revisa y ajusta tus campañas.', links: [
      ['App Store', 'https://apps.apple.com/us/app/meta-ads-manager/id964397083'],
      ['Play Store', 'https://play.google.com/store/apps/details?id=com.facebook.adsmanager'] ] },
    { nombre: 'TikTok', logo: 'tiktok', color: '#161823', desc: 'Para publicar tus videos cortos y llegar a audiencia nueva.', links: [
      ['App Store', 'https://apps.apple.com/us/app/tiktok/id835599320'],
      ['Play Store', 'https://play.google.com/store/apps/details?id=com.zhiliaoapp.musically'] ] },
  ] },
  { titulo: '📱 Apps para editar', apps: [
    { nombre: 'CapCut', logo: 'capcut', glifo: true, color: '#2B2B2F', desc: 'Edita tus videos cortos con cortes, subtítulos y música.', links: [
      ['App Store', 'https://apps.apple.com/us/app/capcut-photo-video-editor/id1500855883'],
      ['Play Store', 'https://play.google.com/store/apps/details?id=com.lemon.lvoverseas'],
      ['Web', 'https://www.capcut.com/'] ] },
    { nombre: 'Edits (Instagram)', logo: 'edits', color: '#8B3DFF', desc: 'El editor de video de Instagram para tus reels.', links: [
      ['App Store', 'https://apps.apple.com/us/app/edits-an-instagram-app/id6738967378'],
      ['Play Store', 'https://play.google.com/store/apps/details?id=com.instagram.basel'] ] },
    { nombre: 'Canva', logo: 'canva', color: '#00A6C2', desc: 'Diseña posts, historias y portadas con plantillas.', links: [
      ['App Store', 'https://apps.apple.com/us/app/canva-ai-photo-video-editor/id897446215'],
      ['Play Store', 'https://play.google.com/store/apps/details?id=com.canva.editor'],
      ['Web', 'https://www.canva.com/'] ] },
  ] },
  { titulo: '✨ Apps para editar con IA', apps: [
    { nombre: 'Gemini', logo: 'gemini', glifo: true, color: '#4F7BF0', desc: 'Asistente de IA de Google para ideas, textos e imágenes.', links: [
      ['App Store', 'https://apps.apple.com/us/app/google-gemini/id6477489729'],
      ['Play Store', 'https://play.google.com/store/apps/details?id=com.google.android.apps.bard'],
      ['Web', 'https://gemini.google.com/'] ] },
    { nombre: 'ChatGPT', logo: 'chatgpt', glifo: true, color: '#10A37F', desc: 'Asistente de IA para escribir guiones, copys e ideas.', links: [
      ['App Store', 'https://apps.apple.com/us/app/chatgpt/id6448311069'],
      ['Play Store', 'https://play.google.com/store/apps/details?id=com.openai.chatgpt'],
      ['Web', 'https://chatgpt.com/'] ] },
    { nombre: 'ElevenLabs', logo: 'elevenlabs', glifo: true, color: '#1C1C1E', desc: 'Para generar audio.', links: [
      ['Web', 'https://join.elevenlabs.io/es'] ] },
    { nombre: 'Higgsfield', logo: 'higgsfield', color: '#C0F800', desc: 'Producción de video pro con IA.', links: [
      ['Web', 'https://higgsfield.ai/'] ] },
  ] },
];

const HORIZONTES = ['var(--adq)', 'var(--con)', 'var(--conv)', '#C0F800', 'var(--navy)'];

let secciones = clonar(DEFAULTS); // lo publicado (o lo guardado del hub)
let borrador = null;              // copia de trabajo mientras se edita
let editando = false;
let guardando = false;
let estado = { txt: '', tipo: '' };
let vista = 'tarjetas';           // 'tarjetas' | 'iconos'
try { if (localStorage.getItem(VISTA_KEY) === 'iconos') vista = 'iconos'; } catch (e) {}

// Acepta solo la forma esperada: lo demás se ignora y se usan los valores originales.
function normalizar(data){
  if (!Array.isArray(data)) return null;
  const out = data.filter(s => s && typeof s.titulo === 'string' && Array.isArray(s.apps)).map(s => ({
    titulo: s.titulo,
    apps: s.apps.filter(a => a && typeof a.nombre === 'string').map(a => {
      const o = { nombre: a.nombre, links: (Array.isArray(a.links) ? a.links : []).filter(l => Array.isArray(l) && typeof l[0] === 'string' && typeof l[1] === 'string').map(l => [l[0], l[1]]) };
      if (typeof a.desc === 'string' && a.desc) o.desc = a.desc;
      if (hexOk(a.color)) o.color = a.color;
      if (logoValido(a.logo)) { o.logo = a.logo; if (a.glifo) o.glifo = true; }
      else o.emoji = typeof a.emoji === 'string' && a.emoji ? a.emoji : '🧩';
      return o;
    }),
  }));
  return out.length ? out : null;
}

// ─── VISTA ──────────────────────────────────────────────────────────────────
function logoHtml(a, tam){
  const t = tam ? ' ' + tam : '';
  const px = tam === 'xl' ? 104 : tam === 'lg' ? 80 : 40;
  return logoValido(a.logo)
    ? `<img class="app-logo-img${a.glifo ? ' glifo' : ''}${t}" src="/img/apps/${a.logo}.png" alt="${escHtml(a.nombre)}" width="${px}" height="${px}" loading="lazy">`
    : `<div class="app-logo-emoji${t}" aria-hidden="true">${escHtml(a.emoji || '🧩')}</div>`;
}

const sinEmoji = (t) => (t || '').replace(/^[^\p{L}\p{N}]+/u, '').trim();

function linksHtml(a){
  const links = a.links.map(([t, u]) => [t, urlSegura(u)]).filter(([t, u]) => t.trim() && u);
  return `<div class="app-links">${links.map(([t, u]) => `<a href="${escHtml(u)}" target="_blank" rel="noopener">${escHtml(t)}</a>`).join('')}</div>`;
}

// Tarjeta grande estilo "Hoy" del App Store: portada de color, ícono, nombre y botones
function tarjetaHoy(a, i, seccion){
  const c = coloresDe(a, i);
  const tiendas = a.links.filter(l => l[0].trim() && urlSegura(l[1])).map(l => l[0].trim()).join(' · ');
  return `<article class="today-card">
    <div class="today-cover" style="--c1:${c.c1};--c2:${c.c2};--ink:${c.ink}">
      <span class="today-tag">${escHtml(sinEmoji(seccion))}</span>
      <div class="today-icon">${logoHtml(a, 'xl')}</div>
      <div class="today-title">${tiendas ? `<small>${escHtml(tiendas)}</small>` : ''}${escHtml(a.nombre)}</div>
    </div>
    <div class="today-foot">
      ${a.desc ? `<p class="today-desc">${escHtml(a.desc)}</p>` : ''}
      ${linksHtml(a)}
    </div>
  </article>`;
}

function seccionVista(s, si){
  const cuerpo = vista === 'iconos'
    ? `<div class="icon-grid">${s.apps.map((a, ai) => `<button class="icon-tile" type="button" data-act="abrir" data-s="${si}" data-a="${ai}">${logoHtml(a, 'lg')}<span class="icon-name">${escHtml(a.nombre)}</span></button>`).join('')}</div>`
    : `<div class="today-row">${s.apps.map((a, ai) => tarjetaHoy(a, ai, s.titulo)).join('')}</div>`;
  return `<section class="seccion"><h2 class="seccion-h">${escHtml(s.titulo)}</h2>${cuerpo}</section>`;
}

function abrirApp(si, ai){
  const s = secciones[si], a = s && s.apps[ai];
  if (!a) return;
  $('modal').innerHTML = `<div class="modal-back" data-act="cerrar-fondo"><div class="modal-box">
    <button class="modal-x" type="button" data-act="cerrar" aria-label="Cerrar">✕</button>${tarjetaHoy(a, ai, s.titulo)}</div></div>`;
}
const cerrarApp = () => { $('modal').innerHTML = ''; };

// ─── EDICIÓN ────────────────────────────────────────────────────────────────
function tarjetaEdicion(a, si, ai){
  const d = `data-s="${si}" data-a="${ai}"`;
  return `<div class="item-card" style="--horizon:${HORIZONTES[ai % HORIZONTES.length]}">
    <div class="app-head">${logoHtml(a)}<input class="ed-in ed-nombre" ${d} data-k="nombre" value="${escHtml(a.nombre)}" placeholder="Nombre de la app"></div>
    ${logoValido(a.logo) ? '' : `<div class="ed-row"><input class="ed-in ed-emoji" ${d} data-k="emoji" value="${escHtml(a.emoji || '🧩')}" maxlength="4" aria-label="Emoji"><span class="app-desc" style="margin:0">Ícono (emoji)</span></div>`}
    <div class="ed-row"><input class="ed-in ed-color" type="color" ${d} data-k="color" value="${hexOk(a.color) ? a.color : COLORES_DEF[ai % COLORES_DEF.length]}" aria-label="Color de la tarjeta"><span class="app-desc" style="margin:0">Color de la tarjeta</span></div>
    <input class="ed-in" ${d} data-k="desc" value="${escHtml(a.desc || '')}" placeholder="Descripción (opcional)">
    ${a.links.map((l, li) => `<div class="ed-link">
      <input class="ed-in" ${d} data-l="${li}" data-k="0" value="${escHtml(l[0])}" placeholder="Botón (ej. App Store)">
      <input class="ed-in" ${d} data-l="${li}" data-k="1" value="${escHtml(l[1])}" placeholder="https://…">
      <button class="ed-x" type="button" data-act="del-link" ${d} data-l="${li}" aria-label="Quitar enlace" title="Quitar enlace">✕</button>
    </div>`).join('')}
    <div class="ed-row">
      <button class="btn-outline" type="button" data-act="add-link" ${d}>+ Enlace</button>
      <button class="btn-danger" type="button" data-act="del-app" ${d}>Quitar app</button>
    </div>
  </div>`;
}

function seccionEdicion(s, si){
  return `<section class="seccion">
    <div class="seccion-top">
      <input class="ed-in ed-titulo" data-s="${si}" data-k="titulo" value="${escHtml(s.titulo)}" placeholder="Título de la sección">
      <button class="btn-danger" type="button" data-act="del-sec" data-s="${si}">Quitar sección</button>
    </div>
    <div class="cards-grid edit">
      ${s.apps.map((a, ai) => tarjetaEdicion(a, si, ai)).join('')}
      <button class="add-app" type="button" data-act="add-app" data-s="${si}">+ Agregar app</button>
    </div>
  </section>`;
}

function render(){
  $('content').innerHTML = editando
    ? borrador.map((s, si) => seccionEdicion(s, si)).join('') + `<button class="btn-outline" type="button" data-act="add-sec">+ Agregar sección</button>`
    : secciones.map((s, si) => seccionVista(s, si)).join('');
  const st = `<span class="edit-status ${estado.tipo}">${escHtml(estado.txt)}</span>`;
  $('edit-bar').innerHTML = editando
    ? `<button class="btn-solid" type="button" data-act="guardar"${guardando ? ' disabled' : ''}>💾 Guardar cambios</button>
       <button class="btn-outline" type="button" data-act="cancelar">Cancelar</button>
       <button class="btn-outline" type="button" data-act="restaurar">Restaurar originales</button>${st}`
    : `<div class="view-switch" role="group" aria-label="Vista">
         <button type="button" data-act="vista" data-v="tarjetas" class="${vista === 'tarjetas' ? 'on' : ''}">▭ Tarjetas</button>
         <button type="button" data-act="vista" data-v="iconos" class="${vista === 'iconos' ? 'on' : ''}">▦ Íconos</button>
       </div>
       <button class="btn-outline" type="button" data-act="editar">✏️ Editar apps</button>${st}`;
}

// Al guardar: sin nombres vacíos ni enlaces vacíos, y solo URLs http(s).
function limpiarBorrador(){
  return borrador.map(s => ({
    titulo: s.titulo.trim() || 'Sección',
    apps: s.apps.filter(a => a.nombre.trim()).map(a => {
      const o = { nombre: a.nombre.trim(), links: a.links.map(l => [l[0].trim(), urlSegura(l[1])]).filter(l => l[0] && l[1]) };
      if (a.desc && a.desc.trim()) o.desc = a.desc.trim();
      if (hexOk(a.color)) o.color = a.color;
      if (logoValido(a.logo)) { o.logo = a.logo; if (a.glifo) o.glifo = true; }
      else o.emoji = (a.emoji || '').trim() || '🧩';
      return o;
    }),
  }));
}

async function guardar(){
  guardando = true; estado = { txt: 'Guardando…', tipo: '' }; render();
  const limpio = limpiarBorrador();
  try {
    await window.storage.set(KEY, JSON.stringify(limpio));
    secciones = limpio; editando = false; borrador = null;
    estado = { txt: '✅ Guardado', tipo: 'ok' };
  } catch (e) {
    estado = { txt: 'No se pudo guardar (revisa el token de acceso e inténtalo de nuevo).', tipo: 'error' };
  }
  guardando = false; render();
}

document.addEventListener('input', (e) => {
  const t = e.target;
  if (!editando || !t.classList || !t.classList.contains('ed-in')) return;
  const { s, a, l, k } = t.dataset;
  const sec = borrador[+s];
  if (a === undefined) sec[k] = t.value;
  else if (l !== undefined) sec.apps[+a].links[+l][+k] = t.value;
  else sec.apps[+a][k] = t.value;
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarApp(); });

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const { act, s, a, l, v } = b.dataset;
  if (act === 'cerrar-fondo') { if (e.target === b) cerrarApp(); return; }
  if (act === 'cerrar') { cerrarApp(); return; }
  if (act === 'abrir') { abrirApp(+s, +a); return; }
  if (act === 'vista') { vista = v; try { localStorage.setItem(VISTA_KEY, v); } catch (x) {} }
  else if (act === 'editar') { borrador = clonar(secciones); editando = true; estado = { txt: '', tipo: '' }; }
  else if (act === 'cancelar') { editando = false; borrador = null; estado = { txt: '', tipo: '' }; }
  else if (act === 'restaurar') {
    if (!confirm('¿Volver a la lista original? Se pierden tus cambios al guardar.')) return;
    borrador = clonar(DEFAULTS);
  }
  else if (act === 'guardar') { guardar(); return; }
  else if (act === 'add-app') borrador[+s].apps.push({ nombre: '', emoji: '🧩', color: COLORES_DEF[borrador[+s].apps.length % COLORES_DEF.length], links: [['App Store', ''], ['Play Store', '']] });
  else if (act === 'del-app') borrador[+s].apps.splice(+a, 1);
  else if (act === 'add-link') borrador[+s].apps[+a].links.push(['', '']);
  else if (act === 'del-link') borrador[+s].apps[+a].links.splice(+l, 1);
  else if (act === 'add-sec') borrador.push({ titulo: '📌 Nueva sección', apps: [] });
  else if (act === 'del-sec') {
    if (borrador[+s].apps.length && !confirm('¿Quitar la sección y todas sus apps?')) return;
    borrador.splice(+s, 1);
  }
  else return;
  render();
});

render();
// Carga lo guardado de este hub (si existe); si no, quedan las originales.
(async function(){
  try {
    const r = await window.storage.get(KEY);
    const guardado = r && r.value ? normalizar(JSON.parse(r.value)) : null;
    if (guardado && !editando) { secciones = guardado; render(); }
  } catch (e) {}
})();
</script>
<script src="/js/jefes-nav.js" defer></script>
</body>
</html>
